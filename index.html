لسعر الذي تم استلامه لبيع التزام تجاه منظمة أخرى"},{"key":"D","letter":"د","text":"السعر المدفوع لتسوية التزام اتجاه منظمة أخرى"}],"explanation":"أ. خطأ لأنه القيمة العادلة لا تُعرّف فقط بسعر بيع الأصل بشكل عام.\n\nب. خطأ لأنه لا يمثل تعريفًا مباشرًا للقيمة العادلة.\n\nج. خطأ لأنه لا يتم عادة “بيع الالتزامات” بهذا الشكل كمفهوم قياسي.\n\nد. صحيح لأنه القيمة العادلة للالتزام تمثل السعر الذي يتم دفعه لتسويته أو تحويله في معاملة منظمة.","oldQNumber":"127","bankIndex":173,"setId":"set3"},{"id":"332","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"A","question":"أي مما يلي هو المحفز الأكثر احتمالًا للتأثير على مستوى الرضا الوظيفي في المنظمة؟","options":[{"key":"A","letter":"أ","text":"إمكانات النمو."},{"key":"B","letter":"ب","text":"السياسات التنظيمية."},{"key":"C","letter":"ج","text":"حزمة الراتب."},{"key":"D","letter":"د","text":"الأمن الوظيفي."}],"explanation":"أ. صحيح لأنه إمكانات النمو ترتبط بعوامل التحفيز التي تؤثر بشكل مباشر على الرضا الوظيفي وتطوير الموظف.\n\nب. خطأ لأنه السياسات التنظيمية تُعد من عوامل النظافة التي قد تسبب عدم الرضا إذا كانت سيئة لكنها لا تُحفّز الرضا بشكل أساسي.\n\nج. خطأ لأنه حزمة الراتب من عوامل النظافة وليست من المحفزات الأساسية للرضا الوظيفي.\n\nد. خطأ لأنه الأمن الوظيفي أيضًا من عوامل النظافة التي تمنع عدم الرضا لكنها لا تولّد رضا مرتفع.","oldQNumber":"2","bankIndex":174,"setId":"set4"},{"id":"337","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"D","question":"متى يحتمل أن يكون الهيكل التنظيمي العضوي أكثر نجاحًا من الهيكل التنظيمي الآلي؟","options":[{"key":"A","letter":"أ","text":"عندما تتعرض المنظمة لضغوط سياسية واجتماعية قوية."},{"key":"B","letter":"ب","text":"عندما يكون للمؤسسة موردين وموارد موثوقين."},{"key":"C","letter":"ج","text":"عندما يكون لدى منظمة التصنيع طلب ثابت على منتجاتها."},{"key":"D","letter":"د","text":"عندما تتأثر المنظمة بشكل غير منتظم بالتقدم التكنولوجي."}],"explanation":"أ. خطأ لأنه الضغوط السياسية والاجتماعية لا ترتبط بشكل مباشر بتفضيل الهيكل العضوي مقابل الآلي.\n\nب. خطأ لأنه توفر الموردين والموارد لا يحدد نوع الهيكل التنظيمي المناسب.\n\nج. خطأ لأنه الطلب الثابت على المنتجات يناسب أكثر الهيكل الآلي المستقر.\n\nد. صحيح لأنه التغير غير المنتظم في التكنولوجيا يتطلب مرونة عالية واستجابة سريعة، وهو ما يوفره الهيكل العضوي.","oldQNumber":"7","bankIndex":175,"setId":"set4"},{"id":"342","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"C","question":"ما هو الخطر الأساسي المرتبط بتبني منظمة هيكل لامركزي؟","options":[{"key":"A","letter":"أ","text":"عدم القدرة على التكيف."},{"key":"B","letter":"ب","text":"تكاليف أكبر لوظيفة المراقبة."},{"key":"C","letter":"ج","text":"عدم الاتساق في صنع القرار."},{"key":"D","letter":"د","text":"قلة المرونة."}],"explanation":"أ. خطأ لأنه الهيكل اللامركزي عادةً يزيد القدرة على التكيف وليس يقللها.\n\nب. خطأ لأنه تكاليف المراقبة المرتفعة ترتبط أكثر بالهياكل المركزية.\n\nج. صحيح لأنه في اللامركزية قد تختلف القرارات بين الوحدات والمستويات، مما يؤدي إلى عدم الاتساق في اتخاذ القرار.\n\nد. خطأ لأنه اللامركزية تزيد المرونة وليس تقللها.","oldQNumber":"12","bankIndex":176,"setId":"set4"},{"id":"347","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"D","question":"حققت منظمة هدفها المتمثل في الحصول على 40٪ من حصة السوق المحلية، لكنها لم تتمكن من تحقيق عائد الاستثمار المطلوب والإنتاجية لكل ساعة عمل. بناءً على هذه المعلومات، من المرجح أن تركز المنظمة على أي مما يلي؟","options":[{"key":"A","letter":"أ","text":"الاستثمار الرأسمالي وليس التسويق"},{"key":"B","letter":"ب","text":"التسويق وليس الاستثمار الرأسمالي"},{"key":"C","letter":"ج","text":"الكفاءة وليس اقتصاد المدخلات"},{"key":"D","letter":"د","text":"الفعالية وليس الكفاءة"}],"explanation":"أ. خطأ لأنه الاستثمار الرأسمالي ليس هو المشكلة الرئيسية الظاهرة في السؤال.\n\nب. خطأ لأنه التسويق قد تحقق بالفعل بدليل الوصول إلى حصة السوق المستهدفة.\n\nج. خطأ لأنه الكفاءة (Efficiency) تعني استخدام الموارد بأقل تكلفة، بينما المشكلة هنا ليست فقط تكلفة المدخلات.\n\nد. صحيح لأنه المنظمة حققت الهدف (الفعالية) مثل حصة السوق، لكنها فشلت في الكفاءة مثل ROI والإنتاجية، لذلك تحتاج للتركيز على الكفاءة وليس الفعالية.","oldQNumber":"17","bankIndex":177,"setId":"set4"},{"id":"352","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي من الهياكل التنظيمية التالية يكون أقل رقابة على فريق العمل؟","options":[{"key":"A","letter":"أ","text":"التقسيمي"},{"key":"B","letter":"ب","text":"الافتراضي"},{"key":"C","letter":"ج","text":"الآلي"},{"key":"D","letter":"د","text":"الوظيفي"}],"explanation":"أ. خطأ لأنه الهيكل التقسيمي يحتوي على إدارة واضحة لكل وحدة وبالتالي توجد رقابة تنظيمية مستمرة.\n\nب. صحيح لأنه الهيكل الافتراضي يعتمد على فرق موزعة وغير مركزية مع اعتماد أقل على الرقابة المباشرة.\n\nج. خطأ لأنه الهيكل الآلي يتميز برقابة صارمة وإجراءات رسمية واضحة.\n\nد. خطأ لأنه الهيكل الوظيفي يعتمد على تسلسل هرمي ورقابة إشرافية مباشرة.","oldQNumber":"22","bankIndex":178,"setId":"set4"},{"id":"357","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"C","question":"قررت الإدارة تغيير الهيكل التنظيمي من هيكل كان لامركزيًا سابقًا إلى هيكل مركزي للغاية. وبالتالي: ما الذي يميز هذه المنظمة المركزية الآن؟","options":[{"key":"A","letter":"أ","text":"لا تقوم الإدارة العليا بمراقبة قليلة للقرارات المتخذة على المستويات الأدنى."},{"key":"B","letter":"ب","text":"تعتبر القرارات التي تتخذها الإدارة الدنيا مهمة جدًا."},{"key":"C","letter":"ج","text":"قلة القرارات التي تتخذ على مستويات أدنى في الهيكل التنظيمي."},{"key":"D","letter":"د","text":"يعتمد القليل من أقسام المنظمة على اتخاذ الإدارة العليا للقرارات."}],"explanation":"أ. خطأ لأنه في الهيكل المركزي تكون رقابة الإدارة العليا قوية وليست قليلة.\n\nب. خطأ لأنه في الهيكل المركزي تقل أهمية قرارات الإدارة الدنيا مقارنة بالمستويات العليا.\n\nج. صحيح لأنه في الهيكل المركزي تتركز عملية اتخاذ القرار في القمة، وبالتالي تقل القرارات المتخذة في المستويات الأدنى.\n\nد. خطأ لأنه في الهيكل المركزي تعتمد معظم الأقسام على قرارات الإدارة العليا وليس العكس.","oldQNumber":"27","bankIndex":179,"setId":"set4"},{"id":"362","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"A","question":"متى تكون شركة الاتصالات ملزمة بتلبية طلب العميل؟","options":[{"key":"A","letter":"أ","text":"بطلب من العميل الحالي أن تكشف الشركة عن كيفية استخدام معلوماته الشخصية"},{"key":"B","letter":"ب","text":"طلب عدم تتبع اتصالاته أو زياراته للصفحات الإلكترونية"},{"key":"C","letter":"ج","text":"طلب كشف تفصيلي بالمكالمات والمحادثات التي أجراها خلال 10 سنوات الماضية"},{"key":"D","letter":"د","text":"الطريقة التي تتبعها الشركة في استخدام البيانات"}],"explanation":"أ. صحيح لأنه يحق للعميل طلب الإفصاح عن كيفية استخدام بياناته الشخصية، ويكون على الشركة الالتزام بذلك وفق مبادئ حماية البيانات والشفافية.\n\nب. خطأ لأنه طلب عدم التتبع قد يكون مقيدًا بسياسات الشركة أو يتطلب موافقة مسبقة وليس التزامًا فوريًا دائمًا.\n\nج. خطأ لأنه طلب بيانات لمدة 10 سنوات غالبًا غير ملزم أو غير متاح قانونيًا بسبب سياسات الاحتفاظ بالبيانات.\n\nد. خطأ لأنه هذا يتعلق بسياسة عامة للشركة وليس طلبًا محددًا ملزمًا تجاه عميل واحد","oldQNumber":"32","bankIndex":180,"setId":"set4"},{"id":"367","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي من العبارات التالية المتعلقة بالهياكل التنظيمية يُعد صحيحًا؟","options":[{"key":"A","letter":"أ","text":"تميل المنظمات اللامركزية إلى وجود قواعد مكتوبة وإجراءات ثابتة ومستوى عالٍ من التوحيد."},{"key":"B","letter":"ب","text":"تميل المنظمات المركزية إلى أن تكون أكثر كفاءة وتتخذ قرارات أسرع."},{"key":"C","letter":"ج","text":"تميل المنظمات المركزية إلى وجود سيطرة أقل على مستوى الإدارة العليا."},{"key":"D","letter":"د","text":"تكون السلطة في المنظمات اللامركزية أكثر توزيعًا وتعتمد على معرفة المديرين الإقليميين."}],"explanation":"أ. خطأ لأنه اللامركزية لا تعتمد عادة على قواعد صارمة وتوحيد عالي، بل على مرونة أكبر.\n\nب. خطأ لأنه رغم أن المركزية قد تسهم في سرعة القرار، إلا أنها ليست دائمًا الأكثر كفاءة بشكل مطلق.\n\nج. خطأ لأنه المنظمات المركزية تتميز بسيطرة أعلى للإدارة العليا وليس أقل.\n\nد. صحيح لأنه في اللامركزية يتم توزيع السلطة على المستويات المختلفة ويعتمد القرار على معرفة المديرين المحليين أو الإقليميين.","oldQNumber":"37","bankIndex":181,"setId":"set4"},{"id":"372","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي مما يلي يعتبر من الأسباب الجذرية لمتطلبات المسبقة للمساءلة؟","options":[{"key":"A","letter":"أ","text":"الأداء والدافع"},{"key":"B","letter":"ب","text":"المسؤولية والسلطة"},{"key":"C","letter":"ج","text":"التمكين والقيادة"},{"key":"D","letter":"د","text":"المركزية والتسلسل الهرمي"}],"explanation":"أ. خطأ لأنه الأداء والدافع نتائج أو عوامل سلوكية وليست أساسًا هيكليًا للمساءلة.\n\nب. صحيح لأنه لا يمكن تحقيق المساءلة دون وجود مسؤولية واضحة مقرونة بسلطة مناسبة لاتخاذ القرار.\n\nج. خطأ لأنه التمكين والقيادة يدعمان الأداء لكنهما ليسا الأساس المباشر للمساءلة.\n\nد. خطأ لأنه المركزية والتسلسل الهرمي يتعلقان بشكل التنظيم وليس شرطًا مباشرًا للمساءلة.","oldQNumber":"42","bankIndex":182,"setId":"set4"},{"id":"377","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"A","question":"أي من الهياكل التنظيمي للمؤسسات التالية سيكون أكثر قدرة على التعامل مع التغييرات السريعة وعدم اليقين؟","options":[{"key":"A","letter":"أ","text":"لامركزي"},{"key":"B","letter":"ب","text":"مركزي"},{"key":"C","letter":"ج","text":"مقسم إلى أقسام"},{"key":"D","letter":"د","text":"هيكل طويل"}],"explanation":"أ. صحيح لأنه الهيكل اللامركزي يمنح صلاحيات اتخاذ القرار للمستويات الأدنى، مما يزيد المرونة والسرعة في الاستجابة للتغيرات وعدم اليقين.\n\nب. خطأ لأنه الهيكل المركزي يكون أبطأ في الاستجابة بسبب تركيز القرار في القمة.\n\nج. خطأ لأنه التقسيم إلى أقسام لا يضمن بالضرورة سرعة الاستجابة للتغيرات مقارنة باللامركزية.\n\nد. خطأ لأنه الهيكل الطويل (ذو المستويات الكثيرة) يقلل السرعة ويزيد البيروقراطية.","oldQNumber":"47","bankIndex":183,"setId":"set4"},{"id":"382","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"C","question":"خلال تقييم الأداء السنوي، تقر مديرة مبيعات بأنها تعاني من ضغوط كبيرة بسبب وظيفتها ولكنها تبقى في المنظمة بسبب المكافآت المالية الكبيرة التي تتلقاها. ما الذي يصف بشكل أفضل السبب الرئيسي لبقائها في الوظيفة؟","options":[{"key":"A","letter":"أ","text":"المكافأة الذاتية."},{"key":"B","letter":"ب","text":"إثراء الوظيفة."},{"key":"C","letter":"ج","text":"المكافأة الخارجية."},{"key":"D","letter":"د","text":"تسلسل الاحتياجات."}],"explanation":"أ. خطأ لأنه المكافأة الذاتية ترتبط بالرضا الشخصي والشعور بالإنجاز من العمل نفسه، وليس بالمكافآت المالية.\n\nب. خطأ لأنه إثراء الوظيفة يتعلق بزيادة مسؤوليات وصلاحيات الموظف لتحسين الرضا الوظيفي.\n\nج. صحيح لأنه المكافآت المالية تعد من المكافآت الخارجية التي تدفع الموظف إلى الاستمرار في العمل.\n\nد. خطأ لأنه تسلسل الاحتياجات هو نظرية تفسر الدوافع الإنسانية ولا يصف مباشرة سبب بقائها في الوظيفة.","oldQNumber":"52","bankIndex":184,"setId":"set4"},{"id":"387","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"C","question":"وفقًا لنظرية تحديد الأهداف السلوكية، أي من الأهداف التالية من المرجح أن يؤدي إلى تحسن الدافع؟","options":[{"key":"A","letter":"أ","text":"بذل جهد للبقاء على اتصال مع العملاء الجدد والقدامى."},{"key":"B","letter":"ب","text":"العمل الجاد وإظهار الالتزام ليصبح موردًا أفضل"},{"key":"C","letter":"ج","text":"بيع ما لا يقل عن 1000 شهادة للطاقة المتجددة بحلول نهاية الربع."},{"key":"D","letter":"د","text":"زيادة مبيعات الكهرباء في المناطق التي يكون المورد مسؤولًا عنها."}],"explanation":"أ. خطأ لأنه هدف عام وغير محدد ولا يحتوي على معيار قياس واضح.\n\nب. خطأ لأنه هدف وصفي وغير قابل للقياس ولا يحدد نتيجة محددة.\n\nج. صحيح لأنه هدف محدد وقابل للقياس وله إطار زمني واضح، مما يعزز الدافعية حسب نظرية تحديد الأهداف.\n\nد. خطأ لأنه هدف عام وغير محدد بوضوح من حيث الكمية أو الزمن.","oldQNumber":"57","bankIndex":185,"setId":"set4"},{"id":"392","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"B","question":"منظمة يقع مقرها الرئيسي العالمي في الولايات المتحدة الأمريكية ولديها فروع في 8 دول أخرى. إذا كانت المنظمة تعمل بموقف عرقي، فأي من العبارات التالية صحيحة؟","options":[{"key":"A","letter":"أ","text":"يتم تحديد المعايير المستخدمة للتقييم والرقابة في الفروع المحلية ولا يتم تحديدها من قبل المقر الرئيسي."},{"key":"B","letter":"ب","text":"يتم إرسال الأوامر والأوامر والنصائح إلى الفروع من المقر الرئيسي."},{"key":"C","letter":"ج","text":"يتم تطوير الأشخاص من الجنسيات المحلية للحصول على أفضل المناصب داخل بلدهم."},{"key":"D","letter":"د","text":"وجود قدر كبير من التعاون بين المقر الرئيسي والفروع."}],"explanation":"أ. خطأ لأنه في الموقف العرقي تكون المعايير مركزية من المقر الرئيسي وليس من الفروع المحلية.\n\nب. صحيح لأنه في هذا النمط يتم توجيه القرارات والتعليمات من المقر الرئيسي إلى الفروع.\n\nج. خطأ لأنه تطوير المحليين للمناصب العليا يرتبط بنهج أكثر لامركزية وليس الموقف العرقي.\n\nد. خطأ لأنه التعاون الكبير بين الفروع والمقر لا يعد سمة أساسية للموقف العرقي.","oldQNumber":"62","bankIndex":186,"setId":"set4"},{"id":"397","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"A","question":"عند إجراء مراجعة لحسابات الدفع، وجد المدقق الداخلي أن 3٪ من المدفوعات التي تم إجراؤها خلال الفترة المشمولة بالمراجعة لا تتفق مع الفواتير المقدمة. أي من مؤشرات الأداء الرئيسية (KPIs) التالية لقسم الحسابات الدائنة سيساعد المراجع بشكل أفضل في تحديد أهمية نتائج الاختبار؟","options":[{"key":"A","letter":"أ","text":"مؤشر أداء رئيسي يحدد مدى تحمّل صاحب العملية لانحرافات الأداء."},{"key":"B","letter":"ب","text":"مؤشر أداء رئيسي يحدد أهمية مستويات الأداء وإحصائيات الصرف التي يتم قياسها."},{"key":"C","letter":"ج","text":"مؤشر أداء رئيسي يحدد الوقت المناسب فيما يتعلق بالإبلاغ عن أخطاء بيانات الصرف للموظفين المفوضين."},{"key":"D","letter":"د","text":"مؤشر أداء رئيسي يحدد أهداف معدل التشغيل لعملية الصرف."}],"explanation":"أ. صحيح لأنه يوضح مستوى الانحراف المقبول لدى صاحب العملية، مما يساعد المراجع على تقييم مدى أهمية نسبة الأخطاء المكتشفة.\n\nب. خطأ لأنه يركز على أهمية المقاييس المستخدمة، وليس على مدى قبول أو رفض الانحرافات في الأداء.\n\nج. خطأ لأنه يتعلق بتوقيت الإبلاغ عن الأخطاء، وليس بتقييم أهمية نتائج الاختبار.\n\nد. خطأ لأنه يركز على أهداف التشغيل والكفاءة، وليس على مدى أهمية الانحرافات المكتشفة في المدفوعات.","oldQNumber":"67","bankIndex":187,"setId":"set4"},{"id":"402","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي مما يلي من خصائص استخدام هيكل تحكم هرمي؟","options":[{"key":"A","letter":"أ","text":"استخدام أقل للسياسات والإجراءات."},{"key":"B","letter":"ب","text":"التزام تنظيمي أقل من قبل الموظفين."},{"key":"C","letter":"ج","text":"التركيز أقل على المكافآت الخارجية."},{"key":"D","letter":"د","text":"معدل دوران أقل للموظفين."}],"explanation":"أ. خطأ لأنه الهيكل الهرمي عادةً يعتمد بشكل أكبر على السياسات والإجراءات لضبط العمل وليس تقليلها.\n\nب. صحيح لأنه في الهياكل الهرمية قد يقل شعور الموظفين بالالتزام نتيجة البيروقراطية وكثرة المستويات الإدارية.\n\nج. خطأ لأنه الهيكل الهرمي غالبًا يرتبط بأنظمة مكافآت رسمية وخارجية وليس تقليل التركيز عليها.\n\nد. خطأ لأنه لا توجد علاقة مباشرة ثابتة بين الهيكل الهرمي وانخفاض معدل دوران الموظفين.","oldQNumber":"72","bankIndex":188,"setId":"set4"},{"id":"407","form":"form2","formTitle":"Group 2","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي من الخيارات التالية يصف بشكل أفضل استراتيجية تصميم الوظائف التي يستخدمها رئيس التدقيق التنفيذي والتي تشجع المدققين الداخليين على إدارة مهام التدقيق من البداية إلى النهاية؟","options":[{"key":"A","letter":"أ","text":"تقاسم الوظيفة."},{"key":"B","letter":"ب","text":"التظليل الوظيفي."},{"key":"C","letter":"ج","text":"إثراء الوظيفة."},{"key":"D","letter":"د","text":"التناوب الوظيفي."}],"explanation":"أ. خطأ لأنه تقاسم الوظيفة يعني تقسيم المهام بين أكثر من موظف وليس تحمل مسؤولية كاملة للعمل من البداية للنهاية.\n\nب. خطأ لأنه التظليل الوظيفي يهدف إلى التعلم بالملاحظة وليس تنفيذ وإدارة المهمة بالكامل.\n\nج. صحيح لأنه إثراء الوظيفة يزيد من المسؤولية والاستقلالية ويتيح للمدقق إدارة المهمة من البداية إلى النهاية.\n\nد. خطأ لأنه التناوب الوظيفي يعني الانتقال بين وظائف مختلفة وليس إدارة كاملة لمهمة واحدة.","oldQNumber":"77","bankIndex":189,"setId":"set4"},{"id":"411","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"في منظمة تتعرض لحالات طارئة وحالات استعادة بيانات بشكل كبير ما هو الدور الافضل للمدقق ان يقوم به؟","options":[{"key":"A","letter":"أ","text":"تقييم عمليات خطة استمرارية الأعمال بشكل مستمر"},{"key":"B","letter":"ب","text":"إبداء المشورة للإدارة العليا بما يتعلق بآلية تقييم مخاطر توقف الأعمال"},{"key":"C","letter":"ج","text":"تقييم الاستجابة وإصدار تقرير بها"},{"key":"D","letter":"د","text":"إجراء تدقيق دوري على عمليات استمرارية الأعمال"}],"explanation":"أ. خطأ لأن التقييم المستمر لعمليات الاستمرارية يكون أوسع نطاقًا من الدور الفوري المطلوب أثناء تكرار الحالات الطارئة.\n\nب. خطأ لأن تقديم المشورة يركز على التخطيط وليس التعامل مع حالات طارئة متكررة.\n\nج. صحيح لأن أفضل دور للمدقق في حالات الطوارئ المتكررة هو تقييم الاستجابة الفعلية للأحداث وإصدار تقرير يوضح نقاط الضعف والتحسين.\n\nد. خطأ لأن التدقيق الدوري عام ويحدث في فترات محددة وليس مناسبًا لموقف يتطلب استجابة متكررة وسريعة.","oldQNumber":"1","bankIndex":190,"setId":"set5"},{"id":"414","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أبرم أحد مطوري التكنولوجيا عقدًا لمدة عامين مع مؤسسة أخرى لتصميم برمجيات جديدة. وفقًا لتوجيهات معهد مراجعي الحسابات الداخليين، أي من الأحكام التالية في هذه الاتفاقية سيكون الأكثر فعالية لحماية معرفة المطور وخبرته بالمنتج؟","options":[{"key":"A","letter":"أ","text":"الحق في التدقيق."},{"key":"B","letter":"ب","text":"نظام قياس الأداء."},{"key":"C","letter":"ج","text":"الأدوار والمسؤوليات المحددة."},{"key":"D","letter":"د","text":"حقوق الملكية الفكرية."}],"explanation":"أ. خطأ لأنه يتيح الرقابة والتدقيق على الأداء وليس حماية المعرفة أو الابتكار.\n\nب. خطأ لأنه يقيس الأداء لكنه لا يحمي ملكية المعرفة أو الخبرة.\n\nج. خطأ لأنه يحدد نطاق العمل والمسؤوليات دون حماية الحقوق الفكرية.\n\nد. صحيح لأنه يضمن حماية ملكية الأفكار والابتكارات والمعرفة الناتجة عن تطوير البرمجيات ومنع استخدامها أو نقلها دون إذن.","oldQNumber":"4","bankIndex":191,"setId":"set5"},{"id":"419","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي مما يلي يمثل عقدًا بموجبه تمنح إحدى الشركات شركة أخرى الحق ببيع منتجات معينة أو تقديم خدمات محددة أو استخدام علامة تجارية ضمن منطقة جغرافية محددة؟","options":[{"key":"A","letter":"أ","text":"العلامة التجارية"},{"key":"B","letter":"ب","text":"الامتياز التجاري"},{"key":"C","letter":"ج","text":"الترويج"},{"key":"D","letter":"د","text":"السمعة التجارية"}],"explanation":"أ. خطأ لأنها تشير إلى هوية أو رمز الشركة وليس عقدًا يمنح حقوق تشغيل أو بيع.\n\nب. صحيح لأن الامتياز التجاري (Franchise) هو اتفاق يمنح فيه طرف (المانح) طرفًا آخر الحق في استخدام العلامة التجارية وبيع المنتجات أو تقديم الخدمات ضمن نطاق جغرافي محدد.\n\nج. خطأ لأنها أنشطة تسويقية وليست علاقة تعاقدية تمنح حقوق تشغيل.\n\nد. خطأ لأنها تعبر عن انطباع السوق عن الشركة وليست عقدًا قانونيًا.","oldQNumber":"9","bankIndex":192,"setId":"set5"},{"id":"424","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"يستعرض مدقق داخلي المراحل الرئيسية لمشروع تطوير البرمجيات. ما هي الأداة التالية التي من المرجح أن يستخدمها المدقق لقياس أداء فريق المشروع فيما يتعلق بكيفية إكمال مهام المشروع؟","options":[{"key":"A","letter":"أ","text":"بطاقة أداء متوازنة."},{"key":"B","letter":"ب","text":"تدقيق الجودة."},{"key":"C","letter":"ج","text":"تحليل القيمة المكتسبة."},{"key":"D","letter":"د","text":"تحليل الاتجاه."}],"explanation":"أ. خطأ لأنها تقيس الأداء الاستراتيجي العام وليست مخصصة لقياس تقدم إنجاز مهام المشروع.\n\nب. خطأ لأنها تركز على جودة المخرجات وليس على قياس الأداء الزمني والتكلفة مقابل الإنجاز.\n\nج. صحيح لأنها تقيس أداء المشروع من حيث التكلفة والوقت ونسبة الإنجاز الفعلي مقارنة بالمخطط، مما يعكس أداء الفريق في تنفيذ المهام.\n\nد. خطأ لأنه يوضح الاتجاهات العامة للأداء لكنه لا يقيس الأداء الفعلي للمشروع بشكل دقيق مثل القيمة المكتسبة.","oldQNumber":"14","bankIndex":193,"setId":"set5"},{"id":"429","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"استنادًا إلى النتائج الأخيرة خلص أحد مدققي تكنولوجيا المعلومات إلى أن المنظمة ستعاني من فقدان غير مقبول للبيانات في حالة وقوع كارثة في مركز البيانات الخاص بها. أي من نتائج الاختبارات التالية من المرجح أن تقود المدقق إلى هذا الاستنتاج؟","options":[{"key":"A","letter":"أ","text":"لم يتم إرجاع الأشرطة الاحتياطية المطلوبة من البائع الموجود خارج الموقع في الوقت المناسب"},{"key":"B","letter":"ب","text":"الأشرطة الاحتياطية المرتجعة من البائع الموجود خارج الموقع والتي تحتوي على مساحات فارغة"},{"key":"C","letter":"ج","text":"تم عمل نسخة احتياطية للأنظمة الهامة بشكل متكرر أكثر من المطلوب"},{"key":"D","letter":"د","text":"يتم أخذ الأشرطة الاحتياطية المهمة للنظام خارج الموقع بشكل أقل تكرار مما هو مطلوب"}],"explanation":"أ. خطأ لأن تأخر إرجاع الأشرطة يؤثر على العمليات لكنه لا يثبت مباشرة خطر فقدان بيانات غير مقبول.\n\nب. خطأ لأن وجود مساحات فارغة قد يشير لمشكلة تخزين لكنه لا يحدد بشكل مباشر فشل الاستعادة أو فقدان البيانات.\n\nج. خطأ لأن زيادة تكرار النسخ الاحتياطي تقلل المخاطر ولا تؤدي إلى فقدان بيانات.\n\nد. صحيح لأن عدم نقل النسخ الاحتياطية خارج الموقع بشكل كافٍ يزيد احتمال فقدان البيانات بالكامل عند حدوث كارثة في مركز البيانات.","oldQNumber":"19","bankIndex":194,"setId":"set5"},{"id":"434","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"يريد الرئيس التنفيذي للتدقيق الداخلي تنفيذ برنامج تخطيط موارد المؤسسة على مستوى المؤسسة. اي من عمليات تقييم التدقيق الداخلي يمكن أن يوفر ضمانًا عامًا على احتمال نجاح تنفيذ البرنامج؟","options":[{"key":"A","letter":"أ","text":"تقييم الاستعداد."},{"key":"B","letter":"ب","text":"تقييم مخاطر المشروع."},{"key":"C","letter":"ج","text":"مراجعة ما بعد التنفيذ."},{"key":"D","letter":"د","text":"مراجعة المرحلة الرئيسية."}],"explanation":"أ. خطأ لأنه يركز على جاهزية المؤسسة للتنفيذ ولا يقيم جميع المخاطر التي قد تؤثر على نجاح المشروع.\n\nب. صحيح لأنه يحدد ويقيم المخاطر التي قد تؤثر على تنفيذ البرنامج ونجاحه.\n\nج. خطأ لأنه يتم بعد الانتهاء من تنفيذ البرنامج وليس قبله.\n\nد. خطأ لأنه يركز على مراجعة مراحل محددة من المشروع ولا يقدم تقييماً عاماً لاحتمال نجاحه.","oldQNumber":"24","bankIndex":195,"setId":"set5"},{"id":"439","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"لاحظ مدقق داخلي أن حل استرداد الكوارث للمؤسسة سيستخدم موقعًا باردًا في مدينة تبعد عدة أميال. ما هو من المرجح أن يكون سمة لمحل استرداد الكوارث هذا؟","options":[{"key":"A","letter":"أ","text":"تتم مزامنة البيانات في الوقت الفعلي."},{"key":"B","letter":"ب","text":"من المتوقع أن يكون وقت الاسترداد أقل من أسبوع."},{"key":"C","letter":"ج","text":"الخوادم غير متوفرة ويجب شراؤها."},{"key":"D","letter":"د","text":"لم يتم تحديد موارد الاسترداد ولم يتم تعريف عمليات استعادة البيانات."}],"explanation":"أ. خطأ لأنه في الموقع البارد لا توجد مزامنة بيانات في الوقت الفعلي.\n\nب. خطأ لأن الموقع البارد عادة يحتاج وقت استرداد أطول من ذلك.\n\nج. صحيح لأنه في الموقع البارد لا تكون الخوادم جاهزة مسبقًا ويجب توفيرها وتهيئتها عند الحاجة للاسترداد.\n\nد. خطأ لأنه يصف حالة غياب خطة استرداد وليس خاصية للموقع البارد.","oldQNumber":"29","bankIndex":196,"setId":"set5"},{"id":"444","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"يستخدم الموظفون في مؤسسة تنظيم الفعاليات تقنية معينة لحل المشكلات وتحسين العمليات. تتكون التقنية من خمس خطوات: التحديد والقياس والتحليل والتحسين والتحكم. أي مما يلي يصف هذا النهج بشكل أفضل؟","options":[{"key":"A","letter":"أ","text":"Six Sigma"},{"key":"B","letter":"ب","text":"حلقة الجودة."},{"key":"C","letter":"ج","text":"تحليل سلسلة القيمة."},{"key":"D","letter":"د","text":"نظرية القيود."}],"explanation":"أ. صحيح لأنه يعتمد على منهجية DMAIC التي تتكون من التحديد والقياس والتحليل والتحسين والتحكم.\n\nب. خطأ لأنها مجموعة من الموظفين تعمل على مناقشة وتحسين المشكلات، وليست منهجية الخطوات الخمس المذكورة.\n\nج. خطأ لأنه يركز على تحليل الأنشطة التي تضيف قيمة في سلسلة الأعمال.\n\nد. خطأ لأنها تركز على تحديد القيود أو الاختناقات التي تحد من أداء العملية وتحسينها.","oldQNumber":"34","bankIndex":197,"setId":"set5"},{"id":"449","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"يقوم مراجع داخلي بمراجعة نتائج اختبار تكامل تطوير البرامج. ما هو الغرض من اختبار التكامل؟","options":[{"key":"A","letter":"أ","text":"التحقق من أن التطبيق يلبي متطلبات المستخدم المعلنة."},{"key":"B","letter":"ب","text":"التحقق من أن البرامج المستقلة تتطابق مع مواصفات الكود."},{"key":"C","letter":"ج","text":"التحقق من أن التطبيق يعمل بشكل مناسب لعدد المستخدمين المقصود."},{"key":"D","letter":"د","text":"التحقق من أن جميع مكونات البرامج والأجهزة تعمل معًا كما هو مقصود."}],"explanation":"أ. خطأ لأن هذا يخص اختبار قبول المستخدم (UAT).\n\nب. خطأ لأنه يخص اختبار الوحدة وليس التكامل.\n\nج. خطأ لأنه يخص اختبار الأداء/التحميل وليس التكامل.\n\nد. صحيح لأن اختبار التكامل يهدف للتأكد من أن جميع مكونات النظام (برمجيات + أجهزة) تعمل معًا بشكل صحيح كما هو مصمم.","oldQNumber":"39","bankIndex":198,"setId":"set5"},{"id":"454","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"قامت منظمة بالاستعانة بمصادر خارجية لوظيفة تقنية المعلومات وخدمات مكتب المساعدة. تم توقيع اتفاقية مستوى الخدمة ووضع خطة استمرارية الأعمال. أي من العناصر التالية يجب تضمينه في خطة استمرارية الأعمال؟","options":[{"key":"A","letter":"أ","text":"خطط إدارة السعة للتطبيقات التجارية الحرجة"},{"key":"B","letter":"ب","text":"بند الملكية الفكرية"},{"key":"C","letter":"ج","text":"حلول استعادة الوظائف التجارية الحرجة"},{"key":"D","letter":"د","text":"بند حماية البيانات"}],"explanation":"أ. خطأ لأن إدارة السعة تتعلق بالأداء والتخطيط التشغيلي وليس بالتعافي من الكوارث بشكل مباشر.\n\nب. خطأ لأن بند الملكية الفكرية يُدرج في العقود وليس في خطة استمرارية الأعمال.\n\nج. صحيح لأن خطة استمرارية الأعمال يجب أن تتضمن حلولًا واضحة لاستعادة الوظائف التجارية الحرجة لضمان استمرار العمل بعد الانقطاع.\n\nد. خطأ لأن حماية البيانات تكون جزءًا من الاتفاقيات والسياسات الأمنية وليس جوهر خطة التعافي نفسها.","oldQNumber":"44","bankIndex":199,"setId":"set5"},{"id":"459","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"تعرضت مؤسسة لأضرار جسيمة بخوادم الملفات والتطبيقات المحلية نتيجة إعصار. لحسن الحظ ، تمكنت المؤسسة من استعادة جميع المعلومات التي تم نسخها احتياطيًا بواسطة مقاول طرف ثالث في الخارج. أي من الأساليب التالية استخدمتها المنظمة؟","options":[{"key":"A","letter":"أ","text":"إدارة التطبيقات."},{"key":"B","letter":"ب","text":"إدارة مراكز البيانات."},{"key":"C","letter":"ج","text":"خدمات الأمن المُدارة."},{"key":"D","letter":"د","text":"تكامل النظم."}],"explanation":"أ. خطأ لأنها تركز على تشغيل وصيانة التطبيقات وليس على استضافة النسخ الاحتياطية واستعادتها.\n\nب. صحيح لأنها تتضمن إدارة البنية التحتية ومراكز البيانات والنسخ الاحتياطية واستعادة البيانات عند الكوارث.\n\nج. خطأ لأنها تركز على خدمات الحماية والأمن السيبراني أكثر من إدارة النسخ الاحتياطية.\n\nد. خطأ لأنه يتعلق بربط ودمج الأنظمة المختلفة وليس بإدارة النسخ الاحتياطية أو الاسترداد من الكوارث.","oldQNumber":"49","bankIndex":200,"setId":"set5"},{"id":"464","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"ما هو المحرك الأساسي لإنشاء وتحديد أولويات المبادرات الاستراتيجية الجديدة التي تنشئها المؤسسة؟","options":[{"key":"A","letter":"أ","text":"تحمل المخاطر (Risk tolerance) ."},{"key":"B","letter":"ب","text":"الأداء (Performance)."},{"key":"C","letter":"ج","text":"التهديدات والفرص (Threats and opportunities)."},{"key":"D","letter":"د","text":"الحوكمة (Governance)."}],"explanation":"أ. خطأ لأنه يحدد مقدار المخاطر المقبول للمؤسسة، وليس المحرك الأساسي لإنشاء المبادرات الاستراتيجية الجديدة.\n\nب. خطأ لأنه يقيس نتائج الأعمال وتحقيق الأهداف، ولا يُعد المصدر الرئيسي للمبادرات الاستراتيجية الجديدة.\n\nج. صحيح لأنه عند تحديد التهديدات والفرص تسعى المؤسسة إلى تطوير مبادرات استراتيجية للاستفادة من الفرص ومواجهة التهديدات.\n\nد. خطأ لأنها توفر الإشراف والتوجيه للمؤسسة، لكنها ليست المحرك الأساسي لإنشاء المبادرات الاستراتيجية الجديدة.","oldQNumber":"54","bankIndex":201,"setId":"set5"},{"id":"469","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"إدارة الشركة تفكر في السؤال التالي: \"كيف تتنافس منظمتنا؟\" يتعلق هذا السؤال بأي من مستويات الاستراتيجية التالية؟","options":[{"key":"A","letter":"أ","text":"استراتيجية على مستوى الوظيفة"},{"key":"B","letter":"ب","text":"استراتيجية على مستوى الشركة"},{"key":"C","letter":"ج","text":"استراتيجية على مستوى الأعمال"},{"key":"D","letter":"د","text":"استراتيجية الأقسام"}],"explanation":"أ. خطأ لأنها تركز على كيفية تنفيذ الوظائف داخل المنظمة وليس على كيفية المنافسة في السوق.\n\nب. خطأ لأنها تتعلق بتحديد نطاق الأعمال ككل (ما هي الأعمال التي ندخلها أو نخرج منها).\n\nج. صحيح لأن استراتيجية مستوى الأعمال تركز على كيفية تنافس المنظمة في السوق وتحقيق ميزة تنافسية.\n\nد. خطأ لأنه ليس مستوى استراتيجي معتمد كمستوى مستقل في التصنيفات القياسية للاستراتيجية.","oldQNumber":"59","bankIndex":202,"setId":"set5"},{"id":"474","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"ترغب إحدى المنظمات التي تعتمد بشكل كبير على تكنولوجيا المعلومات في احتواء تأثير تعطل الأعمال المحتمل على فترة تتراوح تقريبًا بين أربعة إلى سبعة أيام. أي من استراتيجيات استرداد الأعمال التالية تلبي احتياجات هذه المنظمة على نحو أكثر فعالية؟","options":[{"key":"A","letter":"أ","text":"استراتيجية استرداد لم يتم تحديد موقع منفصل لها بعد ، ولكن تم حجز الأجهزة للشراء ونسخ البيانات الاحتياطية."},{"key":"B","letter":"ب","text":"استراتيجية استرداد تم تأمين موقع منفصل لها وهي جاهزة للاستخدام ، مع أجهزة مشكلة بالكامل وبيانات متزامنة في الوقت الفعلي."},{"key":"C","letter":"ج","text":"استراتيجية استرداد تم تأمين موقع منفصل لها وتم تخصيص الأموال اللازمة للأجهزة والنسخ الاحتياطية للبيانات."},{"key":"D","letter":"د","text":"استراتيجية استرداد تم تأمين موقع منفصل لها بأجهزة قابلة للتهيئة ونسخ احتياطية للبيانات."}],"explanation":"أ. خطأ لأنه لا يوجد موقع جاهز، مما يجعل الاستعادة أبطأ وغير مناسبة لفترة 4–7 أيام.\n\nب. خطأ لأنه موقع ساخن جاهز بالكامل ويفوق الاحتياج المطلوب (أسرع من اللازم).\n\nج. خطأ لأنه وجود التمويل فقط لا يضمن جاهزية فعلية للاستعادة خلال الفترة المطلوبة.\n\nد. صحيح لأنه يمثل موقع دافئ مناسب، حيث يمكن تهيئته وتشغيله خلال فترة تتوافق مع 4–7 أيام.","oldQNumber":"64","bankIndex":203,"setId":"set5"},{"id":"479","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"ما الغرض الأساسي من نسخ البيانات والأنظمة احتياطيا؟","options":[{"key":"A","letter":"أ","text":"استعادة جميع البيانات والأنظمة فورًا بعد وقوع الحادث."},{"key":"B","letter":"ب","text":"تحديد الحد الأقصى المسموح به من وقت التعطل لاستعادة الأنظمة والبيانات بعد وقوع الحادث."},{"key":"C","letter":"ج","text":"تحديد نقطة زمنية يجب استرداد الأنظمة والبيانات إليها بعد وقوع الحادث."},{"key":"D","letter":"د","text":"استعادة البيانات والأنظمة إلى نقطة زمنية سابقة بعد وقوع الحادث."}],"explanation":"أ. خطأ لأنه النسخ الاحتياطي لا يضمن الاستعادة الفورية بل يساعد على الاسترجاع.\n\nب. خطأ لأنه يتعلق بمفهوم وقت التعطل (RTO) وليس الغرض من النسخ الاحتياطي.\n\nج. خطأ لأنه يصف مفهوم نقطة الاسترداد (RPO) وليس الغرض الأساسي مباشرة.\n\nد. صحيح لأنه الهدف الأساسي من النسخ الاحتياطي هو تمكين استعادة البيانات إلى حالة سابقة بعد حدوث مشكلة أو حادث.","oldQNumber":"69","bankIndex":204,"setId":"set5"},{"id":"484","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"يقوم المدققون الداخليون بمراجعة عمليات إدارة التغيير المتعلقة بقسم تقنية المعلومات في المنظمة. أي من الخصائص التالية يعد مؤشراً على عدم فعالية عملية إدارة التغيير وقد يؤثر على عملاء المنظمة؟","options":[{"key":"A","letter":"أ","text":"تؤدي تأخيرات المشاريع إلى فقدان فرص في الأسواق الناشئة لصالح المنافسين."},{"key":"B","letter":"ب","text":"تؤدي العيوب في الشبكة إلى خلق مخاطر إصدار بيانات صحفية مبكرة تصف تفاصيل عن منتجات قادمة."},{"key":"C","letter":"ج","text":"تؤدي تغير الأولويات إلى نقل الموارد من مشاريع تقنية معلومات مخططة إلى مشاريع غير مخططة."},{"key":"D","letter":"د","text":"يؤدي نقص الكوادر إلى تأخيرات طويلة في معالجة المشكلات المتعلقة بالخدمات"}],"explanation":"أ. خطأ لأن هذا أثر استراتيجي على السوق وليس مؤشرًا مباشرًا على ضعف إدارة التغيير في تقنية المعلومات.\n\nب. خطأ لأنه يتعلق بمخاطر تسريب معلومات وليس بفعالية عملية إدارة التغيير نفسها.\n\nج. خطأ لأنه يعكس إدارة موارد داخلية وليس بالضرورة تأثير مباشر على العملاء أو فعالية التغيير.\n\nد. صحيح لأنه يشير مباشرة إلى ضعف في الاستجابة والتعامل مع التغييرات/المشكلات التقنية مما يؤثر على جودة الخدمة المقدمة للعملاء ويعكس ضعف فعالية إدارة التغيير.","oldQNumber":"74","bankIndex":205,"setId":"set5"},{"id":"489","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"بعد وقوع كارثة، أي مما يلي يحدد أقصى مدة مقبولة قبل عودة العمليات إلى مستوى مقبول؟","options":[{"key":"A","letter":"أ","text":"هدف نقطة الاسترداد (RPO):"},{"key":"B","letter":"ب","text":"هدف وقت الاسترداد (RTO):"},{"key":"C","letter":"ج","text":"انقطاع أقصى يمكن تحمله (MTO):"},{"key":"D","letter":"د","text":"نافذة الانقطاع المسموح بها (AIW):"}],"explanation":"أ. خطأ لأن RPO يحدد أقصى فقدان مقبول للبيانات وليس الزمن.\n\nب. صحيح لأن RTO يحدد أقصى مدة مقبولة لتعافي الأنظمة وعودة العمليات إلى مستوى مقبول بعد الكارثة.\n\nج. خطأ لأنه يشير إلى الحد الأقصى لانقطاع الأعمال قبل أن تصبح غير قابلة للاستمرار، وليس وقت التعافي.\n\nد. خطأ لأنه ليس مصطلحًا قياسيًا في إدارة استمرارية الأعمال بهذا المعنى.","oldQNumber":"80","bankIndex":206,"setId":"set5"},{"id":"494","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"لدى مستشفى كبير عقد حالي مع بائع في بلد آخر لتوفير الدعم البرمجي وصيانة نظام معلومات سجلات المرضى بالمستشفى. من وجهة نظر إدارة المستشفى، أي من الضوابط التالية سيكون أكثر فعالية لمعالجة مخاطر الخصوصية المتعلقة بترتيبات الاستعانة بمصادر خارجية؟","options":[{"key":"A","letter":"أ","text":"إجراء مراجعات دورية لسياسة الخصوصية للتأكد من أن السياسة الحالية تلبي متطلبات التشريعات الحالية في كلا المنطقتين"},{"key":"B","letter":"ب","text":"تضمين بند \"الحق في التدقيق\" في العقد وفرض التزامات أمنية مفصلة على البائع الخارجي"},{"key":"C","letter":"ج","text":"تنفيذ تدريب إلزامي على الخصوصية للإدارة للمساعدة في تحديد مخاطر الخصوصية عند الاستعانة بمصادر خارجية للخدمات"},{"key":"D","letter":"د","text":"تطوير خطة لرصد الحوادث والاستجابة لها لتتبع الانتهاكات من المصادر الداخلية والخارجية"}],"explanation":"أ. خطأ لأن مراجعة السياسات وحدها لا تضمن التزام المورد فعليًا بحماية البيانات.\n\nب. صحيح لأن تضمين حق التدقيق مع التزامات أمنية واضحة في العقد يمنح المستشفى قدرة مباشرة على الرقابة والتحقق من التزام المورد بمتطلبات الخصوصية.\n\nج. خطأ لأن التدريب مفيد لكنه لا يتحكم في سلوك المورد أو يفرض ضوابط ملزمة.\n\nد. خطأ لأن خطة الاستجابة للحوادث تعالج النتائج بعد وقوع المشكلة وليس الوقاية الأساسية في عقود التعهيد.","oldQNumber":"85","bankIndex":207,"setId":"set5"},{"id":"499","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أثناء التخطيط لاستعادة الطوارئ، حددت المؤسسة هدف نقطة استرداد. ما الذي يصف هذا المفهوم بشكل أفضل؟","options":[{"key":"A","letter":"أ","text":"أقصى فترة تعطل مقبولة بعد حدوث الحادث."},{"key":"B","letter":"ب","text":"أقصى فقدان بيانات مقبول بعد حدوث الحادث."},{"key":"C","letter":"ج","text":"أقصى مخاطر مقبولة مرتبطة بحدوث الحادث"},{"key":"D","letter":"د","text":"الحد الأدنى لموارد الاسترداد المطلوبة بعد حدوث الحادث."}],"explanation":"أ. خطأ لأنه يصف مفهوم هدف زمن الاستعادة (RTO) وليس نقطة الاسترداد.\n\nب. صحيح لأنه هدف نقطة الاسترداد (RPO) يحدد كمية البيانات المسموح بفقدانها بعد الحادث.\n\nج. خطأ لأنه يتعلق بالمخاطر وليس باستعادة البيانات.\n\nد. خطأ لأنه يتعلق بالموارد وليس بنقطة فقدان البيانات.","oldQNumber":"90","bankIndex":208,"setId":"set5"},{"id":"504","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"في أي مرحلة من إدارة تكامل المشروع يقوم مدير المشروع وفريق إدارة المشروع عادةً بتنسيق الواجهات الفنية والتنظيمية المختلفة الموجودة في المشروع؟","options":[{"key":"A","letter":"أ","text":"تطوير خطة المشروع."},{"key":"B","letter":"ب","text":"تنفيذ خطة المشروع."},{"key":"C","letter":"ج","text":"مراقبة التغيير المتكاملة."},{"key":"D","letter":"د","text":"تخطيط جودة المشروع."}],"explanation":"أ. خطأ لأنه يركز على إعداد وتوثيق خطة المشروع قبل بدء التنفيذ.\n\nب. صحيح لأنه خلال تنفيذ خطة المشروع يتم تنسيق الأنشطة والواجهات الفنية والتنظيمية المختلفة لتحقيق أهداف المشروع.\n\nج. خطأ لأنها تركز على مراجعة واعتماد التغييرات التي تطرأ على المشروع.\n\nد. خطأ لأنه يركز على تحديد معايير الجودة وإجراءات تحقيقها، وليس تنسيق الواجهات المختلفة في المشروع.","oldQNumber":"95","bankIndex":209,"setId":"set5"},{"id":"509","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أي مما يلي هو أفضل نهج للتغلب على عوائق الدخول في عمل تجاري جديد؟","options":[{"key":"A","letter":"أ","text":"تقديم منتج قياسي مستهدف في السوق المعترف به."},{"key":"B","letter":"ب","text":"الاستثمار في أعمال السلع أو المنتجات الشبيهة بالسلع."},{"key":"C","letter":"ج","text":"الدخول في سوق بطيء النمو."},{"key":"D","letter":"د","text":"استخدام علاقة توزيع راسخة."}],"explanation":"أ. خطأ لأن تقديم منتج قياسي لا يساعد بالضرورة في تجاوز عوائق الدخول مثل الوصول للسوق أو قنوات التوزيع.\n\nب. خطأ لأن السلع أو المنتجات الشبيهة بالسلع غالبًا تزيد المنافسة السعرية ولا تقلل عوائق الدخول.\n\nج. خطأ لأن السوق البطيء النمو عادة لا يقلل العوائق بل قد يزيد صعوبة الدخول بسبب تشبع السوق.\n\nد. صحيح لأن وجود علاقة توزيع راسخة يمنح الشركة وصولًا جاهزًا للسوق ويقلل أهم عائق وهو قنوات الوصول للعملاء.","oldQNumber":"100","bankIndex":210,"setId":"set5"},{"id":"514","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي من مفاهيم العقد يتم تقديمها عادةً مقابل تنفيذ وعد؟","options":[{"key":"A","letter":"أ","text":"مشروعية."},{"key":"B","letter":"ب","text":"مقابل/الاعتبار."},{"key":"C","letter":"ج","text":"اتفاق."},{"key":"D","letter":"د","text":"إسقاط."}],"explanation":"أ. خطأ لأنه يشير إلى كون العقد قانونيًا وليس إلى ما يُقدَّم مقابل الوعد.\n\nب. صحيح لأنه يعني “العوض أو المقابل” الذي يُقدَّم مقابل الالتزام بتنفيذ الوعد في العقد.\n\nج. خطأ لأنه يشير إلى وجود توافق بين الأطراف وليس إلى المقابل المادي أو القانوني.\n\nد. خطأ لأنه يشير إلى إنهاء أو إسقاط الالتزام وليس إلى المقابل في العقد.","oldQNumber":"106","bankIndex":211,"setId":"set5"},{"id":"519","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أي مما يلي أفضل ما يوضح قدرة المؤسسة على التعافي من الكارثة؟","options":[{"key":"A","letter":"أ","text":"الموقع الساخن"},{"key":"B","letter":"ب","text":"الموقع البارد"},{"key":"C","letter":"ج","text":"مركز بيانات زائد عن الحاجة"},{"key":"D","letter":"د","text":"الاختبار المنتظم لخطة الكوارث"}],"explanation":"أ. خطأ لأنه يوفر قدرة استعادة عالية لكنه لا يثبت فعليًا جاهزية المنظمة أو فاعلية الخطة.\n\nب. خطأ لأنه أقل جاهزية ويحتاج وقتًا أطول للتعافي.\n\nج. خطأ لأنه يعكس بنية تحتية قوية لكنه لا يثبت قدرة التشغيل الفعلية أثناء الكارثة.\n\nد. صحيح لأنه الاختبار المنتظم هو الدليل العملي الحقيقي على أن خطة التعافي تعمل ويمكن تنفيذها بفعالية عند وقوع الكارثة.","oldQNumber":"111","bankIndex":212,"setId":"set5"},{"id":"524","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي من خطط استرداد الكوارث لتكنولوجيا المعلومات التالية تتضمن موقعًا بعيدًا مخصصًا للاسترداد مع مساحة متاحة للخدمات الأساسية ، مثل الإنترنت والاتصالات السلكية واللاسلكية ، ولكن ليس لديه خوادم أو معدات بنية تحتية؟","options":[{"key":"A","letter":"أ","text":"موقع مجمد"},{"key":"B","letter":"ب","text":"موقع بارد"},{"key":"C","letter":"ج","text":"موقع دافئ"},{"key":"D","letter":"د","text":"موقع ساخن"}],"explanation":"أ. خطأ لأنه ليس تصنيفًا قياسيًا شائع الاستخدام في خطط استرداد الكوارث (DRP).\n\nب. صحيح لأنه يوفر موقعًا جاهزًا بالخدمات الأساسية فقط مثل الكهرباء والاتصالات دون وجود خوادم أو تجهيزات، ويحتاج تجهيزًا بعد الكارثة.\n\nج. خطأ لأنه يحتوي على تجهيزات جزئية ويحتاج وقتًا أقل للتشغيل مقارنة بالموقع البارد.\n\nد. خطأ لأنه يكون مجهزًا بالكامل وجاهزًا للتشغيل الفوري تقريبًا.","oldQNumber":"116","bankIndex":213,"setId":"set5"},{"id":"529","form":"form2","formTitle":"Group 2","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أي من الطرق التالية للتوسع العالمي تكون تكلفة دخول السوق الأجنبية هي الأعلى؟","options":[{"key":"A","letter":"أ","text":"المشاريع المشتركة"},{"key":"B","letter":"ب","text":"الترخيص"},{"key":"C","letter":"ج","text":"التصدير"},{"key":"D","letter":"د","text":"الإنتاج في الخارج"}],"explanation":"أ. خطأ لأن المشاريع المشتركة توزع التكلفة والمخاطر بين الأطراف.\n\nب. خطأ لأن الترخيص منخفض التكلفة نسبيًا لأنه يعتمد على منح حقوق استخدام التكنولوجيا أو المنتج.\n\nج. خطأ لأن التصدير هو الأقل تكلفة مقارنة ببقية الخيارات.\n\nد. صحيح لأن الإنتاج في الخارج يتطلب استثمارات رأسمالية كبيرة في المصانع والبنية التحتية والتشغيل، مما يجعله الأعلى تكلفة لدخول السوق الأجنبية.","oldQNumber":"121","bankIndex":214,"setId":"set5"},{"id":"3","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"B","question":"ما هي من خصائص البيانات الضخمة؟","options":[{"key":"A","letter":"أ","text":"البيانات الضخمة غالبًا تكون منظمة."},{"key":"B","letter":"ب","text":"غالبًا ما تحتاج نتائج تحليل البيانات الضخمة إلى التصور(عرض مرئي)."},{"key":"C","letter":"ج","text":"غالبًا يتم إنشاء البيانات الضخمة ببطء ومتغيرة للغاية."},{"key":"D","letter":"د","text":"تأتي البيانات الضخمة من مصادر داخلية محفوظة في مستودعات البيانات."}],"explanation":"أ. خطأ لأن البيانات الضخمة غالبًا تكون غير منظمة أو شبه منظمة وليست منظمة فقط.\n\nب. صحيح لأن تحليل البيانات الضخمة يحتاج إلى التصور لتسهيل فهم النتائج المعقدة.\n\nج. خطأ لأن البيانات الضخمة تتميز بالسرعة والتغير المستمر وليس البطء.\n\nد. خطأ لأن البيانات الضخمة تأتي من مصادر متعددة داخلية وخارجية وليست فقط من مستودعات البيانات الداخلية.","oldQNumber":"3","bankIndex":215,"setId":"set1"},{"id":"7","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"D","question":"أي مما يلي يعد من فوائد استخدام تحليلات البيانات للتدقيق الداخلي ؟","options":[{"key":"A","letter":"أ","text":"القدرة على توليد المزيد من البيانات لتدقيق التوصيات"},{"key":"B","letter":"ب","text":"القدرة على استخدام لوحات المعلومات لتصور وتأكيد نتائج التدقيق."},{"key":"C","letter":"ج","text":"انخفاض الحاجة الى خبرات محددة في مجالات مثل الاحصاء أخذ العينات وتقييم المخاطر"},{"key":"D","letter":"د","text":"القدرة على إنشاء تقييمات محسنة للمخاطر وتركيز التدقيق"}],"explanation":"أ. خطأ لأنه توليد البيانات ليس فائدة مباشرة لتحليلات البيانات بل يتعلق بمصادر البيانات.\n\nب. خطأ لأن لوحات المعلومات تساعد في العرض لكنها ليست الفائدة الأهم مقارنة بتحسين إدارة المخاطر.\n\nج. خطأ لأن تحليلات البيانات لا تقلل الحاجة للخبرات بل قد تتطلب مهارات أكثر تخصصًا.\n\nد. صحيح لأنه يساعد المدقق في تحسين تقييم المخاطر وتوجيه التدقيق نحو المناطق الأكثر أهمية.","oldQNumber":"7","bankIndex":216,"setId":"set1"},{"id":"12","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"C","question":"عند استخدام تحليل البيانات أثناء مراجعة عملية الشراء ، ما هي الخطوة الأولى في عملية التحليل؟","options":[{"key":"A","letter":"أ","text":"تحديد شذوذ البيانات والقيم المتطرفة."},{"key":"B","letter":"ب","text":"تحديد الأسئلة التي يجب الإجابة عليها."},{"key":"C","letter":"ج","text":"تحديد مصادر البيانات المتاحة."},{"key":"D","letter":"د","text":"تحديد نطاق استخراج البيانات."}],"explanation":"أ. خطأ لأنه فحص الشذوذ يأتي بعد تجهيز البيانات وتحليلها.\n\nب. خطأ لأن تحديد الأسئلة يتم قبل التحليل لكنه ليس أول خطوة تشغيلية في عملية التحليل الفعلي للبيانات.\n\nج. صحيح لأنه يجب أولاً معرفة أين توجد البيانات وما هي مصادرها قبل أي تحليل.\n\nد. خطأ لأن تحديد النطاق يتم بعد فهم مصادر البيانات والأسئلة المطلوبة.","oldQNumber":"12","bankIndex":217,"setId":"set1"},{"id":"17","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"D","question":"ما هي إحدى خصائص البيانات الكبيرة؟","options":[{"key":"A","letter":"أ","text":"يتم إنشاء البيانات الكبيرة ببطء بسبب الحجم."},{"key":"B","letter":"ب","text":"يجب أن تكون البيانات الكبيرة ذات صلة بأغراض المنظمات."},{"key":"C","letter":"ج","text":"تأتي البيانات الكبيرة من نوع واحد من النماذج الرسمية."},{"key":"D","letter":"د","text":"البيانات الكبيرة تتغير دائما."}],"explanation":"أ. خطأ لأن البيانات الكبيرة غالبًا ما يتم إنشاؤها بسرعة كبيرة.\n\nب. خطأ لأن الصلة بالأهداف ليست من الخصائص الأساسية للبيانات الكبيرة.\n\nج. خطأ لأن البيانات الكبيرة تأتي من مصادر وأشكال متعددة وليست من نوع واحد فقط.\n\nد. صحيح لأن من خصائص البيانات الكبيرة التغير المستمر والتدفق السريع للبيانات.","oldQNumber":"17","bankIndex":218,"setId":"set1"},{"id":"22","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"B","question":"يقوم مدقق داخلي بمراجعة عملية تقييم أداء المؤسسة أي من الطرق التالية سيكون اكثر فعالية لتحديد النمطية","options":[{"key":"A","letter":"أ","text":"استخدام مقياس تصنيف مرتكز سلوكيا لتقسيم المهام الى مكوناتها"},{"key":"B","letter":"ب","text":"تحليل ومقارنة التقييمات لفئات أو مجموعة مختلفة من الموظفين"},{"key":"C","letter":"ج","text":"مقارنة تصنيفات الموظفين الذين تم اختيارهم مع تقييمهم السابق"},{"key":"D","letter":"د","text":"تحليل عدد ونسب تقييم الموظفين التي تندرج تحت كل فئة تصنيف"}],"explanation":"أ. خطأ لأنه يركز على تقسيم المهام وليس على اكتشاف النمطية في التقييمات.\n\nب. صحيح لأنه يسمح بمقارنة المجموعات المختلفة واكتشاف الأنماط المتكررة في التقييمات.\n\nج. خطأ لأنه يركز على المقارنة الفردية وليس على اكتشاف نمط عام.\n\nد. خطأ لأنه يصف التوزيع الإحصائي فقط وليس تحديد النمطية بين الفئات.","oldQNumber":"22","bankIndex":219,"setId":"set1"},{"id":"27","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"C","question":"أي من السمات التالية لتحليلات البيانات يرتبط بالعدد المتزايد للمصادر التي يتم إنشاء البيانات منها؟","options":[{"key":"A","letter":"أ","text":"الحجم"},{"key":"B","letter":"ب","text":"السرعة"},{"key":"C","letter":"ج","text":"التنوع"},{"key":"D","letter":"د","text":"الموثوقية"}],"explanation":"أ. خطأ لأنه الحجم يتعلق بكمية البيانات وليس مصادرها.\n\nب. خطأ لأن السرعة تتعلق بسرعة توليد البيانات وليس تعدد المصادر.\n\nج. صحيح لأن زيادة مصادر البيانات تعني تنوع أكبر في أنواع وأشكال البيانات.\n\nد. خطأ لأن الموثوقية تتعلق بدقة وصحة البيانات وليس مصادرها.","oldQNumber":"27","bankIndex":220,"setId":"set1"},{"id":"32","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"A","question":"ما هي البيانات العريضة data lakes ؟","options":[{"key":"A","letter":"أ","text":"تجمع بيانات من عدة مصادر بمكان واحد"},{"key":"B","letter":"ب","text":"تجمع بيانات من عدة مصادر باماكن مختلفة"},{"key":"C","letter":"ج","text":"تمثل بيانات أقل خطورة لكونها موزعة في مناطق جغرافية واسعة"},{"key":"D","letter":"د","text":"تقتصر على البيانات المالية فقط دون البيانات التشغيلية"}],"explanation":"أ صحيح لأن البيانات العريضة (Broad Data) تشير إلى تجميع البيانات من مصادر متعددة في مكان واحد بهدف التحليل واستخراج المعلومات ودعم اتخاذ القرار.\n\nب خطأ لأن وجود البيانات في أماكن مختلفة لا يصف مفهوم البيانات العريضة، بل يصف حالة البيانات قبل تجميعها.\n\nج خطأ لأن مستوى خطورة البيانات لا يعتمد على توزيعها الجغرافي، بل على طبيعة البيانات والضوابط المطبقة عليها.\n\nد خطأ لأن البيانات العريضة قد تشمل بيانات مالية وتشغيلية وموارد بشرية وغيرها من أنواع البيانات المختلفة","oldQNumber":"32","bankIndex":221,"setId":"set1"},{"id":"37","form":"form3","formTitle":"Group 3","lesson":"أ- تحليل البيانات","answer":"C","question":"أي من التقنيات التحليلية التالية سيستخدمها المدقق الداخلي للتأكد من عدم تلقي أي من موظفي المؤسسة مدفوعات فواتير احتيالية؟","options":[{"key":"A","letter":"أ","text":"إجراء اختبار الفجوة."},{"key":"B","letter":"ب","text":"ربط مصادر بيانات مختلفة."},{"key":"C","letter":"ج","text":"إجراء اختبار مكرر"},{"key":"D","letter":"د","text":"حساب المعايير الإحصائية."}],"explanation":"أ. خطأ لأنه اختبار الفجوة يستخدم لتحديد الفترات أو العمليات غير المكتملة وليس كشف المدفوعات الاحتيالية.\n\nب. خطأ لأن ربط مصادر البيانات يساعد في المقارنة لكنه لا يكشف التكرار بشكل مباشر.\n\nج. صحيح لأنه يساعد في اكتشاف المدفوعات المكررة أو الاحتيالية من خلال تحديد التكرارات.\n\nد. خطأ لأن المعايير الإحصائية تستخدم للتحليل العام وليس لكشف المدفوعات الاحتيالية بشكل مباشر.","oldQNumber":"37","bankIndex":222,"setId":"set1"},{"id":"44","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"مع تزايد التهديدات الأمنية الإلكترونية، ما الذي يجب على الإدارة التركيز عليه لضمان وجود حوكمة أمنية قوية؟","options":[{"key":"A","letter":"أ","text":"جرد الأصول المعلوماتية."},{"key":"B","letter":"ب","text":"الحد من مشاركة ملفات البيانات مع جهات خارجية"},{"key":"C","letter":"ج","text":"تقييم نقاط الضعف."},{"key":"D","letter":"د","text":"سياسات محددة بوضوح."}],"explanation":"أ. خطأ لأنه جزء تشغيلي من إدارة الأصول وليس أساس الحوكمة.\n\nب. خطأ لأنه إجراء أمني محدد وليس إطار حوكمة شامل.\n\nج. خطأ لأنه نشاط تقني ضمن إدارة المخاطر وليس عنصر حوكمة رئيسي.\n\nد. صحيح لأنه وجود سياسات واضحة هو الأساس الذي تُبنى عليه الحوكمة الأمنية ويضمن توجيه وإدارة الأمن السيبراني بشكل منظم","oldQNumber":"5","bankIndex":223,"setId":"set2"},{"id":"49","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي مما يلي مثال على عنصر تحكم فيزيائي مصمم لمنع خروقات الأمن؟","options":[{"key":"A","letter":"أ","text":"منع مسؤولي قواعد البيانات من بدء تغييرات البرنامج."},{"key":"B","letter":"ب","text":"منع الفنيين من الدخول إلى غرفة الشبكة."},{"key":"C","letter":"ج","text":"تقييد وصول مبرمجي النظام إلى مرافق قواعد البيانات."},{"key":"D","letter":"د","text":"استخدام تشفير للبيانات التي يتم نقلها عبر الإنترنت العامة."}],"explanation":"أ. خطأ لأنه عنصر تحكم منطقي أو إداري يتعلق بفصل المهام وليس عنصر تحكم فيزيائي.\n\nب. خطأ لأنه عنصر تحكم فيزيائي، لكنه لا يحقق الهدف المطلوب في هذا السياق مثل تقييد الوصول إلى المرافق الحساسة المرتبطة بقواعد البيانات.\n\nج. صحيح لأنه يحد من الوصول المادي إلى مرافق قواعد البيانات ويمنع الأشخاص غير المصرح لهم من الوصول إليها.\n\nد. خطأ لأنه عنصر تحكم تقني لحماية البيانات أثناء النقل وليس عنصر تحكم فيزيائي.","oldQNumber":"10","bankIndex":224,"setId":"set2"},{"id":"54","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"اي مما يلي يعتبر مصادقة ثنائية ؟","options":[{"key":"A","letter":"أ","text":"كلمة السر و رمز التعريف"},{"key":"B","letter":"ب","text":"كلمة المرور وبصمة اصبع"},{"key":"C","letter":"ج","text":"شبكية العين"},{"key":"D","letter":"د","text":"كاميرا ويب ومتصفح مغلق"}],"explanation":"أ خطا لأنه قد يمثل شيئين من نفس الفئة (معلومات/رموز) ولا يوضح تنوع عوامل المصادقة بشكل واضح.\nب صحيح لأنه يجمع بين عامل معرفة (كلمة المرور) وعامل بيومتري (بصمة الإصبع).\nج خطا لأنه يمثل عامل بيومتري واحد فقط وليس مصادقة ثنائية.\nد خطا لأنه لا يمثل عناصر مصادقة حقيقية.","oldQNumber":"15","bankIndex":225,"setId":"set2"},{"id":"59","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي مما يلي يعد أحد عناصر تحكم التطبيق المصممة للتأكد من عدم ترك الحقول المهمة دون إجابة؟","options":[{"key":"A","letter":"أ","text":"التحقق من الاكتمال"},{"key":"B","letter":"ب","text":"فحص الحقل"},{"key":"C","letter":"ج","text":"مجموع التجزئة"},{"key":"D","letter":"د","text":"فحص التوقيع"}],"explanation":"أ صحيح لأنه التحقق من الاكتمال يضمن إدخال جميع الحقول المطلوبة وعدم ترك الحقول المهمة فارغة.\nب خطأ لأنه فحص الحقل يتحقق من صحة البيانات المدخلة في الحقل وليس من وجودها.\nج خطأ لأنه مجموع التجزئة يستخدم للتحقق من سلامة البيانات واكتمال المعالجة.\nد خطأ لأنه فحص التوقيع يستخدم للتحقق من صحة التوقيع أو التفويض وليس اكتمال الحقول.","oldQNumber":"20","bankIndex":226,"setId":"set2"},{"id":"64","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"حدد المدقق الداخلي مسؤول قاعدة بيانات بدور مزدوج غير متوافق. ما هي الواجبات التالية التي لا ينبغي أن يقوم بها المسؤول المحدد؟","options":[{"key":"A","letter":"أ","text":"تصميم وصيانة قاعدة البيانات."},{"key":"B","letter":"ب","text":"تحضير بيانات الإدخال وصيانة قاعدة البيانات."},{"key":"C","letter":"ج","text":"صيانة قاعدة البيانات وتوفير أمانها."},{"key":"D","letter":"د","text":"مراجعة تقارير الاستخدام الشهرية فقط."}],"explanation":"أ. خطأ لأنه يمكن الجمع بين التصميم والصيانة في بعض البيئات مع وجود ضوابط رقابية.\n\nب. صحيح لأنه يجمع بين تحضير بيانات الإدخال وصيانة قاعدة البيانات، وهذا يمثل تعارضًا في المهام ويضعف الرقابة.\n\nج. خطأ لأنه يصف مهام تقنية وإدارية يمكن أن تكون ضمن نفس الدور مع ضوابط فصل مناسبة للمهام.\n\nد. خطأ لأنه مراجعة تقارير الاستخدام الشهرية فقط لا تمثل تعارضًا في المهام بل وظيفة رقابية محدودة.","oldQNumber":"25","bankIndex":227,"setId":"set2"},{"id":"69","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من الأطراف التالية من المرجح أن يكون مسؤولاً عن صيانة البنية التحتية المطلوبة لمنع فشل النسخ الاحتياطي الفوري لقاعدة بيانات؟","options":[{"key":"A","letter":"أ","text":"مسؤول قاعدة بيانات تكنولوجيا المعلومات."},{"key":"B","letter":"ب","text":"مدير مركز بيانات تكنولوجيا المعلومات."},{"key":"C","letter":"ج","text":"وظيفة خدمة مساعدة تكنولوجيا المعلومات."},{"key":"D","letter":"د","text":"مسؤول شبكة تكنولوجيا المعلومات."}],"explanation":"أ. صحيح لأنه مسؤول قاعدة البيانات (DBA) هو المسؤول عن إدارة قواعد البيانات وضمان عمل النسخ الاحتياطي والاستعادة بشكل صحيح ومباشر.\n\nب. خطأ لأن مدير مركز البيانات مسؤول عن البنية التحتية العامة وليس تفاصيل النسخ الاحتياطي للقاعدة نفسها.\n\nج. خطأ لأن خدمة المساعدة تقدم دعمًا للمستخدمين ولا تدير البنية التحتية للنسخ الاحتياطي.\n\nد. خطأ لأن مسؤول الشبكة يهتم بالاتصال والشبكات وليس بعمليات النسخ الاحتياطي لقواعد البيانات.","oldQNumber":"30","bankIndex":228,"setId":"set2"},{"id":"74","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من عناصر التحكم التالية ستكون الأكثر فعالية لحماية بيانات الأعمال من التلف، والخطأ والفساد؟","options":[{"key":"A","letter":"أ","text":"عناصر تحكم لضمان عدم القدرة على الوصول إلى البيانات بدون إذن."},{"key":"B","letter":"ب","text":"عناصر تحكم لحساب إجماليات الدفعة لتحديد أي خطأ قبل الموافقة على البيانات."},{"key":"C","letter":"ج","text":"عناصر تحكم لتشفير البيانات بحيث يكون التلف غير فعال على الأرجح."},{"key":"D","letter":"د","text":"عناصر تحكم لتحديد محاولات الاختراق الضارة بسرعة."}],"explanation":"أ. خطأ لأنه يركز على منع الوصول فقط وليس اكتشاف أخطاء البيانات أو فسادها.\n\nب. صحيح لأنه يستخدم عناصر تحكم كشفية مثل إجماليات الدفعة لاكتشاف الأخطاء والتلف قبل اعتماد البيانات.\n\nج. خطأ لأن التشفير يحمي السرية وليس سلامة البيانات من الأخطاء أو الفساد.\n\nد. خطأ لأنه يركز على كشف الهجمات وليس ضمان صحة البيانات نفسها.","oldQNumber":"35","bankIndex":229,"setId":"set2"},{"id":"79","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"كيف يتم حفظ البيانات والعناوين في قاعدة البيانات؟","options":[{"key":"A","letter":"أ","text":"القاموس"},{"key":"B","letter":"ب","text":"جدول."},{"key":"C","letter":"ج","text":"مكتبة العميل"},{"key":"D","letter":"د","text":"فهرس"}],"explanation":"أ خطا لأنه القاموس يستخدم لتخزين تعريفات البيانات وليس البيانات نفسها.\nب صحيح لأنه يتم حفظ البيانات داخل جداول في قاعدة البيانات.\nج خطا لأنه ليس مكونًا قياسيًا لتخزين البيانات في قواعد البيانات.\nد خطا لأنه الفهرس يستخدم لتسريع الوصول للبيانات وليس لتخزينها.","oldQNumber":"40","bankIndex":230,"setId":"set2"},{"id":"84","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"اي من الضوابط التالية اكثر امانا لمصادقة الوصول لجهاز ذكي ؟","options":[{"key":"A","letter":"أ","text":"مسح الاصبع"},{"key":"B","letter":"ب","text":"سؤال امان شخصي"},{"key":"C","letter":"ج","text":"استخدام النمط"},{"key":"D","letter":"د","text":"كلمة مرور قوية"}],"explanation":"أ صحيح لأنه مسح البصمة (أ) يعد من أقوى وسائل المصادقة البيومترية ويصعب تزويره مقارنة بالخيارات الأخرى.\nب خطا لأنه سؤال الأمان (ب) يمكن تخمينه أو الوصول إليه بسهولة.\nج خطا لأن النمط (ج) سهل التنبؤ أو التتبع.\nد خطا لأن كلمة المرور (د) رغم قوتها تبقى أقل أمانًا من المصادقة البيومترية.","oldQNumber":"45","bankIndex":231,"setId":"set2"},{"id":"89","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"تحتاج إحدى المنظمات إلى خوادم على الفور، ولكن ليس لديها وقت لإكمال عمليات الاستحواذ الرأسمالية. أي من خدمات السحابة التالية ستساعد في هذه الحالة؟","options":[{"key":"A","letter":"أ","text":"البنية التحتية كخدمة (IaaS)."},{"key":"B","letter":"ب","text":"المنصة كخدمة (PaaS)."},{"key":"C","letter":"ج","text":"المؤسسة كخدمة (EaaS)."},{"key":"D","letter":"د","text":"البرنامج كخدمة (SaaS)."}],"explanation":"أ. صحيح لأنه يوفر خوادم وبنية تحتية جاهزة للاستخدام دون الحاجة إلى شراء أجهزة جديدة.\n\nب. خطأ لأنه يوفر منصة لتطوير وتشغيل التطبيقات وليس خوادم بشكل أساسي.\n\nج. خطأ لأنه ليس نموذج الخدمة السحابية المناسب لتوفير الخوادم مباشرة.\n\nد. خطأ لأنه يوفر برامج جاهزة للاستخدام وليس خوادم أو بنية تحتية.","oldQNumber":"50","bankIndex":232,"setId":"set2"},{"id":"94","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من المخاطر التالية تشمل أفرادًا يهاجمون نظام تكنولوجيا المعلومات لشركة نفط كدليل على التضامن ضد الحفر في منطقة محلية؟","options":[{"key":"A","letter":"أ","text":"العبث"},{"key":"B","letter":"ب","text":"القرصنة (Hacking)"},{"key":"C","letter":"ج","text":"التصيد"},{"key":"D","letter":"د","text":"القرصنة (Piracy)"}],"explanation":"أ. خطأ لأن العبث يشير إلى التلاعب المادي أو غير المصرح به بالأنظمة وليس الهجمات الإلكترونية عبر الشبكة.\n\nب. صحيح لأن القرصنة (Hacking) هي الوصول غير المصرح به إلى أنظمة تكنولوجيا المعلومات، وقد تُستخدم لأغراض احتجاجية أو سياسية مثل الهجمات التضامنية.\n\nج. خطأ لأن التصيد يهدف إلى خداع المستخدمين للحصول على معلومات حساسة وليس مهاجمة النظام مباشرة.\n\nد. خطأ لأن القرصنة (Piracy) ترتبط غالبًا بنسخ أو توزيع غير قانوني للبرمجيات أو المحتوى وليس الهجمات على الأنظمة.","oldQNumber":"55","bankIndex":233,"setId":"set2"},{"id":"99","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من عناصر التحكم التالية هي الأكثر فعالية لضمان سرية المعلومات المنقولة؟","options":[{"key":"A","letter":"أ","text":"جدار الحماية."},{"key":"B","letter":"ب","text":"برنامج مكافحة الفيروسات."},{"key":"C","letter":"ج","text":"كلمات السر."},{"key":"D","letter":"د","text":"التشفير."}],"explanation":"أ. خطأ لأنه يتحكم في حركة المرور لكنه لا يضمن سرية البيانات نفسها أثناء النقل.\n\nب. خطأ لأنه يحمي من البرمجيات الخبيثة وليس سرية البيانات.\n\nج. خطأ لأن كلمات السر تتحكم في الوصول لكنها لا تحمي البيانات أثناء انتقالها.\n\nد. صحيح لأن التشفير يحمي سرية المعلومات أثناء نقلها عبر الشبكات ويمنع قراءتها من قبل غير المصرح لهم.","oldQNumber":"60","bankIndex":234,"setId":"set2"},{"id":"104","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"ما الخيار الذي يصف بشكل أفضل هجومًا إلكترونيًا في منتصف الطريق (man-in-the-middle cyber-attack)؟","options":[{"key":"A","letter":"أ","text":"يتمكن الجاني من حذف البيانات على الشبكة دون الوصول المادي إلى الجهاز."},{"key":"B","letter":"ب","text":"يستغل الجاني أنشطة الشبكة لأغراض غير مصرح بها."},{"key":"C","letter":"ج","text":"يتمكن الجاني من السيطرة على اتصال البيانات أثناء النقل واستبدال حركة المرور."},{"key":"D","letter":"د","text":"يقوم الجاني بتعطيل عناصر تحكم الأمان الافتراضية وإدخال نقاط ضعف إضافية."}],"explanation":"أ. خطأ لأنه يصف حذف بيانات وليس اعتراض الاتصال.\n\nب. خطأ لأنه وصف عام وغير محدد لهجوم MITM.\n\nج. صحيح لأنه هجوم “الرجل في الوسط” يعتمد على اعتراض الاتصال بين طرفين والتلاعب بالبيانات أثناء انتقالها.\n\nد. خطأ لأنه يتعلق بتعديل إعدادات أمنية وليس اعتراض الاتصال.","oldQNumber":"65","bankIndex":235,"setId":"set2"},{"id":"109","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي مما يلى صحيح دائمًا فيما يتعلق باستخدام خوارزميات التشفير القائمة على البنية التحتية للمفتاح العام PKI)؟","options":[{"key":"A","letter":"أ","text":"يستخدم PKI مسؤولاً مستقلاً لإدارة المفتاح العام"},{"key":"B","letter":"ب","text":"يقوم المفتاح الخاص بمصادقة كل طرف في المعاملة بشكل فريد."},{"key":"C","letter":"ج","text":"تتيح إمكانية الوصول العامة إلى البنية التحتية للمفاتيح العمومية استخدامها بسهولة في التجارة الإلكترونية"},{"key":"D","letter":"د","text":"يتم مصادقة المفتاح العمومي مقابل تحديد موثوق به من جهة خارجية"}],"explanation":"أ خطا لأنه PKI لا يعتمد على “مسؤول مستقل لإدارة المفتاح العام” بهذه الصياغة كقاعدة ثابتة.\nب صحيح لأنه المفتاح الخاص يستخدم في المصادقة والتوقيع الرقمي لإثبات هوية الطرف بشكل فريد.\nج خطا لأنه الوصول العام لا يعني أنها آلية تحقق أو مصادقة بحد ذاته.\nد خطا لأنه المصادقة تتم عبر شهادات رقمية موثوقة وليس بهذه الصياغة المباشرة للمفتاح العام.","oldQNumber":"70","bankIndex":236,"setId":"set2"},{"id":"114","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي مما يلى يعد ضابط ملموس فيزيائي في انظمة الدخول ؟","options":[{"key":"A","letter":"أ","text":"الرقم السري"},{"key":"B","letter":"ب","text":"مفتاح Token"},{"key":"C","letter":"ج","text":"اسم مستخدم المرور"},{"key":"D","letter":"د","text":"كلمة المرور"}],"explanation":"أ خطا لأنه معلومة معرفية (شيء تعرفه) وليس عنصرًا ماديًا.\nب صحيح لأنه جهاز مادي (Token) يُستخدم للتحقق من هوية المستخدم ويُعد ضابطًا فيزيائيًا.\nج خطا لأنه معرف حساب وليس عنصر تحقق مادي.\nد خطا لأنه كلمة مرور (شيء تعرفه) وليست عنصرًا فيزيائيًا.","oldQNumber":"75","bankIndex":237,"setId":"set2"},{"id":"119","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"بعد شراء الأحذية من متجر إلكتروني، استمر العميل في تلقي عروض إضافية غير مرغوب فيها من المتجر نفسه ومن متاجر أخرى تقدم منتجات مماثلة. أي مما يلي هو ضعف التحكم الأكثر احتمالًا الذي أظهره البائع؟","options":[{"key":"A","letter":"أ","text":"جمع المعلومات بشكل مفرط"},{"key":"B","letter":"ب","text":"تطبيق الهندسة الاجتماعية"},{"key":"C","letter":"ج","text":"الاحتفاظ بمعلومات غير مكتملة"},{"key":"D","letter":"د","text":"الكشف غير المصرح به عن المعلومات"}],"explanation":"أ خطا لأنه يشير إلى جمع بيانات أكثر من اللازم وليس سبب إرسال البيانات لجهات أخرى.\nب خطا لأنه يتعلق بخداع المستخدم وليس بحماية أو تسريب البيانات.\nج خطا لأنه يعني نقص أو عدم اكتمال البيانات وليس تسريبها.\nد صحيح لأنه يدل على مشاركة أو تسريب بيانات العميل لجهات أخرى بدون إذن مما أدى للعروض غير المرغوبة.","oldQNumber":"80","bankIndex":238,"setId":"set2"},{"id":"124","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي خطر يتم التعامل معه بشكل أكثر فعالية من خلال التشفير؟","options":[{"key":"A","letter":"أ","text":"خطر سلامة المعلومات"},{"key":"B","letter":"ب","text":"خطر الخصوصية"},{"key":"C","letter":"ج","text":"خطر الوصول"},{"key":"D","letter":"د","text":"خطر البرامج"}],"explanation":"أ. خطأ لأن سلامة المعلومات تُعالج أكثر بالهاش والتوقيعات الرقمية وليس التشفير فقط.\n\nب. صحيح لأن التشفير يحمي البيانات من الاطلاع غير المصرح به، وبالتالي يعالج خطر الخصوصية بشكل مباشر.\n\nج. خطأ لأن خطر الوصول يُعالج بالتحكم في الدخول والصلاحيات وليس التشفير.\n\nد. خطأ لأن خطر البرامج يتعلق بالبرمجيات وليس بالتشفير.","oldQNumber":"85","bankIndex":239,"setId":"set2"},{"id":"129","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين (IIA) بشأن تكنولوجيا المعلومات، أي مما يلي يصف بشكل أفضل التحكم المنطقي في الوصول؟","options":[{"key":"A","letter":"أ","text":"تتطلب إنشاء كلمات مرور معقدة وتغييرها ربع سنويًا"},{"key":"B","letter":"ب","text":"تتطلب بطاقات تمرير للتحكم في الدخول إلى مراكز البيانات الآمنة"},{"key":"C","letter":"ج","text":"مراقبة الوصول إلى مركز البيانات بمراقبة كاميرا الدائرة المغلقة"},{"key":"D","letter":"د","text":"الحفاظ على تعريفات الأدوار الحالية لضمان الفصل المناسب للمهام"}],"explanation":"أ. خطأ لأنه إجراء متعلق بسياسات كلمات المرور فقط ولا يمثل تعريفًا شاملاً للتحكم المنطقي في الوصول.\n\nب. خطأ لأنه تحكم فيزيائي (Physical Access Control) وليس منطقيًا.\n\nج. خطأ لأنه تحكم فيزيائي للمراقبة وليس تحكمًا منطقيًا.\n\nد. صحيح لأنه يعتمد على إدارة الأدوار والصلاحيات (Role-Based Access Control) لضمان الفصل المناسب للمهام ضمن الأنظمة، وهو من أهم عناصر التحكم المنطقي في الوصول.","oldQNumber":"90","bankIndex":240,"setId":"set2"},{"id":"134","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من العبارات التالية صحيحة فيما يتعلق باستخدام القياسات الحيوية ؟","options":[{"key":"A","letter":"أ","text":"لا يمكن تكرار القياسات الحيوية بسهولة"},{"key":"B","letter":"ب","text":"توفر القياسات الحيوية طريقة مضمونة للتحكم في الوصول."},{"key":"C","letter":"ج","text":"يمكن التعامل مع القياسات الحيوية لاجهزة USB لتوفير نسخة احتياطية آمنة ."},{"key":"D","letter":"د","text":"لا يمكن تغيير القياسات الحيوية"}],"explanation":"أ صحيح لأنه من الصعب جدًا تكرار الخصائص الحيوية مثل البصمة أو شبكية العين.\nب خطا لأنه لا توجد وسيلة مصادقة مضمونة 100% حتى القياسات الحيوية.\nج خطا لأنه لا يتم “نسخ” القياسات الحيوية كنسخة احتياطية آمنة على USB بهذه الطريقة.\nد خطا لأنه رغم صعوبة تغييرها، يمكن في بعض الحالات إعادة التسجيل أو تغيير بيانات النظام المرتبطة بها.","oldQNumber":"95","bankIndex":241,"setId":"set2"},{"id":"139","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"ما الذي يمكن اعتباره كفائدة محتملة لنظام تخطيط موارد المؤسسة على مستوى المؤسسة؟","options":[{"key":"A","letter":"أ","text":"معالجة المعاملات في الوقت الفعلي وإزالة تكرار البيانات."},{"key":"B","letter":"ب","text":"أقل أخطاء معالجة البيانات وتبادل بيانات أكثر كفاءة مع الشركاء التجاريين."},{"key":"C","letter":"ج","text":"استغلال الفرص وتخفيف المخاطر المرتبطة بالتجارة الإلكترونية."},{"key":"D","letter":"د","text":"دمج العمليات التجارية في بيئات تشغيل قواعد بيانات متعددة."}],"explanation":"أ صحيح لأنه أنظمة تخطيط موارد المؤسسة (ERP) توفر معالجة فورية للمعاملات وتقلل تكرار البيانات عبر توحيدها.\nب خطأ لأنه نتيجة محتملة لكن ليست الفائدة الأساسية الأشهر مقارنة بخيار أ.\nج خطأ لأنه يتعلق بالتجارة الإلكترونية وليس ERP بشكل مباشر.\nد خطأ لأنه ERP يهدف إلى توحيد الأنظمة وليس زيادة تعدد قواعد البيانات.","oldQNumber":"100","bankIndex":242,"setId":"set2"},{"id":"144","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي هو تحكم في برنامج النظام؟","options":[{"key":"A","letter":"أ","text":"تقييد الوصول إلى غرفة الخادم لأفراد معينين."},{"key":"B","letter":"ب","text":"وضع الخوادم التي تحتوي على برامج حساسة بعيداً عن المخاطر البيئية."},{"key":"C","letter":"ج","text":"التأكد من توثيق جميع متطلبات المستخدم."},{"key":"D","letter":"د","text":"إجراء اختبارات الاختراق بشكل منتظم."}],"explanation":"أ. خطأ لأنه تحكم فيزيائي يتعلق بالوصول للموقع وليس برنامج النظام.\n\nب. خطأ لأنه تحكم بيئي/فيزيائي لحماية الأجهزة وليس مرتبطًا بالبرمجيات.\n\nج. خطأ لأنه تحكم إداري يتعلق بمرحلة المتطلبات وليس التحكم في النظام نفسه.\n\nد. صحيح لأنه اختبار الاختراق (Penetration Testing) يُعد من ضوابط نظام التشغيل/البرامج بهدف تقييم أمن النظام وكشف الثغرات البرمجية والتقنية.","oldQNumber":"105","bankIndex":243,"setId":"set2"},{"id":"149","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"بماذا يجب أن يكون المراجعون الداخليون منتبهين عند مراجعة موافقة البيانات الشخصية وإدارة عملية الاشتراك / إلغاء الاشتراك؟","options":[{"key":"A","letter":"أ","text":"سواء يُطلب من العملاء تجديد موافقتهم على معالجة بياناتهم كل ثلاثة أشهر على الأقل."},{"key":"B","letter":"ب","text":"ما إذا تمت معالجة البيانات الخاصة وفقًا للغرض الذي تم الحصول على الموافقة من أجله."},{"key":"C","letter":"ج","text":"ما إذا كانت المنظمة قد وضعت سياسات واضحة وعلى مستوى الكيان بشأن نقل البيانات إلى جهات خارجية."},{"key":"D","letter":"د","text":"ما إذا كان لدى العملاء فرصة لرفض حق نسيانهم من سجلات وأنظمة المؤسسة."}],"explanation":"أ. خطأ لأنه لا يوجد شرط عام بضرورة تجديد الموافقة كل ربع سنة.\nب. صحيح لأنه يجب استخدام البيانات فقط للغرض الذي وافق عليه صاحب البيانات.\nج. خطأ لأنه يتعلق بنقل البيانات إلى جهات خارجية وليس بإدارة الموافقة بشكل مباشر.\nد. خطأ لأنه حق محو البيانات حق قانوني ولا يتعلق بمراجعة الموافقة على المعالجة.","oldQNumber":"110","bankIndex":244,"setId":"set2"},{"id":"154","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"اي من مميزات البرنامج التطبيقي التالية هي اقل عنصر رقابة لحماية كلمات المرور؟","options":[{"key":"A","letter":"أ","text":"تعليق معرفات المستخدم بعد المحاولات المتكررة للمستخدم لتسجيل الدخول باستخدام كلمة مرور غير صالحة ."},{"key":"B","letter":"ب","text":"تشفير كلمات المرور قبل ارسالها او تخزينها ."},{"key":"C","letter":"ج","text":"تسجيل الخروج التلقائي للمستخدمين غير النشطين بعد فترة زمنية محددة من عدم النشاط."},{"key":"D","letter":"د","text":"التغيير الاجباري لكلمة المرور بعد عدد محدد من الايام."}],"explanation":"أ خطا لأنه يحمي من محاولات التخمين ويعتبر تحكم قوي.\nب خطا لأنه يوفر حماية قوية لكلمات المرور أثناء النقل والتخزين.\nج خطا لأنه يقلل من مخاطر الوصول غير المصرح به عند ترك الجلسة مفتوحة.\nد صحيح لأنه أقل فعالية نسبياً مقارنة بباقي الضوابط الأخرى لحماية كلمات المرور.","oldQNumber":"115","bankIndex":245,"setId":"set2"},{"id":"159","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"الفصل بين الواجبات يعتبر من اهم ضوابط انظمة المعلومات ضمن أي من الضوابط يندرج هذا النوع ؟","options":[{"key":"A","letter":"أ","text":"الضوابط التنظيمية والادارية"},{"key":"B","letter":"ب","text":"ضوابط الوصول المادي"},{"key":"C","letter":"ج","text":"ضوابط الوصول الرقمي"},{"key":"D","letter":"د","text":"ضوابط التطبيقات"}],"explanation":"أ صحيح لأنه فصل الواجبات يعد من الضوابط الإدارية والتنظيمية التي تهدف لتقليل تضارب المصالح.\nب خطا لأنه يختص بحماية الأماكن والأصول المادية وليس توزيع المهام.\nج خطا لأنه يتعلق بالوصول المنطقي للأنظمة وليس بتقسيم المسؤوليات.\nد خطا لأنه يركز على ضوابط داخل التطبيقات وليس على تنظيم الصلاحيات بين الأفراد.","oldQNumber":"120","bankIndex":246,"setId":"set2"},{"id":"164","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"تسمح منظمة متعددة الجنسيات لموظفيها بالوصول إلى بريد العمل عبر أجهزة ذكية شخصية. ومع ذلك، يُطلب من المستخدمين الموافقة على تثبيت برنامج إدارة الأجهزة المحمولة (MDM) الذي سيقوم بمسح البيانات عن بُعد في حالة السرقة أو وقوع حوادث أخرى. ما الذي يجب أن تضمنه المنظمة مقابل موافقة الموظفين؟","options":[{"key":"A","letter":"أ","text":"أنه لا يمكن أن يكون لحاملي البريد الإلكتروني حساب بريد إلكتروني إذا لم يوافقوا على برنامج."},{"key":"B","letter":"ب","text":"لا يمكن الوصول إلى البيانات الشخصية على الجهاز وحذفها من قبل مسؤولي النظام."},{"key":"C","letter":"ج","text":"يتم مراقبة أنشطة الموظفين عبر الإنترنت بطريقة سرية لتجنب إزعاجهم."},{"key":"D","letter":"د","text":"تشمل موافقة الموظفين تنازلات مناسبة بشأن الانتهاكات المحتملة لخصوصيتهم."}],"explanation":"أ. خطأ لأنه شرط غير مرتبط مباشرة بحماية الخصوصية أو إدارة الأجهزة.\n\nب. صحيح لأنه يجب أن تضمن المنظمة فصل وحماية البيانات الشخصية بحيث لا يتمكن مسؤولو النظام من الوصول إليها أو حذفها عند استخدام برنامج MDM.\n\nج. خطأ لأن المراقبة السرية غير مقبولة أخلاقياً وقانونياً دون إفصاح.\n\nد. خطأ لأن الموافقة يجب أن تكون مبنية على فهم واضح وليس “تنازلات” غير محددة أو مفتوحة على انتهاك الخصوصية.","oldQNumber":"125","bankIndex":247,"setId":"set2"},{"id":"169","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي مما يلي يصف المجموعة الأكثر ملاءمة من الاختبارات لمراجعة عناصر تحكم الوصول المنطقي لمحطة عمل؟","options":[{"key":"A","letter":"أ","text":"مراجعة قائمة الأشخاص الذين لديهم شارات دخول إلى الغرفة التي تحتوي على محطة العمل وسجل لأولئك الذين دخلوا الغرفة."},{"key":"B","letter":"ب","text":"مراجعة طول كلمة المرور وتواتر تغييرها وقائمة المستخدمين لعملية تسجيل الدخول إلى محطة العمل."},{"key":"C","letter":"ج","text":"مراجعة قائمة الأشخاص الذين حاولوا الوصول إلى محطة العمل وفشلوا، بالإضافة إلى رسائل الخطأ."},{"key":"D","letter":"د","text":"مراجعة كلمات مرور الأشخاص الذين حاولوا الوصول إلى محطة العمل دون جدوى وسجل نشاطهم."}],"explanation":"أ. خطأ لأنه يتعلق بالوصول الفيزيائي وليس المنطقي (Logical Access).\n\nب. صحيح لأنه يختبر عناصر التحكم المنطقية مثل سياسة كلمة المرور، طولها، وتكرار تغييرها، إضافة إلى إدارة المستخدمين.\n\nج. خطأ لأنه يركز على محاولات فاشلة فقط وليس على عناصر التحكم نفسها.\n\nد. خطأ لأنه يتضمن معلومات حساسة وغير منطقية مثل عرض كلمات المرور نفسها.","oldQNumber":"130","bankIndex":248,"setId":"set2"},{"id":"174","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"ما الذي يتحسن من خلال استخدام الأجهزة الذكية؟","options":[{"key":"A","letter":"أ","text":"التحكم في الإصدارات"},{"key":"B","letter":"ب","text":"الخصوصية"},{"key":"C","letter":"ج","text":"قابلية النقل"},{"key":"D","letter":"د","text":"المصادقة الآمنة"}],"explanation":"أ خطا لأنه لا يرتبط بشكل مباشر بتحسين التحكم في الإصدارات عند استخدام الأجهزة الذكية.\nب خطا لأنه استخدام الأجهزة الذكية قد يؤثر على الخصوصية وليس يحسنها بشكل مباشر.\nج صحيح لأنه الأجهزة الذكية تتميز بسهولة الحمل والاستخدام في أي مكان مما يزيد قابلية النقل.\nد خطا لأنه المصادقة الآمنة تعتمد على أنظمة حماية وليس مجرد استخدام الأجهزة الذكية.","oldQNumber":"135","bankIndex":249,"setId":"set2"},{"id":"179","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"تقوم المراجعة الداخلية بتقييم المخاطر المتعلقة بسياسة الأجهزة المحمولة للمؤسسة. تلاحظ أن المؤسسة تسمح لأطراف ثالثة (البائعين والزائرين) باستخدام أجهزة ذكية خارجية للوصول إلى شبكاتها وأنظمتها الخاصة. أي نوع من مخاطر الأجهزة الذكية الأكثر في إثارة القلق لدى المدقق الداخلي؟","options":[{"key":"A","letter":"أ","text":"الامتثال."},{"key":"B","letter":"ب","text":"الخصوصية."},{"key":"C","letter":"ج","text":"استراتيجي."},{"key":"D","letter":"د","text":"الأمن المادي."}],"explanation":"أ. خطأ لأن مخاطر الامتثال تتعلق بالقوانين واللوائح، وليس استخدام أجهزة خارجية بحد ذاته.\n\nب. صحيح لأن السماح لأطراف خارجية باستخدام أجهزة للوصول إلى أنظمة المؤسسة يرفع بشكل كبير مخاطر انتهاك الخصوصية وتسرب البيانات.\n\nج. خطأ لأن المخاطر الاستراتيجية تتعلق بأهداف المؤسسة طويلة المدى وليس الوصول التقني المباشر.\n\nد. خطأ لأن الأمن المادي يتعلق بحماية المواقع والأجهزة الملموسة وليس الوصول عبر الأجهزة الذكية.","oldQNumber":"140","bankIndex":250,"setId":"set2"},{"id":"184","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"ما أفصل الضوابط لحماية الأجهزة الذكية ؟","options":[{"key":"A","letter":"أ","text":"المصادقة"},{"key":"B","letter":"ب","text":"المحو عن بعد"},{"key":"C","letter":"ج","text":"تشفير الجهاز"},{"key":"D","letter":"د","text":"تشفير البرامج"}],"explanation":"أ صحيح لأنه المصادقة تمنع الوصول غير المصرح به إلى الجهاز وتعتبر خط الدفاع الأول.\nب خطا لأنه يستخدم كإجراء طارئ بعد فقدان الجهاز وليس حماية أولية.\nج خطا لأنه يحمي البيانات لكنه لا يمنع الدخول إلى الجهاز إذا تم اختراقه.\nد خطا لأنه غير شائع كضابط أساسي لحماية الأجهزة الذكية.","oldQNumber":"145","bankIndex":251,"setId":"set2"},{"id":"189","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"تتلقى مؤسسة مالية طلبات بريد إلكتروني متكررة ومتنوعة من العملاء لتحويل الأموال من حساباتهم. أي إجراء من شأنه أن يساعد المؤسسة بشكل أفضل على تجنب الوقوع ضحية لتصيد البيانات الاحتيالي؟","options":[{"key":"A","letter":"أ","text":"مراجعة نشاط تحويل العميل لتحديد ما إذا كان الطلب نموذجيًا."},{"key":"B","letter":"ب","text":"الاتصال بالعميل على رقم الهاتف المسجل للتحقق من صحة الطلب."},{"key":"C","letter":"ج","text":"الرد على العميل عبر البريد الإلكتروني للتحقق من المرسل والطلب."},{"key":"D","letter":"د","text":"مراجعة سجل العميل للتحقق مما إذا كان العميل قد صرح بطلبات التحويل من عنوان البريد الإلكتروني هذا."}],"explanation":"أ. خطأ لأنه يساعد في كشف الأنماط لكنه لا يمنع الاحتيال مباشرة.\n\nب. صحيح لأنه إجراء تحقق مستقل عبر قناة موثوقة (رقم الهاتف المسجل) مما يقلل بشكل كبير من خطر التصيد الاحتيالي.\n\nج. خطأ لأن الرد عبر نفس قناة البريد الإلكتروني غير آمن وقد يكون مزيفًا.\n\nد. خطأ لأنه يعتمد على البريد الإلكتروني نفسه وبالتالي لا يضمن التحقق من هوية العميل.","oldQNumber":"150","bankIndex":252,"setId":"set2"},{"id":"194","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"قررت إحدى المؤسسات السماح لمديريها باستخدام هواتفهم الذكية في العمل. مع هذا التغيير، أي مما يلي هو الاكثر أهمية الذي يجب تضمينه لقسم تكنولوجيا المعلومات؟","options":[{"key":"A","letter":"أ","text":"الوثائق المطلوبة لعملية التوقف عن استخدام الاجهزة"},{"key":"B","letter":"ب","text":"مطلوب إزالة الصور الشخصية وجهات الاتصال"},{"key":"C","letter":"ج","text":"التوثيق المطلوب لانتهاء العقد مع مقدم الخدمة"},{"key":"D","letter":"د","text":"التوقيع المطلوب على بيان تضارب المصالح"}],"explanation":"أ صحيح لأنه وجود إجراءات موثقة لإنهاء استخدام الأجهزة (Offboarding/Deprovisioning) ضروري لضمان حماية بيانات المؤسسة عند توقف الاستخدام.\nب خطأ لأنه يتعلق بالبيانات الشخصية وليس بضوابط إدارة تقنية المعلومات الأساسية.\nج خطأ لأنه يخص إدارة العقود وليس الاستخدام التشغيلي للأجهزة.\nد خطأ لأنه إجراء إداري عام ولا يرتبط مباشرة بإدارة الأجهزة الذكية في بيئة العمل.","oldQNumber":"155","bankIndex":253,"setId":"set2"},{"id":"199","form":"form3","formTitle":"Group 3","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"يناقش مدقق داخلي مع مسؤول قاعدة البيانات كلمات المرور الافتراضية المحددة من قبل المستخدم. سيتم إعادة تعيين هذه الكلمات المرور بمجرد تسجيل المستخدم للمرة الأولى، ولكن القيمة الأولية لكلمة المرور محددة على \"123456\" ما هي الأمور التي يناقشها المراجع ومسؤول قاعدة البيانات على الأرجح في هذه الحالة؟","options":[{"key":"A","letter":"أ","text":"ما إذا كان استبدال القيم الرقمية بأحرف سيكون أكثر أمانًا."},{"key":"B","letter":"ب","text":"ما يحدث في الحالات التي يستمر فيها المستخدمون في استخدام كلمة المرور الأولية."},{"key":"C","letter":"ج","text":"ما يحدث في الفترة بين إنشاء الحساب وتغيير كلمة المرور."},{"key":"D","letter":"د","text":"ما إذا كان يجب تدريب المستخدمين على ميزات ومتطلبات إدارة كلمات المرور."}],"explanation":"أ خطا لأنه لا يعالج المشكلة الأساسية المتعلقة باستخدام كلمة مرور افتراضية ضعيفة.\nب صحيح لأنه الخطر الرئيسي هو احتمال بقاء المستخدم على كلمة المرور الافتراضية الضعيفة.\nج خطا لأنه فترة قصيرة مؤقتة وليست المشكلة الأساسية.\nد خطا لأنه توعوي وليس مرتبطًا مباشرة بمشكلة كلمة المرور الافتراضية.","oldQNumber":"160","bankIndex":254,"setId":"set2"},{"id":"208","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"A","question":"يرغب مصنع يبيع منتجاته إلى فرع تابع له في الخارج بتحديد سعر يقلل من الرسوم الجمركية على الواردات. ما هو أفضل مسار عمل للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"خفض سعر التحويل."},{"key":"B","letter":"ب","text":"زيادة سعر التحويل."},{"key":"C","letter":"ج","text":"فرض سعر معاملات السوق."},{"key":"D","letter":"د","text":"فرض سعر النقل الأمثل"}],"explanation":"أ. صحيح لأنه خفض سعر التحويل يقلل قيمة الواردات وبالتالي يقلل الرسوم الجمركية.\n\nب. خطأ لأنه زيادة سعر التحويل تؤدي إلى زيادة الرسوم الجمركية.\n\nج. خطأ لأنه سعر السوق لا يحقق هدف تقليل الرسوم بالضرورة.\n\nد. خطأ لأنه ليس أسلوبًا قياسيًا في تسعير التحويل.","oldQNumber":"7","bankIndex":255,"setId":"set3"},{"id":"213","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"B","question":"قام موظف جديد في قسم المحاسبة الإدارية بتطبيق طريقة عالية-منخفضة وحساب الفرق بين مستويات تكاليف الصيانة العالية والمنخفضة. ما نوع تكاليف الصيانة التي حددها الموظف؟","options":[{"key":"A","letter":"أ","text":"تكاليف صيانة ثابتة."},{"key":"B","letter":"ب","text":"تكاليف صيانة متغيرة."},{"key":"C","letter":"ج","text":"تكاليف صيانة مختلطة."},{"key":"D","letter":"د","text":"تكاليف صيانة غير مباشرة."}],"explanation":"أ. خطأ لأنه التكاليف الثابتة لا تتغير بين المستويات العالية والمنخفضة.\n\nب. صحيح لأنه طريقة العالية والمنخفضة تعتمد على الفرق بين المستويات لتحديد الجزء المتغير من التكلفة.\n\nج. خطأ لأنه التكاليف المختلطة تحتوي على ثابت ومتغير وليس ما تم تحديده هنا فقط.\n\nد. خطأ لأنه التصنيف غير المباشر لا يحدد سلوك التكلفة.","oldQNumber":"12","bankIndex":256,"setId":"set3"},{"id":"218","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بالسندات؟","options":[{"key":"A","letter":"أ","text":"لا يتمتع حملة السندات بحقوق تصويت ولكنهم يحصلون على السيطرة المؤسسية عبر مدفوعات الفوائد."},{"key":"B","letter":"ب","text":"نادرا ما تستخدم السندات غير المضمونة من قبل المنظمات ذات التصنيفات الائتمانية الجيدة."},{"key":"C","letter":"ج","text":"يتضمن استخدام السندات دفع فوائد بشكل دوري وسداد أصل الدين في تاريخ الاستحقاق."},{"key":"D","letter":"د","text":"تكون السندات غير المضمونة مدعومة بأصول محددة تقدمها المنظمة كضمان."}],"explanation":"أ. خطأ لأنه حملة السندات لا يحصلون على “سيطرة مؤسسية” وإنما فقط فوائد ثابتة.\n\nب. خطأ لأنه الشركات ذات التصنيف الجيد يمكنها استخدام السندات غير المضمونة بسهولة.\n\nج. صحيح لأنه السندات تتضمن دفع فوائد دورية وإعادة أصل الدين عند الاستحقاق.\n\nد. خطأ لأنه السندات غير المضمونة ليست مدعومة بأصول محددة.","oldQNumber":"17","bankI
