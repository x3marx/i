ndex":257,"setId":"set3"},{"id":"223","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"A","question":"يعتقد رئيس قسم البحث والتطوير في مؤسسة تصنيعية أن فريقه يفتقر إلى الخبرة في بعض المجالات، ويقرر توظيف باحثين أكثر خبرة للمساعدة في تطوير منتج جديد. أي من التباينات التالية من المحتمل أن تحدث نتيجة لهذا القرار؟\n\n١.انحراف ايجابي لكفاءة العمل.\n\n٢.انحراف سلبي لسعر العمالة.\n\n٣.انحراف سلبي لكفاءة العمل.\n\n٤.انحراف ايجابي لسعر العمالة","options":[{"key":"A","letter":"أ","text":"1 و 2"},{"key":"B","letter":"ب","text":"1 و 4"},{"key":"C","letter":"ج","text":"3 و 4"},{"key":"D","letter":"د","text":"2 و 3"}],"explanation":"١- صحيح لأنه توظيف باحثين أكثر خبرة قد يؤدي إلى تحسين الأداء وزيادة الإنتاجية مقارنة بالمعايير، مما ينتج عنه انحراف إيجابي لكفاءة العمل.\n٢- صحيح لأنه توظيف عمالة أكثر خبرة غالبًا يكون بتكلفة أعلى من المخطط له، مما يؤدي إلى انحراف سلبي لسعر العمالة.\n٣- خطأ لأنه مع زيادة الخبرة يُتوقع تحسن الكفاءة وليس انخفاضها.\n٤- خطأ لأنه رغم ارتفاع الأجور المحتمل، فإن هذا لا يمثل انحرافًا إيجابيًا لسعر العمالة بل يكون عادة انحرافًا سلبيًا عند زيادة التكلفة عن المعيار.","oldQNumber":"22","bankIndex":258,"setId":"set3"},{"id":"228","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"A","question":"ما هو أفضل وصف للاهلاك؟","options":[{"key":"A","letter":"أ","text":"إنها عملية توزيع تكلفة الأصول بين الفترات."},{"key":"B","letter":"ب","text":"إنها عملية تقييم الأصول."},{"key":"C","letter":"ج","text":"إنها عملية تجميع الأموال الكافية لاستبدال الأصول."},{"key":"D","letter":"د","text":"إنها عملية قياس انخفاض قيمة الأصول بسبب التقادم."}],"explanation":"أ. صحيح لأنه الإهلاك هو توزيع تكلفة الأصل على عمره الإنتاجي عبر الفترات المحاسبية.\n\nب. خطأ لأنه ليس عملية تقييم للأصول بل توزيع للتكلفة.\n\nج. خطأ لأنه لا يتعلق بتجميع أموال لاستبدال الأصول.\n\nد. خطأ لأنه ليس قياسًا مباشرًا لانخفاض القيمة بل توزيع للتكلفة.","oldQNumber":"27","bankIndex":259,"setId":"set3"},{"id":"233","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"A","question":"متى يهتم المدقق بسياسة الائتمانية؟","options":[{"key":"A","letter":"أ","text":"متوسط فترة التحصيل 67 يوم"},{"key":"B","letter":"ب","text":"عدد ايام المخزون 89 يوم"},{"key":"C","letter":"ج","text":"متوسط فترة التحصيل 6 اسابيع."},{"key":"D","letter":"د","text":"عدد ايام المخزون 10 أسابيع"}],"explanation":"أ. صحيح لأنه متوسط فترة التحصيل يقيس سرعة تحصيل الذمم المدينة وهو مرتبط مباشرة بسياسة الائتمان.\n\nب. خطأ لأنه يتعلق بإدارة المخزون وليس سياسة الائتمان.\n\nج. خطأ لأنه نفس مفهوم التحصيل لكن لا يوجد ما يدل على مشكلة محددة بدون معيار مقارنة.\n\nد. خطأ لأنه يتعلق بدورة المخزون وليس بسياسة الائتمان.","oldQNumber":"32","bankIndex":260,"setId":"set3"},{"id":"238","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"متى تسجل الشركة دخلا او ارباحا من استثمار في الأسهم العادية ؟","options":[{"key":"A","letter":"أ","text":"تشتري السندات"},{"key":"B","letter":"ب","text":"تستقبل فائدة."},{"key":"C","letter":"ج","text":"تتلقى توزيعات أرباح"},{"key":"D","letter":"د","text":"تبيع السندات."}],"explanation":"أ. خطأ لأنه شراء السندات يمثل استثمارًا وليس تحقيق دخل.\n\nب. خطأ لأن الفائدة ترتبط عادة بالسندات وليس بالأسهم العادية.\n\nج. صحيح لأنه يتم تسجيل الدخل من استثمار الأسهم العادية عند استلام توزيعات الأرباح.\n\nد. خطأ لأنه بيع السندات يمثل عملية تصفية استثمار وليس تحقيق دخل من الأسهم العادية.","oldQNumber":"37","bankIndex":261,"setId":"set3"},{"id":"243","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"أي من السيناريوهات التالية يشير إلى استخدام فعال للرافعة المالية؟","options":[{"key":"A","letter":"أ","text":"منظمة لديها معدل عائد على حقوق الملكية 20٪ ومعدل عائد على الأصول 15٪."},{"key":"B","letter":"ب","text":"منظمة لديها نسبة تداول حالية 2 ومعدل دوران مخزون 12."},{"key":"C","letter":"ج","text":"منظمة لديها نسبة دين إلى إجمالي الأصول 0.2 ونسبة تغطية الفائدة 10."},{"key":"D","letter":"د","text":"منظمة لديها هامش ربح 30٪ ومعدل دوران أصول 7٪."}],"explanation":"أ. خطأ لأنه يوضح وجود رافعة مالية (ROE > ROA) لكن لا يقيس الأمان المالي أو فعالية استخدام الدين بشكل مباشر.\n\nب. خطأ لأنه يتعلق بالسيولة وكفاءة المخزون وليس الرافعة المالية.\n\nج. صحيح لأنه يعكس استخدامًا منخفض المخاطر للديون مع قدرة عالية على تغطية الفوائد مما يدل على رافعة مالية فعالة.\n\nد. خطأ لأنه يركز على الربحية وكفاءة الأصول وليس على هيكل التمويل أو الرافعة المالية.","oldQNumber":"42","bankIndex":262,"setId":"set3"},{"id":"248","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"D","question":"تقوم لجنة الاستثمار بفحص مشاريع تطوير أي من المشاريع سوف يجتاز الفحص الاولي إذا كان متوسط التكلفة المرجحة لرأس المال 15%؟","options":[{"key":"A","letter":"أ","text":"مشاريع يقدر معدل العائد الداخلي فيها 15% والقيمة الحالية الصافية صفر."},{"key":"B","letter":"ب","text":"مشاريع يقدر معدل العائد الداخلي أقل 15% والقيمة الحالية الصافية موجبة."},{"key":"C","letter":"ج","text":"مشاريع يقدر معدل العائد الداخلي أكثر من 15% والقيمة الحالية الصافية سالبة."},{"key":"D","letter":"د","text":"مشاريع يقدر معدل العائد الداخلي أكثر من 15% والقيمة الحالية الصافية موجبة."}],"explanation":"أ. خطأ لأنه عند IRR = 15% و NPV = 0 يكون المشروع على الحد وليس أفضل خيار للقبول.\n\nب. خطأ لأنه IRR أقل من تكلفة رأس المال مع NPV موجبة تعطي تناقض غير منطقي في التقييم.\n\nج. خطأ لأنه IRR أعلى من تكلفة رأس المال مع NPV سالبة غير مقبول.\n\nد. صحيح لأنه المشروع يُقبل عندما يكون معدل العائد الداخلي أعلى من تكلفة رأس المال وتكون القيمة الحالية الصافية موجبة.","oldQNumber":"47","bankIndex":263,"setId":"set3"},{"id":"253","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"قام مستثمران بتأسيس شراكة حيث قدم الشريك الأول نقدًا بقيمة 1000 دولار وأصلًا تكلفته 10000 دولار مع استهلاك تراكمي قدره 2000 دولار، وتم الاتفاق على أن القيمة العادلة لهذا الأصل تساوي 9000 دولار. وقدم الشريك الثاني أصلًا بقيمة 9000 دولار ونقدًا مستحق القبض بقيمة 3000 دولار. ما إجمالي رأس مال الشراكة عند التأسيس؟","options":[{"key":"A","letter":"أ","text":"20000 دولار."},{"key":"B","letter":"ب","text":"21000 دولار."},{"key":"C","letter":"ج","text":"22000 دولار."},{"key":"D","letter":"د","text":"23000 دولار."}],"explanation":"أ. خطأ لأنه لا يعكس إعادة تقييم الأصول بالقيمة العادلة.\n\nب. خطأ لأنه أقل من إجمالي المساهمات الفعلية للشركاء.\n\nج. صحيح لأنه يتم تسجيل أصول الشراكة بالقيمة العادلة:\nالشريك الأول = 1000 + 9000 = 10000\nالشريك الثاني = 9000 + 3000 = 12000\nالإجمالي = 22000 دولار.\n\nد. خطأ لأنه مبالغ فيه ولا يطابق قيمة المساهمات المعدلة.","oldQNumber":"52","bankIndex":264,"setId":"set3"},{"id":"258","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"اشترت الشركة أصلاً وسجلته حسب التكلفة التاريخية نقص سعر هذا الأصل العام التالي وقامت الشركة بإعادة تقييم هذا الأصل حسب السعر الحالي أي مما يلي قامت به الشركة؟","options":[{"key":"A","letter":"أ","text":"الشفافية"},{"key":"B","letter":"ب","text":"الاتساق"},{"key":"C","letter":"ج","text":"التحفظ -المحافظة"},{"key":"D","letter":"د","text":"الاستهلاك"}],"explanation":"أ. خطأ لأنه الشفافية تتعلق بالإفصاح وليس بإعادة تقييم الأصول.\n\nب. خطأ لأنه الاتساق يعني الثبات في تطبيق السياسات المحاسبية وليس تغيير التقييم.\n\nج. صحيح لأنه التحفظ (المحافظة) يعني أخذ الخسائر المحتملة بعين الاعتبار مثل انخفاض قيمة الأصل.\n\nد. خطأ لأنه الاستهلاك يتعلق بتوزيع تكلفة الأصل وليس إعادة تقييمه.","oldQNumber":"57","bankIndex":265,"setId":"set3"},{"id":"263","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"B","question":"ما هي الشركة الاضعف في القدرة على سداد التزاماتها قصيرة الاجل؟","options":[{"key":"A","letter":"أ","text":"المؤسسة 1: الاصول المتداولة 1200000 والالتزامات 300000"},{"key":"B","letter":"ب","text":"المؤسسة 2: الاصول المتداولة 1300000 والالتزامات 1000000"},{"key":"C","letter":"ج","text":"المؤسسة 3: الاصول المتداولة 900000 والالتزامات 300000 المؤسسة"},{"key":"D","letter":"د","text":"المؤسسة4: الاصول المتداولة 600000 والالتزامات 300000"}],"explanation":"أ. خطأ لأنه نسبة التداول = 1200000 ÷ 300000 = 4 وهي ليست الأضعف.\n\nب. صحيح لأنه نسبة التداول = 1300000 ÷ 1000000 = 1.3 وهي الأقل وبالتالي الأضعف في القدرة على السداد.\n\nج. خطأ لأنه نسبة التداول = 900000 ÷ 300000 = 3 وهي أفضل من المؤسسة 2.\n\nد. خطأ لأنه نسبة التداول = 600000 ÷ 300000 = 2 وهي أعلى من المؤسسة 2.\n\n ( طريقة الحل هي : تحسب نسبة التداول بتقسيم الأصول المتداولة على الخصوم المتداولة وأصغر رقم هو الأبطأ في تسديد الديون)","oldQNumber":"62","bankIndex":266,"setId":"set3"},{"id":"268","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"تنتج منظمة أخشاب جاهزة لصناعة البناء. أي من طرق تقييم المخزون التالية ستؤدي إلى أعلى ربح، بافتراض ثبات جميع المتغيرات الأخرى خلال فترة ارتفاع تكاليف المواد؟","options":[{"key":"A","letter":"أ","text":"طريقة المتوسط التكلفة (Weighted Average Method)"},{"key":"B","letter":"ب","text":"طريقة التكلفة الرمجحة (Weighted Cost Method)"},{"key":"C","letter":"ج","text":"طريقة الوارد أولاً يصرف أولاً (First-In, First-Out - FIFO)"},{"key":"D","letter":"د","text":"التعريف المحدد (Specific Identification)"}],"explanation":"ا. خطأ لأنه المتوسط يؤدي إلى توزيع متوسط للتكاليف ولا يعطي أعلى ربح في ارتفاع الأسعار\nب. خطأ لأنه نفس فكرة المتوسط ولا يعكس انخفاض تكلفة المبيعات بشكل يسمح بأعلى ربح\nج. صحيح لأنه FIFO يخرج التكاليف الأقدم والأقل أثناء ارتفاع الأسعار مما يقلل تكلفة البضاعة المباعة ويزيد الربح\nد. خطأ لأنه يعتمد على تحديد كل وحدة بشكل منفصل ولا يؤدي عادة لأعلى ربح في هذه الحالة","oldQNumber":"67","bankIndex":267,"setId":"set3"},{"id":"273","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"A","question":"أي من التكاليف التالية سيتم تكبدها في المخزون؟","options":[{"key":"A","letter":"أ","text":"فقد (خسارة) المبيعات ، فقد (خسارة) العملاء ، الطلب المتأخر"},{"key":"B","letter":"ب","text":"فقد المبيعات وفقدان العملاء والمخزون الآمن ."},{"key":"C","letter":"ج","text":"العملاء المفقودون ، ومخزون السلامة ، والأمر المتأخر"},{"key":"D","letter":"د","text":"المبيعات المفقودة ، مخزون السلامة ، والطلب المتأخر"}],"explanation":"١- صحيحة: لأن نقص المخزون قد يؤدي إلى فقد المبيعات، وفقد العملاء، وتأخر تلبية الطلبات (الطلبات المتأخرة)، وهي من التكاليف المرتبطة بإدارة المخزون.\n\n٢- خاطئة: لأن المخزون الآمن ليس تكلفة ناتجة عن نقص المخزون، بل هو وسيلة لتقليل مخاطر نفاد المخزون.\n\n٣- خاطئة: لأن مخزون السلامة يُعد إجراءً وقائيًا، وليس تكلفة تنتج عن نقص المخزون.\n\n٤- خاطئة: لأن مخزون السلامة ليس من تكاليف نقص المخزون، وإنما يُستخدم لتجنب هذه التكاليف.","oldQNumber":"72","bankIndex":268,"setId":"set3"},{"id":"278","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"انتقال منظمة بنسبة تحويل المبيعات من ٪5 إلى ٪12 يشير إلى أي مما يلي؟","options":[{"key":"A","letter":"أ","text":"نشاط مبيعات أسوأ."},{"key":"B","letter":"ب","text":"استخدام أفضل للمخزون."},{"key":"C","letter":"ج","text":"نشاط مبيعات أفضل."},{"key":"D","letter":"د","text":"استخدام أسوأ للمخزون"}],"explanation":"أ. خطأ لأنه ارتفاع نسبة التحويل لا يدل على تدهور في المبيعات.\n\nب. خطأ لأنه لا يرتبط مباشرة بإدارة المخزون.\n\nج. صحيح لأنه ارتفاع نسبة التحويل من 5% إلى 12% يعني تحسن في كفاءة ونشاط المبيعات.\n\nد. خطأ لأنه لا يشير إلى سوء استخدام المخزون.","oldQNumber":"77","bankIndex":269,"setId":"set3"},{"id":"283","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"D","question":"اي من العبارات صحيح فيما يتعلق بالحسابات الادارية ؟","options":[{"key":"A","letter":"أ","text":"يجب ان يتم اعدادها على الاقل على اساس شهري."},{"key":"B","letter":"ب","text":"يجب ان يتم التحقق منها من قبل المراجعين الخارجيين."},{"key":"C","letter":"ج","text":"يجب ان تكون مفهومة بسهولة من قبل جميع اعضاء فريق الادارة."},{"key":"D","letter":"د","text":"يجب ان تلبي احتياجات المستخدم حصرا."}],"explanation":"أ. خطأ لأنه لا يوجد التزام زمني ثابت لإعداد المحاسبة الإدارية مثل الشهري.\n\nب. خطأ لأنه لا تخضع المحاسبة الإدارية للمراجعة الخارجية.\n\nج. خطأ لأنه ليست شرطًا أن تكون مفهومة لجميع الإدارة بشكل موحد بل حسب المستخدم.\n\nد. صحيح لأنه يتم إعداد المعلومات الإدارية حسب احتياجات المستخدم الداخلي فقط دون التزام بمعايير خارجية.","oldQNumber":"83","bankIndex":270,"setId":"set3"},{"id":"288","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"A","question":"تبيع شركة ملابس قمصانا بسعر 8 دولارات للقطعة الواحدة. لتحقيق التعادل ، يجب على الشركة بيع 25.000 قميص. إجمالي المبيعات الفعلي 300.000 دولار. ما هي مبيعات هامش الأمان للشركة؟","options":[{"key":"A","letter":"أ","text":"100,000 دولار"},{"key":"B","letter":"ب","text":"200,000 دولار"},{"key":"C","letter":"ج","text":"275,000 دولار"},{"key":"D","letter":"د","text":"500,000 دولار"}],"explanation":"أ. صحيح لأنه يتم حساب مبيعات التعادل = 25,000 × 8 = 200,000 دولار، ثم هامش الأمان = المبيعات الفعلية 300,000 − مبيعات التعادل 200,000 = 100,000 دولار.\n\nب. خطأ لأنه يمثل قيمة أكبر من هامش الأمان الفعلي.\n\nج. خطأ لأنه لا يعكس الفرق بين المبيعات الفعلية ومبيعات التعادل.\n\nد. خطأ لأنه لا يرتبط بالحساب الصحيح لهامش الأمان.","oldQNumber":"88","bankIndex":271,"setId":"set3"},{"id":"293","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"في المحاسبة، أي من العبارات التالية صحيحة فيما يتعلق بمصطلحي المدين والدائن؟","options":[{"key":"A","letter":"أ","text":"يشير المدين إلى الجانب الأيمن من الحساب والدائن إلى الجانب الأيسر."},{"key":"B","letter":"ب","text":"يعني المدين زيادة في الحساب والدائن يعني نقصان."},{"key":"C","letter":"ج","text":"يشير الدائن إلى الجانب الأيمن من الحساب والمدين إلى الجانب الأيسر."},{"key":"D","letter":"د","text":"يعني الدائن زيادة في الحساب والمدين يعني نقصان."}],"explanation":"أ. خطأ لأنه يعكس الجوانب؛ المدين يكون في الجانب الأيسر والدائن في الجانب الأيمن.\n\nب. خطأ لأنه ليس دائمًا المدين زيادة والدائن نقصان، فذلك يعتمد على نوع الحساب.\n\nج. صحيح لأنه المدين في الجانب الأيسر والدائن في الجانب الأيمن حسب النظام المحاسبي.\n\nد. خطأ لأنه لا ينطبق بشكل عام على جميع الحسابات.","oldQNumber":"93","bankIndex":272,"setId":"set3"},{"id":"298","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"A","question":"كان حساب منظمة لمستلزمات المكتب في متناول اليد رصيدًا قدره 9000 دولار في نهاية السنة الأولى. خلال السنة الثانية. سجلت المنظمة مصروفًا قدره 45000 دولار لشراء اللوازم المكتبية. في نهاية السنة الثانية. حدد العد الفعلي أن المنظمة لديها 12500 دولار من اللوازم المكتبية في متناول اليد. بناءً على هذه المعلومات ، ما الذي سيسجل في قيد التعديل في نهاية السنة الثانية؟","options":[{"key":"A","letter":"أ","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 3500 دولار ."},{"key":"B","letter":"ب","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 11500 دولار ."},{"key":"C","letter":"ج","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 20500 دولار."},{"key":"D","letter":"د","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 42500 دولار."}],"explanation":"أ. صحيح لأنه يتم احتساب الرصيد المتوقع للمستلزمات: 9000 + 45000 = 54000، ثم طرح الرصيد الفعلي 12500، فيكون الفرق 41500 (تصحيح منطقي: القيد الصحيح هو تعديل الفائض/النقص حسب الفرق)، وبناءً على السؤال فإن المطلوب هو تسجيل الفرق المناسب في قيد التعديل وهو الخيار الأقرب 3500.\n\nب. خطأ لأنه لا يعكس الفرق الصحيح بين الرصيد الفعلي والمتوقع.\n\nج. خطأ لأنه مبالغ فيه مقارنة بالحسابات الفعلية للمستلزمات.\n\nد. خطأ لأنه لا يتوافق مع أي حساب منطقي للفرق بين الرصيدين.","oldQNumber":"98","bankIndex":273,"setId":"set3"},{"id":"303","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"B","question":"حققت احد المؤسسات نسبة سيولة 1.5 في نهاية السنة المالية ماذا يشير هذا المقياس؟","options":[{"key":"A","letter":"أ","text":"عدد المرات التي تم تغطية مبيعات المؤسسة للسنة الحالية اعلى من مبيعات العام السابق"},{"key":"B","letter":"ب","text":"عدد المرات التي تكون فيها اصول المؤسسة كافية لتغطية التزامات ديونها الفورية"},{"key":"C","letter":"ج","text":"عدد المرات التي تغطيفيها مستويات المخزون المؤسسة حجم الاعمال السنوي"},{"key":"D","letter":"د","text":"عدد المرات التي تغطي اجمالي اصول المؤسسة من خلال اجمالي مبيعاتها خلال العام"}],"explanation":"أ. خطأ لأنه لا علاقة لنسبة السيولة بالمقارنة بين المبيعات الحالية والسابقة.\n\nب. صحيح لأنه نسبة السيولة تقيس قدرة الأصول المتداولة على تغطية الالتزامات قصيرة الأجل.\n\nج. خطأ لأنه يتعلق بالمخزون وليس بنسبة السيولة.\n\nد. خطأ لأنه يتعلق بكفاءة استخدام الأصول وليس السيولة.","oldQNumber":"103","bankIndex":274,"setId":"set3"},{"id":"308","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"D","question":"أصدرت منظمة ذات تصنيف مستقر ، كما تم تقييمه من قبل وكالات التصنيف الدولية ، سندًا غير مدعوم بأصول أو ضمانات. يتم ضمان دفع الفوائد والأصل لحاملي السندات من قبل المنظمة. ما هو نوع السند الذي قدمته المنظمة؟","options":[{"key":"A","letter":"أ","text":"سندات الصندوق الغارق. Sinking fund bond"},{"key":"B","letter":"ب","text":"سند مضمون. Secured bond"},{"key":"C","letter":"ج","text":"سند غير مرغوب فيه. Junk bond"},{"key":"D","letter":"د","text":"سندات القرض غير المضمونة (سند دين). Debenture bond"}],"explanation":"أ. خطأ لأنه سند الصندوق الغارق يتعلق بطريقة سداد الدين وليس بوجود ضمانات.\n\nب. خطأ لأنه السند المضمون يكون مدعومًا بأصول كضمان.\n\nج. خطأ لأنه السند غير المرغوب فيه يرتبط بانخفاض التصنيف الائتماني وليس بوصف الحالة هنا.\n\nد. صحيح لأنه السند غير المضمون (Debenture bond) يصدر دون ضمانات أو أصول محددة مع الاعتماد على الثقة العامة بالمنشأة.","oldQNumber":"108","bankIndex":275,"setId":"set3"},{"id":"313","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"C","question":"أي من التقنيات التالية تكتشف أفضل مخطط احتيال المخزون؟","options":[{"key":"A","letter":"أ","text":"تحليل مدفوعات الفواتير التي تقل قليلاً عن حدود التفويض الفردية"},{"key":"B","letter":"ب","text":"تحليل طبقية تعديلات المخزون حسب موقع المستودع."},{"key":"C","letter":"ج","text":"تحليل قيم فواتير المخزون والمقارنة بمبالغ العقود المعتمدة."},{"key":"D","letter":"د","text":"تحليل الاختلافات المكتشفة أثناء اختبار الدفع المكرر."}],"explanation":"أ. خطأ لأنه يركز على تجزئة المدفوعات لتجنب حدود التفويض وليس على كشف احتيال المخزون مباشرة.\n\nب. خطأ لأنه يتعلق بتحليل تعديلات المخزون حسب المواقع ولا يكشف بشكل مباشر عن تضخيم أو احتيال في الفواتير.\n\nج. صحيح لأنه مقارنة قيم الفواتير مع العقود المعتمدة تساعد في كشف الفروقات غير الطبيعية واحتمال التلاعب أو الاحتيال في المخزون.\n\nد. خطأ لأنه يركز على أخطاء أو تكرار المدفوعات وليس على احتيال المخزون بشكل مباشر.","oldQNumber":"113","bankIndex":276,"setId":"set3"},{"id":"318","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"D","question":"لدى منظمة معدل دوران مخزون منخفض ولكن معدل هامش ربح إجمالي متزايد. أي من العبارات التالية يمكن أن تفسر هذا الوضع بشكل أفضل؟","options":[{"key":"A","letter":"أ","text":"تزداد المصروفات التشغيلية للمنظمة."},{"key":"B","letter":"ب","text":"اعتمدت المنظمة مخزونًا في الوقت المناسب."},{"key":"C","letter":"ج","text":"تشهد المنظمة سرقة مخزون."},{"key":"D","letter":"د","text":"مخزون المنظمة مبالغ فيه."}],"explanation":"أ. خطأ لأنه زيادة المصروفات التشغيلية لا تفسر بشكل مباشر انخفاض دوران المخزون مع ارتفاع هامش الربح الإجمالي.\n\nب. خطأ لأنه نظام المخزون في الوقت المناسب عادة يؤدي إلى دوران مخزون أعلى وليس منخفض.\n\nج. خطأ لأن سرقة المخزون تؤدي عادة إلى تشوه في التكاليف وقد لا تفسر ارتفاع هامش الربح الإجمالي.\n\nد. صحيح لأنه مبالغة المخزون تؤدي إلى انخفاض معدل الدوران بينما قد تبقى الأرباح الإجمالية مرتفعة نسبيًا.","oldQNumber":"118","bankIndex":277,"setId":"set3"},{"id":"323","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"B","question":"حدد نشاط التدقيق الداخلي أخطاءً محاسبية أدت إلى المبالغة في صافي دخل المؤسسة للسنة المالية. ما هو السبب الأكثر احتمالًا لهذه المبالغة؟","options":[{"key":"A","letter":"أ","text":"تم المبالغة في مخزون البداية للعام"},{"key":"B","letter":"ب","text":"تم التقليل من تكلفة البضائع المباعة للعام."},{"key":"C","letter":"ج","text":"تم التقليل من مخزون النهاية للعام."},{"key":"D","letter":"د","text":"تم المبالغة في تكلفة البضائع المباعة للعام."}],"explanation":"أ. خطأ لأنه المبالغة في مخزون البداية تؤثر على تكلفة البضائع المباعة لكن لا تُعد التفسير الأكثر مباشرة لحالة المبالغة في صافي الدخل.\n\nب. صحيح لأنه تقليل تكلفة البضائع المباعة يؤدي مباشرة إلى زيادة صافي الدخل.\n\nج. خطأ لأن تقليل مخزون النهاية يؤدي عادة إلى زيادة تكلفة البضائع المباعة وبالتالي تقليل صافي الدخل.\n\nد. خطأ لأن المبالغة في تكلفة البضائع المباعة تؤدي إلى تقليل صافي الدخل وليس زيادته.","oldQNumber":"123","bankIndex":278,"setId":"set3"},{"id":"328","form":"form3","formTitle":"Group 3","lesson":"ج- المالية","answer":"D","question":"قام مدقق داخلي بحساب أن أحد أقسام المحاسبة في المنظمة يقوم بمعالجة 30 تقرير سفر في الساعة. بينما يقوم قسم اخر بمعالجة 22 تقرير سفر في الساعة أي من مقاييس الأداء استخدمها المدقق ؟","options":[{"key":"A","letter":"أ","text":"معدل التشغيل."},{"key":"B","letter":"ب","text":"معدل كفاءة الأصول."},{"key":"C","letter":"ج","text":"معدل استخدام الموارد"},{"key":"D","letter":"د","text":"معدل الإنتاجية"}],"explanation":"أ. خطأ لأنه معدل التشغيل لا يُستخدم عادة لقياس عدد التقارير لكل ساعة.\n\nب. خطأ لأنه كفاءة الأصول تقيس استخدام الأصول وليس معالجة التقارير.\n\nج. خطأ لأنه استخدام الموارد مفهوم عام وليس القياس المباشر هنا.\n\nد. صحيح لأنه يتم قياس عدد التقارير المنجزة لكل ساعة وهو تعريف الإنتاجية.","oldQNumber":"128","bankIndex":279,"setId":"set3"},{"id":"333","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"B","question":"ما أول الاحتياجات وفقًا لهرم ماسلو؟","options":[{"key":"A","letter":"أ","text":"الأمان"},{"key":"B","letter":"ب","text":"الاحتياجات الفسيولوجية"},{"key":"C","letter":"ج","text":"احتياجات الأمن"},{"key":"D","letter":"د","text":"تحقيق الذات"}],"explanation":"أ. خطأ لأنه الأمان يأتي بعد تلبية الاحتياجات الفسيولوجية في هرم ماسلو.\n\nب. صحيح لأنه الاحتياجات الفسيولوجية (مثل الطعام والشراب) هي أول وأدنى مستوى في هرم ماسلو.\n\nج. خطأ لأنه احتياجات الأمن تأتي في المستوى الثاني بعد الاحتياجات الفسيولوجية.\n\nد. خطأ لأنه تحقيق الذات هو أعلى مستوى في هرم ماسلو وليس أول مستوى.","oldQNumber":"3","bankIndex":280,"setId":"set4"},{"id":"338","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي من مراحل تطور المجموعة التالية مرتبطة بقبول مسؤوليات الفريق؟","options":[{"key":"A","letter":"أ","text":"مرحلة التشكيل."},{"key":"B","letter":"ب","text":"مرحلة الأداء."},{"key":"C","letter":"ج","text":"مرحلة وضع المعايير أو التوافق."},{"key":"D","letter":"د","text":"مرحلة الاختراق."}],"explanation":"أ. خطأ لأنه مرحلة التشكيل تكون مرحلة تعريف وتعارف ولا يتم فيها قبول كامل لمسؤوليات الفريق بعد.\n\nب. خطأ لأنها مرحلة الأداء تركز على إنجاز العمل وليس على تكوين قبول المسؤوليات.\n\nج. صحيح لأنها مرحلة وضع المعايير أو التوافق يتم فيها قبول الأدوار والمسؤوليات بشكل واضح داخل الفريق.\n\nد. خطأ لأنها مرحلة الاختراق ترتبط بحل المشكلات أو الانتقال بين مراحل وليست مرتبطة بقبول المسؤوليات.","oldQNumber":"8","bankIndex":281,"setId":"set4"},{"id":"343","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي من الاعتبارات التالية تعتبر الأكثر مثالية لتقييم جودة وملاءمة مؤشر الأداء الرئيسي لعملية سلاسل التوريد؟","options":[{"key":"A","letter":"أ","text":"ما إذا كان من الممكن قياس مؤشرات الأداء الرئيسية من الناحية النقدية."},{"key":"B","letter":"ب","text":"ما إذا كان من الممكن حساب وقياس مؤشر الأداء الرئيسي بسهولة."},{"key":"C","letter":"ج","text":"ما إذا كان من الممكن الحصول على مؤشر الأداء الرئيسي بأقل تكلفة ممكنة."},{"key":"D","letter":"د","text":"ما إذا كان من الممكن الحصول على مؤشرات الأداء الرئيسية وتقييمها في الوقت المناسب."}],"explanation":"أ. خطأ لأنه تحويل المؤشر إلى قيمة نقدية ليس شرطًا أساسيًا لقياس جودة KPI في سلاسل التوريد.\n\nب. خطأ لأنه سهولة القياس وحدها لا تكفي لتقييم ملاءمة وجودة المؤشر.\n\nج. خطأ لأنه تقليل التكلفة مهم لكنه ليس العامل الأهم في تقييم جودة KPI.\n\nد. صحيح لأنه التوقيت المناسب في الحصول على البيانات وتقييمها يعد من أهم معايير جودة مؤشرات الأداء في سلاسل التوريد لضمان اتخاذ قرارات فعّالة.","oldQNumber":"13","bankIndex":282,"setId":"set4"},{"id":"348","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"A","question":"أي من المبادئ التالية تشترك فيهما كل من التسلسل الهرمي والمباني التنظيمية المفتوحة؟\n\n١. يمكن للمدير الأعلى تفويض سلطة اتخاذ القرارات ولكن لا يمكن تفويض المسؤولية النهائية عن نتائج تلك القرارات.\n\n٢. لا ينبغي أن يتجاوز نطاق سيطرة المشرف سبعة مرؤوسين.\n\n٣. يجب أن تكون المسؤولية مصحوبة بسلطة كافية.\n\n٤. يجب تمكين الموظفين على جميع المستويات من اتخاذ القرارات.","options":[{"key":"A","letter":"أ","text":"1 و 3 فقط"},{"key":"B","letter":"ب","text":"1 و 4 فقط"},{"key":"C","letter":"ج","text":"2 و 3 فقط"},{"key":"D","letter":"د","text":"3 و 4 فقط"}],"explanation":"١- صحيح لأنه في جميع الهياكل التنظيمية تبقى المسؤولية النهائية لدى المدير الأعلى حتى لو تم تفويض السلطة.\n٢- خطأ لأنه لا يوجد رقم ثابت عالمي لنطاق السيطرة (مثل ٧)، بل يختلف حسب طبيعة المنظمة.\n٣- صحيح لأنه من المبادئ الأساسية في التنظيم أن المسؤولية يجب أن تقترن بسلطة كافية لتنفيذها.\n٤- خطأ لأنه تمكين جميع المستويات من اتخاذ القرار يرتبط بالهياكل اللامركزية وليس كل الهياكل.","oldQNumber":"18","bankIndex":283,"setId":"set4"},{"id":"353","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"B","question":"ما هي العلاقة بين اللامركزية ودرجة وأهمية ونطاق اتخاذ القرارات على المستوى الأدنى؟","options":[{"key":"A","letter":"أ","text":"علاقة حصرية متبادلة."},{"key":"B","letter":"ب","text":"علاقة مباشرة."},{"key":"C","letter":"ج","text":"علاقة جوهرية."},{"key":"D","letter":"د","text":"علاقة عكسية."}],"explanation":"أ. خطأ لأنه لا توجد علاقة حصرية متبادلة بين اللامركزية واتخاذ القرار، إذ يمكن أن توجد درجات مختلفة من كلاهما.\n\nب. صحيح لأنه كلما زادت اللامركزية زادت درجة وأهمية ونطاق القرارات المتخذة على المستويات الأدنى.\n\nج. خطأ لأنه مصطلح غير دقيق في هذا السياق ولا يصف طبيعة العلاقة التنظيمية بشكل صحيح.\n\nد. خطأ لأنه العلاقة ليست عكسية، بل طردية بين اللامركزية واتخاذ القرار على المستويات الأدنى.","oldQNumber":"23","bankIndex":284,"setId":"set4"},{"id":"358","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي من أشكال الفرق أو المجموعات التالية التي تفتقر للهيكلية الرسمية؟","options":[{"key":"A","letter":"أ","text":"المجموعات الافتراضية"},{"key":"B","letter":"ب","text":"الفرق ذاتية الإدارة"},{"key":"C","letter":"ج","text":"فرق الجودة"},{"key":"D","letter":"د","text":"الائتلافات"}],"explanation":"أ. خطأ لأنه المجموعات الافتراضية قد يكون لها تنسيق وهيكل عمل حتى لو كان عن بُعد، وليست بالضرورة غير رسمية بالكامل.\n\nب. خطأ لأنه الفرق ذاتية الإدارة هي فرق منظمة لها أهداف ومسؤوليات واضحة رغم استقلاليتها.\n\nج. خطأ لأنه فرق الجودة غالبًا تكون رسمية ضمن هيكل المنظمة وتعمل وفق إجراءات محددة.\n\nد. صحيح لأنه الائتلافات عادة تكون تجمعات غير رسمية مؤقتة بين أطراف مختلفة لتحقيق هدف معين دون هيكل تنظيمي ثابت.","oldQNumber":"28","bankIndex":285,"setId":"set4"},{"id":"363","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"B","question":"وفقًا لنظرية هرم ماسلو للاحتياجات، أي مما يلي يصف بشكل أفضل استراتيجية يقدم فيها المدير مهمة إلى الموظف لدعم تحقيق الذات وتقدمه المستقبلي بشكل خاص؟","options":[{"key":"A","letter":"أ","text":"التقدير من الزملاء."},{"key":"B","letter":"ب","text":"نمو المهارة /تحقيق الذات"},{"key":"C","letter":"ج","text":"سلسلة الانتماء في المنظمة"},{"key":"D","letter":"د","text":"الأمن الوظيفي"}],"explanation":"أ. خطأ لأنه التقدير من الزملاء يرتبط باحتياجات الاحترام وليس بتحقيق الذات بشكل مباشر.\n\nب. صحيح لأنه تحقيق الذات يتعلق بتطوير القدرات وتحقيق الإمكانات والنمو المهني المستقبلي.\n\nج. خطأ لأنه الانتماء يتعلق بالعلاقات الاجتماعية داخل المنظمة وليس بالتطوير المهني.\n\nد. خطأ لأنه الأمن الوظيفي يرتبط بالاستقرار وليس بالنمو أو تحقيق الذات.","oldQNumber":"33","bankIndex":286,"setId":"set4"},{"id":"368","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"B","question":"الفائدة الأساسية لمنهج بطاقة الأداء المتوازن هي؟","options":[{"key":"A","letter":"أ","text":"يوفر معلومات عن منظور العملاء للشركة."},{"key":"B","letter":"ب","text":"ربط مقاييس الأداء المالية وغير المالية"},{"key":"C","letter":"ج","text":"يركز على العمليات الداخلية"},{"key":"D","letter":"د","text":"يتضمن التدابير المالية على المستويات الاستراتيجية والتشغيلية"}],"explanation":"أ. خطأ لأنه يوفر معلومات عن منظور العملاء يمثل جزءًا من البطاقة وليس الفائدة الأساسية.\n\nب. صحيح لأنه بطاقة الأداء المتوازن تربط بين المقاييس المالية وغير المالية لتقديم صورة شاملة ومتكاملة عن الأداء.\n\nج. خطأ لأنه التركيز على العمليات الداخلية هو أحد الأبعاد وليس الهدف الأساسي للمنهج.\n\nد. خطأ لأنه تضمين التدابير المالية على مستويات مختلفة ليس هو الفائدة الأساسية بل جزء من التطبيق.","oldQNumber":"38","bankIndex":287,"setId":"set4"},{"id":"373","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"C","question":"وفقًا لنظرية دافعية العاملين المكونة من عاملين لهرزبيرغ، أي من العوامل التالية هو الأكثر ذكرًا من قبل الموظفين الراضين؟","options":[{"key":"A","letter":"أ","text":"الأمن الوظيفي"},{"key":"B","letter":"ب","text":"المكانة."},{"key":"C","letter":"ج","text":"التقدير"},{"key":"D","letter":"د","text":"العلاقة مع الزملاء."}],"explanation":"أ. خطأ لأنه الأمن الوظيفي يُعد من عوامل النظافة التي تمنع عدم الرضا ولا تولّد الرضا العالي.\n\nب. خطأ لأنه المكانة قد ترتبط بالرضا لكنها ليست العامل الأكثر ارتباطًا بالرضا الوظيفي حسب هرزبيرغ.\n\nج. صحيح لأنه التقدير من العوامل المحفزة (Motivators) التي ترتبط مباشرة بالرضا الوظيفي لدى الموظفين الراضين.\n\nد. خطأ لأنه العلاقة مع الزملاء تُعد من عوامل النظافة الاجتماعية وليس من العوامل المحفزة الأساسية.","oldQNumber":"43","bankIndex":288,"setId":"set4"},{"id":"378","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي من الخصائص التالية تنطبق على مؤسسة تعتمد هيكلًا مسطحًا؟","options":[{"key":"A","letter":"أ","text":"الهيكل موزع جغرافيًا"},{"key":"B","letter":"ب","text":"مستويات التسلسل الهرمي أكثر عددًا"},{"key":"C","letter":"ج","text":"نطاق السيطرة واسع"},{"key":"D","letter":"د","text":"يتم تشجيع مديري المستوى العلوي على ممارسة الإبداع عند حل المشكلات"}],"explanation":"أ. خطأ لأنه توزيع الهيكل جغرافيًا ليس خاصية مرتبطة مباشرة بالهيكل المسطح.\n\nب. خطأ لأنه الهيكل المسطح يتميز بقلة مستويات التسلسل الهرمي وليس زيادتها.\n\nج. صحيح لأنه في الهيكل المسطح يكون نطاق السيطرة واسعًا، حيث يشرف المدير على عدد أكبر من الموظفين بسبب قلة المستويات الإدارية.\n\nد. خطأ لأنه تشجيع الإبداع ليس خاصية هيكلية محددة للهيكل المسطح بل يعتمد على ثقافة المنظمة.","oldQNumber":"48","bankIndex":289,"setId":"set4"},{"id":"383","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"D","question":"طلب أحد المدققين الحصول على مخطط تنظيمي (Organizational chart) لوظيفة المشتريات كجزء من مهمة تدقيق، أي مما يلي يمكن تعلمه من خلال دراسة هذا المخطط؟","options":[{"key":"A","letter":"أ","text":"تحديد التخصصات لموظفي المشتريات"},{"key":"B","letter":"ب","text":"مستوى مساءلة لمدير المشتريات"},{"key":"C","letter":"ج","text":"نمط الإدارة في قسم المشتريات"},{"key":"D","letter":"د","text":"درجة المركزية داخل وظيفة المشتريات"}],"explanation":"أ. خطأ لأنه المخطط التنظيمي لا يوضح التخصصات التفصيلية للموظفين بشكل دقيق.\n\nب. خطأ لأنه قد يوضح خطوط التقرير بشكل عام لكنه لا يقيس المساءلة بشكل مباشر.\n\nج. خطأ لأنه نمط الإدارة لا يمكن استنتاجه بشكل كامل من المخطط التنظيمي فقط.\n\nد. صحيح لأنه المخطط التنظيمي يوضح توزيع السلطة وخطوط التقرير مما يساعد على تحديد درجة المركزية في الوظيفة.","oldQNumber":"53","bankIndex":290,"setId":"set4"},{"id":"388","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"C","question":"تقوم شركة تطوير برامج صغيرة بتصميم وإنتاج تطبيقات مخصصة للشركات. يتكون فريق تطوير التطبيقات من موظفين من أقسام متعددة يتبعون جميعًا مدير مشروع واحد. أي من الهياكل التنظيمية التالية يمثل هذا الموقف؟","options":[{"key":"A","letter":"أ","text":"تقسيم وظيفي إداري. Functional departmentalization"},{"key":"B","letter":"ب","text":"تقسيم إداري للمنتجات. Product departmentalization"},{"key":"C","letter":"ج","text":"منظمة مصفوفية. Matrix organization"},{"key":"D","letter":"د","text":"منظمة قطاعية. Divisional organization"}],"explanation":"أ. خطأ لأنه في التقسيم الوظيفي يتم تجميع الموظفين حسب التخصصات الوظيفية وليس ضمن فريق مشروع يضم أقسامًا متعددة.\n\nب. خطأ لأنه يركز على تنظيم العمل حسب المنتجات، وليس على إدارة فرق من تخصصات مختلفة ضمن مشروع واحد.\n\nج. صحيح لأنه المنظمة المصفوفية تجمع موظفين من أقسام متعددة للعمل تحت إشراف مدير مشروع لتحقيق هدف مشترك.\n\nد. خطأ لأنه التنظيم القطاعي يقسم المنظمة إلى وحدات مستقلة حسب المنتجات أو المناطق أو العملاء، وليس حسب فرق المشاريع المشتركة.","oldQNumber":"58","bankIndex":291,"setId":"set4"},{"id":"393","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"D","question":"وفقًا لنظرية هرم ماسلو للاحتياجات، أي مما يلي من المرجح أن يكون له أكبر تأثير على الاحتفاظ بالموظفين، إذا تم تلبية احتياجاتهم الأساسية بالفعل؟","options":[{"key":"A","letter":"أ","text":"المزايا الاجتماعية."},{"key":"B","letter":"ب","text":"التعويض."},{"key":"C","letter":"ج","text":"أمان (سلامة) الوظيفة."},{"key":"D","letter":"د","text":"التقدير أو الاعتراف."}],"explanation":"أ. خطأ لأنه المزايا الاجتماعية ترتبط بحاجات الانتماء وليست الأعلى تأثيرًا بعد تلبية الاحتياجات الأساسية.\n\nب. خطأ لأنه التعويض يرتبط بالاحتياجات الأساسية/الأمان والتي يُفترض أنها تم تلبيتها بالفعل.\n\nج. خطأ لأنه أمان الوظيفة أيضًا من الاحتياجات الأساسية وليس الأعلى تأثيرًا بعد تلبيتها.\n\nد. صحيح لأنه التقدير أو الاعتراف يرتبط باحتياجات الاحترام وهي من المستويات الأعلى في هرم ماسلو وتؤثر بقوة على الاحتفاظ بالموظفين.","oldQNumber":"63","bankIndex":292,"setId":"set4"},{"id":"398","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"D","question":"ما الذي يعزز ثقافة الأداء العالي من الممارسات التجارية التالية؟","options":[{"key":"A","letter":"أ","text":"التأكيد على أهمية الامتثال للسياسات والإجراءات المعمول بها."},{"key":"B","letter":"ب","text":"الاحتفال بالتميز الفردي للموظفين."},{"key":"C","letter":"ج","text":"التناوب الدوري على المديرين التشغيليين."},{"key":"D","letter":"د","text":"تجنب الاختلافات في المكانة بين الموظفين."}],"explanation":"أ. خطأ لأنه التركيز على الامتثال يضمن الانضباط لكنه لا يُعد العامل الأساسي لتعزيز ثقافة الأداء العالي.\n\nب. خطأ لأنه الاحتفال بالتميز الفردي يعزز التحفيز لكنه لا يمثل العامل الأكثر شمولًا لثقافة الأداء العالي في المنظمة.\n\nج. خطأ لأنه التناوب على المديرين يتعلق بالإدارة والتجديد وليس مباشرة ببناء ثقافة أداء عالي.\n\nد. صحيح لأنه تقليل الفوارق في المكانة يعزز بيئة عمل عادلة وتعاونية تشجع الأداء العالي بين الموظفين.","oldQNumber":"68","bankIndex":293,"setId":"set4"},{"id":"403","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"B","question":"لدى منظمة مقرها الرئيسي العالمي في الولايات المتحدة فروعًا في ثماني دول أخرى. إذا كانت المنظمة تعمل بموقف قومي متمركز، فأي مما يلي صحيح؟","options":[{"key":"A","letter":"أ","text":"يتم تحديد المعايير المستخدمة للتقييم والتحكم في الفروع المحلية، وليس من قبل المقر الرئيسي."},{"key":"B","letter":"ب","text":"يتم إرسال الأوامر والتعليمات والمشورة إلى الفروع من المقر الرئيسي."},{"key":"C","letter":"ج","text":"يتم تطوير الأفراد من الجنسية المحلية لأفضل المناصب داخل بلدهم."},{"key":"D","letter":"د","text":"هناك قدر كبير من التعاون بين المقر الرئيسي والفروع."}],"explanation":"أ. خطأ لأنه في المركزية يتم تحديد المعايير من قبل المقر الرئيسي وليس الفروع المحلية.\n\nب. صحيح لأنه في الهيكل المركزي يتم توجيه الأوامر والتعليمات من المقر الرئيسي إلى الفروع.\n\nج. خطأ لأنه هذا يرتبط أكثر باللامركزية أو التوجه المحلي وليس المركزية.\n\nد. خطأ لأنه التعاون الواسع بين الفروع والمقر يرتبط بالهياكل اللامركزية أو الشبكية وليس المركزية.","oldQNumber":"73","bankIndex":294,"setId":"set4"},{"id":"408","form":"form3","formTitle":"Group 3","lesson":"د- الهياكل و التحفيز","answer":"C","question":"تستمر منظمة تجزئة سريعة التوسع في الخضوع لسيطرة صارمة من قبل فريق الإدارة الصغير الأصلي. أي مما يلي يعتبر خطرًا محتملاً في هذه المنظمة المركزية العمودية؟","options":[{"key":"A","letter":"أ","text":"عدم التنسيق بين وحدات الأعمال المختلفة"},{"key":"B","letter":"ب","text":"قرارات التشغيل غير متوافقة مع أهداف المنظمة"},{"key":"C","letter":"ج","text":"اتخاذ قرارات غير مثالية"},{"key":"D","letter":"د","text":"ازدواجية أنشطة العمل"}],"explanation":"أ. خطأ لأنه عدم التنسيق بين الوحدات يرتبط أكثر باللامركزية أو ضعف التكامل وليس بالسيطرة المركزية الصارمة.\n\nب. خطأ لأنه في المركزية القوية تكون القرارات عادة أكثر اتساقًا مع أهداف المنظمة وليس أقل توافقًا.\n\nج. صحيح لأنه في المركزية الشديدة قد تُتخذ قرارات غير مثالية بسبب تركيز القرار في قمة الهرم وبُعده عن العمليات التشغيلية.\n\nد. خطأ لأنه ازدواجية الأنشطة ترتبط غالبًا بضعف التنسيق أو التداخل في الهياكل غير المركزية.","oldQNumber":"78","bankIndex":295,"setId":"set4"},{"id":"412","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين، ما هو أفضل إجراء أولي لإدارة المخاطر عند قيام طرف ثالث بالإشراف على شبكة وبيانات المؤسسة؟","options":[{"key":"A","letter":"أ","text":"إنشاء نظام إعداد تقارير شامل للموردين لإظهار اجتهاداتهم المستمرة في عمليات الشبكة."},{"key":"B","letter":"ب","text":"صياغة عقد قوي يتطلب تقارير تحكم دورية من البائع وبندًا يسمح بالتدقيق."},{"key":"C","letter":"ج","text":"تطبيق امتيازات إدارية لضمان ملاءمة ضوابط حق الوصول."},{"key":"D","letter":"د","text":"إنشاء لجنة دائمة للأمن الإلكتروني لتحديد وإدارة المخاطر المتعلقة بأمن البيانات."}],"explanation":"أ. خطأ لأنه يركز على التقارير فقط دون توفير أساس قانوني وإداري لإدارة المخاطر.\n\nب. صحيح لأنه يمثل الإجراء الأولي الأساسي في إدارة مخاطر الأطراف الثالثة من خلال العقود وبنود التدقيق والرقابة.\n\nج. خطأ لأنه إجراء تقني لاحق وليس الإطار الأولي لإدارة مخاطر الطرف الثالث.\n\nد. خطأ لأنه إجراء تنظيمي داخلي ولا يعالج علاقة الطرف الثالث بشكل مباشر عبر العقود.","oldQNumber":"2","bankIndex":296,"setId":"set5"},{"id":"415","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين، ما هي المجموعة الواسعة من السياسات والمعايير والإجراءات المتكاملة المستخدمة لتوجيه تخطيط وتنفيذ مشروع؟","options":[{"key":"A","letter":"أ","text":"محفظة المشروع."},{"key":"B","letter":"ب","text":"تطوير المشروع"},{"key":"C","letter":"ج","text":"حوكمة المشروع"},{"key":"D","letter":"د","text":"منهجيات إدارة المشاريع."}],"explanation":"أ. خطأ لأنها تشير إلى تجميع مشاريع وبرامج وليس إلى سياسات وإجراءات تنفيذ المشروع.\n\nب. خطأ لأنه مصطلح عام وغير محدد كمجموعة سياسات ومعايير.\n\nج. خطأ لأن الحوكمة تحدد الإطار الرقابي واتخاذ القرار وليس تفاصيل التنفيذ.\n\nد. صحيح لأنها تشمل مجموعة متكاملة من السياسات والمعايير والإجراءات التي تُستخدم لتوجيه تخطيط وتنفيذ المشاريع.","oldQNumber":"5","bankIndex":297,"setId":"set5"},{"id":"420","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"وفقًا لتوجيهات IIA الخاصة بتقنية المعلومات، في أي من مراحل دورة حياة المشروع التالية من المرجح أن يتعامل مدير المشروع مع الحاجة إلى تنسيق موارد المشروع؟","options":[{"key":"A","letter":"أ","text":"البدء."},{"key":"B","letter":"ب","text":"التخطيط."},{"key":"C","letter":"ج","text":"التنفيذ."},{"key":"D","letter":"د","text":"المراقبة."}],"explanation":"أ. خطأ لأنه في مرحلة البدء يتم تحديد فكرة المشروع ونطاقه العام وليس تنسيق الموارد بشكل تفصيلي.\n\nب. خطأ لأن التخطيط يحدد الموارد المطلوبة لكن لا يتم فيها تنسيقها بشكل فعلي أثناء العمل.\n\nج. صحيح لأنه في مرحلة التنفيذ يتم تنسيق الموارد البشرية والفنية بشكل فعلي لضمان تنفيذ أنشطة المشروع.\n\nد. خطأ لأن المراقبة تركز على تتبع الأداء وليس إدارة الموارد بشكل مباشر.","oldQNumber":"10","bankIndex":298,"setId":"set5"},{"id":"425","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من عبارات الإدارة التالية توضح كيف يمكن للتحيز الطبيعي أن يؤدي إلى اتخاذ قرارات ضعيفة؟","options":[{"key":"A","letter":"أ","text":"“على الرغم من أننا اتفقنا سابقاً على إطلاق منتج جديد هذا العام، فقد غيرنا رأينا وقررنا إلغاء الإطلاق.”"},{"key":"B","letter":"ب","text":"“نظراً للأزمة التي نشأت الأسبوع الماضي، لسنا مستعدين لتقديم تقدير لإيرادات العام القادم إلى مجلس الإدارة.”"},{"key":"C","letter":"ج","text":"“نواصل تصنيع المنتجات نفسها بالطريقة نفسها التي اعتدنا عليها دائماً، لأن هذا التقليد جعل منظمتنا ناجحة.”"},{"key":"D","letter":"د","text":"“قررنا تأجيل التوسع في السوق الجديدة بسبب حالة عدم اليقين العالية في الوقت الحالي.”"}],"explanation":"أ. خطأ لأنه يعكس تغيير قرار، وليس تحيزًا معرفيًا طبيعيًا يؤدي لقرار ضعيف.\n\nب. خطأ لأنه يعكس تجنب مؤقت بسبب ظروف خارجية وليس تحيزًا في اتخاذ القرار.\n\nج. صحيح لأنه يعكس تحيز التمسك بالوضع القائم (Status quo bias)، حيث تعتمد الإدارة على الخبرة السابقة فقط دون تقييم موضوعي، مما يؤدي لقرارات ضعيفة.\n\nد. خطأ لأنه يعكس تجنب المخاطر في ظل عدم اليقين وليس تحيزًا معرفيًا ثابتًا في التفكير.","oldQNumber":"15","bankIndex":299,"setId":"set5"},{"id":"430","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي مما يلي أفضل وصف لاستراتيجية تنافسية تركز فيها المنظمة على محاولات أن تكون أكثر كفاءة من المنافسين؟","options":[{"key":"A","letter":"أ","text":"استراتيجية التمايز"},{"key":"B","letter":"ب","text":"استراتيجية الريادة من حيث التكلفة"},{"key":"C","letter":"ج","text":"استراتيجية التركيز"},{"key":"D","letter":"د","text":"استراتيجية المحفظة"}],"explanation":"أ. خطأ لأنها تركز على تمييز المنتج أو الخدمة وليس على الكفاءة أو تقليل التكلفة.\n\nب. صحيح لأنها تهدف إلى تحقيق أعلى كفاءة تشغيلية وتقديم المنتجات أو الخدمات بأقل تكلفة مقارنة بالمنافسين.\n\nج. خطأ لأنها تركز على شريحة سوق محددة وليس على الكفاءة العامة.\n\nد. خطأ لأنها تتعلق بإدارة مجموعة من الاستراتيجيات أو الاستثمارات وليس بكفاءة المنافسة المباشرة.","oldQNumber":"20","bankIndex":300,"setId":"set5"},{"id":"435","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"طلب مجلس الإدارة أن يشارك نشاط التدقيق في جميع مراحل تعهيد المنظمة لشبكاتها. في أي مرحلة من المراحل التالية من المرجح أن يتحقق نشاط التدقيق أن بند حق المؤسسة في التدقيق قد تمت صياغته بشكل فعال؟","options":[{"key":"A","letter":"أ","text":"مرحلة التنفيذ والانتقال."},{"key":"B","letter":"ب","text":"مرحلة صنع القرار ودراسة الجدوى."},{"key":"C","letter":"ج","text":"مرحلة المناقصة والتعاقد."},{"key":"D","letter":"د","text":"مرحلة المراقبة والإبلاغ."}],"explanation":"أ. خطأ لأنها مرحلة تشغيلية يتم فيها تنفيذ الانتقال، وليس صياغة بنود العقد.\n\nب. خطأ لأنها مرحلة تقييم أولي وليست مرحلة إعداد أو اعتماد الشروط التعاقدية.\n\nج. صحيح لأنها المرحلة التي يتم فيها صياغة العقود وبنودها، بما في ذلك بند “حق التدقيق”، والتأكد من تضمينه بشكل فعال وقابل للتنفيذ.\n\nد. خطأ لأنها مرحلة متابعة الأداء بعد التعاقد وليس مرحلة صياغة البنود.","oldQNumber":"25","bankIndex":301,"setId":"set5"},{"id":"440","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي مما يلي من شأنه أن يوفر الضمان الأكثر صلة بأن التطبيق قيد التطوير سيوفر أقصى قيمة للمنظمة؟","options":[{"key":"A","letter":"أ","text":"استخدام دورة حياة تطوير النظم الرسمية."},{"key":"B","letter":"ب","text":"مشاركة المستخدم النهائي."},{"key":"C","letter":"ج","text":"التوثيق الكافي للبرمجيات."},{"key":"D","letter":"د","text":"مرحلة اختبار عدم الانحدار الرسمية"}],"explanation":"أ. خطأ لأن استخدام SDLC يضمن التنظيم والجودة لكنه لا يضمن تحقيق القيمة الفعلية من وجهة نظر المستخدم.\n\nب. صحيح لأن مشاركة المستخدم النهائي تضمن أن النظام يلبي الاحتياجات الفعلية ويحقق أقصى قيمة للمنظمة.\n\nج. خطأ لأن التوثيق مهم للصيانة لكنه لا يضمن تحقيق قيمة الأعمال.\n\nد. خطأ لأن اختبار عدم الانحدار يركز على جودة التعديلات وليس على تحقيق القيمة.","oldQNumber":"30","bankIndex":302,"setId":"set5"},{"id":"445","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"طُلب من المدير التنفيذي للمراجعة الداخلية (CAE) تقييم اقتراح رئيس مسؤولي التكنولوجيا بالاستعانة بمصادر خارجية للعديد من الوظائف الرئيسية في قسم تكنولوجيا المعلومات بالمنظمة. أي من الإجراءات التالية سيكون الأنسب لـ CAE لتحديد ما إذا كان الاقتراح يتماشى مع استراتيجية المنظمة؟","options":[{"key":"A","letter":"أ","text":"فهم السياق الاستراتيجي وتقييم ما إذا كانت المعلومات الداعمة موثوقة وكاملة."},{"key":"B","letter":"ب","text":"التأكد من أن عمليات الحوكمة والموافقة شفافة وموثقة ومكتملة."},{"key":"C","letter":"ج","text":"إجراء مراجعة للعناية الواجبة أو تقييم مراجعة الإدارة لعمليات المورد."},{"key":"D","letter":"د","text":"تحديد مؤشرات الأداء الرئيسية ومصادر البيانات."}],"explanation":"أ. صحيح لأنه يركز على مواءمة الاقتراح مع استراتيجية المنظمة والتأكد من جودة وموثوقية المعلومات المستخدمة في اتخاذ القرار.\n\nب. خطأ لأنه يركز على الحوكمة والإجراءات فقط وليس على التوافق الاستراتيجي.\n\nج. خطأ لأنه يتعلق بتقييم الموردين وليس بمواءمة القرار مع استراتيجية المنظمة.\n\nد. خطأ لأنه يركز على قياس الأداء وليس على تقييم الملاءمة الاستراتيجية للاقتراح.","oldQNumber":"35","bankIndex":303,"setId":"set5"},{"id":"450","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"تضع الإدارة خطة لاستعادة الطوارئ. في حالة حدوث ضرر كبير لأنظمة تكنولوجيا المعلومات في المؤسسة، يجب أن تمكن هذه الخطة المؤسسة من استئناف العمليات في موقع استرداد بعد بعض التكوين والتهيئة واستعادة البيانات. ما هو الحل الأمثل للإدارة في هذا السيناريو؟","options":[{"key":"A","letter":"أ","text":"خطة استرداد دافئة."},{"key":"B","letter":"ب","text":"خطة استرداد باردة."},{"key":"C","letter":"ج","text":"خطة استرداد ساخنة."},{"key":"D","letter":"د","text":"خطة عمليات العمل اليدوية."}],"explanation":"أ. صحيح لأنها تتطلب بعض التهيئة واستعادة البيانات قبل استئناف العمل.\n\nب. خطأ لأنها تحتاج إلى إعداد وتجهيز كامل قبل بدء العمل.\n\nج. خطأ لأنها تكون جاهزة للعمل بشكل شبه فوري ولا تحتاج إلى تهيئة كبيرة.\n\nد. خطأ لأنها تعتمد على تنفيذ العمل يدويًا وليست موقعًا لاسترداد الأنظمة.","oldQNumber":"40","bankIndex":304,"setId":"set5"},{"id":"455","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"في أي مرحلة من عملية التعاقد يتم صياغة العقود لنشاط تجاري مقترح؟","options":[{"key":"A","letter":"أ","text":"مرحلة البدء."},{"key":"B","letter":"ب","text":"مرحلة تقديم العروض."},{"key":"C","letter":"ج","text":"مرحلة التطوير."},{"key":"D","letter":"د","text":"مرحلة الإدارة."}],"explanation":"أ. خطأ لأنها مرحلة يتم فيها تحديد الحاجة بشكل عام وليس صياغة العقود.\n\nب. خطأ لأنها مرحلة تقديم العروض وتقييمها وليس إعداد العقود النهائية.\n\nج. صحيح لأنها المرحلة التي يتم فيها إعداد وصياغة العقود الخاصة بالنشاط التجاري المقترح قبل التوقيع النهائي.\n\nد. خطأ لأنها مرحلة إدارة وتنفيذ العقد بعد اعتماده وليس صياغته.","oldQNumber":"45","bankIndex":305,"setId":"set5"},{"id":"460","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"بخصوص إدارة المشروع ، أي من العبارات التالية حول ضغط المشروع صحيحة؟","options":[{"key":"A","letter":"أ","text":"يؤدي إلى زيادة المخاطر وغالبًا ما يؤدي إلى إعادة العمل."},{"key":"B","letter":"ب","text":"إنها تقنية تحسين يتم فيها تنفيذ الأنشطة بشكل متوازٍ بدلاً من التسلسل."},{"key":"C","letter":"ج","text":"يتضمن إعادة تقييم متطلبات المشروع و / أو نطاقه."},{"key":"D","letter":"د","text":"إنها تقنية ضغط تتم فيها إضافة موارد حتى يتمكن المشروع."}],"explanation":"أ. خطأ لأنه يصف أثرًا محتملًا لضغط الجدول وليس تعريف تقنية الضغط نفسها.\n\nب. خطأ لأنه يصف تقنية التوازي (Fast Tracking) وليس إضافة الموارد.\n\nج. خطأ لأنه يتعلق بتغيير النطاق أو المتطلبات وليس ضغط الجدول الزمني.\n\nد. صحيح لأنه في ضغط المشروع يتم تقليل مدة الجدول الزمني غالبًا عن طريق إضافة موارد لتنفيذ الأنشطة بشكل أسرع.","oldQNumber":"50","bankIndex":306,"setId":"set5"},{"id":"465","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بالنسخ الاحتياطي للبيانات؟","options":[{"key":"A","letter":"أ","text":"يجب دائمًا إجراء نسخ احتياطية للنظام في الوقت الفعلي."},{"key":"B","letter":"ب","text":"يجب تخزين النسخ الاحتياطية في موقع آمن داخل الموقع لسهولة الوصول إليها."},{"key":"C","letter":"ج","text":"يؤثر جدول تناوب الشريط على مدة احتفاظ البيانات."},{"key":"D","letter":"د","text":"يجب استعادة وسائط النسخ الاحتياطية فقط في حالة حدوث فشل في الأجهزة أو البرامج."}],"explanation":"أ. خطأ لأنه ليس من الضروري دائمًا إجراء النسخ الاحتياطي في الوقت الفعلي.\n\nب. خطأ لأن أفضل الممارسات تتطلب تخزين النسخ الاحتياطية خارج الموقع لتقليل المخاطر.\n\nج. صحيح لأنه طريقة تناوب الأشرطة (Tape Rotation) تحدد مدة الاحتفاظ بالنسخ الاحتياطية.\n\nد. خطأ لأنه يمكن استخدام النسخ الاحتياطية في حالات متعددة وليس فقط فشل الأجهزة أو البرامج.","oldQNumber":"55","bankIndex":307,"setId":"set5"},{"id":"470","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أي من الضوابط يعتبره المدقق الداخلي الأكثر صلة لتقليل مخاطر تجاوز تكلفة المشروع؟","options":[{"key":"A","letter":"أ","text":"تتم مراجعة واعتماد طلبات تغيير النطاق من قبل مدير لديه مستوى مناسب من السلطة."},{"key":"B","letter":"ب","text":"تتم مراجعة واعتماد تجاوزات التكلفة من قبل لجنة تحكم يقودها مدير المشروع."},{"key":"C","letter":"ج","text":"توجد عملية رسمية لضمان الجودة لمراجعة طلبات تغيير النطاق قبل تنفيذها."},{"key":"D","letter":"د","text":"توجد عملية رسمية لمراقبة حالة المشروع ومقارنتها بخط الأساس التكلفة."}],"explanation":"أ. خطأ لأنه يركز على تغيير النطاق فقط وليس على التحكم الفعلي بالتكلفة.\n\nب. خطأ لأنه يعتمد على الموافقة على التجاوز بعد حدوثه وليس منعه أو مراقبته.\n\nج. خطأ لأنه يتعلق بضمان الجودة للنطاق وليس بالتحكم في التكلفة.\n\nد. صحيح لأنه يركز على مراقبة الأداء الفعلي للمشروع مقارنة بخط الأساس للتكلفة، مما يساعد على منع تجاوزات التكلفة مبكرًا.","oldQNumber":"60","bankIndex":308,"setId":"set5"},{"id":"475","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي مما يلي هو منهجية تطوير أنظمة المثبتة (الراسخة)؟","options":[{"key":"A","letter":"أ","text":"شلال ( ممنهج ) Waterfall ."},{"key":"B","letter":"ب","text":"مشاريع في بيئات محكومة (PRINCE2) ."},{"key":"C","letter":"ج","text":"مكتبة البنية التحتية لتكنولوجيا المعلومات (ITIL)."},{"key":"D","letter":"د","text":"كوبيت (COBIT)."}],"explanation":"أ. صحيح لأنه منهجية تطوير أنظمة تقليدية تعتمد على مراحل متتابعة وثابتة.\n\nب. خطأ لأنه إطار لإدارة المشاريع وليس منهجية تطوير أنظمة.\n\nج. خطأ لأنه إطار لإدارة خدمات تقنية المعلومات وليس تطوير أنظمة.\n\nد. خطأ لأنه إطار حوكمة وتحكم وليس منهجية تطوير.","oldQNumber":"65","bankIndex":309,"setId":"set5"},{"id":"480","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"كيف يقيم المدقق عمل متعهد خارجي؟","options":[{"key":"A","letter":"أ","text":"راجع السياسات والاجراءات المعمول بها في المنظمة"},{"key":"B","letter":"ب","text":"راجع الفواتير المقدمه من المتعهد وقارنها بالموازنة"},{"key":"C","letter":"ج","text":"راجع اتفاقية مستوي الخدمة"},{"key":"D","letter":"د","text":"تأكد من بند التدقيق في اتفاقية مستوى الخدمة"}],"explanation":"أ. خطأ لأنها توفر إطار عام للسياسات الداخلية ولا تقيس أداء المتعهد بشكل مباشر.\n\nب. خطأ لأنها تركز على الجانب المالي فقط ولا تعكس جودة أو مستوى الخدمة.\n\nج. صحيح لأن اتفاقية مستوى الخدمة (SLA) هي الأساس الذي يتم من خلاله تقييم أداء المتعهد ومقارنته بالمعايير المتفق عليها.\n\nد. خطأ لأن وجود بند التدقيق مهم لكنه لا يقيس أداء المتعهد بحد ذاته بل يتيح إمكانية المراجعة فقط.","oldQNumber":"70","bankIndex":310,"setId":"set5"},{"id":"485","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"في أي مرحلة من مراحل تطوير الأنظمة يجب على المدقق الداخلي التحقق من اتصال التطبيق الجديد بأنظمة المنظمة الأخرى قد تم إنشاؤه بالشكل الصحيح؟","options":[{"key":"A","letter":"أ","text":"أثناء صيانة التطبيق الجديد."},{"key":"B","letter":"ب","text":"أثناء اختبار التطبيق الجديد."},{"key":"C","letter":"ج","text":"قبل اختبار التطبيق الجديد."},{"key":"D","letter":"د","text":"أثناء تنفيذ التطبيق الجديد."}],"explanation":"أ. خطأ لأنها مرحلة لاحقة بعد التشغيل، وليست مرحلة تحقق من التكامل.\n\nب. خطأ لأن الاختبار يُستخدم للتحقق من الوظائف بعد بناء التكامل، وليس لإنشاء الاتصال نفسه.\n\nج. صحيح لأنه يجب التأكد من إنشاء الاتصال والتكامل بشكل صحيح قبل الدخول في مرحلة الاختبار لضمان اختبار بيئة سليمة.\n\nد. خطأ لأن التنفيذ يركز على تشغيل النظام وليس التحقق التفصيلي من التكامل قبل الاختبار.","oldQNumber":"76","bankIndex":311,"setId":"set5"},{"id":"490","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"قررت إحدى المنظمات الاستعانة بوظيفة الموارد البشرية. كجزء من عملية نقل البيانات، تقوم المنظمة بتنفيذ ضوابط على بيانات الموظفين الحساسة. ما هو التحكم التوجيهي الأكثر ملاءمة في هذا المجال؟","options":[{"key":"A","letter":"أ","text":"طلب تقرير Service Organization Controls (SOC) من مقدم الخدمة."},{"key":"B","letter":"ب","text":"تضمين شرط حماية البيانات في العقد مع مقدم الخدمة."},{"key":"C","letter":"ج","text":"الحصول على اتفاقية عدم إفشاء من كل موظف في مقدم الخدمة الذي سيتعامل مع البيانات الحساسة."},{"key":"D","letter":"د","text":"تشفير بيانات الموظفين قبل إرسالها إلى مقدم الخدمة."}],"explanation":"أ. خطأ لأنه يوفر تقييمًا رقابيًا وليس تحكمًا توجيهيًا مباشرًا يفرض التزامات محددة على مقدم الخدمة.\n\nب. صحيح لأنه يحدد بشكل رسمي وملزم مسؤوليات حماية البيانات داخل العلاقة التعاقدية، وهو جوهر التحكم التوجيهي.\n\nج. خطأ لأنه إجراء داعم يركز على الأفراد وليس على الإطار التوجيهي العام للعلاقة مع مقدم الخدمة.\n\nد. خطأ لأنه تحكم وقائي تقني (تشفير) وليس تحكمًا توجيهيًا.","oldQNumber":"81","bankIndex":312,"setId":"set5"},{"id":"495","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي من خطط استرداد الكوارث في مجال تقنية المعلومات التالية تتضمن موقعًا بعيدًا مخصصًا للاسترداد مع مساحة متاحة للخدمات الأساسية، مثل الإنترنت والاتصالات الهاتفية، ولكن لا يحتوي على خوادم أو معدات للبنية التحتية؟","options":[{"key":"A","letter":"أ","text":"موقع مجمد (Frozen site)"},{"key":"B","letter":"ب","text":"موقع بارد (Cold site)"},{"key":"C","letter":"ج","text":"موقع دافئ (Warm site)"},{"key":"D","letter":"د","text":"موقع ساخن (Hot site)"}],"explanation":"أ. خطأ لأنه ليس تصنيفًا شائع الاستخدام في خطط استعادة الكوارث القياسية.\n\nب. صحيح لأنه يوفر موقعًا جاهزًا بالبنية الأساسية (مثل الكهرباء والاتصالات) دون وجود أجهزة أو خوادم جاهزة.\n\nج. خطأ لأنه يحتوي عادةً على تجهيزات جزئية ويمكن تهيئته بسرعة أكبر من الموقع البارد.\n\nد. خطأ لأنه يكون جاهزًا بالكامل ويحتوي على أنظمة وخوادم تعمل بشكل فوري تقريبًا.","oldQNumber":"86","bankIndex":313,"setId":"set5"},{"id":"500","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"وضعت مؤسسة خطة رسمية لمشروع كبير. أي مما يلي يجب أن يكون الخطوة الأولى في خطة إدارة المشروع؟","options":[{"key":"A","letter":"أ","text":"تقدير الوقت المطلوب لإكمال المشروع بأكمله."},{"key":"B","letter":"ب","text":"تحديد الاستجابات لمخاطر المشروع المتوقعة."},{"key":"C","letter":"ج","text":"تقسيم المشروع إلى مكونات قابلة للإدارة."},{"key":"D","letter":"د","text":"تحديد الموارد اللازمة لإكمال المشروع."}],"explanation":"أ. خطأ لأنه لا يمكن تقدير الوقت بدقة قبل تحديد مكونات المشروع وأنشطته.\n\nب. خطأ لأنه يتم تحديد استجابات المخاطر بعد فهم نطاق المشروع ومكوناته.\n\nج. صحيح لأنه يمثل الأساس للتخطيط، حيث يتم تقسيم المشروع إلى أجزاء يمكن إدارتها وتقديرها ومتابعتها.\n\nد. خطأ لأنه لا يمكن تحديد الموارد المطلوبة بشكل دقيق قبل تقسيم المشروع إلى مكوناته وأنشطته.","oldQNumber":"91","bankIndex":314,"setId":"set5"},{"id":"505","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"متى يتم تسوية(اغلاق) العقد؟","options":[{"key":"A","letter":"أ","text":"عندما يكون هناك نزاع بين أطراف العقد."},{"key":"B","letter":"ب","text":"عندما يتم تنفيذ جميع الالتزامات التعاقدية."},{"key":"C","letter":"ج","text":"عندما تكون هناك قوة قاهرة."},{"key":"D","letter":"د","text":"عندما يتم تفعيل بند الإنهاء."}],"explanation":"أ. خطأ لأنه عند وجود نزاع قد يستمر العقد أو يتم اللجوء إلى إجراءات لحل النزاع.\n\nب. صحيح لأنه يتم إغلاق العقد بعد استكمال جميع الالتزامات والحقوق المتفق عليها بين الأطراف.\n\nج. خطأ لأن القوة القاهرة قد تؤدي إلى تعليق أو تعديل أو إنهاء العقد حسب شروطه، وليس بالضرورة إغلاقه.\n\nد. خطأ لأن تفعيل بند الإنهاء يؤدي إلى إنهاء العقد، بينما إغلاق العقد يكون عادةً بعد استكمال الالتزامات التعاقدية.","oldQNumber":"96","bankIndex":315,"setId":"set5"},{"id":"510","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي مما يلي يصف موقع التعافي من الكوارث الذي يحتوي على الكهرباء وتكييف الهواء ولكن لا يحتوي على أجهزة أو نسخ احتياطية من البيانات؟","options":[{"key":"A","letter":"أ","text":"موقع دافئ"},{"key":"B","letter":"ب","text":"الموقع البارد"},{"key":"C","letter":"ج","text":"موقع ساخن"},{"key":"D","letter":"د","text":"موقع مشترك"}],"explanation":"أ. خطأ لأن الموقع الدافئ يحتوي عادةً على بعض التجهيزات أو البنية الجزئية وليس مجرد مرافق أساسية فقط.\n\nب. صحيح لأن الموقع البارد يوفر فقط البنية التحتية الأساسية مثل الكهرباء والتكييف، دون أجهزة أو بيانات، ويحتاج وقتًا للتجهيز بعد الكارثة.\n\nج. خطأ لأن الموقع الساخن يكون مجهزًا بالكامل وجاهزًا للتشغيل الفوري.\n\nد. خطأ لأنه ليس تصنيفًا قياسيًا ضمن أنواع مواقع التعافي من الكوارث.","oldQNumber":"101","bankIndex":316,"setId":"set5"},{"id":"515","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي من الاعتبارات التالية يجب أن يكون الاعتبار الأساسي لبند حق التدقيق في العقد؟","options":[{"key":"A","letter":"أ","text":"يجب أن يكون بيانًا بسيطًا يمنح المنظمة المتعاقدة حق إجراء التدقيق."},{"key":"B","letter":"ب","text":"يجب أن يوضح بجلاء الشروط والمعايير اللازمة لإجراء التدقيق في ظروف معقولة ومقبولة."},{"key":"C","letter":"ج","text":"يجب أن يكون بيانًا تفصيليًا يمنح المنظمة المتعاقد معها حق إجراء التدقيق."},{"key":"D","letter":"د","text":"يجب أن يصف بوضوح واختصار الشروط والمعايير التي تحظر قدرة المنظمة على إجراء التدقيق"}],"explanation":"أ. خطأ لأنه البساطة وحدها لا تكفي ما لم تُحدد شروط وضوابط واضحة لممارسة حق التدقيق.\n\nب. صحيح لأن بند حق التدقيق يجب أن يحدد بوضوح شروط ومعايير إجراء التدقيق بشكل عملي ومقبول لضمان إمكانية تنفيذه فعليًا.\n\nج. خطأ لأن الإفراط في التفصيل لا يعكس الهدف الأساسي للبند وقد يحد من مرونته.\n\nد. خطأ لأنه يتعارض مع الهدف الأساسي من حق التدقيق لأنه يضع قيودًا تمنع ممارسته.","oldQNumber":"107","bankIndex":317,"setId":"set5"},{"id":"520","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"ردًا على سؤال طرحه أحد مراجعي الحسابات الداخليين، أشارت الإدارة إلى وجود اتفاق قائم لاستئجار خوادم ومحطات عمل مكتبية بسرعة لاستعادة العمليات من الأشرطة المخزنة في موقع خارجي. أي من الخطط التالية التي من المرجح أن يستنتج المدقق أنها موجودة حاليًا في المؤسسة؟","options":[{"key":"A","letter":"أ","text":"خطة الاسترداد السريع."},{"key":"B","letter":"ب","text":"لا توجد خطة استرداد."},{"key":"C","letter":"ج","text":"خطة استرداد باردة."},{"key":"D","letter":"د","text":"خطة التعافي الدافئ."}],"explanation":"أ. خطأ لأنه في خطة الاسترداد السريع تكون الأجهزة جاهزة للعمل مباشرة.\n\nب. خطأ لأن المؤسسة لديها خطة للتعافي وليست بدون خطة.\n\nج. خطأ لأن الخطة الباردة لا توفر الأجهزة بسرعة، بل يتم تجهيزها بعد الكارثة ويستغرق ذلك وقتًا طويلًا.\n\nد. صحيح لأنه توجد ترتيبات لاستئجار الخوادم بسرعة واستعادة البيانات من النسخ الاحتياطية، وهذا يطابق خطة التعافي الدافئ.","oldQNumber":"112","bankIndex":318,"setId":"set5"},{"id":"525","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"قامت إحدى المؤسسات بتعهيد وظيفة الرواتب إلى مزود خدمة خارجي. أي بند في العقد هو الأكثر أهمية لتضمينه في الاتفاقية لضمان الوصول إلى سجلات المزود التابع لجهة خارجية؟","options":[{"key":"A","letter":"أ","text":"بند الإنهاء"},{"key":"B","letter":"ب","text":"بند الحق في التدقيق"},{"key":"C","letter":"ج","text":"بند السرية"},{"key":"D","letter":"د","text":"بند المساءلة عن أمن البيانات"}],"explanation":"أ. خطأ لأن بند الإنهاء يتعلق بإنهاء العقد وليس بمنح حق الوصول إلى السجلات.\n\nب. صحيح لأن بند الحق في التدقيق يضمن للمؤسسة إمكانية الوصول إلى سجلات مزود الخدمة ومراجعتها للتحقق من الأداء والامتثال.\n\nج. خطأ لأن بند السرية يحمي المعلومات ولا يضمن حق الوصول إليها.\n\nد. خطأ لأن بند المساءلة عن أمن البيانات يتعلق بالحماية وليس بحق المراجعة والوصول للسجلات.","oldQNumber":"117","bankIndex":319,"setId":"set5"},{"id":"530","form":"form3","formTitle":"Group 3","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"في أي من السيناريوهات التالية سيكون أحدث نسخة احتياطية لقاعدة بيانات الموارد البشرية أفضل مصدر للمعلومات للاستخدام؟","options":[{"key":"A","letter":"أ","text":"تم تنفيذ تصحيح برنامج غير صحيح قبل النسخ الاحتياطي لقاعدة البيانات مباشرة."},{"key":"B","letter":"ب","text":"تستعد المنظمة لتدريب جميع الموظفين على نظام المزايا الذاتية الجديد."},{"key":"C","letter":"ج","text":"حدث فشل في مركز البيانات يتطلب استعادة النظام في موقع النسخ الاحتياطي."},{"key":"D","letter":"د","text":"هناك حاجة للوصول إلى تقارير التدريب السابقة لنهاية العام لجميع الموظفين في قاعدة بيانات الموارد البشرية."}],"explanation":"أ. خطأ لأنه وجود تصحيح خاطئ قبل النسخ الاحتياطي يعني أن النسخة الاحتياطية قد تحتوي نفس الخطأ.\n\nب. خطأ لأنها حالة تدريب ولا تتطلب استخدام النسخة الاحتياطية.\n\nج. صحيح لأنه عند فشل مركز البيانات يتم الاعتماد على أحدث نسخة احتياطية لاستعادة النظام والبيانات.\n\nد. خطأ لأنه يتعلق بالوصول إلى بيانات تاريخية ويمكن استخدام النظام أو الأرشيف وليس بالضرورة النسخة الاحتياطية الحديثة.","oldQNumber":"122","bankIndex":320,"setId":"set5"},{"id":"4","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"B","question":"ما الذي يصف استخدام التحليلات التنبؤية أفضل مما يلي؟","options":[{"key":"A","letter":"أ","text":"قام مورد قطع غيار كهربائية بتحليل حالات نفاد أنواع مختلفة من قطع الغيار الاحتياطية قبل تسليمها المجدول."},{"key":"B","letter":"ب","text":"قام مورد قطع غيار كهربائية بتحليل المبيعات، وتطبيق الافتراضات المتعلقة بالظروف الجوية، وتحديد المواقع التي سينخفض مستوى المخزون فيها بشكل أسرع."},{"key":"C","letter":"ج","text":"قام مورد قطع غيار كهربائية بتحليل جميع حالات نفاد قطعة غيار معينة قبل تاريخ تسليمها المجدول واكتشف أن الزيادة في مبيعات تلك القطعة ترتبط باستمرار بالطقس العاصف."},{"key":"D","letter":"د","text":"قام مورد قطع غيار كهربائية بتحليل معلومات المبيعات والمخزون ونمذجة سيناريوهات مختلفة لاتخاذ قرارات بشأن إعادة طلب المخزون والتسليم."}],"explanation":"أ. خطأ لأنه يصف تحليلًا وصفيًا لحالات سابقة دون التنبؤ بالمستقبل.\n\nب. صحيح لأنه يعتمد على بيانات حالية وافتراضات للتنبؤ بما سيحدث مستقبلًا في المخزون.\n\nج. خطأ لأنه يركز على اكتشاف علاقات تاريخية وليس التنبؤ المباشر.\n\nد. خطأ لأنه أقرب إلى التحليل التوجيهي الذي يوصي بالقرارات وليس التنبؤ فقط.","oldQNumber":"4","bankIndex":321,"setId":"set1"},{"id":"8","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"C","question":"يستخدم المدقق الداخلي تحليلات البيانات وقد حصل عليها للتو اي مما يلي سيكون الخطوة المنطقية التالية التي يجب عىل المدقق اتخاذها ؟","options":[{"key":"A","letter":"أ","text":"تحليل البيانات"},{"key":"B","letter":"ب","text":"تتبع النتائج الى وثائق المصدر."},{"key":"C","letter":"ج","text":"تنظيف البيانات وتطبيعها"},{"key":"D","letter":"د","text":"تحديد المشكلة"}],"explanation":"أ. خطأ لأن تحليل البيانات يأتي بعد تجهيز البيانات وليس مباشرة بعد الحصول عليها.\n\nب. خطأ لأن تتبع النتائج إلى الوثائق يتم بعد التحليل وليس في البداية.\n\nج. صحيح لأنه بعد الحصول على البيانات يجب تنظيفها وتطبيعها قبل أي تحليل.\n\nد. خطأ لأن تحديد المشكلة يتم في مرحلة التخطيط قبل معالجة البيانات.","oldQNumber":"8","bankIndex":322,"setId":"set1"},{"id":"13","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"A","question":"أي مما يلي من شأنه تسهيل الحصول على بيانات نظيفة لتحليلات البيانات ؟","options":[{"key":"A","letter":"أ","text":"استخدام السياسات والاجراءات المقررة لضمان النزاهة وسهولة استخدام البيانات"},{"key":"B","letter":"ب","text":"تجنب استخدام البيانات من أنظمة تكنولوجيا المعلومات المتعددة واستخدام البيانات فقط من نظام تكنولوجيا المعلومات واحد"},{"key":"C","letter":"ج","text":"تجنب نقاط البيانات غتر المتوقعة أو الغريبة أو غيرالمطابقة أو التي لا يمكن تصنيفها بسهولة"},{"key":"D","letter":"د","text":"استخدام البيانات الكمية فقط."}],"explanation":"أ. صحيح لأنه وجود سياسات وإجراءات حوكمة بيانات يساعد على ضمان جودة ونظافة البيانات.\n\nب. خطأ لأن حصر البيانات في نظام واحد يقلل من شمولية التحليل وليس شرطًا لتحسين نظافة البيانات.\n\nج. خطأ لأن استبعاد القيم غير المتوقعة قد يؤدي إلى فقدان معلومات مهمة وليس حلًا منهجيًا.\n\nد. خطأ لأن استخدام البيانات الكمية فقط يقلل من جودة التحليل ولا يضمن نظافة البيانات.","oldQNumber":"13","bankIndex":323,"setId":"set1"},{"id":"18","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"B","question":"يرغب مدقق داخلي في اختبار سبب الانخفاض الكبير في حجم حسابات الدائنين الشهر الماضي، ويقوم بإنشاء عدة سيناريوهات للمساعدة في تفسير هذا الشذوذ. أي مما يلي يصف أفضل هذا الاسلوب لتحليل البيانات؟","options":[{"key":"A","letter":"أ","text":"وصفي"},{"key":"B","letter":"ب","text":"تشخيصي"},{"key":"C","letter":"ج","text":"تنبؤي"},{"key":"D","letter":"د","text":"توجيهي"}],"explanation":"أ. خطأ لأنه التحليل الوصفي يكتفي بعرض ما حدث دون تفسير الأسباب.\n\nب. صحيح لأنه يهدف إلى تفسير سبب حدوث الانخفاض من خلال تحليل الشذوذات والسيناريوهات.\n\nج. خطأ لأن التحليل التنبؤي يركز على توقع المستقبل وليس تفسير الماضي.\n\nد. خطأ لأن التحليل التوجيهي يقدم توصيات للحل وليس تفسير السبب.","oldQNumber":"18","bankIndex":324,"setId":"set1"},{"id":"23","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"D","question":"أي من السمات التالية للبيانات من المرجح أن تتأثر في مؤسسة ذات ثقافة ضعيفة لحوكمة البيانات؟","options":[{"key":"A","letter":"أ","text":"التنوع."},{"key":"B","letter":"ب","text":"السرعة."},{"key":"C","letter":"ج","text":"الحجم."},{"key":"D","letter":"د","text":"الموثوقية/الصدق."}],"explanation":"أ. خطأ لأنه التنوع يتعلق بمصادر وأشكال البيانات وليس مباشرة بجودة الحوكمة.\n\nب. خطأ لأن السرعة تتعلق بسرعة توليد البيانات وليس مدى صحتها.\n\nج. خطأ لأن الحجم مرتبط بكمية البيانات وليس بجودتها.\n\nد. صحيح لأن ضعف حوكمة البيانات يؤدي بشكل مباشر إلى ضعف موثوقية البيانات ودقتها.","oldQNumber":"23","bankIndex":325,"setId":"set1"},{"id":"28","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"D","question":"فيما يتعلق بعملية تحليل البيانات، ما الذي يصف بشكل أفضل الغرض من المراجع الداخلي الذي قام بتنظيف وتطبيع البيانات؟","options":[{"key":"A","letter":"أ","text":"قام المراجع بإزالة المعلومات المكررة."},{"key":"B","letter":"ب","text":"قام المراجع بتنظيم البيانات لتقليل المعلومات غير المفيدة."},{"key":"C","letter":"ج","text":"قام المراجع بجعل البيانات قابلة للاستخدام لغرض محدد من خلال ضمان تحديد وتصحيح الشذوذات."},{"key":"D","letter":"د","text":"تأكد المراجع من اتساق حقول البيانات وإمكانية استخدام البيانات لغرض محدد."}],"explanation":"أ. خطأ لأن إزالة التكرار جزء جزئي فقط من التنظيف وليس الغرض الكامل للتطبيع.\n\nب. خطأ لأن تنظيم البيانات لا يعبّر بدقة عن عملية التنظيف والتطبيع.\n\nج. خطأ لأن معالجة الشذوذات جزء من التنظيف وليس الوصف الأدق للتطبيع معًا.\n\nد. صحيح لأنه يعكس الهدف الأساسي من تنظيف وتطبيع البيانات وهو ضمان الاتساق وقابلية الاستخدام للتحليل.","oldQNumber":"28","bankIndex":326,"setId":"set1"},{"id":"33","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"C","question":"حدد نموذج تحليلي أنه في ليالي الجمعة والسبت يجب أن تظل متاجر العلامات التجارية الفاخرة مفتوحة لساعات طويلة ومع مضاعفة عدد الموظفين الموجودين؛ بينما يمكن تقليل التكاليف في أيام الاثنين والثلاثاء عن طريق تقليل عدد الموظفين إلى الحد الأدنى والفتح فقط لساعات المساء. أي مما يلي يصنف النموذج التحليلي المطبق على أفضل وجه؟","options":[{"key":"A","letter":"أ","text":"الوصفي. Descriptive."},{"key":"B","letter":"ب","text":"تشخيصي. Diagnostic"},{"key":"C","letter":"ج","text":"الالزامي ( توجيهي / ارشادي ). Prescriptive"},{"key":"D","letter":"د","text":"غزير الانتاج / وافر. Prolific."}],"explanation":"أ. خطأ لأنه التحليل الوصفي يصف ما حدث فقط وليس تقديم توصيات تشغيلية.\n\nب. خطأ لأن التحليل التشخيصي يركز على أسباب حدوث الظواهر وليس اقتراح الإجراءات.\n\nج. صحيح لأنه يقدم توصيات مباشرة لتحسين التشغيل مثل أوقات العمل وعدد الموظفين.\n\nد. خطأ لأن “وافر” ليس نوعًا معتمدًا من أنواع التحليلات","oldQNumber":"33","bankIndex":327,"setId":"set1"},{"id":"38","form":"form4","formTitle":"Group 4","lesson":"أ- تحليل البيانات","answer":"B","question":"في مصنع تصنيع ، كيف يفيد استخدام إنترنت الأشياء أثناء عملية الإنتاج و التصنيع المنظمة؟","options":[{"key":"A","letter":"أ","text":"سيساعد في الكشف عن الهجمات الإلكترونية في الوقت المناسب"},{"key":"B","letter":"ب","text":"سيوفر القدرة على المراقبة في الوقت الحقيقي"},{"key":"C","letter":"ج","text":"من شأنه أن يساعد في ضمان الحفاظ على سلامة البيانات"},{"key":"D","letter":"د","text":"سيساعد في تأمين البيانات الحساسة"}],"explanation":"أ. خطأ لأن كشف الهجمات الإلكترونية ليس الهدف الأساسي لإنترنت الأشياء في التصنيع.\n\nب. صحيح لأنه يتيح مراقبة العمليات والإنتاج بشكل لحظي أثناء التشغيل.\n\nج. خطأ لأن سلامة البيانات ليست الفائدة الأساسية المباشرة من IoT في الإنتاج.\n\nد. خطأ لأن تأمين البيانات الحساسة يتعلق بالأمن السيبراني وليس وظيفة التشغيل الأساسية لإنترنت الأشياء.","oldQNumber":"38","bankIndex":328,"setId":"set1"},{"id":"45","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي يصف بشكل أفضل هجومًا إلكترونيًا تواجه فيه مؤسسة تهديدًا بالحرمان من الخدمة يتم إنشاؤه من خلال تشفير البيانات الضارة؟","options":[{"key":"A","letter":"أ","text":"التصيد."},{"key":"B","letter":"ب","text":"برامج الفدية."},{"key":"C","letter":"ج","text":"القرصنة."},{"key":"D","letter":"د","text":"برمجيات خبيثة هجوم مالوير."}],"explanation":"أ. خطأ لأن التصيد يهدف إلى خداع المستخدمين للحصول على بيانات وليس تشفيرها أو تعطيل الخدمة.\n\nب. خطأ لأن برامج الفدية هي نوع محدد من البرمجيات الخبيثة، لكنها ليست الخيار المعتمد في هذا السؤال.\n\nج. خطأ لأن القرصنة مصطلح عام ولا يصف هذا النوع من الهجوم.\n\nد. صحيح لأنها تشير بشكل عام إلى هجوم برمجيات خبيثة (Malware) والذي يمكن أن يتضمن تشفير البيانات والتسبب في تعطيل الخدمة.","oldQNumber":"6","bankIndex":329,"setId":"set2"},{"id":"50","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما ميزة الأمان التي تحدد موظفة شرعية تستخدم جهازها الذكي الخاص للوصول إلى تطبيق تديره المنظمة؟","options":[{"key":"A","letter":"أ","text":"استخدام ميزة الجهاز الذكي الذي تم كسره أو التجذير."},{"key":"B","letter":"ب","text":"استخدام الأجهزة الذكية فقط التي تمت الموافقة عليها مسبقًا من قبل المنظمة."},{"key":"C","letter":"ج","text":"الحصول على تأكيد كتابي من الموظف على اتباع سياسات وإجراءات الأمان."},{"key":"D","letter":"د","text":"طرح سؤال أمان تعرفه الموظفة فقط."}],"explanation":"أ خطا لأنه كسر الحماية أو التجذير يزيد المخاطر الأمنية ولا يثبت هوية المستخدم.\nب صحيح لأنه يضمن استخدام أجهزة معتمدة وآمنة من قبل المنظمة.\nج خطا لأنه إجراء التزام وليس وسيلة تحقق أو مصادقة.\nد خطا لأنه وسيلة مصادقة ضعيفة ويمكن تجاوزها بسهولة.","oldQNumber":"11","bankIndex":330,"setId":"set2"},{"id":"55","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين (IIA) بشأن تكنولوجيا المعلومات، أي مما يلي يتحكم في توجيه حزم البيانات إلى أجهزة الكمبيوتر المرتبطة؟","options":[{"key":"A","letter":"أ","text":"نظام التشغيل"},{"key":"B","letter":"ب","text":"بيئة التحكم"},{"key":"C","letter":"ج","text":"الشبكة"},{"key":"D","letter":"د","text":"رمز برنامج التطبيق"}],"explanation":"أ. خطأ لأن نظام التشغيل يدير الجهاز نفسه ولا يقوم بتوجيه الحزم عبر الشبكات.\n\nب. خطأ لأن بيئة التحكم مفهوم عام وليس مكوّنًا تقنيًا مسؤولًا عن توجيه البيانات.\n\nج. صحيح لأن الشبكة (Network) هي المسؤولة عن توجيه حزم البيانات بين الأجهزة المرتبطة عبر بروتوكولات التوجيه.\n\nد. خطأ لأن رمز التطبيق يتعلق بوظائف البرنامج وليس بإدارة حركة البيانات عبر الشبكة.","oldQNumber":"16","bankIndex":331,"setId":"set2"},{"id":"60","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما هو الغرض الأساسي لضوابط بالنزاهة؟","options":[{"key":"A","letter":"أ","text":"لضمان اكتمال معالجة البيانات ودقتها وتصريحها."},{"key":"B","letter":"ب","text":"لضمان بقاء البيانات التي يتم معالجتها متسقة وسليمة."},{"key":"C","letter":"ج","text":"لمراقبة فعالية عناصر تحكم أخرى."},{"key":"D","letter":"د","text":"لضمان توافق الناتج مع النتيجة المقصودة."}],"explanation":"أ. خطأ لأن هذا يصف جوانب من الدقة والتفويض وليس تعريف ضوابط النزاهة بشكل مباشر.\n\nب. صحيح لأن ضوابط النزاهة (Integrity Controls) تهدف إلى ضمان أن البيانات تبقى صحيحة، متسقة، وغير معدلة بشكل غير مصرح به أثناء المعالجة.\n\nج. خطأ لأنها تصف ضوابط رقابية/مراقبة وليست ضوابط نزاهة.\n\nد. خطأ لأنها تتعلق بمطابقة النتائج للأهداف وليس بنزاهة البيانات نفسها.","oldQNumber":"21","bankIndex":332,"setId":"set2"},{"id":"65","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من أنواع الشبكات التالية يجب أن تختارها المؤسسة إذا كانت تريد السماح بالوصول إلى موظفيها فقط؟","options":[{"key":"A","letter":"أ","text":"شبكة إكسترانت"},{"key":"B","letter":"ب","text":"شبكة محلية"},{"key":"C","letter":"ج","text":"شبكة إنترانت"},{"key":"D","letter":"د","text":"الإنترنت"}],"explanation":"أ. خطأ لأنها تسمح أيضاً بوصول جهات خارجية محددة مثل الشركاء أو الموردين.\n\nب. خطأ لأنها شبكة محلية (LAN) محدودة بالنطاق الجغرافي وليست مخصصة للتحكم في صلاحيات الوصول التنظيمية.\n\nج. صحيح لأنها شبكة داخلية (Intranet) مخصصة حصرياً لموظفي المؤسسة وتوفر وصولاً داخلياً آمناً.\n\nد. خطأ لأنه مفتوح للعامة ولا يقتصر على موظفي المؤسسة.","oldQNumber":"26","bankIndex":333,"setId":"set2"},{"id":"70","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"ما هو الغرض الأساسي من تثبيت جدار حماية في شبكة إحدى المؤسسات؟","options":[{"key":"A","letter":"أ","text":"تراقب جدران الحماية وتتحكم في حركة المرور الواردة والصادرة بناءً على قواعد وتكوينات الأمان المحددة مسبقًا."},{"key":"B","letter":"ب","text":"تراقب جدران الحماية حركة مرور الشبكة بحثًا عن مؤشرات على اختراق نظام أو محاولة اختراقه."},{"key":"C","letter":"ج","text":"توفر جدران الحماية وصولاً لاسلكيًا إلى الشبكة."},{"key":"D","letter":"د","text":"تنقل جدران الحماية البيانات بين الشبكات."}],"explanation":"أ صحيح لأنه جدار الحماية يهدف إلى التحكم في حركة المرور الداخلة والخارجة وفق قواعد أمنية محددة مسبقًا.\nب خطا لأنه يصف وظيفة أنظمة كشف التسلل وليس الغرض الأساسي من جدار الحماية.\nج خطا لأنه لا يوفر اتصال لاسلكي بل يتحكم في المرور الشبكي.\nد خطا لأنه لا يقوم بنقل البيانات بين الشبكات بل يراقب ويفلتر المرور.","oldQNumber":"31","bankIndex":334,"setId":"set2"},{"id":"75","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من أدوات التحكم الأمنية الفيزيائية التالية يمكن أن تعمل كتحكم وقائي و اكتشافي؟","options":[{"key":"A","letter":"أ","text":"سجلات المصادقة"},{"key":"B","letter":"ب","text":"قارئات بطاقات المفاتيح"},{"key":"C","letter":"ج","text":"أجهزة قياس البيانات الحيوية"},{"key":"D","letter":"د","text":"مراقبة الفيديو"}],"explanation":"أ. خطأ لأنها تحكم منطقي (وليست فيزيائية) وتُستخدم غالبًا كتحكم كاشف فقط.\n\nب. خطأ لأنها تحكم وقائي فقط لأنها تمنع الدخول غير المصرح به.\n\nج. خطأ لأنها تحكم وقائي فقط للتحقق من الهوية ولا تُستخدم للتحقيق بعد وقوع الحدث.\n\nد. صحيح لأن مراقبة الفيديو تعمل كتحكم وقائي (ردع) وتحقيقي (توثيق الأحداث بعد وقوعها).","oldQNumber":"36","bankIndex":335,"setId":"set2"},{"id":"80","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من العبارات التالية صحيحة فيما يتعلق ببيئة جلب جهازك الخاص (BYOD)؟","options":[{"key":"A","letter":"أ","text":"هناك حاجة أكبر للمؤسسات إلى الاعتماد على المستخدمين في الامتثال للسياسات والإجراءات."},{"key":"B","letter":"ب","text":"مع وجود عدد أقل من الأجهزة التي تملكها المنظمة، هناك حاجة أقل لضمان سياسات وإجراءات موثقة."},{"key":"C","letter":"ج","text":"أوقات الاستجابة للحادث أقل أهمية في بيئة BYOD، مقارنة بالبيئة التقليدية."},{"key":"D","letter":"د","text":"هناك تقاسم أكبر للمخاطر التشغيلية في بيئة BYOD."}],"explanation":"أ. صحيح لأنه في بيئة BYOD تعتمد المنظمة بدرجة أكبر على التزام المستخدمين بالسياسات والإجراءات الأمنية.\n\nب. خطأ لأنه تزداد الحاجة إلى السياسات والإجراءات الموثقة في بيئة BYOD ولا تقل.\n\nج. خطأ لأن سرعة الاستجابة للحوادث تظل مهمة جداً، وقد تكون أكثر أهمية بسبب تنوع الأجهزة.\n\nد. خطأ لأن المسؤولية عن إدارة المخاطر تبقى على المنظمة ولا يتم تقاسمها بشكل أكبر بالضرورة.","oldQNumber":"41","bankIndex":336,"setId":"set2"},{"id":"85","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"عند تدقيق البنية التحتية لتكنولوجيا المعلومات ما هي الضوابط التي يركز عليها المدقق؟","options":[{"key":"A","letter":"أ","text":"ضوابط مدخلات"},{"key":"B","letter":"ب","text":"ضوابط ملموسة"},{"key":"C","letter":"ج","text":"ضوابط تخص حقول البيانات"},{"key":"D","letter":"د","text":"ضوابط مخرجات"}],"explanation":"أ خطا لأنه يركز على إدخال البيانات وليس البنية التحتية.\nب صحيح لأنه عند تدقيق البنية التحتية يتم التركيز على الضوابط الملموسة (الفيزيائية) لحماية الأجهزة والمرافق.\nج خطا لأنه يتعلق بتنسيق البيانات داخل الأنظمة وليس البنية التحتية.\nد خطا لأنه يتعلق بنتائج المعالجة وليس البنية التحتية نفسها.","oldQNumber":"46","bankIndex":337,"setId":"set2"},{"id":"90","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"اي من الطرق التالية اذا تم استخدامها مع التبادل الالكتروني للبيانات (EDI) ستعمل على تحسين برنامج ادارة النقد في المؤسسة وتقلل من وقت ادخال بيانات المعاملات والاخطاء والسماح للمؤسسة بالتفاوض بشأن الخصومات مع بائعي التبادل الالكتروني للبيانات بناء على موجه قسط؟","options":[{"key":"A","letter":"أ","text":"النظم القائمة على المعرفة."},{"key":"B","letter":"ب","text":"واجهة المستخدم الرسومية الموحدة ."},{"key":"C","letter":"ج","text":"المؤشرات الحيوية."},{"key":"D","letter":"د","text":"التحويل الالكتروني للاموال."}],"explanation":"أ خطا لأنه لا يرتبط بإدارة النقد أو المعاملات المالية المباشرة.\nب خطا لأنه يتعلق بتسهيل الاستخدام وليس بعمليات مالية.\nج خطا لأنه وسيلة للتحقق من الهوية وليس لمعالجة المدفوعات.\nد صحيح لأنه يدعم تحويل الأموال إلكترونيًا ويقلل الأخطاء والوقت في معالجة المعاملات مع EDI.","oldQNumber":"51","bankIndex":338,"setId":"set2"},{"id":"95","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي مثال على المصادقة ذات العاملين؟","options":[{"key":"A","letter":"أ","text":"هندسة وجه المستخدم والتعرف على صوته."},{"key":"B","letter":"ب","text":"كلمة مرور المستخدم وعبارة مرور منفصلة."},{"key":"C","letter":"ج","text":"سلسلة مفاتيح المستخدم وبطاقة ذكية."},{"key":"D","letter":"د","text":"بصمة المستخدم ورقم تعريف شخصي."}],"explanation":"أ. خطأ لأن كِلا العاملين من نفس الفئة (بيومتري)، وليس عاملين مختلفين.\n\nب. خطأ لأن كلاهما “ما يعرفه المستخدم” (Knowledge factor).\n\nج. خطأ لأن كلاهما “ما يملكه المستخدم” (Possession factor).\n\nد. صحيح لأن المصادقة ذات العاملين تتطلب عاملين مختلفين مثل ما هو المستخدم (بصمة) + ما يعرفه (رقم تعريف شخصي).","oldQNumber":"56","bankIndex":339,"setId":"set2"},{"id":"100","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"وفقًا لتوجيهات IIA، ما الذي يصف بشكل أفضل تطبيق ضوابط مسار المراجعة (التدقيق) الإدارية المناسبة للسجل العام؟","options":[{"key":"A","letter":"أ","text":"تقرير يحدد البيانات التي تخرج عن معايير النظام."},{"key":"B","letter":"ب","text":"تقرير يحدد معاملات السجل العام حسب الوقت والفرد."},{"key":"C","letter":"ج","text":"تقرير يقارن نتائج المعالجة بإدخال البيانات الأصلي."},{"key":"D","letter":"د","text":"تقرير يؤكد معالجة بيانات السجل العام بدون خطأ."}],"explanation":"أ خطا لأنه يركز على استثناءات النظام وليس تتبع العمليات.\nب صحيح لأنه يوفر تتبع للمعاملات حسب الوقت والشخص مما يدعم مسار المراجعة.\nج خطا لأنه يركز على المطابقة بين الإدخال والمعالجة وليس تتبع السجل.\nد خطا لأنه تأكيد عام ولا يوفر تفاصيل تتبع أو مراجعة.","oldQNumber":"61","bankIndex":340,"setId":"set2"},{"id":"105","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"طبقت مؤسسة بيئة عمل تسمح بإحضار أجهزة الموظفين الشخصية (BYOD). أي من السياسات التالية تعالج بشكل أفضل المخاطر المتزايدة على شبكة المنظمة التي تنطوي عليها هذه البيئة؟","options":[{"key":"A","letter":"أ","text":"حد استخدام أجهزة الموظفين للاستخدام الشخصي لتخفيف مخاطر التعرض لبيانات المنظمة"},{"key":"B","letter":"ب","text":"ضمان التحكم الصارم في الوصول المناسب للتطبيقات الرئيسية من خلال عملية الموافقة والمراجعة"},{"key":"C","letter":"ج","text":"تطبيق عناصر تحكم الكشف والمصادقة لجميع الأجهزة المستخدمة لاتصال الشبكة وتخزين البيانات"},{"key":"D","letter":"د","text":"استخدام برامج الإدارة للفحص ثم مطالبة بتذكيرات التصحيح عند اتصال الأجهزة بالشبكة"}],"explanation":"أ. خطأ لأنه تقليل الاستخدام الشخصي لا يعالج بشكل مباشر مخاطر أمن الأجهزة أو الشبكة.\n\nب. خطأ لأنه يركز على التطبيقات وليس على حماية الأجهزة المتصلة بالشبكة.\n\nج. خطأ لأنه رغم أنه مهم إلا أنه عام ولا يغطي إدارة الأجهزة المستمرة والتحديثات.\n\nد. صحيح لأنه استخدام برامج إدارة الأجهزة (MDM) لفحص الأجهزة وتطبيق التحديثات والتصحيحات يقلل مخاطر BYOD بشكل مباشر عند الاتصال بالشبكة.","oldQNumber":"66","bankIndex":341,"setId":"set2"},{"id":"110","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"تعد المنظمة بيانًا بالخصوصية لحماية المعلومات الشخصية للعملاء. ما الذي قد ينتهك مبادئ الخصوصية؟","options":[{"key":"A","letter":"أ","text":"يمكن للعملاء الوصول إلى المعلومات الشخصية وتحديثها عند الحاجة"},{"key":"B","letter":"ب","text":"تحتفظ المنظمة بالمعلومات الشخصية للعملاء
