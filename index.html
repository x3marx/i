lanation":"أ. خطأ لأنه قرار تقني غالبًا يتم داخل قسم تقنية المعلومات.\n\nب. صحيح لأنه يتطلب مشاركة عدة أقسام لتحديد الأنظمة الأكثر أهمية للأعمال وترتيب أولويتها في الاستعادة.\n\nج. خطأ لأنه يخص قسم تقنية المعلومات فقط وليس أصحاب مصلحة متعددين.\n\nد. خطأ لأنه قد يشمل أكثر من قسم لكن غالبًا يركز على الموارد التقنية والمالية دون تحديد أولويات الأعمال.","oldQNumber":"27","bankIndex":513,"setId":"set5"},{"id":"442","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي من الخيارات التالية يصف بشكل أفضل استراتيجية تنافسية تركز فيها المنظمة على محاولات أن تكون أكثر كفاءة من المنافسين؟","options":[{"key":"A","letter":"أ","text":"استراتيجية التميّز"},{"key":"B","letter":"ب","text":"استراتيجية قيادة التكلفة"},{"key":"C","letter":"ج","text":"استراتيجية التركيز"},{"key":"D","letter":"د","text":"استراتيجية المحفظة"}],"explanation":"أ. خطأ لأن استراتيجية التميّز تركز على تقديم منتجات أو خدمات فريدة وليس على الكفاءة وخفض التكلفة.\n\nب. صحيح لأن استراتيجية قيادة التكلفة تهدف إلى أن تكون المنظمة الأكثر كفاءة في السوق من خلال تقليل التكاليف مقارنة بالمنافسين.\n\nج. خطأ لأن استراتيجية التركيز تعتمد على استهداف شريحة محددة وليس على خفض التكلفة بشكل عام.\n\nد. خطأ لأن استراتيجية المحفظة تتعلق بإدارة مجموعة أعمال وليس بالميزة التنافسية المباشرة في الكفاءة.","oldQNumber":"32","bankIndex":514,"setId":"set5"},{"id":"447","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"ما هي منهجية النسخ الاحتياطي الأكثر فعالية في نسخ قاعدة بيانات في بيئة الإنتاج؟","options":[{"key":"A","letter":"أ","text":"عكس القرص للبيانات المخزنة في قاعدة البيانات."},{"key":"B","letter":"ب","text":"نسخة احتياطية تفاضلية يتم تنفيذها أسبوعيا."},{"key":"C","letter":"ج","text":"مجموعة من الأقراص المستقلة تستخدم لنسخ قاعدة البيانات احتياطيًا."},{"key":"D","letter":"د","text":"نسخة احتياطية تزايدية لقاعدة البيانات بشكل يومي."}],"explanation":"أ. خطأ لأنه يوفر تكرارًا للبيانات ولكنه ليس منهجية نسخ احتياطي متكاملة.\n\nب. خطأ لأنه يتم على فترات متباعدة وقد يؤدي إلى فقدان كمية أكبر من البيانات عند الاستعادة.\n\nج. خطأ لأنه وسيلة تخزين وتحسين للتوافر وليس منهجية نسخ احتياطي.\n\nد. صحيح لأنه ينسخ التغييرات الجديدة فقط بشكل يومي، مما يجعله أكثر كفاءة وملاءمة لبيئات الإنتاج.","oldQNumber":"37","bankIndex":515,"setId":"set5"},{"id":"452","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"اضطرت منظمة إلى إيقاف الإنتاج بشكل غير متوقع، حيث لا يمكن تسليم المواد الخام بسبب صراع عسكري في المنطقة. أي من الخطط التالية من المرجح أنها فشلت في دعم المنظمة؟","options":[{"key":"A","letter":"أ","text":"خطط التسليم في الوقت المناسب."},{"key":"B","letter":"ب","text":"خطط النسخ الاحتياطي."},{"key":"C","letter":"ج","text":"خطط الطوارئ."},{"key":"D","letter":"د","text":"الخطط الدائمة."}],"explanation":"أ. خطأ لأن التسليم في الوقت المناسب هو أسلوب تشغيل وليس خطة استمرارية لمعالجة الكوارث.\n\nب. خطأ لأن خطط النسخ الاحتياطي تتعلق بالبيانات والأنظمة وليس بتوريد المواد الخام.\n\nج. صحيح لأن خطط الطوارئ تهدف إلى ضمان استمرارية الأعمال في حالات الأزمات، وفشلها يعني توقف الإنتاج.\n\nد. خطأ لأن الخطط الدائمة ليست نوعًا معتمدًا بشكل مباشر في إدارة استمرارية الأعمال.","oldQNumber":"42","bankIndex":516,"setId":"set5"},{"id":"457","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي من خطط استرداد الكوارث التالية تتضمن موارد استرداد متاحة في الموقع ، ولكن قد يلزم تهيئتها لدعم نظام الإنتاج؟","options":[{"key":"A","letter":"أ","text":"خطة استرداد الموقع الدافئ."},{"key":"B","letter":"ب","text":"خطة استرداد الموقع الساخن."},{"key":"C","letter":"ج","text":"خطة استرداد الموقع البارد."},{"key":"D","letter":"د","text":"خطة استرداد الموقع البارد جدًا."}],"explanation":"أ. صحيح لأنه يحتوي على موارد وتجهيزات متاحة، لكنها قد تحتاج إلى تهيئة قبل دعم نظام الإنتاج.\n\nب. خطأ لأنه يكون مجهزًا بالكامل وجاهزًا للتشغيل بسرعة كبيرة.\n\nج. خطأ لأنه يوفر الموقع والخدمات الأساسية فقط دون تجهيزات استرداد جاهزة.\n\nد. خطأ لأنه يوفر تجهيزات أقل من الموقع البارد ولا يحتوي على موارد استرداد جاهزة للاستخدام.","oldQNumber":"47","bankIndex":517,"setId":"set5"},{"id":"462","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"تقوم إحدى المؤسسات بتطوير أداة تعاون جديدة عبر الإنترنت للموظفين. تتضمن الأداة صفحة رئيسية مخصصة لكل موظف حسب قسمه ووظيفته. أي من المهام التالية يجب إجراؤها للتأكد من أن المنظمة قد أدرجت جميع الأقسام والوظائف الوظيفية في النظام قبل تنفيذها؟","options":[{"key":"A","letter":"أ","text":"مراجعة مراقبة التطبيق"},{"key":"B","letter":"ب","text":"مراجعة كود المصدر"},{"key":"C","letter":"ج","text":"مراجعة التصميم"},{"key":"D","letter":"د","text":"مراجعة التحكم في الوصول"}],"explanation":"أ. خطأ لأنها تركز على أداء النظام أثناء التشغيل وليس على التحقق من شمولية التصميم قبل التنفيذ.\n\nب. خطأ لأنها تركز على البرمجة والتفاصيل التقنية وليس على التحقق من تغطية جميع الأقسام والوظائف.\n\nج. صحيح لأنها المرحلة التي يتم فيها التأكد من أن التصميم يشمل جميع المتطلبات مثل الأقسام والوظائف قبل بناء النظام.\n\nد. خطأ لأنها تركز على صلاحيات الوصول وليس على شمولية تصميم النظام نفسه.","oldQNumber":"52","bankIndex":518,"setId":"set5"},{"id":"467","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أثناء إجراء إجراءات المراجعة في مركز بيانات المنظمة ، لاحظ المراجع الداخلي ما يلي: • كانت وسائط النسخ الاحتياطي موجودة على أرفف مركز البيانات. • تم تنظيم وسائط النسخ الاحتياطي حسب التاريخ. • كان جدول النسخ الاحتياطي لمدة أسبوع واحد. تمكن مسؤول النظام من تقديم سجلات الاستعادة. ما هو الأمر التالي من المعقول أن يستنتجه المراجع الداخلي؟","options":[{"key":"A","letter":"أ","text":"لم يتم تخزين وسائط النسخ الاحتياطي بشكل صحيح ، حيث يجب أن يكون مرفق التخزين خارج الموقع."},{"key":"B","letter":"ب","text":"إجراءات النسخ الاحتياطي كافية ومناسبة وفقًا لأفضل الممارسات."},{"key":"C","letter":"ج","text":"لم يتم فهرسة وسائط النسخ الاحتياطي بشكل صحيح ، حيث يجب فهرستها حسب النظام وليس حسب التاريخ."},{"key":"D","letter":"د","text":"جدول النسخ الاحتياطي غير كافٍ ، حيث يجب إجراء نسخ احتياطي كامل يوميًا."}],"explanation":"أ. صحيح لأنه من أفضل ممارسات أمن واستمرارية الأعمال تخزين النسخ الاحتياطية في موقع خارجي لتجنب فقدانها عند حدوث كارثة في مركز البيانات.\n\nب. خطأ لأن وجود النسخ داخل مركز البيانات يزيد المخاطر ولا يمثل أفضل ممارسة.\n\nج. خطأ لأن طريقة الفهرسة ليست المشكلة الأساسية في السيناريو.\n\nد. خطأ لأن الجدول الزمني للنسخ الاحتياطي لا يمكن الحكم عليه من المعلومات المعطاة وحدها.","oldQNumber":"57","bankIndex":519,"setId":"set5"},{"id":"472","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين (IIA) بشأن تكنولوجيا المعلومات ، أي مما يلي مؤشرات على ضعف إدارة التغيير؟\n\n١. تصميم تحكم غير مناسب.\n\n٢. تعطل غير مخطط له.\n\n٣. استكشاف الأخطاء وإصلاحها المفرطة.\n\n٤. عدم توفر الخدمات الأساسية","options":[{"key":"A","letter":"أ","text":"2 و 3 فقط"},{"key":"B","letter":"ب","text":"1 و 2 و 3 فقط"},{"key":"C","letter":"ج","text":"1 و 3 و 4 فقط"},{"key":"D","letter":"د","text":"2 و 3 و 4 فقط"}],"explanation":"1. خطأ لأنه يشير إلى مشكلة في تصميم الضوابط بشكل عام وليس مؤشرًا مباشرًا على ضعف إدارة التغيير.\n\n2. صحيح لأنه يدل على أن التغييرات غير مُدارة بشكل جيد مما يؤدي إلى أعطال غير مخططة.\n\n3. صحيح لأنه يعكس وجود مشاكل متكررة بعد التغيير تتطلب معالجة مستمرة للأخطاء.\n\n4. صحيح لأنه يشير إلى تأثير سلبي مباشر على توفر الخدمات نتيجة ضعف إدارة التغيير.","oldQNumber":"62","bankIndex":520,"setId":"set5"},{"id":"477","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي من الأدوار التالية مناسب لمدقق داخلي يخدم في مجلس الموافقة على التغيير؟","options":[{"key":"A","letter":"أ","text":"يعمل المدقق كعضو غير مصوت"},{"key":"B","letter":"ب","text":"يعمل المدقق كمتخصص في إدارة المخاطر"},{"key":"C","letter":"ج","text":"المدقق مسؤول عن توثيق التغيير"},{"key":"D","letter":"د","text":"يعمل المدقق كمسير للتغيير"}],"explanation":"أ. صحيح لأن دور المدقق الداخلي في مجلس التغيير يكون عادة مراقبًا أو مستشارًا لضمان الحياد والاستقلالية دون المشاركة في التصويت أو اتخاذ القرار.\n\nب. خطأ لأن تقديم دور تشغيلي كمتخصص في إدارة المخاطر قد يؤثر على استقلالية المدقق.\n\nج. خطأ لأن توثيق التغيير مسؤولية تشغيلية وليست من مهام التدقيق.\n\nد. خطأ لأن المدقق لا يجب أن يكون منفذًا أو مسيرًا للتغيير للحفاظ على استقلاليته.","oldQNumber":"67","bankIndex":521,"setId":"set5"},{"id":"482","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"لدى منظمة اتفاقية مع مورد طرف ثالث للحصول على منشأة تعمل بكامل طاقتها، نسخة طبق الأصل من الموقع الأصلي ومجهزة وفقًا لاحتياجات المنظمة، لاستعادة القدرة التشغيلية بسرعة في حالة حدوث كارثة. ما الذي يصف بشكل أفضل هذا النهج لتخطيط استرداد الكوارث؟","options":[{"key":"A","letter":"أ","text":"خطة الاسترداد البارد."},{"key":"B","letter":"ب","text":"خطة استرداد الاستعانة بمصادر خارجية."},{"key":"C","letter":"ج","text":"خطة استرداد شبكة تخزين المنطقة."},{"key":"D","letter":"د","text":"خطة استرداد ساخن."}],"explanation":"أ. خطأ لأنه الموقع البارد لا يحتوي على تجهيزات أو أنظمة جاهزة ويحتاج وقتًا طويلًا للإعداد.\n\nب. خطأ لأنه يشير إلى أسلوب تعاقد وليس نوع موقع استرداد مجهز بالكامل.\n\nج. خطأ لأنه يتعلق بتقنية تخزين البيانات وليس بنوع موقع استرداد كوارث.\n\nد. صحيح لأنه الموقع الساخن يكون نسخة مطابقة ومجهزة بالكامل ويمكن استخدامها مباشرة لاستعادة العمليات بسرعة بعد الكارثة.","oldQNumber":"72","bankIndex":522,"setId":"set5"},{"id":"487","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"تفكر إحدى المنظمات في الاستعانة بخدمات تقنية المعلومات، ويقوم المدقق الداخلي بتقييم المخاطر المرتبطة بذلك. قام المدقق بتجميع المخاطر ذات الصلة في ثلاث فئات: المخاطر الخاصة بالمنظمة نفسها. المخاطر الخاصة بمقدم الخدمة. المخاطر المشتركة بين المنظمة ومقدم الخدمة. أي من المخاطر التالية يجب أن يصنفها المدقق على أنها خاصة بمقدم الخدمة؟","options":[{"key":"A","letter":"أ","text":"زيادات غير متوقعة في تكاليف الاستعانة بالمصادر الخارجية."},{"key":"B","letter":"ب","text":"فقدان خصوصية البيانات."},{"key":"C","letter":"ج","text":"نقص كادر الموظفين."},{"key":"D","letter":"د","text":"انتهاك شروط العقد."}],"explanation":"أ. خطأ لأنه يرتبط بالمنظمة من ناحية إدارة التكاليف واتخاذ قرار الاستعانة بالمصادر الخارجية.\n\nب. خطأ لأنه يعد من المخاطر المشتركة بين المنظمة ومقدم الخدمة فيما يتعلق بأمن البيانات.\n\nج. صحيح لأنه يتعلق مباشرة بمقدم الخدمة وقدرته على توفير الموارد البشرية اللازمة.\n\nد. خطأ لأنه يرتبط بالعلاقة التعاقدية بين الطرفين ويعد من المخاطر المشتركة.","oldQNumber":"78","bankIndex":523,"setId":"set5"},{"id":"492","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"في ضوء زيادة ضرائب الانبعاثات في الاتحاد الأوروبي ، أدخلت شركة مصنعة للسيارات سيارة هجينة جديدة من الطبقة المتوسطة للسوق الأوروبية فقط. أي من الاستراتيجيات التنافسية التالية استخدمتها الشركة المصنعة؟","options":[{"key":"A","letter":"أ","text":"استراتيجية رد الفعل."},{"key":"B","letter":"ب","text":"استراتيجية قيادة التكلفة."},{"key":"C","letter":"ج","text":"استراتيجية التمايز."},{"key":"D","letter":"د","text":"استراتيجية التركيز."}],"explanation":"أ. خطأ لأنه يصف استجابة عامة للظروف وليس استراتيجية تنافسية محددة للسوق.\n\nب. خطأ لأنه لا يشير إلى خفض التكلفة كهدف أساسي في هذا السيناريو.\n\nج. خطأ لأن التمايز يتعلق بتمييز المنتج بشكل عام في كل الأسواق وليس استهداف سوق محدد.\n\nد. صحيح لأنه تم استهداف سوق محدد (السوق الأوروبية فقط) بمنتج مخصص، وهو ما يمثل استراتيجية التركيز.","oldQNumber":"83","bankIndex":524,"setId":"set5"},{"id":"497","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أي من العبارات التالية صحيحة فيما يتعلق بإدارة التغيير؟","options":[{"key":"A","letter":"أ","text":"تحدد درجة المخاطر المرتبطة بالتغيير المقترح ما إذا كان طلب التغيير يتطلب تفويضًا."},{"key":"B","letter":"ب","text":"يتم تطوير واختبار تغييرات البرنامج بشكل عام في بيئة الإنتاج."},{"key":"C","letter":"ج","text":"لا تتطلب التغييرات سوى البرامج."},{"key":"D","letter":"د","text":"لحماية بيئة الإنتاج ، يجب إدارة التغييرات بطريقة قابلة للتكرار ومحددة ويمكن التنبؤ بها."}],"explanation":"أ. خطأ لأنه رغم أن المخاطر تؤثر على مستوى الموافقة، إلا أنها ليست العامل الوحيد لتحديد التفويض.\n\nب. خطأ لأنه يجب تطوير واختبار التغييرات في بيئات منفصلة عن الإنتاج لتجنب التأثيرات السلبية.\n\nج. خطأ لأن إدارة التغيير تشمل جميع أنواع التغييرات وليس البرامج فقط.\n\nد. صحيح لأنه يجب أن تكون عملية إدارة التغيير منظمة وممنهجة لتقليل الأخطاء وحماية بيئة الإنتاج.","oldQNumber":"88","bankIndex":525,"setId":"set5"},{"id":"502","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"في أي من مراحل التعاقد التالية تقوم المنظمة بتحليل ما إذا كان السوق يتماشى مع أهدافها؟","options":[{"key":"A","letter":"أ","text":"مرحلة البدء"},{"key":"B","letter":"ب","text":"مرحلة تقديم العروض"},{"key":"C","letter":"ج","text":"مرحلة التطوير"},{"key":"D","letter":"د","text":"مرحلة التفاوض"}],"explanation":"أ. صحيح لأنه في مرحلة البدء يتم تقييم احتياجات المنظمة ودراسة السوق للتأكد من توافقه مع الأهداف قبل الدخول في التعاقد.\n\nب. خطأ لأنها مرحلة لاحقة يتم فيها استقبال العروض وليس تحليل مواءمة السوق مع الأهداف.\n\nج. خطأ لأنها مرحلة تطوير إجراءات أو متطلبات التعاقد وليست لتقييم السوق.\n\nد. خطأ لأنها مرحلة يتم فيها التفاوض على الشروط بعد اتخاذ قرار الدخول في التعاقد.","oldQNumber":"93","bankIndex":526,"setId":"set5"},{"id":"507","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"تعاقدت إحدى المنظمات مع مزود خدمة طرف ثالث لتخطيط وتصميم وبناء منشأة جديدة. ترغب الإدارة العليا في نقل جميع المخاطر إلى الباني، ما نوع عقد المشتريات الذي ستستخدمه المنظمة؟","options":[{"key":"A","letter":"أ","text":"عقد التكلفة بالإضافة إلى الربح."},{"key":"B","letter":"ب","text":"عقد تسليم مفتاح مقطوع."},{"key":"C","letter":"ج","text":"عقد الخدمة."},{"key":"D","letter":"د","text":"عقد الحلول."}],"explanation":"أ. خطأ لأنه يعتمد على تغطية التكاليف مع هامش ربح، وبالتالي لا ينقل المخاطر بالكامل للمقاول.\n\nب. صحيح لأنه عقد تسليم مفتاح (Turnkey) يضع مسؤولية التصميم والتنفيذ والتسليم بالكامل على البائع، وبالتالي ينقل معظم المخاطر إليه.\n\nج. خطأ لأنه عقد خدمات ولا يشمل عادة تحمل كامل مخاطر المشروع الإنشائي.\n\nد. خطأ لأنه مصطلح عام وغير محدد كنموذج عقد قياسي لنقل المخاطر بالكامل.","oldQNumber":"98","bankIndex":527,"setId":"set5"},{"id":"512","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي مما يلي منهجية تخطيط المشروع التي تتضمن سلسلة معقدة من المحاكاة المطلوبة لتوفير معلومات حول مخاطر الجدول الزمني؟","options":[{"key":"A","letter":"أ","text":"تحليل مونت كارلو."},{"key":"B","letter":"ب","text":"نظام معلومات إدارة المشروع (PMIS)."},{"key":"C","letter":"ج","text":"إدارة القيمة المكتسبة (EVM)."},{"key":"D","letter":"د","text":"خطة مشروع متكاملة."}],"explanation":"أ. صحيح لأنه يستخدم عمليات محاكاة متعددة لتقدير احتمالات المخاطر وتأثيرها على الجدول الزمني.\n\nب. خطأ لأنه نظام يُستخدم لإدارة معلومات المشروع ومتابعتها، وليس منهجية لمحاكاة مخاطر الجدول الزمني.\n\nج. خطأ لأنها أداة لقياس أداء المشروع من حيث الوقت والتكلفة، وليست أسلوب محاكاة للمخاطر.\n\nد. خطأ لأنها وثيقة تجمع خطط المشروع المختلفة، ولا تتضمن سلسلة من المحاكاة لتقييم المخاطر.","oldQNumber":"103","bankIndex":528,"setId":"set5"},{"id":"517","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من الخيارات التالية يصف بشكل أفضل فائدة اعتماد منظمة لخطة استمرارية الأعمال والتعافي من الكوارث للاستجابة للكوارث الطبيعية؟","options":[{"key":"A","letter":"أ","text":"تمنع التأثير الاقتصادي على المنظمة."},{"key":"B","letter":"ب","text":"تتيح للمؤسسة من التنبؤ بموعد وقوع الكارثة الطبيعية."},{"key":"C","letter":"ج","text":"تقلل احتمالية أن تؤدي الأحداث إلى تعطيل الأنشطة التشغيلية."},{"key":"D","letter":"د","text":"تزيل التهديد الذي تتعرض له المنظمة"}],"explanation":"أ. خطأ لأن خطط استمرارية الأعمال لا تمنع الأثر الاقتصادي بالكامل، بل تقلله وتحد منه فقط.\n\nب. خطأ لأن هذه الخطط لا تتنبأ بوقت وقوع الكوارث الطبيعية.\n\nج. صحيح لأن الهدف الأساسي من خطط استمرارية الأعمال والتعافي هو تقليل أثر الأحداث وتقليل احتمالية توقف العمليات التشغيلية.\n\nد. خطأ لأن الخطط لا تزيل التهديدات بل تتعامل مع آثارها فقط.","oldQNumber":"109","bankIndex":529,"setId":"set5"},{"id":"522","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أبرمت منظمة عقدًا يتعين بموجبه على البائع تصميم وتوريد وبناء محطة كهربائية فرعية مقابل 3,000,000 دولار. في هذا السيناريو، وافقت المنظمة على أي نوع من العقود التالية؟","options":[{"key":"A","letter":"أ","text":"عقد قابل للاسترداد."},{"key":"B","letter":"ب","text":"عقد مقطوع (تسليم مفتاح)."},{"key":"C","letter":"ج","text":"عقد زمني ومادي."},{"key":"D","letter":"د","text":"عقد ثنائي."}],"explanation":"أ. خطأ لأنه في العقد القابل للاسترداد يتم تعويض البائع عن التكاليف الفعلية المتكبدة وليس مقابل مبلغ ثابت متفق عليه مسبقًا.\n\nب. صحيح لأنه تم الاتفاق على تنفيذ المشروع بالكامل (تصميم وتوريد وبناء) مقابل مبلغ إجمالي ثابت، وهو ما يميز العقد المقطوع (تسليم مفتاح).\n\nج. خطأ لأنه في العقد الزمني والمادي يتم الدفع بناءً على الوقت والمواد المستخدمة وليس بمبلغ إجمالي ثابت.\n\nد. خطأ لأنه مصطلح \"عقد ثنائي\" يصف وجود التزامات متبادلة بين الطرفين ولا يحدد آلية التسعير أو نوع العقد المذكور في السؤال.","oldQNumber":"114","bankIndex":530,"setId":"set5"},{"id":"527","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"ما الذي ستنفذه المنظمة للتخفيف الفعال وإدارة المخاطر الناجمة عن أزمة أو حدث؟","options":[{"key":"A","letter":"أ","text":"فقط الإجراءات الوقائية."},{"key":"B","letter":"ب","text":"الإجراءات البديلة ورد الفعل."},{"key":"C","letter":"ج","text":"الإجراءات الوقائية والبديلة."},{"key":"D","letter":"د","text":"الإجراءات الوقائية ورد الفعل."}],"explanation":"أ. خطأ لأنه لا يمكن الاعتماد على الوقاية فقط بعد وقوع أزمة أو حدث.\n\nب. صحيح لأنه عند حدوث أزمة يتم الاعتماد على إجراءات بديلة واستجابات رد فعل لإدارة الوضع والتخفيف من أثره.\n\nج. خطأ لأنه يخلط بين الوقاية والاستجابة، بينما السؤال يركز على إدارة المخاطر بعد الحدث.\n\nد. خطأ لأن الإجراءات الوقائية تكون قبل الحدث، بينما المطلوب هنا إدارة أزمة قائمة.","oldQNumber":"119","bankIndex":531,"setId":"set5"},{"id":"532","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"المسار الحرج لأي مشروع هو المسار الذي يتسم بأي من الخصائص التالية؟","options":[{"key":"A","letter":"أ","text":"له أطول مدة زمنية"},{"key":"B","letter":"ب","text":"يكلف أكبر قدر من المال"},{"key":"C","letter":"ج","text":"يتطلب أكبر قدر من العمالة"},{"key":"D","letter":"د","text":"يعتبر الأكثر أهمية للمشروع"}],"explanation":"أ. خطأ لأن المسار الحرج لا يُحدد فقط بأنه الأطول زمنياً، بل هو الذي يحدد مدة المشروع ككل (أي أي تأخير فيه يؤخر المشروع).\n\nب. خطأ لأن التكلفة ليست معيار تحديد المسار الحرج.\n\nج. خطأ لأن حجم العمالة ليس له علاقة مباشرة بتحديد المسار الحرج.\n\nد. صحيح لأن المسار الحرج هو الأهم في المشروع لأنه يحدد الحد الأدنى لمدة إنجاز المشروع وأي تأخير فيه يؤثر على اكتمال المشروع بالكامل.","oldQNumber":"124","bankIndex":532,"setId":"set5"},{"id":"533","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"اي مما يلي يتعلق بالمحاسبة الإدارية أكثر من المحاسبة المالية؟","options":[{"key":"A","letter":"أ","text":"يتم انشاء التقارير على أساس ربع سنوي و / أو تواتر سنوي."},{"key":"B","letter":"ب","text":"يتم تجميع التقارير لتمثيل المؤسسة ككل."},{"key":"C","letter":"ج","text":"تم تصميم التقارير لأغراض صنع القرار."},{"key":"D","letter":"د","text":"تركز التقارير على محاسبة القيد المزدوج وبيانات التكلفة"}],"explanation":"أ. خطأ لأنه التكرار الزمني للتقارير يرتبط غالبًا بالمحاسبة المالية.\nب. خطأ لأنه تجميع التقارير لتمثيل المؤسسة ككل يخص المحاسبة المالية.\nج. صحيح لأنه المحاسبة الإدارية تهدف أساسًا لدعم الإدارة في اتخاذ القرار.\nد. خطأ لأنه يركز على المبادئ المحاسبية والتسجيل المالي وليس القرار الإداري.","oldQNumber":"1","bankIndex":533,"setId":"set6"},{"id":"534","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي مما يلي ثلاثة عناصر أساسية في عقود الشراء؟","options":[{"key":"A","letter":"أ","text":"المنتج أو الخدمة المطلوب تقديمها، والسعر المتفق عليه، ومعايير القبول."},{"key":"B","letter":"ب","text":"الموقع، والمنتج أو الخدمة، والسعر المتفق عليه."},{"key":"C","letter":"ج","text":"المشتري، والبائع، والوسيط."},{"key":"D","letter":"د","text":"المنتج أو الخدمة، والاستعانة بمصادر خارجية، ونظام الإنجاز الكامل."}],"explanation":"أ. صحيح لأنه يجب أن يحدد عقد الشراء ما سيتم تقديمه، وتكلفته، وكيف سيتم قبول المنتج أو الخدمة.\n\nب. خطأ لأنه الموقع ليس من العناصر الأساسية التي يجب أن تتضمنها جميع عقود الشراء.\n\nج. خطأ لأنه تحديد الأطراف مهم، لكن هذه ليست العناصر الأساسية التي تحدد شروط الشراء نفسها.\n\nد. خطأ لأنه الاستعانة بمصادر خارجية ونظام الإنجاز الكامل ليست عناصر أساسية موجودة في جميع عقود الشراء.","oldQNumber":"2","bankIndex":534,"setId":"set6"},{"id":"535","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"عند تقييم خدمات مكتب المساعدة التي يقدمها موفر خدمة تابع لجهة خارجية ، اي مما يلي من المرجح أن يكون مصدر قلق المدقق الداخلي الأكبر؟","options":[{"key":"A","letter":"أ","text":"ما إذا كان كل مكالمة تلقاها مزود الخدمة قد تم تسجيلها بواسطة مركز المساعدة ام لا."},{"key":"B","letter":"ب","text":"ما إذا كان قد تم تخصيص رقم تعريف مميز لكل مشكلة حددها مزود الخدمة"},{"key":"C","letter":"ج","text":"ما إذا كان مقدم الخدمة يستخدم مرافقه الخاصة لتقديم خدمات مكتب المساعدة."},{"key":"D","letter":"د","text":"ما إذا كانت استجابات المزود وقراراته محددة جيدًا وفقًا لاتفاقية مستوى الخدمة."}],"explanation":"أ. خطأ لأنه تسجيل المكالمات مهم لكنه أقل أهمية من الالتزام بمستوى الخدمة.\nب. خطأ لأنه رقم التذكرة إجراء تنظيمي لكنه ليس أكبر مصدر قلق.\nج. خطأ لأنه استخدام مرافق خاصة أمر إداري وليس جوهر جودة الخدمة.\nد. صحيح لأنه التزام مزود الخدمة باتفاقية مستوى الخدمة هو أهم عنصر لضمان جودة وفعالية الخدمة.","oldQNumber":"3","bankIndex":535,"setId":"set6"},{"id":"536","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"وفقًا لارشادات معهد المدققين الداخليين بشأن تكنولوجيا المعلومات، أي من العبارات التالية صحيحة فيما يتعلق بالمواقع الإلكترونية المستخدمة في معاملات التجارة الإلكترونية؟","options":[{"key":"A","letter":"أ","text":"توفر مواقع HTTP الامان الكافي لحماية معلومات بطاقات الائتمان الخاصة بالعملاء"},{"key":"B","letter":"ب","text":"يقوم خوادم الويب بتخزين معلومات حاملي بطاقات الائتمان المرسلة للدفع"},{"key":"C","letter":"ج","text":"ترسل خوادم قواعد البيانات معلومات حاملي البطاقات للموافقة عليها بنص واضح"},{"key":"D","letter":"د","text":"تسمح بوابات الدفع بالدفع عبر الانترنت باستخدام بطاقات الائتمان"}],"explanation":"أ. خطأ لأنه بروتوكول HTTP غير آمن لحماية بيانات بطاقات الائتمان، ويجب استخدام HTTPS.\nب. خطأ لأنه خوادم الويب لا يُفترض أن تخزن بيانات بطاقات الائتمان الحساسة.\nج. خطأ لأنه لا يجوز إرسال بيانات بطاقات الائتمان بنص واضح بدون تشفير.\nد. صحيح لأنه بوابات الدفع هي التي تتيح تنفيذ عمليات الدفع الإلكتروني باستخدام بطاقات الائتمان بشكل آمن.","oldQNumber":"4","bankIndex":536,"setId":"set6"},{"id":"537","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"اي مما يلي من شأنه ان يوفر افضل حماية لمعدات تكنولوجيا المعلومات من التلف او الفقدان العرضي او المتعمد؟","options":[{"key":"A","letter":"أ","text":"فرض معايير وصول قوية بشكل منتظم"},{"key":"B","letter":"ب","text":"اجراء اختبار الاختراق بانتظام"},{"key":"C","letter":"ج","text":"استخدام تطبيقات خدمات التشفير لتقييد الوصول"},{"key":"D","letter":"د","text":"تقييد الوصول المادي وتوفير السكن الامن (secure housing)"}],"explanation":"أ. خطأ لأنه يركز على الوصول المنطقي وليس حماية المعدات نفسها من التلف أو الفقدان.\nب. خطأ لأنه اختبار الاختراق يهدف لاكتشاف الثغرات الأمنية وليس حماية المعدات المادية.\nج. خطأ لأنه التشفير يحمي البيانات وليس الأجهزة المادية.\nد. صحيح لأنه حماية الوصول المادي للمعدات وتوفير بيئة آمنة يقلل من خطر التلف أو الفقدان.","oldQNumber":"5","bankIndex":537,"setId":"set6"},{"id":"538","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي من هذه الحالات يصف بدقة مسؤوليات إدارة البيانات الضخمة؟","options":[{"key":"A","letter":"أ","text":"يجب أن تضمن الإدارة أن أنظمة تخزين المعلومات محددة بشكل مناسب وأن عمليات تحديث عناصر البيانات الهامة واضحة"},{"key":"B","letter":"ب","text":"يجب على المدققين الخارجيين التأكد من أن النماذج التحليلية يتم مراقبتها بشكل دوري والمحافظة عليها."},{"key":"C","letter":"ج","text":"يجب على مجلس الإدارة تنفيذ ضوابط حول أبعاد جودة البيانات لضمان فعاليتها."},{"key":"D","letter":"د","text":"يجب أن يضمن المدققون الداخليون جودة وأمن البيانات، مع التركيز الشديد على عناصر البيانات الأكثر خطورة."}],"explanation":"أ. صحيح لأنه إدارة البيانات هي المسؤولة عن تنظيم التخزين وتحديد إجراءات تحديث البيانات بشكل واضح.\nب. خطأ لأن المدققين الخارجيين لا يتحملون مسؤولية إدارة النماذج التشغيلية بشكل دوري.\nج. خطأ لأن مجلس الإدارة يضع التوجيهات العامة وليس التنفيذ التشغيلي للضوابط.\nد. خطأ لأن المدققين الداخليين يقومون بالتقييم وليس إدارة البيانات أو ضمان جودتها بشكل مباشر.","oldQNumber":"6","bankIndex":538,"setId":"set6"},{"id":"539","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"يقوم مدقق داخلي بإجراء تقييم أولي لمخاطر الخصوصية وحماية البيانات. أي مما يلي هو السؤال الأكثر أهمية لبدء التقييم؟","options":[{"key":"A","letter":"أ","text":"كيف تحقق وحدة الأمن السيبراني في حالات تسرب البيانات أو الادعاءات؟"},{"key":"B","letter":"ب","text":"ما هي الغرامات المحتملة التي تنطبق على المؤسسة بسبب انتهاكات حماية البيانات؟"},{"key":"C","letter":"ج","text":"ما نوع البيانات الخاصة التي تجمعها المنظمة وتحتفظ بها؟"},{"key":"D","letter":"د","text":"ما هي الحالات التي يتم فيها تطبيق الأسماء المستعارة للبيانات في المنظمة؟"}],"explanation":"أ. خطأ لأنه يتعلق بالاستجابة للحوادث وليس بتقييم المخاطر من البداية.\nب. خطأ لأنه يركز على العقوبات وليس تحديد نطاق البيانات.\nج. صحيح لأنه أول خطوة في تقييم مخاطر الخصوصية هي فهم نوع البيانات التي يتم جمعها ومعالجتها.\nد. خطأ لأنه إجراء تقني متقدم وليس نقطة البداية للتقييم.","oldQNumber":"7","bankIndex":539,"setId":"set6"},{"id":"540","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"اي مما يلي يمكن تصنيفه بشكل افضل على انه مستحق \" اخر\"؟","options":[{"key":"A","letter":"أ","text":"المبالغ المستحقة للشركة بسبب معاملات البيع"},{"key":"B","letter":"ب","text":"المبالغ المستحقة على العملاء للشركة في الحسابات"},{"key":"C","letter":"ج","text":"المبالغ المستحقة للشركة خلال ال 60 الى ال90 يوما القادمة مع الفائدة"},{"key":"D","letter":"د","text":"المبالغ المستحقة للشركة من اقرارات ضريبة الدخل"}],"explanation":"أ. خطأ لأنه يمثل ذمم تجارية ناتجة عن المبيعات.\nب. خطأ لأنه يمثل حسابات مدينة من العملاء.\nج. خطأ لأنه يندرج ضمن مستحقات تشغيلية أو مالية وليست “أخرى”.\nد. صحيح لأنه المستحقات الضريبية تُصنف عادة ضمن “مستحقات أخرى” وليست ذمم تجارية أو تشغيلية مباشرة.","oldQNumber":"9","bankIndex":540,"setId":"set6"},{"id":"541","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي من المفاهيم التالية يُستخدم لتقييم جودة البيانات من حيث الدقة والاكتمال والاتساق؟","options":[{"key":"A","letter":"أ","text":"أبعاد جودة البيانات."},{"key":"B","letter":"ب","text":"عناصر البيانات الهامة."},{"key":"C","letter":"ج","text":"نسب البيانات."},{"key":"D","letter":"د","text":"إدارة البيانات."}],"explanation":"أ. صح لأنها تُستخدم لتقييم جودة البيانات مثل الدقة والاكتمال والاتساق.\n\nب. خطأ لأنها تحدد البيانات المهمة وليست جودة البيانات.\n\nج. خطأ لأنها لا تستخدم لتقييم جودة البيانات.\n\nد. خطأ لأنها تهتم بإدارة البيانات وليس تقييم جودتها.","oldQNumber":"11","bankIndex":541,"setId":"set6"},{"id":"542","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"تتلقى مؤسسة مالية طلبات بريد إلكتروني متكررة ومتنوعة من العملاء لاخراج الأموال من حساباتهم.ما هو نشاط التحقق الذي سيساعد المؤسسة بشكل افضل على تجنب الوقوع ضحية لتصيد الالكتروني؟","options":[{"key":"A","letter":"أ","text":"مراجعة نشاط التحويل المالي للعميل لتحديد ما إذا كان الطلب نموذجيًا."},{"key":"B","letter":"ب","text":"الاتصال بالعميل على رقم الهاتف المسجل للتحقق من صحة الطلب."},{"key":"C","letter":"ج","text":"الرد على العميل عبر البريد الإلكتروني للتحقق من صحة مرسل الطلب."},{"key":"D","letter":"د","text":"مراجعة سجل العميل للتحقق مما إذا كان العميل قد وافق على طلبات التحويل الإلكتروني هذا."}],"explanation":"أ. خطأ لأنه تحليل النمط لا يثبت هوية الطالب أو يمنع التصيد بشكل مباشر.\nب. صحيح لأنه التحقق عبر قناة مستقلة (الهاتف المسجل) يعد أقوى وسيلة للتأكد من صحة الطلب.\nج. خطأ لأنه الرد عبر نفس وسيلة البريد الإلكتروني قد يكون غير آمن ومخترق.\nد. خطأ لأنه مراجعة السجل لا تؤكد أن الطلب الحالي حقيقي أو مخادع.","oldQNumber":"12","bankIndex":542,"setId":"set6"},{"id":"543","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"استخدم المدققون الداخليون مسجل فيديو لتسجيل المقابلات مع منفذي الرقابة. ما هو شكل البيانات الضخمة التي ستمثلها الإجابات الشفهية؟","options":[{"key":"A","letter":"أ","text":"بيانات منظمة structured"},{"key":"B","letter":"ب","text":"بيانات نصف منظمة semi structured"},{"key":"C","letter":"ج","text":"بيانات غير منظمة unstructured"},{"key":"D","letter":"د","text":"بيانات شبه منظمة Quasi-structured"}],"explanation":"أ. خطأ لأنه البيانات المنظمة تكون في جداول وقواعد بيانات.\nب. خطأ لأنه البيانات شبه المنظمة تحتوي على تنسيق جزئي مثل XML وليس كلام شفهي.\nج. صحيح لأنه الإجابات الشفهية المسجلة لا تكون في شكل منظم ويمكن تحليلها لاحقاً كبيانات غير منظمة.\nد. خطأ لأنه مصطلح غير دقيق في تصنيف البيانات الضخمة.","oldQNumber":"13","bankIndex":543,"setId":"set6"},{"id":"544","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي من التكاليف التالية ستتحملها الشركة في حالة نفاد المخزون؟","options":[{"key":"A","letter":"أ","text":"فقدان المبيعات ، فقدان العملاء ، والطلبات المؤجلة."},{"key":"B","letter":"ب","text":"فقدان المبيعات ، مخزون الأمان ، والطلبات المؤجلة."},{"key":"C","letter":"ج","text":"فقدان العملاء ، مخزون الأمان ، والطلبات المؤجلة"},{"key":"D","letter":"د","text":"فقدان المبيعات ، فقدان العملاء ، ومخزون الأمان."}],"explanation":"أ. صحيح لأن نفاد المخزون يؤدي مباشرة إلى خسارة مبيعات، واحتمال فقدان عملاء، أو تأجيل الطلبات.\nب. خطأ لأن مخزون الأمان ليس تكلفة ناتجة عن النفاد بل إجراء وقائي لتجنبه.\nج. خطأ لأن مخزون الأمان ليس من نتائج النفاد بل وسيلة لمنعه.\nد. خطأ لأن مخزون الأمان ليس تكلفة مترتبة على نفاد المخزون.","oldQNumber":"14","bankIndex":544,"setId":"set6"},{"id":"545","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"بعد تخفيضات كبيرة في الميزانية قررت احدى الهيئات الحكومية الصغيرة السماح للمديرين باستخدام هواتفهم الذكية الخاصة بالعمل اي مما يلي يعد افضل ممارسة للنسخ الاحتياطي لبيانات الهواتف الذكية؟","options":[{"key":"A","letter":"أ","text":"التخزين الاصلي"},{"key":"B","letter":"ب","text":"سطح مكتب الموظفين"},{"key":"C","letter":"ج","text":"مركز البيانات"},{"key":"D","letter":"د","text":"المسح عن بعد"}],"explanation":"أ. خطأ لأنه التخزين المحلي على الجهاز لا يعتبر نسخ احتياطي آمن.\nب. خطأ لأنه سطح مكتب الموظفين ليس موقع نسخ احتياطي مركزي وآمن.\nج. صحيح لأنه مركز البيانات يوفر تخزيناً مركزياً وآمناً للنسخ الاحتياطي للبيانات.\nد. خطأ لأنه المسح عن بعد هو إجراء لحذف البيانات وليس لعمل نسخة احتياطية.","oldQNumber":"15","bankIndex":545,"setId":"set6"},{"id":"546","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"يكون بيان الدخل والارباح المحتجزة للمؤسسة على النحو التالي: المبيعات 3000 تكاليف البضاعة المباعة 1600 الربح الاجمالي 1400 مصروفات التشغيل 970 الدخل التشغيلي 430 مصروفات الفوائد 30 الدخل قبل الضريبة 400 ضريبة الدخل 200 الدخل الصافي 200 زائد ارباح محتجزة في 1 يناير 150 ناقص توزيعات الارباح 60 ارباح محتجزة في 31 ديسيمبر 290 اي مما يلي هو نسبة توزيع الارباح؟","options":[{"key":"A","letter":"أ","text":"20 في المئة"},{"key":"B","letter":"ب","text":"30 في المئة"},{"key":"C","letter":"ج","text":"40 في المئة"},{"key":"D","letter":"د","text":"50 في المئة"}],"explanation":"أ. خطأ لأنه 20% لا تعكس نسبة التوزيعات الفعلية مقارنة بصافي الدخل.\nب. صحيح لأنه نسبة توزيع الأرباح = توزيعات الأرباح ÷ صافي الدخل = 60 ÷ 200 = 30%.\nج. خطأ لأنه 40% أعلى من النسبة المحسوبة فعلياً.\nد. خطأ لأنه 50% غير متوافق مع البيانات المعطاة.","oldQNumber":"16","bankIndex":546,"setId":"set6"},{"id":"547","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"يراجع المدقق الداخلي مجموعة البيانات ويحسب المتوسط والوسطى والنطاق. ما هو الغرض الأكثر احتمالا لإجراء هذه التقنية التحليلية؟","options":[{"key":"A","letter":"أ","text":"الإبلاغ عن تصنيف مجموعة البيانات."},{"key":"B","letter":"ب","text":"لتحديد اكتمال ودقة البيانات."},{"key":"C","letter":"ج","text":"لتحديد ما إذا كانت المجموعة تحتوي على قيم متطرفة"},{"key":"D","letter":"د","text":"لتحديد ما إذا كانت التكرارات في البيانات تضخيم النطاق ام لا"}],"explanation":"أ. خطأ لأنه حساب المتوسط والوسيط والنطاق لا يهدف لتصنيف البيانات.\nب. خطأ لأنه اكتمال ودقة البيانات يتم التحقق منه بطرق مختلفة مثل المطابقة والتحقق.\nج. صحيح لأنه استخدام مقاييس النزعة المركزية والمدى يساعد في اكتشاف القيم الشاذة (outliers).\nد. خطأ لأنه ليس الهدف الأساسي من هذه الحسابات تحليل تأثير التكرارات على النطاق.","oldQNumber":"17","bankIndex":547,"setId":"set6"},{"id":"548","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"بالنظر الى المعلومات الواردة ادناه ما هي المؤسسة الاضعف في دفع الديون قصيرة الاجل؟","options":[{"key":"A","letter":"أ","text":"المؤسسة A: الاصول المتداولة ١٢٠٠٠٠٠ والالتزامات ٦٠٠٠٠٠"},{"key":"B","letter":"ب","text":"المؤسسة B: الاصول المتداولة ١٦٠٠٠٠٠ والالتزامات ١٠٠٠٠٠٠"},{"key":"C","letter":"ج","text":"المؤسسة C: الاصول المتداولة ٩٠٠٠٠٠ والالتزامات ٣٠٠٠٠٠"},{"key":"D","letter":"د","text":"المؤسسة D: الاصول المتداولة ١٠٠٠٠٠٠ والالتزامات ٢٥٠٠٠٠"}],"explanation":"أ. خطأ لأنها ١,٢٠٠,٠٠٠ ÷ ٦٠٠,٠٠٠ = ٢، ونسبة التداول لديها أعلى من المؤسسة B، لذلك قدرتها على دفع الديون قصيرة الأجل أفضل.\n\nب. صحيح لأنها ١,٦٠٠,٠٠٠ ÷ ١,٠٠٠,٠٠٠ = ١.٦، وهي أقل نسبة تداول بين المؤسسات، لذلك هي الأضعف في دفع الديون قصيرة الأجل.\n\nج. خطأ لأنها ٩٠٠,٠٠٠ ÷ ٣٠٠,٠٠٠ = ٣، ونسبة التداول لديها أعلى، مما يدل على قدرة أفضل على سداد الديون.\n\nد. خطأ لأنها ١,٠٠٠,٠٠٠ ÷ ٢٥٠,٠٠٠ = ٤، وهي أعلى نسبة تداول، مما يدل على أنها الأقوى في دفع الديون قصيرة الأجل.","oldQNumber":"18","bankIndex":548,"setId":"set6"},{"id":"549","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي مما يلي يعتبر الأكثر فاعلية في حماية أصول المعلومات عند استخدام الأجهزة الذكية؟","options":[{"key":"A","letter":"أ","text":"استخدام برامج مكافحة الفيروسات."},{"key":"B","letter":"ب","text":"استخدام الشبكة الافتراضية الخاصة (VPN)."},{"key":"C","letter":"ج","text":"استخدام تطبيقات الجهاز المحمول (MAM)"},{"key":"D","letter":"د","text":"استخدام برنامج إدارة الجهاز المحمول (MDM)"}],"explanation":"أ. خطأ لأنه يقلل من مستوى الحماية ويزيد من احتمالية الوصول غير المصرح به إلى المعلومات.\n\nب. خطأ لأنه يؤدي إلى إضعاف الضوابط الأمنية وزيادة مخاطر اختراق البيانات.\n\nج. خطأ لأنه يركز على إدارة وتأمين التطبيقات فقط، ولا يوفر تحكمًا شاملًا بالجهاز وبياناته.\n\nد. صحيح لأنه يوفر إدارة شاملة للجهاز، بما في ذلك إعدادات الأمان، والتشفير، والتحكم في الوصول، والمسح عن بُعد، مما يجعله الأكثر فاعلية في حماية أصول المعلومات.","oldQNumber":"19","bankIndex":549,"setId":"set6"},{"id":"550","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"ما هي المخاطر الاساسية المرتبطة بتبني مؤسسة لهيكل لا مركزي؟","options":[{"key":"A","letter":"أ","text":"عدم القدرة على التكيف"},{"key":"B","letter":"ب","text":"ارتفاع تكاليف وظيفة الرقابة"},{"key":"C","letter":"ج","text":"عدم الاتساق في اتخاذ القرار"},{"key":"D","letter":"د","text":"نقص المرونة"}],"explanation":"أ. خطأ لأنه الهيكل اللامركزي عادة يزيد من القدرة على التكيف وليس يقللها.\nب. خطأ لأنه ارتفاع تكاليف الرقابة قد يحدث لكن ليس الخطر الأساسي المباشر هنا.\nج. صحيح لأنه في الهيكل اللامركزي قد تتخذ الأقسام قرارات مختلفة مما يؤدي لعدم الاتساق.\nد. خطأ لأنه اللامركزية تزيد المرونة ولا تقللها.","oldQNumber":"21","bankIndex":550,"setId":"set6"},{"id":"551","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"حساب احدى المؤسسات من اللوازم المكتبية المتاحة كان رصيده 9000 دولار في نهاية السنة الأولى. خلال العام الثاني. سجلت المؤسسة مصروفًا قدره 45000 دولار لشراء اللوازم المكتبية. في نهاية العام الثاني. تم تنفيذ جرد اثبت أن المؤسسة لديها 12500 دولار من اللوازم المكتبية المتاحة. استنادا الى هذه المعلومات ، ما هو قيد التعديل الذي يجب تسجيله في نهاية العام الثاني؟","options":[{"key":"A","letter":"أ","text":"مبلغ مدين على اللوازم المكتبية المتاحة قدره 2230 دولار"},{"key":"B","letter":"ب","text":"مبلغ مدين على اللوازم المكتبية المتاحة قدره 3500 دولار"},{"key":"C","letter":"ج","text":"مبلغ مدين على اللوازم المكتبية المتاحة قدره 12300 دولار"},{"key":"D","letter":"د","text":"مبلغ مدين على اللوازم المكتبية المتاحة قدره 24500 دولار"}],"explanation":"أ. خطأ لأنه لا يطابق نتيجة الجرد الفعلي مقارنة بالمخزون الدفتري.\nب. صحيح لأنه الفرق بين الرصيد المتوقع والرصيد الفعلي يتطلب تعديل مدين بهذا المقدار.\nج. خطأ لأنه مبلغ مبالغ فيه ولا يعكس فرق الجرد الحقيقي.\nد. خطأ لأنه لا يتوافق مع البيانات المعطاة في السؤال.","oldQNumber":"22","bankIndex":551,"setId":"set6"},{"id":"552","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"لدى إحدى المؤسسات حاجة ملحة لخوادم، ولكن ليس لديها الوقت الكافي لاستكمال عمليات الاستحواذ الرأسمالية. أيّ من خدمات السحابة التالية قد تساعد في هذا الوضع؟","options":[{"key":"A","letter":"أ","text":"البنية التحتية كخدمة (IaaS)"},{"key":"B","letter":"ب","text":"المنصة كخدمة (PaaS)"},{"key":"C","letter":"ج","text":"المؤسسة كخدمة (EaaS)"},{"key":"D","letter":"د","text":"البرمجيات كخدمة (SaaS)"}],"explanation":"أ. صحيح لأن IaaS توفر خوادم وبنية تحتية جاهزة بسرعة دون الحاجة لشراء أو تركيب معدات فعلية.\nب. خطأ لأن PaaS توفر بيئة تطوير وليس خوادم مباشرة.\nج. خطأ لأن EaaS ليس نموذجًا قياسيًا معروفًا في خدمات السحابة.\nد. خطأ لأن SaaS توفر تطبيقات جاهزة وليس خوادم أو بنية تحتية.","oldQNumber":"23","bankIndex":552,"setId":"set6"},{"id":"553","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي مما يلي هو الانسب في قسم التمويل في الميزانية النقدية للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"التحصيلات من العملاء"},{"key":"B","letter":"ب","text":"بيع الأوراق المالية"},{"key":"C","letter":"ج","text":"شراء شاحنات"},{"key":"D","letter":"د","text":"سداد الديون بما في ذلك الفوائد"}],"explanation":"أ. خطأ لأنه التحصيلات من العملاء تُصنف ضمن الأنشطة التشغيلية.\nب. خطأ لأنه بيع الأوراق المالية يُعد من الأنشطة الاستثمارية أو التشغيلية حسب السياق.\nج. خطأ لأنه شراء الشاحنات يُعد نشاطاً استثمارياً.\nد. صحيح لأنه سداد الديون والفوائد يُصنف ضمن الأنشطة التمويلية.","oldQNumber":"24","bankIndex":553,"setId":"set6"},{"id":"554","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اي مما يلي يجب أن يكون المدققين الداخليين الانتباه اليه عند مراجعة الموافقة على البيانات الشخصية وإدارة القبول / الانسحاب؟","options":[{"key":"A","letter":"أ","text":"ما اذا كان يطلب من العملاء تجديد موافقتهم على معالجة بياناتهم بشكل ربع سنوي على الاقل ."},{"key":"B","letter":"ب","text":"ما اذا كانت تتم معالجة البيانات الخاصة وفقا للغرض الذي تم الحصول على الموافقة من أجله."},{"key":"C","letter":"ج","text":"ما إذا كانت المؤسسة قد وضعت سياسات واضحة وعلى مستوى الكيان بشأن نقل البيانات إلى جهات خارجية."},{"key":"D","letter":"د","text":"ما إذا كان لدى العملاء فرصة لالغاء الاشتراك في حق محو البيانات من السجلات والانظمة التنظيمية."}],"explanation":"أ. خطأ لأنه لا يوجد شرط عام بضرورة تجديد الموافقة كل ربع سنة.\nب. صحيح لأنه يجب استخدام البيانات فقط للغرض الذي وافق عليه صاحب البيانات.\nج. خطأ لأنه يتعلق بنقل البيانات إلى جهات خارجية وليس بإدارة الموافقة بشكل مباشر.\nد. خطأ لأنه حق محو البيانات حق قانوني ولا يتعلق بمراجعة الموافقة على المعالجة.","oldQNumber":"25","bankIndex":554,"setId":"set6"},{"id":"555","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"اي من عناصر الضوابط الامنية التالية مناسب لحماية تبادل المعلومات؟","options":[{"key":"A","letter":"أ","text":"جدران الحماية"},{"key":"B","letter":"ب","text":"⁠سجلات النشاط"},{"key":"C","letter":"ج","text":"⁠برنامج مكافحة الفيروسات"},{"key":"D","letter":"د","text":"⁠تشفير الملفات"}],"explanation":"أ. خطأ لأنه جدار الحماية يحمي حركة الشبكة وليس محتوى تبادل المعلومات نفسه.\nب. خطأ لأنه سجلات النشاط تستخدم ل },{"key":"B","letter":"ب","text":"معدلات الارباح."},{"key":"C","letter":"ج","text":"نسب الملاءة المالية."},{"key":"D","letter":"د","text":"النسب الحالية."}],"explanation":"أ. خطأ لأن نسب السيولة تقيس القدرة على سداد الالتزامات قصيرة الأجل وليس النجاح التشغيلي.\nب. صحيح لأن معدلات الأرباح تعكس الأداء التشغيلي والربحية خلال فترة زمنية معينة.\nج. خطأ لأن نسب الملاءة المالية تقيس القدرة على الاستمرارية طويلة الأجل.\nد. خطأ لأن النسب الحالية جزء من السيولة وليست مقياساً للربحية.","oldQNumber":"30","bankIndex":558,"setId":"set6"},{"id":"559","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"يرغب رئيس قسم التدقيق الداخلي في تطبيق برنامج تخطيط موارد المؤسسة. أي من تقييمات التدقيق الداخلي التالية يمكن أن يوفر ضماناً شاملاً بشأن احتمالية نجاح تطبيق البرنامج؟","options":[{"key":"A","letter":"أ","text":"تقييم الجاهزية."},{"key":"B","letter":"ب","text":"تقييم مخاطر المشروع."},{"key":"C","letter":"ج","text":"مراجعة ما بعد التنفيذ."},{"key":"D","letter":"د","text":"مراجعة المرحلة الرئيسية."}],"explanation":"أ. خطأ لأن تقييم الجاهزية يركز على الاستعداد فقط وليس تقديم ضمان شامل لنجاح التنفيذ.\nب. صحيح لأن تقييم مخاطر المشروع يعطي نظرة شاملة على المخاطر التي قد تؤثر على نجاح تطبيق ERP وبالتالي يوفر ضمانًا أوسع.\nج. خطأ لأنه يتم بعد التنفيذ وبالتالي لا يساعد في ضمان النجاح مسبقًا.\nد. خطأ لأنه يركز على مرحلة معينة وليس تقييمًا شاملاً للمشروع.","oldQNumber":"31","bankIndex":559,"setId":"set6"},{"id":"560","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"مؤشرات الأداء الرئيسية الجيدة تحقق أي مما يلي؟","options":[{"key":"A","letter":"أ","text":"تقدم صورة مفصلة لتدفق العملية، بما في ذلك المخاطر والضوابط الرئيسية والتوقيت"},{"key":"B","letter":"ب","text":"تصور المدخلات والمهام وسير العمل ومخرجات العمليات"},{"key":"C","letter":"ج","text":"تتماشى مع اهداف العملية الرئيسية وفهمها من قبل الموظفين المشاركين في العملية"},{"key":"D","letter":"د","text":"توثق سرديا الخطوات المعقدة في العمليات"}],"explanation":"أ. خطأ  صحيح لأنه البيانات الضخمة تتغير باستمرار وتكون ديناميكية.","oldQNumber":"35","bankIndex":562,"setId":"set6"},{"id":"563","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"اي مما يلي هو الهدف الاساسي من ابرام العقد؟","options":[{"key":"A","letter":"أ","text":"فهم اهداف العمل"},{"key":"B","letter":"ب","text":"تحقيق اقصى قدر من الاداء التشغيلي والمالي"},{"key":"C","letter":"ج","text":"التحكم في المخاطر."},{"key":"D","letter":"د","text":"انشاء اتفاقيات مستوى الخدمة"}],"explanation":"أ. خطأ لأنه فهم الأهداف ليس الهدف الأساسي من العقد.\nب. خطأ لأنه تحسين الأداء نتيجة محتملة وليس الهدف الأساسي.\nج. صحيح لأنه العقود تُستخدم أساساً لتحديد الالتزامات وتقليل/إدارة المخاطر بين الأطراف.\nد. خطأ لأن اتفاقيات مستوى الخدمة جزء من العقد وليس الهدف الأساسي له.","oldQNumber":"36","bankIndex":563,"setId":"set6"},{"id":"564","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"ردا على سوال طرحه مدقق داخلي اشارة الادارة الى وجود اتفاق ساري لاستئجار الخوادم ومحطات عمل سطح المكتب بسرعة لاستعادة العمليات من الاشرطة المخزنة خارج الموقع. اي من الخطط التالية من المرجح ان يستنتج المدقق انها موجودة حاليا في المؤسسة؟","options":[{"key":"A","letter":"أ","text":"خطة التعافي الساخنة"},{"key":"B","letter":"ب","text":"لا توجد خطة تعافي"},{"key":"C","letter":"ج","text":"خطة تعافي باردة"},{"key":"D","letter":"د","text":"خطة التعافي الدافئة"}],"explanation":"أ. خطأ لأنه الخطة الساخنة تعتمد على وجود نظام جاهز بالكامل يعمل فوراً بدون انتظار.\nب. خطأ لأنه وجود اتفاق وخطة استعادة يدل على وجود خطة تعافي فعلياً.\nج. خطأ لأنه الخطة الباردة تعتمد على تجهيز كل شيء من الصفر بعد الكارثة.\nد. صحيح لأنه الخطة الدافئة تعتمد على وجود تجهيزات جزئية مثل اتفاقات واستئجار موارد لاستعادة التشغيل بسرعة.","oldQNumber":"37","bankIndex":564,"setId":"set6"},{"id":"565","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"يجب على مدقق تكنولوجيا المعلومات الذي يقوم بمراجعة مشروع تطوير برمجيات داخلي الحصول على وثيقة دورة تطوير النظام لتقييم أي ما يلي؟","options":[{"key":"A","letter":"أ","text":"ملاءمة حالة أعمال المشروع."},{"key":"B","letter":"ب","text":"مواءمة عملية الأعمال وتكنولوجيا المعلومات."},{"key":"C","letter":"ج","text":"عناصر التحكم التي سيتم اختبارها."},{"key":"D","letter":"د","text":"وضوح أهداف الأعمال."}],"explanation":"أ. خطأ لأنه ملاءمة حالة أعمال المشروع تُقيّم من خلال دراسة احتياج المشروع وليس من خلال وثيقة دورة تطوير النظام فقط.\n\nب. خطأ لأنه مواءمة الأعمال وتكنولوجيا المعلومات تُفهم على مستوى استراتيجي أوسع وليس من خلال هذه الوثيقة بشكل مباشر.\n\nج. صحيح لأنه وثيقة دورة تطوير النظام (SDLC) توضح مراحل التطوير وتساعد المدقق على تحديد نقاط التحكم التي سيتم اختبارها.\n\nد. خطأ لأنه وضوح أهداف الأعمال يتم تحديده في مرحلة التخطيط وليس من وثيقة SDLC بشكل مباشر.","oldQNumber":"38","bankIndex":565,"setId":"set6"},{"id":"566","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"في المجموعات، أي مما يلي يزيد الإبداع؟","options":[{"key":"A","letter":"أ","text":"تدوير الوظيفة."},{"key":"B","letter":"ب","text":"تقسيم المهام."},{"key":"C","letter":"ج","text":"إثراء النقاش."},{"key":"D","letter":"د","text":"توثيق النتائج."}],"explanation":"أ. خطأ لأنه يركز على تغيير المهام وليس زيادة الإبداع.\n\nب. خطأ لأنه يوزع العمل ولا يضمن زيادة الإبداع.\n\nج. صح لأنه يساعد على تبادل الأفكار وطرح حلول جديدة.\n\nد. خطأ لأنه يوثق النتائج ولا يزيد الإبداع.","oldQNumber":"39","bankIndex":566,"setId":"set6"},{"id":"567","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"اي من الاسئلة التالية من المرجح أن يسأله المدقق الداخلي فيما يتعلق بضوابط التغيير في تكنولوجيا المعلومات؟","options":[{"key":"A","letter":"أ","text":"من يقوم بالاختبار والتحقق؟"},{"key":"B","letter":"ب","text":"هل يتم فرض كلمات المرور وتغييرها بانتظام؟"},{"key":"C","letter":"ج","text":"كم مرة يتم مراجعة صلاحيات الوصول؟"},{"key":"D","letter":"د","text":"هل تم جرد الأصول الرئيسية؟"}],"explanation":"أ. صحيح لأنه ضوابط التغيير في تكنولوجيا المعلومات تشمل التحقق والاختبار لضمان أن التغييرات تمت بشكل صحيح ومن قبل جهة مسؤولة.\nب. خطأ لأنه يتعلق بإدارة كلمات المرور وليس ضوابط التغيير.\nج. خطأ لأنه يتعلق بمراجعة صلاحيات الوصول وليس التغيير في الأنظمة.\nد. خطأ لأنه يتعلق بجرد الأصول وليس ضوابط التغيير في تكنولوجيا المعلومات.","oldQNumber":"40","bankIndex":567,"setId":"set6"},{"id":"568","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"عندما تستخدم الإدارة نهج التكلفة الامتصاصية الشاملة، يتم تصنيف تكاليف التصنيع الثابتة على أنها أي من أنواع التكاليف التالية؟","options":[{"key":"A","letter":"أ","text":"تكاليف المنتج غير المباشرة."},{"key":"B","letter":"ب","text":"تكاليف الفترة غير المباشرة"},{"key":"C","letter":"ج","text":"تكاليف الفترة المباشرة"},{"key":"D","letter":"د","text":"تكاليف المنتج المباشرة"}],"explanation":"أ صح: لأن تكاليف التصنيع الثابتة تعتبر تكاليف منتج غير مباشرة؛ لأنها تخص الإنتاج بشكل عام ولا يمكن تحديدها لمنتج معين.\n\nب خطأ: لأنها ليست تكاليف فترة، بل يتم تحميلها على المنتجات وتدخل ضمن تكلفة المنتج.\n\nج خطأ: لأنها ليست تكاليف فترة، وليست تكاليف مباشرة لمنتج معين.\n\nد خطأ: لأنها فعلًا تكاليف منتج، لكنها ليست مباشرة؛ لأننا لا نستطيع تحديد نصيب كل منتج منها بشكل مباشر.","oldQNumber":"42","bankIndex":568,"setId":"set6"},{"id":"569","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"وفقا لارشادات معهد المدققيين الداخليين فان تحليل تأثير الاعمال يشمل اي من الخطوات التالية؟","options":[{"key":"A","letter":"أ","text":"تحديد البدائل التوظيفية اللازمة للاسترداد"},{"key":"B","letter":"ب","text":"اختيار الحلول الاسترداد ومواقع الاسترداد"},{"key":"C","letter":"ج","text":"تحديد العمليات التجارية"},{"key":"D","letter":"د","text":"تحديد مصادر بديلة للوظائف"}],"explanation":"أ. خطأ لأنه يتعلق بخطط الاسترداد وليس بتحليل تأثير الاعمال.\nب. خطأ لأنه اختيار حلول الاسترداد يتم بعد تحليل تأثير الاعمال.\nج. صحيح لأنه يبدأ تحليل تأثير الاعمال بتحديد العمليات التجارية المهمة.\nد. خطأ لأنه يتعلق بمرحلة التخطيط للاستمرارية والاسترداد وليس بتحليل التأثير.","oldQNumber":"43","bankIndex":569,"setId":"set6"},{"id":"570","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"تناسق المزيج الإنتاجي لشركة يشير إلى:","options":[{"key":"A","letter":"أ","text":"عدد النماذج المتوفرة من كل منتج في خط الإنتاج."},{"key":"B","letter":"ب","text":"عدد خطوط الإنتاج المختلفة التي تقدمها الشركة."},{"key":"C","letter":"ج","text":"العلاقة المحكمة بين خطوط الإنتاج المتنوعة."},{"key":"D","letter":"د","text":"العدد الإجمالي لكافة المنتجات والنماذج التي تقدمها الشركة."}],"explanation":"أ. خطأ لأنه يصف عمق المنتج وليس التناسق.\nب. خطأ لأنه يصف عرض المزيج الإنتاجي وليس علاقته الداخلية.\nج. صحيح لأنه التناسق (Consistency) يعني مدى الترابط والتكامل بين خطوط الإنتاج المختلفة.\nد. خطأ لأنه يصف إجمالي المزيج الإنتاجي (الطول) وليس التناسق.","oldQNumber":"44","bankIndex":570,"setId":"set6"},{"id":"571","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"لحماية خصوصية بيانات حامل بطاقة الائتمان اثناء النقل ، اي من اجراءات تكنولوجيا المعلومات التالية يجب ان تكون مطبقة؟","options":[{"key":"A","letter":"أ","text":"برنامج مكافحة الفيروسات"},{"key":"B","letter":"ب","text":"جدار الحماية"},{"key":"C","letter":"ج","text":"التشفير"},{"key":"D","letter":"د","text":"مراقبة الدخول"}],"explanation":"أ. خطأ لأنه برنامج مكافحة الفيروسات يحمي من البرمجيات الضارة ولا يحمي البيانات أثناء نقلها.\nب. خطأ لأنه جدار الحماية يتحكم في حركة الشبكة لكنه لا يضمن سرية البيانات أثناء النقل.\nج. صحيح لأنه التشفير يحمي بيانات بطاقات الائتمان أثناء انتقالها ويمنع قراءتها من غير المصرح لهم.\nد. خطأ لأنه مراقبة الدخول تتعلق بالتحكم في الوصول وليس حماية البيانات أثناء النقل.","oldQNumber":"46","bankIndex":571,"setId":"set6"},{"id":"572","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أي من السيناريوهات التالية يوضح بشكل أفضل هجوم التصيد الاكتروني ؟","options":[{"key":"A","letter":"أ","text":"تسببت الهجمات العديدة والمتسقة على موقع الشركة الإلكتروني في تعطل الخادم وتعطيل الخدمة."},{"key":"B","letter":"ب","text":"قام شخص يتظاهر بأنه ممثل لمكتب المساعدة تقنية المعلومات بالشركة بالاتصال بالعديد من الموظفين وتشغيل رسالة عامة مسجلة مسبقًا تطلب بيانات كلمة المرور."},{"key":"C","letter":"ج","text":"تلقى شخص بريدًا إلكترونيًا مخصصًا بشأن تجديد عضوية نادي الغولف، وقام بالنقر فوق رابط تشعبي لإدخال بيانات بطاقة الائتمان الخاصة به في موقع إلكتروني مزيف."},{"key":"D","letter":"د","text":"تلقى العديد من مستخدمي خدمة الشبكات الاجتماعية إشعارات مزيفة عن فرصة استثمار في منتج جديد."}],"explanation":"أ. خطأ لأنه يصف هجوم تعطيل خدمة (DDoS) وليس تصيد.\nب. خطأ لأنه يصف انتحال شخصية عبر الهاتف لكنه لا يتضمن سرقة بيانات عبر رابط تصيد إلكتروني مباشر.\nج. صحيح لأنه يمثل تصيدًا إلكترونيًا عبر بريد مزيف وموقع وهمي لجمع بيانات حساسة.\nد. خطأ لأنه عام ولا يوضح استهداف مباشر عبر رابط تصيد واضح كما في المثال الصحيح.","oldQNumber":"47","bankIndex":572,"setId":"set6"},{"id":"573","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"في المجموعات، أي مما يلي يزيد الإبداع؟","options":[{"key":"A","letter":"أ","text":"فرض رأي القائد على جميع الأعضاء."},{"key":"B","letter":"ب","text":"تجنب تبادل الأفكار بين أعضاء الفريق."},{"key":"C","letter":"ج","text":"الحد من وجهات النظر المختلفة داخل المجموعة."},{"key":"D","letter":"د","text":"إثراء النقاش."}],"explanation":"أ. خطأ لأنه يقلل من تنوع الأفكار ويحد من مساهمة أعضاء المجموعة.\n\nب. خطأ لأنه يمنع تبادل المعرفة والخبرات التي تساعد على توليد أفكار جديدة.\n\nج. خطأ لأنه يقلل من التنوع الفكري الذي يعد أحد أهم مصادر الإبداع.\n\nد. صحيح لأنه يشجع على تبادل الأفكار ووجهات النظر المختلفة، مما يؤدي إلى زيادة الإبداع والابتكار.","oldQNumber":"48","bankIndex":573,"setId":"set6"},{"id":"574","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"يقوم المدقق الداخلي باجراء عملية تدقيق لخصوصية البيانات ، اي مما يلي من المرجح ان يتم التعامل معه كمعلومات شخصية؟","options":[{"key":"A","letter":"أ","text":"معلومات سلوكية"},{"key":"B","letter":"ب","text":"عنواين بروتوكول الانترنت"},{"key":"C","letter":"ج","text":"انواع الاجهزة المستخدمة"},{"key":"D","letter":"د","text":"معرفات مميزة للاجهزة المحمولة"}],"explanation":"أ. خطأ لأنه المعلومات السلوكية قد لا تحدد شخصا بعينه بشكل مباشر.\nب. خطأ لأنه عنوان بروتوكول الانترنت قد لا يحدد الشخص بشكل مباشر.\nج. خطأ لأنه نوع الجهاز لا يعتبر معلومة شخصية بحد ذاته.\nد. صحيح لأنه المعرفات المميزة للاجهزة المحمولة يمكن ربطها بمستخدم معين.","oldQNumber":"49","bankIndex":574,"setId":"set6"},{"id":"575","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"ما هي ميزة الأمان التي تنطوي على استخدام الأجهزة والبرامج لتقليل أو منع معلومات محددة من الانتقال بين الشبكة الداخلية والشبكة الخارجية؟","options":[{"key":"A","letter":"أ","text":"التفويض"},{"key":"B","letter":"ب","text":"نموذج الهندسة المعمارية"},{"key":"C","letter":"ج","text":"جدار الحماية"},{"key":"D","letter":"د","text":"شبكة خاصة افتراضية"}],"explanation":"أ. خطأ لأنه يمنح المستخدمين صلاحيات الوصول إلى الموارد والأنظمة، ولا يتحكم في انتقال المعلومات بين الشبكات.\n\nب. خطأ لأنه يصف تصميم وهيكل الأنظمة والشبكات، وليس أداة أمنية لمنع أو تقييد حركة البيانات.\n\nج. صحيح لأنه يستخدم الأجهزة والبرامج لمراقبة حركة البيانات والتحكم فيها ومنع انتقال المعلومات غير المصرح بها بين الشبكة الداخلية والخارجية.\n\nد. خطأ لأنها توفر اتصالًا آمنًا ومشفرًا عبر الشبكات العامة، لكنها لا تُستخدم بشكل أساسي لمنع انتقال معلومات محددة بين الشبكات.","oldQNumber":"50","bankIndex":575,"setId":"set6"},{"id":"576","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"ترغب مؤسسة حديثة التأسيس في استخدام خدمة البريد الإلكتروني التي يقدمها مزود خدمة بريد إلكتروني سحابي لبريدها الإلكتروني الرسمي. ستستخدم المؤسسة اسم نطاق خاص بها مقابل رسوم شهرية تدفعُ لمزود الخدمة السحابية. ما نوع الخدمة السحابية التي تناسب متطلبات هذه المؤسسة؟","options":[{"key":"A","letter":"أ","text":"الأجهزة كخدمة (HaaS)"},{"key":"B","letter":"ب","text":"البنية التحتية كخدمة (IaaS)"},{"key":"C","letter":"ج","text":"المنصة كخدمة (PaaS)"},{"key":"D","letter":"د","text":"البرمجيات كخدمة (SaaS)"}],"explanation":"أ. خطأ لأن HaaS يتعلق بتوفير الأجهزة وليس خدمات البريد الإلكتروني.\nب. خطأ لأن IaaS يوفر بنية تحتية مثل الخوادم وليس تطبيق بريد جاهز.\nج. خطأ لأن PaaS يوفر بيئة تطوير وليس خدمة بريد إلكتروني جاهزة.\nد. صحيح لأن SaaS يوفر تطبيقات جاهزة مثل البريد الإلكتروني عبر السحابة باستخدام نطاق خاص.","oldQNumber":"51","bankIndex":576,"setId":"set6"},{"id":"577","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"في المؤسسات الكبيرة التي تضم العديد من طبقات الإدارة غالباً ما يتم إبعاد كبار المديرين التنفيذيين عن قضايا الاستراتيجية المهمة طويلة المدى للمساعدة في اتخاذ قرارات روتينية أكثر بساطة. من المرجح أن يكون هذا الموقف ناتجاً عن أي من المشكلات التالية المتعلقة بالهيكل التنظيمي؟","options":[{"key":"A","letter":"أ","text":"نطاق التحكم ضيق للغاية."},{"key":"B","letter":"ب","text":"لا يوجد مستويات هرمية كافية."},{"key":"C","letter":"ج","text":"الهيكل مسطح للغاية."},{"key":"D","letter":"د","text":"الهيكل لا مركزي للغاية."}],"explanation":"أ. صحيح لأنه عندما يكون نطاق التحكم ضيقاً يزداد عدد المستويات الإدارية، مما يؤدي إلى انشغال كبار المديرين بالقرارات اليومية والروتينية بدلاً من التركيز على القضايا الاستراتيجية.\n\nب. خطأ لأنه السؤال يشير إلى وجود العديد من الطبقات الإدارية، وليس إلى نقص في المستويات الهرمية.\n\nج. خطأ لأنه الهيكل المسطح يعني وجود مستويات إدارية أقل، وهو عكس الحالة المذكورة في السؤال.\n\nد. خطأ لأنه اللامركزية تتعلق بتفويض اتخاذ القرارات، وليست السبب المباشر لزيادة الطبقات الإدارية وانشغال الإدارة العليا بالقرارات الروتينية.","oldQNumber":"52","bankIndex":577,"setId":"set6"},{"id":"578","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"اي من الابعاد التالية ترتبط بجودة البيانات الضخمة؟","options":[{"key":"A","letter":"أ","text":"الموثوقية"},{"key":"B","letter":"ب","text":"التحقق"},{"key":"C","letter":"ج","text":"القيمة"},{"key":"D","letter":"د","text":"التنوع"}],"explanation":"أ. صحيح لأنه الموثوقية تعكس جودة البيانات ومدى الاعتماد عليها.\nب. خطأ لأنه التحقق إجراء لضمان الصحة وليس بعدًا أساسيًا لجودة البيانات الضخمة.\nج. خطأ لأنه القيمة تعبر عن الفائدة وليس جودة البيانات نفسها.\nد. خطأ لأنه التنوع من خصائص البيانات الضخمة (V’s) وليس من أبعاد الجودة.","oldQNumber":"53","bankIndex":578,"setId":"set6"},{"id":"579","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي من الخيارات التالية يفسر بشكل أفضل سبب لجوء منظمة ما إلى عقد إيجار تمويلي؟","options":[{"key":"A","letter":"أ","text":"لزيادة القدرة على اقتراض أموال إضافية من الدائنين"},{"key":"B","letter":"ب","text":"لتقليل التدفق النقدي الحر للمنظمة من العمليات"},{"key":"C","letter":"ج","text":"لتحسين التدفق النقدي الحر للمنظمة من العمليات"},{"key":"D","letter":"د","text":"للحصول على الأصل في نهاية فترة الإيجار بسعر أقل من القيمة السوقية العادلة"}],"explanation":"أ. خطأ لأن عقد الإيجار التمويلي لا يُستخدم أساسًا لزيادة القدرة على الاقتراض.\nب. خطأ لأن الهدف ليس تقليل التدفق النقدي الحر بل إدارة التمويل بشكل أفضل.\nج. خطأ لأن الإيجار التمويلي لا يُقاس أساسًا بتحسين التدفق النقدي التشغيلي.\nد. صحيح لأن الإيجار التمويلي غالبًا يمنح المستأجر خيار تملك الأصل في النهاية بقيمة أقل من السوق.","oldQNumber":"55","bankIndex":579,"setId":"set6"},{"id":"580","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"عند استخدام نهج استيعاب التكاليف اي مما يلي يجب تصنيفه كتكلفة فترة؟","options":[{"key":"A","letter":"أ","text":"نفقات البيع"},{"key":"B","letter":"ب","text":"تكاليف التصنيع العامة"},{"key":"C","letter":"ج","text":"العمالة المباشرة"},{"key":"D","letter":"د","text":"تكاليف التصنيع العامة المتغيرة"}],"explanation":"أ. صحيح لأنه نفقات البيع تُعد من تكاليف الفترة ولا تدخل ضمن تكلفة المنتج في نظام استيعاب التكاليف.\nب. خطأ لأن تكاليف التصنيع العامة تُعد جزءًا من تكاليف الإنتاج.\nج. خطأ لأن العمالة المباشرة تُصنف كتكلفة منتج وليست تكلفة فترة.\nد. خطأ لأنها أيضاً ضمن تكاليف التصنيع وليست تكلفة فترة.","oldQNumber":"56","bankIndex":580,"setId":"set6"},{"id":"581","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي من الضوابط التالية تشير إلى مطالبة الموظفين باستخدام مجموعة من الرموز الشخصية وشفرات التمرير ومقاييس الحيوية للوصول إلى تطبيقات وبيانات الأجهزة الذكية الخاصة بالمؤسسة؟","options":[{"key":"A","letter":"أ","text":"المسح عن بعد"},{"key":"B","letter":"ب","text":"تشفير البرامج"},{"key":"C","letter":"ج","text":"تشفير الجهاز"},{"key":"D","letter":"د","text":"المصادقة"}],"explanation":"أ. خطأ لأنه المسح عن بعد يستخدم لحذف البيانات من الجهاز عند فقدانه أو سرقته.\n\nب. خطأ لأنه تشفير البرامج يحمي البيانات والبرامج ولا يتحقق من هوية المستخدم.\n\nج. خطأ لأنه تشفير الجهاز يحمي محتويات الجهاز من الوصول غير المصرح به.\n\nد. صحيح لأنه المصادقة تعتمد على كلمات المرور أو الرموز أو البصمة للتحقق من هوية المستخدم قبل السماح له بالدخول.","oldQNumber":"57","bankIndex":581,"setId":"set6"},{"id":"582","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"ابرم مطور تقني عقدا لمدة عامين مع مؤسسة اخرى لتصميم برامج جديدة، وفقا لارشادات معهد المدققين الداخليين . اي من الاحكام التالية في هذه الاتفاقية سيكون الاكثر فاعلية لحماية معرفة وخبرة منتج المطور؟","options":[{"key":"A","letter":"أ","text":"الحق في التدقيق"},{"key":"B","letter":"ب","text":"نظام قياس الاداء"},{"key":"C","letter":"ج","text":"الادوار والمسؤوليات المحددة"},{"key":"D","letter":"د","text":"حقوق الملكية الفكرية"}],"explanation":"أ. خطأ لأنه الحق في التدقيق يتيح المراجعة ولا يحمي ملكية المنتج أو المعرفة.\nب. خطأ لأنه نظام قياس الاداء يستخدم لتقييم النتائج وليس لحماية المعرفة.\nج. خطأ لأنه تحديد الادوار والمسؤوليات يوضح الواجبات لكنه لا يحمي حقوق المنتج.\nد. صحيح لأنه حقوق الملكية الفكرية تحمي البرامج والمعرفة والخبرة الخاصة بالمطور.","oldQNumber":"58","bankIndex":582,"setId":"set6"},{"id":"583","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"أي مما يلي من المحتمل أن يحدث عندما تقرر المنظمة اعتماد هيكل تنظيمي لا مركزي؟","options":[{"key":"A","letter":"أ","text":"استجابة أبطأ للتغيير الخارجي."},{"key":"B","letter":"ب","text":"اتخاذ قرارات أقل تحكمًا."},{"key":"C","letter":"ج","text":"عبء أكبر على المدراء الأعلى مستوى."},{"key":"D","letter":"د","text":"استخدام أقل للمهارات والقدرات الحقيقية للموظفين."}],"explanation":"أ. خطأ لأن اللامركزية عادة تزيد سرعة الاستجابة للتغيرات وليس العكس.\nب. صحيح لأن اللامركزية تعني توزيع السلطة، مما يؤدي إلى قرارات أقل سيطرة مركزية.\nج. خطأ لأن العبء يقل على الإدارة العليا وليس يزيد.\nد. خطأ لأن اللامركزية عادة تعزز استخدام مهارات الموظفين وليس تقليلها.","oldQNumber":"59","bankIndex":583,"setId":"set6"},{"id":"584","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أيٌّ من الترتيبات التالية يُمثل التسلسل الصحيح لمستويات تنظيم البيانات تصاعدياً من الأصغر إلى الأكبر؟","options":[{"key":"A","letter":"أ","text":"خلية، سجل، جدول."},{"key":"B","letter":"ب","text":"سجل، حقل، جدول."},{"key":"C","letter":"ج","text":"حقل، ملف، مجلد."},{"key":"D","letter":"د","text":"مجلد، ملف، حقل."}],"explanation":"أ. صح لأن الخلية تمثل أصغر وحدة بيانات، ومجموعة الخلايا تكوّن سجلات داخل الجدول، ثم يأتي الجدول بمستوى أكبر.\n\nب. خطأ لأن الحقل أصغر من السجل، لذلك الترتيب غير صحيح.\n\nج. خطأ لأن الملف يحتوي على حقول وبيانات، وليس العكس.\n\nد. خطأ لأن الحقل أصغر من الملف والمجلد، لذلك الترتيب معكوس.","oldQNumber":"60","bankIndex":584,"setId":"set6"},{"id":"585","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اكتشف أحد المدققين الداخليين خطأ في الجرد أدى إلى التقليل من قيمة المخزون الأولي للمؤسسة. أي مما يلي التأثير الصحيح للخطأ على صافي الدخل للمؤسسة في العام الحالي؟","options":[{"key":"A","letter":"أ","text":"لم يتأثر صافي الدخل."},{"key":"B","letter":"ب","text":"إن صافي الدخل مبالغ فيه."},{"key":"C","letter":"ج","text":"إن صافي الدخل أقل من القيمة الحقيقية."},{"key":"D","letter":"د","text":"ينخفض صافي الدخل بمقدار الخطأ."}],"explanation":"أ. خطأ لأنه التقليل من المخزون الأولي يؤثر على تكلفة البضاعة المباعة وبالتالي يؤثر على صافي الدخل.\n\nب. صحيح لأنه عندما يكون المخزون الأولي أقل من حقيقته، فإن تكلفة البضاعة المباعة تكون أقل من حقيقتها، مما يؤدي إلى زيادة صافي الدخل.\n\nج. خطأ لأنه صافي الدخل لا يكون أقل من قيمته الحقيقية بل أعلى منها.\n\nد. خطأ لأنه الخطأ لا يؤدي إلى انخفاض صافي الدخل، بل إلى المبالغة فيه","oldQNumber":"61","bankIndex":585,"setId":"set6"},{"id":"586","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"يعتبر مدقق داخلي للبيانات المالية لمنظمة كجزء من مهمة تأكيد مالي، ويعبر المدقق عن نفقات الكهرباء والإهلاك للمنظمة كنسبة مئوية من الإيرادات بنسبة 10% و7% و6% و5% على التوالي. أي من التقنيات التالية استخدمها المدقق الداخلي في هذا الحساب؟","options":[{"key":"A","letter":"أ","text":"التحليل الأفقي."},{"key":"B","letter":"ب","text":"التحليل الرأسي."},{"key":"C","letter":"ج","text":"التحليل النسبي."},{"key":"D","letter":"د","text":"تحليل الاتجاه."}],"explanation":"أ. خطأ لأنه يقارن البنود المالية عبر فترات زمنية مختلفة لإظهار مقدار التغير أو نسبته.\n\nب. صحيح لأنه يعبر عن كل بند مالي كنسبة مئوية من بند أساسي في نفس القائمة المالية، مثل الإيرادات.\n\nج. خطأ لأنه يركز على احتساب النسب المالية بين بنود مختلفة لتقييم الأداء أو السيولة أو الربحية.\n\nد. خطأ لأنه يدرس التغيرات والأنماط في البيانات المالية عبر عدة فترات زمنية.","oldQNumber":"63","bankIndex":586,"setId":"set6"},{"id":"587","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"وفقًا لإرشادات معهد المدققيين الداخليين بشأن تكنولوجيا المعلومات ، ما هي المؤشرات التالية التي تشير الى ضعف إدارة التغيير؟\n\n١. تصميم رقابي غير مناسب.\n\n٢. توقف غير مخطط له.\n\n٣. استكشاف الأخطاء وإصلاحها بشكل مفرط.\n\n٤. عدم توفر الخدمات الأساسية","options":[{"key":"A","letter":"أ","text":"2 و 3 فقط"},{"key":"B","letter":"ب","text":"1 و 2 و 3 فقط"},{"key":"C","letter":"ج","text":"1 و 3 و 4 فقط"},{"key":"D","letter":"د","text":"2 و 3 و 4 فقط"}],"explanation":"1 . خطأ لأنه يتعلق بضعف تصميم الضوابط وليس بالضرورة ضعف إدارة التغيير.\n\n2 . صحيح لأنه من المؤشرات الشائعة على وجود مشكلات في إدارة التغيير.\n\n3 . صحيح لأنه يدل على أن التغييرات المنفذة تسبب مشكلات تتطلب معالجة متكررة.\n\n4 . صحيح لأنه قد ينتج عن تغييرات غير مُدارة بشكل جيد تؤثر على استمرارية الخدمات.","oldQNumber":"64","bankIndex":587,"setId":"set6"},{"id":"588","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اي مما يلي يجب على المؤسسة تنفيذه للتخفيف من المخاطر الناجمة عن أزمة أو حدث وادارتها بشكل فعال؟","options":[{"key":"A","letter":"أ","text":"التدابير الوقائية فقط."},{"key":"B","letter":"ب","text":"التدابير البديلة والتفاعلية."},{"key":"C","letter":"ج","text":"التدابير الوقائية والبديلة."},{"key":"D","letter":"د","text":"التدابير الوقائية والتفاعلية"}],"explanation":"أ. خطأ لأنه الاعتماد على التدابير الوقائية فقط لا يكفي لإدارة الأزمات بعد وقوعها.\nب. صحيح لأنه إدارة المخاطر أثناء الأزمة تتطلب حلول بديلة للتعامل مع الوضع وتدابير تفاعلية للاستجابة.\nج. خطأ لأنه يغفل جانب الاستجابة الفعلية للأزمة.\nد. خطأ لأنه لا يركز على البدائل اللازمة لاستمرارية الأعمال بشكل كامل.","oldQNumber":"65","bankIndex":588,"setId":"set6"},{"id":"589","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"وفقا لتسلسل ماسلو الهرمي لنظرية الاحتياجات اي مما يلي من المحتمل ان يكون له الاثر الاكبر على الاحتفاظ بالموظفين اذا تم تلبية احتياجاتهم ذات المستوى الادنى بالفعل؟","options":[{"key":"A","letter":"أ","text":"المنافع الاجتماعية"},{"key":"B","letter":"ب","text":"التعويض"},{"key":"C","letter":"ج","text":"السلامه المهنيه"},{"key":"D","letter":"د","text":"التعرف ( التقدير)"}],"explanation":"أ. خطأ لأنه المنافع الاجتماعية تأتي في مستوى أقل من الاحتياجات العليا مثل التقدير.\nب. خطأ لأنه التعويض (الراتب) يرتبط بالاحتياجات الأساسية وليس العليا بعد إشباعها.\nج. خطأ لأنه السلامة المهنية من الاحتياجات الأساسية في هرم ماسلو.\nد. صحيح لأنه بعد تلبية الاحتياجات الأساسية يصبح التقدير والاعتراف هو الأكثر تأثيرًا على الاحتفاظ بالموظفين.","oldQNumber":"66","bankIndex":589,"setId":"set6"},{"id":"590","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أي من عناصر التحكم الأمنية التالية يركز بشكل أكثر على منع الوصول غير المصرح به إلى محطة الطاقة؟","options":[{"key":"A","letter":"أ","text":"يتم بدء إجراء إنهاء الخدمة شهريًا لتحديد حقوق الوصول المادي الزائدة عن الحاجة"},{"key":"B","letter":"ب","text":"يتم فحص السجلات التي يتم إنشاؤها بواسطة الأقفال الذكية تلقائيًا لتحديد الشذوذ في أنماط الوصول"},{"key":"C","letter":"ج","text":"يتم إرسال طلبات حقوق الوصول الإضافية للموافقة والمصادقة عليها من قبل المشرفين المباشرين"},{"key":"D","letter":"د","text":"يتم إرسال اخطارات تلقائية إلى وحدة أمن مركزية عندما يدخل الموظفون إلى المبنى في غير ساعات العمل"}],"explanation":"أ. خطأ لأنه يركز على مراجعة لاحقة لإزالة الصلاحيات وليس منع الدخول غير المصرح به مباشرة.\nب. خطأ لأنه تحليل السجلات إجراء كشف وليس منع الوصول.\nج. صحيح لأنه الموافقة المسبقة على طلبات الوصول تمنع دخول غير المصرح لهم من الأساس.\nد. خطأ لأنه تنبيه أمني بعد الدخول وليس منع الوصول نفسه.","oldQNumber":"67","bankIndex":590,"setId":"set6"},{"id":"591","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي من العبارات التالية صحيحة فيما يتعلق بالنسخ الاحتياطي للبيانات؟","options":[{"key":"A","letter":"أ","text":"يعمل النسخ الاحتياطي للبيانات كعنصر تحكم تصحيحي لتقليل فقدان البيانات أثناء انقطاع نظام تكنولوجيا المعلومات."},{"key":"B","letter":"ب","text":"يؤدي إجراء عمليات نسخ احتياطي شهرية للبيانات إلى تخفيف المخاطر المتبقية المرتبطة بفقدان البيانات."},{"key":"C","letter":"ج","text":"تسمح عمليات النسخ الاحتياطي بالاحتفاظ بجميع البيانات، وذلك لدعم متطلبات الاحتفاظ بالبيانات الخاصة بالمؤسسة."},{"key":"D","letter":"د","text":"يعمل النسخ الاحتياطي للبيانات كعنصر تحكم وقائي للتقليل من احتمالية فقدان المعاملات أثناء انقطاع النظام"}],"explanation":"أ. صحيح لأنه النسخ الاحتياطي يساعد على استرجاع البيانات بعد حدوث المشكلة وليس منعها.\nب. خطأ لأنه النسخ الاحتياطي لا يخفف المخاطر المتبقية بشكل مباشر بل يعتمد على تكرار واستراتيجية النسخ.\nج. خطأ لأنه النسخ الاحتياطي لا يضمن الاحتفاظ بجميع البيانات بشكل كامل دائماً.\nد. خطأ لأنه يعتبر تحكم تصحيحي وليس وقائي، فهو لا يمنع فقدان البيانات بل يعالج أثره.","oldQNumber":"68","bankIndex":591,"setId":"set6"},{"id":"592","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"في أي من الظروف التالية من المرجح أن تكون شركة الهاتف الجوال ملزمة بتلبية طلب العميل؟","options":[{"key":"A","letter":"أ","text":"يطلب العميل الحالي أن تكشف الشركة عن كيفية استخدام معلوماته الشخصية."},{"key":"B","letter":"ب","text":"يطلب عميل حالي من الشركة التوقف عن تتبع طول مكالماته الهاتفية واستخدامه للإنترنت."},{"key":"C","letter":"ج","text":"يطلب العميل الحالي سجلاً كاملاً لاستخدامه لخدمات الهاتف الجوال خلال السنوات العشر الماضية."},{"key":"D","letter":"د","text":"يطلب العميل الحالي بيانات الاتصال الخاصة بعميل آخر يزعم أنه تسبب في ضرر له."}],"explanation":"أ. صحيح لأنه من حق العميل معرفة كيفية جمع واستخدام ومعالجة معلوماته الشخصية وفقاً لمبادئ حماية البيانات والخصوصية.\n\nب. خطأ لأنه قد تحتاج الشركة إلى تتبع بعض البيانات لتقديم الخدمة أو للامتثال للمتطلبات القانونية والتنظيمية.\n\nج. خطأ لأنه قد لا تكون الشركة ملزمة بالاحتفاظ بسجلات الاستخدام لمدة عشر سنوات أو توفيرها.\n\nد. خطأ لأنه لا يجوز للشركة الكشف عن بيانات عميل آخر حفاظاً على خصوصيته وسرية معلوماته.","oldQNumber":"69","bankIndex":592,"setId":"set6"},{"id":"593","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"اضطرت احدى المؤسسات إلى وقف الإنتاج بشكل غير متوقع، حيث تعذر تسليم المواد الخام بسبب صراع عسكري في المنطقة.أي من الخطط التالية قد أخفقت على الارجح في دعم المؤسسة؟","options":[{"key":"A","letter":"أ","text":"خطط التسليم في الوقت المناسب."},{"key":"B","letter":"ب","text":"خطط النسخ الاحتياطي."},{"key":"C","letter":"ج","text":"خطط الطوارئ."},{"key":"D","letter":"د","text":"الخطط الدائمة"}],"explanation":"أ. خطأ لأنه التسليم في الوقت المناسب يتعلق بإدارة المخزون وليس الاستجابة للأزمات.\nب. خطأ لأن النسخ الاحتياطي يرتبط بالبيانات وليس بالإنتاج أو المواد الخام.\nج. صحيح لأن خطط الطوارئ تهدف لضمان استمرارية الأعمال في حالات الانقطاع، وغيابها أدى لتوقف الإنتاج.\nد. خطأ لأنه مصطلح عام وغير مرتبط مباشرة بإدارة الأزمات التشغيلية.","oldQNumber":"71","bankIndex":593,"setId":"set6"},{"id":"594","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أيّ مما يلي يصف بشكل أفضل وظيفة برامج مكافحة الفيروسات وجدران الحماية؟","options":[{"key":"A","letter":"أ","text":"إنها ضوابط مادية وبيئية."},{"key":"B","letter":"ب","text":"إنها ضوابط تطوير الأنظمة والاستحواذ."},{"key":"C","letter":"ج","text":"إنها ضوابط برمجيات الأنظمة."},{"key":"D","letter":"د","text":"إنها ضوابط سلامة البيانات."}],"explanation":"أ. خطأ لأن برامج مكافحة الفيروسات وجدران الحماية ليست ضوابط مادية أو بيئية.\nب. خطأ لأنها لا تتعلق بتطوير الأنظمة أو عمليات الاستحواذ.\nج. صحيح لأنها أدوات برمجية تُستخدم لحماية الأنظمة والشبكات من التهديدات.\nد. خطأ لأنها لا تصنف كضوابط سلامة بيانات بشكل مباشر.","oldQNumber":"72","bankIndex":594,"setId":"set6"},{"id":"595","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"ما هو الداعم الأساسي لتعريف عمليات تحديث عناصر البيانات الأساسية؟","options":[{"key":"A","letter":"أ","text":"حوكمة البيانات"},{"key":"B","letter":"ب","text":"ضغط البيانات"},{"key":"C","letter":"ج","text":"أرشفة البيانات"},{"key":"D","letter":"د","text":"النسخ الاحتياطي للبيانات"}],"explanation":"أ. صحيح لأنها تضع السياسات والأدوار والإجراءات اللازمة لإدارة عناصر البيانات الأساسية وتحديثها والمحافظة على جودتها.\n\nب. خطأ لأنه يهدف إلى تقليل حجم البيانات لتوفير مساحة التخزين، ولا يتعلق بتعريف عمليات تحديث البيانات الأساسية.\n\nج. خطأ لأنها تُستخدم للاحتفاظ بالبيانات لفترات طويلة، ولا تُحدد آليات تحديث عناصر البيانات الأساسية.\n\nد. خطأ لأنه يركز على استعادة البيانات عند فقدانها أو تلفها، وليس على إدارة وتحديث البيانات الأساسية.","oldQNumber":"73","bankIndex":595,"setId":"set6"},{"id":"596","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"قررت احدى المطاعم توسيع نطاق اعمالها ليشمل خدمات التوصيل ، بدلاً من الاعتماد على خدمات توصيل طعام من طرف ثالث. أي مما يلي يصف بشكل أفضل استراتيجية المطعم؟","options":[{"key":"A","letter":"أ","text":"التنويع"},{"key":"B","letter":"ب","text":"التكامل الرأسي"},{"key":"C","letter":"ج","text":"تجنب المخاطر"},{"key":"D","letter":"د","text":"التميز"}],"explanation":"أ. خطأ لأنه التنويع يعني دخول مجالات مختلفة غير مرتبطة بشكل مباشر بسلسلة القيمة الحالية.\nب. صحيح لأنه التكامل الرأسي يعني أن المؤسسة توسع نشاطها داخل نفس سلسلة القيمة (مثل التوصيل بدل طرف ثالث).\nج. خطأ لأنه ليس هدفه تجنب المخاطر بل تغيير نموذج التشغيل.\nد. خطأ لأنه التميز يتعلق بالمنافسة وليس بهيكل الاستراتيجية التشغيلية.","oldQNumber":"74","bankIndex":596,"setId":"set6"},{"id":"597","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اي من القوائم المالية التالية يصف تصنيف تكاليف التصنيع على افضل وجه،","options":[{"key":"A","letter":"أ","text":"المواد المباشرة ، المواد غير المباشرة ، المواد الخام"},{"key":"B","letter":"ب","text":"⁠التكاليف العامة، العمالة المباشرة، المواد المباشرة"},{"key":"C","letter":"ج","text":"⁠المواد المباشرة، العمالة المباشرة ، الاستهلاك في مباني المصنع"},{"key":"D","letter":"د","text":"⁠المواد الخام ، اجور العاملين في المصنع، مصاريف بيع الإنتاج"}],"explanation":"أ. خطأ لأنه يحتوي على تصنيفات غير دقيقة مثل المواد الخام بدل تصنيف تكاليف التصنيع الأساسي.\nب. صحيح لأنه يمثل العناصر الأساسية لتكاليف التصنيع وهي المواد المباشرة والعمالة المباشرة والتكاليف العامة.\nج. خطأ لأنه يذكر الاستهلاك فقط دون التكاليف العامة بشكل كامل.\nد. خطأ لأنه يخلط بين تكاليف الإنتاج وتكاليف البيع.","oldQNumber":"75","bankIndex":597,"setId":"set6"},{"id":"598","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي من أنواع الميزانيات التالية يوفر أفضل أساس لتقييم سيولة المؤسسة؟","options":[{"key":"A","letter":"أ","text":"ميزانية النقد."},{"key":"B","letter":"ب","text":"الميزانية العمومية."},{"key":"C","letter":"ج","text":"ميزانية مصروفات البيع والإدارة."},{"key":"D","letter":"د","text":"قائمة الدخل المدرجة في الميزانية"}],"explanation":"أ. صحيح لأن ميزانية النقد توضح التدفقات النقدية الداخلة والخارجة وبالتالي تعكس سيولة المؤسسة بشكل مباشر.\nب. خطأ لأن الميزانية العمومية تعكس المركز المالي لكنها أقل دقة في تقييم السيولة الفورية.\nج. خطأ لأنها تركز على المصاريف التشغيلية فقط.\nد. خطأ لأنها تتعلق بالأرباح وليست السيولة.","oldQNumber":"76","bankIndex":598,"setId":"set6"},{"id":"599","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"لاحظ مدقق داخلي أن هناك أدوية خاضعة للرقابة تُباع بشكل مبالغ فيه مقارنة بالصيدليات المجاورة. وبعد الاجتماع مع رئيس الصيدلية لم يُبدِ أي مخاوف بشأن المخاطر، وأوضح أنه مطمئن للفواتير والمبيعات والضوابط. ماذا يكون موقف المدقق؟","options":[{"key":"A","letter":"أ","text":"يوثق المدقق إفادة رئيس الصيدلية ويُقيّم المخاطر بناءً على الأدلة المتاحة."},{"key":"B","letter":"ب","text":"يقوم بتسجيل الملاحظة ليُكمل التدقيق في عام لاحق."},{"key":"C","letter":"ج","text":"يطلب مراجعة سياسة وإجراءات الصرف لدى الصيدلية."},{"key":"D","letter":"د","text":"يعتمد على رأي رئيس الصيدلية ويغلق الملاحظة دون إجراء أي اختبارات إضافية."}],"explanation":"أ خطأ لأن توثيق إفادة رئيس الصيدلية وحده لا يكفي لمعالجة مؤشر الخطر الظاهر، ويجب على المدقق البحث عن أسباب الاختلاف والتحقق من الضوابط المرتبطة بالصرف.\n\nب خطأ لأن وجود مبيعات غير اعتيادية للأدوية الخاضعة للرقابة يستدعي اتخاذ إجراءات تدقيقية خلال المهمة الحالية وعدم تأجيل الموضوع إلى تدقيق مستقبلي.\n\nج صحيح لأن مراجعة سياسات وإجراءات صرف الأدوية الخاضعة للرقابة تساعد المدقق على تقييم مدى كفاية الضوابط وفهم أسباب الارتفاع غير المعتاد في المبيعات وتحديد ما إذا كانت هناك ثغرات رقابية.\n\nد خطأ لأن المدقق لا يعتمد على تأكيدات الإدارة فقط، بل يجب عليه الحصول على أدلة وفحص الضوابط ذات العلاقة قبل الوصول إلى استنتاجاته","oldQNumber":"77","bankIndex":599,"setId":"set6"},{"id":"600","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"يقوم المدقق الداخلي بمراجعة القوائم المالية الموحدة لمجموعة من المؤسسات. أي من المخاطر التالية ينبغي على المدقق مراعاتها؟","options":[{"key":"A","letter":"أ","text":"قد تخفي البيانات الأداء الضعيف لشركة تابعة ضمن المجموعة."},{"key":"B","letter":"ب","text":"لن تعكس البيانات مجالات الأعمال الخاضعة للسيطرة المشتركة."},{"key":"C","letter":"ج","text":"لن تشير البيانات إلى إجمالي الثروة التي تسيطر عليها الشركة الأم."},{"key":"D","letter":"د","text":"قد تكون البيانات مضللة بسبب تضمين المعاملات بين أعضاء المجموعة."}],"explanation":"أ. صحيح لأن القوائم الموحدة قد تخفي الأداء الضعيف لبعض الشركات التابعة عند دمج النتائج.\nب. خطأ لأن القوائم الموحدة لا تُعد لعرض السيطرة المشتركة بهذا الشكل.\nج. خطأ لأن القوائم الموحدة تعكس إجمالي المركز المالي للمجموعة وليس الهدف منه إظهار الثروة فقط.\nد. خطأ لأن المعاملات البينية يتم استبعادها عادة في التوحيد وليست مصدر التضليل الأساسي.","oldQNumber":"78","bankIndex":600,"setId":"set6"},{"id":"601","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"كيف سيؤثر على الالتزامات في الميزانية إذا كان هناك خطأ في المخزون؟","options":[{"key":"A","letter":"أ","text":"الالتزامات لا تتأثر من ذلك"},{"key":"B","letter":"ب","text":"يقل حساب الميزانية"},{"key":"C","letter":"ج","text":"يزيد حساب الميزانية"},{"key":"D","letter":"د","text":"الالتزامات لا تتأثر إلا في حساب الدخل فقط"}],"explanation":"أ. صحيح لأن أخطاء المخزون تؤثر على الأصول وتكلفة البضاعة/الربح، لكنها لا تؤثر مباشرة على الالتزامات.\nب. خطأ لأنه لا يوجد علاقة مباشرة بين خطأ المخزون وتقليل الالتزامات.\nج. خطأ لأنه لا يؤدي إلى زيادة في الالتزامات.\nد. خطأ لأنه الالتزامات لا ترتبط بحساب الدخل في حالة أخطاء المخزون بشكل مباشر.","oldQNumber":"79","bankIndex":601,"setId":"set6"},{"id":"602","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اشترت احدى المؤسسات براءة اختراع بنكلفة 500.000 دولار. تبلغ مدة صلاحية براءة الاختراع القانونية 10 سنوات، ومع ذلك، تقدر المؤسسة العمر الافتراضي لبراءة الاختراع بثماني سنوات. أي مما يلى يجب على المنظمة تسجيله في نهاية سنتها المالية؟","options":[{"key":"A","letter":"أ","text":"نفقات استهلاك الدين بمبلغ 62.500 دولار."},{"key":"B","letter":"ب","text":"نفقات استهلاك بقيمة 62.500 دولار."},{"key":"C","letter":"ج","text":"نفقات استهلاك الدين بقيمة 50.000 دولار."},{"key":"D","letter":"د","text":"حساب استهلاك الدين المتراكم بمبلغ 50.000 دولار."}],"explanation":"أ. خطأ لأنه يستخدم مصطلح \"استهلاك الدين\" غير المناسب للأصول غير الملموسة.\nب. صحيح لأنه يتم احتساب الإهلاك على أساس العمر الإنتاجي (500,000 ÷ 8 = 62,500 سنوياً).\nج. خطأ لأنه يعتمد على 10 سنوات وليس العمر الاقتصادي الفعلي.\nد. خطأ لأنه يمثل رصيدًا تراكميًا وليس مصروف السنة.","oldQNumber":"80","bankIndex":602,"setId":"set6"},{"id":"603","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أي العبارات التالية صحيحة فيما يتعلق بالأنواع المختلفة لتحليلات البيانات؟","options":[{"key":"A","letter":"أ","text":"التحليل الوصفي أقل استخداماً بسبب الاستثمار العالي المطلوب."},{"key":"B","letter":"ب","text":"التحليل التشخيصي خاص بالمبيعات والتسويق."},{"key":"C","letter":"ج","text":"التحليل التنبؤي يستخرج كميات كبيرة من البيانات الحالية ويتنبأ بالنتائج المستقبلية من خلال تطبيق افتراضات معينة على النموذج."},{"key":"D","letter":"د","text":"يرتبط التحليل الوصفي بتكثيف أجزاء كبيرة من البيانات إلى معلومات أصغر وأكثر تلخيصاً."}],"explanation":"أ. خطأ لأنه التحليل الوصفي من أكثر أنواع التحليلات استخداماً وعادةً لا يتطلب استثمارات مرتفعة مقارنة بالأنواع المتقدمة.\n\nب. خطأ لأنه التحليل التشخيصي يستخدم في العديد من المجالات وليس مقتصراً على المبيعات والتسويق.\n\nج. صحيح لأنه التحليل التنبؤي يعتمد على البيانات الحالية والتاريخية للتنبؤ بالأحداث أو النتائج المستقبلية.\n\nد. خطأ لأنه هذا الوصف يتعلق بالتحليل الوصفي، لكن العبارة الصحيحة المطلوبة في السؤال هي الخيار الثالث.","oldQNumber":"81","bankIndex":603,"setId":"set6"},{"id":"604","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"وفقًا لتوجيهات معهد المدققين الداخليين (IIA) بشأن تكنولوجيا المعلومات، أي مما يلي يُعتبر من الضوابط الأساسية لجداول البيانات لضمان دقة التقارير المالية؟","options":[{"key":"A","letter":"أ","text":"يتم قفل أو حماية الصيغ وال
