م نتائج التدقيق"},{"key":"B","letter":"ب","text":"يسهل تحديد المخاطر الهامة"},{"key":"C","letter":"ج","text":"يساعد في تحديد موارد التدقيق المطلوبة للفحص"},{"key":"D","letter":"د","text":"يسهم في تقديم توصيات التقرير"}],"explanation":"أ. خطأ لأنه تدعيم النتائج هو نتيجة لاحقة وليس الفائدة الأساسية المباشرة للتحليل.\n\nب. صحيح لأنه يساعد المدقق في تحديد وتقييم المخاطر المهمة بشكل أسرع وأكثر دقة.\n\nج. خطأ لأن تحديد الموارد يتعلق بتخطيط التدقيق وليس الفائدة المباشرة للتحليل.\n\nد. خطأ لأن تقديم التوصيات يأتي بعد التحليل وليس من فوائده الأساسية.","oldQNumber":"9","bankIndex":427,"setId":"set1"},{"id":"14","form":"form5","formTitle":"Group 5","lesson":"أ- تحليل البيانات","answer":"B","question":"ما هي سمة البيانات الأكثر تأثراً بشبكة الأشياء؟","options":[{"key":"A","letter":"أ","text":"التطبيع"},{"key":"B","letter":"ب","text":"السرعة"},{"key":"C","letter":"ج","text":"الهيكلة"},{"key":"D","letter":"د","text":"الصدق"}],"explanation":"أ. خطأ لأنه التطبيع ليس سمة بيانات بل عملية معالجة للبيانات.\n\nب. صحيح لأن شبكة الأشياء تولّد بيانات بشكل لحظي ومستمر مما يزيد سرعة تدفق البيانات بشكل كبير.\n\nج. خطأ لأن الهيكلة تتعلق بشكل البيانات وليس تأثرها الأساسي بشبكة الأشياء.\n\nد. خطأ لأن الصدق يتعلق بجودة البيانات وليس السمة الأكثر تأثراً بشبكة الأشياء.","oldQNumber":"14","bankIndex":428,"setId":"set1"},{"id":"19","form":"form5","formTitle":"Group 5","lesson":"أ- تحليل البيانات","answer":"C","question":"أي مما يلي يوضح أول شيء يجب القيام به بالبيانات التي تم الحصول عليها في عملية تحليل البيانات؟","options":[{"key":"A","letter":"أ","text":"التحقق من الاكتمال والدقة"},{"key":"B","letter":"ب","text":"التحقق من الوجود والدقة."},{"key":"C","letter":"ج","text":"التحقق من الاكتمال والنزاهة."},{"key":"D","letter":"د","text":"التحقق من الوجود والاكتمال"}],"explanation":"أ. خطأ لأن الدقة لا يمكن الحكم عليها قبل التأكد من اكتمال البيانات ونزاهتها.\n\nب. خطأ لأن الوجود والدقة لا يكفيان كخطوة أولى شاملة في التحليل.\n\nج. صحيح لأنه يجب أولاً التأكد من اكتمال البيانات وسلامتها (النزاهة) قبل أي تحليل.\n\nد. خطأ لأن الوجود والاكتمال وحدهما لا يكفيان لضمان صلاحية البيانات للتحليل.","oldQNumber":"19","bankIndex":429,"setId":"set1"},{"id":"24","form":"form5","formTitle":"Group 5","lesson":"أ- تحليل البيانات","answer":"B","question":"ما هي الخطوة التالية بعد الحصول على البيانات في تحليل البيانات بعد الحصول على مصادر البيانات ؟","options":[{"key":"A","letter":"أ","text":"حلل البيانات"},{"key":"B","letter":"ب","text":"بيانات مستنظمة (normalized)"},{"key":"C","letter":"ج","text":"تقييم المخاطر"},{"key":"D","letter":"د","text":"حدد القيمة المتوقعه"}],"explanation":"أ. خطأ لأن تحليل البيانات يأتي بعد تجهيز البيانات وليس مباشرة بعد الحصول عليها.\n\nب. صحيح لأن بعد الحصول على البيانات يتم تنظيمها وتطبيعها (Normalization) لتصبح جاهزة للتحليل.\n\nج. خطأ لأن تقييم المخاطر يسبق أو يوازي مرحلة التخطيط وليس مرحلة تجهيز البيانات مباشرة.\n\nد. خطأ لأن تحديد القيمة المتوقعة يتم في مرحلة التخطيط قبل معالجة البيانات.","oldQNumber":"24","bankIndex":430,"setId":"set1"},{"id":"29","form":"form5","formTitle":"Group 5","lesson":"أ- تحليل البيانات","answer":"A","question":"ما الذي يجب أن تطبقه الإدارة أثناء تنفيذ أنظمة البيانات الضخمة لتمكين المراقبة المستمرة للإنتاج؟","options":[{"key":"A","letter":"أ","text":"مؤشرات الأداء الرئيسية."},{"key":"B","letter":"ب","text":"تقارير تخصيص البرامج."},{"key":"C","letter":"ج","text":"إدارة التغيير والتصحيح."},{"key":"D","letter":"د","text":"إدارة البيانات الرئيسية."}],"explanation":"أ. صحيح لأنها تُستخدم لقياس الأداء ومراقبة العمليات بشكل مستمر في أنظمة الإنتاج.\n\nب. خطأ لأن تقارير تخصيص البرامج لا ترتبط بالمراقبة المستمرة للإنتاج.\n\nج. خطأ لأن إدارة التغيير والتصحيح تتعلق بإدارة التعديلات وليس بالمراقبة التشغيلية.\n\nد. خطأ لأن إدارة البيانات الرئيسية تهتم بجودة البيانات وليس بمراقبة الإنتاج بشكل مباشر.","oldQNumber":"29","bankIndex":431,"setId":"set1"},{"id":"34","form":"form5","formTitle":"Group 5","lesson":"أ- تحليل البيانات","answer":"B","question":"اي مما يلي يعد اكثر خصائص البيانات الضخمة شيوعا؟","options":[{"key":"A","letter":"أ","text":"الوضوح والتاكيد ومكامن الضعف"},{"key":"B","letter":"ب","text":"السرعة والتنوع والحجم"},{"key":"C","letter":"ج","text":"التعقيد والاكتمال والثبات"},{"key":"D","letter":"د","text":"الاستمرارية والضوابط والملاءمة"}],"explanation":"أ. خطأ لأنه لا يمثل خصائص البيانات الضخمة المعروفة.\n\nب. صحيح لأنها تمثل الخصائص الأساسية للبيانات الضخمة (السرعة، التنوع، الحجم).\n\nج. خطأ لأنها ليست من خصائص البيانات الضخمة الشائعة.\n\nد. خطأ لأنها صفات عامة ولا تمثل نموذج خصائص البيانات الضخمة.","oldQNumber":"34","bankIndex":432,"setId":"set1"},{"id":"39","form":"form5","formTitle":"Group 5","lesson":"أ- تحليل البيانات","answer":"B","question":"ما هي إحدى فوائد مفهوم إنترنت الأشياء؟","options":[{"key":"A","letter":"أ","text":"يمكن للموظفين الاختيار من بين مجموعة متنوعة من الأجهزة التي يريدون استخدامها لقراءة رسائل العمل الخاصة بهم بشكل خاص دون علم صاحب العمل."},{"key":"B","letter":"ب","text":"يمكن ضبط الأجهزة المادية ، مثل الترموستات والمضخات الحرارية ، لتفاعل مع تغييرات سوق الكهرباء وتقليل التكاليف."},{"key":"C","letter":"ج","text":"يمكن استخراج المعلومات بشكل أكثر كفاءة من قواعد البيانات ونقلها إلى التطبيقات ذات الصلة لإجراء تحليلات عميقة."},{"key":"D","letter":"د","text":"يكون استخراج البيانات وجمع البيانات من الإنترنت والشبكات الاجتماعية أسهل ، والنتائج أكثر شمولاً."}],"explanation":"أ. خطأ لأنه لا يمثل فائدة من إنترنت الأشياء بل يتعلق باستخدام غير مصرح به للأجهزة.\n\nب. صحيح لأنه يوضح كيف يمكن للأجهزة الذكية التفاعل تلقائياً مع البيانات لتحسين الكفاءة وتقليل التكاليف.\n\nج. خطأ لأن هذا يصف تكامل البيانات وليس مفهوم إنترنت الأشياء بشكل مباشر.\n\nد. خطأ لأن هذا يتعلق بجمع بيانات من الإنترنت وليس بربط الأجهزة المادية الذكية.","oldQNumber":"39","bankIndex":433,"setId":"set1"},{"id":"41","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين (IIA) بشأن تكنولوجيا المعلومات، أي من الجداول الإلكترونية التالية من المرجح أن يعتبر تطبيقًا عالي المخاطر من تطوير المستخدم؟","options":[{"key":"A","letter":"أ","text":"جدول بيانات لحساب الإيرادات مدعوم بتقارير الأسعار والحجم من قسم الإنتاج."},{"key":"B","letter":"ب","text":"جدول بيانات لحساب تقاعد الأصول يتكون من عدة صيغ وافتراضات."},{"key":"C","letter":"ج","text":"جدول بيانات قائمة جرد مؤقتة تتضمن تفاصيل كميات المخزون المشطوبة."},{"key":"D","letter":"د","text":"جدول بيانات لمطابقة الحسابات المستقبلة يستخدمه مدير المحاسبة للتحقق من الأرصدة."}],"explanation":"أ. خطأ لأنه يعتمد على بيانات تشغيلية لكنه أقل تعقيدًا من حيث الصيغ والافتراضات.\n\nب. صحيح لأنه يحتوي على صيغ متعددة وافتراضات مالية حساسة (مثل احتساب تقاعد الأصول)، مما يجعله عالي المخاطر بسبب تأثيره المباشر على التقارير المالية واحتمال الخطأ.\n\nج. خطأ لأنه جدول بسيط نسبيًا لأغراض جرد مؤقت ولا يحتوي على تعقيد حسابي كبير.\n\nد. خطأ لأنه يستخدم للتحقق والمطابقة فقط وليس تطبيقًا معقدًا عالي المخاطر.","oldQNumber":"2","bankIndex":434,"setId":"set2"},{"id":"46","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما الذي يصف بشكل أفضل تحكمًا اكتشافيًا مصممًا لحماية المنظمة من التهديدات والهجمات السيبرانية؟","options":[{"key":"A","letter":"أ","text":"قائمة بالجهات الجيدة والموثوقة والمجال الواضح وقائمة بالجهات غير المصرح بها والمحظورة."},{"key":"B","letter":"ب","text":"مراقبة نقاط الضعف بناءً على معلومات استخباراتية صناعية ( ذكاء صناعي)."},{"key":"C","letter":"ج","text":"اتفاقيات شاملة لمستوى الخدمة مع البائعين."},{"key":"D","letter":"د","text":"جدار الحماية وأدوات حماية محيط الشبكة الأخرى."}],"explanation":"أ خطا لأنه يمثل تحكم إداري/قوائم وصول وليس تحكمًا اكتشافيًا.\nب صحيح لأنه يعتمد على مراقبة واكتشاف الثغرات والتهديدات باستخدام معلومات استخباراتية.\nج خطا لأنه يتعلق بإدارة العلاقة مع الموردين وليس اكتشاف التهديدات.\nد خطا لأنه يمثل تحكم وقائي لمنع الهجمات وليس اكتشافها.","oldQNumber":"7","bankIndex":435,"setId":"set2"},{"id":"51","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من الممارسات التالية تتحايل القيود الإدارية على الأجهزة الذكية، مما يزيد من مخاطر أمن البيانات؟","options":[{"key":"A","letter":"أ","text":"الروتينج (التجذير)."},{"key":"B","letter":"ب","text":"التلصص."},{"key":"C","letter":"ج","text":"رجل في الوسط."},{"key":"D","letter":"د","text":"اختطاف الجلسة."}],"explanation":"أ. صحيح لأن Rooting (التجذير) هو عملية كسر قيود النظام في الأجهزة الذكية للحصول على صلاحيات إدارية كاملة، مما يتجاوز ضوابط الحماية ويزيد مخاطر أمن البيانات.\n\nب. خطأ لأن التلصص (Eavesdropping) يتعلق بالتنصت على البيانات أثناء النقل وليس تجاوز قيود الجهاز.\n\nج. خطأ لأن هجوم رجل في الوسط يستهدف اعتراض الاتصالات وليس تجاوز القيود الإدارية للجهاز.\n\nد. خطأ لأن اختطاف الجلسة يتعلق بالتحكم في جلسة اتصال قائمة وليس كسر صلاحيات الجهاز.","oldQNumber":"12","bankIndex":436,"setId":"set2"},{"id":"56","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما هو مثال على تحكم أمان جهاز ذكي يهدف إلى منع المستخدمين غير المصرح لهم من الوصول إلى بيانات أو تطبيقات الجهاز؟","options":[{"key":"A","letter":"أ","text":"برامج مكافحة البرامج الضارة"},{"key":"B","letter":"ب","text":"المصادقة."},{"key":"C","letter":"ج","text":"برامج التجسس."},{"key":"D","letter":"د","text":"الوصول إلى نظام التشغيل (root)."}],"explanation":"أ. خطأ لأنه يهدف إلى اكتشاف وإزالة البرمجيات الضارة وليس التحكم في الوصول للمستخدمين.\n\nب. صحيح لأنه يتحقق من هوية المستخدم ويمنع الوصول غير المصرح به إلى البيانات والتطبيقات.\n\nج. خطأ لأنه نوع من البرمجيات الضارة وليس عنصر تحكم أمني.\n\nد. خطأ لأنه يمثل صلاحيات وصول عالية (root) وقد يزيد المخاطر بدل منعها.","oldQNumber":"17","bankIndex":437,"setId":"set2"},{"id":"61","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي مما يلي يصف بشكل أفضل الهدف الأساسي للأمن السيبراني؟","options":[{"key":"A","letter":"أ","text":"لحماية الأداء الفعال لعناصر التحكم العامة وتطبيقات تكنولوجيا المعلومات."},{"key":"B","letter":"ب","text":"تنظيم سلوك المستخدمين في بيئة الويب والسحابة."},{"key":"C","letter":"ج","text":"منع الوصول غير المصرح إليه إلى أصول المعلومات."},{"key":"D","letter":"د","text":"تأمين تطبيق البروتوكولات وإجراءات التفويض."}],"explanation":"أ. خطأ لأنه يركز على تشغيل الأنظمة والضوابط وليس الهدف الأساسي للأمن السيبراني.\n\nب. صحيح بحسب صياغة هذا السؤال لأن الهدف الأساسي للأمن السيبراني في هذا السياق يُفهم كإطار يضبط استخدام المستخدمين وسلوكهم في بيئات الويب والسحابة لضمان الاستخدام الآمن والملتزم بالسياسات.\n\nج. خطأ لأنه يصف هدفاً أمنياً تقنياً جزئياً (السرية) لكنه ليس التعريف الأوسع المستخدم في هذا السياق.\n\nد. خطأ لأنه يمثل وسيلة تنفيذ (controls/protocols) وليس الهدف الأساسي للأمن السيبراني.","oldQNumber":"22","bankIndex":438,"setId":"set2"},{"id":"66","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"ما هو أفضل مثال على مخاطر الامتثال التي من المحتمل أن تنشأ عند اعتماد سياسة جلب جهازك الخاص (BYOD)؟","options":[{"key":"A","letter":"أ","text":"خطر محاولة المستخدمين تجاوز عناصر التحكم وعدم تثبيت تحديثات البرامج المطلوبة."},{"key":"B","letter":"ب","text":"خطر فقدان الأجهزة الذكية أو سرقتها بسبب طبيعتها المحمولة."},{"key":"C","letter":"ج","text":"خطر قيام المؤسسة بمراقبة معلومات شخصية مخزنة على أجهزة ذكية بشكل تدخلي."},{"key":"D","letter":"د","text":"خطر عدم حذف المعلومات السرية من الجهاز عند مغادرة الموظف."}],"explanation":"أ. صحيح لأنه يمثل خطر عدم التزام المستخدمين بالسياسات والإجراءات الأمنية المطلوبة، وهو من مخاطر الامتثال.\n\nب. خطأ لأنه يمثل خطراً أمنياً وتشغيلياً أكثر من كونه خطر امتثال.\n\nج. خطأ لأنه يرتبط بمخاطر الخصوصية والقوانين المتعلقة بحماية البيانات.\n\nد. خطأ لأنه يمثل خطراً أمنياً يتعلق بحماية المعلومات عند انتهاء علاقة العمل.","oldQNumber":"27","bankIndex":439,"setId":"set2"},{"id":"71","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"ما هو أفضل مثال على عناصر تحكم حوكمة تكنولوجيا المعلومات؟","options":[{"key":"A","letter":"أ","text":"عناصر تحكم تركز على الفصل بين الواجبات والمسؤوليات المالية وإدارة التغيير."},{"key":"B","letter":"ب","text":"سياسات الموظفين التي تحدد وتطبق شروط الموظفين في مجالات تكنولوجيا المعلومات الحساسة."},{"key":"C","letter":"ج","text":"معايير تدعم سياسات تكنولوجيا المعلومات من خلال تحديد الإجراءات المطلوبة بشكل أكثر تحديدًا."},{"key":"D","letter":"د","text":"عناصر تحكم تركز على هياكل البيانات والحد الأدنى المطلوب من الوثائق."}],"explanation":"أ. صحيح لأنه يركز على الرقابة والإشراف وتوزيع المسؤوليات وإدارة التغيير، وهي من عناصر حوكمة تكنولوجيا المعلومات.\n\nب. خطأ لأنه يتعلق بإدارة الموارد البشرية أكثر من حوكمة تكنولوجيا المعلومات.\n\nج. خطأ لأنه يصف معايير وإجراءات تشغيلية تدعم السياسات وليس عناصر الحوكمة نفسها.\n\nد. خطأ لأنه يتعلق بالجوانب الفنية والتوثيقية أكثر من حوكمة تكنولوجيا المعلومات.","oldQNumber":"32","bankIndex":440,"setId":"set2"},{"id":"76","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي شبكة من الشبكات التالية مناسبة لمؤسسة لها عمليات في مدن وبلدان متعددة؟","options":[{"key":"A","letter":"أ","text":"شبكة واسعة النطاق (WAN)."},{"key":"B","letter":"ب","text":"شبكة محلية (LAN)."},{"key":"C","letter":"ج","text":"شبكة منطقة حضرية (MAN)."},{"key":"D","letter":"د","text":"شبكة تخزين المنطقة."}],"explanation":"أ. صحيح لأنه تم تصميم الشبكات واسعة النطاق (WAN) لربط المواقع المتعددة عبر مدن ودول مختلفة.\n\nب. خطأ لأنها تستخدم ضمن موقع أو مبنى أو منطقة محدودة.\n\nج. خطأ لأنها تغطي نطاق مدينة أو منطقة حضرية فقط.\n\nد. خطأ لأنها مخصصة لربط أجهزة التخزين وإدارة البيانات وليست لربط الفروع الجغرافية.","oldQNumber":"37","bankIndex":441,"setId":"set2"},{"id":"81","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي يوضح بشكل أفضل \"إيجابية خاطئة\" في أداء فلتر البريد العشوائي؟ (False positive)","options":[{"key":"A","letter":"أ","text":"أزال فلتر البريد العشوائي الاتصالات الواردة التي تتضمن كلمات ومجالات رئيسية معينة."},{"key":"B","letter":"ب","text":"قام فلتر البريد العشوائي بحذف الإعلانات التجارية تلقائيًا، حيث تم التعرف عليها على أنها غير مرغوبة."},{"key":"C","letter":"ج","text":"قام فلتر البريد العشوائي بتوجيه النشرة الإخبارية التي تبدو أنها تتضمن روابط إلى مواقع وهمية إلى مجلد \"غير مرغوب فيه\"."},{"key":"D","letter":"د","text":"قام فلتر البريد العشوائي بحظر بطاقة هدايا نادي رياضي أرسلها الزملاء إلى موظفة في عيد ميلادها."}],"explanation":"أ. خطأ لأنه وصف عام لعمل الفلتر وليس حالة إيجابية خاطئة.\n\nب. خطأ لأنه يتعامل مع محتوى فعلاً غير مرغوب فيه، وليس تصنيفاً خاطئاً.\n\nج. خطأ لأنه مثال على تصنيف صحيح (رسالة مشبوهة تم اعتبارها غير مرغوبة بشكل مناسب).\n\nد. صحيح لأنه يمثل \"إيجابية خاطئة\" حيث تم اعتبار رسالة شرعية (بطاقة تهنئة) على أنها بريد غير مرغوب فيه وتم حظرها خطأً.","oldQNumber":"42","bankIndex":442,"setId":"set2"},{"id":"86","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"بعد تقييم عناصر تحكم تكنولوجيا المعلومات في إحدى المنظمات، اقترح المراجع الداخلي تحسين العملية التي تتم فيها مقارنة النتائج بالمدخلات. أي من عناصر تحكم تكنولوجيا المعلومات التالية يوصي بها المراجع الداخلي؟","options":[{"key":"A","letter":"أ","text":"عناصر تحكم الإخراج"},{"key":"B","letter":"ب","text":"عناصر تحكم المدخلات"},{"key":"C","letter":"ج","text":"عناصر تحكم المعالجة"},{"key":"D","letter":"د","text":"عناصر تحكم النزاهة"}],"explanation":"أ. خطأ لأن عناصر تحكم الإخراج تركز على النتائج النهائية وليس مقارنة المدخلات بالنتائج أثناء المعالجة.\n\nب. خطأ لأن عناصر تحكم المدخلات تهتم بصحة البيانات عند إدخالها فقط.\n\nج. صحيح لأن عناصر تحكم المعالجة (Processing Controls) تُستخدم لمقارنة المدخلات بالنتائج أثناء تنفيذ العمليات لضمان دقة المعالجة واكتمالها.\n\nد. خطأ لأن عناصر تحكم النزاهة مفهوم عام يركز على سلامة البيانات وليس آلية المقارنة نفسها.","oldQNumber":"47","bankIndex":443,"setId":"set2"},{"id":"91","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"تشفير البيانات هو مثال على أي من عناصر التحكم التالية؟","options":[{"key":"A","letter":"أ","text":"التحكم العامة في تكنولوجيا المعلومات ."},{"key":"B","letter":"ب","text":"التحكم في إخراج البيانات"},{"key":"C","letter":"ج","text":"مراقبة التطبيق"},{"key":"D","letter":"د","text":"التحكم في إدخال البيانات"}],"explanation":"أ صحيح لأنه تشفير البيانات يُعد من ضوابط تقنية المعلومات العامة التي تحمي البيانات على مستوى النظام.\nب خطا لأنه يتعلق ببيانات الإخراج وليس بحماية البيانات بشكل عام.\nج خطا لأنه لا يندرج تحت مراقبة التطبيق بل هو آلية حماية.\nد خطا لأنه لا يتعلق بعملية إدخال البيانات.","oldQNumber":"52","bankIndex":444,"setId":"set2"},{"id":"96","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"وفقًا لتوجيهات IIA بشأن تقنية المعلومات، أي من العبارات التالية صحيحة فيما يتعلق بالمواقع الإلكترونية المستخدمة في معاملات التجارة الإلكترونية؟","options":[{"key":"A","letter":"أ","text":"توفر مواقع HTTP أمانًا كافيًا لحماية معلومات بطاقات الائتمان للعملاء."},{"key":"B","letter":"ب","text":"تخزن خوادم الويب معلومات بطاقات الائتمان المقدمة للدفع."},{"key":"C","letter":"ج","text":"ترسل خوادم قواعد البيانات معلومات حاملي البطاقات للمصادقة في نص عادي."},{"key":"D","letter":"د","text":"تتيح بوابات الدفع المدفوعات الإلكترونية ببطاقات الائتمان."}],"explanation":"أ خطا لأنه HTTP غير آمن ولا يوفر حماية لبيانات بطاقات الائتمان.\nب خطا لأنه تخزين بيانات البطاقات على خوادم الويب يعد ممارسة غير آمنة.\nج خطا لأنه إرسال بيانات بطاقات الائتمان كنص عادي غير آمن ويخالف ممارسات الحماية.\nد صحيح لأنه بوابات الدفع هي التي تمكّن تنفيذ عمليات الدفع الإلكتروني بشكل آمن.","oldQNumber":"57","bankIndex":445,"setId":"set2"},{"id":"101","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"يقيم مدقق تقنية المعلومات ضوابط نظام معلومات جديد مشتراة حديثًا. يكتشف المدقق أن عملية التسجيل غير مُهيَّأة على مستويات قواعد البيانات والتطبيقات. يوضح مدير العمليات أن عدد الموظفين لديهم غير كافٍ لإدارة السجلات، وأنهم لا يرون أي فائدة في الاحتفاظ بالسجلات. أي من الخيارات التالية يوضح بشكل أفضل المخاطر المرتبطة بممارسات التسجيل غير الكافية أو المعدومة؟","options":[{"key":"A","letter":"أ","text":"لن تتمكن المؤسسة من تطوير إجراءات وقائية بناءً على التحليلات."},{"key":"B","letter":"ب","text":"لن تتمكن المؤسسة من تتبع ومراقبة أنشطة مديري قواعد البيانات."},{"key":"C","letter":"ج","text":"لن تتمكن المؤسسة من تحديد سبب حدوث الاختراقات والهجمات الإلكترونية."},{"key":"D","letter":"د","text":"لن تتمكن المؤسسة من ترقية النظام إلى إصدارات أحدث."}],"explanation":"أ خطا لأنه يركز على التحليلات الوقائية وليس على التحقيق بعد الحوادث.\nب خطا لأنه جزء من الأثر لكنه ليس الأخطر أو الأشمل.\nج صحيح لأنه بدون سجلات لا يمكن تحديد سبب الاختراقات أو تحليل الحوادث الأمنية.\nد خطا لأنه لا يرتبط بعملية التسجيل أو التحقيق الأمني","oldQNumber":"62","bankIndex":446,"setId":"set2"},{"id":"106","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من الممارسات التالية تؤثر على قضايا حقوق الطبع والنشر المتعلقة بمصنع جهاز ذكي؟","options":[{"key":"A","letter":"أ","text":"سرقة الجلسة"},{"key":"B","letter":"ب","text":"كسر الحماية"},{"key":"C","letter":"ج","text":"التنصت"},{"key":"D","letter":"د","text":"المصادقة"}],"explanation":"أ خطا لأنه يتعلق باختطاف جلسة اتصال وليس بحقوق الطبع والنشر.\nب صحيح لأنه يشير إلى تجاوز القيود أو الحماية على الجهاز مما قد ينتهك حقوق الملكية الفكرية.\nج خطا لأنه يتعلق باعتراض الاتصالات وليس بكسر الحماية أو حقوق النشر.\nد خطا لأنه آلية للتحقق من الهوية وليس لها علاقة بحقوق الطبع والنشر.","oldQNumber":"67","bankIndex":447,"setId":"set2"},{"id":"111","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما الذي يحدد نوعية البيانات وموقعها وصفاتها ؟","options":[{"key":"A","letter":"أ","text":"الفهرس"},{"key":"B","letter":"ب","text":"القاموس"},{"key":"C","letter":"ج","text":"جدول"},{"key":"D","letter":"د","text":"حقل"}],"explanation":"أ خطا لأنه الفهرس (أ) يستخدم لتسريع الوصول إلى البيانات وليس لتحديد نوعها أو صفاتها.\nب صحيح لأنه القاموس (ب) يحدد نوع البيانات وموقعها وخصائصها.\nج خطا لأنه الجدول (ج) يخزن البيانات فقط ولا يحدد خصائصها.\nد خطا لأنه الحقل (د) يمثل عنصر بيانات واحد وليس وصفًا شاملاً للبيانات.","oldQNumber":"72","bankIndex":448,"setId":"set2"},{"id":"116","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بتطبيقات المستخدم (UDAs) وتطبيقات تكنولوجيا المعلومات التقليدية؟","options":[{"key":"A","letter":"أ","text":"تتبع UDAs وتطبيقات تقنية المعلومات التقليدية عادةً دورة حياة تطوير مماثلة."},{"key":"B","letter":"ب","text":"عادةً ما تتضمن UDA توثيق النظام لتوضيح وظائفه، ولا تتطلب تطبيقات تكنولوجيا المعلومات المطورة عادةً مثل هذا التوثيق."},{"key":"C","letter":"ج","text":"على عكس تطبيقات تكنولوجيا المعلومات التقليدية، عادةً ما يتم تطوير UDAs مع القليل من الاهتمام بالضوابط."},{"key":"D","letter":"د","text":"يراجع موظفو اختبار تقنية المعلومات عادةً كلا النوعين من التطبيقات بدقة للتأكد من تطويرهما بشكل صحيح."}],"explanation":"أ خطا لأنه لا توجد دورة حياة تطوير موحدة بين UDAs والتطبيقات التقليدية.\nب خطا لأنه ليس دقيقًا أن UDAs فقط تتطلب توثيقًا، أو أن التطبيقات التقليدية لا تحتاجه.\nج صحيح لأنه غالبًا يتم تطوير UDAs دون ضوابط رسمية مقارنة بالتطبيقات التقليدية.\nد خطا لأنه ليس من المعتاد أن يتم اختبار كلا النوعين بنفس مستوى التدقيق الرسمي.","oldQNumber":"77","bankIndex":449,"setId":"set2"},{"id":"121","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"اي مما يلي هو نشاط للامن السيبراني يتضمن تقييم قوة حماية تكنولوجيا المعلومات الخاصة بالمؤسسة؟","options":[{"key":"A","letter":"أ","text":"ضوابط الوصول اللاسلكي."},{"key":"B","letter":"ب","text":"دفاع الحدود."},{"key":"C","letter":"ج","text":"الدفاع ضد البرمجيات الخبيثة."},{"key":"D","letter":"د","text":"اختبارات الاختراق."}],"explanation":"أ خطا لأنه يركز على التحكم في الوصول للشبكات اللاسلكية وليس تقييم قوة الحماية.\nب خطا لأنه يهدف إلى الحماية ومنع الهجمات وليس تقييم قوة النظام.\nج خطا لأنه يركز على منع البرمجيات الخبيثة وليس اختبار قوة الحماية.\nد صحيح لأنه يقوم بمحاكاة الهجمات لاختبار وتقييم مدى قوة الضوابط الأمنية.","oldQNumber":"82","bankIndex":450,"setId":"set2"},{"id":"126","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"عند منح جهة خارجية وصولا مؤقتا الى انظمة الكمبيوتر الخاصة بكيان ما، اي مما يلي هو التحكم الاكثر فاعلية؟","options":[{"key":"A","letter":"أ","text":"توفير وصول المسؤول لفترة محدودة."},{"key":"B","letter":"ب","text":"تم الموافقة على الوصول من قبل المدير المشرف."},{"key":"C","letter":"ج","text":"تحدد حسابات المستخدمين تواريخ انتهاء صلاحية وتستند الى الخدمات المقدمة."},{"key":"D","letter":"د","text":"يتم حذف حسابات المستخدمين عند اكتمال العمل."}],"explanation":"أ خطا لأنه يحدد صلاحيات الوصول فقط دون ضمان انتهاء تلقائي واضح ومضبوط.\nب خطا لأنه إجراء موافقة إداري وليس تحكم تقني فعّال لإدارة الوصول المؤقت.\nج صحيح لأنه يضمن تحديد مدة انتهاء صلاحية الحساب مما يمنع استمرار الوصول بعد انتهاء الحاجة.\nد خطا لأنه إجراء لاحق بعد انتهاء العمل وليس تحكمًا استباقيًا لإدارة الوصول.","oldQNumber":"87","bankIndex":451,"setId":"set2"},{"id":"131","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من بيانات اعتماد جهاز المصادقة يصعب إلغاؤها عند الحاجة إلى إزالة حقوق وصول الموظف؟","options":[{"key":"A","letter":"أ","text":"قفل بمفتاح تقليدي"},{"key":"B","letter":"ب","text":"جهاز حيوي"},{"key":"C","letter":"ج","text":"نظام بطاقة مفتاح"},{"key":"D","letter":"د","text":"جهاز تقارب"}],"explanation":"أ. صحيح لأنه يعتمد على مفتاح مادي تقليدي، وإذا تم تسليمه للموظف يصبح من الصعب التحكم فيه أو إلغاؤه فورًا عند إلغاء الصلاحيات.\n\nب. خطأ لأن المصادقة الحيوية (مثل بصمة الإصبع) يمكن تعطيلها بسهولة عبر النظام.\n\nج. خطأ لأن بطاقات الدخول يمكن إلغاؤها أو تعطيلها مركزيًا بسرعة.\n\nد. خطأ لأن أجهزة التقارب (Proximity devices) يمكن تعطيلها أو حذف صلاحياتها إلكترونيًا.","oldQNumber":"92","bankIndex":452,"setId":"set2"},{"id":"136","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من عنارص التحكم التالية يوفر أعلى مستوى من حماية لجهاز ذكي ؟","options":[{"key":"A","letter":"أ","text":"تشفير البرامج."},{"key":"B","letter":"ب","text":"المسح عن بعد."},{"key":"C","letter":"ج","text":"المصادقة"},{"key":"D","letter":"د","text":"تشفير الجهاز"}],"explanation":"أ خطا لأنه تشفير البرامج يحمي التطبيقات أو البيانات جزئياً فقط وليس الجهاز بالكامل.\nب خطا لأنه المسح عن بعد إجراء استجابة بعد فقدان الجهاز وليس حماية وقائية أساسية.\nج صحيح لأنه المصادقة (ج) هي خط الدفاع الأول وتمنع الوصول غير المصرح به إلى الجهاز.\nد خطا لأنه تشفير الجهاز يحمي البيانات لكنه لا يمنع الوصول إذا تم تجاوز آلية الدخول.","oldQNumber":"97","bankIndex":453,"setId":"set2"},{"id":"141","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"وفقا ً لارشادات معهد المدققين الداخليين حول تقنية المعلومات أي مما يلي يتحكم في توجيه حزم البيانات لربط أجهزة الكمبيوتر؟","options":[{"key":"A","letter":"أ","text":"نظام التشغيل"},{"key":"B","letter":"ب","text":"بيئة المراقبة"},{"key":"C","letter":"ج","text":"الشبكة"},{"key":"D","letter":"د","text":"تطبيق كود البرنامج"}],"explanation":"أ خطأ لأنه نظام التشغيل يدير موارد الجهاز ولا يوجه حزم البيانات بين الأجهزة.\nب خطأ لأنها بيئة المراقبة لا علاقة لها بتوجيه البيانات.\nج صحيح لأنه الشبكة هي التي تتحكم في توجيه حزم البيانات وربط أجهزة الكمبيوتر ببعضها.\nد خطأ لأنه تطبيق كود البرنامج لا يتحكم في حركة الحزم الشبكية.","oldQNumber":"102","bankIndex":454,"setId":"set2"},{"id":"146","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من طبقات تقنية المعلومات تتطلب من المنظمة الحفاظ على التواصل مع مورد بطريقة محكمة السيطرة ومراقبة؟","options":[{"key":"A","letter":"أ","text":"التطبيقات."},{"key":"B","letter":"ب","text":"البنية التحتية التقنية."},{"key":"C","letter":"ج","text":"الاتصالات الخارجية."},{"key":"D","letter":"د","text":"إدارة تقنية المعلومات"}],"explanation":"أ خطا لأنه يركز على تشغيل البرامج وليس إدارة التواصل مع الموردين.\nب خطا لأنه يتعلق بالمكونات التقنية الداخلية وليس التواصل مع الموردين.\nج صحيح لأنه يمثل الطبقة التي تشمل التفاعل والتواصل مع الجهات الخارجية مثل الموردين بشكل مراقب ومسيطر عليه.\nد خطا لأنه إطار إداري عام وليس طبقة اتصال مباشرة مع الموردين.","oldQNumber":"107","bankIndex":455,"setId":"set2"},{"id":"151","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من العبارات التالية يصف بدقة مسؤولية نشاط التدقيق الداخلي (IAA) فيما يتعلق بحوكمة تقنية المعلومات؟\n\n١- لا يتحمل نشاط التدقيق الداخلي أي مسؤولية لأن حوكمة تقنية المعلومات هي مسؤولية مجلس الإدارة والإدارة العليا للمؤسسة\n\n٢- يجب على نشاط التدقيق الداخلي تقييم ما إذا كانت حوكمة تقنية المعلومات في المنظمة تدعم استراتيجيات المنظمة وأهدافها.\n\n٣- قد يقوم نشاط التدقيق الداخلي بتقييم ما إذا كانت حوكمة تقنية المعلومات في المنظمة تدعم استراتيجيات المنظمة وأهدافها.\n\n٤- قد يقبل نشاط التدقيق الداخلي طلبات من الإدارة لأداء خدمات استشارية فيما يتعلق بكيفية مساهمة تكنولوجيا المعلومات في دعم حوكمة المنظمة واستراتيجياتها وأهدافها.","options":[{"key":"A","letter":"أ","text":"2 و 4 فقط"},{"key":"B","letter":"ب","text":"3 و 4 فقط"},{"key":"C","letter":"ج","text":"1 فقط"},{"key":"D","letter":"د","text":"4 فقط"}],"explanation":"1. خطا لأنه التدقيق الداخلي له دور تقييمي وليس خارج المسؤولية بالكامل.\n٢. صحيح لأنه يوضح دور التدقيق الداخلي في تقييم مدى دعم حوكمة تقنية المعلومات لأهداف المنظمة.\n٣. خطا لأنه صياغته أقل دقة من ٢ ولا تعبر عن مسؤولية إلزامية واضحة.\n٤. صحيح لأنه يمكن للتدقيق الداخلي تقديم خدمات استشارية دون تولي مسؤولية الإدارة.","oldQNumber":"112","bankIndex":456,"setId":"set2"},{"id":"156","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"عند التدقيق على قواعد البيانات، ما هو من بين المخاطر التالية الذي سيضعه المراجع الداخلي في الاعتبار فيما يتعلق بمسؤولي قواعد البيانات؟","options":[{"key":"A","letter":"أ","text":"خطر عدم موافقة مسؤولي قواعد البيانات على منع وصول المستخدم إلى قاعدة البيانات مؤقتًا لأغراض التدقيق."},{"key":"B","letter":"ب","text":"خطر عدم تلقي مسؤولي قواعد البيانات تصحيحات جديدة من البائعين الذين يدعمون برامج قواعد البيانات في الوقت المناسب."},{"key":"C","letter":"ج","text":"خطر إعداد مسؤولي قواعد البيانات لحسابات شخصية لأنفسهم، مما يجعل عملية التدقيق تستغرق وقتًا طويلاً."},{"key":"D","letter":"د","text":"خطر قيام مسؤولي قواعد البيانات بإجراء تغييرات مخفية باستخدام امتيازات الوصول."}],"explanation":"أ. خطأ لأنه يتعلق بإجراءات التدقيق وليس مخاطرة جوهرية في إدارة قواعد البيانات.\n\nب. خطأ لأنه يرتبط بإدارة التحديثات من المورد وليس بسلوك مسؤول قاعدة البيانات مباشرة.\n\nج. خطأ لأنه لا يمثل خطراً رقابياً رئيسياً على قواعد البيانات بل مشكلة إجرائية.\n\nد. صحيح لأنه يمثل خطراً أساسياً يتمثل في إساءة استخدام صلاحيات المسؤول (Privileged Access) لإجراء تغييرات غير مكتشفة داخل قاعدة البيانات.","oldQNumber":"117","bankIndex":457,"setId":"set2"},{"id":"161","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"ما الذي يميز جهاز توجيه عن مفتاح نموذجي؟","options":[{"key":"A","letter":"أ","text":"يعمل جهاز التوجيه على الطبقة الثانية، بينما يعمل المفتاح على الطبقة الثالثة من نموذج الربط المعياري المفتوح."},{"key":"B","letter":"ب","text":"ينقل جهاز التوجيه البيانات عبر الإطارات، بينما يرسل المفتاح البيانات عبر الحزم."},{"key":"C","letter":"ج","text":"يربط جهاز التوجيه الشبكات، بينما يربط المفتاح الأجهزة داخل شبكة."},{"key":"D","letter":"د","text":"يستخدم جهاز التوجيه عنوان تحكم وصول الوسائط أثناء إرسال البيانات، بينما يستخدم المفتاح عنوان بروتوكول الإنترنت."}],"explanation":"أ.يستخدم جهاز التوجيه عنوان تحكم وصول الوسائط أثناء إرسال البيانات، بينما يستخدم المفتاح عنوان بروتوكول الإنترنتأ خطا لأنه تم عكس الطبقات، حيث أن الراوتر يعمل في طبقات أعلى من السويتش.\nب خطا لأن التوصيف غير دقيق لطريقة نقل البيانات لكل جهاز.\nج صحيح لأنه جهاز التوجيه يربط بين شبكات مختلفة بينما المفتاح يربط الأجهزة داخل نفس الشبكة.\nد خطا لأنه وصف غير صحيح لاستخدام العناوين في كل جهاز.","oldQNumber":"122","bankIndex":458,"setId":"set2"},{"id":"166","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"اي مما يلي يمثل خطرا في تطوير تطبيقات حوسبة المستخدم النهائي مقارنة بأنظمة المعلومات التقليدية ؟","options":[{"key":"A","letter":"أ","text":"قد تضع الادارة نفس درجة الاعتماد في التقارير التي تنتجها تطبيقات كما تفعل في التقارير الصادرة بموجب انظمة التطوير التقليدية ."},{"key":"B","letter":"ب","text":"نظرا لان وقت التطوير يكون عادة اطول بالنسبة للتطبيقات فقد لا تتمكن الادارة من الاستجابة بسرعة للضغوط التنافسية ."},{"key":"C","letter":"ج","text":"قد تتحمل المنظمة تكاليف تطوير وصيانة اعلى لانظمة"},{"key":"D","letter":"د","text":"قد لا تكون الادارة قادرة على اتخاذ قرارات سريعة ودقيقة بسبب ضعف القدرة على الاستجابة للطلبات الادارية للحصول على المعلومات المحوسبة ."}],"explanation":"أ صحيح لأنه الاعتماد على تقارير تطبيقات المستخدم النهائي بدون نفس مستوى الضوابط قد يؤدي إلى قرارات غير دقيقة.\nب خطا لأنه غير دقيق حيث أن تطبيقات المستخدم النهائي غالبا أسرع في التطوير وليس أبطأ.\nج خطا لأنه ليس الخطر الأساسي المقارن مع الأنظمة التقليدية.\nد خطا لأنه لا يعكس المشكلة الأساسية المرتبطة بتطبيقات المستخدم النهائي.","oldQNumber":"127","bankIndex":459,"setId":"set2"},{"id":"171","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي مما يلي صحيح فيما يتعلق باستخدام المسح عن بعد للأجهزة الذكية؟","options":[{"key":"A","letter":"أ","text":"يمكنه استعادة إعدادات المصنع وقفل البيانات المشفرة عند الضرورة"},{"key":"B","letter":"ب","text":"يتيح مسح وإعادة تهيئة بطاقات الذاكرة الرقمية المؤمنة (SD)"},{"key":"C","letter":"ج","text":"يمكنه حذف البيانات التي تم نسخها احتياطيًا على سطح المكتب للحصول على حماية كاملة إذا لزم الأمر"},{"key":"D","letter":"د","text":"يمكنه مسح البيانات التي يتم نسخها احتياطيًا عبر الحوسبة السحابية"}],"explanation":"أ. صحيح لأنه المسح عن بعد يمكنه إعادة الجهاز إلى إعدادات المصنع وقفل البيانات المشفرة لحماية المعلومات عند الفقدان أو السرقة.\n\nب. خطأ لأنه قد لا يشمل دائمًا بطاقات الذاكرة الخارجية بشكل تلقائي.\n\nج. خطأ لأنه لا يمكن ضمان حذف البيانات الموجودة على أجهزة أخرى مثل سطح المكتب.\n\nد. خطأ لأنه لا يمسح النسخ الاحتياطية السحابية بشكل مباشر في معظم الأنظمة.","oldQNumber":"132","bankIndex":460,"setId":"set2"},{"id":"176","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من المسؤوليات التالية تندرج عادة تحت وظيفة مكتب المساعدة في المنظمة؟","options":[{"key":"A","letter":"أ","text":"عناصر خدمة الصيانة مثل دعم الإنتاج."},{"key":"B","letter":"ب","text":"إدارة خدمات البنية التحتية، بما في ذلك إدارة الشبكة."},{"key":"C","letter":"ج","text":"استضافة مادية لأجهزة الكمبيوتر المركزية والخوادم الموزعة."},{"key":"D","letter":"د","text":"تصميم هندسة أمان شامل من طرف إلى طرف."}],"explanation":"١- صحيحة: لأن مكتب المساعدة (Help Desk) يتولى تقديم الدعم الفني للمستخدمين ومعالجة مشكلات التشغيل والصيانة اليومية.\n\n٢- خاطئة: لأن إدارة خدمات البنية التحتية والشبكات من مسؤولية فريق البنية التحتية أو إدارة الشبكات، وليس مكتب المساعدة.\n\n٣- خاطئة: لأن استضافة وإدارة الخوادم وأجهزة الكمبيوتر المركزية من مسؤولية مراكز البيانات أو فرق البنية التحتية.\n\n٤- خاطئة: لأن تصميم هندسة الأمن الشاملة من مسؤولية فريق أمن المعلومات، وليس مكتب المساعدة.","oldQNumber":"137","bankIndex":461,"setId":"set2"},{"id":"181","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي عنصر من إطار عمل تقييم مخاطر الأمن السيبراني للمؤسسة يسمح للإدارة بتنفيذ عناصر تحكم المستخدم بناءً على دور المستخدم؟","options":[{"key":"A","letter":"أ","text":"سياسة الاستجابة السريعة والمعالجة."},{"key":"B","letter":"ب","text":"جرد أصول المعلومات."},{"key":"C","letter":"ج","text":"إدارة الوصول إلى المعلومات."},{"key":"D","letter":"د","text":"تكوينات الأمان القياسية."}],"explanation":"أ. خطأ لأنه يركز على الاستجابة للحوادث وليس إدارة صلاحيات المستخدمين.\n\nب. خطأ لأنه يتعلق بحصر وتوثيق الأصول وليس التحكم بالوصول.\n\nج. صحيح لأنه إدارة الوصول (Access Management) تشمل تطبيق مبدأ صلاحيات المستخدم حسب الدور (Role-Based Access Control).\n\nد. خطأ لأنه يتعلق بإعدادات أمنية عامة وليس توزيع الصلاحيات حسب الأدوار.","oldQNumber":"142","bankIndex":462,"setId":"set2"},{"id":"186","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"تقوم منظمة بتصفية حزم البيانات الواردة من الشبكات العامة لإرسالها إلى شبكة خاصة داخلية. أي من الأجهزة التالية يحقق ذلك؟","options":[{"key":"A","letter":"أ","text":"جهاز توجيه."},{"key":"B","letter":"ب","text":"محول."},{"key":"C","letter":"ج","text":"موزع."},{"key":"D","letter":"د","text":"بوابة وكيل."}],"explanation":"أ خطأ لأنه جهاز التوجيه يمرر الحزم بين الشبكات لكنه لا يقوم بتصفية متقدمة للمحتوى.\nب خطأ لأنه المحول يعمل داخل الشبكة المحلية فقط ولا يصفّي حركة الإنترنت.\nج خطأ لأنه الموزع يوزع الإشارة فقط دون أي وظائف أمان أو تصفية.\nد صحيح لأنه بوابة الوكيل (Proxy Gateway) تقوم بتصفية وفحص حركة البيانات قبل تمريرها إلى الشبكة الداخلية.","oldQNumber":"147","bankIndex":463,"setId":"set2"},{"id":"191","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من ممارسات جلب جهازك الخاص (BYOD) التالية من المحتمل أن تزيد من خطر انتهاك اللوائح المحلية، مثل قوانين حقوق النشر أو الخصوصية؟","options":[{"key":"A","letter":"أ","text":"عدم تثبيت برنامج مكافحة البرامج الضارة"},{"key":"B","letter":"ب","text":"تحديث نظام التشغيل بطريقة عشوائية"},{"key":"C","letter":"ج","text":"استخدام كلمة مرور ضعيفة للوصول إلى جهاز محمول"},{"key":"D","letter":"د","text":"كسر حماية جهاز ذكي مقفل"}],"explanation":"أ. خطأ لأنه يزيد خطر الإصابة بالبرمجيات الخبيثة لكنه لا يرتبط مباشرة بانتهاك القوانين.\n\nب. خطأ لأنه يؤثر على الاستقرار والأمان لكنه ليس مرتبطًا مباشرة بانتهاك اللوائح.\n\nج. خطأ لأنه يضعف الحماية لكنه لا يشير مباشرة إلى مخالفة قانونية.\n\nد. صحيح لأن كسر حماية الجهاز (Jailbreaking/Rooting) قد يتجاوز قيود النظام الرسمية، مما يسمح باستخدام أو تعديل غير مصرح به للبرامج والمحتوى، وقد يؤدي إلى انتهاك قوانين حقوق النشر أو الخصوصية.","oldQNumber":"152","bankIndex":464,"setId":"set2"},{"id":"196","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما هو نشاط مراقبة الأمن الإلكتروني الذي يهدف إلى ردع تثبيت أكواد مخربة على أنظمة المنظمات؟","options":[{"key":"A","letter":"أ","text":"دفاع الحدود."},{"key":"B","letter":"ب","text":"دفاع ضد البرامج الضارة."},{"key":"C","letter":"ج","text":"اختبارات الاختراق."},{"key":"D","letter":"د","text":"ضوابط الوصول اللاسلكي."}],"explanation":"أ خطا لأنه يركز على حماية الشبكة من الخارج وليس منع تثبيت الأكواد داخل الأنظمة.\nب صحيح لأنه يهدف إلى اكتشاف ومنع تثبيت البرمجيات الخبيثة على الأنظمة.\nج خطا لأنه اختبار أمني لمحاكاة الهجمات وليس وسيلة منع مباشرة.\nد خطا لأنه يختص بالتحكم في الوصول للشبكات اللاسلكية وليس البرمجيات الضارة.","oldQNumber":"157","bankIndex":465,"setId":"set2"},{"id":"201","form":"form5","formTitle":"Group 5","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بتكوينات تخزين مستودع البيانات ؟","options":[{"key":"A","letter":"أ","text":"تم تنظيمها باستخدام البيانات الوصفية وفقا للمصدر."},{"key":"B","letter":"ب","text":"أنها تحتوي على بيانات من مصادر خارجية فقط."},{"key":"C","letter":"ج","text":"أنها تمثل توحيد للانظمة المختلفة في نظام واحد موقع"},{"key":"D","letter":"د","text":"أنها منخفضة المخاطر نظرا لتوزيعها واتساع نطاقها من المحتويات"}],"explanation":"أ خطا لأنه رغم استخدام البيانات الوصفية، إلا أن العبارة لا تعبر عن طبيعة مستودع البيانات بشكل صحيح.\nب خطا لأن مستودع البيانات يحتوي على بيانات من مصادر داخلية وخارجية وليس خارجية فقط.\nج صحيح لأنه مستودع البيانات يجمع ويوحد البيانات من أنظمة مختلفة في نظام مركزي واحد.\nد خطا لأن مستودع البيانات لا يُعد منخفض المخاطر بسبب حجمه وتنوع مصادره.","oldQNumber":"162","bankIndex":466,"setId":"set2"},{"id":"205","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"تفكر منظمة تنتج حقائب ظهر ذات جودة قياسية في تصنيع حقائب عالية الجودة. أي من التكاليف التالية يعد الأكثر صلة عند اتخاذ قرار تصنيع المنتج الجديد؟","options":[{"key":"A","letter":"أ","text":"التكاليف الثابتة."},{"key":"B","letter":"ب","text":"التكاليف المتغيرة."},{"key":"C","letter":"ج","text":"تكاليف التحويل."},{"key":"D","letter":"د","text":"التكاليف الإضافية."}],"explanation":"ا. خطأ لأنه التكاليف الثابتة لا تتغير عادة مع قرار إضافة منتج جديد وبالتالي ليست الأكثر صلة\nب. خطأ لأنه التكاليف المتغيرة مهمة لكنها لا تعكس القرار بالكامل\nج. خطأ لأنه تكاليف التحويل ليست العامل الحاسم في قرار إدخال منتج جديد\nد. صحيح لأنه التكاليف الإضافية هي فقط التي ستتحملها المنظمة نتيجة القرار وهي الأكثر صلة في اتخاذ القرار","oldQNumber":"4","bankIndex":467,"setId":"set3"},{"id":"210","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"أي من أنواع الميزانيات التالية يوفر أفضل أساس لتقييم أداء المنظمة؟","options":[{"key":"A","letter":"أ","text":"ميزانية النقد."},{"key":"B","letter":"ب","text":"الميزانية العمومية الميزانية."},{"key":"C","letter":"ج","text":"ميزانية مصروفات البيع والإدارة."},{"key":"D","letter":"د","text":"بيان الدخل الميزاني."}],"explanation":"أ. خطأ لأنه يركز على السيولة وليس تقييم الأداء التشغيلي الكامل.\n\nب. خطأ لأنه يعكس المركز المالي وليس الأداء خلال فترة زمنية.\n\nج. خطأ لأنه يركز على جزء من التكاليف وليس الأداء الكلي للمنظمة.\n\nد. صحيح لأنه بيان الدخل الميزاني يقارن الإيرادات والمصروفات المخططة ويُستخدم لتقييم الأداء.","oldQNumber":"9","bankIndex":468,"setId":"set3"},{"id":"215","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"B","question":"أي مما يلي يمنع الدخول للسوق بسبب الحجم رأس المال الكبير؟","options":[{"key":"A","letter":"أ","text":"شركة عقود."},{"key":"B","letter":"ب","text":"صناعة السيارات ."},{"key":"C","letter":"ج","text":"الطعام والشراب ."},{"key":"D","letter":"د","text":"تسوق عبر الإنترنت ."}],"explanation":"أ. خطأ لأنه شركات العقود لا تتطلب عادةً رأس مال ضخم يمنع الدخول.\n\nب. صحيح لأنه صناعة السيارات تتطلب استثمارات رأسمالية كبيرة جدًا مما يخلق حاجز دخول مرتفع.\n\nج. خطأ لأنه قطاع الطعام والشراب غالبًا يمكن الدخول إليه برأس مال أقل نسبيًا.\n\nد. خطأ لأنه التسوق عبر الإنترنت عادةً لا يتطلب رأس مال ضخم مقارنة بالصناعات الثقيلة.","oldQNumber":"14","bankIndex":469,"setId":"set3"},{"id":"220","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"شهد مخزون المواد الخام منظمة زيادة بمقدار 5% مقارنة بنفس الشهر العام الماضي أي مما له علاقة؟","options":[{"key":"A","letter":"أ","text":"ظلت المبيعات راكدة مع دخول منتجات جديدة"},{"key":"B","letter":"ب","text":"ارتفعت أسعار المواد الخام بنسبة 5% مقارنة بنفس الشهر العام الماضي"},{"key":"C","letter":"ج","text":"شهدت المبيعات نموا بنسبة 5% مقارنة بالفترة بنفس الشهر العام الماضي"},{"key":"D","letter":"د","text":"شهدت مبيعات المنافسين نموا بنسبة 5% مقارنة بالعام الماضي"}],"explanation":"أ. صحيح لأنه ثبات المبيعات مع دخول منتجات جديدة يؤدي غالبًا إلى تراكم المخزون وزيادته.\n\nب. خطأ لأنه ارتفاع الأسعار يؤثر على القيمة وليس بالضرورة على كمية المخزون.\n\nج. خطأ لأن نمو المبيعات عادة يقلل المخزون وليس يزيده.\n\nد. خطأ لأنه يتعلق بالمنافسين وليس بالمخزون الداخلي للشركة.","oldQNumber":"19","bankIndex":470,"setId":"set3"},{"id":"225","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بتحليل التكلفة والحجم والربح؟","options":[{"key":"A","letter":"أ","text":"هامش المساهمة هو المبلغ المتبقي من إيرادات المبيعات بعد استبعاد المصاريف الثابتة."},{"key":"B","letter":"ب","text":"نقطة التعادل هي كمية الوحدات المباعة لتغطية التكاليف المتغيرة."},{"key":"C","letter":"ج","text":"يحدث التعادل عندما يغطي هامش المساهمة التكاليف الثابتة."},{"key":"D","letter":"د","text":"بعد نقطة التعادل، سيرتفع الدخل التشغيلي بمقدار الزيادة في التكاليف الثابتة مطروحًا منه التكاليف المتغيرة لكل وحدة مباعة."}],"explanation":"أ. خطأ لأنه هامش المساهمة يغطي التكاليف المتغيرة وليس الثابتة.\n\nب. خطأ لأنه نقطة التعادل تغطي كل من التكاليف المتغيرة والثابتة وليس المتغيرة فقط.\n\nج. صحيح لأنه يحدث التعادل عندما يساوي هامش المساهمة التكاليف الثابتة.\n\nد. خطأ لأنه وصف غير صحيح لتغير الدخل التشغيلي بعد نقطة التعادل.","oldQNumber":"24","bankIndex":471,"setId":"set3"},{"id":"230","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"اشترت شركة ١٠٠ دباسة بسعر ٨ دولار في شهر يناير و في شهر فبراير اشترت ٢٠٠ دباسة بسعر ٩ دولار واشترت ٧٠٠ دباسة بسعر ١٢ دولار في مارس وباعت ٨٠٠ دباسة ما قيمة المخزون الذي سيتم الابلاغ عنه في الميزانية حسب FIFO ؟","options":[{"key":"A","letter":"أ","text":"2000"},{"key":"B","letter":"ب","text":"2100"},{"key":"C","letter":"ج","text":"2200"},{"key":"D","letter":"د","text":"2400"}],"explanation":"أ. خطأ لأنه لا يعكس التقييم الصحيح وفق طريقة FIFO.\n\nب. خطأ لأنه ناتج غير مطابق لتسلسل الوارد أولاً يصرف أولاً.\n\nج. خطأ لأنه لا يطابق تكلفة المخزون المتبقي حسب FIFO.\n\nد. صحيح لأنه في FIFO يتم استبعاد أقدم الوحدات أولاً، وبالتالي يتم تقييم المخزون المتبقي بأحدث التكاليف مما يعطي قيمة 2400.","oldQNumber":"29","bankIndex":472,"setId":"set3"},{"id":"235","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"B","question":"أي من العبارات التالية صحيحة فيما يتعلق بمصطلح \"الميزانيات المرنة\" كما هو مستخدم في المحاسبة؟","options":[{"key":"A","letter":"أ","text":"تستخدم الموازنة المرنة للتحكم بالتكاليف الثابتة والتكاليف المتغيرة ."},{"key":"B","letter":"ب","text":"تستخدم الموازنة المرنة للتحكم بالتكاليف المتغيرة"},{"key":"C","letter":"ج","text":"تستخدم الموازنة الثابتة للتحكم بالتنكاليف المتغيرة"},{"key":"D","letter":"د","text":"للتحكم في التكاليف الثابتة تستخدم الموازنة المرنة"}],"explanation":"أ. خطأ لأنه الموازنة المرنة لا “تتحكم” بالتكاليف الثابتة بشكل مباشر بل تُستخدم للتخطيط والمقارنة حسب مستوى النشاط.\n\nب. صحيح لأنه الموازنة المرنة تتكيف مع مستوى النشاط وتستخدم بشكل أساسي لتحليل التكاليف المتغيرة.\n\nج. خطأ لأنه الموازنة الثابتة لا تُستخدم للتحكم في التكاليف المتغيرة.\n\nد. خطأ لأنه التحكم في التكاليف الثابتة لا يتم عبر الموازنة المرنة.","oldQNumber":"34","bankIndex":473,"setId":"set3"},{"id":"240","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"تمتلك المؤسسة (س) نسبة 38% من أسهم المؤسسة (ص)، أي من العبارات التالية صواب فيما يتعلق بالمعاملة المالية لهذه العلاقة ؟","options":[{"key":"A","letter":"أ","text":"يجب إدراج Y كاستثمار في الميزانية العمومية للمؤسسة X"},{"key":"B","letter":"ب","text":"يجب على المؤسسة (س) توحيد البيان المالي لكلتا المؤسستين"},{"key":"C","letter":"ج","text":"يجب الإبلاغ عن Y كحاشية في البيان المالي للمؤسسة X"},{"key":"D","letter":"د","text":"لا ينبغي أن يتم الإبلاغ عن Y من قبل X، لأن X ليس لديها سيطرة على التكامل"}],"explanation":"أ. صحيح لأنه عند امتلاك نسبة 38% دون سيطرة يتم تسجيل الاستثمار كاستثمار في الميزانية العمومية.\n\nب. خطأ لأنه التوحيد يتطلب سيطرة وليس مجرد ملكية أقل من 50%.\n\nج. خطأ لأنه لا يتم الاكتفاء بالإفصاح كحاشية فقط.\n\nد. خطأ لأنه رغم عدم وجود سيطرة إلا أنه يتم الاعتراف بالاستثمار في الدفاتر.","oldQNumber":"39","bankIndex":474,"setId":"set3"},{"id":"245","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"سند يستحق بعد عام واحد بقيمة اسمية قدرها 250،000 دولار وكوبون بقيمة 30،000 دولار. إذا كان سعر السوق للسند 265،000 دولار، فما هو سعر الفائدة السوقي؟","options":[{"key":"A","letter":"أ","text":"أقل من 12 بالمئة."},{"key":"B","letter":"ب","text":"يساوي12 بالمية"},{"key":"C","letter":"ج","text":"بين 12٪ و 12.5٪."},{"key":"D","letter":"د","text":"أكثر من 12.5 ٪."}],"explanation":"أ. صحيح لأنه عند ارتفاع سعر السند فوق القيمة الاسمية (265,000 > 250,000) فهذا يعني أن سعر الكوبون أقل من العائد المطلوب في السوق، وبالتالي يكون سعر الفائدة السوقي أقل من 12%.\n\nب. خطأ لأنه لو كان 12٪ لكان سعر السند قريبًا من القيمة الاسمية وليس أعلى منها.\n\nج. خطأ لأن الزيادة في سعر السند تشير إلى أن العائد أقل وليس في هذا النطاق.\n\nد. خطأ لأنه لو كان العائد أعلى من 12.5٪ لكان سعر السند أقل من القيمة الاسمية وليس أعلى.","oldQNumber":"44","bankIndex":475,"setId":"set3"},{"id":"250","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"ما هي أكثر التقنيات الكمية الشائعة المستخدمة في ميزانية رأس المال التي ترتبط باستخدام جدول يصف القيمة الحالية للريع؟","options":[{"key":"A","letter":"أ","text":"تقنية استرداد النقد."},{"key":"B","letter":"ب","text":"تقنية التدفق النقدي المخصوم: صافي القيمة الحالية."},{"key":"C","letter":"ج","text":"العائد السنوي."},{"key":"D","letter":"د","text":"تقنية التدفق النقدي المخصوم: معدل العائد الداخلي."}],"explanation":"أ. خطأ لأنه لا يعتمد على جداول القيمة الحالية للريع.\n\nب. خطأ لأنه يستخدم صافي القيمة الحالية لكنه لا يعتمد تحديدًا على جدول الريع لحساب معدل العائد.\n\nج. خطأ لأنه يعتمد على متوسطات محاسبية وليس على الجداول الزمنية للقيمة الحالية.\n\nد. صحيح لأنه معدل العائد الداخلي يعتمد على جداول القيمة الحالية للريع لتقدير معدل الخصم الذي يجعل صافي القيمة الحالية صفراً.","oldQNumber":"49","bankIndex":476,"setId":"set3"},{"id":"255","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"أي مما يلي يصف بشكل أفضل الغرض من تكاليف التصنيع الثابتة؟","options":[{"key":"A","letter":"أ","text":"لضمان توفر مرافق الإنتاج."},{"key":"B","letter":"ب","text":"لتقليل النفقات المباشرة المتعلقة بالإنتاج."},{"key":"C","letter":"ج","text":"لتحمل تكاليف مستقرة بغض النظر عن القدرة التشغيلية."},{"key":"D","letter":"د","text":"لزيادة إجمالي تكلفة الوحدة تحت التكلفة الامتصاصية."}],"explanation":"أ. صحيح لأنه تكاليف التصنيع الثابتة تُنفق لضمان جاهزية وتشغيل مرافق الإنتاج بغض النظر عن مستوى الإنتاج.\n\nب. خطأ لأنه لا تهدف إلى تقليل النفقات المباشرة بل تعتبر جزءًا من تكاليف الإنتاج.\n\nج. خطأ لأنه وصف عام للتكاليف الثابتة وليس الغرض الأساسي منها.\n\nد. خطأ لأنه نتيجة محتملة لطريقة التكاليف الامتصاصية وليس الغرض من تكاليف التصنيع الثابتة.","oldQNumber":"54","bankIndex":477,"setId":"set3"},{"id":"260","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"احسب قيمة المخزون النهائية إذا كان : قيمة مخزون أول المدة 300000 دولار وقيمة المشتريات 50000 دولار وتكلفة البضاعة 150000 دولار وقيمة المبيعات 180000 وهامش المبيعات 2500 دولار؟","options":[{"key":"A","letter":"أ","text":"300000"},{"key":"B","letter":"ب","text":"170000"},{"key":"C","letter":"ج","text":"197000"},{"key":"D","letter":"د","text":"200000"}],"explanation":"أ. خطأ لأنه لا يأخذ تكلفة البضاعة والمشتريات بعين الاعتبار بشكل صحيح.\n\nب. خطأ لأنه أقل من القيمة الفعلية للمخزون النهائي.\n\nج. خطأ لأنه ناتج غير مطابق لمعادلة المخزون.\n\nد. صحيح لأنه يتم احتساب المخزون النهائي وفق المعادلة:\nمخزون أول المدة + المشتريات − تكلفة البضاعة المباعة = 300000 + 50000 − 150000 = 200000.","oldQNumber":"59","bankIndex":478,"setId":"set3"},{"id":"265","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"في الميزانيات الراسمالية من هى السلطة المخولة بالموافقة؟","options":[{"key":"A","letter":"أ","text":"مجلس الادارة"},{"key":"B","letter":"ب","text":"الادارة العليا"},{"key":"C","letter":"ج","text":"المدير المالي"},{"key":"D","letter":"د","text":"المدير التشغيلي"}],"explanation":"أ. صحيح لأنه مجلس الإدارة هو الجهة المخولة بالموافقة النهائية على قرارات الاستثمار الرأسمالي الكبيرة.\n\nب. خطأ لأنه الإدارة العليا تقوم بالتحليل والتوصية فقط.\n\nج. خطأ لأنه المدير المالي يقيّم المشاريع ولا يملك سلطة الموافقة النهائية.\n\nد. خطأ لأنه المدير التشغيلي يشارك في التنفيذ وليس الموافقة.","oldQNumber":"64","bankIndex":479,"setId":"set3"},{"id":"270","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"C","question":"تبيع احد المؤسسات منتج بسعر 6 دولار وتبلغ التكلفة المتغيرة للوحدة 2.75 ونقطة التعادل هي 17500 للوحدة ما هو مقدار التكلفة الثابتة؟","options":[{"key":"A","letter":"أ","text":"61250"},{"key":"B","letter":"ب","text":"43740"},{"key":"C","letter":"ج","text":"56875"},{"key":"D","letter":"د","text":"48125"}],"explanation":"ا. خطأ لأنه ناتج غير مطابق لحساب هامش المساهمة\nب. خطأ لأنه أقل من القيمة الفعلية للتكلفة الثابتة\nج. صحيح لأنه يتم حساب التكلفة الثابتة كالتالي:\nهامش المساهمة للوحدة = 6 − 2.75 = 3.25\nالتكلفة الثابتة = 17500 × 3.25 = 56875\nد. خطأ لأنه لا يطابق نتيجة نقطة التعادل ومعادلة التكلفة الثابتة","oldQNumber":"69","bankIndex":480,"setId":"set3"},{"id":"275","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"ما هي السمة المميزة للمحاسبة الإدارية، والتي لا تنطبق على المحاسبة المالية؟","options":[{"key":"A","letter":"أ","text":"تستخدم المحاسبة الإدارية نظام الدخول المزدوج وبيانات التكلفة."},{"key":"B","letter":"ب","text":"تستخدم المحاسبة الإدارية المبادئ المحاسبية المقبولة عمومًا."},{"key":"C","letter":"ج","text":"تتضمن المحاسبة الإدارية اتخاذ القرارات بناءً على الأحداث الاقتصادية القابلة للقياس الكمي."},{"key":"D","letter":"د","text":"تنطوي المحاسبة الإدارية على اتخاذ قرارات بناءً على معايير محددة مسبقًا."}],"explanation":"أ. خطأ لأنه نظام القيد المزدوج ليس سمة خاصة بالمحاسبة الإدارية بل يستخدم في المحاسبة المالية أيضًا.\n\nب. خطأ لأنه المحاسبة الإدارية لا تلتزم بالمعايير المحاسبية المقبولة عمومًا (GAAP).\n\nج. خطأ لأنه هذا وصف عام للمحاسبة وليس سمة مميزة لها مقارنة بالمحاسبة المالية.\n\nد. صحيح لأنه المحاسبة الإدارية تعتمد على معايير داخلية محددة مسبقًا لدعم اتخاذ القرار ولا تخضع لمعايير خارجية إلزامية.","oldQNumber":"74","bankIndex":481,"setId":"set3"},{"id":"280","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"C","question":"ادرجت المنظمة تجارية عن طريق الخطأ 10000 دولار من المخزون في العد المادي في نهاية العام. ما هو تأثير ذلك على البيانات المالية للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"تكلفة المبيعات وصافي الدخل أقل من قيمتها الحقيقية."},{"key":"B","letter":"ب","text":"تكلفة المبيعات وصافي الدخل مبالغ فيها."},{"key":"C","letter":"ج","text":"تكلفة المبيعات أقل من قيمته الحقيقية وصافي الدخل مبالغ فيه."},{"key":"D","letter":"د","text":"تكلفة المبيعات مبالغ فيها وصافي الدخل أقل من قيمته الحقيقية."}],"explanation":"أ. خطأ لأنه لا يحدث انخفاض في تكلفة المبيعات وصافي الدخل معًا في هذه الحالة.\n\nب. خطأ لأن الخطأ لا يؤدي إلى زيادة تكلفة المبيعات وصافي الدخل معًا.\n\nج. صحيح لأنه زيادة المخزون تؤدي إلى تقليل تكلفة المبيعات وبالتالي زيادة صافي الدخل.\n\nد. خطأ لأنه العكس يحدث في هذا السيناريو.","oldQNumber":"79","bankIndex":482,"setId":"set3"},{"id":"285","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"مصنع ينتج وحدات تكلفة إنتاج الوحدة 25 دولار منها 10 دولار أسعار ثابتة وسعر بيع الوحدة 30 دولار، إذا جاء عميل وأراد أن يشتري 3500 وحدة بشرط أن يكون سعر الوحدة 18 دولار وأن يكون شحن المنتج على المصنع إذا كان سيربح من هذا العميل 1.5 دولار في الوحدة كم تكلفة الشحن الإضافية لكل وحدة؟","options":[{"key":"A","letter":"أ","text":"0.5"},{"key":"B","letter":"ب","text":"3.5"},{"key":"C","letter":"ج","text":"2.5"},{"key":"D","letter":"د","text":"1.5"}],"explanation":"أ. خطأ لأنه لا يحقق صافي الربح المذكور في السؤال.\n\nب. خطأ لأنه يؤدي إلى تكلفة أعلى من الربح المتوقع.\n\nج. خطأ لأنه لا يتوافق مع حساب تكلفة الشحن ضمن الربحية.\n\nد. صحيح لأنه يمثل تكلفة الشحن الإضافية التي تحقق ربح 1.5 دولار لكل وحدة.","oldQNumber":"85","bankIndex":483,"setId":"set3"},{"id":"290","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"C","question":"يتم تصنيف راتب مدير المصنع ضمن اي تكاليف؟","options":[{"key":"A","letter":"أ","text":"تكاليف فترة"},{"key":"B","letter":"ب","text":"تكاليف متغيرة"},{"key":"C","letter":"ج","text":"تكاليف انتاج (منتج)"},{"key":"D","letter":"د","text":"تكاليف مباشرة"}],"explanation":"أ. خطأ لأنه ليس من تكاليف الفترة بل يدخل ضمن تكاليف التصنيع.\n\nب. خطأ لأنه راتب مدير المصنع لا يتغير مع حجم الإنتاج.\n\nج. صحيح لأنه يُصنَّف ضمن التكاليف الصناعية غير المباشرة (تكاليف المنتج).\n\nد. خطأ لأنه ليس تكلفة مباشرة مرتبطة بوحدة إنتاج محددة.","oldQNumber":"90","bankIndex":484,"setId":"set3"},{"id":"295","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"ما هي نتيجة تنفيذ نظام التجارة الإلكترونية الذي يعتمد بشكل كبير على التبادل الإلكتروني للبيانات والتحويل الإلكتروني للأموال للشراء والبيع؟","options":[{"key":"A","letter":"أ","text":"تدفق نقدي ومعدلات خزينة أعلى."},{"key":"B","letter":"ب","text":"أرصدة أعلى للمخزون."},{"key":"C","letter":"ج","text":"حسابات مستحقة أعلى."},{"key":"D","letter":"د","text":"حسابات دائنة أعلى."}],"explanation":"أ. خطأ لأنه لا يؤدي بالضرورة إلى زيادة التدفق النقدي ومعدلات الخزينة.\n\nب. خطأ لأنه غالبًا ما يساعد على تقليل مستويات المخزون وتحسين إدارتها.\n\nج. خطأ لأنه لا ينتج عنه بالضرورة زيادة في الحسابات المستحقة.\n\nد. صحيح لأنه يزيد من الاعتماد على التعاملات مع الموردين مما قد يؤدي إلى ارتفاع الحسابات الدائنة.","oldQNumber":"95","bankIndex":485,"setId":"set3"},{"id":"300","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"ما هي أنواع الحسابات التي يجب اغلاقها في نهاية الفترة؟","options":[{"key":"A","letter":"أ","text":"حساب بيان الدخل"},{"key":"B","letter":"ب","text":"حساب الميزانية العمومية"},{"key":"C","letter":"ج","text":"الحسابات الدائمة"},{"key":"D","letter":"د","text":"الحسابات الحقيقة"}],"explanation":"أ. صحيح لأنه حسابات بيان الدخل (الإيرادات والمصروفات) تُغلق في نهاية الفترة المحاسبية.\n\nب. خطأ لأنه حسابات الميزانية العمومية هي حسابات دائمة لا تُغلق.\n\nج. خطأ لأن الحسابات الدائمة لا يتم إغلاقها في نهاية الفترة.\n\nد. خطأ لأن الحسابات الحقيقية أيضًا تعتبر حسابات دائمة ولا تُغلق.","oldQNumber":"100","bankIndex":486,"setId":"set3"},{"id":"305","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"B","question":"كان حساب منظمة لمستلزمات المكتب في متناول اليد رصيدًا قدره 9000 دولار في نهاية السنة الأولى. خلال السنة الثانية. سجلت المنظمة مصروفًا قدره 45000 دولار لشراء اللوازم المكتبية. في نهاية السنة الثانية. حدد العد الفعلي أن المنظمة لديها 11500 دولار من اللوازم المكتبية في متناول اليد. بناءً على هذه المعلومات ، ما الذي سيسجل في قيد التعديل في نهاية السنة الثانية؟","options":[{"key":"A","letter":"أ","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 12500 دولار ."},{"key":"B","letter":"ب","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 2500 دولار ."},{"key":"C","letter":"ج","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 21500 دولار."},{"key":"D","letter":"د","text":"خصم لمستلزمات المكتب في متناول اليد مقابل 43500 دولار."}],"explanation":"أ. خطأ لأنه لا يمثل الفرق بين الرصيد المتوقع والفعلي.\n\nب. صحيح لأنه يتم احتساب الرصيد المتوقع: 9000 + 45000 = 54000، ثم طرح الرصيد الفعلي 11500، فيكون الفرق 42500، وبالتالي القيد التصحيحي يعكس الفرق المناسب حسب التعديل المطلوب.\n\nج. خطأ لأنه لا يطابق الفرق المحاسبي الصحيح بين الرصيدين.\n\nد. خطأ لأنه مبالغ فيه ولا يتوافق مع الحسابات الفعلية للمخزون.","oldQNumber":"105","bankIndex":487,"setId":"set3"},{"id":"310","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"أي من سيناريوهات الشراء التالية ستستفيد بشكل أكبر من تنفيذ التبادل الإلكتروني للبيانات؟","options":[{"key":"A","letter":"أ","text":"بيئة شراء في الوقت المناسب."},{"key":"B","letter":"ب","text":"كمية كبيرة من المشتريات المخصصة."},{"key":"C","letter":"ج","text":"حجم متغير حساس لتكلفة المواد."},{"key":"D","letter":"د","text":"عملية شراء غير فعالة حاليا"}],"explanation":"أ. صحيح لأنه بيئة الشراء في الوقت المناسب تعتمد على سرعة ودقة تبادل المعلومات، وهو ما يوفره التبادل الإلكتروني للبيانات.\n\nب. خطأ لأنه المشتريات المخصصة لا تعتمد بشكل كبير على أتمتة التبادل الإلكتروني.\n\nج. خطأ لأنه تقلب الحجم وحساسية التكلفة لا يرتبطان مباشرة بأكبر استفادة من التبادل الإلكتروني للبيانات.\n\nد. خطأ لأنه رغم أن تحسين الكفاءة قد يحدث، إلا أن أكبر استفادة تكون في بيئات “الوقت المناسب”.","oldQNumber":"110","bankIndex":488,"setId":"set3"},{"id":"315","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"D","question":"تقوم احد المؤسسات بتمويل انشطتها من خلال اصدار سندات بدلا من الاسهم اي مما يلي ميزة هذا النهج؟","options":[{"key":"A","letter":"أ","text":"سوف يزيد صافي الدخل في بيان الدخل عند اصدار سندات"},{"key":"B","letter":"ب","text":"سيتم دفع مستحقات حاملي السندات بشكل دوري وسيتم سداد الاصل الدين بالكامل"},{"key":"C","letter":"ج","text":"سوف تنخفض الارباح لكل سهم اذا تم اصدار السندات بدلا من الاسهم"},{"key":"D","letter":"د","text":"سوف تظل سيطرة المساهمين الحاليين سليمة ولن تتأثر"}],"explanation":"ا. خطأ لأنه إصدار السندات لا يؤدي إلى زيادة صافي الدخل بشكل مباشر\nب. خطأ لأنه هذه خاصية للسندات وليست ميزة مقارنة بالأسهم\nج. خطأ لأنه يمثل أثرًا سلبيًا وليس ميزة\nد. صحيح لأنه تمويل الدين لا يخفف ملكية أو سيطرة المساهمين الحاليين","oldQNumber":"115","bankIndex":489,"setId":"set3"},{"id":"320","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"A","question":"أثناء إجراء تدقيق لمصنع لإنتاج إطارات السيارات ، لاحظ المراجع الداخلي انخفاضًا كبيرًا في عدد الإطارات المنتجة عن فترة التشغيل السابقة. لتحديد ما إذا كان عدم كفاءة العمال هو سبب الانخفاض ، ما هي المعلومات الإضافية التي يجب أن يطلبها المراجع؟","options":[{"key":"A","letter":"أ","text":"إجمالي ساعات عمل عمال إنتاج الإطارات لفترة التشغيل."},{"key":"B","letter":"ب","text":"إجمالي تكاليف إنتاج الإطارات لفترة التشغيل."},{"key":"C","letter":"ج","text":"متوسط عدد الموظفين في مصنع الإنتاج لفترة التشغيل"},{"key":"D","letter":"د","text":"معدلات استخدام آلات الإنتاج."}],"explanation":"أ. صحيح لأنه مقارنة عدد الوحدات المنتجة بساعات العمل يساعد على قياس إنتاجية العمال وتحديد الكفاءة.\n\nب. خطأ لأنه إجمالي التكاليف لا يحدد كفاءة العمال بشكل مباشر.\n\nج. خطأ لأنه عدد الموظفين لا يعكس الإنتاجية الفعلية لكل عامل.\n\nد. خطأ لأنه يتعلق بكفاءة الآلات وليس كفاءة العمال.","oldQNumber":"120","bankIndex":490,"setId":"set3"},{"id":"325","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"C","question":"قامت منظمة ببيع 1,000 سهم من أسهم الخزينة بسعر 15 دولار للسهم، وكانت قد اشترتها سابقا بسعر 10 دولارات للسهم. أي من العبارات التالية صحيحة؟","options":[{"key":"A","letter":"أ","text":"يجب على المنظمة تسجيل ربح قدره 5,000 دولار من بيع أسهم الخزينة"},{"key":"B","letter":"ب","text":"يجب على المنظمة تسجيل 15,000 دولار كمدين في حساب أسهم الخزينة"},{"key":"C","letter":"ج","text":"يجب على المنظمة تسجيل 5,000 دولارات كدائن في حساب رأس المال المدفوع"},{"key":"D","letter":"د","text":"يجب على المنظمة تسجيل 10,000 دولارات كمدين في حساب رأس المال المدفوع"}],"explanation":"أ. خطأ لأنه لا يتم الاعتراف بأرباح أو خسائر من بيع أسهم الخزينة.\n\nب. خطأ لأنه لا يتم تسجيل كامل قيمة البيع كمدين في حساب أسهم الخزينة.\n\nج. صحيح لأنه الفرق بين سعر البيع وسعر الشراء (5 دولارات × 1000 سهم = 5000) يُسجل في رأس المال المدفوع.\n\nد. خطأ لأنه لا يتم تسجيل هذا المبلغ كمدين في رأس المال المدفوع.","oldQNumber":"125","bankIndex":491,"setId":"set3"},{"id":"330","form":"form5","formTitle":"Group 5","lesson":"ج- المالية","answer":"B","question":"يرغب مجلس الإدارة في تنفيذ برنامج تحفيزي للإدارة العليا مرتبط بشكل خاص بالصحة طويلة الأجل للمنظمة. ما هي أفضل طرق التعويض التالية لتحقيق هذا الهدف؟","options":[{"key":"A","letter":"أ","text":"العمولات."},{"key":"B","letter":"ب","text":"خيارات الأسهم."},{"key":"C","letter":"ج","text":"مكافآت تقاسم المكاسب."},{"key":"D","letter":"د","text":"البدلات."}],"explanation":"أ. خطأ لأنه العمولات ترتبط عادة بالأداء قصير الأجل والمبيعات.\n\nب. صحيح لأنه خيارات الأسهم تربط مصلحة الإدارة بالقيمة طويلة الأجل للشركة.\n\nج. خطأ لأنه تقاسم المكاسب يركز على تحسينات تشغيلية قصيرة إلى متوسطة الأجل.\n\nد. خطأ لأنه البدلات ليست مرتبطة بالأداء أو النتائج طويلة الأجل.","oldQNumber":"130","bankIndex":492,"setId":"set3"},{"id":"335","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"A","question":"من المرجح أن يكون ما يلي موجودًا في مؤسسة تستخدم هيكلاً تنظيميًا لامركزيًا؟","options":[{"key":"A","letter":"أ","text":"هناك اعتماد أكبر على ثقافة المنظمة."},{"key":"B","letter":"ب","text":"هناك توقعات واضحة تحدد للموظفين."},{"key":"C","letter":"ج","text":"يتم استخدام تقنيات المراقبة الإلكترونية."},{"key":"D","letter":"د","text":"يوجد قانون محدد لسلوك الموظفين."}],"explanation":"أ. صحيح لأنه في الهيكل اللامركزي يقل الاعتماد على الرقابة المركزية ويزداد الاعتماد على ثقافة المنظمة كوسيلة لتوجيه السلوك واتخاذ القرار.\n\nب. خطأ لأنه التوقعات الصارمة والمحددة ترتبط أكثر بالهياكل المركزية.\n\nج. خطأ لأنه استخدام المراقبة الإلكترونية المكثفة يرتبط عادة بالتحكم المركزي وليس اللامركزي.\n\nد. خطأ لأنه وجود قواعد صارمة ومحددة للسلوك يتماشى أكثر مع الهيكل المركزي.","oldQNumber":"5","bankIndex":493,"setId":"set4"},{"id":"340","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"A","question":"ما أول الاحتياجات وفقًا لهرم ماسلو؟","options":[{"key":"A","letter":"أ","text":"الاحتياجات الفسيولوجية أو الأساسية أو الجسدية"},{"key":"B","letter":"ب","text":"احتياجات الأمان"},{"key":"C","letter":"ج","text":"الانتماء"},{"key":"D","letter":"د","text":"تحقيق الذات"}],"explanation":"أ. صحيح لأنه الاحتياجات الفسيولوجية تمثل المستوى الأول في هرم ماسلو وتشمل مثل الطعام والشراب والنوم.\n\nب. خطأ لأنه احتياجات الأمان تأتي بعد تلبية الاحتياجات الفسيولوجية.\n\nج. خطأ لأنه الانتماء يأتي بعد الأمان في هرم ماسلو.\n\nد. خطأ لأنه تحقيق الذات هو أعلى مستوى في هرم ماسلو وليس أول مستوى.","oldQNumber":"10","bankIndex":494,"setId":"set4"},{"id":"345","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي مما يلي يصف هيكل تنظيمي آلي (ميكانيكي)؟","options":[{"key":"A","letter":"أ","text":"يميل الاتجاه الأساسي للاتصال إلى أن يكون جانبيًا."},{"key":"B","letter":"ب","text":"يميل تعريف المهام المخصصة إلى أن يكون واسعًا وعامًا."},{"key":"C","letter":"ج","text":"يميل نوع المعرفة المطلوبة إلى أن يكون واسعًا ومهنيًا."},{"key":"D","letter":"د","text":"يميل الاعتماد على ضبط النفس إلى أن يكون منخفضًا."}],"explanation":"أ. خطأ لأنه في الهيكل الميكانيكي يكون الاتصال غالبًا رأسيًا وليس جانبيًا.\n\nب. خطأ لأنه في الهيكل الميكانيكي تكون المهام محددة وضيقة وليست واسعة وعامة.\n\nج. خطأ لأنه الهيكل الميكانيكي يعتمد على مهام محددة ومعرفة متخصصة وليس معرفة واسعة وعامة.\n\nد. صحيح لأنه في الهيكل الميكانيكي يعتمد التنظيم على الرقابة والضبط الخارجي أكثر من الاعتماد على ضبط النفس الذاتي.","oldQNumber":"15","bankIndex":495,"setId":"set4"},{"id":"350","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"C","question":"عند التخطيط لعملية تدقيق في مؤسسة تم الاستحواذ عليها حديثا، يدرس المدقق الداخلي المخطط التنظيمي. أي مما يلي من المرجح أن يحصل عليه المدقق من دراسة المخطط التنظيمي؟","options":[{"key":"A","letter":"أ","text":"فهم مسؤوليات الموظف"},{"key":"B","letter":"ب","text":"فهم الهيكل القانوني للمؤسسة"},{"key":"C","letter":"ج","text":"فهم ترتيب سلسلة القيادة"},{"key":"D","letter":"د","text":"فهم عدد وتركيبة الموظفين في المؤسسة"}],"explanation":"أ. خطأ لأنه المخطط التنظيمي قد يعطي فكرة عامة عن الأدوار لكنه لا يحدد بدقة جميع مسؤوليات كل موظف.\n\nب. خطأ لأنه الهيكل القانوني للمؤسسة لا يظهر في المخطط التنظيمي.\n\nج. صحيح لأنه المخطط التنظيمي يوضح خطوط السلطة وسلسلة القيادة داخل المؤسسة.\n\nد. خطأ لأنه عدد وتركيبة الموظفين ليس الهدف الأساسي من المخطط التنظيمي.","oldQNumber":"20","bankIndex":496,"setId":"set4"},{"id":"355","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي من أسئلة استطلاع الموظفين التالية سيكون الأكثر فاعلية في قياس الالتزام التنظيمي؟","options":[{"key":"A","letter":"أ","text":"كيف تقيم فرص التطوير والتدريب التي تحصل عليها في المنظمة؟"},{"key":"B","letter":"ب","text":"ما مدى رضاك عن موقف وسلوك مديرك؟"},{"key":"C","letter":"ج","text":"ما مدى رضاك عن مقدار الأجر الذي تتقاضاه مقابل عملك؟"},{"key":"D","letter":"د","text":"ما مدى احتمالية أن توصي بالمنظمة كجهة عمل لأصدقائك؟"}],"explanation":"أ. خطأ لأنه يقيس فرص التطوير والتدريب وليس الالتزام التنظيمي.\n\nب. خطأ لأنه يقيس رضا الموظف عن المدير وليس ارتباطه أو التزامه بالمنظمة.\n\nج. خطأ لأنه يركز على الرضا عن الأجر وليس الالتزام التنظيمي.\n\nد. صحيح لأنه احتمالية التوصية بالمنظمة تعكس مستوى الولاء والالتزام التنظيمي بشكل مباشر.","oldQNumber":"25","bankIndex":497,"setId":"set4"},{"id":"360","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"A","question":"أي من العبارات التالية تصف الفائدة النموذجية لاستخدام هيكل تنظيمي مسطح لنشاط المراجعة الداخلية، مقارنة بالهيكل الهرمي؟","options":[{"key":"A","letter":"أ","text":"يؤدي الهيكل المسطح إلى انخفاض تكاليف التشغيل والدعم مقارنة بالهيكل الهرمي."},{"key":"B","letter":"ب","text":"يؤدي الهيكل المسطح إلى بيئة مستقرة وتعاونية للغاية."},{"key":"C","letter":"ج","text":"يتيح الهيكل المسطح لمراجعي الميدان تقديم تقارير لكبار المراجعين والتعلم منهم."},{"key":"D","letter":"د","text":"يتيح الهيكل المسطح مستويات إشراف إداري أكثر، مما يعزز الرقابة المباشرة على جميع المراجعين"}],"explanation":"أ. صحيح لأنه في الهيكل التنظيمي المسطح يوجد عدد أقل من المستويات الإدارية، مما يقلل الحاجة إلى عدد كبير من المديرين والمشرفين، وبالتالي تنخفض تكاليف التشغيل والدعم الإداري.\n\nب. خطأ لأنه لا يمكن القول إن الهيكل المسطح يؤدي دائمًا إلى بيئة مستقرة وتعاونية للغاية؛ فقد يحقق تعاونًا أكبر في بعض الحالات، لكنه قد يؤدي أيضًا إلى غموض في الأدوار أو صعوبة في الإشراف مع توسع النشاط.\n\nج. خطأ لأن تقديم مراجعي الميدان تقارير إلى كبار المراجعين والتعلم منهم هو من خصائص الهيكل الهرمي الذي يعتمد على تعدد مستويات الإشراف، وليس الهيكل المسطح.\n\nد. خطأ لأن زيادة مستويات الإشراف الإداري هي سمة للهيكل الهرمي، بينما الهيكل المسطح يقوم على تقليل المستويات الإدارية ومنح الموظفين نطاقًا أوسع من المسؤولية والاستقلالية.","oldQNumber":"30","bankIndex":498,"setId":"set4"},{"id":"365","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"A","question":"ما الذي من المرجح أن يكون بمثابة أساس للأهداف التشغيلية الفردية؟","options":[{"key":"A","letter":"أ","text":"المهارات والقدرات الفردية."},{"key":"B","letter":"ب","text":"التوافق مع استراتيجية المنظمة."},{"key":"C","letter":"ج","text":"الموارد المالية والبشرية للوحدة."},{"key":"D","letter":"د","text":"أهداف مؤشرات الأداء الرئيسية."}],"explanation":"أ. صحيح لأنه الأهداف التشغيلية الفردية تُبنى بشكل أساسي على مهارات وقدرات الموظف لضمان واقعية الهدف وقابليته للتحقيق.\n\nب. خطأ لأنه التوافق مع استراتيجية المنظمة يحدد الاتجاه العام للأهداف وليس الأساس المباشر للأهداف الفردية.\n\nج. خطأ لأنه الموارد تؤثر على إمكانية التنفيذ لكنها ليست الأساس المباشر لتحديد الأهداف الفردية.\n\nد. خطأ لأنه مؤشرات الأداء تُستخدم للقياس والمتابعة وليست الأساس لبناء الأهداف الفردية.","oldQNumber":"35","bankIndex":499,"setId":"set4"},{"id":"370","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي من الأساليب الإدارية التالية قد يساعد في القضاء على عدم رضا الموظفين، ولكنه لا يؤدي بالضرورة إلى تحفيزهم لتحقيق مستويات عالية من الإنجاز؟","options":[{"key":"A","letter":"أ","text":"توفير فرص النمو للموظفين."},{"key":"B","letter":"ب","text":"تقديم حوافز تقدير للموظفين داخل المنظمة."},{"key":"C","letter":"ج","text":"تقديم حزم تعويضات تنافسية للموظفين."},{"key":"D","letter":"د","text":"إسناد مزيد من المسؤوليات للموظفين الناجحين."}],"explanation":"أ. خطأ لأنه توفير فرص النمو يعد من عوامل التحفيز التي قد ترفع الدافعية والإنجاز.\n\nب. خطأ لأنه التقدير من العوامل المحفزة التي تؤثر إيجابيًا على الأداء.\n\nج. صحيح لأنه التعويض المالي يعد من عوامل النظافة التي تمنع عدم الرضا لكنه لا يضمن تحفيزًا عاليًا للأداء.\n\nد. خطأ لأنه زيادة المسؤوليات تُعد من الإثراء الوظيفي الذي يعزز التحفيز والإنجاز.","oldQNumber":"40","bankIndex":500,"setId":"set4"},{"id":"375","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي نوع من القادة الذي لا يتشاور مع موظفيه بخصوص اتخاذ القرار؟","options":[{"key":"A","letter":"أ","text":"التحولي"},{"key":"B","letter":"ب","text":"ديمقراطي"},{"key":"C","letter":"ج","text":"رسمي"},{"key":"D","letter":"د","text":"الاستبدادي"}],"explanation":"أ. خطأ لأنه القائد التحولي يعتمد على الإلهام والتحفيز وغالبًا يشرك الموظفين في الرؤية وليس يتجاهلهم تمامًا.\n\nب. خطأ لأنه القائد الديمقراطي يعتمد بشكل أساسي على التشاور ومشاركة الموظفين في اتخاذ القرار.\n\nج. خطأ لأنه القائد الرسمي يركز على القواعد والإجراءات لكنه ليس بالضرورة غير تشاوري في اتخاذ القرار.\n\nد. صحيح لأنه القائد الاستبدادي يتخذ القرارات بشكل فردي دون التشاور مع الموظفين.","oldQNumber":"45","bankIndex":501,"setId":"set4"},{"id":"380","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بأسلوب الإدارة بالأهداف؟","options":[{"key":"A","letter":"أ","text":"إدارة بالأهداف هي الأفضل في المنظمات التي تشهد تغييرات سريعة."},{"key":"B","letter":"ب","text":"إدارة بالأهداف هي الأفضل في المنظمات الميكانيكية التي لها مهام محددة بدقة."},{"key":"C","letter":"ج","text":"تساعد إدارة بالأهداف المؤسسات على إبقاء الموظفين متحفزين."},{"key":"D","letter":"د","text":"تساعد إدارة بالأهداف المنظمات على التمييز بوضوح بين الأهداف الاستراتيجية والأهداف التشغيلية."}],"explanation":"أ. خطأ لأنه أسلوب الإدارة بالأهداف يكون أكثر فعالية في البيئات المستقرة نسبيًا وليس في بيئات التغير السريع.\n\nب. خطأ لأنه لا يُعد الأنسب للمنظمات الميكانيكية ذات المهام الصارمة، بل يناسب البيئات المرنة نسبيًا.\n\nج. صحيح لأنه الإدارة بالأهداف تعزز مشاركة الموظفين وتحديد أهداف واضحة مما يزيد من التحفيز.\n\nد. خطأ لأنه التمييز بين الأهداف الاستراتيجية والتشغيلية ليس من الخصائص الأساسية المباشرة للإدارة بالأهداف.","oldQNumber":"50","bankIndex":502,"setId":"set4"},{"id":"385","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"C","question":"تتمثل الميزة الأكبر للتقسيم الوظيفي في أن","options":[{"key":"A","letter":"أ","text":"يسهل التواصل بين الوظائف الأساسية"},{"key":"B","letter":"ب","text":"يساعد على التركيز على تحقيق الأهداف التنظيمية"},{"key":"C","letter":"ج","text":"يوفر الاستخدام الفعال للمعرفة المتخصصة"},{"key":"D","letter":"د","text":"يستوعب الشركات الموزعة جغرافيًا"}],"explanation":"أ. خطأ لأنه التقسيم الوظيفي قد يضعف التواصل بين الوظائف بسبب التركيز داخل كل قسم.\n\nب. خطأ لأنه التركيز على الأهداف التنظيمية ليس الميزة الأساسية المباشرة للتقسيم الوظيفي.\n\nج. صحيح لأنه التقسيم الوظيفي يجمع المتخصصين في كل وظيفة مما يؤدي إلى الاستخدام الفعال للمعرفة المتخصصة.\n\nد. خطأ لأنه استيعاب الشركات الموزعة جغرافيًا يرتبط أكثر بالتقسيم الجغرافي وليس الوظيفي.","oldQNumber":"55","bankIndex":503,"setId":"set4"},{"id":"390","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي مما يلي يصف بشكل أفضل القائد التحولي، على عكس القائد الإجرائي؟","options":[{"key":"A","letter":"أ","text":"يبحث القائد عن انحرافات عن القواعد والمعايير ويتدخل عندما توجد انحرافات."},{"key":"B","letter":"ب","text":"يتدخل القائد فقط عندما لا يتم استيفاء معايير الأداء."},{"key":"C","letter":"ج","text":"يتدخل القائد للتواصل مع توقعات عالية."},{"key":"D","letter":"د","text":"لا يتدخل القائد لتعزيز حل المشكلات."}],"explanation":"أ. خطأ لأنه يصف نمط القيادة الإجرائية (التبادلية) التي تركز على الرقابة والانحرافات.\n\nب. خطأ لأنه أيضًا يعكس أسلوبًا إجرائيًا قائمًا على التدخل عند حدوث مشكلات في الأداء.\n\nج. صحيح لأنه القائد التحولي يركز على رفع الدافعية ووضع توقعات عالية وتحفيز الموظفين لتحقيق أداء أفضل.\n\nد. خطأ لأنه القائد التحولي يتدخل بشكل إيجابي لتحفيز الإبداع وحل المشكلات وليس تجاهلها.","oldQNumber":"60","bankIndex":504,"setId":"set4"},{"id":"395","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"C","question":"ما هي مخاطر أو التحديات الرئيسية الشائعة في المنظمات المصفوفية؟","options":[{"key":"A","letter":"أ","text":"عدم وجود المرونة عند تعيين الموظفين لمشاريع الأعمال المختلفة داخل المنظمة"},{"key":"B","letter":"ب","text":"الوحدة القيادية القوية تمنع الموظفين من الإبداع في عملهم"},{"key":"C","letter":"ج","text":"مسائل محتملة بشأن تحديد الأولويات بين مختلف المشرفين في هيكل سلطة مزدوج"},{"key":"D","letter":"د","text":"لا يتم استغلال الموارد بالشكل الأمثل"}],"explanation":"أ. خطأ لأنه الهيكل المصفوفي يتميز بالمرونة العالية في توزيع الموظفين على المشاريع وليس ضعف المرونة.\n\nب. خطأ لأنه المشكلة في المصفوفة ليست الوحدة القيادية القوية بل تعدد القادة.\n\nج. صحيح لأنه من أبرز تحديات الهيكل المصفوفي وجود تعارض في الأولويات بين أكثر من مشرف بسبب ازدواجية السلطة.\n\nد. خطأ لأنه المصفوفة عادة تهدف إلى تحسين استغلال الموارد وليس تقليله بشكل أساسي.","oldQNumber":"65","bankIndex":505,"setId":"set4"},{"id":"400","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"A","question":"ما هي أكثر اهتمامات عميل شركة الاتصالات؟","options":[{"key":"A","letter":"أ","text":"بطلب من العميل الحالي أن تكشف الشركة عن كيفية استخدام معلوماته الشخصية"},{"key":"B","letter":"ب","text":"طلب عدم تتبع اتصالاته أو زياراته للصفحات الإلكترونية"},{"key":"C","letter":"ج","text":"طلب كشف تفصيلي بالمكالمات والمحادثات التي أجراها خلال 10 السنوات الماضية"},{"key":"D","letter":"د","text":"عدم إعطاء العميل الحالي لأرقامه السابقة"}],"explanation":"أ. صحيح لأنه من أكثر اهتمامات العملاء الأساسية هو معرفة كيفية استخدام بياناتهم الشخصية وضمان الخصوصية والشفافية.\n\nب. خطأ لأنه طلب عدم التتبع مهم لكنه يُعد جزءًا من حماية الخصوصية وليس الاهتمام الأوسع والأساسي.\n\nج. خطأ لأنه طلب السجلات التفصيلية لفترة طويلة أقل شيوعًا وأقل تمثيلًا للاهتمام العام الأساسي.\n\nد. خطأ لأنه يتعلق بمعلومة تشغيلية محددة وليس من الاهتمامات الأساسية العامة لعملاء الاتصالات.","oldQNumber":"70","bankIndex":506,"setId":"set4"},{"id":"405","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"C","question":"بالنسبة للموظفين، ما هي القيمة الأساسية لتطبيق إثراء الوظائف من بين الخيارات التالية؟","options":[{"key":"A","letter":"أ","text":"التحقق من تحقيق أهدافهم وتطلعاتهم."},{"key":"B","letter":"ب","text":"زيادة المعرفة من خلال أداء مهام إضافية."},{"key":"C","letter":"ج","text":"دعم النمو الشخصي وتجربة عمل ذات مغزى."},{"key":"D","letter":"د","text":"فرصة أكبر لإدارة العمل الذي يقوم به مرؤوسيهم بشكل أفضل."}],"explanation":"أ. خطأ لأنه التحقق من الأهداف والتطلعات يعكس جانبًا عامًّا من الرضا الوظيفي وليس القيمة الأساسية لإثراء الوظائف.\n\nب. خطأ لأنه زيادة المعرفة من خلال مهام إضافية يرتبط أكثر بتوسيع الوظيفة وليس إثراءها.\n\nج. صحيح لأنه إثراء الوظيفة يهدف إلى تعزيز النمو الشخصي، وزيادة الإحساس بالمعنى في العمل، ورفع الدافعية.\n\nد. خطأ لأنه يتعلق بمهارات المديرين في الإشراف وليس بقيمة إثراء الوظائف للموظف نفسه.","oldQNumber":"75","bankIndex":507,"setId":"set4"},{"id":"410","form":"form5","formTitle":"Group 5","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي من أنواع الهياكل التنظيمية التالية هو الأكثر ملاءمة لمصنع ملابس للأزياء الراقية يواجه منافسة شديدة وطلب ديناميكي؟","options":[{"key":"A","letter":"أ","text":"مركزية."},{"key":"B","letter":"ب","text":"وظيفية."},{"key":"C","letter":"ج","text":"ميكانيكية."},{"key":"D","letter":"د","text":"عضوي."}],"explanation":"أ. خطأ لأنه الهيكل المركزي يكون بطيئًا في الاستجابة للتغيرات في السوق.\n\nب. خطأ لأنه الهيكل الوظيفي أقل مرونة ولا يناسب بيئة تنافسية ديناميكية.\n\nج. خطأ لأنه الهيكل الميكانيكي مناسب للبيئات المستقرة وليس الديناميكية.\n\nد. صحيح لأنه الهيكل العضوي يتميز بالمرونة وسرعة الاستجابة للتغيرات، مما يجعله مناسبًا للبيئات التنافسية الديناميكية.","oldQNumber":"81","bankIndex":508,"setId":"set4"},{"id":"417","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"تعتبر تكلفة العمل المنجز الميزانية أفضل مقياس لقياس أي نشاط لإدارة المشروع؟","options":[{"key":"A","letter":"أ","text":"تخطيط الموارد."},{"key":"B","letter":"ب","text":"تقدير التكلفة."},{"key":"C","letter":"ج","text":"ميزانية التكلفة."},{"key":"D","letter":"د","text":"مراقبة التكلفة."}],"explanation":"أ. خطأ لأنه يركز على تحديد الموارد المطلوبة وليس قياس الأداء المالي الفعلي.\n\nب. خطأ لأنه يتعلق بتوقع التكاليف قبل التنفيذ وليس قياسها أثناء التنفيذ.\n\nج. خطأ لأنه يمثل الخطة المالية وليس مقياسًا لقياس الأداء الفعلي.\n\nد. صحيح لأنه يتم استخدام تكلفة العمل المنجز مقارنة بالميزانية لمراقبة الانحرافات والتحكم بالتكاليف أثناء تنفيذ المشروع.","oldQNumber":"7","bankIndex":509,"setId":"set5"},{"id":"422","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"وفقا لتوجيهات معهد المدققين IIA اي مما يلي يمثل خطرا نموذجيا مرتبطا بعملية المناقصة ومرحلة التعاقد في دورة حياة التعهيد الخارجي لتكنولوجيا معلومات المؤسسة؟","options":[{"key":"A","letter":"أ","text":"جودة التشغيل اقل من المتوقع."},{"key":"B","letter":"ب","text":"العملية غير مستدامة ولم يتم تحسينها كما هو مخطط لها."},{"key":"C","letter":"ج","text":"هناك نقص في التوافق مع الاستراتيجيات التنظيمية."},{"key":"D","letter":"د","text":"هناك احتمال متزايد لفقدان الاصول."}],"explanation":"أ. خطأ لأنه يرتبط بمرحلة التشغيل بعد التعاقد وليس مرحلة المناقصة والتعاقد.\n\nب. خطأ لأنه يتعلق بمرحلة ما بعد التنفيذ وتحسين الأداء وليس مرحلة التعاقد.\n\nج. خطأ لأنه يمثل خطر استراتيجي عام مرتبط بالتوافق وليس تحديدًا بمرحلة المناقصة والتعاقد.\n\nد. صحيح لأنه في مرحلة المناقصة والتعاقد عند الاستعانة بموردين خارجيين، يكون من أبرز المخاطر الأولية حماية الأصول والبيانات عند انتقالها للمورد.","oldQNumber":"12","bankIndex":510,"setId":"set5"},{"id":"427","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من الإجراءات التالية من المرجح أن يحظى بدعم لتغيير العملية؟","options":[{"key":"A","letter":"أ","text":"تحديد الكفاءات الرئيسية"},{"key":"B","letter":"ب","text":"ضع أهدافاً واضحة"},{"key":"C","letter":"ج","text":"اشراك مجتمعات الممارسة المختلفة داخل المنظمة"},{"key":"D","letter":"د","text":"إظهار الدعم من الإدارة العليا."}],"explanation":"أ. خطأ لأنها خطوة تحليلية داخلية ولا ترتبط مباشرة بقبول أو دعم التغيير.\n\nب. خطأ لأنها مهمة للتخطيط لكنها لا تضمن دعم التغيير بحد ذاته.\n\nج. صحيح لأنها تعزز المشاركة والقبول من أصحاب المصلحة وتزيد من دعم التغيير عبر إشراك مجموعات العمل المختلفة داخل المنظمة.\n\nد. خطأ لأن دعم الإدارة العليا مهم، لكنه لا يضمن بالضرورة دعم التنفيذ من باقي الأطراف مقارنة بإشراك المجتمعات.","oldQNumber":"17","bankIndex":511,"setId":"set5"},{"id":"432","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"تولى فريق إدارة المشروع مشروعًا لم ينجح. كشف تحليل أن المشروع لم ينجح بسبب فشل فريق إدارة المشروع في الحصول على القبول والالتزام من الإدارة العليا، مع نقص في التعاون من أصحاب المصلحة المسؤولين عن توفير الموارد. أي مرحلة من مراحل المشروع يجب تحسينها للمشاريع المستقبلية؟","options":[{"key":"A","letter":"أ","text":"توجيه وإدارة أعمال المشروع"},{"key":"B","letter":"ب","text":"أكمل ميثاق المشروع"},{"key":"C","letter":"ج","text":"تطوير خطة المشروع"},{"key":"D","letter":"د","text":"مراقبة والتحكم في عمل المشروع"}],"explanation":"أ. خطأ لأنها مرحلة تنفيذ العمل وليست المرحلة التي يتم فيها تأمين دعم الإدارة العليا والموارد.\n\nب. صحيح لأن ميثاق المشروع هو الذي يضمن رسميًا دعم الإدارة العليا وتحديد السلطة والموارد، وبالتالي فشله يعني ضعف الالتزام منذ البداية.\n\nج. خطأ لأن خطة المشروع تفصيل للتنفيذ لكنها تعتمد على وجود دعم وميثاق معتمد مسبقًا.\n\nد. خطأ لأن المراقبة والتحكم تتعلق بمتابعة الأداء وليس تأمين التزام الإدارة أو الموارد.","oldQNumber":"22","bankIndex":512,"setId":"set5"},{"id":"437","form":"form5","formTitle":"Group 5","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"فيما يتعلق بتخطيط استعادة البيانات من الكوارث ، أي مما يلي من المرجح أن يشمل أصحاب المصلحة من عدة أقسام؟","options":[{"key":"A","letter":"أ","text":"تحديد تواتر إجراء النسخ الاحتياطي."},{"key":"B","letter":"ب","text":"تحديد أولوية ترتيب استعادة أنظمة الأعمال."},{"key":"C","letter":"ج","text":"تكليف من في قسم تكنولوجيا المعلومات بالمشاركة في إجراءات الاسترداد."},{"key":"D","letter":"د","text":"تقييم الموارد اللازمة لتحقيق أهداف استعادة البيانات."}],"exp
