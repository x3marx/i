إلى أجل غير مسمى."},{"key":"C","letter":"ج","text":"يحتفظ العملاء بحق رفض مشاركة المعلومات الشخصية مع أطراف ثالثة"},{"key":"D","letter":"د","text":"تقوم المنظمة بإجراء صيانة دورية على المعلومات الشخصية للعملاء."}],"explanation":"أ خطا لأنه يتماشى مع مبادئ الخصوصية التي تمنح المستخدم حق الوصول والتحديث.\nب صحيح لأنه الاحتفاظ بالبيانات إلى أجل غير مسمى يخالف مبدأ تقليل مدة الاحتفاظ بالمعلومات.\nج خطا لأنه يدعم حقوق الخصوصية وليس انتهاكها.\nد خطا لأنه إجراء إداري طبيعي لحماية البيانات وليس انتهاكًا للخصوصية.","oldQNumber":"71","bankIndex":342,"setId":"set2"},{"id":"115","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"يستخدم الموظف في كثير من الأحيان جهازًا ذكيًا شخصيًا لإرسال واستقبال رسائل البريد الإلكتروني المتعلقة بالعمل، أي من عناصر التحكم التالية ستكون أكثر فعالية للتخفيف من المخاطر الأمنية المتعلقة بعمليات الإرسال هذه ؟","options":[{"key":"A","letter":"أ","text":"تشفير الأجهزة"},{"key":"B","letter":"ب","text":"تشفير البرمجيات"},{"key":"C","letter":"ج","text":"تشفير البيانات"},{"key":"D","letter":"د","text":"المصادقة"}],"explanation":"أ خطا لأنه تشفير الجهاز يحمي البيانات المخزنة وليس أثناء الإرسال.\nب خطا لأنه تشفير البرمجيات ليس تحكمًا مباشرًا لحماية البريد أثناء النقل.\nج صحيح لأنه تشفير البيانات يحمي الرسائل أثناء الإرسال ويمنع قراءتها من غير المصرح لهم.\nد خطا لأنه المصادقة تتحقق من هوية المستخدم ولا تحمي محتوى الرسائل أثناء الإرسال.","oldQNumber":"76","bankIndex":343,"setId":"set2"},{"id":"120","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ماذا يجب على مراقبي مدققي البرامج أن يفعلوا عند الإبلاغ عن نتائج المراجعة الداخلية المتعلقة بتخطيط موارد المؤسسة على مستوى المؤسسة؟","options":[{"key":"A","letter":"أ","text":"صياغة تقارير مراجعة منفصلة لإدارة الأعمال وتكنولوجيا المعلومات."},{"key":"B","letter":"ب","text":"ربط نتائج مراجعة تكنولوجيا المعلومات بقضايا الأعمال."},{"key":"C","letter":"ج","text":"تضمين تفاصيل تقنية لدعم مشكلات تكنولوجيا المعلومات."},{"key":"D","letter":"د","text":"تضمين رأي حول دقة واكتمال التقارير المالية."}],"explanation":"أ. خطأ لأن التقارير يجب أن تكون متكاملة وليست منفصلة بين الأعمال وتكنولوجيا المعلومات.\n\nب. صحيح لأن أفضل ممارسة في مراجعات ERP هي ربط نتائج تكنولوجيا المعلومات بتأثيرها على أهداف وقضايا الأعمال حتى تكون مفهومة للإدارة.\n\nج. خطأ لأن التفاصيل التقنية ليست الهدف الأساسي للتقرير وقد تربك أصحاب القرار.\n\nد. خطأ لأن هذا يتعلق بالتدقيق المالي وليس هدف مراجعات ERP على مستوى المؤسسة.","oldQNumber":"81","bankIndex":344,"setId":"set2"},{"id":"125","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"وفقًا لتوجيهات IIA الخاصة بتقنية المعلومات، ما هي الاستراتيجيات التالية التي ستوفر تحكمًا فعليًا في الوصول إلى نظام نقاط البيع الآلي؟","options":[{"key":"A","letter":"أ","text":"تثبيت وتحديث برامج مكافحة الفيروسات."},{"key":"B","letter":"ب","text":"تطبيق تقنيات تشفير البيانات."},{"key":"C","letter":"ج","text":"تعيين توفر البيانات حسب حاجة المستخدم."},{"key":"D","letter":"د","text":"ترقية تكوين جدار الحماية"}],"explanation":"أ خطا لأنه يركز على الحماية من البرمجيات الضارة وليس التحكم في الوصول.\nب خطا لأنه يحمي سرية البيانات لكنه لا يتحكم في صلاحيات الوصول.\nج صحيح لأنه يطبق مبدأ أقل صلاحية ويحدد الوصول حسب الحاجة.\nد خطا لأنه يتعلق بحماية الشبكة وليس تحديد صلاحيات الوصول للمستخدمين.","oldQNumber":"86","bankIndex":345,"setId":"set2"},{"id":"130","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من الأنشطة المتعلقة بتكنولوجيا المعلومات يتم تنفيذها بشكل أكثر شيوعًا من قبل خط الدفاع الثاني؟","options":[{"key":"A","letter":"أ","text":"منع حركة المرور غير المصرح بها."},{"key":"B","letter":"ب","text":"تشفير البيانات."},{"key":"C","letter":"ج","text":"مراجعة نتائج اختبار استعادة الطوارئ."},{"key":"D","letter":"د","text":"تقديم تقييم مستقل لأمن تكنولوجيا المعلومات."}],"explanation":"أ. خطأ لأنه نشاط تنفيذي تشغيلي يخص خط الدفاع الأول أو فرق الشبكات.\n\nب. خطأ لأنه إجراء تقني يتم تنفيذه ضمن الضوابط التشغيلية وليس من خط الدفاع الثاني.\n\nج. صحيح لأنه خط الدفاع الثاني (مثل إدارة المخاطر والامتثال) يقوم بمراجعة نتائج اختبارات استمرارية الأعمال واستعادة الطوارئ للتأكد من فعالية الضوابط.\n\nد. خطأ لأن تقديم التقييم المستقل هو دور خط الدفاع الثالث (التدقيق الداخلي).","oldQNumber":"91","bankIndex":346,"setId":"set2"},{"id":"135","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"اي مما يحتلج لتشفير عند نقل البيانات من شبكة داخلية الى خارجية؟","options":[{"key":"A","letter":"أ","text":"المحول"},{"key":"B","letter":"ب","text":"الموجه"},{"key":"C","letter":"ج","text":"الشبكة"},{"key":"D","letter":"د","text":"خادم الوكيل او الوسيط"}],"explanation":"أ خطا لأنه المحول (أ) يعمل داخل الشبكة المحلية ولا يوفر تشفير لنقل البيانات خارجها.\nب خطا لأنه الموجه (ب) يوجه الحزم بين الشبكات لكنه لا يوفر التشفير بحد ذاته.\nج خطا لأنه الشبكة (ج) ليست جهاز أو عنصر مسؤول عن التشفير.\nد صحيح لأنه خادم الوكيل أو الوسيط (د) يمكنه تطبيق التشفير وحماية البيانات أثناء انتقالها بين الشبكة الداخلية والخارجية.","oldQNumber":"96","bankIndex":347,"setId":"set2"},{"id":"140","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من العبارات التالية صحيحة فيما يتعلق بقاموس البيانات؟","options":[{"key":"A","letter":"أ","text":"يتضمن قاموس البيانات جداول النظام وملفات برامج قاعدة البيانات."},{"key":"B","letter":"ب","text":"يصف قاموس البيانات محتوى المعلومات المخزنة في قاعدة البيانات."},{"key":"C","letter":"ج","text":"يحدد قاموس البيانات كائنات مثل المستخدمين والأذونات والمجموعات."},{"key":"D","letter":"د","text":"يتضمن قاموس البيانات النسخ الاحتياطي للنظام ومفاتيح التشفير."}],"explanation":"أ خطا لأنه قاموس البيانات لا يحتوي على ملفات البرامج أو جداول النظام كوظيفة أساسية.\nب صحيح لأنه يقوم بوصف هيكل ومحتوى البيانات المخزنة في قاعدة البيانات.\nج خطا لأنه تحديد المستخدمين والصلاحيات يتم عبر نظام إدارة الوصول وليس قاموس البيانات.\nد خطا لأنه النسخ الاحتياطي ومفاتيح التشفير ليست جزءًا من قاموس البيانات.","oldQNumber":"101","bankIndex":348,"setId":"set2"},{"id":"145","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"ما هي البيانات التي يجب تشفرها من قبل الشركة على مستوى الجهاز الذكي الخاص بالموظف ؟","options":[{"key":"A","letter":"أ","text":"التشفير على مستوى التطبيقات"},{"key":"B","letter":"ب","text":"التشفير على مستوى كلمات المرور"},{"key":"C","letter":"ج","text":"التشفير على مستوى المصادقة"},{"key":"D","letter":"د","text":"التشفير على مستوى الجهاز"}],"explanation":"أ صحيح لأن التشفير على مستوى التطبيقات يركز على حماية البيانات الحساسة داخل التطبيقات نفسها، بحيث تبقى البيانات مشفرة حتى عند تخزينها على أجهزة المستخدمين أو نقلها، مما يوفر مستوى حماية أعلى للبيانات.\n\nب خطأ لأن تشفير كلمات المرور يحمي بيانات الاعتماد فقط، ولا يحمي جميع البيانات المخزنة على جهاز الموظف.\n\nج خطأ لأن المصادقة تهدف إلى التحقق من هوية المستخدم، وليست وسيلة لتشفير البيانات المخزنة.\n\nد خطأ لأن التشفير على مستوى الجهاز يحمي الجهاز بالكامل، لكنه لا يوفر نفس مستوى الحماية التفصيلي للبيانات الحساسة داخل التطبيقات عند الوصول إليها أو مشاركتها","oldQNumber":"106","bankIndex":349,"setId":"set2"},{"id":"150","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من العبارات التالية أكثر دقة فيما يتعلق بإدارة ومراجعة خادم الويب؟","options":[{"key":"A","letter":"أ","text":"يجب دائمًا تمكين بروتوكول نقل الملفات (FTP)."},{"key":"B","letter":"ب","text":"يجب أن يعمل بروتوكول نقل البريد البسيط (SMTP) تحت أكثر الحسابات امتيازًا."},{"key":"C","letter":"ج","text":"يجب زيادة عدد المنافذ والبروتوكولات المسموح لها بالوصول إلى خادم الويب."},{"key":"D","letter":"د","text":"يجب استخدام بروتوكولات آمنة للصفحات السرية بدلاً من بروتوكولات النص الصريح مثل HTTP أو FTP."}],"explanation":"أ. خطأ لأن FTP غير آمن ولا يجب تمكينه دائمًا، خاصة في البيئات الحساسة.\n\nب. خطأ لأن تشغيل SMTP بصلاحيات عالية يزيد المخاطر الأمنية.\n\nج. خطأ لأن زيادة المنافذ والبروتوكولات تقلل من الأمان وتزيد سطح الهجوم.\n\nد. صحيح لأنه يجب استخدام بروتوكولات آمنة مثل HTTPS و SFTP بدلاً من البروتوكولات غير المشفرة لحماية البيانات أثناء النقل.","oldQNumber":"111","bankIndex":350,"setId":"set2"},{"id":"155","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي مما يلي يصف كيفية عمل مخزون المنظمة الخاص بالمعلومات الشخصية للعملاء او شركاء الاعمال؟","options":[{"key":"A","letter":"أ","text":"حسب الفرد."},{"key":"B","letter":"ب","text":"حسب مصدر البيانات."},{"key":"C","letter":"ج","text":"عن طريق تصنيف البيانات."},{"key":"D","letter":"د","text":"حسب شكل البيانات"}],"explanation":"أ خطا لأنه تنظيم البيانات حسب الفرد لا يصف آلية إدارة المخزون بشكل مؤسسي شامل.\nب خطا لأنه تنظيم حسب مصدر البيانات لا يعكس طريقة إدارة المخزون بشكل كامل.\nج صحيح لأنه تصنيف البيانات هو الأسلوب المعتمد لتنظيم وإدارة المعلومات الشخصية داخل المؤسسة.\nد خطا لأنه شكل البيانات (نص، صورة، وغيرها) لا يمثل طريقة إدارة المخزون.","oldQNumber":"116","bankIndex":351,"setId":"set2"},{"id":"160","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"يخطط مدقق داخلي لشركة أدوية لإجراء تدقيق للأمن الإلكتروني وإجراء تقييم للمخاطر. أي مما يلي يعتبر أهم تهديد إلكتروني للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"قراصنة الإنترنت الذين يخترقون نظام الوقت والمصاريف للمؤسسة لجمع بيانات الموظفين الشخصية."},{"key":"B","letter":"ب","text":"المتسللون الذين يخترقون شبكة المؤسسة للوصول إلى تقارير البحث والتطوير."},{"key":"C","letter":"ج","text":"هجوم إنكار الخدمة يمنع الوصول إلى موقع المنظمة الإلكتروني."},{"key":"D","letter":"د","text":"مخترق الوصول إلى المعلومات المالية للشركة."}],"explanation":"أ خطا لأنه يركز على بيانات الموظفين وليس الأصول الأكثر حساسية للشركة.\nب صحيح لأنه يمثل أخطر تهديد لشركة أدوية وهو سرقة بيانات البحث والتطوير (الملكية الفكرية).\nج خطا لأنه يؤثر على الإتاحة فقط وليس على أهم الأصول الاستراتيجية.\nد خطا لأنه مهم لكنه أقل خطورة من سرقة بيانات البحث والتطوير.","oldQNumber":"121","bankIndex":352,"setId":"set2"},{"id":"165","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من عناصر التحكم التالية سيكون الأكثر فعالية في منع الكشف عن معلومات إلكترونية سرية للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"اتفاقيات عدم الإفصاح بين الشركة وموظفيها."},{"key":"B","letter":"ب","text":"سجلات نشاط المستخدم داخل نظام المعلومات."},{"key":"C","letter":"ج","text":"المصادقة ذات العاملين للوصول إلى نظام المعلومات."},{"key":"D","letter":"د","text":"وصول محدود إلى المعلومات، بناءً على واجبات الموظفين"}],"explanation":"أ. خطأ لأنها عنصر تحكم إداري ولا تمنع الوصول أو التسريب بشكل مباشر.\n\nب. خطأ لأنها عنصر تحكم كاشف (Detective) وليس وقائي.\n\nج. خطأ لأنها تتحكم في الدخول للنظام لكنها لا تحدد صلاحيات الوصول للمعلومات نفسها بدقة.\n\nد. صحيح لأنها تعتمد على مبدأ أقل صلاحية (Least Privilege)، وهو الأكثر فعالية لمنع الوصول غير المصرح به للمعلومات السرية.","oldQNumber":"126","bankIndex":353,"setId":"set2"},{"id":"170","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"في محاولة لزيادة كفاءة الأعمال وتحسين خدمة العملاء المقدمة إلى شركائه التجاريين الرئيسيين، وضعت إدارة شركة تصنيع وتوزيع شبكة آمنة، والتي توفر قناة آمنة لتبادل البيانات الإلكترونية بين الشركة وشركائها.","options":[{"key":"A","letter":"أ","text":"شبكة قيمة مضافة."},{"key":"B","letter":"ب","text":"شبكة محلية."},{"key":"C","letter":"ج","text":"شبكة منطقة حضرية."},{"key":"D","letter":"د","text":"شبكة واسعة النطاق"}],"explanation":"أ. صحيح لأنها تشير إلى شبكة القيمة المضافة (Value Added Network - VAN) والتي تُستخدم لتوفير قناة آمنة لتبادل البيانات الإلكترونية بين المؤسسات وشركائها التجاريين.\n\nب. خطأ لأنها شبكة محلية داخل نطاق محدود وليست مخصصة للتبادل مع شركاء خارجيين.\n\nج. خطأ لأنها تغطي نطاق مدينة أو منطقة حضرية فقط.\n\nد. خطأ لأنها شبكة واسعة النطاق لكنها لا تعني بالضرورة قناة تبادل بيانات آمنة بين شركاء تجاريين.","oldQNumber":"131","bankIndex":354,"setId":"set2"},{"id":"175","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"ما هي الخطوة الأولية الأكثر ملاءمة لبرنامج عمل لمهمة تأكيد تتضمن أجهزة ذكية؟","options":[{"key":"A","letter":"أ","text":"تدريب جميع الموظفين على سياسات احضر جهازك الخاص (BYOD)."},{"key":"B","letter":"ب","text":"فهم الإجراءات المتبعة لقفل الأجهزة المفقودة."},{"key":"C","letter":"ج","text":"الحصول على قائمة بجميع الأجهزة الذكية المستخدمة."},{"key":"D","letter":"د","text":"اختبار تشفير جميع الأجهزة الذكية."}],"explanation":"أ. خطأ لأنه خطوة لاحقة تتعلق بالتوعية وليس البداية في التخطيط.\n\nب. خطأ لأنه إجراء تحكمي مهم لكنه ليس خطوة أولية في برنامج العمل.\n\nج. صحيح لأنه يجب أولًا تحديد وحصر جميع الأجهزة الذكية المستخدمة لفهم نطاق المهمة.\n\nد. خطأ لأنه خطوة اختبارية تأتي بعد تحديد النطاق وجمع المعلومات","oldQNumber":"136","bankIndex":355,"setId":"set2"},{"id":"180","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين (IIA) بشأن تكنولوجيا المعلومات، أي من الأنشطة التالية المتعلقة بأمن المعلومات يُرجح أن تكون مسؤولية الإدارة التنفيذية – التشغيلية على عكس الإدارة العليا أو المراجعين الداخليين أو مجلس الإدارة؟","options":[{"key":"A","letter":"أ","text":"مراجعة ومراقبة أدوات التحكم الأمنية."},{"key":"B","letter":"ب","text":"تخصيص موارد أمنية كافية."},{"key":"C","letter":"ج","text":"الإشراف على وظيفة الأمن."},{"key":"D","letter":"د","text":"تقييم بيئات التحكم بالمعلومات."}],"explanation":"أ. خطأ لأنها غالباً مسؤولية خط الدفاع الثاني أو الثالث (المراجعة/التقييم).\n\nب. خطأ لأنها من مسؤوليات الإدارة العليا أو مجلس الإدارة في الحوكمة وتوفير الموارد.\n\nج. صحيح لأن الإدارة التنفيذية/التشغيلية مسؤولة عن الإشراف اليومي على وظيفة الأمن وتنفيذها.\n\nد. خطأ لأنها تمثل دور المراجعة الداخلية (تقييم مستقل لبيئة الرقابة).","oldQNumber":"141","bankIndex":356,"setId":"set2"},{"id":"185","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"يستخدم مسؤول قاعدة البيانات أي مما يلي لتخزين معلومات حول موقع الملفات وأسماء الجداول ؟","options":[{"key":"A","letter":"أ","text":"وظائف الإجراء المخزن."},{"key":"B","letter":"ب","text":"رموز الزناد."},{"key":"C","letter":"ج","text":"قواميس البيانات."},{"key":"D","letter":"د","text":"آليات الفهرس"}],"explanation":"أ خطا لأنه الإجراءات المخزنة تُستخدم لتنفيذ عمليات على البيانات وليس لتخزين معلومات تعريفية عنها.\nب خطا لأنه الزناد (Trigger) يُستخدم لتفعيل إجراءات عند حدوث أحداث معينة في قاعدة البيانات.\nج صحيح لأنه قواميس البيانات (ج) تحتوي على معلومات وصفية مثل أسماء الجداول ومواقع الملفات وبنية البيانات.\nد خطا لأنه الفهرس يُستخدم لتسريع الوصول إلى البيانات وليس لتخزين معلومات عنها.","oldQNumber":"146","bankIndex":357,"setId":"set2"},{"id":"190","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي يعد من المسؤوليات الرئيسية لمسؤول قاعدة البيانات؟","options":[{"key":"A","letter":"أ","text":"استكشاف مشاكل المستخدم النهائي وإصلاحها"},{"key":"B","letter":"ب","text":"توفير دعم الإنتاج"},{"key":"C","letter":"ج","text":"توفير الأمن المادي لقاعدة البيانات"},{"key":"D","letter":"د","text":"الحفاظ على سلامة قاعدة البيانات"}],"explanation":"أ خطا لأنه يتعلق بدعم المستخدمين وليس مسؤول قاعدة البيانات.\nب خطا لأنه دعم الإنتاج وظيفة تشغيلية عامة وليست المسؤولية الأساسية لمسؤول قاعدة البيانات.\nج خطا لأنه الأمن المادي عادة مسؤولية أمن المنشأة وليس DBA.\nد صحيح لأنه من أهم مهام مسؤول قاعدة البيانات الحفاظ على سلامة البيانات وضمان دقتها وتكاملها.","oldQNumber":"151","bankIndex":358,"setId":"set2"},{"id":"195","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي مما يلي يتطلب من المستخدمنر امتلاك عنصر ملموس من أجل الوصول ؟","options":[{"key":"A","letter":"أ","text":"تعريف المستخدم وكلمة المرور."},{"key":"B","letter":"ب","text":"مصادقة الرمز المميز token ."},{"key":"C","letter":"ج","text":"المصادقة البيومترية."},{"key":"D","letter":"د","text":"تسجيل الدخول الموحد"}],"explanation":"أ خطا لأنه يعتمد على شيء معرفي (معلومات تسجيل الدخول) وليس عنصرًا ملموسًا.\nب صحيح لأنه مصادقة الرمز المميز (ب) تعتمد على جهاز مادي (Token) يمتلكه المستخدم.\nج خطا لأنه يعتمد على خصائص بيولوجية وليس عنصرًا ملموسًا يمكن حمله.\nد خطا لأنه نظام إدارة دخول وليس عنصر مصادقة مادي بحد ذاته.","oldQNumber":"156","bankIndex":359,"setId":"set2"},{"id":"200","form":"form4","formTitle":"Group 4","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من السيناريوهات التالية يوضح بشكل أفضل هجوم التصيد بالرمح؟","options":[{"key":"A","letter":"أ","text":"تسببت الهجمات العديدة والمتسقة على موقع الشركة في تعطل الخادم وانقطاع الخدمة."},{"key":"B","letter":"ب","text":"اتصل شخص متنكر في مندوب عن مكتب مساعدة تقنية المعلومات بالشركة بالعديد من الموظفين وشغل رسالة مسجلة عامة تطلب بيانات كلمة المرور."},{"key":"C","letter":"ج","text":"تلقى شخص بريدًا إلكترونيًا شخصيًا بشأن تجديد عضوية في رياضة الجولف، ونقر على ارتباط تشعبي لإدخال بيانات بطاقة الائتمان الخاصة به في موقع ويب مزيف."},{"key":"D","letter":"د","text":"تلقى العديد من مستخدمي خدمة شبكة اجتماعية إشعارات مزيفة حول فرصة فريدة للاستثمار في منتج جديد."}],"explanation":"أ. خطأ لأنه يمثل هجوم حجب خدمة (DDoS) وليس تصيدًا.\n\nب. خطأ لأنه تصيد عام (Phishing) وليس موجهًا لشخص محدد.\n\nج. صحيح لأنه يمثل تصيدًا بالرمح (Spear Phishing) حيث يتم استهداف شخص محدد برسالة مخصصة تبدو شخصية وموثوقة.\n\nد. خطأ لأنه تصيد جماعي عام وليس موجهًا لشخص معين.","oldQNumber":"161","bankIndex":360,"setId":"set2"},{"id":"204","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"تتبنى المنظمة طريقة التكلفة التاريخية في تقييم اصولها وقد زادت القيمة السوقية للاصول ما الذي ستبلع عنه المنظمة في البيان المالي العام القادم ؟","options":[{"key":"A","letter":"أ","text":"التكلفة الاصلية للاصول"},{"key":"B","letter":"ب","text":"التكلفة الاصلية والقيمة العادلة للاصول"},{"key":"C","letter":"ج","text":"القيمة السوقية العادلة للاصول"},{"key":"D","letter":"د","text":"القيمة الحالية للأصول"}],"explanation":"أ. صحيح لأنه وفق مبدأ التكلفة التاريخية يتم الإبلاغ عن الأصول بتكلفتها الأصلية بغض النظر عن تغير القيمة السوقية.\n\nب. خطأ لأنه لا يتم الجمع بين التكلفة والقيمة العادلة في هذا النموذج.\n\nج. خطأ لأنه لا يتم استخدام القيمة السوقية العادلة في طريقة التكلفة التاريخية.\n\nد. خطأ لأنه لا يتم إعادة تقييم الأصول إلى قيمتها الحالية في هذا المبدأ.","oldQNumber":"3","bankIndex":361,"setId":"set3"},{"id":"209","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"C","question":"تلقى مدير جديد حسابات معدل العائد الداخلي لمقترح المشروع. بماذا يجب أن يقارن المدير نتائج الحسابات لتحديد ما إذا كان المشروع مقبولًا بشكل محتمل؟","options":[{"key":"A","letter":"أ","text":"يقارن بتكلفة رأس المال السنوية"},{"key":"B","letter":"ب","text":"يقارن بفائدة البيانات السنوية"},{"key":"C","letter":"ج","text":"يقارن بمعدل العائد المطلوب."},{"key":"D","letter":"د","text":"يقارن بالقيمة الحالية الصافية."}],"explanation":"أ. خطأ لأنه تكلفة رأس المال قد تكون مرجعًا، لكن معيار القبول الأساسي هو معدل العائد المطلوب أو العائق (Hurdle Rate).\n\nب. خطأ لأنه لا يوجد معيار اسمه فائدة البيانات السنوية في تقييم المشاريع.\n\nج. صحيح لأنه يتم قبول المشروع إذا كان معدل العائد الداخلي أعلى من معدل العائد المطلوب.\n\nد. خطأ لأنه القيمة الحالية الصافية تُستخدم كمعيار منفصل وليست للمقارنة المباشرة مع IRR.","oldQNumber":"8","bankIndex":362,"setId":"set3"},{"id":"214","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"أي من طرق تكلفة المخزون التالية تتطلب من المنظمة أن تحسب التكلفة الفعلية المدفوعة مقابل الوحدة المباعة؟","options":[{"key":"A","letter":"أ","text":"طريقة الوارد الأخير يخرج أولاً (LIFO)"},{"key":"B","letter":"ب","text":"متوسط التكلفة."},{"key":"C","letter":"ج","text":"طريقة الوارد أولاً يخرج أولاً (FIFO)."},{"key":"D","letter":"د","text":"تحديد محدد Specific identification"}],"explanation":"أ. خطأ لأنه في طريقة LIFO لا يتم تتبع التكلفة الفعلية لكل وحدة مباعة بشكل فردي.\n\nب. خطأ لأنه يتم استخدام متوسط تكلفة الوحدات وليس التكلفة الفعلية لكل وحدة.\n\nج. خطأ لأنه يعتمد على ترتيب دخول المخزون وليس تتبع التكلفة الفعلية لكل وحدة.\n\nد. صحيح لأنه في طريقة التحديد المحدد يتم تتبع التكلفة الفعلية لكل وحدة مباعة بشكل مباشر ودقيق.","oldQNumber":"13","bankIndex":363,"setId":"set3"},{"id":"219","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"C","question":"أي مما يلي يجب أن يؤخذ بالاعتبار عند حساب معدل الاستهلاك لمزرعة رياح تم بناؤها حديثًا؟","options":[{"key":"A","letter":"أ","text":"معدل العائد الداخلي لمزرعة الرياح."},{"key":"B","letter":"ب","text":"قيمة صافي الربح لمزرعة الرياح."},{"key":"C","letter":"ج","text":"مدة خدمة توربينات الرياح."},{"key":"D","letter":"د","text":"تكاليف صيانة التوربينات."}],"explanation":"أ. خطأ لأنه معدل العائد الداخلي يتعلق بتقييم الاستثمار وليس حساب الاستهلاك.\n\nب. خطأ لأن صافي الربح لا يدخل في تحديد معدل الاستهلاك.\n\nج. صحيح لأنه الاستهلاك يعتمد أساسًا على العمر الإنتاجي (مدة الخدمة) للأصل.\n\nد. خطأ لأن تكاليف الصيانة لا تحدد معدل الاستهلاك بل تُسجل كمصروفات تشغيلية.","oldQNumber":"18","bankIndex":364,"setId":"set3"},{"id":"224","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"أي من معايير الأداء التالية تشمل كل من الأرباح وقاعدة الاستثمار؟","options":[{"key":"A","letter":"أ","text":"الدخل المتبقي"},{"key":"B","letter":"ب","text":"ميزانية مرنة"},{"key":"C","letter":"ج","text":"تحليل التباين"},{"key":"D","letter":"د","text":"بيان دخل هامش المساهمة حسب القطاع"}],"explanation":"أ. صحيح لأنه يأخذ في الاعتبار الربح بعد خصم تكلفة رأس المال على الاستثمار (الأرباح + قاعدة الاستثمار).\n\nب. خطأ لأنه يركز على مقارنة الأداء الفعلي بالمخطط ولا يتضمن قاعدة الاستثمار.\n\nج. خطأ لأنه تحليل فروقات فقط ولا يقيس الأداء الاستثماري.\n\nد. خطأ لأنه يركز على الأداء التشغيلي حسب القطاعات دون ربطه بقاعدة الاستثمار.","oldQNumber":"23","bankIndex":365,"setId":"set3"},{"id":"229","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"أي من تدابير الأداء هذه تقلل من الدافع للانخراط في إدارة الأرباح (تثبيط التلاعب بالقوائم المالية)؟","options":[{"key":"A","letter":"أ","text":"ربط الأداء بمؤشرات الربحية مثل العائد على الاستثمار"},{"key":"B","letter":"ب","text":"ربط الأداء بسعر السهم."},{"key":"C","letter":"ج","text":"ربط الأداء بحصص الإنتاج مثل الوحدات المنتجة."},{"key":"D","letter":"د","text":"ربط الأداء بمؤشرات غير مالية مثل رضا العملاء وتدريب الموظفين."}],"explanation":"أ. خطأ لأنه ربط الأداء بمؤشرات الربحية قد يشجع الإدارة على التلاعب بالأرباح لتحقيق أهداف قصيرة الأجل.\n\nب. خطأ لأنه ربط الأداء بسعر السهم قد يدفع إلى إدارة الأرباح لتحسين صورة السوق.\n\nج. خطأ لأنه التركيز على الإنتاج قد يؤدي إلى سلوكيات تشغيلية غير مرغوبة مثل زيادة الإنتاج دون طلب.\n\nد. صحيح لأنه المؤشرات غير المالية تقلل من إمكانية التلاعب بالقوائم المالية وتركز على الأداء الحقيقي طويل الأجل.","oldQNumber":"28","bankIndex":366,"setId":"set3"},{"id":"234","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"C","question":"أي مما يلي مثال على التزام محتمل يجب على الشركة تسجيله؟","options":[{"key":"A","letter":"أ","text":"تقييم محتمل لضريبة دخل إضافية."},{"key":"B","letter":"ب","text":"تكاليف ضمان المنتج المحتملة"},{"key":"C","letter":"ج","text":"تهديد دعوى قضائية من قبل منافس."},{"key":"D","letter":"د","text":"احتمال بعيد لخرق عقد."}],"explanation":"أ. خطأ لأنه يمثل احتمال التزام مالي لكنه لا يُسجل كالتزام محتمل إلا إذا أصبح شبه مؤكد ويمكن قياسه.\n\nب. خطأ لأنه قد يُعترف به كمخصص إذا كان محتملًا ويمكن تقديره وليس مجرد التزام محتمل.\n\nج. صحيح لأنه التهديد بدعوى قضائية من منافس يُعد التزامًا محتملًا يعتمد على حدوث حدث مستقبلي غير مؤكد.\n\nد. خطأ لأنه احتمال بعيد لا يتطلب تسجيل أو إفصاح محاسبي.","oldQNumber":"33","bankIndex":367,"setId":"set3"},{"id":"239","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"يمكن لشركة تستخدم أساس الاستحقاق في المحاسبة الاعتراف بالإيرادات في أي من الحالات التالية؟","options":[{"key":"A","letter":"أ","text":"عند استلام النقد كدفعة مقابل خدمة."},{"key":"B","letter":"ب","text":"عند الاعتراف بالحسابات المدينة."},{"key":"C","letter":"ج","text":"عند استلام شيك كدفعة مقابل سلعة تم طلبها."},{"key":"D","letter":"د","text":"عند تقديم سلعة أو أداء خدمة"}],"explanation":"ا. خطأ لأنه أساس الاستحقاق لا يعتمد على استلام النقد\nب. خطأ لأنه الاعتراف بالحسابات المدينة نتيجة وليس شرطًا مستقلًا للاعتراف بالإيراد\nج. خطأ لأنه استلام الشيك لا يعني تحقق الإيراد\nد. صحيح لأنه يتم الاعتراف بالإيراد عند تحقق الأداء (تقديم السلعة أو الخدمة)","oldQNumber":"38","bankIndex":368,"setId":"set3"},{"id":"244","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"B","question":"تمتلك مؤسسة 1000 وحدة من عنصر معيب في المخزون ، لكل وحدة ، يبلغ سعر السوق 10 دولارات ؛ وتكلفة الإنتاج 4 دولارات ؛ وسعر البيع المعيب 5 دولارات. ما هو المبلغ المحمول (قيمة المخزون) للعيوب في النهاية؟","options":[{"key":"A","letter":"أ","text":"0 دولار"},{"key":"B","letter":"ب","text":"4000 دولار"},{"key":"C","letter":"ج","text":"5000 دولار"},{"key":"D","letter":"د","text":"10000 دولار"}],"explanation":"أ. خطأ لأنه لا يمكن تقييم المخزون المعيب بالصفر طالما له قيمة بيع.\n\nب. صحيح لأنه يتم تقييم المخزون بالتكلفة أو صافي القيمة القابلة للتحقق أيهما أقل، وهنا يتم استخدام 4 دولار × 1000 وحدة = 4000 دولار.\n\nج. خطأ لأنه يعتمد على سعر البيع وليس على قاعدة التكلفة أو صافي القيمة القابلة للتحقق.\n\nد. خطأ لأنه يعتمد على سعر السوق وليس على التكلفة الفعلية أو القيمة القابلة للتحقق.","oldQNumber":"43","bankIndex":369,"setId":"set3"},{"id":"249","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"من المرجح أن يؤدي أي من الإجراءات التالية إلى تقليل مخاطر مخالفة قوانين الأسعار التحويلية؟","options":[{"key":"A","letter":"أ","text":"تبيع المنظمة المخزون إلى فرع تابع لها في الخارج بسعر عادل."},{"key":"B","letter":"ب","text":"تشتري الشركة الفرعية المحلية المخزون بسعر مخفض."},{"key":"C","letter":"ج","text":"تبيع المنظمة المخزون إلى فرع تابع لها في الخارج بسعر التكلفة الأصلي"},{"key":"D","letter":"د","text":"تشتري الشركة الفرعية المحلية المخزون بسعر التكلفة المستهلكة."}],"explanation":"أ. صحيح لأنه استخدام السعر العادل (سعر السوق) يقلل مخاطر التلاعب بالأسعار التحويلية ويضمن الامتثال للقوانين.\n\nب. خطأ لأنه السعر المخفض قد يعتبر تلاعبًا ضريبيًا.\n\nج. خطأ لأنه التكلفة الأصلية لا تعكس سعر السوق وقد تثير مشاكل ضريبية.\n\nد. خطأ لأنه استخدام تكلفة غير عادلة قد يؤدي إلى مخالفة قواعد التسعير التحويلي.","oldQNumber":"48","bankIndex":370,"setId":"set3"},{"id":"254","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"B","question":"أي من العبارات التالية صحيحة فيما يتعلق بالمعالجة المحاسبية الأساسية للشراكة؟","options":[{"key":"A","letter":"أ","text":"يجب تسجيل الاستثمار الأولي لكل شريك بالقيمة الدفترية."},{"key":"B","letter":"ب","text":"تحدد نسبة الملكية الأساس لتقسيم صافي الدخل وصافي الخسارة."},{"key":"C","letter":"ج","text":"يتغير رأس مال الشريك فقط بسبب صافي الدخل أو صافي الخسارة."},{"key":"D","letter":"د","text":"يجب ان يكون أساس توزيع (تقاسم) صافي الدخل أو صافي الخسائر ثابتا."}],"explanation":"أ. خطأ لأنه يتم تسجيل الاستثمار الأولي للشريك عادةً بالقيمة العادلة للأصول المقدمة وليس بالقيمة الدفترية.\n\nب. صحيح لأنه يتم توزيع صافي الدخل والخسارة غالبًا بناءً على نسبة الملكية المتفق عليها بين الشركاء.\n\nج. خطأ لأنه قد يتغير رأس المال أيضًا بسبب السحوبات أو الاستثمارات الإضافية وليس فقط الربح أو الخسارة.\n\nد. خطأ لأنه لا يوجد شرط أن يكون أساس التوزيع ثابتًا، بل يعتمد على اتفاق الشركاء.","oldQNumber":"53","bankIndex":371,"setId":"set3"},{"id":"259","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"تنتج إحدى المؤسسات 10000 مضرب تنس شهريا وهو ما يعادل 80 بالمائة من سعة المصنع.. 4 دولارات لكل وحدة، وتبلغ تكاليف التصنيع الثابتة 4 دولار وتبلغ تكاليف التصنيع المتغيرة 4 دولار وتباع المضارب عادة بسعر 12 دولار لكل مضرب. تلقت المنظمة طلبا خاصا لشراء 200 مضرب مقابل 7 دولار لن يزيد المصنع ولن تتأثر سعته وقدرته أي من العبارات التالية صحيح؟","options":[{"key":"A","letter":"أ","text":"ستكون وحدة التكلفة ذات الصلة 4 دولار ويجب على الإدارة قبول العرض"},{"key":"B","letter":"ب","text":"ستكون وحدة التكلفة ذات الصلة 8 دولار ويجب على الإدارة رفض العرض"},{"key":"C","letter":"ج","text":"ستكون وحدة التكلفة ذات الصلة 7 دولار ويجب على الإدارة قبول العرض"},{"key":"D","letter":"د","text":"ستكون وحدة التكلفة ذات الصلة 12 دولار ويجب على الإدارة رفض العرض"}],"explanation":"أ. صحيح لأنه في القرار الخاص يتم تجاهل التكاليف الثابتة غير المتغيرة، وبالتالي التكلفة ذات الصلة هي التكلفة المتغيرة فقط (4 دولار)، وسعر العرض 7 دولار أعلى منها فيُقبل.\n\nب. خطأ لأنه يشمل تكاليف غير ذات صلة بالقرار.\n\nج. خطأ لأنه يعتبر السعر كتكلفة وهو غير صحيح محاسبياً.\n\nد. خطأ لأنه يتضمن التكلفة الكاملة وليس التكلفة الحدية ذات الصلة.","oldQNumber":"58","bankIndex":372,"setId":"set3"},{"id":"264","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"أي من البيانات المالية التالية يقدم أفضل إفصاح حول كيفية استخدام أموال الشركة خلال فترة معينة؟","options":[{"key":"A","letter":"أ","text":"قائمة الدخل."},{"key":"B","letter":"ب","text":"بيان حقوق الملكية"},{"key":"C","letter":"ج","text":"الميزانية العمومية."},{"key":"D","letter":"د","text":"بيان التدفقات النقدية."}],"explanation":"أ. خطأ لأنه يوضح نتائج الأعمال (الإيرادات والمصروفات) وليس كيفية استخدام النقد.\n\nب. خطأ لأنه يوضح التغيرات في حقوق الملكية وليس استخدام الأموال.\n\nج. خطأ لأنه يعرض المركز المالي في تاريخ معين وليس حركة استخدام الأموال.\n\nد. صحيح لأنه يوضح مصادر واستخدامات النقد خلال فترة معينة بشكل تفصيلي.","oldQNumber":"63","bankIndex":373,"setId":"set3"},{"id":"269","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"شركة A لديها سيولة 1:1 وشركة B لديها سيولة 1.5:1 اي مما يلي قد يعوض النسبة للشركة A؟","options":[{"key":"A","letter":"أ","text":"لدى الشركة A معدل دوران للمخزون أقل"},{"key":"B","letter":"ب","text":"لدى الشركة A فترة تحصيل أعلى"},{"key":"C","letter":"ج","text":"لدى الشركة A معدل دوران أقل للحسابات الدائنة"},{"key":"D","letter":"د","text":"لدى الشركة A هامش ربح أعلى"}],"explanation":"ا. خطأ لأنه انخفاض معدل دوران المخزون يقلل سرعة تحويل المخزون إلى نقد مما يضعف السيولة\n\nب. خطأ لأنه زيادة فترة التحصيل تؤخر دخول النقد من العملاء مما يضعف السيولة\n\nج. خطأ لأنه انخفاض معدل دوران الحسابات الدائنة يعني دفع أسرع للموردين مما يقلل النقد المتاح\n\nد. صحيح لأنه هامش ربح أعلى يعزز الربحية وبالتالي قد يحسن القدرة على توليد نقد ويعوض ضعف السيولة","oldQNumber":"68","bankIndex":374,"setId":"set3"},{"id":"274","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"B","question":"تشير البيانات الحالية الى ملاحظة ان البيانات المالية تم إعدادها على أساس استمرار المؤسسة في عملياتها في المستقبل المنظور أي من مبادئ المحاسبة تم تطبيقه؟","options":[{"key":"A","letter":"أ","text":"مبدأ الوحدة النقدية"},{"key":"B","letter":"ب","text":"مبدأ استمرارية"},{"key":"C","letter":"ج","text":"مبدأ الفترة الزمنية"},{"key":"D","letter":"د","text":"مبدأ الكيان الاقتصادي"}],"explanation":"ا. خطأ لأنه مبدأ الوحدة النقدية يتعلق باستخدام عملة موحدة للقياس\nب. صحيح لأنه مبدأ الاستمرارية يفترض أن المنشأة ستستمر في عملها في المستقبل المنظور\nج. خطأ لأنه مبدأ الفترة الزمنية يتعلق بتقسيم النشاط لفترات محاسبية\nد. خطأ لأنه مبدأ الكيان الاقتصادي يفصل بين نشاط المنشأة والمالك","oldQNumber":"73","bankIndex":375,"setId":"set3"},{"id":"279","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"C","question":"أي من الخيارات التالية يوضح بشكل أفضل معنى القيمة العادلة؟","options":[{"key":"A","letter":"أ","text":"الأرباح أو الخسائر غير المحققة لمحفظة الاستثمارات."},{"key":"B","letter":"ب","text":"الفرق بين التكلفة الاجمالية للاوراق المالية وتكلفتها السوقية."},{"key":"C","letter":"ج","text":"السعر الذي يمكن بيع الورقة المالية به في ظروف السوق العادية."},{"key":"D","letter":"د","text":"التكلفة الأصلية للورقة المالية مضافًا اليها الإيرادات التي تم تحقيقها."}],"explanation":"أ. خطأ لأنه يصف نتائج التغير في القيمة وليس تعريف القيمة العادلة.\n\nب. خطأ لأنه يصف فرقًا محاسبيًا وليس تعريف القيمة العادلة.\n\nج. صحيح لأنه القيمة العادلة هي السعر الذي يمكن بيع الأصل به في سوق منظم وظروف عادية.\n\nد. خطأ لأنه يمثل التكلفة التاريخية وليس القيمة العادلة.","oldQNumber":"78","bankIndex":376,"setId":"set3"},{"id":"284","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"أي من العبارات التالية صحيحة فيما يتعلق بمصطلح \"الميزانيات المرنة\" كما هو مستخدم في المحاسبة؟","options":[{"key":"A","letter":"أ","text":"يصف المصطلح الميزانيات التي تستبعد التكاليف الثابتة."},{"key":"B","letter":"ب","text":"تستبعد الميزانيات المرنة توقعات النتائج التي يصعب تحديدها ، وتعتمد بدلاً من ذلك على أحدث النتائج الفعلية."},{"key":"C","letter":"ج","text":"المصطلح هو بمثابة علم أحمر لأنشطة التحكم بالميزانية الضعيفة."},{"key":"D","letter":"د","text":"تتوقع الميزانيات المرنة بيانات لمستويات مختلفة من النشاط."}],"explanation":"أ. خطأ لأنه الميزانيات المرنة لا تستبعد التكاليف الثابتة بل تشملها وتعدل حسب مستوى النشاط.\n\nب. خطأ لأنها لا تعتمد على النتائج الفعلية فقط بل على مستويات نشاط مختلفة مخططة مسبقًا.\n\nج. خطأ لأنه ليس مصطلحًا سلبيًا أو مؤشرًا على ضعف الرقابة.\n\nد. صحيح لأنها تقوم بإعداد تقديرات تكاليف وإيرادات لمستويات مختلفة من النشاط.","oldQNumber":"84","bankIndex":377,"setId":"set3"},{"id":"289","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"أي من تقنيات ميزانية رأس المال التالية تأخذ بعين الاعتبار صافي التدفقات النقدية المتوقعة من الاستثمار؟","options":[{"key":"A","letter":"أ","text":"استرداد نقدي"},{"key":"B","letter":"ب","text":"معدل العائد السنوي"},{"key":"C","letter":"ج","text":"تحليل تزايدي"},{"key":"D","letter":"د","text":"القيمة الحالية الصافية. Net present value"}],"explanation":"أ. خطأ لأنه يركز على فترة استرداد الاستثمار ولا يأخذ جميع التدفقات النقدية بعين الاعتبار.\n\nب. خطأ لأنه يعتمد على معدلات محاسبية وليس على صافي التدفقات النقدية المخصومة بالكامل.\n\nج. خطأ لأنه أسلوب قرار مقارن ولا يعتمد مباشرة على تقييم صافي التدفقات النقدية.\n\nد. صحيح لأنه يقوم على خصم صافي التدفقات النقدية المستقبلية وتقييمها لاتخاذ القرار الاستثماري.","oldQNumber":"89","bankIndex":378,"setId":"set3"},{"id":"294","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"B","question":"أي من الأساليب المحاسبية التالية من المحتمل أن يستخدمها منظمة المستثمرين عند شراء 40 بالمائة من أسهم منظمة أخرى؟","options":[{"key":"A","letter":"أ","text":"طريقة التكلفة."},{"key":"B","letter":"ب","text":"طريقة حقوق الملكية."},{"key":"C","letter":"ج","text":"طريقة التوحيد."},{"key":"D","letter":"د","text":"طريقة القيمة العادلة."}],"explanation":"أ. خطأ لأنه تستخدم عادة للاستثمارات الصغيرة التي لا تعطي تأثيرًا كبيرًا على الشركة المستثمر فيها.\n\nب. صحيح لأنه عند امتلاك 40% يكون للمستثمر تأثير جوهري وبالتالي تُستخدم طريقة حقوق الملكية.\n\nج. خطأ لأنه التوحيد يُستخدم عند السيطرة الكاملة وليس مجرد 40%.\n\nد. خطأ لأنه القيمة العادلة تُستخدم للاستثمارات السلبية أو التداول وليس للتأثير الجوهري.","oldQNumber":"94","bankIndex":379,"setId":"set3"},{"id":"299","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"B","question":"بدى احد المؤسسات مبيعات نقدية صافية بقيمة 900000 دولار خلال العام بدأت حسابات المؤسسة مستحقة القبض برصيد 38000 دولار وانتهت برصيد 36000 دولار ما هي فترة التحصيل المتوسطة بالايام؟","options":[{"key":"A","letter":"أ","text":"14.6"},{"key":"B","letter":"ب","text":"15.01"},{"key":"C","letter":"ج","text":"15.41"},{"key":"D","letter":"د","text":"24.32"}],"explanation":"ا. خطأ لأنه ناتج عن تقريب غير دقيق في الحساب\nب. صحيح لأنه يتم حساب متوسط الذمم المدينة ثم تحويلها إلى فترة تحصيل:\nمتوسط الذمم = (38000 + 36000) ÷ 2 = 37000\nفترة التحصيل = (37000 ÷ 900000) × 365 ≈ 15.01 يوم\nج. خطأ لأنه أعلى من القيمة الصحيحة الناتجة عن المعادلة\nد. خطأ لأنه لا يتوافق مع نتيجة متوسط التحصيل المحسوب","oldQNumber":"99","bankIndex":380,"setId":"set3"},{"id":"304","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"B","question":"عندما تستخدم الإدارة نهج تكلفة الامتصاص ، يتم تصنيف تكاليف الإنتاج الثابتة العامة على أنها أي نوع من أنواع التكاليف التالية؟","options":[{"key":"A","letter":"أ","text":"تكاليف مباشرة ، تكاليف المنتج."},{"key":"B","letter":"ب","text":"تكاليف غير مباشرة للمنتج."},{"key":"C","letter":"ج","text":"تكاليف الفترة المباشرة."},{"key":"D","letter":"د","text":"تكاليف الفترة غير المباشرة"}],"explanation":"أ. خطأ لأنه تكاليف الإنتاج الثابتة العامة لا تُعد تكاليف مباشرة.\n\nب. صحيح لأنه في نظام تكلفة الامتصاص تُعتبر التكاليف الثابتة العامة ضمن تكاليف الإنتاج غير المباشرة وتُحمّل على المنتج.\n\nج. خطأ لأنها ليست تكاليف فترة بل تكاليف إنتاج.\n\nد. خطأ لأنها لا تُصنف كتكاليف فترة في نظام تكلفة الامتصاص.","oldQNumber":"104","bankIndex":381,"setId":"set3"},{"id":"309","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"D","question":"حققت منظمة هامش ربح إجمالي قدره 40٪ في السنة الأولى والسنة الثانية. وكانت هوامش الربح الصافي 18٪ في السنة الأولى و 13٪ في السنة الثانية. ما الذي يمكن أن يكون سبب انخفاض هامش الربح الصافي للسنة الثانية؟","options":[{"key":"A","letter":"أ","text":"زادت تكلفة المبيعات مقارنة بالمبيعات."},{"key":"B","letter":"ب","text":"زادت إجمالي المبيعات بالمقارنة مع المصاريف."},{"key":"C","letter":"ج","text":"قامت المنظمة بتوزيع أرباح أعلى في السنة الثانية."},{"key":"D","letter":"د","text":"زادت الحكومة معدل الضريبة على الشركات."}],"explanation":"أ. خطأ لأنه تغير تكلفة المبيعات عادة يؤثر على هامش الربح الإجمالي، وهو ثابت هنا.\n\nب. خطأ لأنه يؤدي عادة إلى تحسين هامش الربح وليس خفضه.\n\nج. خطأ لأنه توزيعات الأرباح لا تؤثر على هامش الربح الصافي بل على الأرباح المحتجزة.\n\nد. صحيح لأنه زيادة معدل الضريبة تؤدي مباشرة إلى انخفاض هامش الربح الصافي رغم ثبات هامش الربح الإجمالي.","oldQNumber":"109","bankIndex":382,"setId":"set3"},{"id":"314","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"شركة لديها مخزون في بداية المدة 600 وحدة : 400 وحدة بسعر 7 دولار و 200 وحدة بسعر 7.5 دولار على التوالي واشترت خلال الفترة 800 وحدة بسعر 10 دولار وفي الفترة الاخيرة اشترت 700 وحدة بسعر 10 دولار وأعادت منها 200 وحدة ، وباعت خلال الفترة 500 وحدة ، وبافتراض ان الشركة تقوم باستخدام طريقة الوارد أو لا يصرف أولا FIFO في تقييم البضاعة المباعة ، كم سيكون تكلفة مخزونها في نهاية العام ؟","options":[{"key":"A","letter":"أ","text":"13750 ."},{"key":"B","letter":"ب","text":"13500"},{"key":"C","letter":"ج","text":"10200 ."},{"key":"D","letter":"د","text":"11500 ."}],"explanation":"أ. صحيح لأنه يتم تطبيق FIFO بحيث يتم تحميل المبيعات من أقدم المخزون أولاً، ثم احتساب المخزون المتبقي من أحدث المشتريات، وبعد احتساب المرتجعات يتم الوصول إلى تكلفة مخزون نهائي تساوي 13750.\n\nب. خطأ لأنه لا يعكس الترتيب الصحيح لاستخدام FIFO في المخزون.\n\nج. خطأ لأنه أقل من القيمة الفعلية الناتجة عن الترتيب الزمني للوحدات.\n\nد. خطأ لأنه لا يتوافق مع نتائج طريقة FIFO في هذه البيانات.","oldQNumber":"114","bankIndex":383,"setId":"set3"},{"id":"319","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"أي مما يلي هو مؤشر على السيولة أكثر اعتمادًا من رأس المال العامل؟","options":[{"key":"A","letter":"أ","text":"نسبة السريعة -الحموضة"},{"key":"B","letter":"ب","text":"متوسط فترة التحصيل"},{"key":"C","letter":"ج","text":"النسبة الحالية."},{"key":"D","letter":"د","text":"معدل دوران المخزون."}],"explanation":"أ. صحيح لأنه يقيس السيولة بشكل أدق من رأس المال العامل عبر استبعاد المخزون والتركيز على الأصول السريعة.\n\nب. خطأ لأنه يقيس كفاءة التحصيل وليس السيولة بشكل مباشر.\n\nج. خطأ لأنه يقيس السيولة لكنه أقل دقة من النسبة السريعة.\n\nد. خطأ لأنه يقيس كفاءة إدارة المخزون وليس السيولة.","oldQNumber":"119","bankIndex":384,"setId":"set3"},{"id":"324","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"ما هو أحد أساليب تكلفة المخزون التي يمكن إدارتها من قبل الإدارة لتعزيز صافي الدخل عن طريق بيع وحدات تم شراؤها بتكلفة منخفضة؟","options":[{"key":"A","letter":"أ","text":"طريقة الأول يدخل أولاً (FIFO)."},{"key":"B","letter":"ب","text":"طريقة الأخير يدخل أولاً (LIFO)."},{"key":"C","letter":"ج","text":"طريقة التعرف المحدد."},{"key":"D","letter":"د","text":"طريقة التكلفة المتوسطة."}],"explanation":"أ. صحيح لأنه في FIFO يتم بيع أقدم (وأرخص غالبًا) الوحدات أولاً مما يؤدي إلى تقليل تكلفة البضائع المباعة وزيادة صافي الدخل.\n\nب. خطأ لأنه LIFO يؤدي غالبًا إلى تكلفة أعلى للبضائع المباعة وليس تعزيز صافي الدخل في هذه الحالة.\n\nج. خطأ لأنه يعتمد على تحديد كل وحدة بشكل منفصل وليس على تعزيز الدخل عبر اختيار التكاليف.\n\nد. خطأ لأنه يستخدم متوسط التكاليف ولا يتيح إدارة الأرباح بنفس الطريقة.","oldQNumber":"124","bankIndex":385,"setId":"set3"},{"id":"329","form":"form4","formTitle":"Group 4","lesson":"ج- المالية","answer":"A","question":"أي من الأدوات التالية لتقييم المشاريع الرأسمالية تستخدم كل من القيمة الزمنية للمال وتقدير إجمالي التدفق النقدي الصافي؟","options":[{"key":"A","letter":"أ","text":"معدل العائد الداخلي"},{"key":"B","letter":"ب","text":"الاسترداد النقدي"},{"key":"C","letter":"ج","text":"معدل العائد السنوي"},{"key":"D","letter":"د","text":"معدل العائد المطلوب"}],"explanation":"أ. صحيح لأنه معدل العائد الداخلي (IRR) يأخذ في الاعتبار القيمة الزمنية للنقود ويعتمد على التدفقات النقدية الصافية للمشروع.\n\nب. خطأ لأنه الاسترداد النقدي لا يأخذ القيمة الزمنية للمال في الاعتبار.\n\nج. خطأ لأنه معدل العائد السنوي يعتمد على متوسطات محاسبية وليس خصم التدفقات النقدية.\n\nد. خطأ لأنه معدل العائد المطلوب هو معيار قرار وليس أداة تقييم للمشاريع.","oldQNumber":"129","bankIndex":386,"setId":"set3"},{"id":"334","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أثناء تدقيق مركز اتصال عملاء في إحدى المنظمات، يلاحظ المراجع الداخلي أن مؤشرات الأداء الرئيسية تُظهر اتجاهًا إيجابيًا، على الرغم من وجود شكاوى متزايدة من العملاء خلال نفس الفترة. أي من توصيات التدقيق التالية من المرجح أن تصحح سبب هذا التناقض؟","options":[{"key":"A","letter":"أ","text":"مراجعة نص (سيناريو) المكالمة الذي يستخدمه عملاء خدمة العملاء للتفاعل مع المتصلين وتحديثه إذا لزم الأمر."},{"key":"B","letter":"ب","text":"إعادة التأكيد على أهمية اكتمال موظفي مركز الاتصال لعدد معين من المكالمات في الساعة."},{"key":"C","letter":"ج","text":"إعادة تدريب موظفي مركز الاتصال على عمليات المنطقة والمشكلات التقنية الشائعة التي من المرجح أن يُطلب منهم حلها."},{"key":"D","letter":"د","text":"زيادة الحافز لموظفي مركز الاتصال لإكمال المكالمات بسرعة ورفع عدد المكالمات المكتملة يوميًا."}],"explanation":"أ. خطأ لأنه تحسين النص لا يعالج بالضرورة فجوة المعرفة أو القدرة الفنية التي قد تسبب الشكاوى.\n\nب. خطأ لأنه التركيز على عدد المكالمات قد يزيد المشكلة ويؤدي إلى انخفاض جودة الخدمة.\n\nج. صحيح لأنه إعادة التدريب يعالج سبب محتمل للشكاوى وهو ضعف معرفة الموظفين بالعمليات أو المشكلات الفنية.\n\nد. خطأ لأنه زيادة الحوافز لسرعة إنهاء المكالمات قد يزيد من تدهور جودة الخدمة ويزيد الشكاوى.","oldQNumber":"4","bankIndex":387,"setId":"set4"},{"id":"339","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"A","question":"طلب مدقق داخلي الهيكل التنظيمي لتقييم بيئة الرقابة في منظمة. ما هو أحد عيوب استخدام الهيكل التنظيمي؟","options":[{"key":"A","letter":"أ","text":"يظهر الهيكل التنظيمي فقط العلاقات الرسمية."},{"key":"B","letter":"ب","text":"يظهر الهيكل التنظيمي فقط سلسلة السلطة."},{"key":"C","letter":"ج","text":"يظهر الهيكل التنظيمي فقط المناصب الإدارية العليا."},{"key":"D","letter":"د","text":"الهيكل التنظيمي غير ذي صلة عند اختبار بيئة الرقابة."}],"explanation":"أ. صحيح لأنه الهيكل التنظيمي يعرض العلاقات الرسمية فقط ولا يعكس العلاقات غير الرسمية داخل المنظمة.\n\nب. خطأ لأنه ليس فقط سلسلة السلطة بل أيضًا خطوط التقسيم الإداري، لكنه ما زال يمثل جزءًا رسميًا فقط.\n\nج. خطأ لأنه الهيكل لا يقتصر على المناصب العليا بل يشمل جميع المستويات.\n\nد. خطأ لأنه الهيكل التنظيمي ذو صلة مباشرة بتقييم بيئة الرقابة وليس غير ذي صلة.","oldQNumber":"9","bankIndex":388,"setId":"set4"},{"id":"344","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي مما يلي أفضل وصف لاستراتيجية تصميم الوظائف التي يستخدمها الرئيس التنفيذي لمراجعة الحسابات والتي تشجع المدققين الداخليين على إدارة الارتباطات من البداية إلى النهاية؟","options":[{"key":"A","letter":"أ","text":"مشاركة الوظيفية."},{"key":"B","letter":"ب","text":"التظليل الوظيفي."},{"key":"C","letter":"ج","text":"إثراء الوظيفي."},{"key":"D","letter":"د","text":"التناوب الوظيفي."}],"explanation":"أ. خطأ لأنه مشاركة الوظيفية تعني توزيع أجزاء من العمل بين أكثر من شخص وليس تحمل مسؤولية كاملة.\n\nب. خطأ لأنه التظليل الوظيفي يعني التعلم بالمشاهدة ولا يشمل تنفيذ أو إدارة الارتباطات.\n\nج. صحيح لأنه إثراء الوظيفي يزيد من المسؤولية والاستقلالية ويجعل المدقق يدير الارتباط من البداية إلى النهاية.\n\nد. خطأ لأنه التناوب الوظيفي يعني الانتقال بين وظائف مختلفة وليس إدارة كاملة لمهمة واحدة.","oldQNumber":"14","bankIndex":389,"setId":"set4"},{"id":"349","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"A","question":"وفقًا لهرم ماسلو ما هي الحاجات التي يطلبها الموظف بعد تحقيق المتطلبات الأساسية؟","options":[{"key":"A","letter":"أ","text":"حاجات الأمان"},{"key":"B","letter":"ب","text":"الحاجة إلى التقدير"},{"key":"C","letter":"ج","text":"حاجات تحقيق الذات"},{"key":"D","letter":"د","text":"الحاجة إلى الانتماء"}],"explanation":"أ. صحيح لأنه بعد تلبية الاحتياجات الأساسية (الفسيولوجية) ينتقل الفرد مباشرة إلى احتياجات الأمان مثل الاستقرار الوظيفي والحماية.\n\nب. خطأ لأنه التقدير يأتي في مستوى أعلى بعد تحقيق الأمان والانتماء.\n\nج. خطأ لأنه تحقيق الذات هو أعلى مستوى في هرم ماسلو ولا يأتي مباشرة بعد الاحتياجات الأساسية.\n\nد. خطأ لأنه الحاجة إلى الانتماء تأتي بعد الأمان وليست مباشرة بعد الاحتياجات الأساسية.","oldQNumber":"19","bankIndex":390,"setId":"set4"},{"id":"354","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي مما يلي يعد من الأهداف الأساسية لنظرية القيود؟","options":[{"key":"A","letter":"أ","text":"القدرة الكاملة أو القريبة في العمليات"},{"key":"B","letter":"ب","text":"سير العمل السلس بين العمليات"},{"key":"C","letter":"ج","text":"عيوب قليلة أو معدومة"},{"key":"D","letter":"د","text":"انخفاض مستويات المخزون"}],"explanation":"أ. خطأ لأنه الوصول إلى الطاقة الكاملة ليس الهدف الأساسي لنظرية القيود.\n\nب. صحيح لأنه نظرية القيود تركز على تحسين تدفق العمل وتقليل الاختناقات لضمان سير العمليات بسلاسة.\n\nج. خطأ لأنه تقليل العيوب يرتبط بإدارة الجودة أكثر من نظرية القيود.\n\nد. خطأ لأنه خفض المخزون قد يكون نتيجة غير مباشرة وليس الهدف الأساسي للنظرية.","oldQNumber":"24","bankIndex":391,"setId":"set4"},{"id":"359","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"C","question":"القائد الذي يهتم بالحضور الشخصي والالتزام تحت أي أنواع القيادة؟","options":[{"key":"A","letter":"أ","text":"سلطوي"},{"key":"B","letter":"ب","text":"ديمقراطي"},{"key":"C","letter":"ج","text":"رسمي"},{"key":"D","letter":"د","text":"الاستبدادي"}],"explanation":"أ. خطأ لأنه القائد السلطوي يركز على إصدار الأوامر والسيطرة وليس على الحضور الشخصي والالتزام فقط.\n\nب. خطأ لأنه القائد الديمقراطي يركز على المشاركة واتخاذ القرار الجماعي وليس مجرد الحضور والالتزام.\n\nج. صحيح لأنه القائد الرسمي يهتم بالالتزام بالقواعد والإجراءات والحضور ضمن إطار العمل الرسمي.\n\nد. خطأ لأنه القائد الاستبدادي يركز على فرض السلطة والسيطرة الصارمة وليس فقط الالتزام الشكلي.","oldQNumber":"29","bankIndex":392,"setId":"set4"},{"id":"364","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"B","question":"ما هو أحد عيوب الهيكل التنظيمي المركزي Centralized organizational structure ؟","options":[{"key":"A","letter":"أ","text":"تنازعات الاتصال."},{"key":"B","letter":"ب","text":"اتخاذ القرار بشكل أبطأ."},{"key":"C","letter":"ج","text":"فقدان وفورات الحجم."},{"key":"D","letter":"د","text":"نقاط ضعف في مشاركة المعرفة."}],"explanation":"أ. خطأ لأنه تنازعات الاتصال ليست من العيوب الرئيسية المرتبطة مباشرة بالهيكل التنظيمي المركزي.\n\nب. صحيح لأنه تركز السلطة في المستويات العليا يؤدي غالبًا إلى بطء عملية اتخاذ القرار.\n\nج. خطأ لأنه الهيكل المركزي يساعد عادةً على تحقيق وفورات الحجم من خلال توحيد العمليات والموارد.\n\nد. خطأ لأنه ضعف مشاركة المعرفة يرتبط غالبًا بالهياكل المنعزلة أو المقسمة أكثر من ارتباطه بالمركزية.","oldQNumber":"34","bankIndex":393,"setId":"set4"},{"id":"369","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي من تقنيات تصميم الوظيفة من المرجح أن تستخدم لزيادة تحفيز الموظف من خلال مسؤولية العمل والتقدير؟","options":[{"key":"A","letter":"أ","text":"تعقيد الوظيفة"},{"key":"B","letter":"ب","text":"دوران الوظيفة"},{"key":"C","letter":"ج","text":"إثراء الوظيفة"},{"key":"D","letter":"د","text":"توسيع الوظيفة"}],"explanation":"أ. خطأ لأنه تعقيد الوظيفة لا يُستخدم كوسيلة تحفيزية بل هو وصف لطبيعة صعوبة المهام.\n\nب. خطأ لأنه دوران الوظيفة يعني التنقل بين وظائف مختلفة لتقليل الملل وليس زيادة المسؤولية والتقدير.\n\nج. صحيح لأنه إثراء الوظيفة يزيد من المسؤولية والاستقلالية ويعزز التقدير والتحفيز الوظيفي.\n\nد. خطأ لأنه توسيع الوظيفة يركز على زيادة عدد المهام وليس رفع مستوى المسؤولية أو التقدير.","oldQNumber":"39","bankIndex":394,"setId":"set4"},{"id":"374","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"D","question":"قررت إحدى المنظمات إعادة هيكلتها إلى هيكل تنظيمي أكثر تسطيحًا. ما هو التغيير المتوقع حدوثه مع هذا الهيكل الجديد؟","options":[{"key":"A","letter":"أ","text":"خفض التكاليف."},{"key":"B","letter":"ب","text":"اتخاذ القرارات بشكل أبطأ على مستوى الإدارة العليا."},{"key":"C","letter":"ج","text":"تقييد الحرية الإبداعية للمديرين ذوي المستويات الوظيفية الأدنى."},{"key":"D","letter":"د","text":"تركيز المديرين التنفيذيين رفيعي المستوى بشكل أكبر على اتخاذ القرارات الروتينية قصيرة الأجل."}],"explanation":"أ. خطأ لأنه قد يؤدي الهيكل التنظيمي الأكثر تسطيحًا إلى خفض التكاليف، لكنه ليس التغيير المقصود في هذا السؤال.\n\nب. خطأ لأنه الهيكل التنظيمي الأكثر تسطيحًا عادةً يسرّع اتخاذ القرارات بسبب تقليل المستويات الإدارية.\n\nج. خطأ لأنه هذا الهيكل يمنح المديرين في المستويات الأدنى صلاحيات ومسؤوليات أكبر، مما يعزز الحرية الإبداعية.\n\nد. صحيح لأنه مع تقليل المستويات الإدارية قد يزداد انخراط المديرين التنفيذيين في القرارات التشغيلية والروتينية قصيرة الأجل.","oldQNumber":"44","bankIndex":395,"setId":"set4"},{"id":"379","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"B","question":"ما الذي ينطبق على الهياكل التنظيمية المصفوفية Matrix organizations ؟","options":[{"key":"A","letter":"أ","text":"يتطلب مفهوم توحيد الأمر من الموظفين الإبلاغ فنيًا ووظيفيًا وإداريًا إلى نفس المدير."},{"key":"B","letter":"ب","text":"يسمح الجمع بين أقسام المنتجات والأقسام الوظيفية للإدارة باستخدام أفراد من مفاصل مختلفة."},{"key":"C","letter":"ج","text":"قد تختلف سلطة ومسؤولية ومحاسبة الوحدات المشاركة بناءً على عمر المشروع أو ثقافة المؤسسة."},{"key":"D","letter":"د","text":"هو الأنسب للشركات ذات المواقع المتناثرة أو للشركات متعددة الخطوط وكبيرة الحجم."}],"explanation":"أ. خطأ لأنه في الهيكل المصفوفي غالبًا ما يكون للموظف أكثر من مدير، لذلك لا يتحقق مبدأ توحيد الأمر.\n\nب. صحيح لأنه يجمع بين الهيكل الوظيفي وهيكل المنتجات أو المشاريع، مما يسمح بالاستفادة من خبرات أفراد من أقسام مختلفة.\n\nج. خطأ لأنه يصف ظروفًا قد تحدث في بعض المؤسسات، لكنه لا يمثل السمة الأساسية للهيكل المصفوفي.\n\nد. خطأ لأنه هذا الوصف يرتبط أكثر بالهياكل القطاعية أو التنظيمات الكبيرة متعددة الوحدات، وليس بالهيكل المصفوفي تحديدًا.","oldQNumber":"49","bankIndex":396,"setId":"set4"},{"id":"384","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"D","question":"أي مما يلي يعد من المزايا الرئيسية للمنظمات اللامركزية مقارنة بالمنظمات المركزية؟","options":[{"key":"A","letter":"أ","text":"المنظمات اللامركزية أكثر تركيزًا على الأهداف التنظيمية."},{"key":"B","letter":"ب","text":"تعمل المنظمات اللامركزية على تبسيط الهيكل التنظيمي."},{"key":"C","letter":"ج","text":"تميل المنظمات اللامركزية إلى أن تكون أقل تكلفة في التشغيل."},{"key":"D","letter":"د","text":"تميل المنظمات اللامركزية إلى أن تكون أكثر استجابة لتغيرات السوق."}],"explanation":"أ. خطأ لأنه التركيز على الأهداف التنظيمية لا يُعد ميزة خاصة باللامركزية مقارنة بالمركزية.\n\nب. خطأ لأنه تبسيط الهيكل التنظيمي ليس نتيجة مباشرة ثابتة للامركزية.\n\nج. خطأ لأنه اللامركزية غالبًا لا تكون أقل تكلفة، وقد تزيد التكاليف بسبب تعدد مراكز القرار.\n\nد. صحيح لأنها اللامركزية تمنح مرونة وسرعة في اتخاذ القرار مما يجعلها أكثر استجابة لتغيرات السوق.","oldQNumber":"54","bankIndex":397,"setId":"set4"},{"id":"389","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"D","question":"وفقًا لنظرية دافعية العاملين المكونة من عاملين لهرزبيرغ، ما هو العامل الأكثر ذكرًا من قبل الموظفين الراضين؟","options":[{"key":"A","letter":"أ","text":"العلاقة مع المشرف."},{"key":"B","letter":"ب","text":"الراتب."},{"key":"C","letter":"ج","text":"الأمن الوظيفي."},{"key":"D","letter":"د","text":"الإنجاز."}],"explanation":"أ. خطأ لأنه العلاقة مع المشرف تُعد من عوامل النظافة وليست العامل الأساسي الذي يرتبط بالرضا العالي.\n\nب. خطأ لأنه الراتب يُعتبر عامل نظافة وليس من العوامل المحفزة للرضا الوظيفي.\n\nج. خطأ لأنه الأمن الوظيفي أيضًا من عوامل النظافة التي تمنع عدم الرضا لكنها لا تولّد الرضا العالي.\n\nد. صحيح لأنه وفق نظرية هرزبيرغ، الإنجاز يُعد من العوامل المحفزة الأساسية المرتبطة بالرضا الوظيفي العالي.","oldQNumber":"59","bankIndex":398,"setId":"set4"},{"id":"394","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"B","question":"وفقًا لنظرية هرم ماسلو للاحتياجات، أي مما يلي يصف بشكل أفضل استراتيجية يقدم فيها المدير مهمة إلى مرؤوس لدعم نموه المهني وتقدمه المستقبلي بشكل خاص؟","options":[{"key":"A","letter":"أ","text":"التقدير من الزملاء."},{"key":"B","letter":"ب","text":"تحقيق الذات."},{"key":"C","letter":"ج","text":"سلسلة الانتماء في المنظمة."},{"key":"D","letter":"د","text":"أمن الوظيفة."}],"explanation":"أ. خطأ لأنه التقدير من الزملاء يتعلق بالاحتياجات الاجتماعية والتقدير وليس بالنمو المهني العميق.\n\nب. صحيح لأنه تحقيق الذات يرتبط بتطوير القدرات والنمو المهني وتحقيق الإمكانات الكاملة للفرد.\n\nج. خطأ لأنه الانتماء يتعلق بالعلاقات الاجتماعية داخل المنظمة وليس بالتطوير المهني المستقبلي.\n\nد. خطأ لأنه أمن الوظيفة يرتبط بالاستقرار الوظيفي وليس بالتطوير أو النمو المهني.","oldQNumber":"64","bankIndex":399,"setId":"set4"},{"id":"399","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"C","question":"كان لدى إحدى المنظمات ثلاث إدارات مركزية كبيرة: إدارة تستقبل طلبات العملاء لأعمال الخدمة، وإدارة تقوم بجدولة أعمال الخدمة في مواقع العملاء، وإدارة تجيب على اتصالات العملاء المتعلقة بمشكلات الخدمة. تمت إعادة هيكلة هذه الإدارات الثلاث إلى سبع مجموعات إقليمية، بحيث تقوم كل مجموعة بأداء جميع الوظائف الثلاث. ما إحدى المزايا الناتجة عن هذه إعادة الهيكلة؟","options":[{"key":"A","letter":"أ","text":"تحسين الرقابة الداخلية."},{"key":"B","letter":"ب","text":"تحقيق وفورات أكبر في الحجم."},{"key":"C","letter":"ج","text":"سير العمل السلس."},{"key":"D","letter":"د","text":"زيادة التخصص."}],"explanation":"أ. خطأ لأنه إعادة الهيكلة إلى وحدات إقليمية لا تعني بالضرورة تحسين الرقابة الداخلية بشكل مباشر.\n\nب. خطأ لأنه التقسيم الإقليمي غالبًا لا يحقق وفورات أكبر في الحجم مقارنة بالتجميع المركزي.\n\nج. صحيح لأنه دمج جميع الوظائف داخل كل مجموعة إقليمية يؤدي إلى تقليل التعقيد وتحسين تدفق العمل وسلاسته.\n\nد. خطأ لأنه هذا النوع من الهيكلة يقلل التخصص المركزي وليس يزيده.","oldQNumber":"69","bankIndex":400,"setId":"set4"},{"id":"404","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي مما يلي من المحتمل أن ينتج عن زيادة مركزية أنشطة المنظمة؟","options":[{"key":"A","letter":"أ","text":"سيتم اتخاذ عدد أكبر من القرارات المهمة على المستويات الأدنى في التسلسل الهرمي للمنظمة."},{"key":"B","letter":"ب","text":"سيتم اتخاذ عدد أقل من القرارات المهمة على المستويات الأدنى في التسلسل الهرمي للمنظمة."},{"key":"C","letter":"ج","text":"سيتم الاعتماد على عدد أكبر من أقسام المنظمة."},{"key":"D","letter":"د","text":"ستقوم الإدارة العليا بإجراء فحوصات أقل على عملية اتخاذ القرارات على المستوى الأدنى."}],"explanation":"أ. خطأ لأنه زيادة المركزية تعني تقليل صلاحيات المستويات الدنيا وليس زيادتها.\n\nب. صحيح لأنه كلما زادت المركزية تتركز القرارات في الإدارة العليا ويقل اتخاذ القرارات المهمة في المستويات الأدنى.\n\nج. خطأ لأنه المركزية لا تعني زيادة الاعتماد على الأقسام بل تقليل استقلاليتها.\n\nد. خطأ لأنه في المركزية عادة تزيد الرقابة من الإدارة العليا وليس تقل.","oldQNumber":"74","bankIndex":401,"setId":"set4"},{"id":"409","form":"form4","formTitle":"Group 4","lesson":"د- الهياكل و التحفيز","answer":"B","question":"مدير قادر على فهم أمور المشروع بشكل كامل لكنه غير قادر على التعامل مع الأهداف وتحقيقها؟","options":[{"key":"A","letter":"أ","text":"فشل الاتصال"},{"key":"B","letter":"ب","text":"فجوة المعرفة"},{"key":"C","letter":"ج","text":"فجوة المتابعة والإشراف"},{"key":"D","letter":"د","text":"فجوة الرقابة"}],"explanation":"أ. خطأ لأنه فشل الاتصال يتعلق بعدم وضوح أو نقل المعلومات وليس بفهم المشروع مقابل تحقيق الأهداف.\n\nب. صحيح لأنه فجوة المعرفة تعني وجود فهم نظري أو معلوماتي جيد للمشروع مع ضعف في القدرة على تحويله إلى تحقيق أهداف عملية.\n\nج. خطأ لأنه فجوة المتابعة والإشراف تتعلق بعدم مراقبة الأداء وليس بالقدرة على تحقيق الأهداف من المعرفة.\n\nد. خطأ لأنه فجوة الرقابة ترتبط بضعف أنظمة التحكم وليس بقدرة المدير الشخصية على التنفيذ.","oldQNumber":"79","bankIndex":402,"setId":"set4"},{"id":"416","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"يركز مجلس إدارة المنظمة بشكل خاص على وضع المنظمة كرائدة في الصناعة والتغلب على المنافسة ؟","options":[{"key":"A","letter":"أ","text":"التخلص من خطوط المنتجات المتوقع أن تحقق ربحية سلبية."},{"key":"B","letter":"ب","text":"زيادة تنوع الوحدات التجارية الاستراتيجية."},{"key":"C","letter":"ج","text":"زيادة الاستثمار في البحث والتطوير لمنتج جديد."},{"key":"D","letter":"د","text":"نقل تصنيع المؤسسة إلى دولة أخرى."}],"explanation":"أ. خطأ لأنه يركز على التخلص من المنتجات غير المربحة وليس على تحقيق الريادة في السوق.\n\nب. خطأ لأنه يوسع نطاق الأعمال، لكنه لا يساهم مباشرة في تحقيق ميزة تنافسية وريادة الصناعة.\n\nج. صحيح لأنه يساعد على تطوير منتجات جديدة وتحقيق الابتكار والتفوق على المنافسين.\n\nد. خطأ لأنه يهدف غالبًا إلى خفض التكاليف وليس إلى تحقيق الريادة في الصناعة.","oldQNumber":"6","bankIndex":403,"setId":"set5"},{"id":"421","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"تفكر منظمة في إسناد عملياتها التجارية المتعلقة بالرواتب ووظائف تقنية المعلومات إلى جهة خارجية. أي مجال القلق الأكثر أهمية للادارة فيما يتعلق بهذا الاتفاق المقترح؟","options":[{"key":"A","letter":"أ","text":"ضمان أن المدفوعات للمورد مناسبة وفي الوقت المناسب مقابل الخدمات المقدمة"},{"key":"B","letter":"ب","text":"ضمان أن المورد يتمتع بسيطرة إدارية كاملة على العملية المسندة إليه"},{"key":"C","letter":"ج","text":"ضمان وجود وسائل لمراقبة كفاءة العملية المسندة إلى الخارج"},{"key":"D","letter":"د","text":"ضمان وجود وسائل لمراقبة فعالية العملية المسندة إلى الخارج"}],"explanation":"أ. خطأ لأن الدفع للمورد مسألة مالية تشغيلية وليست الخطر الرئيسي في التعهيد.\n\nب. خطأ لأن منح المورد سيطرة كاملة غير مطلوب وقد يزيد المخاطر بدل تقليلها.\n\nج. خطأ لأن الكفاءة مهمة لكنها ليست الاعتبار الأعلى في إدارة مخاطر التعهيد.\n\nد. صحيح لأن الأهم في التعهيد هو التأكد من أن العملية تحقق أهدافها (الفعالية) وليس فقط تنفيذها بكفاءة، مع وجود آليات رقابة مناسبة لضمان ذلك.","oldQNumber":"11","bankIndex":404,"setId":"set5"},{"id":"426","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي من خطط التعافي من الكوارث التالية تتضمن موارد الاسترداد المتوفرة في الموقع، ولكن قد تحتاج إلى تكوينها لدعم نظام الإنتاج؟","options":[{"key":"A","letter":"أ","text":"خطة استعادة الموقع الدافئ"},{"key":"B","letter":"ب","text":"خطة استعادة الموقع الساخن"},{"key":"C","letter":"ج","text":"خطة استعادة الموقع البارد"},{"key":"D","letter":"د","text":"لا توجد خطة استرداد محددة."}],"explanation":"أ. صحيح لأنها توفر تجهيزات موجودة مسبقًا لكن تحتاج تهيئة قبل التشغيل الكامل.\nب. خطأ لأن الموقع الساخن يكون جاهزًا بالكامل.\nج. خطأ لأن الموقع البارد يحتاج تجهيز كامل من الصفر.\nد. خطأ لأنه في السؤال يوجد بالفعل خطة استرداد، لذلك لا ينطبق خيار عدم وجود خطة.","oldQNumber":"16","bankIndex":405,"setId":"set5"},{"id":"431","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي مما يلي ينطبق بشكل أفضل على مؤسسة تستخدم مشروعًا ، بدلاً من عملية ، لإنجاز أنشطتها التجارية؟","options":[{"key":"A","letter":"أ","text":"شركة الملابس تصمم وتصنع وتبيع منتجا جديدا"},{"key":"B","letter":"ب","text":"يتم التعاقد مع شركة إنشاءات تجارية لبناء مستودع."},{"key":"C","letter":"ج","text":"تقيم إدارة المدينة برنامج تدريب جديد لمكافحة الحرائق."},{"key":"D","letter":"د","text":"تحصل مؤسسة تصنيعية على أجزاء مكونة من مورد مقاول."}],"explanation":"أ. خطأ لأنه يمثل نشاطًا تشغيليًا متكررًا (تصميم وتصنيع وبيع) وليس مشروعًا محددًا بوقت ونهاية.\n\nب. صحيح لأنه يمثل مشروعًا له بداية ونهاية واضحة (بناء مستودع محدد).\n\nج. خطأ لأنه برنامج تدريبي قد يكون مستمرًا أو دوريًا وليس مشروعًا محددًا بوضوح مثل إنشاء أصل.\n\nد. خطأ لأنه يمثل عملية توريد تشغيلية مستمرة وليس مشروعًا.","oldQNumber":"21","bankIndex":406,"setId":"set5"},{"id":"436","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"قامت لجنة التدقيق التابعة لشركة عالمية بإجراء تغيير في سياسة أخلاقيات العمل الخاصة بالمنظمة أي من الأساليب التالية يصف أفضل طريقة لإنجاز انتشار السياسة فى جميع انحاء العالم ؟","options":[{"key":"A","letter":"أ","text":"نشر السياسة بلغة المقر الرئيسي للشركة بحيث يحصل كل شخص على نسخة غير مصفاة في نفس الوقت."},{"key":"B","letter":"ب","text":"التشاور مع الإدارة القانونية والتشغيلية في كل بلد متأثر لضمان إمكانية تنفيذ النسخة النهائية على الصعيد العالمي ، بعد موافقة لجنة التدقيق."},{"key":"C","letter":"ج","text":"تقديم منطقة السياسة حسب المنطقة ، باستخدام أي دروس مستفادة لتغيير النسخة اللاحقة من السياسة للمجال التالي"},{"key":"D","letter":"د","text":"إرسال النسخة المعتمدة من مجلس الإدارة للسياسة إلى القيادة العليا في كل بلد وتمكينهم من تكييف السياسة مع اللغة والثقافة المحلية."}],"explanation":"أ. خطأ لأنه يتجاهل اختلاف الأنظمة المحلية ولا يضمن الامتثال القانوني في جميع الدول.\n\nب. صحيح لأنه يضمن توحيد السياسة مع مراعاة المتطلبات القانونية والتشغيلية في كل بلد قبل التنفيذ العالمي.\n\nج. خطأ لأنه أسلوب تدريجي غير منظم وقد يؤدي إلى عدم الاتساق في التطبيق العالمي.\n\nد. خطأ لأنه يسمح بتعديل السياسة محليًا مما قد يؤدي إلى فقدان الاتساق العالمي في السياسة.","oldQNumber":"26","bankIndex":407,"setId":"set5"},{"id":"441","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"اي من الافعال التالية سيقوم بها قائد المجموعة لاتخاذ قرارات مبتكرة؟","options":[{"key":"A","letter":"أ","text":"قمع الآراء التي تخلق الصراع في المجموعة"},{"key":"B","letter":"ب","text":"تشجيع أو إثراء أو تجميع النقاش بين أعضاء المجموعة"},{"key":"C","letter":"ج","text":"ضمان أعضاء المجموعة لمستويات الخبرة"},{"key":"D","letter":"د","text":"التأكيد على أهمية الانسجام في وحدة المجموعة"}],"explanation":"أ. خطأ لأن قمع الآراء يقلل من تنوع الأفكار ويضعف الابتكار.\n\nب. صحيح لأن الابتكار يعتمد على تبادل الأفكار، النقاش المفتوح، وتجميع وجهات النظر المختلفة للوصول إلى حلول أفضل.\n\nج. خطأ لأن وجود الخبرة مهم لكنه لا يضمن اتخاذ قرارات مبتكرة بحد ذاته.\n\nد. خطأ لأن التركيز على الانسجام فقط قد يحد من النقاش النقدي الضروري للابتكار.","oldQNumber":"31","bankIndex":408,"setId":"set5"},{"id":"446","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"عند تقييم خدمات مركز المساعدة التي يقدمها مزود خدمة تابع لطرف ثالث، ما الذي يحتمل أن يكون مصدر قلق المدقق الداخلي الأكبر؟","options":[{"key":"A","letter":"أ","text":"ما إذا كان كل اتصال تلقاه مقدم الخدمة قد تم تسجيله بواسطة مركز المساعدة."},{"key":"B","letter":"ب","text":"ما إذا تم تخصيص رقم تعريف فريد لكل مشكلة حددها مقدم الخدمة."},{"key":"C","letter":"ج","text":"ما إذا كان مقدم الخدمة يستخدم مرافقه الخاصة لتقديم خدمات مركز المساعدة."},{"key":"D","letter":"د","text":"ما إذا كانت ردود وتقارير مقدم الخدمة محددة جيدًا وفقًا لاتفاقية مستوى الخدمة."}],"explanation":"أ. خطأ لأنه إجراء تشغيلي، وعدم تسجيل كل اتصال لا يمثل أعلى مستوى من المخاطر الرقابية مقارنة بالالتزام التعاقدي.\n\nب. خطأ لأنه يتعلق بالتتبع الداخلي للحالات وهو مهم لكنه ليس أكبر مصدر قلق استراتيجي.\n\nج. خطأ لأن استخدام مرافق خاصة بالمورد لا يعد بحد ذاته مشكلة رقابية أساسية.\n\nد. صحيح لأنه يمثل جوهر الرقابة على مزود الخدمة، حيث أن الالتزام باتفاقية مستوى الخدمة (SLA) يحدد جودة الخدمة وقياس الأداء بشكل مباشر.","oldQNumber":"36","bankIndex":409,"setId":"set5"},{"id":"451","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"اي نوع من انواع التعهيد الخارجي في مجال تكنولوجيا المعلومات الذي يتضمن الاستضافة المادية للحواسيب الرئيسية كما يمكن ان يسمح للشركة بمواصلة عملياتها في حال وقوع كارثة ما ؟","options":[{"key":"A","letter":"أ","text":"تطوير وصيانة التطبيقات ."},{"key":"B","letter":"ب","text":"الدعم الفني ."},{"key":"C","letter":"ج","text":"الامن المدار"},{"key":"D","letter":"د","text":"ادارة مركز البيانات ."}],"explanation":"أ. خطأ لأنها تتعلق بتطوير البرمجيات وصيانتها وليس باستضافة البنية التحتية المادية.\n\nب. خطأ لأنها خدمة دعم للمستخدمين وليس استضافة أو تشغيل مراكز بيانات.\n\nج. خطأ لأنها تركز على حماية الأنظمة والمعلومات وليس استضافة الحواسيب الرئيسية.\n\nد. صحيح لأنها تشمل إدارة وتشغيل البنية التحتية لمراكز البيانات بما في ذلك الاستضافة المادية ودعم استمرارية الأعمال في حال الكوارث.","oldQNumber":"41","bankIndex":410,"setId":"set5"},{"id":"456","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"وفقًا لإرشادات المعهد الدولي للمدققين الداخليين بشأن تكنولوجيا المعلومات، أي من الخطط التالية يقترن بتحديد العمليات التجارية الحرجة بأهداف وقت الاسترداد؟","options":[{"key":"A","letter":"أ","text":"وثيقة تأسيس إدارة استمرارية الأعمال."},{"key":"B","letter":"ب","text":"خطة تقييم مخاطر استمرارية الأعمال."},{"key":"C","letter":"ج","text":"خطة تحليل تأثير الأعمال (BIA) The business Impact analysis plan ."},{"key":"D","letter":"د","text":"القضية التجارية لتخطيط استمرارية الأعمال."}],"explanation":"أ. خطأ لأنها تحدد إطار استمرارية الأعمال ومسؤولياته، ولا تحدد أهداف وقت الاسترداد.\n\nب. خطأ لأنها تركز على تحديد وتقييم المخاطر التي قد تؤثر على استمرارية الأعمال.\n\nج. صحيح لأنها تحدد العمليات الحرجة وتأثير تعطلها وأهداف وقت الاسترداد اللازمة لها.\n\nد. خطأ لأنها تبرر الحاجة إلى برنامج استمرارية الأعمال ولا تحدد أهداف وقت الاسترداد.","oldQNumber":"46","bankIndex":411,"setId":"set5"},{"id":"461","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"استنادًا إلى نتائج الاختبارات، خلص مدقق تقنية المعلومات إلى أن المنظمة ستعاني من فقدان غير مقبول للبيانات في حالة حدوث كارثة في مركز البيانات الخاص بها. أي من نتائج الاختبار التالية من المحتمل أن تقود المدقق إلى هذا الاستنتاج؟","options":[{"key":"A","letter":"أ","text":"لم يتم إعادة أشرطة النسخ الاحتياطية المطلوبة من البائع الخارجي في الوقت المناسب."},{"key":"B","letter":"ب","text":"تحتوي أشرطة النسخ الاحتياطية التي أعادها البائع الخارجي على مساحات فارغة."},{"key":"C","letter":"ج","text":"يتم نسخ أنظمة البنية التحتية الحرجة بشكل أكثر من اللازم."},{"key":"D","letter":"د","text":"يتم نقل أشرطة النسخ الاحتياطية لأنظمة البنية التحتية الحرجة خارج الموقع بشكل أقل من المطلوب."}],"explanation":"أ. خطأ لأنه يشير إلى تأخير إداري في استلام النسخ الاحتياطية وليس فقدان بيانات فعلي.\n\nب. خطأ لأنه يشير إلى مشكلة في محتوى النسخ الاحتياطية، لكن لا يثبت بشكل مباشر خطر فقدان بيانات واسع النطاق.\n\nج. خطأ لأنه يشير إلى زيادة النسخ الاحتياطي وليس فقدان البيانات.\n\nد. صحيح لأنه يدل على عدم كفاية تخزين النسخ الاحتياطية خارج الموقع، مما يزيد احتمال فقدان غير مقبول للبيانات عند حدوث كارثة.","oldQNumber":"51","bankIndex":412,"setId":"set5"},{"id":"466","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"طلب مجلس الإدارة أن يشارك نشاط المراجعة الداخلية للحسابات في جميع مراحل الاستعانة بمصادر خارجية لإدارة الشبكة الخاصة بالمنظمة. وخلال أي مرحلة من المراحل التالية من المرجح أن يتحقق المراجع الداخلي للحسابات من أن بند حق المنظمة في مراجعة الحسابات قد صيغ بشكل فعال؟","options":[{"key":"A","letter":"أ","text":"مرحلة التنفيذ ومرحلة الإنشاء"},{"key":"B","letter":"ب","text":"مرحلة الرصد والإبلاغ"},{"key":"C","letter":"ج","text":"مرحلة اتخاذ القرار ومرحلة دراسة الحالة التجارية"},{"key":"D","letter":"د","text":"مرحلة المناقصات والتعاقدات"}],"explanation":"أ. خطأ لأنها مرحلة تنفيذ الخدمة وليست مرحلة صياغة الشروط التعاقدية.\n\nب. خطأ لأنها مرحلة متابعة الأداء بعد توقيع العقد وليس مرحلة إعداد البنود.\n\nج. خطأ لأنها مرحلة تقييم القرار وليس صياغة أو تضمين شروط التدقيق في العقد.\n\nد. صحيح لأنها المرحلة التي يتم فيها إعداد العقد وتضمين البنود الأساسية مثل “حق التدقيق” والتأكد من صياغتها بشكل فعال وقابل للتنفيذ.","oldQNumber":"56","bankIndex":413,"setId":"set5"},{"id":"471","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"ما هي إحدى النتائج المحتملة للاستعانة بمصادر خارجية؟","options":[{"key":"A","letter":"أ","text":"زيادة الاعتماد على الموردين."},{"key":"B","letter":"ب","text":"تزايد أهمية استراتيجية السوق."},{"key":"C","letter":"ج","text":"انخفاض الحساسية للوائح الحكومية."},{"key":"D","letter":"د","text":"انخفاض التركيز على التكاليف."}],"explanation":"أ. خطأ لأن الاستعانة بمصادر خارجية عادةً تزيد الاعتماد على الموردين الخارجيين.\n\nب. خطأ لأنه قد يؤثر على استراتيجية السوق لكنه ليس نتيجة مباشرة أساسية للاستعانة بمصادر خارجية.\n\nج. خطأ لأن اللوائح الحكومية تبقى مؤثرة ولا تنخفض حساسيتها بسبب الاستعانة بمصادر خارجية.\n\nد. صحيح لأنه عند الاستعانة بمصادر خارجية يتم التركيز أكثر على الجودة والخدمة وليس فقط على تقليل التكلفة.","oldQNumber":"61","bankIndex":414,"setId":"set5"},{"id":"476","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي من استراتيجيات التواصل التالية من شأنها أن تعزز بشكل أفضل ثقافة تحافظ على تناسق المعلومات بين الإدارة وأعضاء الفريق في عملية صنع القرار؟","options":[{"key":"A","letter":"أ","text":"الاتصال التصاعدي"},{"key":"B","letter":"ب","text":"الاتصال اللامركزي"},{"key":"C","letter":"ج","text":"الاتصال التنازلي"},{"key":"D","letter":"د","text":"الاتصال المركزية"}],"explanation":"أ. خطأ لأن الاتصال التصاعدي يكون من الموظفين إلى الإدارة فقط ولا يضمن تدفقًا متوازنًا للمعلومات.\n\nب. صحيح لأن الاتصال اللامركزي يسمح بتبادل المعلومات بين الإدارة وأعضاء الفريق بشكل مرن ومتبادل، مما يعزز الاتساق في المعلومات ودعم القرار.\n\nج. خطأ لأن الاتصال التنازلي يكون من الإدارة إلى الموظفين فقط ولا يدعم تبادل المعلومات.\n\nد. خطأ لأن “الاتصال المركزية” تعني تركيز القرار والمعلومات في جهة واحدة، مما يقلل من تدفق المعلومات والتناسق بين الأطراف.","oldQNumber":"66","bankIndex":415,"setId":"set5"},{"id":"481","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من المواقع التالية من المرجح أن يستخدمها مزود خدمة الإنترنت لاستعادة العمليات بعد تعرض خوادمه لتلف بسبب كارثة طبيعية؟","options":[{"key":"A","letter":"أ","text":"الموقع الموجود بالمكان."},{"key":"B","letter":"ب","text":"الموقع البارد."},{"key":"C","letter":"ج","text":"الموقع الساخن."},{"key":"D","letter":"د","text":"الموقع الدافئ."}],"explanation":"أ. خطأ لأنه يعني الاعتماد على نفس الموقع المتضرر، وهو غير مناسب بعد كارثة طبيعية.\n\nب. خطأ لأنه يحتاج وقتًا طويلًا للتجهيز ولا يدعم استعادة فورية للخدمات.\n\nج. صحيح لأنه موقع جاهز بالكامل ومطابق للبيئة الأصلية ويمكن استخدامه فورًا لاستعادة العمليات بسرعة عالية.\n\nد. خطأ لأنه يتطلب تجهيزات إضافية قبل التشغيل، وبالتالي ليس الأسرع لاستعادة الخدمة.","oldQNumber":"71","bankIndex":416,"setId":"set5"},{"id":"486","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أي من خيارات التخزين التالية يمنح المؤسسة أفضل فرصة لاستعادة البيانات؟","options":[{"key":"A","letter":"أ","text":"نسخ مادية مشفرة للبيانات، ومفاتيح التشفير الخاصة بها مخزنة معًا في المؤسسة ومتاحة بسهولة عند الطلب."},{"key":"B","letter":"ب","text":"يتم تخزين نسخ مادية مشفرة من البيانات بشكل منفصل عن مفاتيح التشفير الخاصة بها، ويحتفظ بها كلاهما في مواقع آمنة على بعد ساعات قليلة من المؤسسة."},{"key":"C","letter":"ج","text":"يتم تخزين التقارير المشفرة حول الاستخدام وتغييرات بنية قاعدة البيانات على قاعدة بيانات آمنة قائمة على السحابة ويمكن الوصول إليها بسهولة."},{"key":"D","letter":"د","text":"يتم تخزين نسخ مشفرة من البيانات في موقع آمن منفصل على بعد ساعات قليلة، بينما يتم تخزين مفاتيح التشفير في المؤسسة ومتاحة بسهولة."}],"explanation":"أ. خطأ لأنه وجود البيانات ومفاتيح التشفير في نفس الموقع يزيد من خطر فقدانها معًا في حال حدوث حادث.\n\nب. خطأ لأنه رغم فصل البيانات عن المفاتيح، إلا أن بعد المواقع وساعات الوصول يجعل الاستعادة أبطأ وأقل كفاءة.\n\nج. خطأ لأنه لا يمثل نسخًا احتياطية فعلية قابلة للاستعادة للبيانات التشغيلية.\n\nد. صحيح لأنه يحقق توازنًا بين الأمان وإمكانية الاستعادة من خلال فصل البيانات عن المفاتيح وتوفير وصول مناسب للاسترجاع.","oldQNumber":"77","bankIndex":417,"setId":"set5"},{"id":"491","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"بأي من الخطوات التالية تبدأ عملية التخطيط الاستراتيجي للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"الأهداف الاستراتيجية"},{"key":"B","letter":"ب","text":"المهمة الرسمية"},{"key":"C","letter":"ج","text":"الحالة المستقبلية المرجوة"},{"key":"D","letter":"د","text":"صياغة الاستراتيجية"}],"explanation":"أ. خطأ لأن الأهداف الاستراتيجية تأتي بعد تحديد الرسالة وتوجيهها.\n\nب. صحيح لانه تبدأ عملية التخطيط الاستراتيجي بالمهمة الرسمية لأنها توضح سبب وجود المؤسسة، ومن خلالها يتم تحديد الأهداف والخطط التي ستعمل المؤسسة على تحقيقها.\n\nج. خطأ لأن الحالة المستقبلية المرجوة (Vision) تُبنى لاحقًا كتصور مستقبلي وليست البداية الرسمية.\n\nد. خطأ لأن صياغة الاستراتيجية تأتي بعد تحديد الرسالة والرؤية والأهداف.","oldQNumber":"82","bankIndex":418,"setId":"set5"},{"id":"496","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من الأعمال التالية من المرجح أن يتم تناولها من خلال إستراتيجية مستوى الأعمال الخاصة بمؤسسة التصنيع، والتي تخضع للمنافسة؟","options":[{"key":"A","letter":"أ","text":"السعي وراء مشروع مشترك مع منظمة أخرى"},{"key":"B","letter":"ب","text":"اكتساب عمل جديد"},{"key":"C","letter":"ج","text":"مدى البحث والتطوير"},{"key":"D","letter":"د","text":"إنشاء مصانع جديدة"}],"explanation":"أ. خطأ لأنها تتعلق باستراتيجية على مستوى الشركة مثل التحالفات والمشاريع المشتركة.\n\nب. خطأ لأنها تمثل نموًا وتوسعًا على مستوى الشركة وليس مستوى الأعمال.\n\nج. صحيح لأن استراتيجية مستوى الأعمال تركز على كيفية التنافس في السوق، ويُعد تحديد مستوى البحث والتطوير جزءًا من كيفية بناء الميزة التنافسية.\n\nد. خطأ لأنها قرار استثماري وتشغيلي على مستوى الشركة والبنية التحتية وليس على مستوى الأعمال التنافسية.","oldQNumber":"87","bankIndex":419,"setId":"set5"},{"id":"501","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"طورت عدة منظمات استراتيجية لافتتاح مراكز تسوق مشتركة الملكية؟","options":[{"key":"A","letter":"أ","text":"استغلال الكفاءة الأساسية."},{"key":"B","letter":"ب","text":"زيادة تآزر /تكامل السوق."},{"key":"C","letter":"ج","text":"تقديم قيمة محسنة."},{"key":"D","letter":"د","text":"خفض التكاليف."}],"explanation":"أ. خطأ لأنه يركز على استخدام قدرات المنظمة الداخلية وليس على التعاون بين عدة منظمات.\n\nب. صحيح لأنه إنشاء مراكز تسوق مشتركة الملكية يهدف إلى تحقيق تكامل وتآزر بين المنظمات في السوق.\n\nج. خطأ لأنه نتيجة محتملة للتعاون وليس الهدف الاستراتيجي المباشر في هذا السيناريو.\n\nد. خطأ لأنه قد يحدث بشكل غير مباشر لكنه ليس الهدف الأساسي من الشراكة المشتركة.","oldQNumber":"92","bankIndex":420,"setId":"set5"},{"id":"506","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"تم منح فني في المنظمة دورًا يتيح له تحديد أولويات المشاريع في جميع أنحاء المنظمة. أي نوع من السلطة سيمارس الفني على الأرجح؟","options":[{"key":"A","letter":"أ","text":"سلطة مشروعة."},{"key":"B","letter":"ب","text":"سلطة إكراهية."},{"key":"C","letter":"ج","text":"سلطة مرجعية."},{"key":"D","letter":"د","text":"سلطة الخبراء."}],"explanation":"أ. خطأ لأنها ترتبط بالمركز الوظيفي الرسمي وليس بقدرة الشخص على تحديد الأولويات بناءً على معرفته.\n\nب. خطأ لأنها تعتمد على فرض السيطرة أو العقاب وليس على تحديد أولويات المشاريع.\n\nج. خطأ لأنها تعتمد على التأثير الشخصي والعلاقات وليس على المعرفة الفنية.\n\nد. صحيح لأنها تعتمد على المعرفة والخبرة الفنية التي تمكّن الفني من تقييم المشاريع وتحديد أولوياتها بشكل أفضل.","oldQNumber":"97","bankIndex":421,"setId":"set5"},{"id":"511","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"ما هو مطلوب في إدارة تغييرات تكنولوجيا المعلومات الفعالة؟","options":[{"key":"A","letter":"أ","text":"يتم تخصيص المسؤولية الوحيدة لإدارة التغيير لفريق تكنولوجيا المعلومات ذو الخبرة والكفاءة."},{"key":"B","letter":"ب","text":"تتبع إدارة التغيير عملية ثابتة ويتم تنفيذها في بيئة تخضع للرقابة."},{"key":"C","letter":"ج","text":"يشارك التدقيق الداخلي في تنفيذ إدارة التغيير في جميع أنحاء المنظمة."},{"key":"D","letter":"د","text":"يجب الموافقة على جميع التغييرات التي تطرأ على الأنظمة من قبل أعلى مستوى من السلطة داخل المنظمة."}],"explanation":"أ. خطأ لأنه إدارة التغيير ليست مسؤولية فريق واحد فقط، بل عملية تنظيمية تشمل عدة أطراف.\n\nب. صحيح لأنه يجب أن تكون إدارة التغيير منظمة، موحدة، وتتم ضمن بيئة خاضعة للرقابة لتقليل المخاطر.\n\nج. خطأ لأن التدقيق الداخلي لا يشارك في التنفيذ بل في التقييم والرقابة فقط.\n\nد. خطأ لأن ليس كل التغييرات تحتاج موافقة أعلى سلطة، بل حسب درجة المخاطر والأهمية.","oldQNumber":"102","bankIndex":422,"setId":"set5"},{"id":"516","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أي من العناصر التالية يصف بشكل أفضل استراتيجية الاستعانة بمصادر خارجية؟","options":[{"key":"A","letter":"أ","text":"تكليف العمل لمقدمي الخدمات الخارجية للحصول على تكاليف أقل."},{"key":"B","letter":"ب","text":"وظائف التعاقد او العمل المرتبطة بالمعرفة مع مزود خدمة خارجي."},{"key":"C","letter":"ج","text":"التعاقد على تشغيل بعض وظائف الأعمال مع مزود خدمة داخلي."},{"key":"D","letter":"د","text":"التعاقد مع مزود خدمة خارجي محدد للعمل مع مزود خدمة داخلي."}],"explanation":"أ. خطأ لأنه يركز فقط على خفض التكلفة وليس تعريف الاستعانة بمصادر خارجية بشكل كامل.\n\nب. صحيح لأنه يصف الاستعانة بمصادر خارجية بشكل عام وهو نقل وظائف أو أعمال إلى مزود خدمة خارجي.\n\nج. خطأ لأنه يتحدث عن مزود داخلي وليس خارجي وبالتالي لا يمثل الاستعانة بمصادر خارجية.\n\nد. خطأ لأنه يصف نموذج تعاون وليس استقدام خدمات خارجية بشكل كامل.","oldQNumber":"108","bankIndex":423,"setId":"set5"},{"id":"521","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"السبب الرئيسي لإنشاء ضوابط داخلية في المنظمة هو ؟","options":[{"key":"A","letter":"أ","text":"تقديم تأكيد معقول بشأن تحقيق الأهداف"},{"key":"B","letter":"ب","text":"حماية موارد المنظمة"},{"key":"C","letter":"ج","text":"من دقة المعلومات وموثوقيتها وحسن توقيتها ."},{"key":"D","letter":"د","text":"تشجيع الامتثال للسياسات والإجراءات."}],"explanation":"أ. صحيح لأنه الهدف الأساسي للضوابط الداخلية هو توفير تأكيد معقول بأن المنظمة ستحقق أهدافها التشغيلية والتقارير والامتثال.\n\nب. خطأ لأنها هدف فرعي ضمن حماية الأصول وليست الهدف الرئيسي.\n\nج. خطأ لأنها جزء من أهداف التقارير المالية وليست الغرض الأساسي الشامل للضوابط.\n\nد. خطأ لأنها تمثل جانب الامتثال فقط وليست الهدف العام للرقابة الداخلية.","oldQNumber":"113","bankIndex":424,"setId":"set5"},{"id":"526","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"في إحدى المنظمات، تلزم الشروط المحددة للعقد كلاً من الواعد والوعد بتوقيع العقد بحضور شاهد مستقل. ما هو الدور الأساسي للشاهد على هذه التوقيعات؟","options":[{"key":"A","letter":"أ","text":"يتحقق الشاهد من كميات النسخ الموقعة."},{"key":"B","letter":"ب","text":"يتحقق الشاهد من أن العقد قد تم توقيعه برضا الواعد والوعد بحرية."},{"key":"C","letter":"ج","text":"يضمن الشاهد اكتمال العقد بين الواعد والوعد."},{"key":"D","letter":"د","text":"يتحقق الشاهد من صحة توقيعات العقد التي وضعها الواعد والوعد."}],"explanation":"أ. خطأ لأن الشاهد لا يراجع عدد النسخ بل يراقب عملية التوقيع نفسها.\n\nب. صحيح لأنه الدور الأساسي للشاهد هو التأكد من أن التوقيع تم بحرية ودون إكراه من الطرفين.\n\nج. خطأ لأن الشاهد لا يضمن اكتمال العقد أو صحته القانونية بالكامل.\n\nد. خطأ لأن التحقق من صحة التوقيع قد يكون دور جهة قانونية أو تحقق تقني وليس الدور الأساسي للشاهد.","oldQNumber":"118","bankIndex":425,"setId":"set5"},{"id":"531","form":"form4","formTitle":"Group 4","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي مما يلي صحيح في دورة حياة تطوير الأنظمة ؟","options":[{"key":"A","letter":"أ","text":"يطبق على كلا النظامين الداخلية والخارجية"},{"key":"B","letter":"ب","text":"يبدأ بمرحلة التصميم"},{"key":"C","letter":"ج","text":"ينتهي بمرحلة الاختبار"},{"key":"D","letter":"د","text":"قد يكون بمثاية بديل لادارة التغيير"}],"explanation":"أ. صحيح لأن دورة حياة تطوير الأنظمة (SDLC) تُستخدم لتطوير الأنظمة الداخلية والخارجية على حد سواء.\n\nب. خطأ لأنها تبدأ عادةً بتحليل المتطلبات وليس التصميم.\n\nج. خطأ لأنها لا تنتهي بالاختبار بل تنتهي بالتشغيل والصيانة.\n\nد. خطأ لأنها لا تعتبر بديلًا عن إدارة التغيير بل جزءًا من إطارها.","oldQNumber":"123","bankIndex":426,"setId":"set5"},{"id":"9","form":"form5","formTitle":"Group 5","lesson":"أ- تحليل البيانات","answer":"B","question":"اي مما يلي يعد من فوائد تحليل البيانات للمدقق الداخلي","options":[{"key":"A","letter":"أ","text":"يسهل تدعي
