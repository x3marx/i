 مخاطر المعاملات ترتبط بالأخطاء في العمليات أو تنفيذ العقود وليس بمواءمة الأهداف.\n\nج. صحيح لأن عدم توافق عقد الاستعانة بمصادر خارجية مع أهداف المؤسسة يشير إلى فشل في المواءمة الاستراتيجية، وهو خطر استراتيجي.\n\nد. خطأ لأن المخاطر التشغيلية تتعلق بتنفيذ العمليات اليومية وليس بتحديد الأهداف أو مواءمتها.","oldQNumber":"18","bankIndex":87,"setId":"set5"},{"id":"433","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"تفكر منظمة في دمج أنشطة الحوكمة والمخاطر والامتثال (GRC) في مورد مركزي قائم على التكنولوجيا. عند تنفيذ مورد GRC هذا، ما هو الشاغل الرئيسي في حوكمة المؤسسة الذي يجب أن يتحقق منه المنتج النهائي؟","options":[{"key":"A","letter":"أ","text":"يجب أن يكون مجلس الإدارة راضياً تماماً عن وجود نظام فعال للحوكمة من خلال معلومات دقيقة وذات جودة."},{"key":"B","letter":"ب","text":"يمكن لقسم الامتثال والمراجعة وإدارة المخاطر العثور على وترشيد الكفاءات بين وظائفهم من خلال تقارير المعلومات المتكاملة."},{"key":"C","letter":"ج","text":"يمكن تتبع ومقارنة مؤشرات الامتثال والمخاطر الرئيسية في جميع أنحاء المؤسسة، مما يساعد في تحديد الإدارات التي تعاني من مشاكل."},{"key":"D","letter":"د","text":"يمكن الاستفادة من تحليلات البيانات لاتجاه البيانات لضمان ظهور الأنماط والمراقبة المستمرة في جميع أنحاء المؤسسة."}],"explanation":"أ. صحيح لأن الهدف الأساسي من حوكمة GRC هو تمكين مجلس الإدارة من الحصول على معلومات دقيقة وموثوقة تساعده في الإشراف واتخاذ قرارات فعالة.\n\nب. خطأ لأنها تركز على كفاءة الإدارات الداخلية وليس على الهدف الأعلى للحوكمة.\n\nج. خطأ لأنها تتعلق بالتشغيل والمراقبة لكنها لا تعكس الهدف الاستراتيجي للحوكمة.\n\nد. خطأ لأنها تركز على التحليل التقني للبيانات وليس على احتياجات الحوكمة على مستوى مجلس الإدارة.","oldQNumber":"23","bankIndex":88,"setId":"set5"},{"id":"438","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"أي من التدابير التالية هو الأفضل لضمان تعافي المؤسسة بسرعة في حال حدوث خلل في عملياتها؟","options":[{"key":"A","letter":"أ","text":"خطة شاملة للتعافي من الكوارث تمت الموافقة عليها من الإدارة العليا"},{"key":"B","letter":"ب","text":"وعي الموظف بمسؤولياته في حال وقوع كارثة"},{"key":"C","letter":"ج","text":"منشأة للتعافي من الكوارث خارج الموقع في موقع جغرافي مختلف"},{"key":"D","letter":"د","text":"خطة التعافي التي تم تقييمها بشكل دوري مقابل الأهداف"}],"explanation":"أ. خطأ لأن وجود خطة معتمدة مهم لكنه لا يضمن فعاليتها الفعلية عند التطبيق.\n\nب. خطأ لأن الوعي وحده لا يكفي لضمان التعافي السريع دون خطة فعالة ومُختبرة.\n\nج. خطأ لأن وجود منشأة خارج الموقع يساعد لكنه لا يضمن أن الخطة فعالة أو قابلة للتطبيق.\n\nد. صحيح لأن تقييم خطة التعافي بشكل دوري مقابل الأهداف يضمن فعاليتها، تحديثها باستمرار، وجاهزيتها لتحقيق التعافي السريع عند حدوث خلل.","oldQNumber":"28","bankIndex":89,"setId":"set5"},{"id":"443","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"تعتمد شركة تورد الأدوية للمستشفيات الكبيرة بشكل كبير على المقاولين من الباطن لتجديد أي نقص خلال 24 ساعة. أين يجب أن يبحث المراجعون الداخليون عن أدلة على أن المقاولين من الباطن مسؤولون عن هذا الالتزام؟","options":[{"key":"A","letter":"أ","text":"مدونة قواعد الأخلاقيات للشركة."},{"key":"B","letter":"ب","text":"سجل مخاطر إدارة الطرف الثالث."},{"key":"C","letter":"ج","text":"اتفاقية مستوى الخدمة الموقعة."},{"key":"D","letter":"د","text":"استطلاع رضى المقاولين من الباطن السنوي."}],"explanation":"أ. خطأ لأنها تحدد المبادئ والسلوكيات العامة ولا تتضمن التزامات تشغيلية محددة.\n\nب. خطأ لأنه يحدد المخاطر ولا يثبت وجود التزام تعاقدي.\n\nج. صحيح لأنها الوثيقة الرسمية التي تحدد التزامات الموردين والمقاولين من الباطن مثل زمن التوريد (24 ساعة).\n\nد. خطأ لأنه يقيس الرضا وليس الالتزامات التعاقدية أو الأداء المطلوب.","oldQNumber":"33","bankIndex":90,"setId":"set5"},{"id":"448","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من المؤشرات التالية يعد دليلاً على وجود سيطرة قوية على تكاليف المشروع؟","options":[{"key":"A","letter":"أ","text":"تم إعداد موازنة المشروع والموافقة عليها"},{"key":"B","letter":"ب","text":"تقع تكاليف المشروع بدقة ضمن الموازنة المخططة"},{"key":"C","letter":"ج","text":"يتم البحث في الانحرافات الإيجابية والسلبية وشرحها"},{"key":"D","letter":"د","text":"يتم تخصيص تقديرات التكاليف للأنشطة المحددة بشكل صحيح"}],"explanation":"أ. خطأ لأن إعداد الموازنة فقط لا يدل على وجود رقابة فعالة على التكاليف.\n\nب. خطأ لأن الالتزام بالموازنة قد يحدث صدفة ولا يعكس وجود نظام رقابة وتحليل.\n\nج. صحيح لأن تحليل الانحرافات (Variance Analysis) وتفسيرها يدل على وجود نظام رقابة قوي وفعال على تكاليف المشروع.\n\nد. خطأ لأن تخصيص التكاليف للأنشطة هو جزء من التخطيط وليس دليلًا على التحكم الفعلي بالتكاليف.","oldQNumber":"38","bankIndex":91,"setId":"set5"},{"id":"453","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي مما يلي يصف بشكل أفضل موقع النسخ الاحتياطي المزود بالأجهزة والاتصال بالفعل على الرغم من أنه على نطاق أصغر من موقع الإنتاج الأصلي؟","options":[{"key":"A","letter":"أ","text":"موقع ساخن"},{"key":"B","letter":"ب","text":"موقع دافئ"},{"key":"C","letter":"ج","text":"الموقع البارد"},{"key":"D","letter":"د","text":"موقع احتياطي"}],"explanation":"أ. صحيح لأنه الموقع الساخن يكون مجهزًا بالكامل بالأجهزة والاتصالات وغالبًا يكون مطابقًا لموقع الإنتاج ولكن قد يعمل على نطاق أصغر أو قدرة أقل.\n\nب. خطأ لأن الموقع الدافئ يحتوي تجهيزات جزئية ويحتاج إعداد قبل التشغيل الكامل.\n\nج. خطأ لأن الموقع البارد لا يحتوي على تجهيزات مسبقة ويحتاج تجهيز كامل بعد الكارثة.\n\nد. خطأ لأنه ليس تصنيفًا رسميًا ضمن أنواع مواقع التعافي من الكوارث.","oldQNumber":"43","bankIndex":92,"setId":"set5"},{"id":"458","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"وفقًا لإرشادات معهد مراجعي الحسابات الداخليين، أي مما يلي يمثل خطرًا نموذجيًا مرتبطًا بعملية المناقصة ومرحلة التعاقد في دورة حياة الاستعانة بمصادر خارجية لتكنولوجيا المعلومات في المؤسسة؟","options":[{"key":"A","letter":"أ","text":"عدم استدامة العملية وعدم تحسينها كما هو مخطط لها."},{"key":"B","letter":"ب","text":"هناك نقص في المواءمة مع الاستراتيجيات التنظيمية."},{"key":"C","letter":"ج","text":"الجودة التشغيلية أقل من المتوقع."},{"key":"D","letter":"د","text":"هناك احتمال متزايد لفقدان الأصول."}],"explanation":"أ. خطأ لأنه يرتبط بمرحلة ما بعد التعاقد والتشغيل (الأداء والاستدامة).\n\nب. خطأ لأنه يمثل خطرًا استراتيجيًا يظهر قبل أو أثناء التخطيط وليس أثناء المناقصة والتعاقد.\n\nج. خطأ لأنه يرتبط بمرحلة التشغيل وتقديم الخدمة وليس مرحلة التعاقد.\n\nد. صحيح لأنه في مرحلة المناقصة والتعاقد يكون الخطر الأساسي هو حماية الأصول والبيانات عند نقلها إلى طرف خارجي، مما يزيد احتمال فقدانها أو إساءة استخدامها.","oldQNumber":"48","bankIndex":93,"setId":"set5"},{"id":"463","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"يوحد موقع للنسخ الاحتياطي ومجهز ويتم المزامنة الالية ولكن الموقع يقع على مسافة قريبة من الموقع الأصلي أي نوع من أنواع التعافى استخدمته المؤسسة ؟","options":[{"key":"A","letter":"أ","text":"موقع ساخن"},{"key":"B","letter":"ب","text":"موقع بارد"},{"key":"C","letter":"ج","text":"موقع دافئ"},{"key":"D","letter":"د","text":"عدم وجود خطة استعادة."}],"explanation":"أ. صحيح لأنه الموقع الساخن يكون مجهزًا بالكامل مع مزامنة شبه فورية للبيانات، حتى لو كان قريبًا جغرافيًا من الموقع الأصلي فإنه يظل يعمل كبيئة تشغيل جاهزة.\n\nب. خطأ لأنه الموقع البارد لا يحتوي على تجهيزات أو مزامنة بيانات.\n\nج. خطأ لأنه الموقع الدافئ يحتوي تجهيزات جزئية وليس مزامنة كاملة.\n\nد. خطأ لأنه يوجد بالفعل موقع استعادة مجهز وبالتالي توجد خطة تعافي.","oldQNumber":"53","bankIndex":94,"setId":"set5"},{"id":"468","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي مما يلي يعتبر سمة نموذجية لدورة حياة المشروع؟","options":[{"key":"A","letter":"أ","text":"تستغرق مرحلة تنفيذ المشروع عادة أطول فترة زمنية."},{"key":"B","letter":"ب","text":"عادة ما تكون المخاطر وعدم اليقين أكبر خلال مرحلة اغلاق المشروع."},{"key":"C","letter":"ج","text":"مستويات التكلفة والتوظيف هي الاعلى بشكل عام في نهاية المشروع"},{"key":"D","letter":"د","text":"عادة ما تكون تكلفة اجراء التغيرات هي الاعلى في بداية المشروع."}],"explanation":"أ. صحيح لأن مرحلة التنفيذ هي عادةً الأطول في دورة حياة المشروع حيث يتم فيها إنجاز معظم الأعمال.\n\nب. خطأ لأن المخاطر وعدم اليقين تكون أعلى في بداية المشروع وليس في مرحلة الإغلاق.\n\nج. خطأ لأن مستويات التكلفة والتوظيف تكون أعلى في مرحلة التنفيذ وليس في نهاية المشروع.\n\nد. خطأ لأن تكلفة التغييرات تكون أقل في البداية وتزداد كلما تقدم المشروع.","oldQNumber":"58","bankIndex":95,"setId":"set5"},{"id":"473","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"استحوذ مستثمر على مؤسسة لها مكانة مهيمنة في صناعة ناضجة ذات نمو بطيء وتحقق دخلاً مالياً إيجابياً باستمرار. أي من المصطلحات التالية من المرجح أن يضعها المستثمر على هذا الاستثمار في محفظتها؟","options":[{"key":"A","letter":"أ","text":"عالي الأرباح"},{"key":"B","letter":"ب","text":"استثمار مدر للأموال (بقرة حلوب)"},{"key":"C","letter":"ج","text":"علامة غير مجدي"},{"key":"D","letter":"د","text":"استثمار محدود"}],"explanation":"أ. خطأ لأنه لا يصف بدقة حالة شركة في سوق ناضج وبطيء النمو مع تدفقات نقدية مستقرة.\n\nب. صحيح لأنه يصف “Cash Cow” وهي شركة تحقق تدفقات نقدية مستقرة وإيجابية في سوق ناضج.\n\nج. خطأ لأنه يشير إلى استثمار ضعيف أو غير مربح وهو عكس الحالة المذكورة.\n\nد. خطأ لأنه لا يعكس طبيعة الشركات المهيمنة ذات التدفق النقدي المستمر.","oldQNumber":"63","bankIndex":96,"setId":"set5"},{"id":"478","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"من المرجح أن يحدث الإفراط في بناء القدرات عندما تركز الإدارة على أي من التالي؟","options":[{"key":"A","letter":"أ","text":"التمويل"},{"key":"B","letter":"ب","text":"الإنتاج"},{"key":"C","letter":"ج","text":"التنويع"},{"key":"D","letter":"د","text":"التسويق"}],"explanation":"أ. خطأ لأنه يتعلق بتوفير الموارد المالية وليس بزيادة الطاقة الإنتاجية مباشرة.\n\nب. صحيح لأنه التركيز على الإنتاج قد يؤدي إلى التوسع المفرط في الطاقة الإنتاجية بما يفوق الطلب الفعلي.\n\nج. خطأ لأن التنويع يتعلق بتوسيع المنتجات أو الأسواق وليس بالضرورة زيادة القدرة الإنتاجية بشكل مباشر.\n\nد. خطأ لأن التسويق يركز على الطلب وليس على بناء القدرات الإنتاجية نفسها.","oldQNumber":"68","bankIndex":97,"setId":"set5"},{"id":"483","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"قرر مطعم توسيع عمله ليشمل خدمات التوصيل ، بدلاً من الاعتماد على خدمات توصيل طعام خارجية. أي مما يلي يصف بشكل أفضل استراتيجية المطاعم؟","options":[{"key":"A","letter":"أ","text":"التنويع"},{"key":"B","letter":"ب","text":"الاندماج الرأسي"},{"key":"C","letter":"ج","text":"تجنب المخاطر"},{"key":"D","letter":"د","text":"التفريق"}],"explanation":"أ. خطأ لأنه يعني دخول نشاط غير مرتبط بالنشاط الأساسي، بينما التوصيل مرتبط مباشرة بعمل المطعم.\n\nب. صحيح لأنه يمثل انتقال المطعم للقيام بمرحلة من سلسلة التوريد بنفسه بدل الاعتماد على طرف خارجي (خدمات التوصيل).\n\nج. خطأ لأنه لا يصف استراتيجية توسع أو تغيير في نموذج العمل.\n\nد. خطأ لأنه يتعلق بتمييز المنتج أو الخدمة وليس تغيير هيكل العمليات.","oldQNumber":"73","bankIndex":98,"setId":"set5"},{"id":"488","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"طُلب من طرف ثالث يقدم خدمات المرتبات للمؤسسة إنشاء وظائف تدقيق أو \"قراءة فقط\" في أنظمتهم. أي من العبارات التالية صحيحة فيما يتعلق بهذا الطلب؟","options":[{"key":"A","letter":"أ","text":"سيدعم هذا تنفيذ بند حق التدقيق."},{"key":"B","letter":"ب","text":"سيعزز هذا ممارسات تقييم المخاطر القوية"},{"key":"C","letter":"ج","text":"سيتناول هذا اعتبارات ومخاوف الأمن السيبراني."},{"key":"D","letter":"د","text":"سيعزز هذا قدرة الطرف الثالث على تطبيق تحليل البيانات"}],"explanation":"أ. صحيح لأنه يمنح المؤسسة إمكانية الوصول للبيانات لأغراض المراجعة دون تعديلها، وهو ما يدعم حق التدقيق.\n\nب. خطأ لأنه لا يرتبط مباشرة بتقييم المخاطر بل بحقوق الوصول والتدقيق.\n\nج. خطأ لأنه قد يساهم بشكل غير مباشر في الأمن السيبراني لكنه ليس الهدف الأساسي من طلب \"قراءة فقط\".\n\nد. خطأ لأنه لا يتعلق بتحليل البيانات بل بتسهيل عمليات التدقيق والمراجعة.","oldQNumber":"79","bankIndex":99,"setId":"set5"},{"id":"493","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بدورة حياة المشروع؟","options":[{"key":"A","letter":"أ","text":"تزداد المخاطر وعدم اليقين على مدار عمر المشروع."},{"key":"B","letter":"ب","text":"عادة ما تكون التكاليف ومستويات التوظيف مرتفعة مع اقتراب المشروع من الانتهاء."},{"key":"C","letter":"ج","text":"تزداد التكاليف المرتبطة بإجراء التغييرات كلما اقترب المشروع من الاكتمال."},{"key":"D","letter":"د","text":"تتوافق دورة حياة المشروع مع دورة حياة المنتج الذي ينتج عنه المشروع أو يعدله."}],"explanation":"أ. خطأ لأنه عادةً تكون المخاطر وعدم اليقين أعلى في بداية المشروع ثم تقل تدريجيًا.\n\nب. خطأ لأنه تكون التكاليف والتوظيف أعلى في منتصف المشروع وليس عند اقترابه من الانتهاء.\n\nج. صحيح لأنه كلما تقدم المشروع في التنفيذ تصبح التغييرات أكثر تكلفة وأصعب في التطبيق.\n\nد. خطأ لأن دورة حياة المشروع تختلف عن دورة حياة المنتج وليست متطابقة معها.","oldQNumber":"84","bankIndex":100,"setId":"set5"},{"id":"498","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"مع إدخال المنظمة لتقنيات جديدة، ما هو الاعتبار الأساسي للتدقيق الداخلي عند تقييم نظام إدارة التغيير في المنظمة؟","options":[{"key":"A","letter":"أ","text":"كيفية تعامل المنظمة مع طلبات التغيير الطارئة"},{"key":"B","letter":"ب","text":"ما إذا كان نظام إدارة التغيير موجودًا ويمكنه تحقيق أهداف المنظمة"},{"key":"C","letter":"ج","text":"كيفية تكيف المنظمة مع تغير مخاطر الأعمال"},{"key":"D","letter":"د","text":"ما إذا كانت المنظمة تأخذ في الاعتبار التغييرات في متطلبات السعة"}],"explanation":"أ. خطأ لأن التعامل مع التغييرات الطارئة جزء فرعي من النظام وليس الاعتبار الأساسي لتقييمه.\n\nب. صحيح لأن التدقيق الداخلي يركز على ما إذا كان نظام إدارة التغيير فعالًا وموجودًا وقادرًا على دعم أهداف المنظمة بشكل عام.\n\nج. خطأ لأن تكيف المخاطر عنصر مهم لكنه ليس الهدف الرئيسي من تقييم النظام ككل.\n\nد. خطأ لأن متطلبات السعة جزء تشغيلي ضمن إدارة التغيير وليست الاعتبار الأساسي الشامل.","oldQNumber":"89","bankIndex":101,"setId":"set5"},{"id":"503","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"أيٌّ من الممارسات التالية يُعد عادةً أفضل ممارسة فيما يتعلق بالنسخ الاحتياطي للبيانات؟\n\n١. إجراء نسخ احتياطي كامل للنظام في أيام الأسبوع\n\n٢. تخزين النسخ الاحتياطية داخل الموقع في مكان آمن\n\n٣. اختبار وسائط النسخ الاحتياطي للنظام بشكل دوري\n\n٤. التحقق من إمكانية استرجاع وسائط النسخ الاحتياطي خلال سبع سنوات","options":[{"key":"A","letter":"أ","text":"(2) فقط."},{"key":"B","letter":"ب","text":"(3) فقط."},{"key":"C","letter":"ج","text":"(1)، (2)، و(3) فقط."},{"key":"D","letter":"د","text":"(2)، (3)، و(4) فقط."}],"explanation":"أ. خطأ لأن إجراء نسخ احتياطي كامل بشكل يومي قد يكون مكلفًا وغير عملي كأفضل ممارسة عامة.\n\nب. خطأ لأن تخزين النسخ داخل الموقع يزيد المخاطر في حال حدوث كارثة تؤثر على الموقع نفسه.\n\nج. صحيح لأن اختبار النسخ الاحتياطي بشكل دوري هو أفضل ممارسة لضمان إمكانية استعادة البيانات فعليًا عند الحاجة.\n\nد. خطأ لأن مدة سبع سنوات تتعلق بالاحتفاظ بالبيانات وليس باختبار فعالية النسخ الاحتياطي.","oldQNumber":"94","bankIndex":102,"setId":"set5"},{"id":"508","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"في منظمة تنتج الشوكولاتة ، يقرر فريق القيادة أن المنظمة ستفتح منشأة لإنتاج الحليب لشوكولاتة الحليب الخاصة بها، أي من الاستراتيجيات التالية اختارت المنظمة؟","options":[{"key":"A","letter":"أ","text":"التكامل الرأسي."},{"key":"B","letter":"ب","text":"تنوع غير ذي صلة."},{"key":"C","letter":"ج","text":"التمايز."},{"key":"D","letter":"د","text":"التركيز."}],"explanation":"أ. صحيح لأنه يتضمن التوسع في مرحلة من مراحل سلسلة التوريد من خلال إنتاج الحليب المستخدم في تصنيع الشوكولاتة.\n\nب. خطأ لأنه يعني الدخول في نشاط لا يرتبط بالنشاط الأساسي للمنظمة.\n\nج. خطأ لأنه يركز على تمييز المنتج عن المنافسين وليس على التحكم في سلسلة التوريد.\n\nد. خطأ لأنه يركز على استهداف سوق أو شريحة محددة وليس على التوسع في مراحل الإنتاج.","oldQNumber":"99","bankIndex":103,"setId":"set5"},{"id":"513","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"وفقًا لتوجيهات IIA بشأن تقنية المعلومات، أي مما يلي يصف بشكل أفضل الحالات التي توجد فيها خطط نسخ احتياطي للبيانات لضمان إمكانية استعادة البيانات المهمة في مرحلة ما مستقبلية، ولكن لم يتم تعريف عمليات الاسترداد والاستعادة؟","options":[{"key":"A","letter":"أ","text":"خطة الاسترداد الساخن."},{"key":"B","letter":"ب","text":"خطة الاسترداد الدافئ."},{"key":"C","letter":"ج","text":"خطة الاسترداد البارد."},{"key":"D","letter":"د","text":"عدم وجود خطة استرداد."}],"explanation":"أ. خطأ لأنه في الموقع الساخن تكون عمليات الاسترداد معرفة وجاهزة للتنفيذ الفوري.\n\nب. خطأ لأنه في الموقع الدافئ توجد خطط واستعدادات جزئية لعمليات الاسترداد.\n\nج. خطأ لأنه في الموقع البارد تكون هناك خطة استرداد واضحة لكنها تحتاج وقتًا للتنفيذ.\n\nد. صحيح لأنه رغم وجود نسخ احتياطية، إلا أن عدم تحديد إجراءات الاسترداد يعني فعليًا عدم وجود خطة استرداد قابلة للتنفيذ.","oldQNumber":"104","bankIndex":104,"setId":"set5"},{"id":"518","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"أي مما يلي يعد عملية أساسية لضمان استمرارية المؤسسة في حال حدوث أي انقطاع؟","options":[{"key":"A","letter":"أ","text":"إجراء تحليل لتأثير الأعمال لتحديد الأنشطة الهامة"},{"key":"B","letter":"ب","text":"السيطرة على كافة التغييرات في أنظمة الانقطاع وفقًا لسياسة إدارة التغيير"},{"key":"C","letter":"ج","text":"مراجعة جميع الأذونات الخاصة بالوصول إلى أنظمة ومكونات الشبكة"},{"key":"D","letter":"د","text":"بدء توفير حسابات المستخدمين من خلال إجراءات الموارد البشرية"}],"explanation":"أ. صحيح لأنه تحليل تأثير الأعمال (BIA) هو الخطوة الأساسية في استمرارية الأعمال، ويحدد الأنشطة الحرجة التي يجب حمايتها لضمان استمرار المؤسسة أثناء الانقطاع.\n\nب. خطأ لأنه إجراء تحكمي مهم لكنه يأتي بعد تحديد الأنشطة الحرجة وليس أساس الاستمرارية.\n\nج. خطأ لأنه يتعلق بالأمن وإدارة الوصول وليس استمرارية الأعمال بشكل أساسي.\n\nد. خطأ لأنه إجراء تشغيلي مرتبط بإدارة الموارد البشرية وليس ضمان استمرارية العمليات أثناء الانقطاع.","oldQNumber":"110","bankIndex":105,"setId":"set5"},{"id":"523","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"B","question":"عند الاستعانة بمصادر خارجية لتكنولوجيا المعلومات، اي المخاطر التالية يمثل خطرا مشتركا على العميل والمورد ؟","options":[{"key":"A","letter":"أ","text":"عدد غير كافي للموظفين ."},{"key":"B","letter":"ب","text":"الخلاف بين اطراف العقد بسبب خرق شروط تعاقدية ."},{"key":"C","letter":"ج","text":"فقدان خصوصية البيانات"},{"key":"D","letter":"د","text":"الزيادة غير المتوقعة في تكاليف الاستعانة بمصادر خارجية"}],"explanation":"أ. خطأ لأنه يرتبط بشكل أساسي بالمورد (قدرته على توفير الموارد البشرية).\n\nب. صحيح لأنه يمثل خطرًا مشتركًا بين العميل والمورد، حيث يمكن أن ينشأ الخلاف بسبب التزامات العقد من الطرفين.\n\nج. خطأ لأنه يرتبط بشكل أكبر بمسؤولية حماية بيانات العميل.\n\nد. خطأ لأنه يتعلق عادةً بتكلفة العميل وليس الطرفين معًا.","oldQNumber":"115","bankIndex":106,"setId":"set5"},{"id":"528","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"وفقاً لإرشادات معهد المدققين الداخليين، أي من الخطوات التالية يتضمنها تحليل تأثير الأعمال؟","options":[{"key":"A","letter":"أ","text":"تحديد بدائل التوظيف اللازمة للتعافي"},{"key":"B","letter":"ب","text":"اختيار حلول التعافي ومواقع التعافي"},{"key":"C","letter":"ج","text":"تحديد العمليات التجارية"},{"key":"D","letter":"د","text":"تحديد مصادر بديلة للوظائف الحرجة"}],"explanation":"أ. خطأ لأنها مرحلة لاحقة تتعلق بالتخطيط للتعافي وليس تحليل تأثير الأعمال نفسه.\n\nب. خطأ لأنها جزء من تصميم حلول الاستجابة والاستمرارية وليس من تحليل التأثير.\n\nج. صحيح لأن تحليل تأثير الأعمال (BIA) يبدأ بتحديد العمليات التجارية الحيوية التي تعتمد عليها المؤسسة.\n\nد. خطأ لأنها تتعلق بخطط الاستمرارية وليس بتحديد العمليات الأساسية في مرحلة التحليل.","oldQNumber":"120","bankIndex":107,"setId":"set5"},{"id":"2","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"A","question":"أي من الحالات التالية يصف بدقة مسؤوليات حوكمة البيانات الكبيرة؟","options":[{"key":"A","letter":"أ","text":"يجب على الإدارة التأكد من تعريف أنظمة تخزين المعلومات بشكل مناسب وأن تكون عمليات تحديث عناصر البيانات الأساسية واضحة."},{"key":"B","letter":"ب","text":"يجب على المدققين الخارجيين التأكد من مراقبة النماذج التحليلية وصيانتها بشكل دوري."},{"key":"C","letter":"ج","text":"يجب على المجلس تنفيذ ضوابط حول أبعاد جودة البيانات لضمان فعاليتها."},{"key":"D","letter":"د","text":"يجب على المدققين الداخليين التأكد من جودة وأمن البيانات، مع التركيز بشكل أكبر على عناصر البيانات الأكثر خطورة."}],"explanation":"أ. صحيح لأن الإدارة مسؤولة عن وضع وتنفيذ ضوابط وإجراءات حوكمة البيانات وتحديد كيفية تخزينها وتحديثها بشكل صحيح.\n\nب. خطأ لأن المدققين الخارجيين لا يختصون بإدارة أو صيانة النماذج التحليلية بشكل دوري.\n\nج. خطأ لأن المجلس يضع التوجيهات والرقابة العامة ولا ينفذ الضوابط التشغيلية.\n\nد. خطأ لأن المدققين الداخليين يقيمون الحوكمة وليسوا مسؤولين عن تنفيذها.","oldQNumber":"2","bankIndex":108,"setId":"set1"},{"id":"6","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"D","question":"ما الإجراء الذي يجب أن يتخذه المدقق الداخلي لتنظيف البيانات التي تم الحصول عليها لأغراض التحليلات؟","options":[{"key":"A","letter":"أ","text":"نشر أداة التصور البياني للبيانات"},{"key":"B","letter":"ب","text":"اعتماد برنامج تحليل البيانات الموحد."},{"key":"C","letter":"ج","text":"تحديد أهداف التحليلات ووضع نتائج."},{"key":"D","letter":"د","text":"إزالة السجلات المكررة."}],"explanation":"أ. خطأ لأن أدوات التصور تستخدم لعرض البيانات وليس لتنظيفها.\n\nب. خطأ لأن اعتماد برنامج تحليل لا يعالج مشكلة جودة البيانات مباشرة.\n\nج. خطأ لأن تحديد الأهداف يتعلق بمرحلة التخطيط وليس تنظيف البيانات.\n\nد. صحيح لأنه من خطوات تنظيف البيانات إزالة التكرارات لضمان دقة التحليل.","oldQNumber":"6","bankIndex":109,"setId":"set1"},{"id":"11","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"C","question":"يقوم المراجع الداخلي بمراجعة مجموعة بيانات ويحسب المتوسط والوسطى والنطاق. ما هو الهدف الأكثر ترجيحًا لإجراء هذه التقنية التحليلية؟","options":[{"key":"A","letter":"أ","text":"لإبلاغ تصنيف مجموعة البيانات."},{"key":"B","letter":"ب","text":"لتحديد اكتمال وسلامة البيانات."},{"key":"C","letter":"ج","text":"لتحديد ما إذا كانت المجموعة تحتوي على قيم متطرفة شاذة."},{"key":"D","letter":"د","text":"لتحديد ما إذا كانت التكرارات في البيانات تزيد من النطاق."}],"explanation":"أ. خطأ لأنه لا يتم استخدام المتوسط والوسطى والنطاق لتصنيف البيانات.\n\nب. خطأ لأن هذه المقاييس لا تثبت اكتمال وسلامة البيانات.\n\nج. صحيح لأنها تساعد في اكتشاف القيم الشاذة أو غير الطبيعية.\n\nد. خطأ لأن التكرارات لا تؤثر على النطاق.","oldQNumber":"11","bankIndex":110,"setId":"set1"},{"id":"16","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"C","question":"ما هي من بين القضايا التالية التي ستكون مصدر قلق كبير للمراجعين الداخليين عند استخدام برنامج مجاني لتحليل بيانات ضخمة من مورد طرف ثالث؟","options":[{"key":"A","letter":"أ","text":"القدرة على استخدام البرنامج بسهولة لإجراء تحليل البيانات لتحقيق أهداف المشاركة."},{"key":"B","letter":"ب","text":"القدرة على شراء ميزات محسنة للبرنامج تسمح بإجراء تحليل أكثر تعمقًا للبيانات الضخمة."},{"key":"C","letter":"ج","text":"القدرة على ضمان أمان البيانات الضخمة التي يتم إدخالها في البرنامج من أي اختراقات أو خسائر محتملة."},{"key":"D","letter":"د","text":"القدرة على تنزيل البرنامج على أجهزة الكمبيوتر المناسبة لاستخدامه في تحليل البيانات الضخمة."}],"explanation":"أ. خطأ لأن سهولة الاستخدام ليست القضية الأكبر مقارنة بمخاطر البيانات.\n\nب. خطأ لأن توفر الميزات المدفوعة مسألة تشغيلية وليست مصدر قلق رقابي رئيسي.\n\nج. صحيح لأن أكبر خطر في استخدام برنامج طرف ثالث هو أمن وسرية البيانات.\n\nد. خطأ لأن التثبيت التقني ليس مصدر القلق الرئيسي في هذا السياق.","oldQNumber":"16","bankIndex":111,"setId":"set1"},{"id":"21","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"B","question":"أي من طرق تحليل البيانات التالية تتضمن تحليل اتجاهات الأحداث لتحديد ما حدث؟","options":[{"key":"A","letter":"أ","text":"التحليلات التشخيصية."},{"key":"B","letter":"ب","text":"التحليلات الوصفية."},{"key":"C","letter":"ج","text":"التحليلات التنبؤية."},{"key":"D","letter":"د","text":"التحليلات التوجيهيه"}],"explanation":"أ خطأ لأن التحليلات التشخيصية تركز على معرفة لماذا حدث الشيء وأسباب وقوعه، وليس مجرد وصف ما حدث.\n\nب صحيح لأن التحليلات الوصفية (Descriptive Analytics) تهدف إلى تلخيص البيانات التاريخية وتحليل الاتجاهات والأحداث لفهم ما الذي حدث.\n\nج خطأ لأن التحليلات التنبؤية تستخدم البيانات الحالية والتاريخية للتنبؤ بما قد يحدث مستقبلاً.\n\nد خطأ لأن التحليلات التوجيهية (Prescriptive Analytics) تركز على اقتراح ما الذي ينبغي فعله أو اتخاذه من إجراءات بناءً على نتائج التحليل","oldQNumber":"21","bankIndex":112,"setId":"set1"},{"id":"26","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"B","question":"ما الذي يصف بشكل أفضل فائدة محتملة لاستخدام تحليلات البيانات؟","options":[{"key":"A","letter":"أ","text":"يتماشى بسهولة مع كفاءات التدقيق الداخلي الموجودة لتقليل النفقات."},{"key":"B","letter":"ب","text":"يوفر رؤية أكثر شمولية للمنطقة التي تمت مراجعتها."},{"key":"C","letter":"ج","text":"يمكن تفسير نتائجها بسهولة إلى استنتاجات تدقيق."},{"key":"D","letter":"د","text":"يزيد تطبيقها من التزام المدققين الداخليين بالمعايير."}],"explanation":"أ. خطأ لأنه ليس بالضرورة أن تحليلات البيانات تقلل النفقات أو تتماشى بسهولة مع الكفاءات الحالية.\n\nب. صحيح لأنه يتيح للمدقق فهمًا أوسع وأشمل للبيانات والعمليات محل المراجعة.\n\nج. خطأ لأن تفسير النتائج ليس الفائدة الأساسية الأكثر دقة مقارنة بالشمولية.\n\nد. خطأ لأن الالتزام بالمعايير لا يرتبط مباشرة باستخدام تحليلات البيانات.","oldQNumber":"26","bankIndex":113,"setId":"set1"},{"id":"31","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"B","question":"قام مدقق داخلي بمراجعة سجلات قسم المالية للحصول على قائمة بعناوين الموردين الحاليين. ثم قارن المدقق عناوين الموردين بسجل عناوين الموظفين الذي يحتفظ به قسم الرواتب. أي من أنواع تحليل البيانات التالية قام بها المدقق؟","options":[{"key":"A","letter":"أ","text":"اختبار النسخ المكررة."},{"key":"B","letter":"ب","text":"ربط مصادر البيانات."},{"key":"C","letter":"ج","text":"تحليل الفجوات."},{"key":"D","letter":"د","text":"التصنيف."}],"explanation":"أ. خطأ لأنه اختبار النسخ المكررة يركز على اكتشاف التكرار داخل نفس البيانات وليس مقارنة مصدرين مختلفين.\n\nب. صحيح لأنه تم مقارنة وربط بيانات من مصدرين مختلفين (الموردين والموظفين).\n\nج. خطأ لأن تحليل الفجوات يركز على اكتشاف البيانات المفقودة أو غير المكتملة وليس المقارنة بين مصدرين.\n\nد. خطأ لأن التصنيف يهدف إلى تجميع البيانات في فئات وليس مقارنتها بين قواعد بيانات مختلفة.","oldQNumber":"31","bankIndex":114,"setId":"set1"},{"id":"36","form":"form2","formTitle":"Group 2","lesson":"أ- تحليل البيانات","answer":"A","question":"ما هي الخطوة الاولى التي يجب ان يقوم بها المدقق عند تنفيذ تحليل البيانات؟","options":[{"key":"A","letter":"أ","text":"تحديد الغرض والقيمة المتوقعة."},{"key":"B","letter":"ب","text":"تحليل المصادر الممكنة والمتاحة للبيانات الخام."},{"key":"C","letter":"ج","text":"اجراء تقييم للمخاطر فيما يتعلق بفعالية عملية تحليل البيانات."},{"key":"D","letter":"د","text":"حدد البيانات لاجراء التنظيف والتطبيع"}],"explanation":"أ. صحيح لأنه يجب أولاً تحديد هدف التحليل والقيمة المتوقعة لتوجيه عملية التحليل بشكل صحيح.\n\nب. خطأ لأن تحديد مصادر البيانات يأتي بعد تحديد الهدف.\n\nج. خطأ لأن تقييم المخاطر يتم بعد فهم الهدف ونطاق التحليل.\n\nد. خطأ لأن تنظيف البيانات يأتي بعد تحديد الهدف والحصول على البيانات.","oldQNumber":"36","bankIndex":115,"setId":"set1"},{"id":"43","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من عناصر التحكم الأمني تركز بشكل أكبر على منع الوصول غير المصرح به إلى محطة الطاقة؟","options":[{"key":"A","letter":"أ","text":"يتم البدء بإجراء إنهاء الخدمة شهريًا لتحديد حقوق الوصول الفيزيائي الزائدة"},{"key":"B","letter":"ب","text":"يتم فحص السجلات التي يتم إنشاؤها بواسطة الأقفال الذكية تلقائيًا لتحديد الشذوذ في أنماط الوصول"},{"key":"C","letter":"ج","text":"يتم إرسال طلبات حقوق الوصول الإضافية للموافقة والتحقق من قبل المشرفين المباشرين"},{"key":"D","letter":"د","text":"يتم إرسال إشعارات تلقائية إلى وحدة أمن مركزية عندما يدخل الموظفون إلى المبنى خلال ساعات غير العمل"}],"explanation":"أ. خطأ لأنه إجراء إداري لاحق يهدف لإزالة الصلاحيات الزائدة وليس منع الدخول مباشرة.\n\nب. خطأ لأنه تحكم اكتشافي يعتمد على تحليل السجلات بعد أو أثناء حدوث النشاط.\n\nج. صحيح لأنه تحكم وقائي يعتمد على الموافقة المسبقة (Authorization Approval) قبل منح أي وصول إضافي، وبالتالي يمنع الوصول غير المصرح به.\n\nد. خطأ لأنه تحكم اكتشافي/مراقبة وليس منعًا مسبقًا للوصول.","oldQNumber":"4","bankIndex":116,"setId":"set2"},{"id":"48","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"قام متسلل متنكر في دور الرئيس التنفيذي للمؤسسة بإرسال بريد إلكتروني وخدع موظفي صرف الرواتب في تقديم معلومات ضريبية خاصة بالموظفين.","options":[{"key":"A","letter":"أ","text":"هجوم حدودي."},{"key":"B","letter":"ب","text":"هجوم تصيد الرمح."},{"key":"C","letter":"ج","text":"هجوم القوة الغاشمة."},{"key":"D","letter":"د","text":"هجوم انتحال شخصية."}],"explanation":"أ. خطأ لأنه ليس مصطلحاً شائعاً أو دقيقاً لهذا النوع من الهجمات.\n\nب. صحيح لأنه يمثل هجوم تصيد رمح (Spear Phishing) حيث يتم استهداف موظفين محددين برسالة موجهة تنتحل شخصية مسؤول (مثل الرئيس التنفيذي) للحصول على معلومات حساسة.\n\nج. خطأ لأنه يعتمد على التخمين المتكرر لكلمات المرور وليس رسائل احتيالية.\n\nد. خطأ لأنه وصف عام، بينما الحالة أكثر تحديداً وتندرج تحت التصيد الموجه.","oldQNumber":"9","bankIndex":117,"setId":"set2"},{"id":"53","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"من أجل تعزيز أمنها ستتوقف المنظمة عن توفير الوصول المباشر الى موارد التطبيق ، أي من الخوادم التالية سيتم استخدامه ؟","options":[{"key":"A","letter":"أ","text":"الخادم الوكيل (الوسيط)"},{"key":"B","letter":"ب","text":"خادم الويب."},{"key":"C","letter":"ج","text":"خادم التطبيقات."},{"key":"D","letter":"د","text":"خادم الملفات"}],"explanation":"أ صحيح لأنه الخادم الوكيل (أ) يعمل كوسيط بين المستخدمين والموارد ويمنع الوصول المباشر إلى التطبيقات.\nب خطا لأنه خادم الويب (ب) يقدم الخدمات مباشرة ولا يمنع الوصول المباشر.\nج خطا لأنه خادم التطبيقات (ج) يعالج الطلبات لكنه ليس وسيط إخفاء الوصول المباشر.\nد خطا لأنه خادم الملفات (د) يختص بتخزين الملفات وليس التحكم بالوصول للتطبيقات.","oldQNumber":"14","bankIndex":118,"setId":"set2"},{"id":"58","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي هو مثال على تحكم تطبيق؟","options":[{"key":"A","letter":"أ","text":"متطلبات تغيير كلمة المرور التلقائي."},{"key":"B","letter":"ب","text":"عملية النسخ الاحتياطي لبيانات النظام."},{"key":"C","letter":"ج","text":"اختبار المستخدم لتغييرات النظام."},{"key":"D","letter":"د","text":"حقول بيانات منسقة."}],"explanation":"أ خطا لأنه تحكم أمني عام يتعلق بكلمات المرور وليس تحكمًا داخل التطبيق نفسه.\nب خطا لأنه تحكم على مستوى النظام والبنية التحتية وليس التطبيق.\nج خطا لأنه نشاط اختبار وليس تحكمًا تطبيقيًا مباشرًا.\nد صحيح لأنه يتعلق بطريقة إدخال وتنسيق البيانات داخل التطبيق لضمان دقتها.","oldQNumber":"19","bankIndex":119,"setId":"set2"},{"id":"63","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين، أي من العبارات التالية صحيحة بشأن اختبار الاختراق؟","options":[{"key":"A","letter":"أ","text":"لا ينبغي الإعلان عن الاختبار لأي شخص داخل المؤسسة للحصول على استجابة واقعية."},{"key":"B","letter":"ب","text":"يجب إجراء الاختبار خلال فترات التشغيل الثقيلة لاختبار مرونة النظام."},{"key":"C","letter":"ج","text":"يجب أن يكون الاختبار واسع النطاق ويعالج في المقام الأول أدوات التحكم الإدارية الاكتشافية لتحديد الهجمات المحتملة."},{"key":"D","letter":"د","text":"يجب أن يعالج الاختبار الضوابط الوقائية واستجابة الإدارة."}],"explanation":"أ. خطأ لأن عدم الإعلان الكامل قد يسبب مخاطر تشغيلية أو انقطاع غير مخطط، وغالبًا يتم الاتفاق على نطاق الاختبار مسبقًا.\n\nب. خطأ لأن توقيت الاختبار لا يُبنى على فترات الضغط التشغيلي بل على خطة مدروسة لتقليل المخاطر.\n\nج. خطأ لأن اختبار الاختراق يركز أكثر على الضوابط التقنية وخاصة الوقائية وليس الإدارية الاكتشافية فقط.\n\nد. صحيح لأن اختبار الاختراق يهدف إلى تقييم فعالية الضوابط الوقائية وكذلك كيفية استجابة الإدارة عند حدوث الهجوم.","oldQNumber":"24","bankIndex":120,"setId":"set2"},{"id":"68","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"يجري مدقق داخلي تقييمًا أوليًا لمخاطر الخصوصية وحماية البيانات. أي من الأسئلة التالية يُعد الأكثر أهمية لبدء التقييم؟","options":[{"key":"A","letter":"أ","text":"كيف تقوم وحدة الأمن السيبراني بالتحقيق في حالات تسرب البيانات أو الادعاءات؟"},{"key":"B","letter":"ب","text":"ما هي الغرامات المحتملة التي قد تنطبق على المنظمة بسبب انتهاكات حماية البيانات؟"},{"key":"C","letter":"ج","text":"ما نوع البيانات الخاصة التي تجمعها المنظمة وتحتفظ بها؟"},{"key":"D","letter":"د","text":"في أي حالات يتم تطبيق إخفاء هوية البيانات داخل المنظمة؟"}],"explanation":"أ خطأ لأنه يتعلق بالاستجابة للحوادث وليس التقييم الأولي للمخاطر.\nب خطأ لأنه يركز على العقوبات وليس على فهم نطاق البيانات.\nج صحيح لأنه أول خطوة في تقييم مخاطر الخصوصية هي تحديد نوع البيانات الشخصية التي يتم جمعها ومعالجتها.\nد خطأ لأنه إجراء تحكم لاحق وليس نقطة بداية التقييم.","oldQNumber":"29","bankIndex":121,"setId":"set2"},{"id":"73","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من العناصر التالية يعد ضابط تحكم وقائي فعال لأمن مراكز البيانات؟","options":[{"key":"A","letter":"أ","text":"أجهزة استشعار الحركة"},{"key":"B","letter":"ب","text":"بطاقات الدخول إلى المنشأة"},{"key":"C","letter":"ج","text":"كاميرات المراقبة"},{"key":"D","letter":"د","text":"مراقبة الوصول إلى محطات عمل مركز البيانات"}],"explanation":"أ خطا لأنه تحكم كشف (Detective) وليس وقائي ويعمل بعد حدوث الحركة.\nب صحيح لأنه يمنع الدخول غير المصرح به إلى المنشأة عبر التحقق من الهوية قبل الدخول.\nج خطا لأنه تحكم كشف يراقب ويسجل ولا يمنع الدخول مباشرة.\nد خطا لأنه تحكم مراقبة وليس وقائي لمنع الوصول من البداية.","oldQNumber":"34","bankIndex":122,"setId":"set2"},{"id":"78","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من عناصر تحكم الأمن التالية ستكون الأكثر فعالية في منع خروقات الأمن؟","options":[{"key":"A","letter":"أ","text":"الموافقة على طلبات الهوية."},{"key":"B","letter":"ب","text":"تسجيل الوصول."},{"key":"C","letter":"ج","text":"مراقبة الحسابات المميزة."},{"key":"D","letter":"د","text":"مراجعة حقوق الوصول."}],"explanation":"أ. خطأ لأنه إجراء إداري يساعد في إدارة الهويات لكنه لا يمنع الخروقات بشكل مباشر.\n\nب. خطأ لأنه عنصر تحكم كاشف (Detective) يحدد من دخل النظام وليس منع الاختراق.\n\nج. خطأ لأنه يراقب الأنشطة لكنه لا يمنع الوصول غير المصرح به بشكل أساسي.\n\nد. صحيح لأنه مراجعة حقوق الوصول (Access Rights Review) تساعد في التأكد من أن المستخدمين لديهم فقط الصلاحيات الضرورية، مما يقلل ويمنع فرص خروقات الأمن.","oldQNumber":"39","bankIndex":123,"setId":"set2"},{"id":"83","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"وفقًا لنموذج ثلاثة خطوط لـ IIA، أي من أنشطة أمن تقنية المعلومات التالية مشتركة عادةً بين جميع الخطوط الثلاثة؟","options":[{"key":"A","letter":"أ","text":"تقييمات الجهات الخارجية والموردين."},{"key":"B","letter":"ب","text":"استقطاب والحفاظ على المواهب المؤهلة في مجال تقنية المعلومات."},{"key":"C","letter":"ج","text":"تصنيف البيانات وتصميم امتيازات الوصول."},{"key":"D","letter":"د","text":"إنشاء وصيانة تكوين آمن للشبكة والأجهزة"}],"explanation":"أ خطا لأنه يرتبط غالبًا بوظيفة محددة مثل التدقيق أو الإدارة وليس جميع الخطوط.\nب خطا لأنه نشاط إداري للموارد البشرية وليس نشاطًا مشتركًا في الأمن.\nج صحيح لأنه تصنيف البيانات وتحديد الصلاحيات يتم عبر جميع الخطوط (الإدارة، المخاطر، التدقيق).\nد خطا لأنه نشاط تقني تشغيلي يخص فرق تقنية المعلومات بشكل أساسي.","oldQNumber":"44","bankIndex":124,"setId":"set2"},{"id":"88","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"قررت إحدى المنظمات أن يكون جميع الموظفين يعملون من المنزل. أي من أنواع الشبكات التالية يمكنه تمكين هذا النهج بأمان؟","options":[{"key":"A","letter":"أ","text":"شبكة محلية لاسلكية (WLAN)."},{"key":"B","letter":"ب","text":"شبكة منطقة شخصية (PAN)."},{"key":"C","letter":"ج","text":"شبكة منطقة واسعة (WAN)."},{"key":"D","letter":"د","text":"شبكة خاصة افتراضية (VPN)."}],"explanation":"أ. خطأ لأنها شبكة لاسلكية محلية داخل نطاق محدود ولا توفر اتصال آمن بالشبكة الداخلية عن بعد.\n\nب. خطأ لأنها شبكة شخصية صغيرة جدًا بين أجهزة فردية ولا تناسب العمل المؤسسي عن بعد.\n\nج. خطأ لأنها شبكة واسعة تربط مناطق جغرافية، لكنها ليست آلية أمان للوصول عن بعد.\n\nد. صحيح لأنها توفر اتصالًا آمنًا ومشفّرًا للموظفين للوصول إلى شبكة المنظمة من المنزل.","oldQNumber":"49","bankIndex":125,"setId":"set2"},{"id":"93","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"تلقى عضو مجلس إدارة معين حديثًا بريدًا إلكترونيًا يبدو أنه صادر من الرئيس التنفيذي للشركة. جاء في البريد الإلكتروني: \"صباح الخير. كما تتذكر، فإن إغلاق المشاريع هو أولويتنا القصوى. من أجل تنظيم دفع فوري للفاتورة المرفقة لشركائنا الجدد في مجال الطاقة الشمسية\". رد عضو مجلس الإدارة بسرعة على البريد الإلكتروني وسأل تحت أي مشروع يجب احتساب المصروفات. عندها فقط أدرك أن نطاق بريد المرسل يختلف عن نطاق الشركة.","options":[{"key":"A","letter":"أ","text":"خطر من برامج التجسس والبرامج الضارة."},{"key":"B","letter":"ب","text":"خطر التجسس الصناعي."},{"key":"C","letter":"ج","text":"خطر هجوم برامج الفدية."},{"key":"D","letter":"د","text":"خطر الهندسة الاجتماعية."}],"explanation":"أ. خطأ لأنه لا يوجد ذكر لبرامج تجسس أو تحميل ملفات خبيثة.\n\nب. خطأ لأنه لا توجد محاولة لاستخراج معلومات سرية لصالح جهة منافسة بشكل مباشر.\n\nج. خطأ لأنه لا يوجد تشفير أو طلب فدية مقابل بيانات.\n\nد. صحيح لأنه يعتمد على انتحال شخصية (الرئيس التنفيذي) لخداع الضحية لاتخاذ إجراء مالي، وهذا يُعد هندسة اجتماعية.","oldQNumber":"54","bankIndex":126,"setId":"set2"},{"id":"98","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"ما الذي يجب أن تتضمنه سياسة خصوصية البيانات؟\n\n١. شروط حذف بيانات معينة بعد فترة زمنية محددة.\n\n٢. إرشادات بشأن الأساليب المقبولة لجمع البيانات الشخصية.\n\n٣. شرط الاحتفاظ بالبيانات الشخصية إلى أجل غير مسمى لضمان سجل تدقيق كامل.\n\n٤. وصف لما يشكل استخدامًا مناسبًا للبيانات الشخصية.","options":[{"key":"A","letter":"أ","text":"1 و 2 فقط"},{"key":"B","letter":"ب","text":"2 و 3 فقط"},{"key":"C","letter":"ج","text":"1 و 2 و 4 فقط"},{"key":"D","letter":"د","text":"2 و 3 و 4 فقط"}],"explanation":"1 . صحيح لأنه يضمن الالتزام بمبدأ تقليل مدة الاحتفاظ بالبيانات.\n2 . صحيح لأنه يحدد الطرق المسموح بها لجمع البيانات الشخصية بشكل قانوني وآمن.\n3 . خطا لأنه الاحتفاظ بالبيانات إلى أجل غير مسمى يخالف مبادئ الخصوصية وتقليل البيانات.\n4 . صحيح لأنه يوضح الاستخدام المناسب للبيانات ويمنع إساءة استخدامها.","oldQNumber":"59","bankIndex":127,"setId":"set2"},{"id":"103","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي يعتبر مبدأً مقبولاً لخصوصية البيانات؟","options":[{"key":"A","letter":"أ","text":"الاكتمال وسهولة القراءة."},{"key":"B","letter":"ب","text":"الوضوح والفهم."},{"key":"C","letter":"ج","text":"التماسك والاتفاق."},{"key":"D","letter":"د","text":"الاختيار والموافقة."}],"explanation":"أ خطا لأنه لا يمثل مبدأ خصوصية بيانات بل يتعلق بجودة البيانات.\nب خطا لأنه يتعلق بوضوح المعلومات وليس بمبادئ الخصوصية.\nج خطا لأنه لا يرتبط بمبادئ حماية البيانات أو الخصوصية.\nد صحيح لأنه مبدأ “الاختيار والموافقة” من أساسيات خصوصية البيانات ويعني موافقة المستخدم على جمع واستخدام بياناته.","oldQNumber":"64","bankIndex":128,"setId":"set2"},{"id":"108","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي يتم تصنيفه كعناصر تحكم عامة لتكنولوجيا المعلومات؟","options":[{"key":"A","letter":"أ","text":"قوائم الأخطاء."},{"key":"B","letter":"ب","text":"ضوابط التوزيع."},{"key":"C","letter":"ج","text":"تسجيل المعاملات (Transaction logging)."},{"key":"D","letter":"د","text":"ضوابط تطوير الأنظمة (Systems development controls)."}],"explanation":"أ. خطأ لأنها تُعد من عناصر التحكم التشغيلية داخل التطبيقات وليست تحكمات عامة.\n\nب. خطأ لأنها ترتبط بعمليات توزيع المخرجات داخل النظام وليست ضمن الضوابط العامة.\n\nج. خطأ لأنها عنصر تحكم تطبيقي يهدف لتتبع العمليات وليس من الضوابط العامة.\n\nد. صحيح لأنها من عناصر التحكم العامة لتكنولوجيا المعلومات (General IT Controls) وتشمل ضوابط تطوير الأنظمة لضمان بناء وتعديل الأنظمة بشكل آمن ومنضبط.","oldQNumber":"69","bankIndex":129,"setId":"set2"},{"id":"113","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما أهم شيء يجب على المراجع الداخلي التحقق منه فيما يتعلق بإصدار قاعدة البيانات؟","options":[{"key":"A","letter":"أ","text":"التحقق من استخدام المنظمة لأحدث إصدار من برنامج قاعدة البيانات."},{"key":"B","letter":"ب","text":"التحقق من دعم البائع لإصدار برنامج قاعدة البيانات."},{"key":"C","letter":"ج","text":"التحقق من ترقية برنامج قاعدة البيانات مؤخرًا."},{"key":"D","letter":"د","text":"التحقق من تقييد الوصول إلى معلومات إصدار قاعدة البيانات بشكل مناسب."}],"explanation":"أ خطا لأنه استخدام أحدث إصدار ليس الأهم إذا كان الإصدار غير مدعوم من البائع.\nب صحيح لأنه يجب التأكد أن إصدار قاعدة البيانات مدعوم من البائع لضمان الأمان والاستمرارية.\nج خطا لأن الترقية وحدها لا تضمن أن الإصدار مدعوم أو آمن.\nد خطا لأنه يتعلق بالتحكم في الوصول وليس بإصدار قاعدة البيانات نفسه.","oldQNumber":"74","bankIndex":130,"setId":"set2"},{"id":"118","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"من المرجح أن يتم إنشاء كلمة مرور لمرة واحدة في أي من الحالات التالية؟","options":[{"key":"A","letter":"أ","text":"عندما يصل موظف إلى شهادة رقمية عبر الإنترنت."},{"key":"B","letter":"ب","text":"عندما يتم قبول بيانات قياسية للموظف."},{"key":"C","letter":"ج","text":"عندما يقوم موظف بإنشاء توقيع رقمي فريد."},{"key":"D","letter":"د","text":"عندما يستخدم موظف سلسلة مفاتيح لإنتاج رمز مميز."}],"explanation":"أ خطا لأنه الوصول إلى شهادة رقمية لا يعني إنشاء كلمة مرور لمرة واحدة.\nب خطا لأنه يتعلق ببيانات ثابتة وليس توليد رمز مؤقت.\nج خطا لأنه التوقيع الرقمي لا يعتمد على كلمات مرور لمرة واحدة.\nد صحيح لأنه استخدام سلسلة مفاتيح (token) غالبًا يولد رموز تحقق مؤقتة (OTP).","oldQNumber":"79","bankIndex":131,"setId":"set2"},{"id":"123","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"في جدول بيانات يتضمن اسم الموظف، وتاريخ التعيين، والمسمى الوظيفي، والراتب الشهري. أي مما يلي يصف بشكل صحيح معلومات هذا السطر؟","options":[{"key":"A","letter":"أ","text":"الحقل."},{"key":"B","letter":"ب","text":"ملف."},{"key":"C","letter":"ج","text":"السجل."},{"key":"D","letter":"د","text":"قاعدة البيانات."}],"explanation":"أ خطا لأنه الحقل يمثل عنصر بيانات واحد مثل الاسم أو الراتب وليس مجموعة بيانات كاملة.\nب خطا لأنه الملف يحتوي على مجموعة سجلات وليس سطر واحد فقط.\nج صحيح لأنه السجل يمثل صفًا واحدًا يحتوي على جميع بيانات موظف واحد.\nد خطا لأنه قاعدة البيانات تحتوي على عدة جداول وسجلات وليست صفًا واحدًا.","oldQNumber":"84","bankIndex":132,"setId":"set2"},{"id":"128","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"اكتشفت مؤسسة نشاطًا احتياليًا يتعلق بنظام تتبع وقت الموظفين. قام موظف واحد بانتظام بتسجيل دخول وخروج أصدقاء زملائه في أيام عطلهم، مما أدى إلى زيادة ساعات عملهم المبلغ عنها وزيادة أجورهم. أي من أجهزة المصادقة الفيزيائية التالية ستكون الأكثر فعالية في تعطيل هذا المخطط الاحتيالي؟","options":[{"key":"A","letter":"أ","text":"معدات التعرف على الوجه أو بصمة الأصابع."},{"key":"B","letter":"ب","text":"شرائح تحديد الهوية بموجات الراديو لمصادقة الموظفين باستخدام البطاقات."},{"key":"C","letter":"ج","text":"شرط تسجيل الدخول والخروج برقم تعريف شخصي فريد."},{"key":"D","letter":"د","text":"مزيج من بطاقة ذكية وكلمة مرور لتسجيل الدخول والخروج"}],"explanation":"أ. صحيح لأنها تعتمد على خصائص بيومترية فريدة لكل شخص (مثل الوجه أو بصمة الإصبع)، وبالتالي تمنع قيام موظف بتسجيل دخول أو خروج شخص آخر.\n\nب. خطأ لأن بطاقات RFID يمكن مشاركتها أو تمريرها بين الموظفين بسهولة.\n\nج. خطأ لأن رقم التعريف الشخصي يمكن مشاركته أو معرفته من قبل الآخرين.\n\nد. خطأ لأن البطاقة الذكية مع كلمة المرور لا تمنع مشكلة “النيابة في تسجيل الدخول” بشكل كامل إذا تم مشاركة بيانات الاعتماد.","oldQNumber":"89","bankIndex":133,"setId":"set2"},{"id":"133","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من عناصر التحكم بالتطبيق التالية الذي يعتمد بشكل أكبر على مالك (صاحب) كلمة المرور؟","options":[{"key":"A","letter":"أ","text":"اختيار كلمة المرور."},{"key":"B","letter":"ب","text":"تقادم كلمة المرور."},{"key":"C","letter":"ج","text":"قفل كلمة المرور."},{"key":"D","letter":"د","text":"تدوير كلمة المرور."}],"explanation":"أ. صحيح لأنه يعتمد على المستخدم في اختيار كلمة مرور قوية ومناسبة.\n\nب. خطأ لأنه يتم فرضه وإدارته من قبل النظام.\n\nج. خطأ لأنه يتم تنفيذه تلقائياً بواسطة النظام عند تجاوز عدد محاولات الدخول المسموح بها.\n\nد. خطأ لأنه سياسة يحددها النظام أو الإدارة وتتطلب تغيير كلمة المرور بشكل دوري.","oldQNumber":"94","bankIndex":134,"setId":"set2"},{"id":"138","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي تقوم به المنظمة التي تجري اختبارات الاختراق والتصيد ؟","options":[{"key":"A","letter":"أ","text":"إظهار إدارة الوصول الى المعلومات ناضجة"},{"key":"B","letter":"ب","text":"تعزيز حوكمة الامن السيبراني"},{"key":"C","letter":"ج","text":"التحقق من وجود تكوينات الامان القياسية"},{"key":"D","letter":"د","text":"إجراء المراقبة المستمرة الأمن السيبراني"}],"explanation":"أ خطأ لأنه اختبارات الاختراق والتصيد لا تهدف فقط لإظهار نضج إدارة الوصول إلى المعلومات.\nب خطأ لأنه تعزيز حوكمة الأمن السيبراني نتيجة عامة وليس الهدف المباشر للاختبارات.\nج خطأ لأنه التحقق من التكوينات الأمنية يتم عبر مراجعات التكوين وليس اختبارات التصيد.\nد صحيح لأنه اختبارات الاختراق والتصيد تساعد في الكشف المستمر عن الثغرات وتدعم المراقبة المستمرة للأمن السيبراني.","oldQNumber":"99","bankIndex":135,"setId":"set2"},{"id":"143","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"شركة صغيرة تمتلك الأجهزة التالية 2 جهاز محمول وجهاز وثلاثة أجهزة ذكية وطابعة ما هي نوع الشبكة التي تستخدمه هذه الشركة؟","options":[{"key":"A","letter":"أ","text":"شبكة واسعة النطاق.(WAN)"},{"key":"B","letter":"ب","text":"شبكة محلية. (LAN)"},{"key":"C","letter":"ج","text":"شبكة منطقة حضرية. (MAN)"},{"key":"D","letter":"د","text":"شبكة تخزين المنطقة."}],"explanation":"أ خطا لأنه يستخدم لربط شبكات عبر مناطق جغرافية كبيرة.\nب صحيح لأنه شبكة محلية تربط أجهزة داخل نطاق صغير مثل شركة صغيرة.\nج خطا لأنه يغطي مدينة أو منطقة حضرية وليس شركة صغيرة.\nد خطا لأنه نوع شبكة تخزين وليس شبكة اتصال أجهزة.","oldQNumber":"104","bankIndex":136,"setId":"set2"},{"id":"148","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"تمت ترقية موظفة داخل المنظمة وانتقلت إلى مكتب جديد في مبنى مختلف. بعد بضعة أشهر، اكتشف أفراد الأمن أن بطاقة الموظفة الذكية تُستخدم للوصول إلى المبنى الذي كانت تعمل فيه سابقًا. أي من عناصر التحكم الأمنية التالية يمكن أن تمنع حدوث مثل هذا الحادث؟","options":[{"key":"A","letter":"أ","text":"مراجعة السجلات بانتظام."},{"key":"B","letter":"ب","text":"المصادقة ذات المستويين."},{"key":"C","letter":"ج","text":"صور على البطاقات الذكية."},{"key":"D","letter":"د","text":"تحديد ساعات الوصول."}],"explanation":"أ. صحيح لأن مراجعة السجلات (Log Review) بشكل دوري تساعد على اكتشاف الاستخدام غير المصرح به للبطاقات بعد تغيير صلاحيات الموظف أو انتقاله، وبالتالي تمنع استمرار هذا النوع من الوصول غير المناسب.\n\nب. خطأ لأن المصادقة ذات المستويين تعزز الأمان عند الدخول لكنها لا تمنع استمرار استخدام بطاقة قديمة إذا لم تُراجع الصلاحيات.\n\nج. خطأ لأن وجود صورة على البطاقة يساعد في التحقق البصري لكنه لا يمنع الاستخدام غير المصرح به بشكل فعال.\n\nد. خطأ لأن تحديد ساعات الوصول يقيّد الوقت فقط ولا يعالج مشكلة صلاحيات الوصول لمبنى غير مخوّل.","oldQNumber":"109","bankIndex":137,"setId":"set2"},{"id":"153","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"قررت إحدى المنظمات السماح لمديريها باستخدام هواتفهم الذكية الخاصة في العمل. مع هذا التغيير، ما هو أهم شيء يجب إدراجه في سياسات وإجراءات قسم تقنية المعلومات الشاملة؟","options":[{"key":"A","letter":"أ","text":"توثيق مطلوب للعملية الخاصة بإيقاف استخدام الأجهزة."},{"key":"B","letter":"ب","text":"مطلوب إزالة الصور والاتصالات الشخصية."},{"key":"C","letter":"ج","text":"مطلوب توثيق انتهاء عقد مع مقدم الخدمة."},{"key":"D","letter":"د","text":"مطلوب التوقيع على إقرار تعارض المصالح."}],"explanation":"أ صحيح لأنه يجب وجود إجراءات واضحة لإنهاء أو إيقاف استخدام الأجهزة ضمن سياسة (BYOD) لحماية بيانات المؤسسة.\nب خطا لأنه يتعلق بالبيانات الشخصية ولا يمثل مطلبًا أساسيًا في السياسة الشاملة.\nج خطا لأنه مرتبط بعقود مزود الخدمة وليس بسياسة استخدام الأجهزة.\nد خطا لأنه لا يرتبط مباشرة بسياسة استخدام الأجهزة الذكية في العمل.","oldQNumber":"114","bankIndex":138,"setId":"set2"},{"id":"158","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من السمات التالية للبيانات تهدف عناصر تحكم الأمن السيبراني إلى حمايتها بشكل أساسي؟","options":[{"key":"A","letter":"أ","text":"الصدق والسرعة والتنوع."},{"key":"B","letter":"ب","text":"النزاهة والتوفر والسرية."},{"key":"C","letter":"ج","text":"إمكانية الوصول والدقة والفعالية."},{"key":"D","letter":"د","text":"التفويض والوصول المنطقي والوصول الفيزيائي."}],"explanation":"أ. خطأ لأنها ليست الأهداف الأساسية لعناصر تحكم الأمن السيبراني.\n\nب. صحيح لأن الأمن السيبراني يركز على حماية السرية (Confidentiality) والنزاهة (Integrity) والتوفر (Availability)، والمعروفة بمثلث CIA.\n\nج. خطأ لأنها خصائص مهمة ولكنها ليست الركائز الأساسية للأمن السيبراني.\n\nد. خطأ لأنها وسائل وضوابط أمنية وليست السمات الأساسية للبيانات التي يتم حمايتها.","oldQNumber":"119","bankIndex":139,"setId":"set2"},{"id":"163","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"وفقًا لإرشادات معهد المدققين الداخليين (IIA)، أيٌّ من الخيارات التالية يُعد من ضوابط تقنية المعلومات المادية والبيئية النموذجية؟","options":[{"key":"A","letter":"أ","text":"وضع الخوادم في غرف مقفلة مع تقييد الدخول إليها."},{"key":"B","letter":"ب","text":"تطبيق التشفير عندما تكون السرية متطلبًا مُعلنًا."},{"key":"C","letter":"ج","text":"تخصيص حقوق الوصول والتحكم بها وفقًا لسياسة المنظمة المُعلنة."},{"key":"D","letter":"د","text":"ضمان وجود عملية محكمة ومضبوطة لتطبيق جميع التغييرات والتحديثات (Patches) على البرمجيات والأنظمة ومكونات الشبكة والبيانات."}],"explanation":"أ صحيح لأنه يمثل ضابطًا ماديًا وبيئيًا (Physical & Environmental Control) يهدف إلى حماية الخوادم من الوصول غير المصرح به.\nب خطأ لأنه ضابط تقني يتعلق بحماية البيانات وليس حماية مادية.\nج خطأ لأنه ضابط وصول منطقي وليس مادي.\nد خطأ لأنه ضابط إدارة تغيير وليس ضابطًا ماديًا أو بيئيًا.","oldQNumber":"124","bankIndex":140,"setId":"set2"},{"id":"168","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي مما يلي مثال على عنصر تحكم رئيسي في تطوير النظام الذي يوجد عادة في التطوير الداخلي لنظام تطبيق؟","options":[{"key":"A","letter":"أ","text":"تراقب عناصر تحكم الوصول المنطقي استخدام التطبيق وتنشئ مسارات مراجعة."},{"key":"B","letter":"ب","text":"تم تصميم عملية التطوير لمنع و اكتشاف وتصحيح الأخطاء التي قد تحدث."},{"key":"C","letter":"ج","text":"يتم الحفاظ على سجل لتتبع عملية البيانات من الإدخال إلى الإخراج إلى التخزين"},{"key":"D","letter":"د","text":"يتم توثيق متطلبات مستخدمي الأعمال ، ويتم مراقبة تحقيقها"}],"explanation":"أ خطا لأنه يتعلق بضوابط الوصول والتدقيق وليس تطوير النظام نفسه.\nب صحيح لأنه يمثل تحكمًا أساسيًا في دورة تطوير النظام لضمان منع الأخطاء واكتشافها وتصحيحها.\nج خطا لأنه يتعلق بتتبع البيانات (مسار التدقيق) وليس التحكم في التطوير.\nد خطا لأنه يركز على متطلبات الأعمال وليس على التحكم في عملية التطوير نفسها.","oldQNumber":"129","bankIndex":141,"setId":"set2"},{"id":"173","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من العبارات التالية صحيحة فيما يتعلق بتطبيقات المستخدم (UDAs)؟","options":[{"key":"A","letter":"أ","text":"تكون UDAs أقل مرونة وأصعب في التكوين من تطبيقات تقنية المعلومات التقليدية."},{"key":"B","letter":"ب","text":"قد يؤدي تحديث UDAs إلى أخطاء مختلفة ناتجة عن التغييرات أو التصحيحات."},{"key":"C","letter":"ج","text":"عادةً ما تخضع UDAs لضوابط تطوير التطبيقات وإدارة التغيير."},{"key":"D","letter":"د","text":"يؤدي استخدام UDAs عادةً إلى تحسين قدرة المنظمة على الامتثال للوائح التنظيمية."}],"explanation":"أ خطا لأنه UDAs عادة تكون أكثر مرونة وأسهل في الاستخدام من التطبيقات التقليدية.\nب صحيح لأنه التعديلات على UDAs قد تسبب أخطاء بسبب ضعف الضوابط أو الاختبار.\nج خطا لأنه غالبًا لا تخضع UDAs لنفس مستوى الضوابط الرسمية للتطوير وإدارة التغيير.\nد خطا لأنه UDAs لا تحسن الامتثال غالبًا بسبب ضعف الضوابط والتوثيق.","oldQNumber":"134","bankIndex":142,"setId":"set2"},{"id":"178","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي مما يلي مثال على عنصر تحكم فيزيائي (ملموسة)؟","options":[{"key":"A","letter":"أ","text":"توفير معدات اكتشاف وإطفاء الحرائق"},{"key":"B","letter":"ب","text":"وضع سياسة أمن فيزيائي وتعزيزها في جميع أنحاء المنظمة"},{"key":"C","letter":"ج","text":"القيام بتخطيط استمرارية العمل واستعادة حالات الطوارئ"},{"key":"D","letter":"د","text":"الاحتفاظ بنسخة احتياطية خارج الموقع للبيانات المهمة للمؤسسة"}],"explanation":"أ. صحيح لأنه يمثل عنصر تحكم فيزيائي ملموس مثل أجهزة كشف وإطفاء الحريق.\n\nب. خطأ لأنه عنصر تحكم إداري (سياسات وإجراءات).\n\nج. خطأ لأنه يتعلق بالتخطيط والاستمرارية وليس تحكمًا فيزيائيًا مباشرًا.\n\nد. خطأ لأنه عنصر تحكم إداري/تقني متعلق بحماية البيانات وليس فيزيائيًا مباشرًا.","oldQNumber":"139","bankIndex":143,"setId":"set2"},{"id":"183","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من عناصر التحكم بالوصول الفيزيائي تعمل غالبًا كعنصر تحكم وقائي وعنصر تحكم كاشف؟","options":[{"key":"A","letter":"أ","text":"الأبواب المغلقة."},{"key":"B","letter":"ب","text":"جدران الحماية."},{"key":"C","letter":"ج","text":"كاميرات المراقبة."},{"key":"D","letter":"د","text":"معرفات تسجيل الدخول وكلمات المرور"}],"explanation":"أ. خطأ لأنها عنصر تحكم وقائي فقط (تمنع الدخول) وليست كاشفة.\n\nب. خطأ لأنها عنصر تحكم منطقي (Logical Control) وليست فيزيائية.\n\nج. صحيح لأن كاميرات المراقبة تعمل كعنصر كاشف (تسجل وتراقب الأحداث) وفي نفس الوقت قد تكون رادعًا وقائيًا لمنع السلوك غير المصرح به.\n\nد. خطأ لأنها عناصر تحكم منطقية خاصة بالمصادقة وليست فيزيائية.","oldQNumber":"144","bankIndex":144,"setId":"set2"},{"id":"188","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من عناصر تحكم الوصول البيومترية التالية تستخدم أكثر خصائص التعرف البشري تميّزاً أو تفرداً؟","options":[{"key":"A","letter":"أ","text":"مقارنة الوجه باستخدام بطاقة التعريف."},{"key":"B","letter":"ب","text":"مقارنة التوقيع."},{"key":"C","letter":"ج","text":"مقارنة الصوت."},{"key":"D","letter":"د","text":"مقارنة بصمة شبكية العين."}],"explanation":"أ. خطأ لأن التعرف على الوجه أقل دقة ويمكن أن يتأثر بالإضاءة والتشابه بين الأشخاص.\n\nب. خطأ لأن التوقيع قابل للتقليد والتغير وبالتالي أقل تفرداً.\n\nج. خطأ لأن الصوت يمكن أن يتغير ويتأثر بالظروف ولا يُعد الأكثر دقة.\n\nد. صحيح لأن بصمة شبكية العين تُعد من أكثر الخصائص الحيوية دقة وتفرداً، مما يجعلها أقوى وسيلة للتحقق البيومتري.","oldQNumber":"149","bankIndex":145,"setId":"set2"},{"id":"193","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من عناصر التحكم التالية من شأنه تمكين المؤسسة من مسح البيانات عن بعد من الهاتف الذي توفره الشركة للموظف في حالة فقدان الهاتف؟","options":[{"key":"A","letter":"أ","text":"برنامج إدارة الأجهزة المحمولة (MDM)"},{"key":"B","letter":"ب","text":"برنامج التشفير المحمول"},{"key":"C","letter":"ج","text":"برامج إدارة تطبيقات الهاتف المحمول (MAM)"},{"key":"D","letter":"د","text":"برنامج المصادقة المحمول"}],"explanation":"أ صحيح لأنه برنامج إدارة الأجهزة المحمولة (MDM) يتيح للمؤسسة إدارة الأجهزة عن بعد، بما في ذلك مسح البيانات عند فقدان الجهاز أو سرقته.\nب خطأ لأنه يحمي البيانات بالتشفير لكنه لا يوفر وظيفة المسح عن بعد.\nج خطأ لأنه يركز على إدارة التطبيقات وليس مسح بيانات الجهاز بالكامل.\nد خطأ لأنه يستخدم للتحقق من الهوية ولا يوفر إمكانية مسح البيانات عن بعد.","oldQNumber":"154","bankIndex":146,"setId":"set2"},{"id":"198","form":"form2","formTitle":"Group 2","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من ضوابط الأمان التالية يوفر المصادقة الأكثر فعالية وكفاءة للعملاء للوصول إلى حسابات التسوق عبر الإنترنت هذه؟","options":[{"key":"A","letter":"أ","text":"ميزة كلمة المرور المكونة من 12 رقمًا."},{"key":"B","letter":"ب","text":"ميزة سؤال الأمان."},{"key":"C","letter":"ج","text":"ميزة التعرف على الصوت."},{"key":"D","letter":"د","text":"ميزة تسجيل الدخول بمستويين"}],"explanation":"أ خطا لأنه يعتمد على كلمة مرور فقط ويمكن اختراقها أو تخمينها.\nب خطا لأنه يمكن معرفة الإجابات أو تخمينها بسهولة.\nج خطا لأنه قد يتأثر بالبيئة وجودة الصوت وليس دائمًا دقيقًا.\nد صحيح لأنه يوفر طبقتين من التحقق مما يزيد الأمان والكفاءة في تسجيل الدخول","oldQNumber":"159","bankIndex":147,"setId":"set2"},{"id":"203","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"C","question":"أي من أنواع الحسابات التالية يجب عدم إغلاقه في نهاية الفترة؟","options":[{"key":"A","letter":"أ","text":"حسابات صافي الدخل"},{"key":"B","letter":"ب","text":"حسابات المصاريف"},{"key":"C","letter":"ج","text":"حسابات الالتزامات"},{"key":"D","letter":"د","text":"حساب مسحوبات المالكين"}],"explanation":"أ. خطأ لأنه حسابات صافي الدخل يتم إغلاقها في نهاية الفترة.\n\nب. خطأ لأنه حسابات المصاريف يتم إغلاقها أيضًا في نهاية الفترة.\n\nج. صحيح لأنه حسابات الالتزامات هي حسابات دائمة ولا يتم إغلاقها.\n\nد. خطأ لأنه حساب مسحوبات المالكين يتم إغلاقه في نهاية الفترة.","oldQNumber":"2","bankIndex":148,"setId":"set3"},{"id":"207","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"B","question":"أي مما يلي يمكن تصنيفه كاستثمارات بالدين؟","options":[{"key":"A","letter":"أ","text":"الاستثمارات في رأس مال الأسهم لشركة"},{"key":"B","letter":"ب","text":"شراء سندات حكومية."},{"key":"C","letter":"ج","text":"محتويات محفظة استثمارية."},{"key":"D","letter":"د","text":"حيازة الأسهم العادية لشركة."}],"explanation":"أ. خطأ لأنه يمثل استثمارًا في حقوق ملكية وليس استثمارًا بالدين.\n\nب. صحيح لأنه السندات الحكومية تُعد أداة دين تمثل قرضًا على الجهة المصدرة.\n\nج. خطأ لأنه وصف عام لمحفظة استثمارية وقد تحتوي على أدوات دين وحقوق ملكية.\n\nد. خطأ لأنه يمثل استثمارًا في الأسهم وهي أدوات حقوق ملكية وليست دين.","oldQNumber":"6","bankIndex":149,"setId":"set3"},{"id":"212","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"تقوم شركة متعددة الجنسيات بنقل المنتجات من منشأة الإنتاج الخاصة بها الى فروع الشركة في عدة دول لبيعها في تلك الدول. أي من العبارات التالية صحيحة فيما يتعلق بالتسعير التحويلي في هذا السيناريو ؟","options":[{"key":"A","letter":"أ","text":"تؤثر أسعار التحويل عل الأرباح الخاضعة للضريبة في مختلف الولايات الضريبية"},{"key":"B","letter":"ب","text":"لن يكون لأسعار التحويل ف الفروع المختلفة لنفس الشركة أي تأثير عل صافي دخل القيد الموحد"},{"key":"C","letter":"ج","text":"يعتبر التسعير التحويل ي مفيدا ً لمساعدة الشركة عل ضمان توحيد الأسعار بين الدول المختلفة"},{"key":"D","letter":"د","text":"لا داعي لتحديد أسعار التحويل إذا تم نقل المنتجات عي فروع الشركة المختلفة بسعر التكلفة"}],"explanation":"أ. صحيح لأنه أسعار التحويل تؤثر على توزيع الأرباح بين الدول وبالتالي على الضرائب في كل ولاية ضريبية.\n\nب. خطأ لأنه رغم أن صافي الدخل الموحد لا يتغير، إلا أن التوزيع الداخلي للأرباح يتأثر.\n\nج. خطأ لأنه الهدف من التسعير التحويلي ليس توحيد الأسعار بين الدول بل تسعير المعاملات الداخلية.\n\nد. خطأ لأنه يجب تحديد أسعار التحويل حتى لو تم النقل بسعر التكلفة.","oldQNumber":"11","bankIndex":150,"setId":"set3"},{"id":"217","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"C","question":"أي من الخيارات التالية يشرح بشكل أفضل كيفية الاعتراف بمصروفات البيع والإدارة في كل من طريقتي التكلفة الكلية والتكلفة المتغيرة؟","options":[{"key":"A","letter":"أ","text":"يتم الاعتراف بها كتكاليف منتج في التكلفة الكلية وكفترات في التكلفة المتغيرة."},{"key":"B","letter":"ب","text":"يتم الاعتراف بها كتكاليف فترات في التكلفة الكلية وتكاليف منتج في التكلفة المتغيرة."},{"key":"C","letter":"ج","text":"يتم الاعتراف بها كتكاليف فترات في كلا الطريقتين."},{"key":"D","letter":"د","text":"يتم الاعتراف بها كتكاليف منتج في كلا الطريقتين"}],"explanation":"ا. خطأ لأنه في التكلفة الكلية لا تُعامل مصروفات البيع والإدارة كتكاليف منتج\nب. خطأ لأنه في التكلفة المتغيرة أيضًا لا تُعتبر تكاليف منتج\nج. صحيح لأنه في كل من التكلفة الكلية والمتغيرة تُعتبر مصروفات البيع والإدارة تكاليف فترة\nد. خطأ لأنه لا يتم اعتبارها تكاليف منتج في أي من الطريقتين","oldQNumber":"16","bankIndex":151,"setId":"set3"},{"id":"222","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"قامت الشركة عن طريق الخطا بتغيير المخزون الختامي ما التاثير الذي يطرأ على التزامات المؤسسة؟","options":[{"key":"A","letter":"أ","text":"لا يوجد أثر على الالتزامات."},{"key":"B","letter":"ب","text":"يتم تضخيم الالتزامات."},{"key":"C","letter":"ج","text":"يتم تخفيض الالتزامات."},{"key":"D","letter":"د","text":"تؤثر أخطاء المخزون على قائمة الدخل فقط."}],"explanation":"أ. صحيح لأنه خطأ المخزون النهائي يؤثر على تكلفة البضاعة وصافي الدخل، وليس على الالتزامات مباشرة.\n\nب. خطأ لأنه لا توجد علاقة مباشرة تؤدي إلى تضخيم الالتزامات.\n\nج. خطأ لأنه لا يؤدي إلى تخفيض الالتزامات.\n\nد. خطأ لأنه لا يؤثر فقط على قائمة الدخل بل يؤثر أيضًا على الميزانية (الأصول).","oldQNumber":"21","bankIndex":152,"setId":"set3"},{"id":"227","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"يتم الفصل بين حسابات الشركة وحسابات مالك الشركة وفقا لأي مبدا ؟","options":[{"key":"A","letter":"أ","text":"الكيان الاقتصادي"},{"key":"B","letter":"ب","text":"الوحدة النقدية"},{"key":"C","letter":"ج","text":"مقابلة الايرادات بالمصروفات"},{"key":"D","letter":"د","text":"الاستمرارية"}],"explanation":"أ. صحيح لأنه مبدأ الكيان الاقتصادي يفصل بين شخصية المنشأة وشخصية المالك.\n\nب. خطأ لأنه مبدأ الوحدة النقدية يتعلق باستخدام عملة ثابتة للقياس وليس الفصل بين الحسابات.\n\nج. خطأ لأنه مبدأ المقابلة يربط الإيرادات بالمصروفات.\n\nد. خطأ لأنه مبدأ الاستمرارية يتعلق باستمرار نشاط المنشأة وليس الفصل بين الحسابات.","oldQNumber":"26","bankIndex":153,"setId":"set3"},{"id":"232","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"B","question":"ما الذي يتأثر بشكل أكبر بسياسة الأرباح المحتجزة؟","options":[{"key":"A","letter":"أ","text":"النقد."},{"key":"B","letter":"ب","text":"توزيعات الأرباح."},{"key":"C","letter":"ج","text":"الهامش الإجمالي."},{"key":"D","letter":"د","text":"صافي الدخل."}],"explanation":"أ. خطأ لأنه النقد يتأثر بعدة قرارات تشغيلية وتمويلية وليس فقط سياسة الأرباح المحتجزة.\n\nب. صحيح لأنه سياسة الأرباح المحتجزة تحدد نسبة الأرباح التي يتم توزيعها كأرباح أو الاحتفاظ بها داخل الشركة.\n\nج. خطأ لأنه الهامش الإجمالي مرتبط بالإيرادات وتكلفة المبيعات وليس بسياسة الأرباح المحتجزة.\n\nد. خطأ لأنه صافي الدخل يتحدد قبل توزيع الأرباح وليس العكس.","oldQNumber":"31","bankIndex":154,"setId":"set3"},{"id":"237","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"B","question":"إذا كانت لدى مؤسسة كمية كبيرة من رأس المال العامل مقارنة بمتوسط الصناعة، فأي مما يلي على الأرجح صحيح؟","options":[{"key":"A","letter":"أ","text":"قد يصبح سداد الالتزامات قصيرة الأجل صعبًا."},{"key":"B","letter":"ب","text":"قد يتم تقييد النقد في عناصر لا تولد قيمة مالية."},{"key":"C","letter":"ج","text":"سياسات التحصيل الخاصة بالمؤسسة غير فعالة."},{"key":"D","letter":"د","text":"المؤسسة فعالة في استخدام الأصول لتحقيق إيرادات."}],"explanation":"أ. خطأ لأنه عادةً ما يشير ارتفاع رأس المال العامل إلى قدرة أفضل على سداد الالتزامات قصيرة الأجل.\n\nب. صحيح لأنه قد يدل على وجود أموال مستثمرة في أصول متداولة لا تحقق عائدًا مناسبًا.\n\nج. خطأ لأنه لا يمكن استنتاج عدم فعالية سياسات التحصيل من ارتفاع رأس المال العامل وحده.\n\nد. خطأ لأنه قد يشير إلى وجود أصول متداولة زائدة عن الحاجة وليس بالضرورة إلى كفاءة أعلى في تحقيق الإيرادات.","oldQNumber":"36","bankIndex":155,"setId":"set3"},{"id":"242","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"C","question":"ما الذي ينطبق على تمويل السندات، مقارنة بالأسهم العادية، عندما تكون جميع المتغيرات الأخرى متساوية؟","options":[{"key":"A","letter":"أ","text":"سيطرة أقل للمساهمين."},{"key":"B","letter":"ب","text":"مديونية أقل."},{"key":"C","letter":"ج","text":"ربح أعلى للشركة للسهم."},{"key":"D","letter":"د","text":"أرباح شركة إجمالية أعلى"}],"explanation":"أ. خطأ لأنه إصدار السندات لا يؤثر مباشرة على سيطرة المساهمين مقارنة بالأسهم.\n\nب. خطأ لأنه تمويل السندات يزيد المديونية وليس يقللها.\n\nج. صحيح لأنه تمويل الدين (السندات) قد يؤدي إلى رفع ربح السهم نتيجة عدم زيادة عدد الأسهم.\n\nد. خطأ لأنه لا يرفع الأرباح الإجمالية للشركة بشكل مباشر.","oldQNumber":"41","bankIndex":156,"setId":"set3"},{"id":"247","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"D","question":"عندما يتم تحديد تعويض الإدارة التنفيذية بناءً على النتائج المالية للمؤسسة ، أي من المواقف التالية هو الأكثر احتمالًا للوقوع؟","options":[{"key":"A","letter":"أ","text":"تبلغ المنظمة عن تقديرات واستحقاقات غير مناسبة بسبب ضعف عناصر تحكم المحاسبة."},{"key":"B","letter":"ب","text":"تستخدم المنظمة عملية غير موثوقة لجمع بيانات تعويضات الإدارة التنفيذية والإبلاغ عنها."},{"key":"C","letter":"ج","text":"تواجه المنظمة استياء متزايدًا من الموظفين ، إذا كان المديرون التنفيذيون مؤهلين للحصول على مبالغ تعويضية تعتبر غير معقولة."},{"key":"D","letter":"د","text":"تشجع المنظمة على سلوك الموظفين الذي يتعارض مع مصالح أصحاب المصلحة ذوي الصلة"}],"explanation":"أ. خطأ لأنه يرتبط بضعف الرقابة المحاسبية وليس بالضرورة نتيجة مباشرة لربط التعويض بالأداء المالي.\n\nب. خطأ لأنه يتعلق بجودة نظام جمع البيانات وليس أثر ربط التعويض بالأداء.\n\nج. خطأ لأنه يصف أثرًا اجتماعيًا محتملًا لكنه ليس النتيجة الأكثر ارتباطًا مباشرة بالتحفيز السلوكي للإدارة.\n\nد. صحيح لأنه ربط التعويض بالأداء المالي قد يدفع الإدارة إلى سلوكيات قد لا تتماشى مع مصالح أصحاب المصلحة لتحقيق نتائج مالية أفضل.","oldQNumber":"46","bankIndex":157,"setId":"set3"},{"id":"252","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"أي من السيناريوهات التالية سيتم استخدام التسعير التحويلي فيه ؟","options":[{"key":"A","letter":"أ","text":"تمتلك الشركة \"أ\" الشركة \"ب\"، وتبيع الشركة \"ب\" البضائع للشركة \"أ\"."},{"key":"B","letter":"ب","text":"الشركة \"أ\" لا تمتلك الشركة \"ب\"، وتفرض الشركة \"أ\" رسومًا على الشركة \"ب\" لبيع سلع الشركة \"ب\" دون الحصول على ملكية البضائع"},{"key":"C","letter":"ج","text":"تمتلك الشركة \"أ\" كلا من الشركة \"ب\" والشركة \"ج\". وتبيع الشركات الثلاث البضائع للجمهور"},{"key":"D","letter":"د","text":"تقوم الشركة \"أ\" بنقل البضائع داخليًا من موقع إلى آخر"}],"explanation":"أ. صحيح لأنه التسعير التحويلي يُستخدم بين شركات مرتبطة (تابعة/أم) لتسعير المعاملات الداخلية بينها.\n\nب. خطأ لأنه لا توجد علاقة ملكية أو سيطرة تبرر استخدام التسعير التحويلي.\n\nج. خطأ لأن البيع للجمهور لا يتضمن معاملات داخلية بين أطراف مرتبطة.\n\nد. خطأ لأنه مجرد نقل داخلي وليس بين وحدات محاسبية مستقلة.","oldQNumber":"51","bankIndex":158,"setId":"set3"},{"id":"257","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"عند مراجعة عناصر تحكم التطبيق باستخدام النموذج ذي المستويات الأربعة، أي من العمليات التالي مرتبطة بالمستوى الرابع من طريقة العملية التجارية؟","options":[{"key":"A","letter":"أ","text":"النشاط"},{"key":"B","letter":"ب","text":"عملية فرعية"},{"key":"C","letter":"ج","text":"عملية رئيسية"},{"key":"D","letter":"د","text":"عملية ضخمة"}],"explanation":"أ. صحيح لأنه في النموذج ذي المستويات الأربعة يكون المستوى الرابع هو مستوى النشاط التفصيلي داخل العملية.\n\nب. خطأ لأنه العملية الفرعية تقع في مستوى أعلى من مستوى النشاط.\n\nج. خطأ لأنه العملية الرئيسية تمثل مستوى أعلى وتجميعي أكثر من مستوى النشاط.\n\nد. خطأ لأنه ليس تصنيفًا قياسيًا ضمن مستويات نموذج العملية التجارية.","oldQNumber":"56","bankIndex":159,"setId":"set3"},{"id":"262","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"C","question":"أي نوع من السندات يُباع بأقل من قيمته الاسمية ثم يزداد في قيمته سنويًا حتى يستحق وتوفر للمالك العائد الكامل؟","options":[{"key":"A","letter":"أ","text":"سندات ذات العائد المرتفع"},{"key":"B","letter":"ب","text":"سندات المدعومة بالسلع"},{"key":"C","letter":"ج","text":"سندات الخصم"},{"key":"D","letter":"د","text":"سندات الرديئة"}],"explanation":"أ. خطأ لأنه السندات ذات العائد المرتفع ترتبط بمعدل فائدة مرتفع وليس بالبيع بخصم.\n\nب. خطأ لأنها مرتبطة بضمانات سلع وليس بطريقة التسعير.\n\nج. صحيح لأنها سندات تُباع بأقل من قيمتها الاسمية وتزداد قيمتها تدريجيًا حتى تاريخ الاستحقاق.\n\nد. خطأ لأنها تصف جودة ائتمانية منخفضة وليس طريقة التسعير.","oldQNumber":"61","bankIndex":160,"setId":"set3"},{"id":"267","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"تنتج شركة دلاء مياه بتكاليف لكل دلو على النحو التالي: العمل المباشر = 2 دولار المواد المباشرة = 5 دولارات التصنيع الثابت = 3.5 دولار التصنيع المتغير = 2.5 دولار عادة ما تُباع دلاء المياه مقابل 15 دولارًا. ومع ذلك ، تلقت الشركة طلبًا خاصًا لـ 50,000 دلو مياه مقابل 11 دولارًا لكل منها. بافتراض وجود قدرة تصنيعية كافية وجميع المتغيرات الأخرى ثابتة ، ما هي التكلفة ذات الصلة بالوحدة الواحدة التي يجب مراعاتها عند اتخاذ قرار بشأن قبول هذا الطلب الخاص بالسعر المخفض؟","options":[{"key":"A","letter":"أ","text":"9.50 دولارًا"},{"key":"B","letter":"ب","text":"10.50 دولارًا"},{"key":"C","letter":"ج","text":"11 دولارًا"},{"key":"D","letter":"د","text":"13 دولارًا"}],"explanation":"أ. صحيح لأنه يتم احتساب التكاليف المتغيرة فقط (المواد المباشرة + العمل المباشر + التصنيع المتغير) = 5 + 2 + 2.5 = 9.5 دولار، والتكاليف الثابتة غير ذات صلة.\n\nب. خطأ لأنه يتضمن تكاليف غير ذات صلة بقرار الطلب الخاص.\n\nج. خطأ لأنه يمثل سعر البيع وليس التكلفة ذات الصلة.\n\nد. خطأ لأنه يتضمن التكاليف الثابتة غير ذات صلة بالقرار.","oldQNumber":"66","bankIndex":161,"setId":"set3"},{"id":"272","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"D","question":"كيف يمكن لمفهوم التكلفة ذات الصلة أن يساعد الإدارة في التحليل السلوكي؟","options":[{"key":"A","letter":"أ","text":"يشرح الافتراض القائل بأن كلا من التكاليف والإيرادات خطية من خلال النطاق ذي الصلة."},{"key":"B","letter":"ب","text":"يُمكِّن الإدارة من حساب الحد الأدنى من الوحدات لإنتاجها وبيعها دون تكبد خسارة."},{"key":"C","letter":"ج","text":"يمكن الإدارة من التنبؤ بكيفية تأثر التكاليف مثل استهلاك المعدات بتغير قرارات العمل."},{"key":"D","letter":"د","text":"يمكن الإدارة من اتخاذ قرارات الأعمال، لأنه يشرح التكلفة التي سيتم تكبدها لمسار عمل معين."}],"explanation":"أ. خطأ لأنه يصف افتراضات تحليل التكلفة والحجم والربح وليس مفهوم التكلفة ذات الصلة.\n\nب. خطأ لأنه يصف تحليل نقطة التعادل وليس التكلفة ذات الصلة.\n\nج. خطأ لأنه يتعلق بتوزيع أو توقع التكاليف وليس تحديد التكلفة الملائمة للقرار.\n\nد. صحيح لأنه يركز على التكاليف التي تتغير حسب قرار معين وتساعد الإدارة في اتخاذ قرارات سليمة.","oldQNumber":"71","bankIndex":162,"setId":"set3"},{"id":"277","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"تحاول الإدارة العليا تحديد ما إذا كانت ستستخدم طريقة الشطب المباشر أو طريقة الاستحقاق لتسجيل الديون المعدومة على الحسابات المستقبلة. أي مما يلي سيكون أفضل حجة لاستخدام طريقة الشطب المباشر؟","options":[{"key":"A","letter":"أ","text":"إنها مفيدة عندما تعتبر الخسائر غير مهمة."},{"key":"B","letter":"ب","text":"توفر توافقًا أفضل مع الإيرادات."},{"key":"C","letter":"ج","text":"إنها الطريقة المفضلة وفقًا لـ IIA."},{"key":"D","letter":"د","text":"تحدد المبالغ المستقبلة بالقيمة القابلة للتحقيق الصافي في الميزانية العمومية."}],"explanation":"أ. صحيح لأنه طريقة الشطب المباشر تُستخدم عادة عندما تكون الديون المعدومة غير جوهرية وغير مهمة ماليًا.\n\nب. خطأ لأنه طريقة الاستحقاق هي التي توفر توافقًا أفضل مع الإيرادات.\n\nج. خطأ لأنه لا توجد أفضلية خاصة لطريقة الشطب المباشر وفقًا للـ IIA.\n\nد. خطأ لأنه هذا الوصف ينطبق على طريقة الاستحقاق وليس الشطب المباشر.","oldQNumber":"76","bankIndex":163,"setId":"set3"},{"id":"282","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"احسب dividend payout ratio إذا كان NI = 200 وكان retained earnings = 150 و dividend = 60؟","options":[{"key":"A","letter":"أ","text":"30%"},{"key":"B","letter":"ب","text":"40%"},{"key":"C","letter":"ج","text":"50%"},{"key":"D","letter":"د","text":"60%"}],"explanation":"أ. صحيح لأنه نسبة توزيع الأرباح = توزيعات الأرباح ÷ صافي الدخل = 60 ÷ 200 = 30%.\n\nب. خطأ لأنه ناتج عن قسمة غير صحيحة.\n\nج. خطأ لأنه قيمة أعلى من النسبة الفعلية المحسوبة.\n\nد. خطأ لأنه لا يمثل الناتج الصحيح للحساب.","oldQNumber":"81","bankIndex":164,"setId":"set3"},{"id":"287","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"المبلغ المخصص للاستثمار 500 الف دولار وفقا لمعدل العائد الداخلى لأربع شركات علما بأن تكلفة راس المال تقريباً 12% أي الاستثمار افضل أي المشاريع التالية تختار للاستثمار إذا كان العائد الذي تأخذه الشركة 12 المشروع ؟","options":[{"key":"A","letter":"أ","text":"المشروع أ 15%"},{"key":"B","letter":"ب","text":"المشروع ب 11%"},{"key":"C","letter":"ج","text":"المشروع ج 10%"},{"key":"D","letter":"د","text":"المشروع د 12%"}],"explanation":"أ. صحيح لأنه معدل العائد الداخلي (15%) أعلى من تكلفة رأس المال (12%) وبالتالي المشروع مقبول وهو الأفضل.\n\nب. خطأ لأنه أقل من تكلفة رأس المال وبالتالي غير مقبول.\n\nج. خطأ لأنه أقل من تكلفة رأس المال بشكل أكبر وبالتالي مرفوض.\n\nد. خطأ لأنه يساوي تكلفة رأس المال ولا يحقق عائد إضافي.","oldQNumber":"87","bankIndex":165,"setId":"set3"},{"id":"292","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"B","question":"قدم عميل تجزئة كبير عرضًا لشراء10000. وحدة بسعر خاص قدره 7 دولارات للوحدة. عادة ما يبيع المصنع كل وحدة مقابل 10 دولارات. تكاليف التصنيع المتغيرة هي 5 دولارات للوحدة وتكاليف التصنيع الثابتة هي 3 دولارات للوحدة. لقبول هذا الطلب اي من الافتراضات التالية يجب ان يكون صحيحا؟","options":[{"key":"A","letter":"أ","text":"تكون تكاليف التصنيع الثابتة والمتغيرة أقل من سعر البيع الخاص."},{"key":"B","letter":"ب","text":"يمكن للمصنع تنفيذ الطلب دون توسيع قدرات مرافق الإنتاج."},{"key":"C","letter":"ج","text":"يمكن امتصاص التكاليف المرتبطة بقبول هذا العرض من خلال بيع منتجات أخرى."},{"key":"D","letter":"د","text":"تعمل مرافق إنتاج الشركة حاليًا بكامل طاقتها."}],"explanation":"أ. خطأ لأنه حتى لو كان السعر أعلى من التكاليف المتغيرة، فإن التكاليف الثابتة غير ذات صلة في قرارات الطلب الخاص.\n\nب. صحيح لأنه لقبول طلب خاص يجب أن تكون هناك طاقة إنتاجية متاحة دون الحاجة لتوسيع المرافق.\n\nج. خطأ لأنه لا يشترط امتصاص التكاليف من خلال مبيعات أخرى لقبول الطلب.\n\nد. خطأ لأنه إذا كانت الطاقة الإنتاجية بكامل طاقتها فلن يكون من الممكن عادة قبول طلب إضافي.","oldQNumber":"92","bankIndex":166,"setId":"set3"},{"id":"297","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"C","question":"ما الذي يفسر مبدأ المطابقة/المقابلة (matching principle) بشكل أفضل؟","options":[{"key":"A","letter":"أ","text":"يجب الاعتراف بالإيرادات عند تحقيقها."},{"key":"B","letter":"ب","text":"يطابق تحقيق الإيرادات مع النقد."},{"key":"C","letter":"ج","text":"يرتبط تحقيق المصروفات باعتراف الإيرادات."},{"key":"D","letter":"د","text":"يتم الاعتراف بالمصروفات في كل فترة محاسبية."}],"explanation":"أ. خطأ لأنه يصف مبدأ الاعتراف بالإيرادات وليس مبدأ المطابقة/المقابلة.\n\nب. خطأ لأنه يربط الإيرادات بالنقد، بينما مبدأ المطابقة يربط المصروفات بالإيرادات المرتبطة بها.\n\nج. صحيح لأنه يقضي بالاعتراف بالمصروفات في الفترة نفسها التي يتم فيها الاعتراف بالإيرادات المتعلقة بها.\n\nد. خطأ لأنه لا يتم الاعتراف بجميع المصروفات في كل فترة محاسبية، وإنما وفق ارتباطها بالإيرادات أو الفترة المستفيدة منها.","oldQNumber":"97","bankIndex":167,"setId":"set3"},{"id":"302","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"B","question":"تشتري مؤسسة أوراق مالية لأغراض التداول وتبيعها خلال فترة زمنية قصيرة. ما هي الطريقة الصحيحة لتقييم وإبلاغ تلك الأوراق المالية في تاريخ القوائم المالية؟","options":[{"key":"A","letter":"أ","text":"بالسعر العادل مع الإبلاغ عن التغييرات في قسم حقوق الملكية للمساهمين."},{"key":"B","letter":"ب","text":"بالسعر العادل مع الإبلاغ عن التغييرات في صافي الدخل."},{"key":"C","letter":"ج","text":"بالتكلفة المطفأة في قائمة الدخل"},{"key":"D","letter":"د","text":"كموجودات جارية في الميزانية العمومية"}],"explanation":"أ. خطأ لأنه في أوراق المتاجرة لا يتم الاعتراف بالتغيرات في حقوق الملكية بل في الأرباح والخسائر.\n\nب. صحيح لأنه يتم قياس أوراق التداول بالقيمة العادلة مع تسجيل التغيرات في صافي الدخل.\n\nج. خطأ لأنه لا يتم استخدام التكلفة المطفأة في أوراق التداول.\n\nد. خطأ لأنه تصنيف الأصل كموجودات جارية لا يحدد طريقة القياس المحاسبي له.","oldQNumber":"102","bankIndex":168,"setId":"set3"},{"id":"307","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"A","question":"يقرر المصنع ما إذا كان سيبيع المواد الخام أو يعالجها بشكل أكبر، ما هي التكاليف التالية ذات الصلة بهذا القرار؟","options":[{"key":"A","letter":"أ","text":"تكاليف المعالجة التدريجية (الاضافية)، والإيرادات التدريجية (الاضافية) ، ومصاريف التصنيع المتغيرة."},{"key":"B","letter":"ب","text":"التكاليف المشتركة، وتكاليف المعالجة التدريجية، ومصاريف التصنيع المتغيرة."},{"key":"C","letter":"ج","text":"الإيرادات التدريجية، والتكاليف المشتركة، وتكاليف المعالجة التدريجية."},{"key":"D","letter":"د","text":"مصاريف التصنيع المتغيرة، والإيرادات التدريجية، والتكاليف المشتركة."}],"explanation":"أ. صحيح لأنه في قرار البيع أو المعالجة الإضافية يتم التركيز على التكاليف والإيرادات التدريجية (الملائمة للقرار)، بالإضافة إلى التكاليف المتغيرة المرتبطة بعملية المعالجة الإضافية.\n\nب. خطأ لأنه يتضمن التكاليف المشتركة وهي غير ملائمة للقرار لأنها تكاليف غارقة.\n\nج. خطأ لأنه يتضمن التكاليف المشتركة وهي غير ذات صلة بالقرار.\n\nد. خطأ لأنه يتضمن التكاليف المشتركة وهي غير ملائمة لاتخاذ القرار.","oldQNumber":"107","bankIndex":169,"setId":"set3"},{"id":"312","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"D","question":"من المرجح أن تستخدم شركة أدوية كبيرة أي مما يلي لتحديد السيولة؟","options":[{"key":"A","letter":"أ","text":"أرباح السهم الواحد."},{"key":"B","letter":"ب","text":"معدل دوران الأصول."},{"key":"C","letter":"ج","text":"صافي الدخل."},{"key":"D","letter":"د","text":"النسبة الحالية."}],"explanation":"أ. خطأ لأنه أرباح السهم تقيس الربحية وليس السيولة.\n\nب. خطأ لأنه معدل دوران الأصول يقيس الكفاءة التشغيلية وليس السيولة.\n\nج. خطأ لأنه صافي الدخل يقيس الربحية وليس القدرة على السداد.\n\nد. صحيح لأنه النسبة الحالية تقيس قدرة الشركة على سداد التزاماتها قصيرة الأجل.","oldQNumber":"112","bankIndex":170,"setId":"set3"},{"id":"317","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بتكلفة النشاط activity based (ABC) costing ؟","options":[{"key":"A","letter":"أ","text":"يُشبه نظام تكلفة النشاط نظام تكلفة التقليدية في كيفية معالجته لتخصيص الأعباء التصنيعية غير المباشرة."},{"key":"B","letter":"ب","text":"يستخدم نظام تكلفة النشاط أساسًا واحدًا على مستوى الوحدة لتخصيص تكاليف الإنتاج الناصفة للمنتجات."},{"key":"C","letter":"ج","text":"يمكن استخدام نظام تكلفة النشاط مع نظام محاسبة أمر الإنتاج و نظام محاسبة تكلفة العملية."},{"key":"D","letter":"د","text":"العيب الأساسي لنظام تكلفة النشاط هو تكلفة المنتج الأقل دقة."}],"explanation":"أ. خطأ لأنه نظام ABC يختلف عن النظام التقليدي في طريقة تخصيص التكاليف غير المباشرة حيث يستخدم محركات تكلفة متعددة.\n\nب. خطأ لأنه لا يعتمد على أساس واحد على مستوى الوحدة، بل يستخدم عدة مسببات للتكلفة.\n\nج. صحيح لأنه يمكن دمج نظام تكلفة النشاط مع كل من نظام أمر الإنتاج ونظام تكلفة العملية حسب طبيعة الشركة.\n\nد. خطأ لأن العيب الأساسي في نظام ABC ليس دقة المنتج بل ارتفاع التكلفة والتعقيد في التطبيق.","oldQNumber":"117","bankIndex":171,"setId":"set3"},{"id":"322","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"C","question":"أي مما يلي يصف تكلفة التأمين؟","options":[{"key":"A","letter":"أ","text":"إيرادات مستحقة."},{"key":"B","letter":"ب","text":"استحقاق"},{"key":"C","letter":"ج","text":"مصروفات مدفوعة مسبقًا."},{"key":"D","letter":"د","text":"مصاريف مستحقة"}],"explanation":"أ. خطأ لأنه لا علاقة له بالتأمين كمصروف.\n\nب. خطأ لأنه وصف عام وليس تصنيفًا محاسبيًا دقيقًا للتأمين.\n\nج. صحيح لأنه التأمين غالبًا يُدفع مقدمًا ويُسجل كمصروف مدفوع مقدمًا ثم يُحمّل على الفترات.\n\nد. خطأ لأنه المصاريف المستحقة تعني مصروف لم يُدفع بعد.","oldQNumber":"122","bankIndex":172,"setId":"set3"},{"id":"327","form":"form2","formTitle":"Group 2","lesson":"ج- المالية","answer":"D","question":"أي مما يلي يمثل أفضل ما يمثل السعر الذي يجب أن تكون عليه اصول والتزامات وفقً لمبدأ القيمة العادلة ؟","options":[{"key":"A","letter":"أ","text":"الذي يتم استلامه لبيع أصل بنفس القيمة."},{"key":"B","letter":"ب","text":"السعر المدفوع لشراء التزام من مؤسسة أخرى."},{"key":"C","letter":"ج","text":"ا
