بيانات الثابتة."},{"key":"B","letter":"ب","text":"يتم تخزين جداول البيانات على خادم شبكة يتم نسخه احتياطيًا يوميًا."},{"key":"C","letter":"ج","text":"يتم توثيق الغرض من جدول البيانات واستخدامه."},{"key":"D","letter":"د","text":"يتم استخدام برنامج “تسجيل الدخول والخروج” للتحكم في إصدارات الجدول"}],"explanation":"أ. صحيح لأن حماية الصيغ والبيانات تمنع التعديل غير المقصود وتضمن دقة نتائج التقارير المالية.\nب. خطأ لأن النسخ الاحتياطي مهم لكنه ليس ضابطًا مباشرًا لدقة الصيغ داخل الجدول.\nج. خطأ لأن التوثيق مهم للحوكمة لكنه لا يضمن دقة العمليات الحسابية.\nد. خطأ لأن التحكم بالإصدارات لا يعالج مباشرة مشكلة دقة الصيغ أو البيانات.","oldQNumber":"83","bankIndex":604,"setId":"set6"},{"id":"605","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي من السمات البيانات التالية من المرجح أن يتم اختراقها في مؤسسة ذات ثقافة حوكمة بيانات ضعيفة؟","options":[{"key":"A","letter":"أ","text":"التنوع"},{"key":"B","letter":"ب","text":"السرعة"},{"key":"C","letter":"ج","text":"الحجم"},{"key":"D","letter":"د","text":"الموثوقية"}],"explanation":"أ. خطأ لأنه التنوع يتعلق بأنواع البيانات وليس بثقتها أو حوكمتها.\nب. خطأ لأنه السرعة تتعلق بسرعة تدفق البيانات وليس جودتها أو موثوقيتها.\nج. خطأ لأنه الحجم يتعلق بكمية البيانات وليس بدرجة الاعتماد عليها.\nد. صحيح لأنه ضعف حوكمة البيانات يؤثر مباشرة على موثوقية البيانات ودقتها واعتماديتها.","oldQNumber":"84","bankIndex":605,"setId":"set6"},{"id":"606","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"تقوم هيئة الضرائب باستخدام تحليل البيانات (Data Analytics) لدراسة أنماط وسلوكيات وعادات دافعي الضرائب. ما السبب الرئيسي لذلك؟","options":[{"key":"A","letter":"أ","text":"إعداد تقرير لتكلفة المراجعة الضريبية على دافعي الضرائب."},{"key":"B","letter":"ب","text":"إعادة احتساب معدلات الضرائب المطبقة على دافعي الضرائب."},{"key":"C","letter":"ج","text":"تحديد الاستحقاقات الضريبية والكشف عن حالات عدم الامتثال والمخاطر الضريبية."},{"key":"D","letter":"د","text":"تقليل عدد موظفي هيئة الضرائب من خلال إلغاء عمليات التدقيق الضريبية."}],"explanation":"أ. خطأ؛ لأن تحليل البيانات لا يُستخدم لإعداد تقارير عن تكلفة المراجعة الضريبية.\n\nب. خطأ؛ لأن تحليل البيانات لا يهدف إلى إعادة احتساب معدلات الضرائب.\n\nج. صحيح؛ لأن تحليل البيانات يساعد في تحديد الاستحقاقات الضريبية والكشف عن حالات عدم الامتثال والمخاطر الضريبية.\n\nد. خطأ؛ لأن تحليل البيانات يهدف إلى تحسين كفاءة التدقيق، وليس إلى إلغاء عمليات التدقيق أو تقليل عدد الموظفين.","oldQNumber":"85","bankIndex":606,"setId":"set6"},{"id":"607","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"لقد وضعت العديد من المؤسسات استراتيجية لفتح مراكز تسوق مشتركة ما هو الهدف الاساسي من هذه الاستراتيجية.","options":[{"key":"A","letter":"أ","text":"استغلال الكفاءة الأساسية"},{"key":"B","letter":"ب","text":"زيادة التكامل السوقي"},{"key":"C","letter":"ج","text":"تقديم قيمة محسنة"},{"key":"D","letter":"د","text":"تقليل التكاليف"}],"explanation":"أ. خطأ لأنه استغلال الكفاءة الأساسية هدف عام وليس مرتبط مباشرة بإنشاء مراكز تسوق مشتركة.\nب. صحيح لأنه فتح مراكز تسوق مشتركة يهدف إلى تعزيز التكامل بين الأسواق وزيادة الترابط بينها.\nج. خطأ لأنه تقديم قيمة محسنة نتيجة محتملة وليس الهدف الأساسي المباشر.\nد. خطأ لأنه تقليل التكاليف قد يحدث لكنه ليس الهدف الرئيسي للاستراتيجية.","oldQNumber":"86","bankIndex":607,"setId":"set6"},{"id":"608","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"اي مما يلي يصف بشكل افضل هدف التخطيط للتعافي من الكوارث؟","options":[{"key":"A","letter":"أ","text":"اعادة تشكيل /بناء الانظمة بفاعلية بعد وقوع حدث مزعج"},{"key":"B","letter":"ب","text":"تحديد القواعد الخاصة بكيفية الاتصال الاجهزة داخل النظام بعد وقوع كارثة"},{"key":"C","letter":"ج","text":"وصف كيفية نقل البيانات الى نظام اخر في حالة الطوارئ"},{"key":"D","letter":"د","text":"انشاء منطقة محمية للشبكة يمكن للمستخدمين الوصول اليها بعد الكارثة"}],"explanation":"أ. صحيح لأن الهدف الأساسي من التعافي من الكوارث هو استعادة الأنظمة وإعادة تشغيلها بعد وقوع حادث كبير.\nب. خطأ لأنه يتعلق بإعدادات الاتصال وليس التعافي من الكوارث بشكل شامل.\nج. خطأ لأنه يصف جانبًا من استمرارية الأعمال (نقل البيانات) وليس الهدف الكامل.\nد. خطأ لأنه يصف بيئة تقنية وليس هدف التعافي نفسه.","oldQNumber":"87","bankIndex":608,"setId":"set6"},{"id":"609","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"اثناء تدقيق مشروع بناء ، راجع المدقق الداخلي نتائج العطاءات واتصل بمقدمي العطاءات الذين تمت دعوتهم للمشاركة ولكنهم لم يقدموا عطاءاتهم واوضح مقدمو العطاءات ان الاطار الزمني الممنوح لدراسة الوثائق الفنية وتقييم التكاليف وتقديم المقترحات كان قصيرا للغاية . اي من المخاطر التالية يجب ان يتوقعها المدقق الداخلي في هذ الموقف بالذات؟","options":[{"key":"A","letter":"أ","text":"خطر ان تكون تكاليف البناء اعلى من المتوقع، حيث يتعين على مقدمي العطاءات تحديد الاسعار في ظل عدم اليقين"},{"key":"B","letter":"ب","text":"خطر عدم امتلاك مقدمي العطاءات الذين قدموا المقترحات للمؤهلات ذات الصلة"},{"key":"C","letter":"ج","text":"الخطر هو ان الوثائق الفنية قد تكون مفصل للغاية ولا تسمح الا بقدر ضئيل من المرونة"},{"key":"D","letter":"د","text":"خطر عدم اكتمال البناء في الموعد المحدد ، حيث من المرجح ان يطلب الشركاء مواعيد نهائية أطول"}],"explanation":"أ. صحيح لأنه قِصر مدة تقديم العطاءات يدفع الموردين لتقدير الأسعار بسرعة مما يزيد احتمال ارتفاع التكاليف.\nب. خطأ لأنه لا علاقة بين الوقت القصير ومؤهلات مقدمي العطاءات.\nج. خطأ لأنه لا يرتبط بمستوى تفصيل الوثائق الفنية.\nد. خطأ لأنه يتعلق بالجدول الزمني للتنفيذ وليس بعملية تقديم العطاءات نفسها.","oldQNumber":"88","bankIndex":609,"setId":"set6"},{"id":"610","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أيّ ممّا يلي هو أهم بند في العقد يجب تدقيقه، لأنّه يؤثّر عادةً على كفاءة الأعمال؟","options":[{"key":"A","letter":"أ","text":"خدمة الضمان"},{"key":"B","letter":"ب","text":"بند الظروف الاستثنائية"},{"key":"C","letter":"ج","text":"التعويضات"},{"key":"D","letter":"د","text":"تحديد المسؤولية"}],"explanation":"أ. خطأ لأن خدمة الضمان مهمة لكنها لا تؤثر بشكل شامل على كفاءة الأعمال مقارنة بتحديد المسؤوليات.\nب. خطأ لأن الظروف الاستثنائية تتعلق بحالات طارئة وليست أساس تشغيل الأعمال.\nج. خطأ لأن التعويضات ترتبط بالجوانب المالية بعد حدوث ضرر.\nد. صحيح لأن تحديد المسؤولية يوضح الأدوار والالتزامات ويؤثر مباشرة على كفاءة تنفيذ الأعمال وتقليل النزاعات","oldQNumber":"89","bankIndex":610,"setId":"set6"},{"id":"611","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"يكشف الملف الشخصي لسمات شخصية المدقق الداخلي عن أن المدقق الداخلي هو الأكثر تحفيزًا من خلال احتياجات تحقيق الذات. وبالنظر إلى ذلك، أي مما يلي من المرجح أن يكون أفضل محفز لهذا المدقق؟","options":[{"key":"A","letter":"أ","text":"تناوب المدقق للعمل ضمن فريق تدقيق متعدد التخصصات"},{"key":"B","letter":"ب","text":"تكليف المدقق بالعمل على عمليات التدقيق المعقدة والصعبة"},{"key":"C","letter":"ج","text":"طمأنة المدقق بأن ميزانية التدقيق الداخلي مستقرة وأن وظيفة المدقق آمنة"},{"key":"D","letter":"د","text":"تقديم مزايا متزايدة في حزمة تعويضات المدقق"}],"explanation":"أ. خطأ لأن التنوع في العمل مفيد لكنه لا يحقق أعلى مستوى من التحفيز المرتبط بتحقيق الذات.\nب. صحيح لأن تحقيق الذات يرتبط بالتحدي، التعلم، وتطوير القدرات من خلال مهام معقدة وصعبة.\nج. خطأ لأنه يتعلق بالأمان الوظيفي وهو من الاحتياجات الأساسية وليس تحقيق الذات.\nد. خطأ لأنه يتعلق بالتحفيز المالي وليس تحقيق الذات.","oldQNumber":"90","bankIndex":611,"setId":"set6"},{"id":"612","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي مما يلي يصف الفائدة الأساسية لاستخدام إطار عمل الرقابة في تكنولوجيا المعلومات عند تنفيذ نظام الرقابة في تكنولوجيا المعلومات؟","options":[{"key":"A","letter":"أ","text":"يوفر إطار الرقابة في تكنولوجيا المعلومات الأساس لتنفيذ ضوابط فعالة وكفؤة."},{"key":"B","letter":"ب","text":"بضمن إطار الرقابة في تكنولوجيا المعلومات أن المؤسسة تلبى معيارا معترفا به لحوكمة تكنولوجيا المعلومات."},{"key":"C","letter":"ج","text":"يضمن اطار الرقابة في تكنولوجيا المعلومات أن نظام الضوابط الرقابية الصارمة والضوابط الرقابية المرنة سيعمل على التخفيف بشكل فعال من المخاطر"},{"key":"D","letter":"د","text":"يتيح إطار الرقابة في تكنولوجيا المعلومات إمكانية تدقيق حوكمة تكنولوجيا المعلومات وفقا لمعيار تكنولوجيا المعلومات"}],"explanation":"أ. صحيح لأنه إطار الرقابة يوفر الهيكل الأساسي لتصميم وتنفيذ ضوابط فعالة وذات كفاءة.\nب. خطأ لأنه الالتزام بالمعايير ليس الفائدة الأساسية المباشرة للإطار.\nج. خطأ لأنه لا يضمن بشكل مطلق فعالية جميع أنواع الضوابط.\nد. خطأ لأنه إمكانية التدقيق نتيجة للإطار وليس الهدف الأساسي له.","oldQNumber":"91","bankIndex":612,"setId":"set6"},{"id":"613","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أي من العبارات التالية تعد صحيحة فيما يتعلق بالموازنة الرأسمالية؟","options":[{"key":"A","letter":"أ","text":"باستخدام طريقة القيمة الحالية الصافية، يكون الاقتراح مقبولاً عندما تكون القيمة الحالية الصافية سلبية."},{"key":"B","letter":"ب","text":"معدل العائد الداخلي هو أعلى معدل فائدة من شأنه أن يتسبب في أن تكون القيمة الحالية للنفقات الرأسمالية المقترحة أقل من القيمة الحالية للتدفقات النقدية السنوية."},{"key":"C","letter":"ج","text":"يتم استخدام تقنية الاسترداد النقدي لتحديد الفترة الزمنية اللازمة لاسترداد الاستثمار الرأسمالي، بالإضافة إلى العائد المتوقع، من التدفق النقدي السنوي الناتج عن الاستثمار."},{"key":"D","letter":"د","text":"يتم استخدام تقنية معدل العائد السنوي لتقدير ربحية الإنفاق الرأسمالي عن طريق قسمة صافي الدخل السنوي المتوقع على متوسط الاستثمار."}],"explanation":"أ. خطأ لأنه في طريقة القيمة الحالية الصافية يكون المشروع مقبولاً عندما تكون القيمة الحالية الصافية موجبة وليست سلبية.\n\nب. خطأ لأنه معدل العائد الداخلي هو المعدل الذي يجعل القيمة الحالية الصافية تساوي صفراً.\n\nج. صحيح لأنه أسلوب الاسترداد النقدي يستخدم لمعرفة المدة اللازمة لاسترداد تكلفة الاستثمار من التدفقات النقدية المتوقعة.\n\nد. خطأ لأنه معدل العائد السنوي يُستخدم لقياس الربحية، لكنه لا يصف مفهوم الاسترداد النقدي المذكور في السؤال.","oldQNumber":"92","bankIndex":613,"setId":"set6"},{"id":"614","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"أيٌّ من البيانات التالية يمكن قياسها كمياً؟","options":[{"key":"A","letter":"أ","text":"مرونة المنتج."},{"key":"B","letter":"ب","text":"فترة ضمان المنتج."},{"key":"C","letter":"ج","text":"جودة المنتج."},{"key":"D","letter":"د","text":"سهولة استخدام المنتج."}],"explanation":"أ. خطأ لأن مرونة المنتج غالباً تُقيَّم وصفياً ولا تُقاس بشكل كمي مباشر.\n\nب. صح لأن فترة الضمان يمكن قياسها بالأيام أو الأشهر أو السنوات.\n\nج. خطأ لأن جودة المنتج غالباً ما تُقيَّم بناءً على معايير وصفية أو تقديرية.\n\nد. خطأ لأن سهولة استخدام المنتج تُعد من الخصائص النوعية التي تعتمد على تقييم المستخدمين.","oldQNumber":"93","bankIndex":614,"setId":"set6"},{"id":"615","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"انهت احدى المؤسسات عقدا يتوقع بموجبه من المورد تصميم وشراء وبناء محطة طاقة فرعية بمبلغ 3,000000 دولار .في هذا السيناريو، وافقت المؤسسة على أي نوع من العقود التالية؟","options":[{"key":"A","letter":"أ","text":"عقد استرداد التكاليف"},{"key":"B","letter":"ب","text":"عقد بمبلغ اجمالي ( مقطوع )"},{"key":"C","letter":"ج","text":"عقد الوقت والموارد"},{"key":"D","letter":"د","text":"عقد ثنائي"}],"explanation":"أ. خطأ لأنه عقد استرداد التكاليف يعتمد على دفع التكاليف الفعلية وليس مبلغ ثابت.\nب. صحيح لأنه عقد بمبلغ اجمالي يعني الاتفاق على سعر ثابت مسبق لإنجاز المشروع بالكامل.\nج. خطأ لأنه عقد الوقت والموارد يعتمد على الدفع حسب الوقت والجهد وليس مبلغ محدد.\nد. خطأ لأنه ليس تصنيفاً معروفاً للعقود في هذا السياق.","oldQNumber":"94","bankIndex":615,"setId":"set6"},{"id":"616","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اي مما يلي يعد من فوائد مفهوم إنترنت الأشياء؟","options":[{"key":"A","letter":"أ","text":"يمكن للموظفين الاختيار من بين مجموعة متنوعة من الأجهزة التي يريدون استخدامها لقراءة رسائل البريد الالكتروني الخاصة بالعمل بشكل خاص دون علم صاحب العمل."},{"key":"B","letter":"ب","text":"يمكن ضبط الأجهزة المادية ، مثل منظمات الحرارة والمضخات الحرارية ، لتفاعل مع تغييرات سوق الكهرباء وخفض التكاليف."},{"key":"C","letter":"ج","text":"يمكن استخراج المعلومات بكفاءة اكبر من قواعد البيانات وارسالها إلى التطبيقات ذات الصلة لإجراء تحليلات متعمقة."},{"key":"D","letter":"د","text":"اصبح استخراج البيانات وجمعها من الإنترنت وشبكات التواصل الاجتماعي أسهل ، والنتائج أكثر شمولاً."}],"explanation":"أ. خطأ لأنه يصف سلوك غير مرتبط بإنترنت الأشياء وفائدته التشغيلية.\nب. صحيح لأنه إنترنت الأشياء يتيح ربط الأجهزة المادية بالإنترنت لتعمل وتتفاعل تلقائياً مما يقلل التكاليف.\nج. خطأ لأنه يتعلق بتحليل البيانات وليس إنترنت الأشياء بشكل مباشر.\nد. خطأ لأنه يتعلق بجمع البيانات من الإنترنت وليس التحكم بالأجهزة الذكية.","oldQNumber":"95","bankIndex":616,"setId":"set6"},{"id":"617","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"اي مما يلي يصف بشكل أفضل هجومًا إلكترونيًا يشنه شخص وسيط؟","options":[{"key":"A","letter":"أ","text":"يستطيع المشتبه به حذف البيانات على الشبكة دون الوصول الفعلي إلى الجهاز."},{"key":"B","letter":"ب","text":"يستطيع المشتبه به استغلال أنشطة الشبكة لأغراض غير مصرح بها."},{"key":"C","letter":"ج","text":"يستطيع المشتبه به من السيطرة على اتصالات البيانات أثناء النقل واستبدال حركة المرور."},{"key":"D","letter":"د","text":"يستطيع المشتبه به تعطيل الضوابط الأمنية الافتراضية وإدخال نقاط ضعف إضافية."}],"explanation":"أ. خطأ لأنه حذف البيانات لا يصف هجوم “الرجل في المنتصف”.\nب. خطأ لأنه وصف عام لاستغلال الشبكة وليس اعتراض الاتصال.\nج. صحيح لأنه هجوم الشخص الوسيط (Man-in-the-Middle) يعتمد على اعتراض وتعديل الاتصالات أثناء نقلها.\nد. خطأ لأنه يتعلق بإضعاف الأنظمة وليس اعتراض الاتصالات.","oldQNumber":"96","bankIndex":617,"setId":"set6"},{"id":"618","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اي من انواع الشبكات التالية من المرجح ان تستخدمه شركة صغيرة مع جهازي كمبوتر محمول وطابعة وكمبيونر مكتبي و ستة اجهزة ذكية؟","options":[{"key":"A","letter":"أ","text":"شبكة القيمة المضافة (VAN)"},{"key":"B","letter":"ب","text":"شبكة المنطقة المحلية (LAN)"},{"key":"C","letter":"ج","text":"شبكة المنطقة الحضرية (MAN)"},{"key":"D","letter":"د","text":"شبكة واسعة النطاق (WAN)"}],"explanation":"أ. خطأ لأنه شبكة القيمة المضافة تستخدم لتبادل البيانات بين المؤسسات.\nب. صحيح لأنه شبكة LAN مناسبة لربط الأجهزة داخل موقع أو مكتب صغير.\nج. خطأ لأنه شبكة MAN تغطي منطقة أو مدينة كاملة.\nد. خطأ لأنه شبكة WAN تستخدم لربط مواقع متباعدة جغرافياً.","oldQNumber":"97","bankIndex":618,"setId":"set6"},{"id":"619","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"تريد احدى المؤسسات تصميم برنامج فعال للخصوصية، أي ممايلي يجب تحليله اولا؟","options":[{"key":"A","letter":"أ","text":"اصول البيانات data lineage"},{"key":"B","letter":"ب","text":"تحديد مجالات البيانات data mapping"},{"key":"C","letter":"ج","text":"مخزون البيانات data inventory"},{"key":"D","letter":"د","text":"تصنيف البيانات data classification"}],"explanation":"أ. خطأ لأنه تحليل تدفق البيانات يأتي بعد معرفة ما هي البيانات الموجودة.\nب. خطأ لأنه تحديد خرائط البيانات يتم بعد إنشاء مخزون شامل للبيانات.\nج. صحيح لأنه أول خطوة في برنامج الخصوصية هي معرفة جميع البيانات الموجودة لدى المؤسسة (جرد البيانات).\nد. خطأ لأنه تصنيف البيانات يتم بعد تحديد البيانات الموجودة وجردها.","oldQNumber":"98","bankIndex":619,"setId":"set6"},{"id":"620","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"من المرجح ان تساعد سياسة تصنيف البيانات في تحقيق اي من اهداف التحكم التالية؟","options":[{"key":"A","letter":"أ","text":"التاكد من صحة سجل البيانات"},{"key":"B","letter":"ب","text":"ضمان اكتمال البيانات"},{"key":"C","letter":"ج","text":"ازالة سجل البيانات المكررة"},{"key":"D","letter":"د","text":"الامتثال لقواعد حماية البيانات"}],"explanation":"أ. خطأ لأنه صحة البيانات تتعلق بالتحقق من دقة الإدخال وليس بتصنيف البيانات.\nب. خطأ لأنه اكتمال البيانات يتعلق بوجود جميع الحقول المطلوبة وليس بتصنيفها.\nج. خطأ لأنه إزالة التكرار يتعلق بتنظيف البيانات وليس بتصنيفها.\nد. صحيح لأنه تصنيف البيانات يساعد المؤسسة على تحديد مستوى حساسية البيانات وتطبيق متطلبات الحماية المناسبة وبالتالي الامتثال للقوانين.","oldQNumber":"99","bankIndex":620,"setId":"set6"},{"id":"621","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أي مما يلي ميزة أمنية تتضمن استخدام أجهزة وبرامج لتصفية أو منع معلومات محددة من الانتقال بين الشبكة الداخلية والشبكة الخارجية؟","options":[{"key":"A","letter":"أ","text":"التفويض"},{"key":"B","letter":"ب","text":"نموذج البنية."},{"key":"C","letter":"ج","text":"جدار الحماية."},{"key":"D","letter":"د","text":"الشبكة الافتراضية الخاصة"}],"explanation":"أ. خطأ لأنه التفويض يتعلق بتحديد الصلاحيات وليس منع أو تصفية حركة البيانات بين الشبكات.\nب. خطأ لأنه نموذج البنية يصف تصميم النظام وليس أداة أمنية.\nج. صحيح لأنه جدار الحماية يقوم بتصفية ومنع أو السماح بمرور البيانات بين الشبكات وفق قواعد أمنية محددة.\nد. خطأ لأن الشبكة الافتراضية الخاصة تُستخدم لتأمين الاتصال وليس لتصفية البيانات.","oldQNumber":"102","bankIndex":621,"setId":"set6"},{"id":"622","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أي مما يلي يصف بشكل أفضل القائد التحولي ، على عكس القائد التبادلي؟","options":[{"key":"A","letter":"أ","text":"يبحث القائد عن الانحرافات عن القواعد والمعايير ويتدخل عند وجود انحرافات."},{"key":"B","letter":"ب","text":"يتدخل القائد فقط عندما لا يتم استيفاء معايير الأداء."},{"key":"C","letter":"ج","text":"يتدخل القائد للابلاغ التوقعات عالية"},{"key":"D","letter":"د","text":"القائد لا يتدخل لتعزيز حل المسائل"}],"explanation":"أ. خطأ لأنه يصف أسلوب الإدارة بالاستثناء (تبادلي) وليس القيادة التحويلية.\nب. خطأ لأنه يصف القيادة التبادلية التي تعتمد على التدخل عند انخفاض الأداء فقط.\nج. صحيح لأنه القائد التحولي يركز على رفع التوقعات وتحفيز الموظفين لتحقيق أداء أعلى.\nد. خطأ لأنه لا يمثل نمط القيادة التحولية أو التبادلية بشكل دقيق.","oldQNumber":"103","bankIndex":622,"setId":"set6"},{"id":"623","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"تشير المؤسسة التي تحرك معدل تحويل المبيعات من ٥٪؜ الى ١٢٪؜ الى اي مما يلي؟","options":[{"key":"A","letter":"أ","text":"نشاط مبيعات اسوأ"},{"key":"B","letter":"ب","text":"استخدام افضل للمخزون"},{"key":"C","letter":"ج","text":"نشاط مبيعات افضل"},{"key":"D","letter":"د","text":"استخدام مخزون اسوأ"}],"explanation":"أ. خطأ لأنه ارتفاع معدل التحويل لا يدل على تراجع في المبيعات بل تحسنها.\nب. خطأ لأنه السؤال يتعلق بمعدل تحويل المبيعات وليس إدارة المخزون بشكل مباشر.\nج. صحيح لأنه زيادة معدل التحويل من ٥٪ إلى ١٢٪ تعني نجاح أكبر في تحويل العملاء إلى مبيعات.\nد. خطأ لأنه لا يعكس معنى ارتفاع معدل التحويل بل عكسه.","oldQNumber":"105","bankIndex":623,"setId":"set6"},{"id":"624","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي من الأجهزة التالية يتحكم بشكل أفضل في كل من الوصول المادي والمنطقي إلى أنظمة المعلومات؟","options":[{"key":"A","letter":"أ","text":"القياسات الحيوية البيومترية (جسمك)"},{"key":"B","letter":"ب","text":"أقفال الأمان."},{"key":"C","letter":"ج","text":"أنظمة المصائد."},{"key":"D","letter":"د","text":"حساسات السيلينيوم."}],"explanation":"أ. صح لأنه يتحكم في الوصول المادي والمنطقي.\n\nب. خطأ لأنه يتحكم في الوصول المادي فقط.\n\nج. خطأ لأنه يستخدم للكشف وليس للتحكم في الوصول.\n\nد. خطأ لأنه لا يستخدم للتحكم في الوصول.","oldQNumber":"107","bankIndex":624,"setId":"set6"},{"id":"625","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"تم تكليف مراجع داخلي باختبار الموظفين الوهميين باستخدام تحليلات البيانات. قام المراجع باستخراج بيانات الموظفين من الموارد البشرية والرواتب. باستخدام وظائف جداول البيانات، قام المراجع بمطابقة مجموعات البيانات حسب الاسم وافترض أن الموظفين غير الموجودين في كل مجموعة بيانات يجب التحقيق معهم بشكل أكبر. ومع ذلك، بدت النتائج خاطئة، حيث لم يتطابق سوى عدد قليل جداً من الموظفين عبر جميع مجموعات البيانات. ما هي خطوة تحليلات البيانات التي من المرجح قد أغفلها المدقق؟","options":[{"key":"A","letter":"أ","text":"تحليل البيانات"},{"key":"B","letter":"ب","text":"تشخيص البيانات"},{"key":"C","letter":"ج","text":"سرعة البيانات"},{"key":"D","letter":"د","text":"تطبيع البيانات (معالجة بيانات)"}],"explanation":"أ. خطأ لأن تحليل البيانات يأتي بعد تجهيزها وليس سبب المشكلة هنا.\nب. خطأ لأن تشخيص البيانات يتعلق بتفسير النتائج وليس تجهيزها للمطابقة.\nج. خطأ لأن سرعة البيانات لا علاقة لها بمطابقة السجلات.\nد. صحيح لأن تطبيع البيانات (Normalization) يضمن توحيد التنسيق والبُنى بين مجموعات البيانات قبل المطابقة، مما يمنع اختلافات الأسماء أو التنسيقات التي تؤدي لنتائج غير دقيقة.","oldQNumber":"108","bankIndex":625,"setId":"set6"},{"id":"626","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي مما يلي ضروري لإدارة البيانات بشكل أفضل مع الحفاظ على الجودة والدقة؟","options":[{"key":"A","letter":"أ","text":"أبعاد جودة البيانات."},{"key":"B","letter":"ب","text":"عناصر البيانات الهامة."},{"key":"C","letter":"ج","text":"نسب البيانات."},{"key":"D","letter":"د","text":"إدارة البيانات."}],"explanation":"أ. صحيح لأنها توفر معايير لقياس جودة البيانات مثل الدقة والاكتمال والاتساق والموثوقية، مما يساعد على إدارة البيانات بشكل أفضل.\n\nب. خطأ لأنها تمثل البيانات الأكثر أهمية للمنظمة، لكنها لا تحدد كيفية قياس جودة البيانات والمحافظة عليها.\n\nج. خطأ لأنها تستخدم لتحليل البيانات أو مقارنتها، ولا تعد إطارًا لضمان جودة البيانات ودقتها.\n\nد. خطأ لأنها تمثل مجموعة من الأنشطة والسياسات لإدارة البيانات، بينما أبعاد جودة البيانات هي التي تُستخدم لتقييم جودة البيانات والحفاظ عليها.","oldQNumber":"109","bankIndex":626,"setId":"set6"},{"id":"627","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"عند مراجعة عناصر التحكم في التطبيق باستخدام نموذج المستويات الاربعة، اي من العمليات المرتبطة بالمستوى 4 من طريقة عملية الاعمال؟","options":[{"key":"A","letter":"أ","text":"النشاط"},{"key":"B","letter":"ب","text":"⁠عملية فرعية"},{"key":"C","letter":"ج","text":"⁠عملية رئيسية"},{"key":"D","letter":"د","text":"⁠عملية ضخمة"}],"explanation":"أ. صحيح لأنه المستوى الرابع يمثل أدق مستوى في تحليل العمليات وهو مستوى النشاط.\nب. خطأ لأنه العملية الفرعية تكون في مستوى أعلى من النشاط.\nج. خطأ لأنه العملية الرئيسية مستوى أعلى ويشمل عدة عمليات فرعية.\nد. خطأ لأنه ليس تصنيفاً دقيقاً ضمن نموذج المستويات الأربعة.","oldQNumber":"110","bankIndex":627,"setId":"set6"},{"id":"628","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"يستخدم المراجع الداخلي تحليل البيانات للتركيز على مجالات المخاطر العالية أثناء الارتباط. حصل المراجع على البيانات ويعمل على إزالة التكرار في البيانات. أي من العبارات التالية صحيحة فيما يتعلق بهذا السيناريو؟","options":[{"key":"A","letter":"أ","text":"يقوم المراجع بتطبيع البيانات استعدادًا لتحليلها."},{"key":"B","letter":"ب","text":"يقوم المراجع بتحليل البيانات استعدادًا لتوصيل النتائج."},{"key":"C","letter":"ج","text":"يقوم المراجع بتنظيف البيانات استعدادًا لتحديد العمليات التي قد تكون معنية."},{"key":"D","letter":"د","text":"يقوم المراجع بمراجعة البيانات قبل تحديد السؤال"}],"explanation":"أ. صحيح لأن إزالة التكرار (deduplication) تُعد جزءًا من تطبيع/تهيئة البيانات قبل تحليلها.\nب. خطأ لأنه مرحلة لاحقة بعد التحليل وليست مرتبطة بإزالة التكرار.\nج. خطأ لأنه التنظيف أوسع من مجرد إزالة التكرار، لكن السياق يركز على التطبيع.\nد. خطأ لأنه لا يصف مرحلة معالجة البيانات بشكل دقيق.","oldQNumber":"111","bankIndex":628,"setId":"set6"},{"id":"629","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"خلال أي مرحلة من مراحل التخطيط لاستعادة القدرة على العمل بعد الكوارث يجب على المؤسسة تحديد وحدات الأعمال والأصول والأنظمة التي تعتبر ضرورية لاستمرار مستوى مقبول من العمليات؟","options":[{"key":"A","letter":"أ","text":"مرحلة النطاق والبدء."},{"key":"B","letter":"ب","text":"تحليل تأثير الأعمال."},{"key":"C","letter":"ج","text":"تطوير الخطة."},{"key":"D","letter":"د","text":"الاختبار."}],"explanation":"أ. خطأ لأنه مرحلة النطاق والبدء تحدد الإطار العام للمشروع وليس تحديد الأنظمة الحرجة.\nب. صحيح لأنه تحليل تأثير الأعمال (BIA) يحدد الوظائف والأنظمة والأصول الأساسية لاستمرارية العمل.\nج. خطأ لأنه مرحلة تطوير الخطة تعتمد على نتائج التحليل ولا تقوم به.\nد. خطأ لأنه الاختبار مرحلة لاحقة لتقييم فعالية الخطة وليس تحديد الأصول.","oldQNumber":"112","bankIndex":629,"setId":"set6"},{"id":"630","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"قررت الشركة تأجيل استثماراتها في بلد أجنبي. ما نوع استجابة المخاطر؟","options":[{"key":"A","letter":"أ","text":"تجنب."},{"key":"B","letter":"ب","text":"قبول."},{"key":"C","letter":"ج","text":"تقاسم."},{"key":"D","letter":"د","text":"تقليل."}],"explanation":"أ. صح لأن الشركة قررت عدم المضي في الاستثمار حالياً لتجنب التعرض للمخاطر المرتبطة به.\n\nب. خطأ لأن قبول المخاطر يعني الاستمرار في النشاط مع تحمل المخاطر كما هي.\n\nج. خطأ لأن تقاسم المخاطر يعني نقل جزء منها إلى طرف آخر مثل الشركاء أو شركات التأمين.\n\nد. خطأ لأن تقليل المخاطر يعني اتخاذ إجراءات للحد من تأثيرها أو احتمال حدوثها مع الاستمرار في النشاط.","oldQNumber":"113","bankIndex":630,"setId":"set6"},{"id":"631","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي مما يلي هو السبب الأكثر ترجيحا الذي قد يدفع المؤسسة إلى اتخاذ قرار تجزئة الأسهم؟","options":[{"key":"A","letter":"أ","text":"الحفاظ على ثبات سعر السهم."},{"key":"B","letter":"ب","text":"الحفاظ على ثبات حقوق المساهمين."},{"key":"C","letter":"ج","text":"زيادة حقوق المساهمين."},{"key":"D","letter":"د","text":"تعزيز سيولة الأسهم."}],"explanation":"أ. خطأ لأنه تجزئة الأسهم لا تهدف إلى تثبيت سعر السهم بل إلى جعله في متناول عدد أكبر من المستثمرين.\n\nب. خطأ لأنه حقوق المساهمين لا تتغير نتيجة تجزئة الأسهم بل تبقى كما هي من حيث القيمة الإجمالية.\n\nج. خطأ لأنه تجزئة الأسهم لا تزيد حقوق المساهمين بل تقسم عدد الأسهم فقط.\n\nد. صحيح لأنه تجزئة الأسهم تهدف إلى جعل السهم بسعر أقل وبالتالي زيادة سهولة تداوله في السوق (سيولة أعلى).","oldQNumber":"114","bankIndex":631,"setId":"set6"},{"id":"632","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"اي من الإجراءات التالية يجب أن يتخذها المدقق الداخلي لتنظيف البيانات التي تم الحصول عليها لأغراض التحليل؟","options":[{"key":"A","letter":"أ","text":"نشر أداة تصور البيانات"},{"key":"B","letter":"ب","text":"اعتماد برنامج تحليل البيانات الموحدة."},{"key":"C","letter":"ج","text":"تحديد أهداف التحليلات وانشاء النتائج."},{"key":"D","letter":"د","text":"التخلص من السجلات المكررة."}],"explanation":"أ. خطأ لأنه تصور البيانات يتعلق بعرض النتائج وليس تنظيف البيانات.\nب. خطأ لأنه استخدام برنامج تحليل لا يضمن تنظيف البيانات بحد ذاته.\nج. خطأ لأنه تحديد الأهداف مرحلة تخطيط وليس تنظيف.\nد. صحيح لأنه إزالة التكرار تعتبر خطوة أساسية من خطوات تنظيف البيانات وتحسين جودتها.","oldQNumber":"115","bankIndex":632,"setId":"set6"},{"id":"633","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"أي من تقنيات الميزانية الرأسمالية التالية تراعي القيمة الزمنية للنقد؟","options":[{"key":"A","letter":"أ","text":"معدل العائد السنوي"},{"key":"B","letter":"ب","text":"التحليل التزايدي"},{"key":"C","letter":"ج","text":"التدفقات النقدية المخصومة"},{"key":"D","letter":"د","text":"الاسترداد النقدي"}],"explanation":"أ. خطأ لأنه معدل العائد السنوي لا يركز بشكل أساسي على القيمة الزمنية للنقد.\nب. خطأ لأنه التحليل التزايدي يقارن بين البدائل ولا يعتمد على خصم القيمة الزمنية.\nج. صحيح لأنه التدفقات النقدية المخصومة تأخذ بعين الاعتبار القيمة الزمنية للنقود عند التقييم.\nد. خطأ لأنه الاسترداد النقدي لا يأخذ القيمة الزمنية للنقود بالحسبان.","oldQNumber":"117","bankIndex":633,"setId":"set6"},{"id":"634","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"لقد تبنت احدى المؤسسات سياسة احضار الاجهزة الشخصية (BYOD) ويمكن للموظفين الوصول الى بيانات المؤسسة عبر اجهزتهم الذكية اي من متطلبات سياسة المصادقة التالية هو الاكثر استحسانا؟","options":[{"key":"A","letter":"أ","text":"تتطلب شبكة افتراضية خاصة (VPN)"},{"key":"B","letter":"ب","text":"تتطلب رمز مرور مكونا من ثمانية ارقام على الاقل او نمط تمرير معقدا"},{"key":"C","letter":"ج","text":"تتطلب وظيفة المسح عن بعد وتشفير البيانات المحلية"},{"key":"D","letter":"د","text":"تتطلب رمز المرور متبوعا باستجابة تتطلب رسالة تحقق"}],"explanation":"أ. خطأ لأنه VPN يحمي الاتصال لكنه ليس وسيلة مصادقة بحد ذاته.\nب. خطأ لأنه يعتمد على عامل مصادقة واحد فقط.\nج. خطأ لأنه يتعلق بحماية البيانات وليس بالمصادقة.\nد. صحيح لأنه يطبق المصادقة متعددة العوامل مما يزيد من الأمان.","oldQNumber":"118","bankIndex":634,"setId":"set6"},{"id":"635","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"من المرجح أن يتم إنشاء كلمة مرور لمرة واحدة في أي من المواقف التالية؟","options":[{"key":"A","letter":"أ","text":"عندما يصل موظف إلى شهادة رقمية عبر الإنترنت."},{"key":"B","letter":"ب","text":"عندما يتم قبول القياسات الحيوية للموظف."},{"key":"C","letter":"ج","text":"عندما ينشأ الموظف توقيعا رقميا مميزا."},{"key":"D","letter":"د","text":"عندما يستخدم موظف مفتاح فوب لاصدار رمز مميز."}],"explanation":"أ. خطأ لأنه الشهادة الرقمية لا تولّد كلمات مرور لمرة واحدة.\nب. خطأ لأنه القياسات الحيوية تستخدم للمصادقة ولا تولد OTP.\nج. خطأ لأنه التوقيع الرقمي لا يرتبط بإنشاء كلمات مرور مؤقتة.\nد. صحيح لأنه مفتاح الفوب (Token) يولد كلمات مرور لمرة واحدة بشكل دوري لتعزيز الأمان.","oldQNumber":"119","bankIndex":635,"setId":"set6"},{"id":"636","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"تخطط إحدى الشركات لتوحيد (دمج) بياناتها المالية مع شركة أخرى ضمن قوائم مالية موحدة. ما الحد الأدنى لنسبة الملكية التي تمنحها السيطرة وتستلزم عادةً توحيد القوائم المالية؟","options":[{"key":"A","letter":"أ","text":"إذا كانت نسبة ملكية الشركة المستثمر فيها أقل من 30%."},{"key":"B","letter":"ب","text":"إذا كانت نسبة ملكية الشركة المستثمر فيها بين 30% و50%."},{"key":"C","letter":"ج","text":"إذا كانت نسبة ملكية الشركة المستثمر فيها أكثر من 50%."},{"key":"D","letter":"د","text":"لا تعتمد على نسبة الملكية."}],"explanation":"أ. خطأ لأن نسبة ملكية أقل من 30% لا تمنح عادةً السيطرة على الشركة المستثمر فيها.\n\nب. خطأ لأن الملكية بين 30% و50% قد تمنح تأثيراً جوهرياً، لكنها لا تمنح السيطرة عادةً.\n\nج. صح لأن امتلاك أكثر من 50% من حقوق التصويت يمنح الشركة السيطرة عادةً، مما يستلزم توحيد القوائم المالية.\n\nد. خطأ لأن نسبة الملكية تُعد مؤشراً مهماً عند تقييم وجود السيطرة لأغراض التوحيد.","oldQNumber":"120","bankIndex":636,"setId":"set6"},{"id":"637","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"لدى شركة معينة دوران وظيفي كبير للموظفين. كيف يمكن معرفة السبب الجذري لهذه المشكلة؟","options":[{"key":"A","letter":"أ","text":"عمل وتحليل مقابلات الخروج مع الموظفين."},{"key":"B","letter":"ب","text":"زيادة عدد الموظفين الجدد في الشركة."},{"key":"C","letter":"ج","text":"مقارنة رواتب الموظفين مع الشركات المنافسة فقط."},{"key":"D","letter":"د","text":"مراجعة الهيكل التنظيمي للشركة دون التواصل مع الموظفين."}],"explanation":"أ صحيح لأن مقابلات الخروج تساعد في جمع معلومات مباشرة من الموظفين المغادرين حول الأسباب الحقيقية لترك العمل، مما يساعد على تحديد السبب الجذري لمشكلة الدوران الوظيفي.\n\nب خطأ لأن زيادة عدد الموظفين الجدد تعالج أثر المشكلة ولا تساعد في معرفة أسبابها الحقيقية.\n\nج خطأ لأن الرواتب قد تكون أحد الأسباب، لكن التركيز عليها فقط قد يؤدي إلى تجاهل أسباب أخرى مثل بيئة العمل أو الإدارة أو فرص التطور المهني.\n\nد خطأ لأن مراجعة الهيكل التنظيمي وحدها لا توفر معلومات كافية عن الأسباب الفعلية لاستقالة الموظفين دون الاستماع إليهم وتحليل آرائهم","oldQNumber":"122","bankIndex":637,"setId":"set6"},{"id":"638","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"اي من أنواع الحسابات التالية يجب إغلاقه في نهاية الفترة؟","options":[{"key":"A","letter":"أ","text":"حسابات قائمة الدخل"},{"key":"B","letter":"ب","text":"حسابات الميزانية العمومية"},{"key":"C","letter":"ج","text":"الحسابات الدائمة"},{"key":"D","letter":"د","text":"الحسابات الحقيقية"}],"explanation":"أ. صحيح لأنه يتم إغلاق حسابات الإيرادات والمصروفات (قائمة الدخل) في نهاية الفترة المحاسبية.\nب. خطأ لأن حسابات الميزانية العمومية هي حسابات دائمة لا تُغلق.\nج. خطأ لأن الحسابات الدائمة لا يتم إغلاقها في نهاية الفترة.\nد. خطأ لأن الحسابات الحقيقية هي أيضاً حسابات دائمة.","oldQNumber":"123","bankIndex":638,"setId":"set6"},{"id":"639","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"قررت الإدارة تغيير الهيكل التنظيمي من هيكل الذي كان لامركزيًا في السابق إلى الهيكل الذي اصبح الان شديد المركزية. على هذا النحو: اي ما يلي سيكون من سمات المؤسسة شديدة المركزية الان ؟","options":[{"key":"A","letter":"أ","text":"تقوم الإدارة العليا بمراقبة قليلة للقرارات المتخذة على المستويات الأدنى."},{"key":"B","letter":"ب","text":"تعتبر القرارات المتخذه على المستويات الادنى مهمة للغاية."},{"key":"C","letter":"ج","text":"القرارات التي يتم اتخاذها على المستويات الادنى في الهيكل التنظيمي قليلة."},{"key":"D","letter":"د","text":"يتم وضع الاعتماد على اتخاذ القرارات الإدارة العليا من قبل عدد قليل من ادارات المؤسسة."}],"explanation":"أ. خطأ لأنه في الهيكل المركزي تكون الرقابة من الإدارة العليا أكبر وليست أقل.\nب. خطأ لأنه في المركزية تقل أهمية قرارات المستويات الدنيا.\nج. صحيح لأنه في الهيكل شديد المركزية تتركز القرارات في الإدارة العليا وتقل صلاحيات المستويات الأدنى.\nد. خطأ لأنه لا يصف سمة واضحة للمركزية كما هو المطلوب.","oldQNumber":"124","bankIndex":639,"setId":"set6"},{"id":"640","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي من البيانات المالية التالية يوفر أفضل إفصاح عن كيفية استخدام أموال الشركة خلال فترة معينة؟","options":[{"key":"A","letter":"أ","text":"بيان الدخل."},{"key":"B","letter":"ب","text":"بيان حقوق الملكية للمالك"},{"key":"C","letter":"ج","text":"الميزانية العمومية."},{"key":"D","letter":"د","text":"بيان التدفقات النقدية."}],"explanation":"أ. خطأ لأنه بيان الدخل يوضح الأرباح والخسائر وليس حركة الأموال.\nب. خطأ لأنه يوضح التغير في حقوق الملكية وليس استخدام النقد.\nج. خطأ لأنه يعرض الوضع المالي في نقطة زمنية وليس التدفقات.\nد. صحيح لأنه يوضح كيفية دخول وخروج النقد واستخدامه خلال فترة معينة.","oldQNumber":"125","bankIndex":640,"setId":"set6"},{"id":"641","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"اي مما يلي سيكون افضل طريقة لجمع معلومات حول الرضا الوظيفي للموظفين؟","options":[{"key":"A","letter":"أ","text":"تم ارسال استطلاعات عبر الانترنت بشكل عشوائي الى الموظفين"},{"key":"B","letter":"ب","text":"ملاحظات مباشرة في الموقع للموظفين"},{"key":"C","letter":"ج","text":"اجتماعات البلدية مع الموظفين"},{"key":"D","letter":"د","text":"مقابلات وجها لوجه مع الموظفين"}],"explanation":"أ. خطأ لأنه الاستطلاعات العشوائية قد لا تعطي معلومات دقيقة أو عميقة عن الرضا الوظيفي.\nب. خطأ لأنه الملاحظات المباشرة لا تكشف مشاعر أو آراء الموظفين بشكل واضح.\nج. خطأ لأنه الاجتماعات الجماعية قد تمنع بعض الموظفين من التعبير بحرية.\nد. صحيح لأنه المقابلات الفردية تعطي معلومات أعمق وأكثر دقة عن رضا الموظفين.","oldQNumber":"128","bankIndex":641,"setId":"set6"},{"id":"642","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أقنع احد المهاجمين، متنكرًا في هيئة ممثل مصرف، احد الموظفين بالافصاح عن معلومات مالية معينة أدت في النهاية إلى احتيال. اي مما يلي يصف بشكل افضل خطر الأمن السيبراني هذا؟","options":[{"key":"A","letter":"أ","text":"التلصص من فوق الاكتاف"},{"key":"B","letter":"ب","text":"استزراع المواقع على الانترنت"},{"key":"C","letter":"ج","text":"التصيد الاحتيالي"},{"key":"D","letter":"د","text":"الهندسة الاجتماعية"}],"explanation":"أ. خطأ لأنه التلصص من فوق الأكتاف يعتمد على مراقبة مباشرة وليس إقناع الضحية.\nب. خطأ لأنه استزراع المواقع يتعلق بإنشاء مواقع مزيفة وليس انتحال شخصية عبر تواصل مباشر.\nج. خطأ لأنه التصيد الاحتيالي نوع محدد من الهجمات، لكن الوصف هنا أوسع.\nد. صحيح لأنه الهندسة الاجتماعية تشمل خداع الموظف وانتحال شخصية للحصول على معلومات حساسة.","oldQNumber":"129","bankIndex":642,"setId":"set6"},{"id":"643","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي من التالي يُعد من ضوابط برمجيات النظام؟","options":[{"key":"A","letter":"أ","text":"تقييد الدخول إلى غرفة الخوادم لأشخاص محددين"},{"key":"B","letter":"ب","text":"وضع الخوادم التي تحتوي على برامج حساسة بعيدًا عن المخاطر البيئية"},{"key":"C","letter":"ج","text":"التأكد من توثيق جميع متطلبات المستخدمين"},{"key":"D","letter":"د","text":"إجراء اختبارات الاختراق بشكل دوري"}],"explanation":"أ. خطأ لأنه ضابط مادي/فيزيائي وليس برمجيات نظام.\nب. خطأ لأنه أيضًا ضابط بيئي/مادي وليس متعلقًا بالبرمجيات.\nج. خطأ لأنه يتعلق بتحليل المتطلبات وليس ضوابط البرمجيات.\nد. صحيح لأنه اختبار الاختراق يرتبط مباشرة بتقييم وضبط أمن البرمجيات والأنظمة ضد الثغرات.","oldQNumber":"130","bankIndex":643,"setId":"set6"},{"id":"644","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"تعتبر \"السلامة قبل كل شي\" احدى القيم الاساسية للمؤسسة، اي من مؤشرات الاداء الرئيسية التالية سيكون مقياسا اكثر نضجا لعملية السلامة والذي يشجع ايضا الاداء وفرص التحسين؟","options":[{"key":"A","letter":"أ","text":"عدد الخسارات الوشيكة المبلغ عنها والتي تم التحقيق فيها."},{"key":"B","letter":"ب","text":"مؤشرات الالتزام والرضا في العمل"},{"key":"C","letter":"ج","text":"عدد الاصابات المرتبطة بالعمل لكل ربع سنة"},{"key":"D","letter":"د","text":"مكافاة دورية عند تحقيق نسبة منخفضة من الوقت المفقود من العمل الى الاصابات."}],"explanation":"أ. صحيح لأنه مؤشر استباقي (Leading Indicator) يساعد على تحسين السلامة قبل وقوع الحوادث.\nب. خطأ لأنه يقيس الرضا العام وليس أداء السلامة بشكل مباشر.\nج. خطأ لأنه مؤشر متأخر (Lagging Indicator) يعتمد على وقوع إصابات فعلياً.\nد. خطأ لأنه أسلوب تحفيزي وليس مؤشر أداء سلامة.","oldQNumber":"131","bankIndex":644,"setId":"set6"},{"id":"645","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"أي مما يلي مثال على المصادقة ذات المستويين؟","options":[{"key":"A","letter":"أ","text":"مطالبة المستخدم بإدخال معرف المستخدم وكلمة المرور."},{"key":"B","letter":"ب","text":"مطالبة المستخدم بإدخال كلمة مرور وإدخال بصمة إبهام."},{"key":"C","letter":"ج","text":"مطالبة المستخدم بإجراء فحص لشبكية العين."},{"key":"D","letter":"د","text":"مطالبة المستخدم باستخدام كاميرا ويب ومتصفح مغلق."}],"explanation":"أ. خطأ لأنه معرف المستخدم ليس وسيلة مصادقة، وإنما وسيلة تعريف، لذلك يوجد عامل مصادقة واحد فقط وهو كلمة المرور.\n\nب. صحيح لأنه يجمع بين عاملين مختلفين للمصادقة: شيء يعرفه المستخدم (كلمة المرور) وشيء يخصه (بصمة الإبهام).\n\nج. خطأ لأنه فحص شبكية العين يمثل عامل مصادقة واحد فقط.\n\nد. خطأ لأنه استخدام كاميرا ويب ومتصفح مغلق لا يمثل عاملين مستقلين للمصادقة.","oldQNumber":"133","bankIndex":645,"setId":"set6"},{"id":"646","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"أيٌّ من الحالات التالية يُعد السبب الأكثر احتمالًا لانخفاض أداء الموظف في العمل؟","options":[{"key":"A","letter":"أ","text":"عدم إنجاز المهام المطلوبة ضمن الوقت المحدد."},{"key":"B","letter":"ب","text":"تعرض جهاز الحاسوب الخاص بالموظف للإصابة بفيروسات أو برمجيات خبيثة."},{"key":"C","letter":"ج","text":"عدم وجود نسخ احتياطية لملفات العمل."},{"key":"D","letter":"د","text":"استخدام شاشة ذات حجم أصغر من المعتاد."}],"explanation":"أ. خطأ لأنه يُعد نتيجة لانخفاض الأداء وليس سببًا مباشرًا له.\n\nب. صح لأنه قد يؤدي إلى بطء الجهاز وتعطل البرامج، مما يؤثر على أداء الموظف وإنتاجيته.\n\nج. خطأ لأنه يؤثر على استعادة البيانات عند فقدانها، وليس على الأداء اليومي للموظف بشكل مباشر.\n\nد. خطأ لأنه قد يؤثر على راحة المستخدم، لكنه ليس السبب الأكثر احتمالًا لانخفاض الأداء.","oldQNumber":"135","bankIndex":646,"setId":"set6"},{"id":"647","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"وفقًا لتوجيهات معهد المدققين الداخليين، أي مما يلي يعد عامل نجاح لمشروع تكنولوجيا المعلومات؟","options":[{"key":"A","letter":"أ","text":"تبسيط عملية صنع القرار بدلًا من بناء توافق في الآراء بين المستخدمين."},{"key":"B","letter":"ب","text":"النظر في الحقائق بدلًا من النظر في المشاعر التي يظهرها أصحاب المصلحة في المشروع."},{"key":"C","letter":"ج","text":"التركيز على المرونة والقدرة على التكيّف بدلًا من استخدام المنهجية الرسمية."},{"key":"D","letter":"د","text":"تضمين المميزات النهائية، بدلًا من تضمين مجموعة من المميزات التكتيكية"}],"explanation":"أ. خطأ لأنه إلغاء التوافق بين المستخدمين يقلل من نجاح المشروع.\nب. خطأ لأنه تجاهل مشاعر أصحاب المصلحة ليس من عوامل النجاح في المشاريع.\nج. صحيح لأنه من أهم عوامل نجاح مشاريع تكنولوجيا المعلومات وجود مرونة وقدرة على التكيف مع التغيرات.\nد. خطأ لأنه ليس معيارًا معتمدًا لنجاح مشاريع تكنولوجيا المعلومات.","oldQNumber":"136","bankIndex":647,"setId":"set6"},{"id":"648","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"اي مما يلي صحيح فيما يتعلق بالسندات؟","options":[{"key":"A","letter":"أ","text":"لا يتمتع حاملو السندات بحقوق التصويت ولكنهم يحصلون على السيطرة على الشركة من خلال مدفوعات الفائدة"},{"key":"B","letter":"ب","text":"نادرا ما تستخدم المؤسسات ذات التصنيف الائتماني الجيد سندات الدين"},{"key":"C","letter":"ج","text":"يتضمن استخدام السندات دفع الفائدة بشكل دوري وسداد أصل الدين في تاريخ الاستحقاق"},{"key":"D","letter":"د","text":"سندات الدين هي سندات تحتوي على أصول محددة تعهد بها المؤسسة كضمان للسندات"}],"explanation":"أ. خطأ لأنه حاملو السندات لا يحصلون على السيطرة على الشركة، بل فقط على فوائد محددة.\nب. خطأ لأنه المؤسسات ذات التصنيف الجيد غالباً تستخدم السندات بسهولة وبكلفة أقل.\nج. صحيح لأنه السندات تعتمد على دفع فوائد دورية وإعادة أصل الدين عند الاستحقاق.\nد. خطأ لأنه هذا يصف نوعاً معيناً من السندات (المضمونة) وليس جميع السندات.","oldQNumber":"138","bankIndex":648,"setId":"set6"},{"id":"649","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي من منهجيات النسخ الاحتياطي التالية تُعد الأكثر كفاءة لنسخ قاعدة بيانات في بيئة الإنتاج؟","options":[{"key":"A","letter":"أ","text":"النسخ المتطابق للقرص (Disk Mirroring) للبيانات المخزنة على قاعدة البيانات."},{"key":"B","letter":"ب","text":"النسخ التفاضلي (Differential Backup) الذي يُنفّذ أسبوعياً."},{"key":"C","letter":"ج","text":"استخدام مصفوفة أقراص مستقلة لنسخ قاعدة البيانات احتياطياً."},{"key":"D","letter":"د","text":"النسخ الاحتياطي التزايدي (Incremental Backup) لقاعدة البيانات بشكل يومي"}],"explanation":"أ. خطأ لأن النسخ المتطابق ليس نسخاً احتياطياً تقليدياً بل تكرار لحظي مكلف.\nب. خطأ لأن النسخ التفاضلي أقل كفاءة ويزداد حجمه مع الوقت.\nج. خطأ لأن مصفوفة الأقراص حل تخزيني وليس منهجية نسخ احتياطي.\nد. صحيح لأن النسخ التزايدي ينسخ فقط التغييرات اليومية مما يجعله الأكثر كفاءة في استخدام الموارد.","oldQNumber":"139","bankIndex":649,"setId":"set6"},{"id":"650","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"أي من أسئلة استطلاع رأي الموظفين التالية سيكون الأكثر فعالية لقياس الالتزام التنظيمي؟","options":[{"key":"A","letter":"أ","text":"كيف تقيم فرص التطوير والتدريب التي تتلقاها في المؤسسة؟"},{"key":"B","letter":"ب","text":"ما مدى رضاك عن سلوك وتصرفات مديرك؟"},{"key":"C","letter":"ج","text":"ما مدى رضاك عن حجم الأجر الذي تتلقاه مقابل عملك؟"},{"key":"D","letter":"د","text":"ما مدى احتمالية أن توصى بالمؤسسة كصاحب عمل لأصدقائك؟"}],"explanation":"أ. خطأ لأنه يقيس فرص التدريب وليس الالتزام التنظيمي.\nب. خطأ لأنه يقيس الرضا عن المدير وليس الانتماء للمؤسسة.\nج. خطأ لأنه يقيس الرضا عن الأجر وليس الالتزام.\nد. صحيح لأنه يعكس مدى ارتباط الموظف بالمؤسسة واستعداده للتوصية بها، وهو مؤشر قوي على الالتزام التنظيمي.","oldQNumber":"140","bankIndex":650,"setId":"set6"},{"id":"651","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"تعاقدت إحدى المؤسسات مع مزود خارجي ثالث لتخطيط وتصميم وبناء منشأة جديدة، ترغب الإدارة العليا في نقل جميع المخاطر إلى المزود، ما نوع عقد المشتريات الذي ستستخدمه المنظمة؟","options":[{"key":"A","letter":"أ","text":"عقد التكلفة بالإضافة إلى الربح"},{"key":"B","letter":"ب","text":"عقد تسليم مفتاح (عقد مقطوع)"},{"key":"C","letter":"ج","text":"عقد الخدمة"},{"key":"D","letter":"د","text":"عقد الحلول"}],"explanation":"أ. خطأ لأن عقد التكلفة بالإضافة إلى الربح ينقل جزءًا محدودًا من المخاطر على العميل.\nب. صحيح لأن عقد التسليم المفتاحي ينقل معظم المخاطر إلى المزود ويجعله مسؤولًا عن التسليم الكامل للمشروع.\nج. خطأ لأنه عقد خدمة وليس مرتبطًا بتسليم مشروع متكامل.\nد. خطأ لأنه ليس تصنيفًا أساسيًا شائعًا في هذا السياق.","oldQNumber":"142","bankIndex":651,"setId":"set6"},{"id":"652","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"خلال عملية تدقيق البنية التحتية لتقنية المعلومات ، اي من الانواع التالية يجب ان يتضمن لتقييم بيئة الامن الملموسة؟","options":[{"key":"A","letter":"أ","text":"قواعد البيانات"},{"key":"B","letter":"ب","text":"التطبيقات"},{"key":"C","letter":"ج","text":"انظمة التشغيل"},{"key":"D","letter":"د","text":"مراكز البيانات"}],"explanation":"أ. خطأ لأنه قواعد البيانات تتعلق بالبيانات والمنطق البرمجي وليس الأمن الملموس.\nب. خطأ لأنه التطبيقات جزء برمجي وليس بيئة مادية.\nج. خطأ لأنه أنظمة التشغيل جزء منطقي من النظام وليس بيئة مادية.\nد. صحيح لأنه مراكز البيانات تمثل البيئة المادية التي يتم فيها تشغيل وحماية معدات تقنية المعلومات.","oldQNumber":"143","bankIndex":652,"setId":"set6"},{"id":"653","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"خلال زيارة لمصنع إنتاج نفط، فوجئ مدقق داخلي برؤية موظفي المحاسبة يتسوقون عبر الإنترنت باستخدام أجهزة الكمبيوتر الخاصة بالعمل. كان المدقق يعلم أن سياسة الشركة لا تسمح بالوصول إلى بعض صفحات الويب، بما في ذلك تلك المستخدمة للتسوق الإلكتروني. أي مما يلي ينبغي على المدقق دراسته لاحقًا لاستكشاف هذه الملاحظة بشكل أعمق؟","options":[{"key":"A","letter":"أ","text":"سياسة الشركة التدريبية على وسائل التواصل الاجتماعي"},{"key":"B","letter":"ب","text":"قواعد تكوين جدار الحماية للشركة"},{"key":"C","letter":"ج","text":"إعدادات تشفير نقطة الوصول الخاصة بالشركة"},{"key":"D","letter":"د","text":"ضوابط تثبيت برامج الشركة"}],"explanation":"أ. خطأ لأن تدريب وسائل التواصل الاجتماعي لا يرتبط مباشرة بمنع الوصول إلى مواقع الويب.\nب. صحيح لأن جدار الحماية هو الذي يتحكم عادة في حظر/السماح بمواقع الويب، وبالتالي يجب فحص إعداداته.\nج. خطأ لأن التشفير يتعلق بحماية البيانات وليس حجب المواقع.\nد. خطأ لأن تثبيت البرامج لا يحدد الوصول إلى مواقع الإنترنت.","oldQNumber":"144","bankIndex":653,"setId":"set6"},{"id":"654","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"اي من عناصر التحكم التالية سيكون الاكثر امانا في مصادقة وصول المستخدم الى جهاز ذكي؟","options":[{"key":"A","letter":"أ","text":"رمز مرور مميز"},{"key":"B","letter":"ب","text":"رسم النمط"},{"key":"C","letter":"ج","text":"مسح بصمات الاصابع"},{"key":"D","letter":"د","text":"سؤال الامان الشخصي"}],"explanation":"أ. خطأ لأنه يمكن معرفة أو مشاركة رمز المرور.\nب. خطأ لأنه يمكن ملاحظة أو تخمين نمط الرسم.\nج. صحيح لأنه يعتمد على خاصية حيوية فريدة للمستخدم ويعد أكثر أمانا.\nد. خطأ لأنه قد يمكن معرفة إجابة سؤال الأمان أو تخمينها.","oldQNumber":"146","bankIndex":654,"setId":"set6"},{"id":"655","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"وفقا لارشادات معهد المدققين الداخليين بشان تكنولوجيا المعلومات، عند التفكير في تخصيص موارد تدقيق تكنولوجيا المعلومات يمكن استخدام نموذج لبيئة تكنولوجيا المعلومات . اي من الطبقات التالية تشكل الاساس للتطبيقات التجارية الاساسية وتدعمها وتمكنها؟","options":[{"key":"A","letter":"أ","text":"برمجيات ذكاء الاعمال"},{"key":"B","letter":"ب","text":"برنامج حلول الموردين المخصص"},{"key":"C","letter":"ج","text":"التطبيقات المعاملاتية"},{"key":"D","letter":"د","text":"البنية التحتية التقنية"}],"explanation":"أ. خطأ لأن برمجيات ذكاء الأعمال تعمل على تحليل البيانات وليست الأساس للتطبيقات.\nب. خطأ لأنه حلول الموردين تطبيقات وليست طبقة أساسية.\nج. خطأ لأن التطبيقات المعاملاتية تعتمد على البنية التحتية وليست أساسها.\nد. صحيح لأنه البنية التحتية التقنية (خوادم، شبكات، أنظمة تشغيل) تشكل الأساس الذي تقوم عليه جميع التطبيقات التجارية.","oldQNumber":"147","bankIndex":655,"setId":"set6"},{"id":"656","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اي من انواع تحليل البيانات التالية هو الاكثر ملاءمة لبرنامج الكشف عن الاحتيال ليكون فعالا؟","options":[{"key":"A","letter":"أ","text":"تحليل البيانات باستخدام اساليب العينة العشوائية"},{"key":"B","letter":"ب","text":"تحليل البيانات باستخدام مجموعات البيانات الكاملة"},{"key":"C","letter":"ج","text":"تحليل البيانات باستخدام نمذجة وبنية البيانات"},{"key":"D","letter":"د","text":"تحليل البيانات باستخدام البيانات الرئيسية"}],"explanation":"أ. خطأ لأنه العينة العشوائية قد لا تكشف جميع حالات الاحتيال.\nب. صحيح لأنه فحص جميع البيانات يزيد من فرصة اكتشاف الأنماط والمعاملات غير الطبيعية.\nج. خطأ لأنه يساعد في تنظيم البيانات لكنه ليس الأفضل للكشف عن الاحتيال.\nد. خطأ لأنه البيانات الرئيسية وحدها لا تكفي للكشف عن حالات الاحتيال.","oldQNumber":"148","bankIndex":656,"setId":"set6"},{"id":"657","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"وفقا لارشادات معهد المدققين الداخليين حول تقنية المعلومات ، اي من الاستراتيجيات التالية من شانها ان توفر التحكم الأكثر فاعلية في الوصول عبر نظام نقاط البيع الالي؟","options":[{"key":"A","letter":"أ","text":"تثبيت برنامج مكافحة الفيروسات وتحديثه"},{"key":"B","letter":"ب","text":"⁠تنفيذ تقنيات تشفير البيانات"},{"key":"C","letter":"ج","text":"⁠تعيين توفر البيانات حسب حاجة المستخدم"},{"key":"D","letter":"د","text":"⁠تحديث تهيئة جدار الحماية"}],"explanation":"أ. خطأ لأنه مكافحة الفيروسات يحمي من الفيروسات ولا يتحكم بصلاحيات الوصول.\nب. خطأ لأنه التشفير يحمي البيانات ولا يحدد من يمكنه الوصول إليها.\nج. صحيح لأنه يطبق مبدأ أقل صلاحية ويعطي المستخدم ما يحتاجه فقط.\nد. خطأ لأنه جدار الحماية يتحكم بالشبكة وليس بصلاحيات المستخدم داخل النظام.","oldQNumber":"150","bankIndex":657,"setId":"set6"},{"id":"658","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"ما الذي يمكن أن يفعله المدقق الداخلي لضمان وجود عملية للتخفيف من المخاطر في عملية إدارة التغيير في المنظمة؟","options":[{"key":"A","letter":"أ","text":"تطوير وإنفاذ سياسات التغيير لضمان تدريب الموظفين باستمرار."},{"key":"B","letter":"ب","text":"تطبيق نهج قائم على المخاطر وفرض الفصل بين الواجبات المتعلقة بعملية إدارة التغيير."},{"key":"C","letter":"ج","text":"إجراء تحليل عالي المستوى للتهديدات وتنفيذ ضوابط تعويضية."},{"key":"D","letter":"د","text":"التحقق من صحة التفويض، والفصل بين الواجبات، واختبار التغييرات، والموافقة على نقل التغييرات إلى الإنتاج."}],"explanation":"أ. خطأ لأن التدريب جزء داعم لكنه لا يضمن التحكم بالمخاطر في إدارة التغيير.\nب. خطأ لأنه يحدد نهجًا عامًا لكنه لا يغطي الضوابط الأساسية للتغيير بشكل كامل.\nج. خطأ لأنه تحليل عام ولا يغطي الضوابط التشغيلية التفصيلية.\nد. صحيح لأنه يشمل أهم الضوابط الأساسية في إدارة التغيير مثل التفويض، الفصل بين الواجبات، الاختبار، والموافقة قبل الإنتاج.","oldQNumber":"151","bankIndex":658,"setId":"set6"},{"id":"659","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"اي مما يلي يجب على مدققي البرامج فعله عند الإبلاغ عن نتائج التدقيق الداخلي المتعلقة بتخطيط الموارد على مستوى المؤسسة؟","options":[{"key":"A","letter":"أ","text":"صياغة تقارير تدقيق منفصلة للأعمال وادارة تقنية المعلومات."},{"key":"B","letter":"ب","text":"ربط نتائج تدقيق تقنية المعلومات بمسائل الأعمال."},{"key":"C","letter":"ج","text":"تضمين تفاصيل الفنية لدعم مسائل تقنية المعلومات."},{"key":"D","letter":"د","text":"تضمين رأي حول دقة واكتمال التقارير المالية."}],"explanation":"أ. خطأ لأنه لا يُفضل فصل التقارير بين الأعمال وتقنية المعلومات بل يجب دمجها ضمن منظور مؤسسي واحد.\nب. صحيح لأنه يجب أن تكون نتائج تدقيق تقنية المعلومات مرتبطة بأهداف ومسائل الأعمال لدعم اتخاذ القرار.\nج. خطأ لأنه التفاصيل الفنية ليست الهدف الأساسي من التقرير الإداري.\nد. خطأ لأنه يتعلق بالتقارير المالية وليس بتخطيط الموارد أو تدقيق تقنية المعلومات.","oldQNumber":"152","bankIndex":659,"setId":"set6"},{"id":"660","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"اي مما يلي هو اقوى طريقة للمصادقة؟","options":[{"key":"A","letter":"أ","text":"طلب كلمة مرور وعبارة مرور"},{"key":"B","letter":"ب","text":"اسم المستخدم ورقم التعريف الشخصي"},{"key":"C","letter":"ج","text":"رمز وسؤال سري"},{"key":"D","letter":"د","text":"توقيع ونمط صوتي"}],"explanation":"أ. خطأ لأنه يعتمد على عامل واحد (المعرفة) رغم تعدد الصياغة.\nب. خطأ لأنه يجمع بين معرفات يمكن سرقتها أو تخمينها بسهولة.\nج. خطأ لأن الأسئلة السرية تعتبر ضعيفة وسهلة التوقع.\nد. صحيح لأنه يعتمد على عوامل بيومترية يصعب تقليدها (مثل الصوت والتوقيع).","oldQNumber":"153","bankIndex":660,"setId":"set6"},{"id":"661","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"تستخدم إحدى المؤسسات تقنية تحديد الترددات الراديوية (RFID) لتحديد المركبات المصرح لها بدخول منشأة مسورة. يمسح قارئ RFID رقم راف وليس خطر مباشر من التغيير.\nب. خطأ لأن زيادة الموظفين لا تمثل خطراً سلبياً على التغيير بل قد تحسن الرقابة.\nج. صحيح لأن فرض عمليات وسياسات جديدة بعد تحديث الشبكة قد يؤدي إلى مقاومة المستخدمين ويؤثر على نجاح التغيير.\nد. خطأ لأنه مشكلة تشغيلية عامة وليست مرتبطة مباشرة بتأثير التغيير نفسه.","oldQNumber":"156","bankIndex":662,"setId":"set6"},{"id":"663","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"أي مما يلي يصف بشكل أفضل مفهوم إنترنت الأشياء؟","options":[{"key":"A","letter":"أ","text":"الترابط بين الأجهزة المادية عبر الإنترنت."},{"key":"B","letter":"ب","text":"تقديم الخدمات المختلفة عبر الإنترنت."},{"key":"C","letter":"ج","text":"الممارسة التي بموجبها يستخدم الموظفون والشركاء أجهزتهم الشخصية لإجراء الأعمال."},{"key":"D","letter":"د","text":"تبادل مستندات الأعمال من جهاز كمبيوتر إلى جهاز آخر في شكل إلكتروني عبر الإنترنت بين مؤسسة وشركائها التجاريين."}],"explanation":"أ. صحيح لأنه إنترنت الأشياء (IoT) يعني ربط الأجهزة المادية مثل الحساسات والأجهزة الذكية بالإنترنت لتبادل البيانات.\n\nب. خطأ لأنه تقديم الخدمات عبر الإنترنت يصف الحوسبة السحابية وليس إنترنت الأشياء.\n\nج. خطأ لأنه استخدام الأجهزة الشخصية في العمل هو مفهوم BYOD وليس IoT.\n\nد. خطأ لأنه تبادل المستندات إلكترونياً بين المؤسسات يصف EDI (تبادل البيانات الإلكتروني) وليس إنترنت الأشياء.","oldQNumber":"157","bankIndex":663,"setId":"set6"},{"id":"664","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"اي من ضوابط الوصول المادي التالية غالبا ما يعمل كعنصر تحكم وقائي وكاشف؟","options":[{"key":"A","letter":"أ","text":"الابواب المغلقة"},{"key":"B","letter":"ب","text":"جدران الحماية"},{"key":"C","letter":"ج","text":"كاميرات المراقبة"},{"key":"D","letter":"د","text":"معرفات تسجيل الدخول وكلمات المرور"}],"explanation":"أ. خطأ لأنه الأبواب المغلقة تعتبر عنصر تحكم وقائي فقط لمنع الدخول.\nب. خطأ لأنه جدران الحماية ليست ضوابط مادية بل تقنية.\nج. صحيح لأنه كاميرات المراقبة تعمل على الردع (وقائي) وتسجيل الأحداث (كاشف).\nد. خطأ لأنه كلمات المرور تعتبر تحكم منطقي وليست مادي، وهي وقائية فقط.","oldQNumber":"158","bankIndex":664,"setId":"set6"},{"id":"665","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"D","question":"مع تزايد التهديدات الأمن السيبيراني، اي مما يلي يجب على الإدارة مراعاته لضمان وجود حوكمة أمنية قوية؟","options":[{"key":"A","letter":"أ","text":"جرد اصول المعلومات"},{"key":"B","letter":"ب","text":"مشاركة محدودة لملفات البيانات مع اطراف خارجية"},{"key":"C","letter":"ج","text":"تقييم الثغرات الامنية"},{"key":"D","letter":"د","text":"سياسات محددة بوضوح"}],"explanation":"أ. خطأ لأنه جرد الأصول مهم لكنه جزء تشغيلي وليس أساس الحوكمة.\nب. خطأ لأنه يتعلق بإجراء أمني وليس عنصر حوكمة أساسي.\nج. خطأ لأنه تقييم الثغرات إجراء تقني وليس إطار حوكمة.\nد. صحيح لأنه وجود سياسات واضحة هو الأساس الذي تبنى عليه الحوكمة الأمنية.","oldQNumber":"159","bankIndex":665,"setId":"set6"},{"id":"666","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"A","question":"تخضع مؤسسة للبيع بالتجزئة لقوانين الخصوصية التي تتطلب استخدام معلومات عملائها المحفوظة في قاعدة البيانات وفقا لاحتياجات العمل المعلنة للمؤسسة، اي من الممارسات التالية من المرجح ان تدعم هذا المطلب؟","options":[{"key":"A","letter":"أ","text":"مراقبة استخدام معلومات قاعدة البيانات بعد الوصول اليها"},{"key":"B","letter":"ب","text":"يتطلب مصادقة ثنائية العوامل للتحقق من هوية المستخدمين الذين يقومون بالوصول الى قاعدة البيانات."},{"key":"C","letter":"ج","text":"اعتماد نهج الفصل بين الواجبات في تخصيص حقوق الوصول الى قاعدة البيانات"},{"key":"D","letter":"د","text":"تشفير معلومات العملاء المخزنة في قاعدة البيانات."}],"explanation":"أ. صحيح لأنه يساعد على التأكد من أن استخدام البيانات يتم فقط للأغراض المعلنة ومراقبة أي استخدام غير مناسب بعد الدخول.\nب. خطأ لأنه المصادقة الثنائية تتحقق من الهوية لكنها لا تضمن كيفية استخدام البيانات بعد الوصول.\nج. خطأ لأنه الفصل بين الواجبات يركز على توزيع الصلاحيات وليس مراقبة الاستخدام الفعلي.\nد. خطأ لأنه التشفير يحمي البيانات لكنه لا يتحكم في استخدامها بعد فك التشفير أو الوصول إليها.","oldQNumber":"160","bankIndex":666,"setId":"set6"},{"id":"667","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"B","question":"قام قسم تكنولوجيا المعلومات في البنك بتكوين نظامه المصرفي الأساسي لتسجيل الأرقام فقط باعتبارها الحرف المقبول في الحقل لرقم التعريف الضريبي عند ضم العملاء. تم تكوين هذا الحقل أيضًا لقبول ما لا يقل عن تسعة أحرف ، وهو المعيار لجميع أرقام التعريف الضريبي. أي من عناصر التحكم التالية موضحة في هذا السيناريو؟","options":[{"key":"A","letter":"أ","text":"مراقبة المعالجة."},{"key":"B","letter":"ب","text":"التحكم في المدخلات."},{"key":"C","letter":"ج","text":"السيطرة على الإخراج."},{"key":"D","letter":"د","text":"مراقبة النزاهة"}],"explanation":"أ. خطأ لأنه يخص معالجة البيانات بعد إدخالها وليس أثناء إدخالها.\nب. صحيح لأنه يتم فرض قيود على نوع البيانات وطولها عند إدخال رقم التعريف الضريبي.\nج. خطأ لأنه يتعلق بعرض النتائج وليس التحقق من البيانات المدخلة.\nد. خطأ لأنه مصطلح عام ولا يصف نوع التحكم المحدد في السيناريو.","oldQNumber":"163","bankIndex":667,"setId":"set6"},{"id":"668","form":"form6","formTitle":"Group 6","lesson":"و- اختبار تجريبي","answer":"C","question":"يتمثل نشاط المراجعة الداخلية للحسابات في إحدى المنظمات في إجراء تدقيق للموارد البشرية. وكجزء من المراجعة تم إجراء دراسة استقصائية للموظفين. أشار الاستطلاع إلى أن الموظفين كانوا قلقين بشأن أمن تكنولوجيا المعلومات عند العمل خارج المكتب. اقترح قسم تكنولوجيا المعلومات تنفيذ شبكة تسمح للموظفين بإرسال واستقبال البيانات كما لو كانوا متصلين بشبكة خاصة. أي من الشبكات التالية يوصي بها قسم تكنولوجيا المعلومات؟","options":[{"key":"A","letter":"أ","text":"شبكة المنطقة العالمية (GAN)"},{"key":"B","letter":"ب","text":"شبكة المنطقة الواسعة (WAN)"},{"key":"C","letter":"ج","text":"الشبكة الافتراضية الخاصة (VPN)"},{"key":"D","letter":"د","text":"شبكة المنطقة المحلية (LAN)"}],"explanation":"أ. خطأ لأن GAN ليست الحل المستخدم لهذا النوع من الوصول الآمن.\nب. خطأ لأن WAN هي شبكة واسعة وليست وسيلة لتأمين الاتصال.\nج. صحيح لأن VPN تتيح للموظفين الاتصال بشكل آمن وكأنهم داخل الشبكة الداخلية للمؤسسة.\nد. خطأ لأن LAN تعمل داخل الموقع فقط ولا تدعم العمل خارج المكتب.","oldQNumber":"164","bankIndex":668,"setId":"set6"}];

function detectGithubPagesRepo(){
  try{
    const host=location.hostname.toLowerCase();
    if(!host.endsWith(".github.io"))return {owner:"",repo:""};
    const owner=host.split(".")[0];
    const parts=location.pathname.split("/").filter(Boolean);
    let repo=parts[0]||"";
    if(!repo||/\.html?$/i.test(repo))repo=owner+".github.io";
    return {owner,repo};
  }catch(e){return {owner:"",repo:""};}
}
function ghSyncMeta(profileId=activeProfile){
  const blank={dirty:false,localUpdatedAt:0,lastSyncedCloudUpdatedAt:0,lastSyncedAt:0};

}
function latestExamResult(setId){
  const arr=Array.isArray(state.examResults[setId])?state.examResults[setId]:[];
  return arr.length?arr[arr.length-1]:null;
}
function examResultHistory(setId){
  const arr=Array.isArray(state.examResults[setId])?state.examResults[setId]:[];
  return arr.slice(-3);
}
function nextExamAttemptNumber(setId){
  const arr=Array.isArray(state.examResults[setId])?state.examResults[setId]:[];
  const maxAttempt=arr.reduce((m,r)=>Math.max(m,Number(r?.attempt)||0),0);
  return maxAttempt+1;
}
function examTrendData(setId){
  const arr=examResultHistory(setId);
  if(!arr.length)return {results:[],delta:null,best:null,latest:null};
  const scores=arr.map(r=>Number(r.score)||0);
  return {
    results:arr,
    delta:arr.length>=2?scores[scores.length-1]-scores[0]:null,
    best:Math.max(...scores),
    latest:scores[scores.length-1]
  };
}
function formatExamDate(ts){
  if(!ts)return "—";
  try{return new Date(Number(ts)).toLocaleDateString("ar-SA",{year:"numeric",month:"2-digit",day:"2-digit"});}
  catch(e){return "—";}
}
function formatDurationShort(sec){
  sec=Math.max(0,Number(sec)||0);
  const m=Math.floor(sec/60),s=Math.floor(sec%60);
  return m?`${m}د ${s}ث`:`${s}ث`;
}
function renderExamTrendInline(setId){
  const t=examTrendData(setId);
  if(!t.results.length)return '<div class="examTrend"><span class="examTrendChip">لا توجد نتائج محفوظة بعد</span></div>';
  const chips=t.results.map(r=>`<span class="examTrendChip">محاولة ${Number(r.attempt)||"—"}: <b>${Number(r.score)||0}%</b></span>`).join("");
  const delta=t.delta===null?"":`<span class="examTrendDelta ${t.delta<0?"down":""}">${t.delta>0?"↑":t.delta<0?"↓":"→"} ${t.delta>0?"+":""}${t.delta} نقطة</span>`;
  return `<div class="examTrend">${chips}${delta}</div>`;
}

  const trend=t.delta===null?"تحتاج إلى نتيجتين على الأقل لعرض الاتجاه.":`التغير من أقدم نتيجة محفوظة إلى أحدث نتيجة: <b>${t.delta>0?"+":""}${t.delta} نقطة</b>. أفضل نتيجة محفوظة: <b>${t.best}%</b>.`;
  return `<div class="examHistoryBox">

function examStatusForSet(setId){
  const sess=state.examSessions[setId];
  if(sess&&sess.status==="in_progress"){
    const total=(sess.order||[]).length||setDef(setId).total;
    const done=Object.keys(sess.answers||{}).length;
    return {kind:"progress",done,total,pct:pct(done,total),text:`${done}/${total} — قابل للاستئناف`};
  }
  const latest=latestExamResult(setId);
  if(latest)return {kind:"done",done:latest.total,total:latest.total,pct:100,text:`آخر نتيجة ${latest.score}%`};
  return {kind:"new",done:0,total:setDef(setId).total,pct:0,text:"لم يبدأ"};
}

function updateHistoryStudy(q,selected,correct,ts){
  const k=key(q),h=state.history[k]||{
    attempts:0,correct:0,wrong:0,studyAttempts:0,studyCorrect:0,studyWrong:0,
    examAttempts:0,examCorrect:0,examWrong:0,examUnanswered:0,
    everWrong:false,lastSelected:"",lastCorrect:false,lastContext:"",lastTs:0
  };
  h.attempts++;h.studyAttempts++;
  if(correct){h.correct++;h.studyCorrect++;}else{h.wrong++;h.studyWrong++;h.everWrong=true;}
  h.lastSelected=selected;h.lastCorrect=correct;h.lastContext="study";h.lastTs=ts;
  state.history[k]=h;
}
function pick(selected){
  if(exam.active){examPick(selected);return;}
  const q=current();if(!q)return;
  const elapsed=Math.max(0,Math.min(60,60-Number(view.timerLeft||0))),ts=Date.now(),correct=selected===q.answer;

  updateHistoryStudy(q,selected,correct,ts);
  if(view.mistakePractice)view.practiceAnswers[key(q)]=record;
  view.forceShow=true;rememberCurrent(q);save();markGhDirty();render();
}

function examResultsData(session){
  const lessons={};let correct=0,wrong=0,unanswered=0;
  sessionQuestions(session).forEach(q=>{
    const lesson=q.lesson||"بدون درس",ans=session.answers[key(q)],ok=!!ans&&ans.selected===q.answer;
    if(ok)correct++;else if(ans)wrong++;else unanswered++;
    if(!lessons[lesson])lessons[lesson]={total:0,correct:0,wrong:0,unanswered:0};
    lessons[lesson].total++;if(ok)lessons[lesson].correct++;else if(ans)lessons[lesson].wrong++;else lessons[lesson].unanswered++;
  });

}
function examMistakeRows(session=exam.session){

function applyExamHistory(session){

      attempts:0,correct:0,wrong:0,studyAttempts:0,studyCorrect:0,studyWrong:0,
      examAttempts:0,examCorrect:0,examWrong:0,examUnanswered:0,
      everWrong:false,lastSelected:"",lastCorrect:false,lastContext:"",lastTs:0

      h.lastSelected=ans.selected;h.lastCorrect=correct;h.lastTs=Number(ans.ts)||Date.now();
    }else{h.examUnanswered++;h.lastSelected="";h.lastCorrect=false;h.lastTs=Date.now();addActiveMistake(q);}
    h.lastContext="exam";state.history[k]=h;

  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data||!COMPATIBLE_BANK_IDS.has(data.bankId)||Number(data.questionCount)>QUESTIONS.length)throw new Error("النسخة الاحتياطية لا تخص بنك الأسئلة الحالي.");
    if(!data.state||typeof data.state!=="object")throw new Error("ملف النسخة الاحتياطية غير صالح.");
    state=prepareLoadedState(data.state);
    Object.entries(state.answers).forEach(([k,r])=>{if(QUESTION_BY_KEY.has(k)&&r&&!state.history[k])state.history[k]={attempts:1,correct:r.correct===true?1:0,wrong:r.correct===false?1:0,studyAttempts:1,studyCorrect:r.correct===true?1:0,studyWrong:r.correct===false?1:0,examAttempts:0,examCorrect:0,examWrong:0,examUnanswered:0,everWrong:r.correct===false,lastSelected:r.selected||"",lastCorrect:r.correct===true,lastContext:"study",lastTs:Number(r.ts)||0};});
    view.studySet=state.ui.studySet;view.examSet=state.ui.examSet;view.form="all";view.lesson="all";view.mode="all";view.search="";view.special="";view.forceShow=false;view.studyOptionOrder={};
    save();markGhDirty(100);buildDynamicControls();restoreIndexForSet(view.studySet);render();alert("تمت استعادة التقدم بنجاح.");
  }catch(err){alert("تعذر استعادة التقدم: "+(err?.message||err));}
}


function updateProfileButtons(){

}
function switchProfile(profileId){
  if(!PROFILES[profileId]||profileId===activeProfile)return;
  save();

  activeProfile=profileId;
  const loaded=readProfileState(activeProfile);
  storedStateRaw=loaded.raw;
  state=loaded.state;

  view.studySet=state.ui.studySet;
  view.studySubgroup=state.ui.studySubgroup||"all";
  view.examSet=state.ui.examSet;
  view.form="all";
  view.lesson="all";
  view.mode="all";
  view.search="";
  view.index=0;

  view.retry=false;

  view.retryAnswers={};
  view.examMistakeOrder=[];

}

const THEME_KEY=BASE_STORE_KEY+"_theme";
const READER_STRONG_KEY=BASE_STORE_KEY+"_reader_strong";
const FOCUS_QUESTIONS_KEY=BASE_STORE_KEY+"_focus_questions";
function currentTheme(){return document.documentElement.dataset.theme==="light"?"light":"dark";}
function updateThemeToggle(){
  const btn=$("themeToggle");if(!btn)return;
  const light=currentTheme()==="light";
  btn.textContent=light?"🌙":"☀️";
  btn.setAttribute("aria-label",light?"تشغيل الوضع الداكن":"تشغيل الوضع الفاتح");
  btn.title=light?"تشغيل الوضع الداكن":"تشغيل الوضع الفاتح";
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",light?"#f4f7fb":"#101828");
}
function applyTheme(theme,persist=true){
  const next=theme==="light"?"light":"dark";
  document.documentElement.dataset.theme=next;
  if(persist){try{localStorage.setItem(THEME_KEY,next);}catch(e){}}
  updateThemeToggle();
}
function toggleTheme(){applyTheme(currentTheme()==="dark"?"light":"dark");}

function applyLayout(){
  // Layout is now controlled only by the responsive CSS media queries.
  // Never inherit or persist a manual phone/desktop override in localStorage.
  document.body.classList.remove("phoneView");
}

function render(){
  renderJourney();stats();
  if(exam.active){
    if(exam.session?.status==="finished"){renderExamNav();renderExamResults();ensureExamTimer();return;}
    renderExamNav();renderExamCard();ensureExamTimer();return;
  }
  clearInterval(exam.timerId);exam.timerId=null;
  clampIndex();renderNav();renderCard();ensureTimer();
}

/* Keyboard shortcuts: displayed-position mapping is preserved after option shuffling. */
document.addEventListener("keydown",e=>{
  const active=document.activeElement;if(active&&["INPUT","SELECT","TEXTAREA"].includes(active.tagName))return;
  if(e.key==="ArrowRight"){e.preventDefault();prev();return;}
  if(e.key==="ArrowLeft"){e.preventDefault();next();return;}
  if(e.key===" "){e.preventDefault();showAnswer();return;}
  const pressed=String(e.key||"").toLowerCase();
  const indexMap={"1":0,"a":0,"أ":0,"ا":0,"2":1,"b":1,"ب":1,"3":2,"c":2,"ج":2,"4":3,"d":3,"د":3};
  const optionIndex=indexMap[pressed]??indexMap[e.key];if(optionIndex===undefined)return;e.preventDefault();
  if(exam.active){
    const visible=[...document.querySelectorAll("#quizCard [data-exam-pick]")],btn=visible[optionIndex];
    if(btn&&!btn.classList.contains("eliminated"))examPick(btn.dataset.examPick);return;
  }
  const visible=[...document.querySelectorAll("#quizCard [data-pick]")],btn=visible[optionIndex];
  if(btn&&!btn.classList.contains("eliminated"))pick(btn.dataset.pick);
});

document.addEventListener("keydown",e=>{

/* Phone-only panel defaults. Desktop remains visually unchanged. */
function applyResponsiveSectionDefaults(){
  const phone=window.matchMedia('(max-width: 860px)').matches;
  document.querySelectorAll('.mobileSection').forEach(d=>{
    if(phone){
      d.open=d.classList.contains('questionListSection');
    }else{
      d.open=true;
    }
  });
}
applyResponsiveSectionDefaults();
let responsiveWasPhone=window.matchMedia('(max-width: 860px)').matches;
window.addEventListener('resize',()=>{
  const nowPhone=window.matchMedia('(max-width: 860px)').matches;
  if(nowPhone!==responsiveWasPhone){responsiveWasPhone=nowPhone;applyResponsiveSectionDefaults();}
});

<script>
(function(){
  const endpoint="https://tbs-counter.omaryot13.workers.dev/";
  const output=document.getElementById("visitorCountText");
  if(!output)return;
  fetch(endpoint+"?t="+Date.now(),{method:"GET",cache:"no-store"})
    .then(function(response){
      if(!response.ok)throw new Error("HTTP "+response.status);
      return response.json();
    })
    .then(function(data){
      const count=Number(data&&data.count);
      if(!Number.isFinite(count))throw new Error("Invalid counter response");
      output.textContent=count.toLocaleString("en-US")+" زيارة";
    })
    .catch(function(){
      output.textContent="تعذر تحميل عدد الزيارات";
    });
})();
</script>
