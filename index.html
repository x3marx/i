<!--
APP CHANGELOG / MAINTENANCE NOTES
================================
Version: 2026-08-31-subgroups-v1

Additional UI update:
- Lesson cards in "رحلة المذاكرة والاختبار" show compact direct subgroup buttons (م1، م2...) only; subgroup progress remains available in the button tooltip and study progress logic.
- Clicking a subgroup button opens that subgroup directly; "فتح المراجعة" still opens the complete lesson.

Purpose:
- Reduce study-session size without changing the lesson bank or final lesson exams.
- Keep large lessons divided into stable study subgroups of no more than 40 questions.
- Preserve all existing progress, active mistakes, stars, exam history, GitHub sync, and Cloudflare counter.

Study subgroup design:
- تحليل البيانات (39): no subgroup split.
- تكنولوجيا المعلومات (162): م1=33, م2=33, م3=32, م4=32, م5=32.
- المالية (129): م1=33, م2=32, م3=32, م4=32.
- الهياكل والتحفيز (80): م1=40, م2=40.
- المشاريع والتخطيط (122): م1=31, م2=31, م3=30, م4=30.
- الاختبار التجريبي (136): no subgroup split.

Rules:
1) Subgroups affect study/review only.
2) Final exam for each lesson still uses the complete lesson set.
3) Subgroup assignment is deterministic based on the existing question order inside each lesson.
4) Existing question keys are unchanged, so saved answers/history remain compatible.
5) GitHub automatic sync interval remains 5 minutes; manual sync remains immediate.
6) Active mistake behavior remains:
   - wrong answer -> added to active mistakes
   - later correct answer -> removed from active mistakes
   - manual removal is available in active mistake mode
7) "إعادة مذاكرة الدرس" clears study answers for the whole selected lesson, not only the current subgroup.
8) Do not rename set IDs, question IDs, form IDs, BANK_ID, or cloud progress paths unless a migration is intentionally implemented.

Maintenance warning:
- If subgroup sizes are changed later, do not alter question keys.
- Re-test resume, progress counts, active-mistake filtering, timer, show/hide answer, and GitHub sync after any UI change.
-->

/* Unified responsive layout: one HTML for desktop and iPhone */
.mobileSection{display:contents}
.mobileSection>summary{display:none}

@media(max-width:860px){
  /* Put the active question before the dashboard/filters on phones. */
  .grid{display:flex!important;flex-direction:column;gap:10px}
  .questionColumn{order:1;width:100%}
  .panel{order:2;width:100%;padding:10px;position:static!important}

  /* Keep the title compact so the question is visible immediately. */
  .hero{margin-bottom:8px}
  .compactHero{padding:8px 10px}
  h1{font-size:1.18rem;margin:0}

  /* Secondary controls become expandable sections on phones only. */
  .mobileSection{display:block;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);margin:8px 0;overflow:hidden}
  .mobileSection>summary{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:9px 12px;color:#dbeafe;font-weight:800;cursor:pointer;list-style:none;-webkit-tap-highlight-color:transparent}
  .mobileSection>summary::-webkit-details-marker{display:none}
  .mobileSection>summary::after{content:"＋";font-size:1.05rem;color:var(--brand2);font-weight:900}
  .mobileSection[open]>summary::after{content:"−"}
  .mobileSection>.sectionTitle{display:none}
  .mobileSection[open]>:not(summary){margin-left:10px;margin-right:10px}
  .mobileSection[open]>.journeyList{margin-top:0}

  /* Start with only the useful navigation list expanded; other long sections stay compact. */
  .navList{max-width:100%;scrollbar-width:thin}
  .questionListSection .navList{margin-bottom:10px}

  /* Question card itself becomes denser and touch friendly. */
  .card{padding:13px!important;border-radius:18px;min-height:auto!important}
  .meta{margin-bottom:8px}
  .question{font-size:1.08rem!important;line-height:1.75;margin:10px 0 14px}
  .options{gap:8px}
  .option{min-height:54px;padding:11px 12px;font-size:.94rem;border-radius:15px}
  .option .letter{flex-basis:32px;height:32px}
  .timerBox{margin:5px 0 10px;padding:8px 10px}
  .cardActions{margin-top:12px}

  /* Fixed bottom controls stay reachable without covering the final option. */
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom))!important}
  .bottomBar{display:flex!important}
  .bottomBar .btn{min-width:0;font-size:.82rem;padding:8px 5px}

  /* Theme control respects iPhone safe areas. */
  .themeToggle{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left))}
}

@media(max-width:430px){
  body{padding-left:7px!important;padding-right:7px!important}
  .app{width:100%;max-width:none}
  .card{padding:11px!important}
  .question{font-size:1.02rem!important}
  .option{font-size:.91rem;line-height:1.55}
  .badge,.metricBadge{font-size:.75rem;padding:5px 8px}
  .bottomBar{gap:5px;padding-top:7px}
  .bottomBar .btn{font-size:.76rem}
}

}

/* Question column keeps the footer directly under the active question */

/* GitHub progress sync */
.syncPanel{margin-top:10px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);overflow:hidden}
.syncPanel>summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:800;color:#dbeafe;display:flex;align-items:center;justify-content:space-between;gap:8px}
.syncPanel>summary::-webkit-details-marker{display:none}
.syncPanel>summary::after{content:"⌄";color:var(--muted);font-size:.9rem}
.syncPanel[open]>summary::after{content:"⌃"}
.syncBody{padding:0 10px 10px;display:grid;gap:9px}
.syncStatus{border:1px solid var(--line);border-radius:13px;padding:9px 10px;font-size:.82rem;line-height:1.6;color:var(--muted);background:rgba(0,0,0,.10)}
.syncStatus.good{border-color:rgba(52,211,153,.45);color:#bbf7d0;background:rgba(52,211,153,.08)}
.syncStatus.warn{border-color:rgba(251,191,36,.50);color:#fde68a;background:rgba(251,191,36,.08)}
.syncStatus.bad{border-color:rgba(251,113,133,.50);color:#fecdd3;background:rgba(251,113,133,.08)}
.syncGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.syncField{display:grid;gap:5px}
.syncField.full{grid-column:1/-1}
.syncField label{font-size:.76rem}
.syncField input{min-height:40px;padding:7px 9px;border-radius:11px;font-size:.82rem}
.syncActions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.syncActions .btn{min-height:40px;padding:8px 9px;font-size:.8rem}
.syncConflict{display:none;grid-template-columns:1fr 1fr;gap:7px}
.syncConflict.show{display:grid}
.syncHint{font-size:.74rem;line-height:1.6;color:var(--muted)}
.syncProfileFile{font-weight:800;color:var(--brand);direction:ltr;unicode-bidi:plaintext}
.syncTokenSaved{font-size:.72rem;color:var(--good);font-weight:700}
html[data-theme="light"] .syncPanel{background:rgba(15,23,42,.02);border-color:#d8e0ea}
html[data-theme="light"] .syncPanel>summary{color:#1e293b}
html[data-theme="light"] .syncStatus{color:#475569;background:#f8fafc;border-color:#d8e0ea}
html[data-theme="light"] .syncStatus.good{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
html[data-theme="light"] .syncStatus.warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
html[data-theme="light"] .syncStatus.bad{color:#9f1239;background:#fff1f2;border-color:#fecdd3}
html[data-theme="light"] .syncHint{color:#64748b}
html[data-theme="light"] .syncProfileFile{color:#047857}
@media(max-width:560px){.syncGrid,.syncActions,.syncConflict{grid-template-columns:1fr}.syncField.full{grid-column:auto}}

html[data-theme="light"] .mobileSection{background:rgba(15,23,42,.025)}
html[data-theme="light"] .mobileSection>summary{color:#1e3a5f}

const EMBEDDED_QUESTIONS = [{"id":"1","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"B","question":"ما الذي يصف بشكل أفضل فائدة محتملة لاستخدام تحليلات البيانات؟","options":[{"key":"A","letter":"أ","text":"يساء استخدام التحليل قبل التطبيع"},{"key":"B","letter":"ب","text":"يساعد المدقق على ربط المعلومات لغايات تدقيق.."},{"key":"C","letter":"ج","text":"يمكن تفسير نتائجها بسهولة إلى استنتاجات تدقيق ."},{"key":"D","letter":"د","text":"يزيد تطبيقها من التزام المدققين الداخليين بالمعايير"}],"explanation":"أ. خطأ لأنه يصف مشكلة أو استخدام غير صحيح وليس فائدة.\n\nب. صحيح لأنه تمكّن تحليلات البيانات المدقق من ربط معلومات متعددة لدعم أعمال التدقيق.\n\nج. خطأ لأن سهولة التفسير ليست الفائدة الأساسية الأكثر دقة مقارنة بربط البيانات.\n\nد. خطأ لأن الالتزام بالمعايير لا يرتبط مباشرة باستخدام تحليلات البيانات.","oldQNumber":"1","bankIndex":1,"setId":"set1"},{"id":"5","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"B","question":"كيف يتم كشف تحايل مدير ما ليس من صلاحيته الموافقة على صرف 10000 دولار حيث يقوم بتجزئتها الى دفعات صغيرة ما التحليل المناسب لاكتشاف مثل هذه الحالة ؟","options":[{"key":"A","letter":"أ","text":"تحليل نسبة"},{"key":"B","letter":"ب","text":"رسم بياني."},{"key":"C","letter":"ج","text":"تحليل نص."},{"key":"D","letter":"د","text":"تحليل تنبؤي"}],"explanation":"أ. خطأ لأنه تحليل النسبة لا يكشف بشكل مباشر عن تجزئة المدفوعات.\n\nب. صحيح لأنه يمكن استخدام الرسم البياني لإظهار نمط المدفوعات الصغيرة المتكررة واكتشاف تجزئة المبالغ.\n\nج. خطأ لأن تحليل النص لا يرتبط ببيانات مالية رقمية مثل المدفوعات.\n\nد. خطأ لأن التحليل التنبؤي يستخدم للتوقع وليس لاكتشاف الاحتيال الحالي.","oldQNumber":"5","bankIndex":2,"setId":"set1"},{"id":"10","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"C","question":"ما هو مثال على المراجعين الداخليين الذين يطبقون تقنيات استخراج البيانات لأغراض استكشافية؟","options":[{"key":"A","letter":"أ","text":"يقوم المراجعون الداخليون بإجراء إجراءات المراجعة للتوفيق لدعم مراجعة خارجية للتقارير المالية."},{"key":"B","letter":"ب","text":"يقوم المراجعون الداخليون بإجراء تحليل موجه نحو النظام لمراجعة عناصر التحكم ذات الصلة."},{"key":"C","letter":"ج","text":"يقوم المراجعون الداخليون بتقييم المخاطر لتحديد مواضيع مراجعة محتملة كمدخلات لخطة المراجعة الداخلية السنوية."},{"key":"D","letter":"د","text":"يختبر المراجعون الداخليون عناصر التحكم العامة لتكنولوجيا المعلومات فيما يتعلق بالفعالية التشغيلية مقابل التصميم."}],"explanation":"أ. خطأ لأنه يركز على التحقق والتوفيق وليس على الاستكشاف واكتشاف الأنماط.\n\nب. خطأ لأنه يركز على مراجعة عناصر التحكم الموجودة وليس البحث عن مواضيع أو مخاطر جديدة.\n\nج. صحيح لأنه يستخدم تحليل البيانات لاستكشاف المخاطر وتحديد مجالات مراجعة محتملة.\n\nد. خطأ لأنه يختبر فعالية عناصر التحكم وليس لأغراض استكشافية.","oldQNumber":"10","bankIndex":3,"setId":"set1"},{"id":"15","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"C","question":"يتم تكليف مراجع داخلي بإجراء تحليلات للبيانات. ما هي الخطوة التالية التي يجب أن يتخذها المراجع بعد التأكد من القيمة المتوقعة من المراجعة؟","options":[{"key":"A","letter":"أ","text":"تطبيع البيانات."},{"key":"B","letter":"ب","text":"الحصول على البيانات."},{"key":"C","letter":"ج","text":"تحديد المخاطر"},{"key":"D","letter":"د","text":"تحليل البيانات."}],"explanation":"أ. خطأ لأنه تطبيع البيانات يأتي بعد الحصول على البيانات وتجهيزها.\n\nب. خطأ لأنه الحصول على البيانات يسبق تقييم المخاطر في هذه الحالة.\n\nج. صحيح لأنه بعد تحديد قيمة المراجعة يجب تحديد المخاطر لتوجيه التحليل بشكل صحيح.\n\nد. خطأ لأن تحليل البيانات يأتي بعد تحديد المخاطر وتجهيزها.","oldQNumber":"15","bankIndex":4,"setId":"set1"},{"id":"20","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"D","question":"قامت الإدارة بإنشاء قياس للأداء يركز على دقة عمليات الصرف، يتم توفير إحصاءات الصرف بشكل يومي لجميع موظفي الحسابات الدائنة وموظفي التدقيق ، وتشمل تفاصيل المدفوعات المصنفة حسب المبلغ والتكرار. أي مما يلي من المحتمل أن يكون أكبر مصدر قلق فيما يتعلق بهذا القياس للأداء؟","options":[{"key":"A","letter":"أ","text":"صياغة البيانات."},{"key":"B","letter":"ب","text":"توافر البيانات."},{"key":"C","letter":"ج","text":"قابلية قياس البيانات."},{"key":"D","letter":"د","text":"صلة واهمية البيانات."}],"explanation":"أ. خطأ لأن المشكلة ليست في طريقة عرض أو صياغة البيانات.\n\nب. خطأ لأن البيانات متاحة بالفعل ويتم توزيعها يومياً.\n\nج. خطأ لأن بيانات الصرف يمكن قياسها وتصنيفها بسهولة.\n\nد. صحيح لأنه يجب التأكد من أن البيانات المقدمة مرتبطة بهدف قياس دقة عمليات الصرف وتدعم اتخاذ القرار.","oldQNumber":"20","bankIndex":5,"setId":"set1"},{"id":"25","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"C","question":"اي العبارات صحيحة فيما يتعلق بتحليل البيانات؟","options":[{"key":"A","letter":"أ","text":"التحليل الوصفي اقل استخداما بسبب الاستثمار العالمي"},{"key":"B","letter":"ب","text":"التخليل التشخيصي خاص بالمبيعات والمشتريات"},{"key":"C","letter":"ج","text":"التحليل التنبؤي يستخرج كمية من البيانات الحالية ويعمل على التنبؤ بنتائج مستقبلية"},{"key":"D","letter":"د","text":"التحليل الوصفي يكيف اجزاء كبيرة من البيانات الى معلومات اصغر واكثر تلخيصا"}],"explanation":"أ. خطأ لأنه التحليل الوصفي من أكثر أنواع التحليل استخدامًا وليس أقلها، ولا يرتبط بالاستثمار العالمي.\n\nب. خطأ لأن التحليل التشخيصي لا يقتصر على المبيعات والمشتريات بل يركز على فهم أسباب الأحداث.\n\nج. صحيح لأنه يستخدم البيانات الحالية والتاريخية للتنبؤ بالنتائج المستقبلية.\n\nد. خطأ لأن هذا الوصف أقرب للتحليل الوصفي وليس تعريفًا دقيقًا له كما ورد في العبارة.","oldQNumber":"25","bankIndex":6,"setId":"set1"},{"id":"30","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"A","question":"أي من أنواع تحليلات البيانات التالية تستخدمها المستشفى لتحديد المرضى الذين يحتمل أن يحتاجوا إلى تحويل للعلاج الإضافي؟","options":[{"key":"A","letter":"أ","text":"تحليلات تنبؤية. Predictive analytics"},{"key":"B","letter":"ب","text":"تحليلات وصفية. Prescriptive analytics"},{"key":"C","letter":"ج","text":"تحليلات تشخيصية. Descriptive analytics"},{"key":"D","letter":"د","text":"تحليلات توجيهية. Diagnostic analytics"}],"explanation":"أ. صحيح لأنها تستخدم للتنبؤ بالأحداث أو النتائج المستقبلية بناءً على البيانات المتاحة.\n\nب. خطأ لأن التحليلات الوصفية تركز على ما يجب القيام به وليس التنبؤ بمن سيحتاج إلى علاج إضافي.\n\nج. خطأ لأنها تركز على وصف ما حدث في الماضي.\n\nد. خطأ لأنها تركز على تحليل أسباب حدوث الأمور وليس التنبؤ بها.","oldQNumber":"30","bankIndex":7,"setId":"set1"},{"id":"35","form":"form1","formTitle":"Group 1","lesson":"أ- تحليل البيانات","answer":"C","question":"أثناء مراجعة عملية الحسابات الدائنة ، قام المراجع الداخلي بجمع جميع معاملات دفع البائعين خلال الـ 24 شهرًا الماضية. ثم استخدم المراجع أداة تحليل لتحديد أكبر خمسة بائعين حصلوا على أعلى مبلغ من المدفوعات. أي من تقنيات التحليلات التالية طبقها المراجع؟","options":[{"key":"A","letter":"أ","text":"تحليل العملية"},{"key":"B","letter":"ب","text":"تنقيب العملية"},{"key":"C","letter":"ج","text":"تحليل البيانات"},{"key":"D","letter":"د","text":"تنقيب البيانات"}],"explanation":"أ. خطأ لأنه يركز على دراسة سير العملية وليس ترتيب أو تحليل المدفوعات.\n\nب. خطأ لأنه يختص بتحليل تدفق العمليات واكتشاف الانحرافات في المسار.\n\nج. صحيح لأنه يعتمد على تحليل البيانات التاريخية لاستخراج معلومات مثل أعلى المدفوعات.\n\nد. خطأ لأنه يستخدم لاكتشاف أنماط خفية وعلاقات معقدة داخل البيانات وليس مجرد ترتيب القيم.","oldQNumber":"35","bankIndex":8,"setId":"set1"},{"id":"40","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"تعتمد منظمة وشريكها التجاري على تبادل رقمي لوثائق الأعمال الرقمية من جهاز كمبيوتر إلى آخر. ما الذي يصف هذا السيناريو بشكل أفضل؟","options":[{"key":"A","letter":"أ","text":"استخدام وحدة المعالجة المركزية."},{"key":"B","letter":"ب","text":"استخدام نظام إدارة قاعدة البيانات."},{"key":"C","letter":"ج","text":"استخدام شبكة المنطقة المحلية."},{"key":"D","letter":"د","text":"استخدام التبادل الإلكتروني للبيانات."}],"explanation":"أ خطا لأنه يتعلق بمعالجة البيانات داخل الجهاز وليس تبادلها بين جهات.\nب خطا لأنه يختص بإدارة البيانات داخل قواعد البيانات وليس تبادلها بين شركاء.\nج خطا لأنه شبكة داخلية محلية ولا يصف تبادل الوثائق التجارية بين المنظمات.\nد صحيح لأنه يمثل تبادل الوثائق التجارية إلكترونيًا بين الأنظمة (EDI).","oldQNumber":"1","bankIndex":9,"setId":"set2"},{"id":"42","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"عند مراجعة مخاطر البنية التحتية لتكنولوجيا المعلومات للمؤسسة، ما هو التحكم الذي يجب اختباره كجزء من مراجعة محطات العمل؟","options":[{"key":"A","letter":"أ","text":"ضوابط الإدخال"},{"key":"B","letter":"ب","text":"فصل الواجبات"},{"key":"C","letter":"ج","text":"الإجراءات الملموسة الفيزيائية"},{"key":"D","letter":"د","text":"ضوابط النزاهة"}],"explanation":"أ. خطأ لأنه يتعلق بالتحقق من صحة إدخال البيانات وليس بمراجعة محطات العمل من ناحية البنية التحتية.\n\nب. خطأ لأنه يتعلق بتنظيم الصلاحيات بين الموظفين وليس بمراجعة محطات العمل مباشرة.\n\nج. صحيح لأنه يشمل الضوابط الفيزيائية مثل حماية الأجهزة ومحطات العمل من الوصول غير المصرح به.\n\nد. خطأ لأنه يتعلق بضمان دقة وسلامة البيانات وليس الضوابط الخاصة بمحطات العمل.","oldQNumber":"3","bankIndex":10,"setId":"set2"},{"id":"47","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"خططت منظمة متعددة الجنسيات تعمل في مجال الأعمال التجارية عبر الإنترنت لإنشاء خدمات مكتب المساعدة، أي مما يلي يصف بشكل أفضل الدور الذي يؤديه مكتب المساعدة ؟","options":[{"key":"A","letter":"أ","text":"مراقبة الوصول إلى قاعدة البيانات على الإنترنت"},{"key":"B","letter":"ب","text":"النسخ الاحتياطي والحفاظ على البيانات المؤرشفة"},{"key":"C","letter":"ج","text":"الرد على استفسارات العملاء"},{"key":"D","letter":"د","text":"صيانة وضمان أمن الشبكة"}],"explanation":"أ خطا لأنه مراقبة قواعد البيانات وظيفة تقنية متخصصة وليست مكتب المساعدة.\nب خطا لأنه النسخ الاحتياطي وإدارة الأرشفة من مهام إدارة الأنظمة.\nج صحيح لأنه مكتب المساعدة يختص بالرد على استفسارات المستخدمين وتقديم الدعم.\nد خطا لأنه صيانة وأمن الشبكة مسؤولية فريق البنية التحتية والأمن.","oldQNumber":"8","bankIndex":11,"setId":"set2"},{"id":"52","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"ما الذي يعتبر إجراء تحكم أمني فعلي ملموس فيزيائي؟","options":[{"key":"A","letter":"أ","text":"يتم الاحتفاظ بسجلات المعاملات لالتقاط تاريخ معالجة النظام"},{"key":"B","letter":"ب","text":"تتطلب إعدادات أمان النظام استخدام كلمات مرور قوية وضوابط وصول."},{"key":"C","letter":"ج","text":"يتم تسجيل محاولات تسجيل الدخول الفاشلة في النظام وتحليلها لتحديد حوادث الأمان المحتملة."},{"key":"D","letter":"د","text":"يتم تأمين خوادم النظام بآليات قفل مع منح الوصول لأفراد محددين"}],"explanation":"أ. خطأ لأنه تحكم إداري/تقني يتمثل في حفظ السجلات وليس تحكمًا فيزيائيًا.\n\nب. خطأ لأنه تحكم تقني يتعلق بكلمات المرور وضوابط الوصول المنطقية.\n\nج. خطأ لأنه تحكم تقني تحليلي يعتمد على مراقبة السجلات وليس تحكمًا فيزيائيًا.\n\nد. صحيح لأنه يمثل تحكمًا فيزيائيًا ملموسًا مثل الأقفال وتقييد الوصول المادي للخوادم.","oldQNumber":"13","bankIndex":12,"setId":"set2"},{"id":"57","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي مما يلي سيكون أقوى تحكم لمنع الوصول غير المصرح إليه إلى شبكة لاسلكية؟","options":[{"key":"A","letter":"أ","text":"السماح بالوصول إلى شبكة المنظمة فقط من خلال شبكة افتراضية خاصة."},{"key":"B","letter":"ب","text":"تسجيل الأجهزة التي تصل إلى الشبكة، بما في ذلك التاريخ والوقت وهوية المستخدم."},{"key":"C","letter":"ج","text":"تتبع جميع المواقع الفيزيائية للأجهزة المحمولة وحظر الوصول من المناطق غير المخصصة."},{"key":"D","letter":"د","text":"السماح فقط لموظفي تكنولوجيا المعلومات المعتمدين بالتحكم الإداري في الأجهزة المحمولة."}],"explanation":"أ. صحيح لأنه يضيف طبقة مصادقة وتشفير قوية، مما يمنع الوصول غير المصرح به إلى الشبكة.\n\nب. خطأ لأنه عنصر تحكم كاشف (Detective) يسجل النشاط ولا يمنع الوصول.\n\nج. خطأ لأنه يقيّد المواقع الجغرافية لكنه لا يوفر حماية شاملة من الوصول غير المصرح به.\n\nد. خطأ لأنه يقيّد الصلاحيات الإدارية للأجهزة المحمولة، لكنه لا يمنع مباشرةً الوصول غير المصرح به إلى الشبكة اللاسلكية.","oldQNumber":"18","bankIndex":13,"setId":"set2"},{"id":"62","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي سيكون مصدر قلق يتعلق بعناصر التحكم في التفويض المستخدمة لنظام ما؟","options":[{"key":"A","letter":"أ","text":"يمكن للمستخدمين فقط رؤية شاشات معينة في النظام."},{"key":"B","letter":"ب","text":"يقدم المستخدمون طلبات تغيير كلمة المرور بشكل متكرر."},{"key":"C","letter":"ج","text":"يقوم المستخدمون بإدخال كلمات مرور غير صحيحة ويتم رفض الوصول إلى النظام."},{"key":"D","letter":"د","text":"يُسمح لجميع المستخدمين بالوصول الموحد إلى النظام"}],"explanation":"أ. خطأ لأنه يعكس وجود تحكم تفويض صحيح (تقييد الوصول حسب الصلاحيات).\n\nب. خطأ لأنه يتعلق بإدارة كلمات المرور وليس التفويض.\n\nج. خطأ لأنه يشير إلى آلية تحقق من الهوية (Authentication) وليس التفويض.\n\nد. صحيح لأنه يمثل مشكلة في التفويض، حيث يتم منح جميع المستخدمين نفس مستوى الوصول دون تمييز، مما يشكل خطرًا أمنيًا.","oldQNumber":"23","bankIndex":14,"setId":"set2"},{"id":"67","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من سياسات أمن البيانات التالية من المرجح أن تكون نتيجة لقانون خصوصية البيانات؟","options":[{"key":"A","letter":"أ","text":"يقتصر الوصول إلى المعلومات الشخصية على أولئك الذين يحتاجون إليها لأداء وظائفهم."},{"key":"B","letter":"ب","text":"يجب نسخ البيانات السرية احتياطيًا واستعادتها خلال فترة 24 ساعة."},{"key":"C","letter":"ج","text":"يجب الموافقة على التحديثات على الأنظمة التي تحتوي على بيانات حساسة قبل نقلها إلى الإنتاج"},{"key":"D","letter":"د","text":"يجب الحفاظ على سجل للموظفين الذين لديهم حق الوصول إلى معلومات المطلعين، وقد لا يتداول هؤلاء الموظفين أسهم الشركة خلال فترات التعتيم."}],"explanation":"أ صحيح لأنه يعكس مبدأ “الحاجة إلى المعرفة” المرتبط مباشرة بقوانين خصوصية البيانات.\nب خطا لأنه يتعلق بالاستمرارية والتعافي وليس بالخصوصية.\nج خطا لأنه يتعلق بإدارة التغيير وليس خصوصية البيانات.\nد خطا لأنه يتعلق بتداول المعلومات الداخلية (insider trading) وليس بقوانين الخصوصية بشكل مباشر.","oldQNumber":"28","bankIndex":15,"setId":"set2"},{"id":"72","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أثناء تدقيق نظام الرواتب، يحدد المدقق الداخلي ويوثق الشرط التالي: \"بمجرد تسجيل مستخدم في النظام، يكون للمستخدم حق الوصول إلى جميع الوظائف داخل النظام، ما هو السبب الجذري الأكثر احتمالًا لهذه المشكلة؟","options":[{"key":"A","letter":"أ","text":"تعتمد عملية المصادقة على كلمة مرور بسيطة فقط، وهي طريقة ضعيفة للمصادقة (للتفويض)."},{"key":"B","letter":"ب","text":"تفويض المستخدم للنظام لا يعكس حقوق الوصول المقصودة بشكل صحيح."},{"key":"C","letter":"ج","text":"لم تكن هناك مراجعة دورية للتحقق من صحة حقوق الوصول."},{"key":"D","letter":"د","text":"على ما يبدو لم يوافق مالك التطبيق على طلب الوصول خلال عملية التزويد."}],"explanation":"أ خطا لأنه يتعلق بآلية الدخول (المصادقة) وليس بتحديد الصلاحيات.\nب صحيح لأنه يشير إلى أن صلاحيات المستخدمين تم منحها بشكل خاطئ أو غير مقيد.\nج خطا لأنه يتعلق بالمراجعة الدورية وليس سبب المشكلة الأساسي في التصميم.\nد خطا لأنه يتعلق بإجراءات الموافقة وليس سبب منح صلاحيات شاملة.","oldQNumber":"33","bankIndex":16,"setId":"set2"},{"id":"77","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين بشأن تكنولوجيا المعلومات، أي مما يلي يعتبر عنصر تحكم أساسي في جدول بيانات للمساعدة في ضمان إعداد تقارير مالية دقيقة؟","options":[{"key":"A","letter":"أ","text":"يتم قفل أو حماية الصيغ والبيانات الثابتة."},{"key":"B","letter":"ب","text":"يتم تخزين جدول البيانات على خادم شبكة يتم نسخه احتياطيًا يوميًا."},{"key":"C","letter":"ج","text":"يتم توثيق الغرض واستخدام جدول البيانات."},{"key":"D","letter":"د","text":"يتم استخدام برنامج تسجيل الدخول والخروج للتحكم في الإصدارات."}],"explanation":"أ. صحيح لأنه يتم قفل أو حماية الصيغ والبيانات الثابتة لمنع التعديلات غير المصرح بها التي قد تؤثر على دقة التقارير المالية.\n\nب. خطأ لأنه يركز على النسخ الاحتياطي واستمرارية العمل أكثر من تركيزه على دقة البيانات المالية.\n\nج. خطأ لأنه التوثيق مهم للاستخدام والفهم، لكنه لا يعد عنصر التحكم الأساسي لضمان دقة التقارير المالية.\n\nد. خطأ لأنه يساعد في التحكم بالإصدارات، لكنه لا يحمي الصيغ والبيانات من التعديل غير المصرح به.","oldQNumber":"38","bankIndex":17,"setId":"set2"},{"id":"82","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"عند تحديد مستوى الضوابط المادية المطلوبة لمحطة عمل، ما هي العوامل التالية التي يجب مراعاتها؟","options":[{"key":"A","letter":"أ","text":"سهولة الاستخدام."},{"key":"B","letter":"ب","text":"قيمة العمل بالنسبة للشركة."},{"key":"C","letter":"ج","text":"منع التطفل."},{"key":"D","letter":"د","text":"نموذج مريح."}],"explanation":"أ خطا لأنه يتعلق بسهولة الاستخدام وليس بتحديد مستوى الحماية المادية المطلوبة.\nب صحيح لأنه كلما زادت قيمة العمل زادت الحاجة إلى ضوابط مادية أقوى لحماية الأصول.\nج خطا لأنه هدف عام للضوابط وليس عاملًا لتحديد مستوى الحماية.\nد خطا لأنه يتعلق بالراحة الفيزيائية وليس بتقييم مستوى الضوابط الأمنية.","oldQNumber":"43","bankIndex":18,"setId":"set2"},{"id":"87","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"ما هو أحد قيود المسح عن بعد لجهاز ذكي؟","options":[{"key":"A","letter":"أ","text":"لا يمكن قفل البيانات المشفرة لمنع المزيد من الوصول."},{"key":"B","letter":"ب","text":"لا يمكن استعادة الإعدادات الافتراضية على الجهاز."},{"key":"C","letter":"ج","text":"لا يمكن إزالة جميع البيانات بالكامل من الجهاز."},{"key":"D","letter":"د","text":"يلزم برنامج إدارة الأجهزة المحمولة لإجراء مسح عن بعد ناجح."}],"explanation":"أ. خطأ لأنه يمكن قفل البيانات المشفرة لحمايتها من الوصول غير المصرح به.\n\nب. خطأ لأنه يمكن إعادة الجهاز إلى إعداداته الافتراضية بعد المسح.\n\nج. خطأ لأنه يمكن للمسح عن بعد حذف البيانات المخزنة على الجهاز.\n\nد. صحيح لأنه يلزم وجود برنامج لإدارة الأجهزة المحمولة لإرسال أمر المسح وتنفيذه على الجهاز.","oldQNumber":"48","bankIndex":19,"setId":"set2"},{"id":"92","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من ضوابط الوصول الفيزيائي التالية من المرجح أن يعتمد على مفهوم \"شيء تمتلكه\"؟","options":[{"key":"A","letter":"أ","text":"قارئ خصائص الشبكية."},{"key":"B","letter":"ب","text":"قارئ رمز P3M."},{"key":"C","letter":"ج","text":"ماسح البطاقات الذكية."},{"key":"D","letter":"د","text":"ماسح بصمات الأصابع."}],"explanation":"أ خطا لأنه يعتمد على “شيء أنت عليه” (البيومترية).\nب خطا لأنه قد يمثل رمز أو معرفة (شيء تعرفه) وليس امتلاك.\nج صحيح لأنه يعتمد على “شيء تمتلكه” مثل البطاقة الذكية.\nد خطا لأنه يعتمد على بصمة المستخدم وهي “شيء أنت عليه”.","oldQNumber":"53","bankIndex":20,"setId":"set2"},{"id":"97","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي من موظفين تكنولوجيا المعلومات مسؤول عن صيانة المحولات والموجهات للحفاظ على تشغيل أنظمة تكنولوجيا المعلومات كما هو مخطط؟","options":[{"key":"A","letter":"أ","text":"مدير عمليات مركز البيانات."},{"key":"B","letter":"ب","text":"فريق الاستجابة والدعم."},{"key":"C","letter":"ج","text":"مسؤول قاعدة البيانات."},{"key":"D","letter":"د","text":"مسؤول الشبكة."}],"explanation":"أ. خطأ لأنه مسؤول عن إدارة وتشغيل مركز البيانات وليس صيانة المحولات والموجهات بشكل مباشر.\n\nب. خطأ لأنه يركز على دعم المستخدمين ومعالجة المشكلات الفنية.\n\nج. خطأ لأنه مسؤول عن إدارة وصيانة قواعد البيانات.\n\nد. صحيح لأنه مسؤول عن إدارة وصيانة مكونات الشبكة مثل المحولات (Switches) والموجهات (Routers) لضمان استمرارية عمل الشبكة.","oldQNumber":"58","bankIndex":21,"setId":"set2"},{"id":"102","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي مما يلي يصف شبكة تابعة لطرف ثالث تربط مؤسسة على وجه التحديد بشركائها التجاريين؟","options":[{"key":"A","letter":"أ","text":"شبكة قيمة مضافة (VAN)."},{"key":"B","letter":"ب","text":"شبكة محلية (LAN)."},{"key":"C","letter":"ج","text":"شبكة منطقة حضرية (MAN)."},{"key":"D","letter":"د","text":"شبكة واسعة النطاق (WAN)."}],"explanation":"أ. صحيح لأنها شبكة قيمة مضافة (Value Added Network - VAN) تُدار من طرف ثالث وتُستخدم لربط المؤسسات بشركائها التجاريين وتسهيل تبادل البيانات بشكل آمن.\n\nب. خطأ لأنها شبكة داخلية محدودة داخل مؤسسة واحدة.\n\nج. خطأ لأنها تغطي نطاق مدينة أو منطقة حضرية وليست مخصصة لربط شركاء أعمال.\n\nد. خطأ لأنها شبكة واسعة النطاق عامة وليست شبكة طرف ثالث مخصصة للأعمال.","oldQNumber":"63","bankIndex":22,"setId":"set2"},{"id":"107","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي مما يلي يعد مثالاً على التحكم في الأمان المادي الذي يجب أن يكون موجودًا في مركز بيانات المؤسسة؟","options":[{"key":"A","letter":"أ","text":"يتم تخزين خوادم النسخ الاحتياطي في مركز البيانات في موقع يتم التحكم فيه بيئيًا"},{"key":"B","letter":"ب","text":"جميع المستخدمين لديهم معرف فريد وكلمة مرور للوصول إلى البيانات"},{"key":"C","letter":"ج","text":"تُستخدم بطاقات التمرير للوصول إلى مركز البيانات"},{"key":"D","letter":"د","text":"توجد جدران الحماية وبرامج الحماية من الفيروسات لمنع الوصول غير المصرح به إلى البيانات"}],"explanation":"أ خطا لأنه يتعلق بالحماية البيئية والتخزين وليس وسيلة دخول مادية.\nب خطا لأنه تحكم منطقي (مصادقة) وليس تحكم مادي.\nج صحيح لأنه بطاقات التمرير تستخدم للتحكم المادي في الدخول إلى مركز البيانات.\nد خطا لأنه تحكم تقني (شبكي وبرمجي) وليس مادي.","oldQNumber":"68","bankIndex":23,"setId":"set2"},{"id":"112","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"وفقًا لتوجيهات IIA، ما الذي يربط بين أجهزة الكمبيوتر ويمكّنها من التواصل مع بعضها البعض؟","options":[{"key":"A","letter":"أ","text":"رمز برنامج التطبيق"},{"key":"B","letter":"ب","text":"نظام قاعدة البيانات"},{"key":"C","letter":"ج","text":"نظام التشغيل"},{"key":"D","letter":"د","text":"شبكات"}],"explanation":"أ خطا لأنه يتعلق بتشغيل التطبيقات وليس ربط الأجهزة.\nب خطا لأنه يدير البيانات داخل النظام وليس الاتصال بين الأجهزة.\nج خطا لأنه يدير موارد الجهاز المحلي وليس ربط أجهزة متعددة.\nد صحيح لأنه الشبكات هي التي تربط أجهزة الكمبيوتر وتمكّنها من التواصل مع بعضها البعض.","oldQNumber":"73","bankIndex":24,"setId":"set2"},{"id":"117","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من ضوابط التطبيقات التالية، التي يطبقها الإدارة، تراقب البيانات التي تتم معالجتها لضمان بقاء البيانات متسقة ودقيقة؟","options":[{"key":"A","letter":"أ","text":"ضوابط مسار الإدارة."},{"key":"B","letter":"ب","text":"ضوابط الإخراج."},{"key":"C","letter":"ج","text":"ضوابط النزاهة (ضوابط الاكتمال)."},{"key":"D","letter":"د","text":"ضوابط المدخلات."}],"explanation":"أ خطا لأنه يركز على الإجراءات الإدارية وليس على مراقبة دقة البيانات أثناء المعالجة.\nب خطا لأنه يتحقق من نتائج البيانات بعد المعالجة وليس أثناءها.\nج صحيح لأنه يضمن أن البيانات تبقى متسقة وكاملة ودقيقة أثناء المعالجة.\nد خطا لأنه يركز على صحة البيانات عند الإدخال فقط وليس أثناء المعالجة.","oldQNumber":"78","bankIndex":25,"setId":"set2"},{"id":"122","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"تلقت مديرة في دار نشر بريدًا إلكترونيًا يبدو أنه من أحد مورديها مرفق به ملف ملحق يحتوي على برامج ضارة مضمنة في جدول بيانات Excel. عند فتح جدول البيانات، تمكن المجرم الإلكتروني من مهاجمة شبكة الشركة والوصول إلى كتاب غير منشور ومنتظر بشدة. أي من الضوابط التالية سيكون أكثر فعالية لمنع مثل هذا الهجوم؟","options":[{"key":"A","letter":"أ","text":"مراقبة حركة الشبكة."},{"key":"B","letter":"ب","text":"استخدام القوائم البيضاء والقوائم السوداء لإدارة حركة الشبكة."},{"key":"C","letter":"ج","text":"تقييد الوصول وحظر الوصول غير المصرح به إلى الشبكة."},{"key":"D","letter":"د","text":"توعية جميع الموظفين في الشركة للتعرف على هجمات التصيد الاحتيالي"}],"explanation":"أ خطا لأنه يكتشف الهجمات بعد حدوثها ولا يمنع فتح الملفات الضارة من البداية.\nب خطا لأنه يتحكم في حركة الشبكة فقط ولا يمنع المستخدم من فتح مرفقات ضارة.\nج خطا لأنه يركز على التحكم في الوصول للشبكة وليس منع هجمات التصيد عبر البريد الإلكتروني.\nد صحيح لأنه يقلل من نجاح هجمات التصيد عبر توعية المستخدمين بعدم فتح مرفقات مشبوهة.","oldQNumber":"83","bankIndex":26,"setId":"set2"},{"id":"127","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"وفقًا لإرشادات المعهد الأمريكي للمراجعين الداخليين، أي مما يلي صحيح فيما يتعلق بأجهزة كمبيوتر محطات العمل التي تصل إلى معلومات الشركة المخزنة على الشبكة؟","options":[{"key":"A","letter":"أ","text":"عناصر تحكم أجهزة كمبيوتر محطات العمل الفردية ليست بنفس أهمية عناصر تحكم خوادم الشركة على مستوى المؤسسة"},{"key":"B","letter":"ب","text":"يجب إيلاء اهتمام خاص لإبعاد محطات العمل عن المخاطر البيئية"},{"key":"C","letter":"ج","text":"يمكن التحكم في قضايا الأمن السيبراني على مستوى المؤسسة، مما يجعل عناصر تحكم مستوى محطات العمل زائدة عن الحاجة"},{"key":"D","letter":"د","text":"نظرًا لأن المخاطر الأمنية تقترب من أعلى مستوياتها على الإطلاق، يجب عدم توصيل محطات العمل بشبكة الشركة"}],"explanation":"أ. خطأ لأنه عناصر تحكم أجهزة كمبيوتر محطات العمل الفردية ليست أقل أهمية من خوادم الشركة لأنها نقطة وصول مباشرة للمعلومات.\n\nب. صحيح لأنه يجب إيلاء اهتمام خاص لإبعاد محطات العمل عن المخاطر البيئية مثل الحرارة والغبار والرطوبة.\n\nج. خطأ لأنه لا يمكن الاعتماد فقط على مستوى المؤسسة وإهمال عناصر التحكم على مستوى محطات العمل.\n\nد. خطأ لأنه غير عملي ويمنع استخدام الشبكة داخل الشركة.","oldQNumber":"88","bankIndex":27,"setId":"set2"},{"id":"132","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما الذي يسهل استخراج البيانات من تطبيق؟","options":[{"key":"A","letter":"أ","text":"رمز برنامج التطبيق."},{"key":"B","letter":"ب","text":"نظام قاعدة البيانات."},{"key":"C","letter":"ج","text":"نظام التشغيل."},{"key":"D","letter":"د","text":"الشبكات."}],"explanation":"أ. خطأ لأنه مسؤول عن تشغيل وظائف التطبيق وليس استخراج البيانات بشكل مباشر.\n\nب. صحيح لأنه يخزن البيانات وينظمها ويتيح استرجاعها واستخراجها من التطبيق.\n\nج. خطأ لأنه يدير موارد الحاسوب ولا يتولى استخراج بيانات التطبيق.\n\nد. خطأ لأنها توفر نقل البيانات بين الأجهزة ولا تقوم باستخراجها.","oldQNumber":"93","bankIndex":28,"setId":"set2"},{"id":"137","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أي من عناصر تحكم أمن المعلومات له الوظيفة الأساسية لمنع المستخدمين الخارجيين غير المصرّح لهم بالوصول إلى بيانات مؤسسة من خلال شبكة المؤسسة؟","options":[{"key":"A","letter":"أ","text":"جدار حماية"},{"key":"B","letter":"ب","text":"تشفير"},{"key":"C","letter":"ج","text":"مضاد للفيروسات."},{"key":"D","letter":"د","text":"بصمات."}],"explanation":"أ. صحيح لأنه يتحكم في حركة المرور عبر الشبكة ويمنع الوصول غير المصرح به من خارج المؤسسة.\n\nب. خطأ لأنه يحمي سرية البيانات عبر تشفيرها، لكنه لا يمنع الدخول إلى الشبكة.\n\nج. خطأ لأنه يهدف إلى اكتشاف وإزالة البرمجيات الضارة وليس التحكم في الوصول الشبكي.\n\nد. خطأ لأنه وسيلة مصادقة للتحقق من هوية المستخدم وليس لمنع الوصول الشبكي الخارجي.","oldQNumber":"98","bankIndex":29,"setId":"set2"},{"id":"142","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من الإجراءات التالية من شأنه أن يحمي المؤسسة بشكل أفضل من الهجمات الآلية التي يحاول فيها المهاجم تحديد كلمات مرور ضعيفة أو مسربة من أجل تسجيل الدخول إلى حسابات الموظفين؟","options":[{"key":"A","letter":"أ","text":"مطالبة المستخدمين بتغيير كلمات المرور كل عامين."},{"key":"B","letter":"ب","text":"طلب التحقق على خطوتين لجميع المستخدمين."},{"key":"C","letter":"ج","text":"مطالبة الموظفين باستخدام شبكة افتراضية خاصة (VPN) عند وجودهم خارج المكتب."},{"key":"D","letter":"د","text":"مطالبة باستخدام أدوات مكافحة الفيروسات والأمان وإدارة الأحداث المحدثة."}],"explanation":"أ خطا لأنه تغيير كلمة المرور بشكل دوري لا يمنع الهجمات الآلية بشكل فعال.\nب صحيح لأنه يضيف طبقة تحقق إضافية تمنع الدخول حتى لو كانت كلمة المرور مخترقة.\nج خطا لأنه يحمي الاتصال وليس تسجيل الدخول أو كلمات المرور.\nد خطا لأنه يركز على الحماية من البرمجيات وليس على منع محاولات تسجيل الدخول الآلية.","oldQNumber":"103","bankIndex":30,"setId":"set2"},{"id":"147","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"ما هو الخطر الأكثر صلة بسياسة إحضار جهازك الشخصي؟","options":[{"key":"A","letter":"أ","text":"تسرب البيانات نتيجة امتلاك الأجهزة إمكانية الوصول إلى الشبكة."},{"key":"B","letter":"ب","text":"نقص الفهم للتكنولوجيا ومفهوم الأداة."},{"key":"C","letter":"ج","text":"عدم تسجيل الأصول غير المتداولة."},{"key":"D","letter":"د","text":"الخسائر المالية الناتجة عن سرقة الأجهزة الذكية."}],"explanation":"أ صحيح لأنه الخطر الأساسي في سياسة BYOD هو احتمال تسرب البيانات بسبب اتصال أجهزة شخصية غير مُدارة بالشبكة المؤسسية.\nب خطأ لأنه ليس خطرًا مباشرًا على أمن المعلومات.\nج خطأ لأنه يتعلق بإدارة الأصول وليس بسياسة BYOD.\nد خطأ لأنه خطر ثانوي وليس الأكثر صلة بالأمن السيبراني للشبكة.","oldQNumber":"108","bankIndex":31,"setId":"set2"},{"id":"152","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من العبارات التالية صحيحة فيما يتعلق بتشفير الأجهزة الذكية ؟","options":[{"key":"A","letter":"أ","text":"يقوم فقط بتشفير البيانات المتعلقة بالتطبيقات الموجودة على الجهاز"},{"key":"B","letter":"ب","text":"يقوم بتشفير جميع البيانات والتطبيقات الموجودة على الجهاز."},{"key":"C","letter":"ج","text":"يقوم بتشفير البريد الالكتروني والتطبيقات وحركة المرور والشبكة الخاصة الافتراضية باستخدام أمان طبقة النقل"},{"key":"D","letter":"د","text":"يقوم بتشفير البيانات بالمصادقة على الجهاز فقط"}],"explanation":"أ خطا لأنه تشفير التطبيقات فقط لا يمثل التشفير الكامل للجهاز.\nب صحيح لأنه تشفير الجهاز يحمي جميع البيانات والتطبيقات المخزنة عليه بشكل شامل.\nج خطا لأنه يخلط بين تقنيات متعددة مثل TLS وVPN وليس تعريفًا لتشفير الجهاز.\nد خطا لأنه المصادقة ليست تشفيرًا للبيانات.","oldQNumber":"113","bankIndex":32,"setId":"set2"},{"id":"157","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من المجالات التشغيلية لتكنولوجيا المعلومات التالية هي المسؤولة عن سلامة تدفق البيانات داخل المؤسسة ؟","options":[{"key":"A","letter":"أ","text":"الشبكة"},{"key":"B","letter":"ب","text":"قاعدة البيانات"},{"key":"C","letter":"ج","text":"نظام التشغيل"},{"key":"D","letter":"د","text":"الخادم"}],"explanation":"أ خطأ لأنه الشبكة مسؤولة عن نقل البيانات وليس ضمان سلامتها داخل النظام.\nب صحيح لأنه قاعدة البيانات مسؤولة عن سلامة البيانات وتكاملها أثناء التخزين والمعالجة داخل المؤسسة.\nج خطأ لأنه نظام التشغيل يدير الموارد لكنه لا يضمن سلامة تدفق البيانات.\nد خطأ لأنه الخادم يوفر الخدمة فقط وليس مسؤولًا عن سلامة البيانات.","oldQNumber":"118","bankIndex":33,"setId":"set2"},{"id":"162","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"A","question":"أيٌّ مما يلي يميّز بين ضوابط الوصول المادي وضوابط الوصول المنطقي؟","options":[{"key":"A","letter":"أ","text":"تحمي ضوابط الوصول المادي موارد تقنية المعلومات الملموسة، بينما تحمي ضوابط الوصول المنطقي البرمجيات والبيانات داخل نظام تقنية المعلومات."},{"key":"B","letter":"ب","text":"تحمي ضوابط الوصول المادي البرمجيات والبيانات، بينما تحمي ضوابط الوصول المنطقي الموارد الملموسة."},{"key":"C","letter":"ج","text":"تشمل ضوابط الوصول المادي الجدران النارية ومعرّفات المستخدم وكلمات المرور، بينما تشمل ضوابط الوصول المنطقي الأبواب المقفلة والحراس."},{"key":"D","letter":"د","text":"تشمل ضوابط الوصول المادي ضوابط الإدخال والمعالجة والإخراج، بينما تشمل ضوابط الوصول المنطقي الأبواب المقفلة والحراس."}],"explanation":"أ صحيح لأنه يوضح الفرق الأساسي: المادي يحمي الأصول الملموسة، والمنطقي يحمي البيانات والبرمجيات داخل الأنظمة.\nب خطأ لأنه يعكس المفهوم بشكل خاطئ.\nج خطأ لأنه يخلط بين الضوابط المادية والمنطقية.\nد خطأ لأنه يخلط بين أنواع مختلفة من الضوابط ولا يميز بشكل صحيح بين المادي والمنطقي.","oldQNumber":"123","bankIndex":34,"setId":"set2"},{"id":"167","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي من الأنشطة التالية يوضح بشكل أفضل تحكم مصادقة المستخدم؟","options":[{"key":"A","letter":"أ","text":"تتم الموافقة على طلبات الهوية على مرحلتين."},{"key":"B","letter":"ب","text":"يتم التحقق من السجلات بحثا عن هويات وحقوق وصول غير متسقة."},{"key":"C","letter":"ج","text":"يجب على المستخدمين التحقق من هويتهم باستخدام بطاقة ذكية."},{"key":"D","letter":"د","text":"يمكن تنفيذ الوظائف بناءً على حقوق الوصول."}],"explanation":"أ. خطأ لأنه يتعلق بإدارة الهوية (Identity Provisioning) وليس المصادقة.\n\nب. خطأ لأنه نشاط مراجعة/رقابي (Audit/Monitoring) وليس مصادقة.\n\nج. صحيح لأنه يمثل مصادقة المستخدم (Authentication) حيث يتم التحقق من هوية المستخدم باستخدام بطاقة ذكية.\n\nد. خطأ لأنه يتعلق بالتفويض (Authorization) أي تحديد الصلاحيات بعد تسجيل الدخول.","oldQNumber":"128","bankIndex":35,"setId":"set2"},{"id":"172","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أي مما يلي يعد مكونًا رئيسيًا من مكونات حوكمة الأمن السيبراني للمؤسسة ؟","options":[{"key":"A","letter":"أ","text":"قيام المسؤولين بمراقبة استخدام الامتيازات على الشبكة وتخصيصها وتكوينها"},{"key":"B","letter":"ب","text":"قسم تكنولوجيا المعلومات الذي يقوم بإنشاء وتنفيذ وإدارة تكوينات الأمان وإدارة نشاطها"},{"key":"C","letter":"ج","text":"الإدارة تحديد وتصنيف أنواع البيانات الهامة في نظام المؤسسة وتصنيفها"},{"key":"D","letter":"د","text":"الإدارة العليا للمنظمة التي تضع سياسة الأمن السيبراني"}],"explanation":"أ خطا لأنه يمثل نشاط تشغيلي وإداري تقني وليس حوكمة على مستوى المؤسسة.\nب خطا لأنه يصف مهام تنفيذية لقسم تقنية المعلومات وليس مستوى الحوكمة.\nج خطا لأنه يتعلق بتصنيف البيانات وهو جزء من إدارة المعلومات وليس الحوكمة العليا.\nد صحيح لأنه حوكمة الأمن السيبراني تبدأ من الإدارة العليا التي تضع السياسات والتوجهات العامة للأمن.","oldQNumber":"133","bankIndex":36,"setId":"set2"},{"id":"177","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أيٌّ مما يلي يُعد مثالًا على هجوم تصيّد احتيالي؟","options":[{"key":"A","letter":"أ","text":"تعرض موقع المنظمة لهجوم كثيف بحركة مرور خبيثة أدى إلى تعطله ومنع العملاء من الشراء."},{"key":"B","letter":"ب","text":"استجابة موظفي منظمة تجزئة لرسائل بريد إلكتروني تحتوي على رابط لبرمجيات خبيثة مكّنت مخترقًا من الوصول إلى نظام نقاط البيع والحصول على معلومات بطاقات الائتمان."},{"key":"C","letter":"ج","text":"نقر موظفو منظمة على رابط أدى إلى اختراق النظام ببرمجية دودية قامت بتشفير نظام التشغيل وطالبت مجموعة قراصنة بفدية."},{"key":"D","letter":"د","text":"قيام مجموعة من النشطاء الإلكترونيين باختراق البريد الإلكتروني والسجلات السرية لشرطة محلية ونشرها على الإنترنت."}],"explanation":"أ خطأ لأنه هجوم حجب خدمة وليس تصيّدًا احتياليًا.\nب صحيح لأنه يعتمد على رسائل بريد إلكتروني خادعة وروابط خبيثة لخداع المستخدمين وسرقة البيانات (تصيّد احتيالي).\nج خطأ لأنه هجوم برمجيات فدية عبر دودة وليس تصيّدًا مباشرًا.\nد خطأ لأنه اختراق ونشر بيانات وليس تصيّدًا احتياليًا.","oldQNumber":"138","bankIndex":37,"setId":"set2"},{"id":"182","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"D","question":"أقنع مهاجم، متنكرًا في صورة ممثل للبنك، موظفًا بإطلاق معلومات مالية معينة مما أدى في النهاية إلى احتيال. ما هو أفضل وصف لمخاطر الأمن الإلكتروني هذه؟","options":[{"key":"A","letter":"أ","text":"الاقتراب الخفي (Shoulder suiting)"},{"key":"B","letter":"ب","text":"التصيد الزراعي (Pharming)"},{"key":"C","letter":"ج","text":"التصيد (Phishing)"},{"key":"D","letter":"د","text":"الهندسة الاجتماعية (Social engineering)"}],"explanation":"أ خطا لأنه يتعلق بمراقبة شاشة الضحية مباشرة وليس انتحال هوية عبر اتصال.\nب خطا لأنه يتعلق بإعادة توجيه المستخدمين إلى مواقع مزيفة وليس إقناع شخص مباشرة.\nج خطا لأنه نوع من الرسائل الاحتيالية عبر البريد أو الرسائل وليس التفاعل المباشر.\nد صحيح لأنه يعتمد على خداع الموظف نفسيًا وانتحال صفة للحصول على معلومات حساسة.","oldQNumber":"143","bankIndex":38,"setId":"set2"},{"id":"187","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"ما هي الإجراءات التالية التي يجب على الإدارة العليا النظر فيها كجزء من إرشادات تقنية معلومات جديدة تتعلق بسياسات الأمن الإلكتروني للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"تكليف أدوار ومسؤوليات جديدة لإدارة تقنية المعلومات العليا."},{"key":"B","letter":"ب","text":"زيادة استخدام إحضار أجهزتك الخاصة للمسائل التنظيمية."},{"key":"C","letter":"ج","text":"توسيع العمليات إلى أسواق جديدة ذات وصول محدود إلى تقنية المعلومات."},{"key":"D","letter":"د","text":"توظيف موظفين جدد داخل قسم تقنية المعلومات لأغراض أمنية."}],"explanation":"أ خطا لأنه يتعلق بالحوكمة الداخلية وليس بالإرشادات المتعلقة باستخدام الأجهزة والسياسات التشغيلية.\nب صحيح لأنه يؤثر مباشرة على سياسة أمن المعلومات من خلال السماح باستخدام أجهزة شخصية وما يرتبط به من مخاطر أمنية.\nج خطا لأنه قرار توسع أعمال وليس مرتبطًا مباشرة بسياسات الأمن الإلكتروني.\nد خطا لأنه إجراء تشغيلي داخلي وليس توجيهًا مرتبطًا بسياسة أمن المعلومات العامة.","oldQNumber":"148","bankIndex":39,"setId":"set2"},{"id":"192","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"C","question":"أي مما يلي يصف بشكل أفضل نوع التحكم الذي يوفره جدار الحماية؟","options":[{"key":"A","letter":"أ","text":"تصحيحي"},{"key":"B","letter":"ب","text":"اكتشافي"},{"key":"C","letter":"ج","text":"وقائي"},{"key":"D","letter":"د","text":"تقديري"}],"explanation":"أ. خطأ لأن الضوابط التصحيحية تُستخدم بعد وقوع المشكلة لمعالجتها، بينما جدار الحماية يعمل قبل حدوثها.\n\nب. خطأ لأن الضوابط الاكتشافية تكتشف الهجمات بعد أو أثناء وقوعها، وليس منعها مباشرة.\n\nج. صحيح لأن جدار الحماية (Firewall) هو تحكم وقائي يمنع الوصول غير المصرح به قبل حدوث الاختراق.\n\nد. خطأ لأن “تقديري” ليس نوعًا معتمدًا من تصنيفات الضوابط الأمنية.","oldQNumber":"153","bankIndex":40,"setId":"set2"},{"id":"197","form":"form1","formTitle":"Group 1","lesson":"ب- تكنولوجيا المعلومات","answer":"B","question":"أي من الإجراءات التالية تتخذها المنظمة للتخفيف من مخاطر الوصول إلى المعلومات الشخصية الحساسة بشكل غير صحيح من قبل أطراف غير مصرح لها؟","options":[{"key":"A","letter":"أ","text":"تقليل عدد الأحداث والمبادرات التسويقية المباشرة"},{"key":"B","letter":"ب","text":"تنفيذ وإنفاذ سياسات خصوصية البيانات"},{"key":"C","letter":"ج","text":"الاستعانة بمصادر خارجية لبعض العمليات التجارية لطرف ثالث"},{"key":"D","letter":"د","text":"أرشفة المعلومات الشخصية المجمعة وتخزينها بشكل آمن إلى الأبد"}],"explanation":"أ خطا لأنه لا يعالج بشكل مباشر خطر الوصول غير المصرح به للبيانات الحساسة.\nب صحيح لأنه تنفيذ وإنفاذ سياسات خصوصية البيانات يضع ضوابط وإجراءات تحد من الوصول غير المصرح به للمعلومات الشخصية.\nج خطا لأن الاستعانة بمصادر خارجية قد تزيد مخاطر الخصوصية إذا لم تُضبط بعقود وضوابط مناسبة.\nد خطا لأنه الاحتفاظ بالبيانات إلى الأبد يخالف مبدأ تقليل الاحتفاظ ويزيد المخاطر الأمنية.","oldQNumber":"158","bankIndex":41,"setId":"set2"},{"id":"202","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"A","question":"أي مما يلي يصف بشكل أفضل حقوق ملكية صاحب المنشأة؟","options":[{"key":"A","letter":"أ","text":"الأصول مطروح منها الالتزامات."},{"key":"B","letter":"ب","text":"إجمالي الأصول."},{"key":"C","letter":"ج","text":"إجمالي الالتزامات."},{"key":"D","letter":"د","text":"مساهمة المالكين بالإضافة إلى السحوبات."}],"explanation":"أ. صحيح لأنه يمثل المعادلة المحاسبية الأساسية حيث حقوق الملكية = الأصول − الالتزامات.\n\nب. خطأ لأنه يمثل جانب الأصول فقط وليس حقوق الملكية.\n\nج. خطأ لأنه يمثل الالتزامات وليس حقوق الملكية.\n\nد. خطأ لأنه لا يمثل حقوق الملكية بشكل صحيح لأنه لا يشمل الأرباح المحتجزة.","oldQNumber":"1","bankIndex":42,"setId":"set3"},{"id":"206","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"C","question":"أي من الأصول غير الملموسة يعتبر له عمر غير محدد؟","options":[{"key":"A","letter":"أ","text":"رواسب النفط تحت الأرض"},{"key":"B","letter":"ب","text":"حقوق النشر"},{"key":"C","letter":"ج","text":"العلامة التجارية"},{"key":"D","letter":"د","text":"الأرض"}],"explanation":"أ. خطأ لأنه مورد طبيعي ملموس يتم استنفاده مع مرور الوقت.\n\nب. خطأ لأن حقوق النشر لها عمر قانوني محدد.\n\nج. صحيح لأن بعض العلامات التجارية يمكن أن يكون لها عمر غير محدد طالما استمر تجديدها واستخدامها.\n\nد. خطأ لأن الأرض ليست أصلاً غير ملموس، بل أصل ملموس.","oldQNumber":"5","bankIndex":43,"setId":"set3"},{"id":"211","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"A","question":"أي من أساليب تكلفة رأس المال تحدد الفترة الزمنية المطلوبة لاسترداد تكلفة استثمار رأس المال من التدفق السنوي الذي يتم إنتاجه؟","options":[{"key":"A","letter":"أ","text":"تقنية استرداد النقد."},{"key":"B","letter":"ب","text":"تقنية العائد السنوي."},{"key":"C","letter":"ج","text":"طريقة العائد الداخلي"},{"key":"D","letter":"د","text":"طريقة القيمة الحالية الصافية."}],"explanation":"أ. صحيح لأنه يقيس المدة الزمنية اللازمة لاسترداد الاستثمار من التدفقات النقدية السنوية.\n\nب. خطأ لأنه يقيس معدل العائد وليس فترة الاسترداد.\n\nج. خطأ لأنه يقيس معدل الخصم الذي يجعل القيمة الحالية الصافية تساوي صفرًا.\n\nد. خطأ لأنه يقيم الجدوى من خلال القيمة الحالية وليس فترة الاسترداد.","oldQNumber":"10","bankIndex":44,"setId":"set3"},{"id":"216","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"A","question":"وجد مدقق داخلي المعلومات التالية أثناء مراجعة البيانات المالية الشهرية لتاجر جملة للسلامة مخزون الافتتاح1000 وحدة بسعر 2 دولار لكل وحدة تم شراؤها 5000 وحدة بسعر 3 دولارات للوحدة المباعة 3000 وحدة بسعر 7 دولارات للوحدة تم الإبلاغ عن تكلفة البضائع المباعة بمبلغ 8500 دولار . أي من طرق الجرد التالية تم استخدامة لاشتقاق هذه القيمة؟","options":[{"key":"A","letter":"أ","text":"طريقة متوسط التكلفة."},{"key":"B","letter":"ب","text":"طريقة الوارد أولاً يصرف أولاً FIFO)."},{"key":"C","letter":"ج","text":"طريقة تحديد محددة."},{"key":"D","letter":"د","text":"طريقة حساب التكلفة على أساس النشاط"}],"explanation":"أ. صحيح لأنه يتم دمج تكاليف الوحدات المختلفة للوصول إلى تكلفة موحدة تتطابق مع نتيجة تكلفة البضائع المباعة المعطاة.\n\nب. خطأ لأنه FIFO يعطي نتائج مختلفة تعتمد على أقدم التكاليف وليس المتوسط.\n\nج. خطأ لأنه يتطلب تحديد كل وحدة بشكل فردي وليس حسابًا متوسطًا.\n\nد. خطأ لأنه ليس أسلوبًا مستخدمًا في تقييم المخزون.","oldQNumber":"15","bankIndex":45,"setId":"set3"},{"id":"221","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"A","question":"تصنع شركة 10000 لعبة بتكلفة متغيرة 5 دولار وتكلفة ثابتة 15000 دولار تباع الشاحنات عادة 10 دولار، تلقت الشركة طلبًا خاصًا لشراء 3000 لعبة بسعر 6 دولار، ولتلبية ذلك يجب تحسين القدرة التصنيعية بتكلفة إضافية 1500 دولار. ما هي التكلفة ذات الصلة؟","options":[{"key":"A","letter":"أ","text":"5.5 دولار"},{"key":"B","letter":"ب","text":"6 دولار"},{"key":"C","letter":"ج","text":"6.5 دولار"},{"key":"D","letter":"د","text":"7 دولار"}],"explanation":"أ. صحيح لأنه في القرار يتم احتساب التكلفة المتغيرة (5 ة من حساب استثمار المستثمر وفقًا لذلك."},{"key":"B","letter":"ب","text":"يجب على المستثمر تعديل حساب الاستثمار بنسبة ملكيته."},{"key":"C","letter":"ج","text":"يتم تعديل حساب الاستثمار إلى الأسفل بنسبة الملكية."},{"key":"D","letter":"د","text":"يجب على المستثمر تسجيل توزيعات الأرباح النقدية كإيرادات من الأرباح."}],"explanation":"أ. خطأ لأنه توزيعات الأرباح لا تزيد رصيد الاستثمار بل يتم تسجيلها كإيراد أو تخفيض للاستثمار حسب الطريقة.\n\nب. خطأ لأنه لا يتم تعديل الاستثمار بهذه الطريقة المباشرة عند استلام أرباح.\n\nج. خطأ لأنه لا يتم تخفيض الاستثمار تلقائيًا بهذه الصيغة.\n\nد. صحيح لأنه عند وجود نفوذ ضئيل (استثمار سلبي/قيمة عادلة) تُسجل توزيعات الأرباح كإيراد أرباح.","oldQNumber":"45","bankIndex":51,"setId":"set3"},{"id":"251","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"D","question":"ما الذي يفسر بشكل أفضل سبب دخول منظمة في عقد إيجار رأسمالي؟","options":[{"key":"A","letter":"أ","text":"لزيادة القدرة على اقتراض أموال إضافية من الدائنين."},{"key":"B","letter":"ب","text":"لتقليل التدفق النقدي الحر للمنظمة من العمليات."},{"key":"C","letter":"ج","text":"لتحسين التدفق النقدي الحر للمنظمة من العمليات."},{"key":"D","letter":"د","text":"لاكتساب الأصول في نهاية فترة الإيجار بسعر أقل من القيمة السوقية العادلة."}],"explanation":"أ. خطأ لأنه عقد الإيجار الرأسمالي لا يهدف مباشرة إلى زيادة القدرة على الاقتراض.\n\nب. خطأ لأنه لا يتم الدخول في الإيجار الرأسمالي بهدف تقليل التدفق النقدي الحر.\n\nج. خطأ لأنه لا يحسن التدفق النقدي الحر من العمليات بشكل مباشر.\n\nد. صحيح لأنه أحد الأسباب الرئيسية للإيجار الرأسمالي هو إمكانية تملك الأصل في النهاية غالبًا بسعر أقل من قيمته السوقية.","oldQNumber":"50","bankIndex":52,"setId":"set3"},{"id":"256","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"B","question":"ماذا يمثل أساسًا للدمج بموجب المعايير الدولية لإعداد التقارير المالية؟","options":[{"key":"A","letter":"أ","text":"نهج الكيان المتغير."},{"key":"B","letter":"ب","text":"ملكية السيطرة."},{"key":"C","letter":"ج","text":"المخاطر والمكافأة."},{"key":" مة مخزونها النهائي. ما هو تأثير ذلك على بيان الدخل للسنة التالية؟","options":[{"key":"A","letter":"أ","text":"سيتم التقليل من صافي الدخل."},{"key":"B","letter":"ب","text":"لن يتأثر صافي الدخل."},{"key":"C","letter":"ج","text":"سيتم المبالغة في صافي الدخل."},{"key":"D","letter":"د","text":"سيكون صافي الدخل سلبيًا."}],"explanation":"أ. خطأ لأنه لا يؤدي إلى تقليل صافي الدخل في السنة التالية.\n\nب. خطأ لأنه يوجد تأثير على تكلفة البضائع المباعة.\n\nج. صحيح لأنه يقلل تكلفة البضائع المباعة في السنة التالية فيزيد صافي الدخل.\n\nد. خطأ لأنه لا يجعل صافي الدخل سالبًا بالضرورة.","oldQNumber":"80","bankIndex":58,"setId":"set3"},{"id":"286","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"C","question":"أي مما يلي يعد أفضل مؤشر على أن المؤسسة توفر المال؟","options":[{"key":"A","letter":"أ","text":"لم تحدث أي مدفوعات مكررة خلال الربع الماضي"},{"key":"B","letter":"ب","text":"خلال الربع الماضي تم سداد 95% من الفواتير في الموعد المحدد"},{"key":"C","letter":"ج","text":"خلال الربع الماضي تم سداد 85% من الفواتير المؤهلة للدفع المبكر في الوقت المناسب للحصول على الخصم"},{"key":"D","letter":"د","text":"خلال الربع الماضي كانت نسبة 100% من المدفوعات المقدمة مطابقة للمبالغ المذكورة في الفواتير"}],"explanation":"أ. خطأ لأنه يمنع الأخطاء لكنه لا يدل مباشرة على توفير المال.\n\nب. خطأ لأنه يوضح الالتزام بالمواعيد وليس تحقيق وفورات.\n\nج. صحيح لأنه الاستفادة من خصومات الدفع المبكر تعني توفير مباشر في التكاليف.\n\nد. خطأ لأنه يعكس دقة الدفع وليس تحقيق وفر مالي.","oldQNumber":"86","bankIndex":59,"setId":"set3"},{"id":"291","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"D","question":"في اليوم الأخير من العام، تم تكبد إجمالي تكلفة قدره 150,000 دولار في العمالة غير المباشرة مرتبطة بأحد المنتجات الرئيسية التي تصنعها المنظمة.","options":[{"key":"A","letter":"أ","text":"يجب إظهاره كمصروف إداري في قائمة الدخل."},{"key":"B","letter":"ب","text":"يجب إظهاره كتكلفة فترة بخلاف تكلفة المنتج في الحسابات الإدارية."},{"key":"C","letter":"ج","text":"يجب إظهاره كتكلفة البضائع المباعة في قائمة الدخل. (CGOS)"},{"key":"D","letter":"د","text":"يجب إظهاره في الميزانية العمومية كجزء من المخزون."}],"explanation":"أ. خطأ لأنه العمالة غير المباشرة المرتبطة بالإنتاج ليست مصروفًا إداريًا بل تكلفة تصنيع.\n\nب. خطأ لأنه ليست تكلفة فترة بل تُعامل كتكلفة منتج.\n\nج. خطأ لأنه لا تُحمّل مباشرة على تكلفة البضائع المباعة إلا عند البيع.\n\nد. صحيح لأنه تعتبر تكلفة تصنيع غير مباشرة تُرسمل ضمن المخزون حتى يتم بيع المنتج.","oldQNumber":"91","bankIndex":60,"setId":"set3"},{"id":"296","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"D","question":"وفقًا لمبدأ المقابلة: يتم استخدام عمال في مصنع لتجهيز محركات السيارات ويتم استخدام عمال من أجل إنجاز ذلك متى يتم قيد تكاليف أجور العمالة في قائمة الدخل؟","options":[{"key":"A","letter":"أ","text":"في الفترة التي تم فيها العمل"},{"key":"B","letter":"ب","text":"في الفترة التي تم فيها الدفع الفعلي للعمال"},{"key":"C","letter":"ج","text":"في الفترة التي تم فيها إنجاز المحركات"},{"key":"D","letter":"د","text":"عندما يتم بيع المحركات"}],"explanation":"أ. خطأ لأنه مبدأ المقابلة لا يربط المصروف بالفترة التي تم فيها العمل فقط.\n\nب. خطأ لأنه الدفع النقدي لا يحدد توقيت الاعتراف بالمصروف.\n\nج. خطأ لأنه إنجاز الإنتاج لا يعني الاعتراف بالمصروف في قائمة الدخل.\n\nد. صحيح لأنه يتم تحميل تكاليف العمالة على الفترة التي يتم فيها تحقيق الإيراد من بيع المحركات.","oldQNumber":"96","bankIndex":61,"setId":"set3"},{"id":"301","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"C","question":"أي من العبارات التالية صحيحة فيما يتعلق بإجراء ميزانية رأس المال المعروف باسم فترة استرداد الخصم؟","options":[{"key":"A","letter":"أ","text":"يحصل القيمة الإجمالية للمشروع."},{"key":"B","letter":"ب","text":"يتجاهل القيمة الزمنية للمال."},{"key":"C","letter":"ج","text":"يحصل الوقت الذي يستغرقه المشروع للوصول إلى نقطة التعادل."},{"key":"D","letter":"د","text":"يبدأ من الصفر للمشروع"}],"explanation":"أ. خطأ لأنه لا يحسب القيمة الإجمالية للمشروع.\n\nب. خطأ لأنه فترة الاسترداد المخصومة تأخذ القيمة الزمنية للمال في الاعتبار.\n\nج. صحيح لأنه يقيس الوقت اللازم لاسترداد الاستثمار بعد خصم التدفقات النقدية.\n\nد. خطأ لأنه ليس تعريفًا لطريقة فترة الاسترداد.","oldQNumber":"101","bankIndex":62,"setId":"set3"},{"id":"306","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"B","question":"أي مما يلي يوضح بشكل أفضل تطبيق مبدأ التكلفة؟","options":[{"key":"A","letter":"أ","text":"تقوم الشركة بالإبلاغ عن الأوراق المالية للتداول والاستثمار بسعر السوق الخاص بها."},{"key":"B","letter":"ب","text":"مبنى تم شراؤه العام الماضي مقابل مليون دولار أمريكي ، تقدر قيمته حاليًا 1.2 مليون دولار أمريكي ، لكن الشركة لا تزال تبلغ عن المبنى بمليون دولار أمريكي."},{"key":"C","letter":"ج","text":"مبنى تم شراؤه العام الماضي مقابل مليون دولار أمريكي ، تقدر قيمته حاليًا 1.2 مليون دولار أمريكي ، وتقوم الشركة بتعديل السجلات لتعكس القيمة الحالية."},{"key":"D","letter":"د","text":"تقوم الشركة بالإبلاغ عن الأصول إما بالقيمة التاريخية أو بالقيمة العادلة ، اعتمادًا على أيهما أقرب إلى القيمة السوقية."}],"explanation":"أ. خطأ لأنه يعتمد على القيمة السوقية وليس مبدأ التكلفة التاريخية.\n\nب. صحيح لأنه يعكس مبدأ التكلفة حيث يتم تسجيل الأصل بالتكلفة الأصلية بغض النظر عن التغير في قيمته السوقية.\n\nج. خطأ لأنه يعكس إعادة التقييم وليس مبدأ التكلفة التاريخية.\n\nد. خطأ لأنه يخلط بين أكثر من أساس محاسبي وليس تطبيقًا مباشرًا لمبدأ التكلفة.","oldQNumber":"106","bankIndex":63,"setId":"set3"},{"id":"311","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"D","question":"أي مما يلي هو السبب الأكثر ترجيحًا الذي قد يجعل المؤسسة تقرر إجراء تجزئة الأسهم؟","options":[{"key":"A","letter":"أ","text":"للحفاظ على ثبات سعر السهم."},{"key":"B","letter":"ب","text":"للحفاظ على ثبات حقوق المساهمين."},{"key":"C","letter":"ج","text":"لزيادة حقوق المساهمين."},{"key":"D","letter":"د","text":"لتعزيز سيولة الأسهم."}],"explanation":"أ. خطأ لأنه تجزئة الأسهم لا تهدف للحفاظ على ثبات سعر السهم بل لخفضه وجعله أكثر قابلية للتداول.\n\nب. خطأ لأن حقوق المساهمين لا تتغير نتيجة تجزئة الأسهم.\n\nج. خطأ لأن تجزئة الأسهم لا تزيد حقوق المساهمين بل تعيد توزيعها فقط.\n\nد. صحيح لأنه الهدف الأساسي من تجزئة الأسهم هو زيادة سيولة التداول عبر جعل سعر السهم أقل وأسهل للشراء والبيع.","oldQNumber":"111","bankIndex":64,"setId":"set3"},{"id":"316","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"D","question":"أي مما يلي يوضع بشكل أكثر ملاءمة لوضع قسم التمويل في ميزانية التدفق النقدي للمؤسسة؟","options":[{"key":"A","letter":"أ","text":"التحصيل من العملاء"},{"key":"B","letter":"ب","text":"بيع الأوراق المالية."},{"key":"C","letter":"ج","text":"شراء شاحنات."},{"key":"D","letter":"د","text":"سداد الديون بما في ذلك الفوائد."}],"explanation":"أ. خطأ لأنه يرتبط بالنشاط التشغيلي (تحصيل من العملاء).\n\nب. خطأ لأنه يرتبط بالنشاط الاستثماري (بيع أوراق مالية).\n\nج. خطأ لأنه يرتبط بالنشاط الاستثماري (شراء أصول مثل الشاحنات).\n\nد. صحيح لأنه يمثل تدفقًا نقديًا من الأنشطة التمويلية مثل سداد القروض والفوائد.","oldQNumber":"116","bankIndex":65,"setId":"set3"},{"id":"321","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"B","question":"أي من القوائم التالية يصف بشكل أفضل تصنيف تكاليف التصنيع؟","options":[{"key":"A","letter":"أ","text":"المواد المباشرة، المواد غير المباشرة، المواد الخام."},{"key":"B","letter":"ب","text":"تكاليف التشغيل غير المباشرة، العمالة المباشرة، المواد المباشرة."},{"key":"C","letter":"ج","text":"المواد المباشرة، العمالة المباشرة، الاستهلاك على مباني المصنع."},{"key":"D","letter":"د","text":"المواد الخام، أجور عمال المصنع، مصروفات بيع الإنتاج."}],"explanation":"أ. خطأ لأنه يخلط بين أنواع المواد ولا يمثل التصنيف الأساسي لتكاليف التصنيع.\n\nب. صحيح لأنه يشمل العناصر الرئيسية لتكاليف التصنيع: المواد المباشرة، العمالة المباشرة، والتكاليف غير المباشرة (التصنيع).\n\nج. خطأ لأنه ناقص ولا يتضمن جميع عناصر تكاليف التصنيع بشكل كامل.\n\nد. خطأ لأنه يخلط بين تكاليف التصنيع وتكاليف البيع.","oldQNumber":"121","bankIndex":66,"setId":"set3"},{"id":"326","form":"form1","formTitle":"Group 1","lesson":"ج- المالية","answer":"C","question":"أي مما يلي سيحدده أسلوب الاسترداد النقدي؟","options":[{"key":"A","letter":"أ","text":"الفترة الزمنية المطلوبة لإجراء استثمار رأسمالي آخر من التدفق النقدي السنوي للاستثمار الأولي."},{"key":"B","letter":"ب","text":"الفترة الزمنية اللازمة لتحقيق ربح من الاستثمار الرأسمالي من خلال التدفق النقدي السنوي."},{"key":"C","letter":"ج","text":"الفترة الزمنية اللازمة لاسترداد تكلفة استثمار رأس المال من التدفق النقدي السنوي."},{"key":"D","letter":"د","text":"الفترة الزمنية اللازمة لسداد الالتزامات الخاصة بالاستثمار الرأسمالي من التدفق النقدي السنوي."}],"explanation":"أ. خطأ لأنه لا يقيس زمن إعادة الاستثمار بل استرداد التكلفة.\n\nب. خطأ لأنه لا يعتمد على تحقيق الربح بل على استرداد التكلفة فقط.\n\nج. صحيح لأنه أسلوب الاسترداد النقدي يقيس الوقت اللازم لاسترجاع قيمة الاستثمار من التدفقات النقدية.\n\nد. خطأ لأنه لا يرتبط بسداد الالتزامات بل باسترداد الاستثمار.","oldQNumber":"126","bankIndex":67,"setId":"set3"},{"id":"331","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"B","question":"وفقًا لنظرية دوافع عاملين هيرزبيرج، أي من العوامل التالية يتم ذكرها كثيرًا من قبل الموظفين الراضين؟","options":[{"key":"A","letter":"أ","text":"الراتب والمكانة الاجتماعية."},{"key":"B","letter":"ب","text":"المسؤولية والتقدم الوظيفي."},{"key":"C","letter":"ج","text":"ظروف العمل والأمان."},{"key":"D","letter":"د","text":"العلاقات مع الزملاء والحياة الشخصية."}],"explanation":"أ. خطأ لأنه الراتب والمكانة الاجتماعية تُعد من عوامل النظافة التي تمنع عدم الرضا ولا تُعد من العوامل المحفزة للرضا.\n\nب. صحيح لأنه المسؤولية والتقدم الوظيفي من عوامل التحفيز (Motivators) التي ترتبط بالرضا الوظيفي.\n\nج. خطأ لأنه ظروف العمل والأمان تُصنف ضمن عوامل النظافة وليس التحفيز.\n\nد. خطأ لأنه العلاقات مع الزملاء والحياة الشخصية من عوامل النظافة الاجتماعية وليست من محفزات الرضا.","oldQNumber":"1","bankIndex":68,"setId":"set4"},{"id":"336","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"C","question":"أي من العبارات التالية صحيحة بخصوص أسلوب الإدارة بالأهداف؟","options":[{"key":"A","letter":"أ","text":"تُعد الإدارة بالأهداف أكثر فائدة في المنظمات التي تشهد تغيرات سريعة."},{"key":"B","letter":"ب","text":"تُعد الإدارة بالأهداف أكثر فائدة في المنظمات الميكانيكية ذات المهام المحددة بصرامة."},{"key":"C","letter":"ج","text":"تساعد الإدارة بالأهداف المنظمات على الحفاظ على تحفيز الموظفين."},{"key":"D","letter":"د","text":"تساعد الإدارة بالأهداف المنظمات على التمييز بوضوح بين الأهداف الاستراتيجية والأهداف التشغيلية."}],"explanation":"أ. خطأ لأنه الإدارة بالأهداف تكون أكثر فعالية في البيئات المستقرة وليس في التغيرات السريعة.\n\nب. خطأ لأنه هذا الأسلوب لا يناسب المنظمات الميكانيكية ذات المهام الصارمة.\n\nج. صحيح لأنه الإدارة بالأهداف تعزز مشاركة الموظفين وتحديد أهداف واضحة مما يزيد التحفيز.\n\nد. خطأ لأنه التمييز بين الأهداف الاستراتيجية والتشغيلية ليس الهدف الأساسي المباشر للإدارة بالأهداف.","oldQNumber":"6","bankIndex":69,"setId":"set4"},{"id":"341","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي مرحلة من مراحل تطور المجموعة تتميز بانخفاض الصراع والعداء بين أعضاء المجموعة وزيادة التماسك؟","options":[{"key":"A","letter":"أ","text":"مرحلة التشكيل."},{"key":"B","letter":"ب","text":"مرحلة وضع المعايير (التوافق)."},{"key":"C","letter":"ج","text":"مرحلة الأداء."},{"key":"D","letter":"د","text":"مرحلة العصف."}],"explanation":"أ. خطأ لأنه مرحلة تعارف وفيها غموض.\n\nب. صحيح لأنه يقل فيها الصراع وتزداد القواعد والانسجام بين الأعضاء.\n\nج. خطأ لأنه مرحلة تنفيذ العمل وليست مرحلة تقليل الصراع.\n\nد. خطأ لأنه مرحلة فيها صراع وخلافات عالية بين الأعضاء.","oldQNumber":"11","bankIndex":70,"setId":"set4"},{"id":"346","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"A","question":"لقد وضعت إدارة إحدى المؤسسات مؤشرات أداء رئيسية لجميع المدفوعات التي تم إجراؤها، وقد كشفت عينة من المدققين الداخليين أن 88% فقط من مجموع المدفوعات تم إجراؤها في الموعد المحدد. بناءً على هذه النتيجة، أي من الأسئلة يجب طرحها من قبل المدقق الداخلي على الإدارة؟","options":[{"key":"A","letter":"أ","text":"ما النسبة المتوقعة المقبولة التي حددتها الإدارة؟"},{"key":"B","letter":"ب","text":"هل يتتبع مؤشر الأداء الرئيسي الموردين الذين لديهم عناوين مختلفة؟"},{"key":"C","letter":"ج","text":"هل يوفر مؤشر الأداء الرئيسي معلومات حول المدفوعات المكررة؟"},{"key":"D","letter":"د","text":"هل تم دفع مستحقات الموردين ضمن تاريخ استحقاق الخصم؟"}],"explanation":"أ. صحيح لأنه لا يمكن تقييم أداء نسبة 88% دون معرفة الهدف أو المعيار المقبول الذي وضعته الإدارة.\n\nب. خطأ لأنه تتبع عناوين الموردين ليس مرتبطًا مباشرة بتقييم مؤشر الأداء المحدد هنا.\n\nج. خطأ لأنه المدفوعات المكررة ليست موضوع المؤشر المذكور (الالتزام بالوقت).\n\nد. خطأ لأنه خصم السداد يتعلق بشروط الدفع وليس تقييم الالتزام بالموعد المستهدف في KPI.","oldQNumber":"16","bankIndex":71,"setId":"set4"},{"id":"351","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"D","question":"يختلف نهج بطاقة الأداء المتوازن عن مناهج قياس الأداء التقليدية لأنه يأخذ بالاعتبار المقاييس التالية؟\n\n١. التدابير المالية\n\n٢. إجراءات عمليات الأعمال الداخلية\n\n٣. مقاييس رضا العملاء\n\n٤. تدابير الابتكار والتعلم","options":[{"key":"A","letter":"أ","text":"2 و 4 فقط"},{"key":"B","letter":"ب","text":"3 و 4 فقط"},{"key":"C","letter":"ج","text":"1 فقط"},{"key":"D","letter":"د","text":"2 و 3 و 4 فقط"}],"explanation":"١ - خطأ لأنه التدابير المالية موجودة أيضًا في الأساليب التقليدية لقياس الأداء، وليست ما يميز بطاقة الأداء المتوازن.\n٢- صحيح لأنه بطاقة الأداء المتوازن تهتم بقياس كفاءة وفعالية العمليات الداخلية ضمن المنظمة.\n٣- صحيح لأنه من أبعادها الأساسية قياس رضا العملاء وفهم مستوى الخدمة المقدمة لهم.\n٤- صحيح لأنه تركز أيضًا على الابتكار والتعلم والنمو كأبعاد مستقبلية للأداء المستدام.","oldQNumber":"21","bankIndex":72,"setId":"set4"},{"id":"356","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"C","question":"تستخدم إحدى المنظمات طريقة الإدارة بالأهداف حيث يعتمد أداء الموظفين على أهداف محددة. أي من العبارات التالية صحيحة فيما يتعلق بهذا النهج؟","options":[{"key":"A","letter":"أ","text":"إنه مفيد بشكل خاص للإدارة عندما تواجه المنظمة تغيرًا سريعًا."},{"key":"B","letter":"ب","text":"إنه نهج أكثر نجاحًا عند اعتماده من قبل المنظمات الآلية."},{"key":"C","letter":"ج","text":"يكون أكثر نجاحًا عندما يتم تحديد الأهداف ليس فقط من قبل الإدارة، ولكن أيضًا من قبل جميع أعضاء الفريق، بما في ذلك الموظفين ذوي المستويات الدنيا."},{"key":"D","letter":"د","text":"إنه ناجح بشكل خاص في البيئات التي يميل فيها إلى وجود علاقات سيئة بين صاحب العمل والموظف."}],"explanation":"أ. خطأ لأنه الإدارة بالأهداف تكون أكثر فعالية في البيئات المستقرة نسبيًا وليس في حالات التغير السريع.\n\nب. خطأ لأنه هذا النهج يناسب المنظمات المرنة أكثر من المنظمات الآلية الصارمة.\n\nج. صحيح لأنه مشاركة الموظفين في تحديد الأهداف يزيد الالتزام والتحفيز ويؤدي إلى نجاح أكبر للإدارة بالأهداف.\n\nد. خطأ لأنه العلاقات السيئة بين الإدارة والموظفين تقلل نجاح هذا النهج وليس تعززه.","oldQNumber":"26","bankIndex":73,"setId":"set4"},{"id":"361","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"D","question":"تبنى المدير التنفيذي للمراجعة الداخلية (CAE) نهج إدارة الجودة الشاملة لتحسين عمليات نشاط المراجعة الداخلية (IIA). ويرغب في تقليل وقت إكمال المراجعات وتحسين تقييمات العملاء لـ IAA. أي من أساليب التوظيف التالية من المرجح أن يختارها CAE؟","options":[{"key":"A","letter":"أ","text":"تعيين فريق بمدير تدقيق مدرب لتخطيط كل مراجعة وتوزيع مهام العمل الميداني على مختلف مدققي الموظفين."},{"key":"B","letter":"ب","text":"تعيين فريق من الأفراد لديهم تخصصات مختلفة في كل مراجعة وتمكين أعضاء الفريق من المشاركة الكاملة في القرارات الرئيسية."},{"key":"C","letter":"ج","text":"تعيين فريق لكل مراجعة، وتعيين شخص واحد مسؤولاً عن كل مرحلة من المراجعة، وتحديد اتخاذ القرارات خارج نطاق مسؤوليتهم."},{"key":"D","letter":"د","text":"تعيين فريق من الأفراد لديهم تخصصات مماثلة لمهام محددة تستفيد من تلك التخصصات وتقييد القرارات الرئيسية على الشخص الأعلى."}],"explanation":"أ. خطأ لأنه رغم وجود تخطيط وتوزيع مهام، إلا أنه لا يركز على توحيد التخصصات وتقليل الهدر بشكل واضح ضمن نهج الجودة الشاملة.\n\nب. خطأ لأنه إشراك الجميع في جميع القرارات قد يزيد الوقت ويقلل الكفاءة بدل تقليل وقت المراجعات.\n\nج. خطأ لأنه تقسيم المراجعة إلى مراحل منفصلة مع تقليل صلاحيات الأفراد قد يبطئ العملية ويزيد التعقيد.\n\nد. صحيح لأنه التركيز على تخصصات محددة وتقليل التدخل في القرارات التشغيلية يساعد على رفع الكفاءة وتقليل وقت إنجاز المراجعات وتحسين الجودة.","oldQNumber":"31","bankIndex":74,"setId":"set4"},{"id":"366","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"C","question":"يتكون فريق المشروع من محاسبين ومهندسين وموظفي تسويق، يقدم كل عضو في الفريق تقاريره بانتظام مباشرة إلى مديريهم الوظيفيين، ويتمثل الدور الأساسي لمدير المشروع في ضمان تسليم هذه المجموعات الوظيفية لأهداف المشروع. أي مما يلي يميز بشكل أفضل هيكل فريق المشروع؟","options":[{"key":"A","letter":"أ","text":"هيكل المشروع"},{"key":"B","letter":"ب","text":"هيكل مركب"},{"key":"C","letter":"ج","text":"هيكل المصفوفة"},{"key":"D","letter":"د","text":"هيكل وظيفي"}],"explanation":"أ. خطأ لأنه هيكل المشروع يكون فيه الفريق تابعًا بالكامل لمدير المشروع وليس للمديرين الوظيفيين.\n\nب. خطأ لأنه الهيكل المركب ليس الوصف الدقيق لوجود تقارير مزدوجة بين المدير الوظيفي ومدير المشروع.\n\nج. صحيح لأنه الهيكل المصفوفي يتميز بوجود تبعية مزدوجة للموظفين لكل من المدير الوظيفي ومدير المشروع.\n\nد. خطأ لأنه الهيكل الوظيفي يعتمد على التقسيم حسب الوظائف فقط دون وجود مدير مشروع مستقل.","oldQNumber":"36","bankIndex":75,"setId":"set4"},{"id":"371","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي من العبارات التالية صحيحة فيما يتعلق باستخدام السلطة المركزية لحكم منظمة؟","options":[{"key":"A","letter":"أ","text":"الاحتيال المرتكب من خلال التواطؤ أكثر احتمالًا عندما تكون السلطة مركزية."},{"key":"B","letter":"ب","text":"تعزز السلطة الإدارية المركزية عادة اليقين والاتساق داخل المنظمة."},{"key":"C","letter":"ج","text":"عندما تكون السلطة مركزية، عادة ما يقل توافق الأنشطة لتحقيق أهداف العمل."},{"key":"D","letter":"د","text":"لا يتم تقليل استخدام الفصل بين الواجبات لتخفيف التواطؤ إلا عندما تكون السلطة مركزية."}],"explanation":"أ. خطأ لأنه المركزية غالبًا تقلل التواطؤ بسبب وضوح الرقابة والتركيز، وليس زيادته بشكل عام.\n\nب. صحيح لأنه السلطة المركزية تعزز توحيد القرار والسياسات مما يزيد من الاتساق واليقين داخل المنظمة.\n\nج. خطأ لأنه المركزية عادة تزيد الاتساق والتوافق في الأنشطة مع أهداف المنظمة وليس العكس.\n\nد. خطأ لأنه الفصل بين الواجبات يُستخدم في جميع الهياكل التنظيمية وليس فقط في المركزية.","oldQNumber":"41","bankIndex":76,"setId":"set4"},{"id":"376","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"D","question":"ما هي العلاقة بين المركزية ودرجة وأهمية ونطاق اتخاذ القرارات على المستوى الأدنى؟","options":[{"key":"A","letter":"أ","text":"علاقة حصرية متبادلة."},{"key":"B","letter":"ب","text":"علاقة مباشرة."},{"key":"C","letter":"ج","text":"علاقة جوهرية."},{"key":"D","letter":"د","text":"علاقة عكسية."}],"explanation":"أ. خطأ لأنه ليست علاقة حصرية متبادلة بين المركزية واتخاذ القرار في المستويات الأدنى.\n\nب. خطأ لأنه كلما زادت المركزية تقل صلاحيات المستويات الأدنى، وليس العكس.\n\nج. خطأ لأنه مصطلح غير دقيق لوصف العلاقة بين المركزية واتخاذ القرار.\n\nد. صحيح لأنه كلما زادت المركزية يقل نطاق وأهمية القرارات المتخذة في المستويات الأدنى.","oldQNumber":"46","bankIndex":77,"setId":"set4"},{"id":"381","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"D","question":"ما هي أفضل طريقة لجمع معلومات حول رضا الموظفين عن وظائفهم؟","options":[{"key":"A","letter":"أ","text":"إجراء استطلاعات عبر الإنترنت يتم إرسالها عشوائيًا إلى الموظفين."},{"key":"B","letter":"ب","text":"الملاحظات المباشرة في الموقع للموظفين."},{"key":"C","letter":"ج","text":"اجتماعات قاعة المدينة مع الموظفين."},{"key":"D","letter":"د","text":"إجراء مقابلات وجهًا لوجه مع الموظفين."}],"explanation":"أ. خطأ لأنه قد توفر الاستطلاعات معلومات مفيدة، لكنها لا تسمح بالتعمق في الإجابات أو طرح أسئلة متابعة.\n\nب. خطأ لأنه يمكن من خلالها ملاحظة السلوك، لكنها لا تكشف بشكل مباشر عن مستوى رضا الموظفين.\n\nج. خطأ لأنه قد لا يشعر جميع الموظفين بالراحة للتعبير عن آرائهم الحقيقية في الاجتماعات الجماعية.\n\nد. صحيح لأنه تتيح المقابلات وجهًا لوجه الحصول على معلومات تفصيلية وفهم أعمق لمستوى رضا الموظفين وأسبابه.","oldQNumber":"51","bankIndex":78,"setId":"set4"},{"id":"386","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"B","question":"أي من عناصر التحكم التالية تمكن الإدارة من تلقي ملاحظات في الوقت المناسب وتساعد في التخفيف من المخاطر غير المتوقعة؟","options":[{"key":"A","letter":"أ","text":"قياس أداء المنتج مقابل معيار ثابت."},{"key":"B","letter":"ب","text":"تطوير طرق قياسية لأداء أنشطة راسخة."},{"key":"C","letter":"ج","text":"يتطلب تجميع الأنشطة تحت إدارة واحدة."},{"key":"D","letter":"د","text":"تكليف كل موظف بعمل مناسب."}],"explanation":"أ. خطأ لأنه قياس الأداء مقابل معيار ثابت يركز على التقييم بعد التنفيذ ولا يضمن بالضرورة التغذية الراجعة في الوقت المناسب للتخفيف من المخاطر.\n\nب. صحيح لأنه تطوير طرق قياسية لأداء الأنشطة يساعد على تقليل التباين، ويوفر رقابة مستمرة وتغذية راجعة مبكرة تساعد في إدارة المخاطر.\n\nج. خطأ لأنه تجميع الأنشطة تحت إدارة واحدة يتعلق بالهيكل التنظيمي وليس بأساليب الرقابة أو التغذية الراجعة.\n\nد. خطأ لأنه تكليف الموظفين بالمهام يتعلق بالتوزيع الوظيفي وليس بنظام رقابة يوفر معلومات فورية عن المخاطر.","oldQNumber":"56","bankIndex":79,"setId":"set4"},{"id":"391","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"A","question":"أي مما يلي يمكن أن يوجد على الأرجح في منظمة تستخدم هيكلًا تنظيميًا لا مركزيًا؟","options":[{"key":"A","letter":"أ","text":"يوجد اعتماد أكبر على الثقافة التنظيمية."},{"key":"B","letter":"ب","text":"هناك توقعات واضحة موضوعة للموظفين."},{"key":"C","letter":"ج","text":"هناك تقنيات مراقبة إلكترونية مستخدمة."},{"key":"D","letter":"د","text":"هناك مدونة محددة لسلوك الموظفين."}],"explanation":"أ. صحيح لأنه في الهيكل اللامركزي يقل الاعتماد على الرقابة المباشرة ويزداد الاعتماد على الثقافة التنظيمية لتوجيه سلوك الموظفين.\n\nب. خطأ لأنه التوقعات الصارمة والواضحة ترتبط أكثر بالهياكل المركزية.\n\nج. خطأ لأنه استخدام المراقبة الإلكترونية المكثفة يرتبط بالرقابة المركزية وليس اللامركزية.\n\nد. خطأ لأنه وجود مدونة سلوك صارمة يعكس تحكمًا مركزيًا أكبر وليس لامركزية.","oldQNumber":"61","bankIndex":80,"setId":"set4"},{"id":"396","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"B","question":"اختارت منظمة إستراتيجية التمايز للمنافسة على المستوى التجاري. أي من الهياكل التنظيمي التالية يناسب هذا الاختيار الاستراتيجي بشكل أفضل؟","options":[{"key":"A","letter":"أ","text":"الهيكل الوظيفي."},{"key":"B","letter":"ب","text":"الهيكل التقسيمي ( الاقسام ) ."},{"key":"C","letter":"ج","text":"الهيكل الآلي."},{"key":"D","letter":"د","text":"الهيكل الوظيفي مع فرق متعددة الوظائف."}],"explanation":"أ. خطأ لأنه الهيكل الوظيفي مناسب أكثر للمنظمات التي تركز على الكفاءة الداخلية وليس التمايز.\n\nب. صحيح لأنه الهيكل التقسيمي يدعم إستراتيجية التمايز من خلال المرونة والتركيز على المنتجات أو الأسواق المختلفة.\n\nج. خطأ لأنه الهيكل الآلي مناسب للبيئات المستقرة والمهام الروتينية وليس التمايز.\n\nد. خطأ لأنه رغم أن الفرق متعددة الوظائف مفيدة، إلا أن الهيكل التقسيمي هو الأنسب بشكل عام لاستراتيجية التمايز.","oldQNumber":"66","bankIndex":81,"setId":"set4"},{"id":"401","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"C","question":"ما هي إحدى مزايا الهيكل التنظيمي اللامركزي، على عكس الهيكل المركزي؟","options":[{"key":"A","letter":"أ","text":"فعالية من حيث التكلفة أكثر"},{"key":"B","letter":"ب","text":"زيادة وفورات الحجم"},{"key":"C","letter":"ج","text":"مجموعة مواهب أكبر."},{"key":"D","letter":"د","text":"ضوابط داخلية قوية"}],"explanation":"أ. خطأ لأنه الهيكل اللامركزي لا يُعد بالضرورة أكثر فعالية من حيث التكلفة مقارنة بالمركزي.\n\nب. خطأ لأنه وفورات الحجم ترتبط غالبًا بالهيكل المركزي وليس اللامركزي.\n\nج. صحيح لأنه الهيكل اللامركزي يتيح تفويض الصلاحيات وبالتالي الاستفادة من مجموعة أوسع من المهارات والخبرات على مستويات مختلفة.\n\nد. خطأ لأنه الضوابط الداخلية القوية ترتبط أكثر بالهيكل المركزي وليس اللامركزي.","oldQNumber":"71","bankIndex":82,"setId":"set4"},{"id":"406","form":"form1","formTitle":"Group 1","lesson":"د- الهياكل و التحفيز","answer":"A","question":"ما علاقة اللامركزية بالرقابة والمتابعة؟","options":[{"key":"A","letter":"أ","text":"علاقة عكسية"},{"key":"B","letter":"ب","text":"مباشرة"},{"key":"C","letter":"ج","text":"لا علاقة بينهما"},{"key":"D","letter":"د","text":"ثابتة"}],"explanation":"أ- صحيحة: لأن زيادة اللامركزية تؤدي إلى توزيع السلطات واتساع نطاق الإشراف، مما يجعل الرقابة والمتابعة المباشرة أكثر صعوبة.\n\nب- خاطئة: لأن اللامركزية لا تزيد مستوى الرقابة المباشرة، بل تقللها.\n\nج- خاطئة: لأن هناك علاقة واضحة بين اللامركزية ومستوى الرقابة.د\n\nد- خاطئة: لأن العلاقة ليست ثابتة، بل تتغير حسب درجة اللامركزية في المنظمة.","oldQNumber":"76","bankIndex":83,"setId":"set4"},{"id":"413","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"أي مما يلي سيوفر تأكيدًا معقولًا أن النسخ الاحتياطي لتطبيق ما سيتم استعادته بنجاح في حال وقوع كارثة؟","options":[{"key":"A","letter":"أ","text":"يتم تخزين أشرطة النسخ الاحتياطي خارج الموقع"},{"key":"B","letter":"ب","text":"يتم إجراء النسخ الاحتياطي بشكل منتظم على أساس أسبوعي"},{"key":"C","letter":"ج","text":"يتم إجراء اختبار منتظم لإجراءات الاستعادة والنسخ الاحتياطي"},{"key":"D","letter":"د","text":"يتم تخزين النسخ الاحتياطية في الخادم"}],"explanation":"أ. خطأ لأن التخزين خارج الموقع يقلل المخاطر لكنه لا يضمن إمكانية الاستعادة الفعلية.\n\nب. خطأ لأن انتظام النسخ الاحتياطي لا يثبت أنه يمكن استعادته بنجاح.\n\nج. صحيح لأن اختبار الاستعادة بشكل دوري هو الدليل الحقيقي على أن النسخ الاحتياطية يمكن استرجاعها بنجاح عند الحاجة.\n\nد. خطأ لأن تخزين النسخ على الخادم يعرضها لمخاطر الفقدان ولا يضمن إمكانية الاستعادة.","oldQNumber":"3","bankIndex":84,"setId":"set5"},{"id":"418","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"D","question":"قامت مؤسسة بالترقية إلى برنامج محاسبة جديد. أي من الأنشطة التالية يجب أن يقوم بها بائع برامج تكنولوجيا المعلومات فور الترقية؟","options":[{"key":"A","letter":"أ","text":"تحليل السوق لتحديد الاتجاهات."},{"key":"B","letter":"ب","text":"خدمات إدارة البنية التحتية لتكنولوجيا المعلومات وصيانتها."},{"key":"C","letter":"ج","text":"النسخ الاحتياطي والاستعادة."},{"key":"D","letter":"د","text":"اختبار والتحقق من صحة البرامج."}],"explanation":"أ. خطأ لأنه لا يرتبط مباشرة بالتأكد من نجاح ترقية البرنامج.\n\nب. خطأ لأنه يتعلق بإدارة وتشغيل البنية التحتية، وليس بالتحقق من سلامة الترقية.\n\nج. خطأ لأنه يُستخدم لحماية البيانات واستعادتها، وعادةً يتم قبل الترقية أو عند الحاجة.\n\nد. صحيح لأنه يجب التأكد بعد الترقية من أن البرنامج يعمل بشكل صحيح وأن جميع الوظائف والبيانات سليمة.","oldQNumber":"8","bankIndex":85,"setId":"set5"},{"id":"423","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"A","question":"عند فحص الخطة الاستراتيجية للمؤسسة، يجب أن يتوقع المدقق الداخلي العثور على أي من المكونات التالية؟","options":[{"key":"A","letter":"أ","text":"تحديد الأهداف والجدول الزمني القابل للتحقيق."},{"key":"B","letter":"ب","text":"تحليل بيئة المنافسة."},{"key":"C","letter":"ج","text":"خطة لتوفير الموارد."},{"key":"D","letter":"د","text":"خطة لإعداد التقارير والإشراف على التقدم."}],"explanation":"أ. صحيح لأنه يمثل عنصرًا أساسيًا في أي خطة استراتيجية يحدد ما تريد المؤسسة تحقيقه ومتى.\n\nب. خطأ لأنه جزء من التحليل الاستراتيجي وليس بالضرورة مكونًا مباشرًا للخطة الاستراتيجية نفسها.\n\nج. خطأ لأنه يتعلق بالتخطيط التشغيلي للموارد وليس بالمحتوى الأساسي للاستراتيجية.\n\nد. خطأ لأنه يرتبط بمتابعة الأداء وليس بتحديد عناصر الخطة الاستراتيجية الأساسية.","oldQNumber":"13","bankIndex":86,"setId":"set5"},{"id":"428","form":"form1","formTitle":"Group 1","lesson":"هـ- المشاريع والتخطيط","answer":"C","question":"قرر مجلس إدارة إحدى المؤسسات أن عقد الاستعانة بمصادر خارجية لم يتم إعداده وإدارته بما يتماشى مع أهداف المؤسسة. ما هو نوع المخاطر التي يمثلها هذا؟","options":[{"key":"A","letter":"أ","text":"مخاطر جدوى"},{"key":"B","letter":"ب","text":"مخاطر معاملات"},{"key":"C","letter":"ج","text":"مخاطر استراتيجية"},{"key":"D","letter":"د","text":"مخاطر تشغيلية"}],"explanation":"أ. خطأ لأن مخاطر الجدوى تتعلق بمدى قابلية المشروع للتنفيذ وليس توافقه مع أهداف المؤسسة.\n\nب. خطأ لأن
